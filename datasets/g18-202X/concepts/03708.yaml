  definition:
  - content: 'instruments in which the test sample is supplied to the device automatically, the indication being displayed or printed'
  id: 03708-eng
  language_code: eng
  notes:
  - content: 'Note: Type I refractometers shall be equipped with: an automatic temperature correction device; a primary indicating device (“primary” means a device that can be seen by all interested parties simultaneously); a zero-setting device or a device for calibration (adjustment) at another scale point; a zero-checking device; anautomatic cleaning device.'
