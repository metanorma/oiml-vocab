  definition:
  - content: 'set of electronic and/or paper records that provide for a complete examination of measured variables, parameter settings and calculation results to check the accuracy of a measurement and any necessary corrections'
  id: 02061-eng
  language_code: eng
  notes:
  - content: 'Note: The required records may include volumes at metering conditions, pressures, temperatures and calorific values, conversion equation specification and parameters, volumes and energy at base conditions, calibration datum, and alarm logs.'
