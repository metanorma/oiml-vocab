  definition:
  - content: 'part or device, other than an ancillary device, required to ensure correct measurement or intended to facilitate the measuring operations, or which could in any way affect the measurement Examples of additional devices: manifold; sampling device; gas indicator; sight glass; filter, pump; gas elimination device; device used for the transfer point; anti-swirl device; branches or bypasses; valves, hoses.'
