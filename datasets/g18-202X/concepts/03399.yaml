data:
  dates:
  - date: '2026-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: 'identifiable group of measuring instruments belonging to the same manufactures type within the same category that have the same design features and metrological principles for measurement (for example the same type of indicator, the same type of design of force receptor and force transmitting device) but which may differ in some metrological and technical performance characteristic (e.g. Max, Min, d, accuracy calss, etc.) [Adapted from VIML:2013, 4.02 – examples added]'
  id: 03399-eng
  language_code: eng
  notes:
  - content: 'The concept of family primarily aims to reduce the test effort during type examination. It does not preclude the possibility of listing more than one family in one certificate.'
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: 'family of measuring instruments'
