  definition:
  - content: '(hereinafter referred to as “measuring instrument”): measuring instrument which conforms to prescribed requirements, in particular legal metrological requirements'
    sources:
    - type: authoritative
      status: identical
      origin:
        ref:
          source: 'OIML V 1:2000'
          id: '4.3'
  id: 00185-eng
  language_code: eng
  notes:
  - content: 'Note: For the purposes of this Document the following instruments may fall under legal control according to national regulations: measuring instruments, coin countingmachines, medical measuring instruments, water dispensing machines, timing instruments in vehicle washes.'
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: 'legally controlled measuring instrument'
