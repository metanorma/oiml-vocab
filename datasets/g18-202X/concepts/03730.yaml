  definition:
  - content: 'condition of measurement, out of a set of conditions that includes different locations, operators, measuring systems, and replicate measurements on the same or similar objects'
  id: 03730-eng
  language_code: eng
  notes:
  - content: Different measuring systems may use different measurement procedures.
  - content: A specification should give the conditions changed and unchanged, to
      the extent practical.
