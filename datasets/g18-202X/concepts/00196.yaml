data:
  dates:
  - date: '2026-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: 'area in which two or more countries have harmonized legislation or established some other legal means, on a national basis, to facilitate free cross-border movement of products and services that are affected by legal metrological control'
  id: 00196-eng
  language_code: eng
  notes:
  - content: 'Note: Such harmonized legislation may rely on conformity assessment procedures where, apart from public authorities, first party bodies (manufacturers) and other private bodies, carry out certain functions as third parties.'
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: 'free trade area'
