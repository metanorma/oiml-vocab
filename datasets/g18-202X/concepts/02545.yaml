  - content: 'force transducer which, after taking into account the effects of the acceleration of gravity and air buoyancy at the location of its use, measures mass by converting the measured quantity (mass) into another measured quantity (output) [OIML R 60:2000 [6]] load cells equipped with electronics containing amplifier and analogue-to-digital conversion (ADC) and data processing (optionally) are called digital load cells'
