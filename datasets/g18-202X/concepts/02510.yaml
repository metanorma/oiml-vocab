  definition:
  - content: 'permitted deficiency in the quantity of product in a prepackage'
  id: 02510-eng
  language_code: eng
  notes:
  - content: 'Note 1: The symbol "T" is used to designate tolerable deficiency.'
  - content: 'Note 2: Tolerable deficiency is sometimes referred to as the tolerable
      negative error, limits of error or tolerances.'
  - content: 'Note 3: By convention T is a positive number but, in use it represents
      a negative value of quantity, or negative error.'
