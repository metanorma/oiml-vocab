  definition:
  - content: |-
      The reduction ratio of a load transmitting device is:

      stem:[R = F_{M} / F_{L}]

      where:

      stem:[F_{M}] = force acting on the load measuring device,

      stem:[F_{L}] = force acting on the load receptor
