  - content: 'report issued by a test laboratory that includes the results of the tests and egsaminations it carried out on the basis of relevant OIML Recommendation during OIML type evaluation on identified sample(s) of given type of measuring instrument or module (OIML B 18, 3.29)'
  id: 03346-eng
  language_code: eng
  notes:
  - content: 'Note: Unless the OIML Recommendation states otherwise, several test reports may be issued if several test laboratories are involved in covering all of the tests and examinations specified in the relevant OIML Recommenadtion.'
