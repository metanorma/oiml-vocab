  definition:
  - content: 'part of metrology related to activities which result from statutory requirements and concern measurement, units of measurement, measuring instruments and methods of measurement and which are performed by competent bodies [VIML 1.2]'
  id: 02254-D016-eng
  language_code: eng
  notes:
  - content: 'Note 1:The scope of legal metrology may be different from country to country. Note 2:The competent bodies responsible for legal metrology activities or part of these activities are usually called legal metrology services.'
