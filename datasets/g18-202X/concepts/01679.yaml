  definition:
  - content: |
      change in measured optical absorbance at the analysis wavelength(s)
      determined as the absolute difference between the pre-irradiation
      absorbance, stem:[A_0], and the post-irradiation absorbance, stem:[A], as
      follows:

      stem:[Delta A = |A - A_0|]
