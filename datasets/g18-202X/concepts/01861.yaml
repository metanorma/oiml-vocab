  definition:
  - content: 'difference between a higher and lower wavelength value at which the value of an optical quantity is reduced to 1/100 of its maximum value between the two wavelengths'
  id: 01861-eng
  language_code: eng
  notes:
  - content: 'Note: The coherent SI unit is the metre (m), but often the nanometre (nm) is used. The optical quantity can be e.g. radiant luminous flux, absorbance, etc.'
