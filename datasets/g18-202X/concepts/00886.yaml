  definition:
  - content: 'non-automatic weighing instrument mounted on or incorporated into a vehicle'
  id: 00886-eng
  language_code: eng
  notes:
  - content: 'Note 1:A vehicle-mounted instrument is a complete weighing instrument which is firmly mounted on a vehicle, and which is designed for that special purpose. Example: Postal scale mounted on a vehicle (mobile post office). Note 2: A vehicle-incorporated instrument uses parts of the vehicle for the weighing instrument. Examples: Garbage weighers, patient lifters, pallet lifters, fork lifters, wheel chair weighers.'
