  definition:
  - content: 'device employing electronic sub-assemblies and performing a specific function. Electronic devices are usually manufactured as separate units and are capable of being tested independently and the note with'
  id: 03024-eng
  language_code: eng
  notes:
  - content: 'Note 1: An electronic device may be a complete measuring instrument (for example: counter scale, electricity meter) or a part of a measuring instrument (for example: printer, indicator). Note 2: An electronic device may be a module in the sense that this term is used in OIML B 3 OIML Basic Certificate System for Measuring Instruments'
