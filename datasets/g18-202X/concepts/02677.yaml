  definition:
  - content: 'smallest difference between displayed indications that can be meaningfully distinguished [VIM 4.15]'
  id: 02677-eng
  language_code: eng
  notes:
  - content: 'Note:For a digital device, this is the change in the indication when the least significant digit changes by one step. For an analogue device, this is half the difference between subsequent scale marks.'
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: 'resolution (of a displaying device)'
