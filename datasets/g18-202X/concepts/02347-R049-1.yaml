  definition:
  - content: 'device intended to perform a specific function, directly involved in elaborating, transmitting or displaying measured values'
  id: 02347-R049-1-eng
  language_code: eng
  notes:
  - content: 'Note 1: Fore the definition of “measures value”, see ISO/IEC Guide 99:2007/OIML V 2-200:2012 (VIM) 2.10, [1]. Note 2: The main ancillary device are: zero-setting device; price-indicationg device; repeating indicating device; printing device; memory device; traffi control device; pre-setting device; self-service device; flow sensor movement detector (for detecting movement of the flow sensor before is clearly visible on the indicationg device; remote or automatic reading device (which may be incorporated permanently or added temporarily). Note 3: Depending on national legislation, ancillary devices may be subject to legal metrological control.'
