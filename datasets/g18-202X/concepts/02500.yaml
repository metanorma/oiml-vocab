  definition:
  - content: 'quantity of product in a prepackage declared on the label'
  id: 02500-eng
  language_code: eng
  notes:
  - content: 'The symbol "Qnom" is used to designate the nominal quantity.'
  - content: 'In some national legislation the nominal quantity of the product is
      referred to as "net quantity", "net contents", "net mass" or "net volume".'
  - content: The nominal quantity should be declared in accordance with OIML R 79
      [1].
