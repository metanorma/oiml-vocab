  definition:
  - content: 'quantity of product in a prepackage declared on the label'
  id: 02500-eng
  language_code: eng
  notes:
  - content: 'Note 1:  The symbol “Qnom” is used to designate the nominal quantity. Note 2:  In some national legislation the nominal quantity of the product is referred to as “net quantity”, “net contents”, “net mass” or “net volume”. Note 3:  The nominal quantity should be declared in accordance with OIML R 79 [1].'
