    type: accepted
  definition:
  - content: 'meter comprising one large meter, one small meter, and a changeover device that, depending on the magnitude of the flow rate (3.3.1) passing through the meter, automatically directs the flow through either the small or the large meter, or both'
  id: 02384-eng
  language_code: eng
  notes:
  - content: 'The meter reading is obtained from two independent totalizers, or from one totalizer which adds up the values from both water meters'
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: 'combination meter'
