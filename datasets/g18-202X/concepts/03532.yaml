  definition:
  - content: 'the measurement cycle of an EBA consists of all steps necessary to obtain a valid result, from starting the measurement, sampling, analysing, internal control procedures, calculation, and displaying the result'
  id: 03532-eng
  language_code: eng
  notes:
  - content: 'Since national authorities may define specific measurement cycles for their country, "standard" refers to the respective country.'
