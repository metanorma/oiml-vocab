  definition:
  - content: 'quantity of the identified product in the prepackage exclusive of packing material'
  id: 02483-eng
  language_code: eng
  notes:
  - content: '''Packing material'' includes wrappers and any other material packed
      with such product. See 2.6, Note 3.'
  - content: This term relates to specifications on a prepackage and does not account
      for the actual quantity in an individual prepackage. For prepackages with constant
      nominal quantity, the procedures for determining whether an inspection lot
      meets regulatory requirements are provided in OIML R 87 [1].
  sources: []
