  definition:
  - content: 'speed meter emitting pulsed or modulated radiation and detecting the range (distance) from the radiation reflected by objects'
  id: 03778-eng
  language_code: eng
  notes:
  - content: '2D and 3D laser scanners and hand-held LIDAR speed meters are examples belonging to this category. LIDAR (Light Detection and Ranging) is a remote sensing method that determines target range and speed based on the time-of-flight of laser light pulses reflected off a target.'
