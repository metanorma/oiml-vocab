    type: accepted
  definition:
  - content: 'conformity assessment procedure focused on the assessment of measuring instruments to give assurance that manufactured (or production) instruments meet approved type'
  id: 02941-eng
  language_code: eng
  notes:
  - content: 'The concept of CTT as considered in this Dokumnet refers to a systematic pre-market conformity assessment procedure applicable to measuring instruments. It should not be confused with ‘market surveillance’ activities, which are sometimes performed as part of a systematic program but often are performed ad-hoc by public authorities based on risk assessment and market intelligence, e.g. user complaints. ‘Market surveillance’ is further discussed in Annex 7.'
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: conformity to type
  - type: abbreviation
    normative_status: preferred
    designation: CTT
