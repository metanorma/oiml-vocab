  definition:
  - content: 'an estimate characterizing the range of values within which the true value of an error lies, including components due to the standard and its use, and components due to the verified or calibrated instrument itself'
  id: 01031-eng
  language_code: eng
  notes:
  - content: 'Note: the components due to a meter verified or calibrated are notably linked to the resolution  of its indicating device and to the periodic variation.'
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: 'uncertainty in the determination of an error'
