    type: accepted
  definition:
  - content: 'a temperature probe is the component of a thermometer of which part is applied to a body cavity or tissue with which it establishes thermal equilibrium. It comprises a temperature sensor with associated parts including coverings, seals, inner leads, and connecting plug, where appropriate'
  id: 01506-eng
  language_code: eng
  notes:
  - content: 'Note 1:  A body cavity may be the rectum, esophagus, or a surgically created cavity. Note 2:  The part of the probe in contact with a body cavity is called the applied part.'
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: 'temperature probe'
