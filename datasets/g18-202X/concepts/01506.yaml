    type: accepted
  definition:
  - content: 'a temperature probe is the component of a thermometer of which part is applied to a body cavity or tissue with which it establishes thermal equilibrium. It comprises a temperature sensor with associated parts including coverings, seals, inner leads, and connecting plug, where appropriate'
  id: 01506-eng
  language_code: eng
  notes:
  - content: A body cavity may be the rectum, esophagus, or a surgically created
      cavity.
  - content: The part of the probe in contact with a body cavity is called the applied
      part.
  sources: []
