  definition:
  - content: 'difference between the indication of a measuring instrument (here a spectrophotometer) and a true value of the corresponding input quantity'
  id: 01866-eng
  language_code: eng
  notes:
  - content: 'Since a true value is indeterminable by nature, a conventional true value, i.e. an assigned value or best estimate of the value is used in practice. For a material measure, the indication is the value assigned to it. [Adapted from VIM:1993, 5.20]'
