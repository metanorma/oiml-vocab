data:
  dates:
  - date: '2026-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: 'measuring instrument used to determine the mass of a body by using the action of gravity on the body'
  id: 02522-eng
  language_code: eng
  notes:
  - content: 'Note: In this Recommendation “mass” (or “weight value”) is preferably used in the sense of “conventional mass” or “conventional value of the result of weighing in air” according to OIML R 111 [5] and OIML D 28 [6], whereas “weight” is preferably used for an embodiment (= material measure) of mass that is regulated in regard to its physical and metrological characteristics. According to its method of operation, a weighing instrument is classified as an automatic or non-automatic instrument.'
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: 'weighing instrument'
