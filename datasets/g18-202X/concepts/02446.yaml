data:
  dates:
  - date: '2026-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: 'extreme value of measurement error, with respect to a known reference quantity value, permitted by specifications or regulations for a given measurement, measuring instrument, or measuring system'
    sources:
    - type: authoritative
      status: identical
      origin:
        ref:
          source: 'OIML V 2-200:2012'
          id: '4.26'
  id: 02446-eng
  language_code: eng
  notes:
  - content: 'Usually the term "maximum permissible errors" or "limits of error"
      are used, where there are two extreme values.'
  - content: 'The term "tolerance" should not be used to designate "maximum permissible
      error".'
  - content: 'Additional note: The MPEs in 4.4.2 of this Recommendation are errors
      associated with a meter in use in the market place. The errors for the OIML
      test procedures are based on 4.4.1.'
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: 'maximum permissible measurement error (MPE) maximum permissible error limit of error'
