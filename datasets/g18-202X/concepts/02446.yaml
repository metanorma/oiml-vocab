  definition:
  - content: 'extreme value of measurement error, with respect to a known reference quantity value, permitted by specifications or regulations for a given measurement, measuring instrument, or measuring system [VIM 4.26]'
  id: 02446-eng
  language_code: eng
  notes:
  - content: 'Note 1: Usually the term “maximum permissible errors” or “limits of error” are used, where there are two extreme values. Note 2: The term “tolerance” should not be used to designate “maximum permissible error”. Additional note: The MPEs in 4.4.2 of this Recommendation are errors associated with a meter in use in the market place. The errors for the OIML test procedures are based on 4.4.1.'
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: 'maximum permissible measurement error (MPE) maximum permissible error limit of error'
