  definition:
  - content: 'stationary speed meter which can be moved to different locations between measurements'
  id: 03775-eng
  language_code: eng
  notes:
  - content: Stationary speed meters installed in a parked vehicle or on a parked
      trailer are also considered as mobile speed meters.
  - content: Portable speed meters which are used hand-held or which are (temporarily)
      installed on a tripod or similar temporary stand to guide the hand of the
      operator for a limited series of measurements are also considered as mobile
      speed meters.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: 'mobile speed meter'
