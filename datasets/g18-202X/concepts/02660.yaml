  definition:
  - content: 'measured quantity value minus a reference quantity value (VIM 2.16)'
  id: 02660-eng
  language_code: eng
  notes:
  - content: 'The presented VIM definition of (measurement) error is often interpreted as the definition for an absolute error. However, when expressing a parameter as a percentage or in dB this definition could also be applied to a relative error. Since in all cases in this document the errors are expressed in relative values it was decided that a separate definition for a relative error is not needed.'
