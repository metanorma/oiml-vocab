data:
  dates:
  - date: '2026-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: 'measured quantity value minus a reference quantity value'
    sources:
    - type: authoritative
      status: identical
      origin:
        ref:
          source: 'OIML V 2-200:2012'
          id: '2.16'
  id: 02447-eng
  language_code: eng
  notes:
  - content: 'The concept of ''measurement error'' can be used both when there is
      a single reference quantity value to refer to, which occurs if a calibration
      is made by means of a measurement standard with a measured quantity value having
      a negligible measurement uncertainty or if a conventional quantity value is
      given, in which case the measurement error is known, and true quantity values
      of negligible range, in which case the measurement error is not known, and
      if a measurand is supposed to be represented by a unique true quantity value
      or a set of true quality values of negligible range, in which case the measurement
      error is not known.'
  - content: Measurement error should not be confused with production error or mistake.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: measurement error
  - type: expression
    normative_status: admitted
    designation: error of measurement
  - type: expression
    normative_status: admitted
    designation: error
