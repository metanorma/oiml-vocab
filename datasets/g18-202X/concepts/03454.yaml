    type: accepted
  definition:
  - content: 'Closeness of agreement between the results of successive measurements of the same sample using the same instrument, under the same defined conditions of use, and within a relatively short period of time.'
  id: 03454-eng
  language_code: eng
  notes:
  - content: 'Note:  The same defined conditions would include the following: method of measurement, the measuring instrument, the operator, the location and the ambient environmental conditions.'
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: 'repeatability'
