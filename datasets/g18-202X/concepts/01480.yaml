data:
  dates:
  - date: '2026-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: |
      a measure of variation in the detector signal; it can be divided into
      three components:

      * short-term noise includes all observable random variations of the
      detector signal having a frequency of the order of stem:[10^{-2} "Hz"] to
      stem:[10^{-1} "Hz"] (one or more cycles per minute) and should be measured
      peak to peak

      * long-term noise includes all observable random variations of the
      detector signal with frequencies between stem:[10^{-1} "Hz"] and stem:[1
      "Hz"]

      * drift is the average slope of the baseline signal measured over a
      minimum period of one-half hour.

  examples: []
  id: '01480-eng'
  notes:
  - content: |
      Although long-term noise can occur at any time during an analysis, it can
      be mistaken for a late-eluting peak. Earlier eluting peaks are usually
      sharper and less easily confused with long-term noise.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: 'noise'
