data:
  dates:
  - date: '2026-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: 'set of operations that establish, under specified conditions, the relationship between values of quantities indicated by a measuring instrument or measuring system, or values represented by a material measure or a reference material, and the corresponding values realized by standards'
    sources:
    - type: authoritative
      status: identical
      origin:
        ref:
          source: 'OIML V 2:1993'
          id: '6.11'
  id: 01876-eng
  language_code: eng
  notes:
  - content: 'Note 1:  The result of a calibration permits either the assignment of values of measurands to the indications or the determination of corrections with respect to indications. Note 2:  A calibration may also determine other metrological properties such as the effect of influence quantities. Note 3: The result of a calibration may be recorded in a document, sometimes called a calibration certificate or a calibration report.'
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: 'calibration'
