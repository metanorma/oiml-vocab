data:
  dates:
  - date: '2026-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: 'closeness of agreement between a measured quantity value and a true quantity value of a measurand'
    sources:
    - type: authoritative
      status: identical
      origin:
        ref:
          source: 'OIML V 2-200:2012'
          id: '2.13'
  id: 02782-eng
  language_code: eng
  notes:
  - content: 'The concept ''measurement accuracy'' is not a quantity and is not
      given a numerical quantity value. A measurement is said to be more accurate
      when it offers a smaller measurement error.'
  - content: 'The term "measurement accuracy" should not be used for measurement
      trueness and the term "measurement precision" should not be used for ''measurement
      accuracy'', which, however, is related to both these concepts.'
  - content: '''Measurement accuracy'' is sometimes understood as closeness of agreement
      between measured quantity values that are being attributed to the measurand.'
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: 'accuracy measurement accuracy {accuracy of measurement}'
