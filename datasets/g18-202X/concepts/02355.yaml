    type: accepted
  definition:
  - content: 'fault which has a magnitude greater than the magnitude of the maximum permissible error on initial verification'
  id: 02355-eng
  language_code: eng
  notes:
  - content: 'Note: The following faults are considered to be not significant: Fault arising from simultaneous and mutually independent causes in the instrument itself or in its checking facilities; Faults implying the impossibility to perform any measurement; Transitory faults being momentary variations in the indication, which cannot be interpreted, recorded or transmitted as a measurement result; and Faults giving rise to variations in the measurement results that are so large as to be noticed by all those interested in the measurement result. Adapted from OIML D 11:2004, 3.10.'
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: 'significant fault'
