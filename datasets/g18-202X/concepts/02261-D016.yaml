    type: accepted
  definition:
  - content: 'testing and evaluation of measuring instruments to ascertain whether or not a single instrument, an instrument lot or a production series of instruments comply with all statutory requirements applicable to this instrument type'
    sources:
    - type: authoritative
      status: identical
      origin:
        ref:
          source: 'OIML V 1:2000'
          id: '2.11'
  id: 02261-D016-eng
  language_code: eng
  notes:
  - content: 'Conformity assessment does not only concern metrological requirements
      but may also cover requirements relating to: safety; EMC; software identification;
      ease of use; marking, etc.'
  - content: Conformity assessment of a measuring instrument is hereafter referred
      to as "conformity assessment".
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: 'conformity assessment of a measuring instrument'
