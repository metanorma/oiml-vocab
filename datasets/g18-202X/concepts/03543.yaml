  definition:
  - content: 'verification of measuring instrument after a previous verification'
  id: 03543-eng
  language_code: eng
  notes:
  - content: 'Note 1: Subsequent verification of a measuring instrument includes mandatory periodic verification, verification after repair, and voluntary verification. Note 2: Subsequent verification of a measuring instrument may be carried out before expiry of the period of validity of a previous  verification either at the request of the user (owner) or when its verification mark is declared to be no longer valid.'
