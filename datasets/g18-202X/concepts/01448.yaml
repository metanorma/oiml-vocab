data:
  dates:
  - date: '2026-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: 'Conventional value of the result of weighing in air, in accordance with OIML D 28 Conventional value of the result of weighing in air [3]. For a weight taken at a reference temperature (tref) of 20 °C, the conventional mass is the mass of a reference weight of a density (rref) of 8 000 kg m–3 which it balances in air of a reference density (r0) of 1.2 kg m–3'
  id: 01448-eng
  language_code: eng
  notes:
  - content: 'Also called the conventional value of mass.'
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: 'conventional mass'
