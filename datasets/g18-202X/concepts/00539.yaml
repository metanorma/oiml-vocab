data:
  dates:
  - date: '2026-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: 'measuring instrument that serves to determine the mass of an amount of material by using the action of gravity on this material. The instrument may also be used to determine other quantities, magnitudes, parameters or characteristics related to mass. According to its method of operation, a weighing instrument is classified as automatic or non-automatic'
  id: 00539-eng
  language_code: eng
  notes:
  - content: 'Note: In this Recommendation “mass” (or “weight value”) is preferably used in the sense of “conventional mass” or “conventional value of the result of weighing in air” according to OIML R 111 and OIML D 28, whereas “weight” is preferably used for an embodiment (= material measure) of mass that is regulated in regard to its physical and metrological  characteristics.'
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: 'weighing instrument'
