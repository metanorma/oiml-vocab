data:
  dates:
  - date: '2026-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: 'a digital display can be realized as a primary display or as a secondary display: a) primary display: Either incorporated in the indicator housing or in the terminal housing or realized as a display in a separate housing (i.e. terminal without keys), e.g. for use in combination with a weighing module. b) secondary display: Additional peripheral device (optional) which repeats the weighing result and any other primary indication, or provides further, non-metrological information'
  id: 00902-eng
  language_code: eng
  notes:
  - content: 'Note:The terms “primary display” and “secondary display” should not be confused with the terms “primary indication” and “secondaryindication” (T.1.3.1 and T.1.3.2)'
