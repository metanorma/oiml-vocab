  definition:
  - content: 'legally relevant parameter with a value that depends on the type of instrument, component and/or module subject ot legal control'
    sources:
    - type: authoritative
      status: modified
      origin:
        ref:
          source: 'OIML V 1:2022'
          id: '2.04'
  id: 03599-eng
  language_code: eng
  examples:
  - content: 'Considering a measuring system of liquids other than water, the range
      of kinematic viscosity of a turbine is a type-specific parameter fixed by the
      type approval of the turbine. All the manufactured turbines of the same type
      have the same range of viscosity.'
  notes:
  - content: Type-specific parameters are part of the legally relevant software.
