  definition:
  - content: 'part of the measuring device that provides an output signal, representing volume or mass, having a determined relationship to the input signal (See also T.a.8)'
  id: 03578-eng
  language_code: eng
  notes:
  - content: 'Note 1:  The transducer can either be incorporated with the meter sensor or be external to the meter sensor. In the latter case, it can be approved either with the sensor or with the calculator. Note 2:  A pulser id a specific type of measuring transducer.'
