  - content: 'influence quantity (3.4.1) having a value within the limits specified in “this part of ISO 4064/OIML R 49”, but outside the specified rated operating conditions (3.4.4) of the meter [SOURCE: OIML D 11:2013, 3.15.2, [8] modified — “this part of ISO 4064/OIML R49” replaces “the applicable International Recommendation”; “meter” replaces “measuring instrument”; original notes removed; “Note 1” added]'
