  definition:
  - content: 'report issued by a testing laboratory that includes the results of additional tests and examinations, additional to those in the OIML Recommendation, accepted in the scope of a Declaration'
  id: 02842-eng
  language_code: eng
  notes:
  - content: Additional test reports are issued under the OIML-CS for results of
      tests and examinations of additional national requirements.
  - content: In the event that several testing laboratories are involved in the
      additional tests and examinations, each testing laboratory issues an additional
      test report corresponding to those tests and examinations it performs.
