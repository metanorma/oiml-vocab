  definition:
  - content: 'measuring system intended for the measurement of bunker fuel'
  id: 03284-eng
  language_code: eng
  notes:
  - content: 'Note 1: These measuring systems are located either on a special bunkering vessel, such as a bunker barge/tanker, or on the receiving vessel. Note 2: In the process of bunkering, there is often a high possibility of entrined air entering the liquid, caused by emptying tanks and other issues.'
