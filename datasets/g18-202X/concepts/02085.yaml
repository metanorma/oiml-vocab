  definition:
  - content: 'fault, the magnitude of which is greater than one fifth of the magnitude of the maximum permissible error for the calorific value. However a fault, the magnitude of which is smaller than 2 scale intervals of the CVDD is never considered as a significant fault'
  id: 02085-eng
  language_code: eng
  notes:
  - content: 'Note: For CVDDs this concept applies to the whole device.'
