  definition:
  - content: 'part or device, other than an ancillary device, required to ensure correct measurement or intended to facilitate the measuring operations, or which could in any way affect the measurement'
  id: 02841-eng
  language_code: eng
  notes:
  - content: 'Note: Main additional devices are: gas elimination device; gas indicator; sight glass; filter; pump; device used for the transfer point; anti-swirl device; branches or bypasses; and valves, hoses.'
