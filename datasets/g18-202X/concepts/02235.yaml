    type: accepted
  definition:
  - content: 'facility incorporated in a measuring instrument which enables significant faults to be detected and acted upon'
  id: 02235-eng
  language_code: eng
  notes:
  - content: 'Note 1:Typically, checking facilities detect and act upon incorrect functioning of a specific device of the measuring instrument, and/or disturbed communication between specific devices of the measuring instrument. Note 2:Note 2: “Act upon” refers to any adequate response by the measuring instrument (for example: a luminous signal, an acoustic signal, interruption or blocking of the measurement process, etc.).'
  sources: []
