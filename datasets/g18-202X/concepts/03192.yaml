  definition:
  - content: 'device intended to detect the presence of liquid in the pipework or the tank and to check, before startup and after stopping, that all or part of the measuring system is either filled completely with liquid (full hose measuring systems) or completely empty of liquid (empty hose measuring system)'
  id: 03192-eng
  language_code: eng
  notes:
  - content: 'Note:  A liquid detector may also be used for highlevel detection.'
