  definition:
  - content: 'measuring instrument reproducing or supplying, in permanent manner during its use, quantities of one or more given kinds, each with an assignes quantity value [VIM, 3.6] Examples: Standard weight, volume measure (suppluing one or several quantiuty values, with or without a quantity-value sacle), standard electic resistor, line scale (ruler), gauge block, standard signal generator, certified reference material.'
  id: 03218-eng
  language_code: eng
  notes:
  - content: 'Note 1: The indication of material measure is its assigned quantity value. Note 2: A material measure can be a measurement standard.'
  sources: []
