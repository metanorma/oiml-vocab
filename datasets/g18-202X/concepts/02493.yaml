  definition:
  - content: 'difference between the actual quantity of product in a prepackage and the nominal quantity of that prepackage'
  id: 02493-eng
  language_code: eng
  notes:
  - content: 'Note:The individual prepackage error for a prepackage “i” is designated by the symbol Ei or ei and can be calculated by Ei = Qi – Qnom or by ei = qi – Qnom where Qnom is the nominal quantity.'
