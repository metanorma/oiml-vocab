    type: accepted
  definition:
  - content: 'extreme value of measurement error, with respect to a known reference quantity value, permitted by specifications or regulations for a given measurement, measuring instrument, or measuring system [VIML, 0.05]'
  id: 03238-eng
  language_code: eng
  notes:
  - content: 'Note 1: Usually the term “maximum permissible errors” or “limits of error” are used, where there are two extreme values. Note 2: the term “tolerance” should not be used to designate ‘maximum permissible error’. [OIML V2-200:2012, 4.26] Note 3: Usually the term “maximum permissible errors” is abbreviated to “MPE”, or “mpe”.'
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: 'maximum permissible measurement error maximum permissible error limit of error'
