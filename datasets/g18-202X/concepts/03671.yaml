    type: accepted
  definition:
  - content: 'measured quantity value minus a reference quantity value (VIM, 2.16)'
  id: 03671-eng
  language_code: eng
  notes:
  - content: 'The concept of ''measurement error'' can be used both when there is
      single reference quantity value to refer to, which occurs if a calibration
      is made by means of measurement standard with a measured quantity value having
      a negligible measurement uncertainty or if a conventinal quantity value is
      given, in which case the measurement error is known, and if a measurand is
      supposed to be represented by a unique true quantity calue or set of true quantity
      calues of negligibly range, in which case the measurement error is not known.'
  - content: Measurement error should not be confused with production error or mistake.
  sources: []
