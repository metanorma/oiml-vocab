  definition:
  - content: 'the closeness of agreement between results of successive measurements of the same measurand carried out under the same conditions and within a relatively short period of time'
  id: 01504-eng
  language_code: eng
  notes:
  - content: 'Note: The same conditions include the following: the method of measurement, the operator, the measuring instrument, the location, and the environmental conditions.'
