    type: accepted
  definition:
  - content: 'catalytic activity of a component divided by the volume of the original system'
  id: 01864-eng
  language_code: eng
  notes:
  - content: 'The derived coherent SI unit is the mole per second per cubic metre
      (mol/(s · m3)), also called kat/m3. In laboratory medicine the mole per second
      per litre (mol/(s · L)) is also frequently used.'
  - content: 'Throughout this Recommendation the component" is an enzyme and the "original
      system" can be, e.g., the plasma of a blood sample. [ISO/DIS 18153, clause 3.3]'
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: 'catalytic activity concentration; catalytic concentration'
