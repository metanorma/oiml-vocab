    type: accepted
  definition:
  - content: 'operating mode of a self-service arrangement in which the supplier is present and controls the authorization for the delivery'
  id: 02871-eng
  language_code: eng
  notes:
  - content: 'Note 1: In attended service mode, the settlement of the transaction takes place before the customer leaves the site of the delivery. Note 2: A transaction is settled when the parties interested in the transaction have made their agreement known (explicitly or implicitly) as regards the amount of the transaction. This may be a payment, signing a credit card voucher, signing a delivery order, etc. Note 3: The parties interested in a transaction may be the parties themselves or their representatives (for example the employee in a filling station or the driver of a truck). Note 4: In attended service mode the measurement operation ends at the moment settlement of the transaction takes place.'
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: 'attended service mode'
