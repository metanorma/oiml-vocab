    type: accepted
  definition:
  - content: 'extreme value of measurement error, with respect to a known reference quantity value, permitted by specifications or regulations for a given measurement, measuring instrument, or measuring system'
    sources:
    - type: authoritative
      status: identical
      origin:
        ref:
          source: 'OIML V 2-200:2007'
          id: '4.26'
  id: 02785-eng
  language_code: eng
  notes:
  - content: 'Usually, the term "maximum permissible errors" or "limits of error"
      is used where there are two extreme values.'
  - content: 'The term "tolerance" should not be used to designate "maximum permissible
      error".'
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: maximum permissible error
  - type: abbreviation
    normative_status: preferred
    designation: MPE
  - type: expression
    normative_status: admitted
    designation: limit of error
  - type: expression
    normative_status: admitted
    designation: maximum permissible measurement error
