  definition:
  - content: 'fault exceeding the applicable fault limit value [Adapted from VIML:2013, 5.14 – note modified]'
  id: 03508-eng
  language_code: eng
  notes:
  - content: 'A significant fault does not include faults arising from simultaneous and mutually independent causes, faults implying the impossibility to perform any weighing, transitory faults, momentary variations in the indication which cannot be interpreted, memorized or transmitted as a weighing result, faults which are so serious they will inevitably be noticed by all those interested in the weighing result.'
