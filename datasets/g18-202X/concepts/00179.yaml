  definition:
  - content: 'organization that has been authorized by the national responsible body to provide a declaration of conformity of a manufactured measuring instrument to legal requirements'
  id: 00179-eng
  language_code: eng
  notes:
  - content: 'Note: This term may also apply to distributors, importers, assemblers, installers, repackagers, relabelers, etc. that have responsibility for assuring the quality and performance of a measuring instrument prior to its being placed in service (see ISO/IEC Guide 22 [4]).'
