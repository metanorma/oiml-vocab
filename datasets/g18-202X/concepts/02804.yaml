    type: accepted
  definition:
  - content: 'difference between the error of indication (during or after exposure to a disturbance) and the mean intrinsic error of a measuring instrument with reference to a certified measurement standard [OIML D 11:2013, 3.9]'
  id: 02804-eng
  language_code: eng
  notes:
  - content: 'OIML D 11:2013 Notes 1 Principally, a fault is the result of an undesired change of data contained in or flowing through an electronic measuring instrument. 2 From the definition it follows that a ‘fault’ is a numerical value which is expressed either in a unit of measurement or as a relative value. Note:  Refer to Table 3 for the relevant measured values in the calculation of errors. Note:If a certified measurement standard is not used, a fault is the difference between a single indication during or after a disturbance and the mean indication at reference conditions prior to test.'
