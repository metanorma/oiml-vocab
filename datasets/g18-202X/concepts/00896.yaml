  definition:
  - content: 'identifiable part of an instrument that performs a specific function or functions, and that can be separately evaluated according to specific metrological and technical performance requirements in the relevant Recommendation. The modules of a weighing instrument are subject to specified partial error limits'
  id: 00896-eng
  language_code: eng
  notes:
  - content: 'Note:Typical modules of a weighing instrument are: load cell, indicator, analog or digital data processing device, weighing module, terminal, primary display.'
