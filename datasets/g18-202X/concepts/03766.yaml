    type: accepted
  definition:
  - content: 'quantity that, in a direct measurement, does not affect the quantity that is actually measured, but affects the relation between the indication and the measurement result'
  id: 03766-eng
  language_code: eng
  notes:
  - content: 'Note: For speed meters the following quantities are examples of influence quantities: ambient temperature, measurement angle, acceleration of measured vehicle, distance and speed of other vehicles on the same or neighbouring lanes.'
