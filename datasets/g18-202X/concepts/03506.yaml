    type: accepted
  definition:
  - content: 'fault exceeding the applicable fault limit value'
    sources:
    - type: authoritative
      status: identical
      origin:
        ref:
          source: 'OIML V 1:2013'
          id: '5.14'
  id: 03506-eng
  language_code: eng
  notes:
  - content: 'The following faults are not considered to be significant, even when they exceed the value defined above: (a) faults arising from simultaneous and mutually independent causes in the measuring instrument itself; (b) faults implying the impossibility to perform any measurement; (c) transitory faults being momentary variations in the indication, which cannot be interpreted, memorized or transmitted as a measurement result; and (d) faults giving rise to variations in the measurement results so serious that they are bound to be noticed by all those interested in the result of the measurement.'
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: 'significant fault'
