  definition:
  - content: 'influence quantity having a value outside the specified rated operating conditions of the measuring system (for electronic measuring systems only).'
  id: 03000-eng
  language_code: eng
  notes:
  - content: 'Note 1: If the rated operating conditions are not specified for an influence quantity, it is a disturbance. Note 2: A systematic influence by design or by installation (e.g. systematic air inlet) cannot be considered as a disturbance.'
  sources: []
