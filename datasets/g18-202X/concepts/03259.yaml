    type: accepted
  definition:
  - content: 'set of quantity values being attributed to a measurand together with any other available relevant information adapted from [V 2-200:2012, 2.9]'
  id: 03259-eng
  language_code: eng
  notes:
  - content: 'Note 1: The relevant information may consist of e.g. measurement uncertainty, date and time of measurement, number of measurement, identification of sensor and in the case where price calculation is part of legally relevant software, unit price and price to pay. Note 2: The measurement result (including the measured quantity value according to V 2:200:2012) is used for the legally relevant purpousae, e.g. conclusion of transaction. Note 3: See Annex C for clarification regarding measurement-related terms.'
  sources: []
