  definition:
  - content: 'legally relevant parameter with a value that depends on the type of instrument only Type-specific parameters are part of the legally relevant software. They are fixed at type approval of the instrument. Examples: Parameters used for weight value calculation, stability analysis or price calculation and rounding, software identification.'
