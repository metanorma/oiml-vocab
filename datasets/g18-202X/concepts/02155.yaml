  definition:
  - content: 'decision of legal relevance, based on the evaluation report that the type of a measuring instrument complies with the relevant statutory requirements and is suitable for use in the regulated area in such a way that it is expected to provide reliable measurement results over a defined period of time'
  id: 02155-eng
  language_code: eng
  notes:
  - content: 'Note:  For the purpose of this Document, the “type approval” is named “type evaluation”. Consequently “Type evaluation” in the sense of this Document includes examination, tests and decision.'
