  definition:
  - content: 'product of a combined standard measurement uncertainty and a factor larger than the number one [VIM, 2.35]'
  id: 03055-eng
  language_code: eng
  notes:
  - content: 'Note 1: The factor depends upon the type of probability distribution of the output quantity in ,easurement model and on the selected coverage probability. Note 2: The term “factor” in this definition refers to a coverage factor. Note 3: Expanded measurement uncertainty is termed “overall uncertainty” in paragraph 5 of Recommendation INC-1 (1980) (see the GUM) and simply “uncertainty” pn IEC documents.'
