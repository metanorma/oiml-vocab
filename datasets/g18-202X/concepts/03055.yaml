  definition:
  - content: 'product of a combined standard measurement uncertainty and a factor larger than the number one'
    sources:
    - type: authoritative
      status: identical
      origin:
        ref:
          source: 'OIML V 2-200:2012'
          id: '2.35'
  id: 03055-eng
  language_code: eng
  notes:
  - content: The factor depends upon the type of probability distribution of the
      output quantity in ,easurement model and on the selected coverage probability.
  - content: 'The term "factor" in this definition refers to a coverage factor.'
  - content: 'Expanded measurement uncertainty is termed "overall uncertainty" in
      paragraph 5 of Recommendation INC-1 (1980) (see the GUM) and simply "uncertainty"
      pn IEC documents.'
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: 'expanded measurement uncertainty expanded uncertainty'
