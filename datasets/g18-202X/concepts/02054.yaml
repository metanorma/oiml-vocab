    type: accepted
  definition:
  - content: 'device which automatically converts the volume measured at metering conditions into a volume at base conditions or into a mass by taking into account the gas characteristics (i.e. pressure, temperature, composition, density) measured using associated measuring instruments or stored in a memory'
  id: 02054-eng
  language_code: eng
  notes:
  - content: 'Note: The quotient of the volume at base conditions or of the mass to the volume at metering conditions is referred to as the “conversion factor”.'
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: 'volume conversion device'
