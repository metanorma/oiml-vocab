  definition:
  - content: 'any verification of a measuring instrument after a previous verification and including: mandatory periodic verification; verification after repair. [VIML 2.16]'
  id: 00168-eng
  language_code: eng
  notes:
  - content: 'Note: Subsequent verification of a measuring instrument may be carried out before expiry of the period of validity of a previous  verification either at the request of the user (owner) or when its verification mark is declared to be no longer valid.'
