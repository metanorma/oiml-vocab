    type: accepted
  definition:
  - content: 'equipment (including, but not limited to, measuring instrument, software, measurement standards, reference materials, reference data, reagents, consumables or auxiliary apparaturs) that is required for the correct performance of laboratory activities and that can influence the results'
  id: 03274-eng
  language_code: eng
  notes:
  - content: 'Note 1: In the context of this Document, a measuring instrument is a component of the measuring equipment which plays an important role for measurement. Some measuring instrument can be used independently to complere a measurement process or realise a physical quantity. Note 2: In the context of this Document, measuring equipment may be considered as being equivalent to measuring system.'
