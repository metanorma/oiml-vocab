  definition:
  - content: 'there are two vertex powers of a lens, described in 3.7.1 and 3.7.2'
  id: 01130-eng
  language_code: eng
  notes:
  - content: 'Note: The unit for expressing vertex power is the reciprocal metre (m-1). The name for this unit is the “dioptre”, for which the symbol is D. Conventionally the back vertex power, in dioptres, is specified as the “power” of a spectacle lens, although the front vertex power is required for certain purposes (for example in the measurement of some multifocal lenses).'
  sources: []
