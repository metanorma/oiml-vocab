  definition:
  - content: 'weighing instrument used to determine the static reference vehicle mass of the reference vehicles and the static single-axle loads of a two-axle rigid reference vehicle. The control instruments used as a reference instrument during testing may be: - separate from the instrument being tested; or - integral, when a static weighing mode is provided by the instrument being tested.'
