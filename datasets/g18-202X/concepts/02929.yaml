data:
  dates:
  - date: '2026-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: 'facility, incorporated in a measuring instrument (or system), which enables significant faults to be detected and acted upon, including •incorrect functioning of a specific device of the measuring instrument or system, and/or •disturbed communication between specific devices of the measuring instrument or system [OIML V1:2013, 5.07]'
  id: 02929-eng
  language_code: eng
  notes:
  - content: 'Note:  “Acted upon” refers to any adequate response by the measuring instrument (for example a luminous signal, an acoustic signal, interruption or blocking of the measurement process, etc.).'
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: 'checking facility'
