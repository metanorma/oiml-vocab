  definition:
  - content: 'device employing electronic sub-assemblies and performing a specific function. Electronic devices are usually manufactured as separate units and are capable of being tested independently'
  id: 02099-eng
  language_code: eng
  notes:
  - content: 'Note: The electronic parts of CVDDs are not tested separately. A measuring system including at least one electronic device subject to legal control is called an electronic measuring system.'
