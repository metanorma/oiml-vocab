data:
  dates:
  - date: '2026-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: 'fault greater than the value specified in this Recommendation (see 4.4.1) [VIML 5.14]'
  id: 02479-eng
  language_code: eng
  notes:
  - content: 'Note: The relevant Recommendation may specify that the following faults are not significant, even when they exceed the value defined in 4.4.1.: (a) faults arising from simultaneous and mutually independent causes (e.g. EM fields and discharges) originating in a measuring instrument or in its checking facilities; (b)faults implying the impossibility to perform any measurement; (c) transitory faults being momentary variations in the indication, which cannot be interpreted, memorized or transmitted as a measurement result; (d)faults giving rise to variations in the measurement result that are serious enough to be noticed by all those interested in the measurement result; the relevant Recommendation may specify the nature of these variations.'
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: 'significant fault'
