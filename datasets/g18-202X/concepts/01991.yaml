  definition:
  - content: 'optional part of the meter that receives the digital output signals from the metering calculator and, possibly, from associated measuring instruments, which processes them into data for the indicating device'
  id: 01991-eng
  language_code: eng
  notes:
  - content: 'The metering calculator and the operational calculator may be two separate elements or form a single unit. Except in the case of a particular need to dissociate the two kinds of calculators, the association of both functions is called the calculator in this Recommendation.'
