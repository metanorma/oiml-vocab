  definition:
  - content: 'an influence quantity having a value within the limits specified in the appropriate International Recommendation, but outside the specified rated operating conditions of the measuring instrument [D11 clause T.12.2].'
  id: 01610-eng
  language_code: eng
  notes:
  - content: 'Note: An influence quantity is a disturbance if for that influence quantity the rated operating conditions are not specified.'
