  definition:
  - content: 'part or a device, other than an ancillary device, required to ensure correct measurement or intended to facilitate the measuring operations, or which could in any way affect the measurement'
  id: 02727-eng
  language_code: eng
  notes:
  - content: 'Main additional devices are: a) filter; b) device used for the transfer point; c) anti-swirl device; d) branches or bypasses; e) valves, hoses, and in general, all the gaseous piping.'
