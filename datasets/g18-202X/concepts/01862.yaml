  definition:
  - content: 'fraction of the signal recorded by the detector for radiation of all wavelengths outside the 1.01-fold of the one-hundredth value width out of the total signal at a particular wavelength setting'
  id: 01862-eng
  language_code: eng
  notes:
  - content: 'The false radiation fraction has the dimension one and is expressed with the derived coherent SI unit one (1). Radiation entering the spectrophotometer from the outside through leaks is not included by this concept. Adapted from [5], clause 5.3.'
