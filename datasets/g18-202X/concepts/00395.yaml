data:
  dates:
  - date: '2026-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: 'the capacity corresponding to any scale mark is equal to the volume of water, at the reference temperature, delivered by the burette at this temperature when it is emptied from the zero mark to this scale mark, the outflow being unrestricted until the meniscus is set on this scale mark, no period being allowed for drainage of liquid adhering to the walls before making the final setting'
  id: 00395-eng
  language_code: eng
  notes:
  - content: 'Note: The meniscus formed by the water in the burette, must be so adjusted that the horizontal plane passing through the upper edge of the scale mark, is tangential to the lowest point of the meniscus when viewed in this plane.'
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: 'capacity (of a burette)'
