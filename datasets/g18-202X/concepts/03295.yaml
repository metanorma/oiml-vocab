    type: accepted
  definition:
  - content: 'property of a measurement result whereby the result can be related to a reference through a documented unbroken chain of calibrations, each contributing to the measurement uncertainty [VIM, 2.41]'
  id: 03295-eng
  language_code: eng
  notes:
  - content: 'Note 1: For this definition, a ‘reference’can be a definition of a measurement unit through its practical realization, or a measurement procedure including the measurement unity for a non-ordinal quantity, or a measurement standard. Note 2: Metrological traceability requires an established calibration hierarchy. For other nores see [VIM, 2.41]'
  sources: []
