data:
  dates:
  - date: '2026-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: 'In the contex of this Document, result is defined as: set of quantity values being attributed to a measurand together with any other available relevant information (VIM3, 2.9)'
  id: 03260-eng
  language_code: eng
  notes:
  - content: 'Note 1:A measurement result generally contains “relevant information” about the set of quantity values, such that some may be more representative of the measureand than others. This may be expressed in the form of probability density function (PDF). Note 2: A measurement result is generally expressed as single measured quantity value and a measurement uncertainty. If the measurement uncertainty is considered to be negligible for some purpose, the measurement result may be expressed as single measured quantity value. In many fields, this is the common way of expressing a measurement result. Note 3: In the traditional literature and in the precious edition of the VIM, measurement result was defined as value attributed to a measurand and explained to mean an indication, or an uncorrected result, or a correxcted result, according to the context.'
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: 'measurement result result of measurement'
