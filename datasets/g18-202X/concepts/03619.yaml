  definition:
  - content: 'provision of objective evidence that a given item fulfils specified requirements [VIM, 2.44] Example 1: Confirmation that a given reference material as claimed is homogeneous for the quantity value and measurement procedure concerned, down to a measurement portion having a mass of 10 mg. Example 2: Confirmation that performence properties or legal requirements of measuring system are achived. Example 3:  Confirmation that a target measurement uncertainty can be met.'
