  definition:
  - content: 'identifiable part of an instrument or device that performs a specific function or functions, and that can be separately evaluated according to the metrological and technical performance requirements in the relevant Recommendation. The modules of a weighing instrument are subject to specified partial error limits'
  id: 01341-eng
  language_code: eng
  notes:
  - content: 'Typical modules of an instrument are: load cell, indicator, analog or digital processors, weighing module, remote display, software.'
