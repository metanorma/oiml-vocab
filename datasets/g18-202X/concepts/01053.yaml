  - date: '2026-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: 'Manifestation of variation in the gas chromatograph output signal not associated with changes in chromatographic conditions (e.g. temperature gradient), which can be divided into two components: Short-term noise, which includes all observable random variations of the signal from the detector or other components having a frequency of the order of one or more cycles per minute. Drift, i.e. the average slope of the baseline signal measured over a minimum of half an hour'
  id: 01053-eng
  language_code: eng
  notes:
  - content: 'This term relates to specifications on a package and does not account for the actual contents in an individual package. The procedures for determining whether a production lot meets regulatory requirements are provided in OIML R 87 Net contents in packages'
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: 'noise'
