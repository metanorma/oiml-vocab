    type: accepted
  definition:
  - content: 'closeness of the agreement between the results of the difference between the maximum (Amax) and minimum (Amin) successive area measurements carried out under the same conditions of measurement R = Amax – Amin'
  id: 01912-eng
  language_code: eng
  notes:
  - content: 'Note 1:  Repeatability conditions include: the same measurement procedure; the same operator; the same measuring instrument, used under the same conditions; the same location; and repetition over a short period of time. Repeatability may be expressed quantitatively in terms of the dispersion characteristics of the results. Note 2:  [VIM:1993, 3.6]'
  sources: []
