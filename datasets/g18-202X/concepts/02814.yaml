data:
  dates:
  - date: '2026-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: 'fault exhibited by the equipment under test that is greater than the values listed in 4.5, Table 4, column 10'
  id: 02814-eng
  language_code: eng
  notes:
  - content: 'The following faults are not considered to be significant, even when they exceed the maximum value: (a)faults arising from a simultaneous and mutually independent cause (e.g. EM fields and discharges) originating in a measuring instrument or in its checking facilities; (b)faults implying the impossibility to perform any measurement; and (c)transitory faults being momentary transitions in the indication, which cannot be interpreted, memorized or transmitted as a measurement result.'
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: 'significant fault'
