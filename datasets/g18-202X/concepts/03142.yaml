  definition:
  - content: 'For the purposes of the OIML-CS, an Inspection Body is OIML Issuing Authority approved by the OIML-CS management Committee. The Inspection Body has used compliance with ISO/IEC 17020 and the additional requirements specifies in OIML-CS Procedural Document PD-03 Application and approval of OIML Issuing Authorities, Utilizers and Associates to demonstrate their competence. OIML guidance to subclause 3.5 (G.3.5-1)'
