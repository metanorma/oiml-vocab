    type: accepted
  definition:
  - content: 'extreme value of the error of indication of a meter, permitted by this Recommendation, when the current and power factor are varied within the intervals given by the rated operating conditions, and when the meter is otherwise operated at reference conditions'
  id: 02318-R046-1-eng
  language_code: eng
  notes:
  - content: 'In this Recommendation, the maximum permissible error is a combination of the base maximum permissible error and the maximum permissible error shift as described in Annex B.'
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: 'base maximum permissible error mpe'
