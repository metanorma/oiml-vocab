data:
  dates:
  - date: '2026-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: 'fault greater than e. The following are not considered to be significant faults, even when they exceed e: faults arising from simultaneous and mutually independent causes in the instrument; faults implying the impossibility to perform any measurement; faults being so serious that they are bound to be noticed by all those interested in the result of measurement; or transitory faults, being momentary variations in the indication which cannot be interpreted, memorized or transmitted as a measuring result'
  id: 00982-eng
  language_code: eng
  notes:
  - content: 'For a multi-interval instrument, the value of e is that appropriate to the partial weighing range.'
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: 'significant fault'
