    type: accepted
  definition:
  - content: 'concentration of an element that provides an output signal equivalent to three times the standard deviation of the mean of the output signal of a blank solution and is the minimum quantity measured before it can be concluded that an element has been detected'
  id: 01524-eng
  language_code: eng
  notes:
  - content: 'Note: In this Recommendation, this term refers to the determination of an element in a reference solution free of interfering elements. The baseline noise is established by measuring the output signal of several aliquots of the blank test solution.'
