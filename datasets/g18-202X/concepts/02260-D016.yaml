  definition:
  - content: 'measuring instrument which conforms to prescribed requirements, in particular legal metrological requirements'
    sources:
    - type: authoritative
      status: identical
      origin:
        ref:
          source: 'OIML V 1:2000'
          id: '4.3'
  id: 02260-D016-eng
  language_code: eng
  notes:
  - content: 'For the purposes of this Document the following instruments may fall
      under control according to national regulations: measuring instruments, coin
      counting machines, medical measuring instruments, water dispensing machines,
      timing instruments in vehicle washers.'
  - content: 'Legally controlled measuring instrument is hereafter referred to as
      a "measuring instrument".'
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: 'legally controlled measuring instrument'
