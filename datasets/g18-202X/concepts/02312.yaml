  definition:
  - content: 'ratio of the r.m.s. value of the harmonic content to the r.m.s. value of the fundamental term'
  id: 02312-eng
  language_code: eng
  notes:
  - content: 'Note 1: The harmonic content is obtained e.g. by subtracting from a non-sinusoidal alternating quantity its fundamental term. Note 2: The distortion factor is usually expressed as a percentage. It is equivalent to THD, total harmonic distortion.'
