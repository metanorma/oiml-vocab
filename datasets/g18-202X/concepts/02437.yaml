data:
  dates:
  - date: '2026-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: 'facility that is incorporated in a meter and which enables significant
      fault(s) (3.2.8) to be detected and acted upon'
    sources:
    - type: authoritative
      status: modified
      origin:
        ref:
          source: 'OIML D011:2013'
          id: '3.19'
      modification: '"meter" replaces "measuring instrument"; "Note 3" added'
  id: 02437-eng
  language_code: eng
  notes:
  - content: 'Typically, checking facilities detect and act upon: incorrect function
      of specific device of the meter, and/or disturbed communication between specific
      devices of the meter.'
  - content: '"Act upon" refers to any adequate response by measuring instrument
      (for example: a luminous signal, an acoustic signal, interruption or blocking
      of the measurement process, etc.).'
  - content: The checking of a transmission device aims to verify whether all the
      information which is transmitted (and only that information) is fully received
      by the receiving equipment.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: 'checking facility'
