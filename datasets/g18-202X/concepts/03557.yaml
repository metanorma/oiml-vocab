  definition:
  - content: 'component of a thermometer of which part is applied to a body cavity or tissue with which it establishes thermal equilibrium. It comprises a temperature sensor with associated parts including coverings, seals, inner leads, and connecting plug, where appropriate'
  id: 03557-eng
  language_code: eng
  notes:
  - content: 'A body cavity or tissue may be the mouth (sublingual), rectum, or armpit.'
  - content: The part of the probe in contact with a body cavity or tissue is called
      the applied part
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: 'temperature probe'
