    type: accepted
  definition:
  - content: 'instrument intended to measure continuously, memorize, and display the volume of water passing through the measurement transducer ( 3.1.2) at metering conditions (3.2.11)'
  id: 02340-eng
  language_code: eng
  notes:
  - content: 'Note 1: A water meter includes at least a measurement transducer, a calculator (including adjustment or correction devices, if present) and an indicating device. These three devices can be in different housings. Note 2: A water meter may be a combination meter (see 3.1.16). Note 3: In this Recommendation, a water meter is also referred to as a “meter”.'
