  definition:
  - content: 'quantity that, in a direct measurement, does not affect the quantity that is actually measured, but affects the relation between the indication and the measurement result [SOURCE: ISO/IEC Guide 99:2007/OIML V2-200:2012 (VIM) 2.52 [1],.modified – original exampes and notes removed; “EXAMPLE” added] EXAMPLE:The ambient temperature of the meter is an influence quantity, whereas the temperature of the water passing through the meter affects the measurand.'
