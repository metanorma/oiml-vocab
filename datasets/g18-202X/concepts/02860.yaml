  definition:
  - content: 'device intended to perform a particular function, directly involved in elaborating, transmitting or displaying measurement results [OIML V1:2013, 5.06]'
  id: 02860-eng
  language_code: eng
  notes:
  - content: 'Note 1 An ancillary device may or may not be subject to legal metrology control according to its function in the measuring system or to national regulations. Note 2 Main ancillary devices are: zero-setting device; repeating indicating device; printing device; memory device; price indicating device; totalizing indicating device; presetting device; self-service device.'
