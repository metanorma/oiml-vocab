  definition:
  - content: 'facility incorporated in an electronic automatic level gauge that enables: - significant faults; and/or - incorrect functioning of a specific device of the ALG; and/or - disturbed communication between specific devices of the ALG to be detected and acted upon'
  id: 02308-R085-1-eng
  language_code: eng
  notes:
  - content: 'Note 1: “Acted upon” refers to any adequate response by the ALG (luminous signal, acoustic signal,prevention of the measurement process, etc.).'
