data:
  dates:
  - date: '2026-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: 'all of the prepackage that is not packing material'
  id: 02505-eng
  language_code: eng
  notes:
  - content: 'Note 1: Product includes liquids or gasses that were put in the prepackage together with the product and that are not intended to be left over after use of the product (e.g. air in chocolate mousse). Note 2: Product includes liquids or gasses that were not put in the prepackage with the product and that are intended to be left over after use of the product (e.g. liquid in mozzarella cheese, air in hair gel). Note 3: Product includes liquids or gasses that were not put in the prepackage with the product and that are not intended to be left over after use of the product (e.g. curdling of yoghurt or honey).'
  sources: []
