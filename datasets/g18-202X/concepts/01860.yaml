    type: accepted
  definition:
  - content: 'difference between a higher and lower wavelength value at which the value of an optical quantity is reduced to half of its maximum value between the two wavelengths'
  id: 01860-eng
  language_code: eng
  notes:
  - content: 'Note: The coherent SI unit is the metre (m), but often the nanometre (nm) is used. The optical quantity can be e.g. radiant luminous flux, absorbance, etc.'
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: 'spectral width at half maximum value'
