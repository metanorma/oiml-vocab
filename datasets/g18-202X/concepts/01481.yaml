  definition:
  - content: 'the concentration of the sample component of interest that gives a detector output signal equal to three times the short-term noise'
  id: 01481-eng
  language_code: eng
  notes:
  - content: 'Note: This term is also referred to as «minimum detectability» in some references and manufacturer’s literature. It is sometimes defined as an output signal equal to some other multiple (for example, two or ten) of the noise.'
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: 'detection limit for the instrument'
