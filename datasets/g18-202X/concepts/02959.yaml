    type: accepted
  definition:
  - content: 'device connected to or incorporated in the meter for automatically correcting the measured quantity at the time of measurement, by taking into account the flowrate and/or the characteristics of the liquid to be measured (viscosity, temperature, pressure, etc.) and the pre-established calibration curves.'
  id: 02959-eng
  language_code: eng
  notes:
  - content: 'Note: The characteristics of the liquid shall either be measured using associated measuring devices, or stored in a memory in the instrument'
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: 'correction device'
