  definition:
  - content: 'difference between the error of indication and the intrinsic error of a measuring instrument [OIML D11, 3.9]'
  id: 02663-eng
  language_code: eng
  notes:
  - content: 'Note 1: In practice this is the difference between the error of the
      meter observed during or after a test, and the error of the meter prior to this
      test, performed under reference conditions.'
  - content: 'Note 2: "measuring instrument" is to be interpreted as a "gas meter"
      within the scope of this Recommendation.'
