  definition:
  - content: 'extreme value of measurement error, with respect to a known reference quantity value, permitted by specifications or regulations for a given measurement, measuring instrument, or measuring system (VIM, 4.26)'
  id: 03239-eng
  language_code: eng
  notes:
  - content: 'Note 1: Usually, the term “maximum permissible errors” or “limits of error” are used where there are two extreme values. Note 2: the term “tolerance” should not be used to designate ‘maximum permissible error’.'
