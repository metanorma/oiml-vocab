  definition:
  - content: 'extreme value of measurement error, with respect to a known reference quantity value, permitted by specifications or regulations for a given measurement, measuring instrument, or measuring system (VIM, 4.26)'
  id: 03239-eng
  language_code: eng
  notes:
  - content: 'Usually, the term "maximum permissible errors" or "limits of error"
      are used where there are two extreme values.'
  - content: 'the term "tolerance" should not be used to designate ''maximum permissible
      error''.'
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: 'maximum permissible measurement error maximum permissible error limit of error'
