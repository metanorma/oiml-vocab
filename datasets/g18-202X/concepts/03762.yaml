  notes:
  - content: 'Note 1: Hash algorithms are designed to be collision-resistant, meaning that there is a very low probability that the same string would be created for different data. Note 2: Hash algorithms are used for software identification, authentication of measurements, protection of settings etc. Note 3: Typical hash algorithms are SHA-2 (256-bit hash) or stronger.'
