data:
  dates:
  - date: '2026-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: 'set of values of measurands or quantities characteristic of the gas for which the error is intended to lie within the limits specified in this Recommendation. In general the upper and lower limits of the specified measuring range are called maximum value and minimum value, respectively (for example: maximum flowrate 2000 m3/h, minimum flowrate 50 m3/h)'
  id: 02074-eng
  language_code: eng
  notes:
  - content: 'Note:  This definition applies to the measuring system and also to the elements that compose the measuring system. Main measurands or quantities characteristic for the metering module are flowrate, pressure or temperature of the gas. A conversion device has a specified measuring range for each quantity that it processes.'
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: 'specified measuring ranges'
