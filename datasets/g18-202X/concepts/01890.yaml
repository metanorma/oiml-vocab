  definition:
  - content: 'device employing electronic sub-assemblies and performing a specific function. An electronic device is usually manufactured as a separate unit and is capable of being independently tested (e.g. an instrument comprising of photocells for detecting leather or a camera for image scanning and providing area measurement with digital indication)'
