data:
  dates:
  - date: '2026-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: 'lens bringing a paraxial pencil of parallel rays to two separate line foci mutually at right angles and hence, unlike a spherical lens, having two principal powers'
  id: 01135-eng
  language_code: eng
  notes:
  - content: 'Note: One of these powers may be zero, with the corresponding focal line at infinity. Lenses referred to as toric lenses, sphero-cylindrical lenses and cylinder lenses are all astigmatic.'
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: 'astigmatic power lens'
