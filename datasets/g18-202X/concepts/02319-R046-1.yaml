    type: accepted
  definition:
  - content: 'extreme value of the change in error of indication of a meter, permitted by this Recommendation, when a single influence factor is taken from its value at reference conditions and varied within the rated operating conditions'
  id: 02319-R046-1-eng
  language_code: eng
  notes:
  - content: 'Note 1: For each influence factor there is one corresponding maximum permissible error shift. Note 2: In this Recommendation, the maximum permissible error is a combination of the base maximum permissible error and the maximum permissible error shift as described in Annex B.'
  sources: []
