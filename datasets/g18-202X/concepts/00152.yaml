    type: accepted
  definition:
  - content: 'the range of concentrations over which a detectable change in output signal is produced by an incremental change in concentration of a substance. The lower limit is given by the detection limit, and the upper limit occurs at the point of detector saturation. The value of the dynamic range is expressed by the ratio of the upper to the lower limit and is larger than or equal to the linear range'
