    type: accepted
  definition:
  - content: 'time between the instant at which power is applied to a gas analytical system and the instant at which the system is capable of complying with the metrological requirements'
  id: 02137-eng
  language_code: eng
  notes:
  - content: 'Note: For a gas analyzer this is the time between the instant at which power is applied to it and the instant at which the measurement result of the volume fraction, a CGM being supplied to the input, is within the permissible limits.'
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: 'warm-up time'
