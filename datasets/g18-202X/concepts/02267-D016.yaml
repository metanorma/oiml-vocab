    type: accepted
  definition:
  - content: 'area where two or more countries have harmonized legislation in place, on a national basis, to facilitate free cross-border movement of products and services that affect legal metrological control'
  id: 02267-D016-eng
  language_code: eng
  notes:
  - content: 'Such harmonized legislation may rely on conformity assessment procedures where, apart from public authorities, first party bodies (manufacturers) and other private bodies as third parties, carry out certain functions.'
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: 'free trade area'
