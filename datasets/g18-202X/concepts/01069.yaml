  definition:
  - content: 'minimum amount of a specific compound which, when injected into the gas chromatograph, produces a signal-to-noise ratio of at least 3 for a characteristic base peak of that compound depending on the mode of ionization and over a specified mass range'
  id: 01069-eng
  language_code: eng
  notes:
  - content: 'Note: Some compounds do not give a molecular ion, but all amenable compounds have a base peak in their spectra; the base peak is the most intense or abundant ion in a mass spectrum.'
