  definition:
  - content: 'a formal recognition that a testing laboratory is competent to carry out specific tests or specific types of tests.'
  id: 00133-eng
  language_code: eng
  notes:
  - content: 'Note :  The genetic term «accreditation» can cover the recognition of both the technical competence and the impartiality of a testing laboratory or only its technical competence. Accreditation is normally awarded following successful laboratory assessment and is followed by appropriate monitoring.'
