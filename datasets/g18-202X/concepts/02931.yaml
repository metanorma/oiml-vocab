    type: accepted
  definition:
  - content: 'facility that is incorporated in a measuring instrument and which enables significant defects to be detected and acted upon (adapted from OIML V 1, 5.07)'
  id: 02931-eng
  language_code: eng
  notes:
  - content: '"Acted upon" refers to any adequate response by the measuring instrument (luminous signal, acoustic signal, prevention of the measurement process, etc.) These significant defects could be for example events that otherwise will result in significant faults, and/or •incorrect functioning of a specific device of the measuring instrument, and/or •disturbed communication between specific devices of the measuring instrument.'
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: 'checking facility'
