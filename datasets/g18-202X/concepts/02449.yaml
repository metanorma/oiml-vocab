  definition:
  - content: 'measurement precision under reproducibility conditions of measurement'
    sources:
    - type: authoritative
      status: identical
      origin:
        ref:
          source: 'OIML V 2-200:2007'
          id: '2.25'
  id: 02449-eng
  language_code: eng
  notes:
  - content: 'Relevant statistical terms are given in ISO 5725-1:1994 and ISO
      5725-2:1994.'
  - content: 'Additional note: In this Recommendation, the reproducibility of measurements
      between units of the same type of instrument under reference conditions is assessed
      by the standard deviation of differences (SDDI). The reproducibility of measurements
      from one instrument when select influence factors are varied is assessed by
      the magnitude of the error shift or fault.'
