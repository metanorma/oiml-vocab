  definition:
  - content: 'liquid in which the shear rate is proportional to the shear stress during a viscous flow'
  id: 03325-eng
  language_code: eng
  notes:
  - content: 'Note: The ratio of shear stress to the shear rate is dynamic viscisity of the liquid, according to Neton’s Law odf Viscosity. The kinematic viscosity is the ration of the dynamic viscosity to the density of the liquid.'
