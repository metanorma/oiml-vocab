  definition:
  - content: 'difference between the error of indication and the intrinsic error of a measuring instrument'
  id: 02287-R080-1-eng
  language_code: eng
  notes:
  - content: 'Note 1:  Principally, a fault is the result of an undesired change of data contained in or flowing through an electronic measuring instrument. Note 2:  From the definition it follows that in this Recommendation, a "fault" is a numerical value which is expressed either in a unit of measurement or as a relative value, for instance in %.'
