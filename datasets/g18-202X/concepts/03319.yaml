    type: accepted
  definition:
  - content: 'identifiable part of an measuring instrument or family of measuring instruments that performs a specific function or functions, and that can be separately evaluated according to the prescribed metrological and technical performance requirements in the relevant Recommendation [VIML;2013, 4.04]'
  id: 03319-eng
  language_code: eng
  notes:
  - content: 'Note 1: The modules of a weighing instrument may be subject to specified partial error limits. Note 2: Modules may be examined separately (subject to agreement with the metrological authority (see 6.2.6). Note 3: Typical modules of an automaticweighing instrument are: load cell (force receptor), indicator, analog or digital processors, weighing module, remote display, software.'
