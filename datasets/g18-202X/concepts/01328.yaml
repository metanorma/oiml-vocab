data:
  dates:
  - date: '2026-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: 'device employing electronic sub-assemblies and performing a specific function. Electronic devices are usually manufactured as separate units and are capable of being tested independently [OIML D 11: 2004, 3.2]'
  id: 01328-eng
  language_code: eng
  notes:
  - content: 'Note 1: An electronic device may be a complete measuring instrument (for example: counter scale, electricity meter) or a part of a measuring instrument (for example: printer, indicator). Note 2: An electronic device can be a module in the sense that this term is used in OIML Publication B 3 “OIML Certificate System for Measuring  Instruments”'
  sources: []
