    type: accepted
  definition:
  - content: 'set of operations carried out on a measuring system so that it provides prescribed indications corresponding to given values of a quantity to be measured (VIM:2007, 3.11)'
  id: 02845-eng
  language_code: eng
  notes:
  - content: 'Note 1: Types of adjustment of a measuring system include zero adjustment of a measuring system, offset adjustment, and span adjustment (sometimes called gain adjustment). Note 2: Adjustment of a measuring system should not be confused with calibration, which is a prerequisite for adjustment. Note 3: After an adjustment of a measuring system, the measuring system must usually be recalibrated.'
  sources: []
