    type: accepted
  definition:
  - content: 'need or expectation that is stated, generally implied or obligatory [ISO 9000:2000, 3.1.2]'
  id: 00171-eng
  language_code: eng
  notes:
  - content: 'Note 1:  “Generally implied” means that it is custom or common practice for the organization, its customers and other interested parties, that the need or expectation under consideration is implied. A qualifier can be used to denote a specific type of requirement, e.g. product requirement, quality management requirement, customer requirement. A specified requirement is one which is stated, for example, in a document. Requirements can be generated by different interested parties.'
