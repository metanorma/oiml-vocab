  definition:
  - content: 'operating condition that must be fulfilled during measurement in order that a measuring instrument or measuring system perform as designed'
  id: 02325-R046-1-eng
  language_code: eng
  notes:
  - content: Rated operating conditions generally specify intervals of values for
      a quantity being measured and for any influence quantity. [OIML V2-200:2012,
      4.9]
  - content: 'For the application of this Recommendation, the terms "measuring instrument"
      and "measuring system" mean: electricity meter.'
