  notes:
  - content: 'Note 1:Measurement does not apply to nominal properties. Note 2: Measurement implies comparison of quantities or couting of entities. Note 3: Measurement presupposes a description of the quantity commensurate with the intended use of measurement result, a measurement procedure, and a calibrated measuring g system operating according to the specified measurement procedure, including the measurement conditions. Note 4: Annex C illustrates the terms and definitions related to the measurement process and their usage in thie OIML Document.'
