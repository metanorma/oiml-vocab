  - content: 'volume indicated (marked) on the tank or its compartment'
  id: 02245-R080-1-eng
  language_code: eng
  notes:
  - content: 'Note 1: The nominal capacity value usually corresponds to the volume of liquid which a tank or compartment contains at reference temperature when filled up to the maximum permissible level or volume mark. Note 2: The nominal capacity value can be limited by safety regulations.'
