  definition:
  - content: 'cumulative measuring process with no definite and that cannot be stopped and continued again by a user/operator without falsifying the result of measurement'
  id: 03335-eng
  language_code: eng
  notes:
  - content: 'Note 1: Examples include: a) continuous totalising automatic weighing instrument, b) heat meter. Note 2: See also interruptible cumulative measurement (3.2.27)'
