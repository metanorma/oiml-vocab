  definition:
  - content: 'cumulative measuring process with no definite and that cannot be stopped and continued again by a user/operator without falsifying the result of measurement'
  id: 03335-eng
  language_code: eng
  notes:
  - content: 'Examples include: a) continuous totalising automatic weighing instrument,
      b) heat meter.'
  - content: See also interruptible cumulative measurement (3.2.27)
