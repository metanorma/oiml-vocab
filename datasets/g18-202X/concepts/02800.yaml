  definition:
  - content: 'algebraic mean of error shift values calculated from samples of the same grain type with different protein (PMB) levels'
  id: 02800-eng
  language_code: eng
  notes:
  - content: 'Note:The resulting ‘average’ value is indicative of the average variation over the encompassed measurement range, as opposed to the variation in measured values at one point of the range. In this Recommendation, reference to a resulting ‘mean’ value is reserved for the mean of replicated measurements, i.e. the mean of measured values on the same test sample (usually taken under repeatability conditions).'
