  definition:
  - content: 'quotient of change in an indication of measuring system and the corresponding change in a value of quantity being measured (OIML V 2-200, 4.12)'
  id: 03488-eng
  language_code: eng
  notes:
  - content: Sensitivity of measuring system can depend on the value of the quantity
      being measured.
  - content: The change considered in a value of a quantity being measured must be
      large compared with the resolution.
  - content: In the scope of this Recommendation, sensitivity relates to the added
      substance which is not identical with the measurand.
