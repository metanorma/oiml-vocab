  definition:
  - content: 'laboratory of an authorised institute responsabile for a legal control of measuring instruments, e.g. type approval, verification, etc.'
  id: 03183-eng
  language_code: eng
  notes:
  - content: 'Note 1 The recommended role of such an institute is described in detail in OIML D 1:2012, 3.2.2.3 [10]. Note 2 Legal metrology laboratories are generally laboratories of the state legal metrology services or private metrology laboratories charged (authorised) by the national (legal) metrology authority to carry out legal control fo measuring instruments within a defined scope.'
