    type: accepted
  definition:
  - content: 'laboratory of an authorised institute responsabile for a legal control of measuring instruments, e.g. type approval, verification, etc.'
  id: 03183-eng
  language_code: eng
  notes:
  - content: The recommended role of such an institute is described in detail in
      OIML D 1:2012, 3.2.2.3 [10].
  - content: Legal metrology laboratories are generally laboratories of the state
      legal metrology services or private metrology laboratories charged (authorised)
      by the national (legal) metrology authority to carry out legal control fo
      measuring instruments within a defined scope.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: 'legal metrology laboratory (legal metrology services)'
