  definition:
  - content: '(mathematical) function which maps values from a large (possibly very large) domain into a smaller range (OIMLD 31, 3.1.20)'
  id: 03095-eng
  language_code: eng
  notes:
  - content: 'Note: A “good” hash function is such that the results of applying the function to a (large) set of values in the domain will be evenly distributed (and apparently at random) over the range.'
