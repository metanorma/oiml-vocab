  definition:
  - content: 'network of arbitrary participants (electronic devices with arbitrary functions). The number, identity and location of a participant can be dynamic and unknown to the other participants. This is in contrast to a closed network [D 31, 3.1.6] which is a network of a fixed number of participants with a known identity functionality and location [OIML D 31, 3.1.35]'
