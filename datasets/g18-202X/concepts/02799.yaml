  notes:
  - content: 'Note:The assessment requires calculation of , the bias over a set of test samples or the ‘calibration bias’, and the standard error of prediction (SEP) which is the standard deviation of measurement errors from the same sample set. Refer to R 146-2, Annex A, A.7.1 for the calculation of   and SEP from measured values. The limiting values for  and SEP in 4.5, Table 4 shall be observed in order to deem a calibration as sufficiently accurate.'
