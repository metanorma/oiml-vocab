  definition:
  - content: 'difference between the error of indication and the intrinsic error of a measuring instrument'
  id: 02329-R046-1-eng
  language_code: eng
  notes:
  - content: 'Note 1: Principally, a fault is the result of an undesired change of data contained in or flowing through a measuring instrument. Note 2: From the definition it follows that a "fault" is a numerical value which is expressed either in a unit of measurement or as a relative value, for instance as a percentage. [OIML D11:2004, 3.9] Note 3: In this Recommendation, the above definition does not apply to the term ‘earth fault’, in which the word ‘fault’ has its usual dictionary meaning.'
