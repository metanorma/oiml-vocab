  definition:
  - content: 'measuring instrument providing an output signal carrying information about the value of the quantity being measured Examples:  Voltmeter, micrometer, thermometer, electronic balance.'
  id: 03107-eng
  language_code: eng
  notes:
  - content: 'Note 1:  An indicating measuring instrument may provide a record of its indication. Note 2:  An output signal may be presented in visual or acustic for. It may also be transmitted to one more other devices.'
