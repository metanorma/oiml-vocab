data:
  dates:
  - date: '2026-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: 'The factor calculated using the Student’s t inverse cumulative distribution function (tp, n-1) with p as the probability equivalent to 0.005 and (n–1) as the degrees of freedom, and a finite population correction factor (N–n)/(N–1) with n as the sample size and N as the inspection lot size'
  id: 02508-eng
  language_code: eng
  notes:
  - content: 'Note 1:SCF always has a positive sign because tp, n-1 has a negative sign for p = 0.005. Note 2:See Annex F, F.3 for the statistical background to SCF.'
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: 'sample correction factor (SCF)'
