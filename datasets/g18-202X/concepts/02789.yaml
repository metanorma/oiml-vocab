  notes:
  - content: 'NOTE 1 Reference operating conditions specify intervals of values of
      the measurand and of the influence quantities.'
  - content: 'NOTE 2 In IEC 60050-300, item 311-06-02, the term "reference condition"
      refers to an operating condition under which the specified instrumental measurement
      uncertainty is the smallest possible.'
