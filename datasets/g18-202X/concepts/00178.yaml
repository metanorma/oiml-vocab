  definition:
  - content: 'control exercised in respect of the manufacture, import, installation, use, maintenance and repair of a measuring instrument and/or in respect of its use, performed in order to check that it is used correctly as regards the observance of metrology laws and regulations [VIML, 2.3]'
  id: 00178-eng
  language_code: eng
  notes:
  - content: 'Note: Metrological supervision includes checking the correctness of the quantities indicated on and contained in prepackages.'
