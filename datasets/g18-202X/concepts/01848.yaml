  definition:
  - content: 'absorbance A is proportional to the optical path length b and the amount of substance concentration c'
  id: 01848-eng
  language_code: eng
  notes:
  - content: 'Conditions for validity: A beam of parallel monochromatic radiation
      traverses, at normal incidence, an absorbing medium with planeparallel surfaces
