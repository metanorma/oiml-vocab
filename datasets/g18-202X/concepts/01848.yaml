  notes:
  - content: 'Note 1 :  Conditions for validity: A beam of parallel monochromatic radiation traverses, at normal incidence, an absorbing medium with planeparallel surfaces and which is homogeneous, isotropic, non-luminescent and non-scattering. Note 2:  Adapted from ISO 6286, clause 3.3.'
