    type: accepted
  definition:
  - content: 'transaction conclusion when the parties interested in the transaction have made their agreement known (explicitly or implicitly) regarding the amount of the transaction (this may be accomplished by a payment, signing a credit card voucher, signing a delivery order, etc.)'
  id: 03493-eng
  language_code: eng
  notes:
  - content: 'Note: The parties interested in a transaction may be the parties themselves or their representatives (for example, the employee in a filling station or the driver of a truck).'
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: 'settlement of a transaction'
