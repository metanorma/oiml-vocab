  definition:
  - content: 'device intended to perform a particular function, directly involved in elaborating, transmitting or displaying measurement results The main ancillary devices are: repeating indicating device, printing device, memory device, and communication device.'
  id: 02653-eng
  language_code: eng
  notes:
  - content: 'Note 1:An ancillary device is not necessarily subject to metrological control. Note 2:   An ancillary device may be integrated in the gas meter.'
