  definition:
  - content: 'operating condition prescribed for evaluating the performance of a measuring instrument or measuring system or for comparison of measurement results'
  id: 03727-eng
  language_code: eng
  notes:
  - content: 'Reference conditions specify intervals of values of the measurand
      and influence quantities.'
  - content: 'In IEC 60050-300, item 311-06-02, the term "reference condition"
      refers to an operating condition under which the specified instrumental measurement
      uncertainty is the smallest possible.'
