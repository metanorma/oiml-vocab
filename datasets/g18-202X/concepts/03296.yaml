  id: 03296-eng
  language_code: eng
  notes:
  - content: A metrological traceability chain id defined through a calibration hierarchy.
  - content: A metrological traceability chain is used to establish metrological
      traceability of measurement result.
  - content: A comparison between two measurement standards may be vied as a calibration
      if the comparison is used to chek and, if necessary, correct the quantity
      value and measurement uncertainty attributes to one of the measurement standards.
