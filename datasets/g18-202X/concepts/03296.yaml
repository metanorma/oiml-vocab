  definition:
  - content: 'sequence of measurement standards and calibrations that is used to relate a measurement result to a reference [VIM, 2.42]'
  id: 03296-eng
  language_code: eng
  notes:
  - content: 'Note 1: A metrological traceability chain id defined through a calibration hierarchy. Note 2: A metrological traceability chain is used to establish metrological traceability of measurement result. Note 3: A comparison between two measurement standards may be vied as a calibration if the comparison is used to chek and , if necessary, correct the quantity value and measurement uncertainty attributes to one of the measurement standards.'
