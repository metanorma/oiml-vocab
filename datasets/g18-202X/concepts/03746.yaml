  definition:
  - content: 'measurement error due to a measurement angle which differs from the configured value, the nominal value or the value measured by the instrument'
  id: 03746-eng
  language_code: eng
  notes:
  - content: 'Note: The name of this term comes from the fact that the component of the velocity vector parallel to the line connecting the speed meter and the vehicle is given by vm = v ∙ cos(α), where the measurement angle α has in general a horizontal and a vertical component.'
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: 'cosine error'
