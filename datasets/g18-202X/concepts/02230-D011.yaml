  definition:
  - content: 'influence quantity having a value which ranges within the rated operating conditions of a measuring instrument [VIML 5.18]'
  id: 02230-D011-eng
  language_code: eng
  notes:
  - content: 'Note 1: The rated operating conditions shall be in conformity with the
      applicable requirements specified in the applicable Recommendation.'
  - content: 'Note 2: The variation of an indication as a consequence of an influence
      factor is considered an error and not a fault.'
