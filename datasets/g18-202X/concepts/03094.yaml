    type: accepted
  definition:
  - content: '(mathematical) function which maps data of arbitrary size into data of fixed size called a digest adapted from [ISO/IEC 9594-8:2017] [3]'
  id: 03094-eng
  language_code: eng
  notes:
  - content: 'Note 1: A “good” hash function is such that the results of applying the function to a (large) set of values in the domain will be evenly distributed (and apparently at random) over the range. Note 2: A cryptographic hash function has three additional properties: collision-resistance, preimage resistance, and second preimage resistance, where preimage resistance refers to the inability (computational infeasibility) to reconstruct a preimage or message digest.'
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: 'hash function'
