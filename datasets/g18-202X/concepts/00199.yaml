    type: accepted
  definition:
  - content: 'business responsible for designing and manufacturing a measuring instrument or a pre-packaged product with a view to placing it lawfully on the market nationally or within a free trade area, on its own behalf'
  id: 00199-eng
  language_code: eng
  notes:
  - content: 'Note:  The instrument or other product can be produced by another business but it shall be placed on the market by and under the full responsibility of the manufacturer.'
  sources: []
