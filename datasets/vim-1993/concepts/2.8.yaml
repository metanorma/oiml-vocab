data:
  dates:
  - date: '1993-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: quantity that represents the measurand and which is functionally related
      to it
  examples:
  - content: the electrical output signal of a pressure transducer;
  - content: the frequency from a voltage-to-frequency converter;
  - content: the electromotive force of an electrochemical concentration cell used
      to measure a difference in concentration.
  id: 2.8-eng
  language_code: eng
  notes:
  - content: The input signal to a measuring system may be called the *stimulus*; the
      output signal may be called the *response*.
  terms:
  - type: expression
    normative_status: preferred
    designation: measurement signal
date_accepted: '1993-01-01T00:00:00+00:00'
