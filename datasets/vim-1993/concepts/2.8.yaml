data:
  dates:
  - date: '1993-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: grandeur qui représente le mesurande et qui lui est fonctionnellement
      liée
  examples:
  - content: le signal électrique de sortie d'un transducteur de pression;
  - content: la fréquence fournie par un convertisseur de tension-fréquence;
  - content: la force électromotrice d'une cellule électrochimique à concentration utilisée
      pour mesurer une différence de concentration.
  id: 2.8-fra
  language_code: fra
  notes:
  - content: Le signal d'entrée d'un système peut être appelé *«stimulus»* en anglais;
      le signal de sortie peut être appelé *«réponse»*.
  terms:
  - type: expression
    normative_status: preferred
    designation: signal de mesure
