  definition:
  - content: variation la plus grande du signal d'entrée qui ne provoque pas de variation
      détectable de la réponse d'un instrument de mesure, la variation du signal d'entrée
      étant lente et monotone
  examples: []
  id: 5.11-fra
  language_code: fra
  notes:
  - content: Le seuil de mobilité peut dépendre, par exemple, du bruit (interne ou
      externe) ou du frottement; il peut aussi dépendre de la valeur du signal d'entrée.
  terms:
  - type: expression
    normative_status: preferred
    designation: seuil de mobilité
