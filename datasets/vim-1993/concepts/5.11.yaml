    type: accepted
  definition:
  - content: largest change in a stimulus that produces no detectable change in the
      response of a measuring instrument, the change in the stimulus taking place
      slowly and monotonically
  examples: []
  id: 5.11-eng
  language_code: eng
  notes:
  - content: The discrimination threshold may depend on, for example, noise (internal
      or external) or friction. It may also depend on the value of the stimulus.
  terms:
  - type: expression
    normative_status: preferred
    designation: discrimination (threshold)
