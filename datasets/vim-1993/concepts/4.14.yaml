data:
  dates:
  - date: '1993-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: élément d'un appareil de mesure ou d'une chaîne de mesure qui est directement
      soumis à l'action du mesurande
  examples:
  - content: soudure de mesure d'un thermomètre thermoélectrique;
  - content: rotor d'un débitmètre à turbine;
  - content: tube de Bourdon d'un manomètre;
  - content: flotteur d'un appareil de mesure de niveau;
  - content: récepteur photoélectrique d'un spectrophotomètre.
  id: 4.14-fra
  language_code: fra
  notes:
  - content: Dans certains domaines, le terme «détecteur» est utilisé pour ce concept.
  terms:
  - type: expression
    normative_status: preferred
    designation: capteur
    grammar_info:
