data:
  dates:
  - date: '1993-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: element of a measuring instrument or measuring chain that is directly
      affected by the measurand
  examples:
  - content: measuring junction of a thermoelectric thermometer;
  - content: rotor of a turbine flow meter;
  - content: Bourdon tube of a pressure gauge;
  - content: float of a level-measuring instrument;
  - content: photocell of a spectrophotometer.
  id: 4.14-eng
  language_code: eng
  notes:
  - content: In some fields the term "detector" is used for this concept.
  terms:
  - type: expression
    normative_status: preferred
    designation: sensor
