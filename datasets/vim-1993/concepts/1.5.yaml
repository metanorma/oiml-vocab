data:
  dates:
  - date: '1993-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: expression that represents a quantity of a system of quantities as the
      product of powers of factors that represent the base quantities of the system
  examples:
  - content: in a system having base quantities length, mass and time, whose dimensions
      are denoted by stem:["unitsml(L)"], stem:["unitsml(M)"] and stem:["unitsml(T)"] respectively, stem:["unitsml(M*L^-2)"] is the dimension of force;
  - content: in the same system of quantities, stem:["unitsml(M*L^-3)"] is the dimension of mass
      concentration as well as of mass density.
  id: 1.5-eng
  language_code: eng
  notes:
  - content: The factors that represent the base quantities are called "dimensions"
      of these base quantities.
  - content: For details of the relevant algebra, see ISO 31-0.
  terms:
  - type: expression
    normative_status: preferred
    designation: dimension of a quantity
date_accepted: '1993-01-01T00:00:00+00:00'
entry_status: valid
id: f7d4822f-8e67-4a98-83f4-5351fb3cb574
