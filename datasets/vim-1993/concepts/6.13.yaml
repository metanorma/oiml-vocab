data:
  dates:
  - date: '1993-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: material or substance one or more of whose property values are sufficiently
      homogeneous and well established to be used for the calibration of an apparatus,
      the assessment of a measurement method, or for assigning values to materials
  examples: []
  id: 6.13-eng
  language_code: eng
  notes:
  - content: A reference material may be in the form of a pure or mixed gas, liquid
      or solid. Examples are water for the calibration of viscometers, sapphire as
      a heat-capacity calibrant in calorimetry, and solutions used for calibration
      in chemical analysis.
  - content: This definition, including the Note, is taken from ISO Guide 30:1992.
  terms:
  - type: expression
    normative_status: preferred
    designation: reference material (RM)
date_accepted: '1993-01-01T00:00:00+00:00'
