data:
  dates:
  - date: '1993-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: matériau ou substance dont une (ou plusieurs) valeur(s) de la (des) propriété(s)
      est (sont) suffisamment homogène(s) et bien définie(s) pour permettre de l'utiliser
      pour l'étalonnage d'un appareil, l'évaluation d'une méthode de mesurage ou l'attribution
      de valeurs aux matériaux
  examples: []
  id: 6.13-fra
  language_code: fra
  notes:
  - content: Un matériau de référence peut se présenter sous
      la forme d'un gaz, d'un liquide ou d'un solide, pur ou composé. Des exemples
      sont l'eau pour l'étalonnage des viscosimètres, le saphir qui permet d'étalonner
      la capacité thermique en calorimétrie et les solutions utilisées pour l'étalonnage
      dans l'analyse chimique.
  - content: Cette définition (y compris la note) est extraite du Guide ISO 30:1992.
  terms:
  - type: expression
    normative_status: preferred
    designation: matériau de référence (MR)
    grammar_info:
    - gender: m
date_accepted: '1993-01-01T00:00:00+00:00'
entry_status: valid
