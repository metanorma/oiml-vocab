data:
  dates:
  - date: '2007-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: '*measured quantity value* minus a *reference quantity value*'
  examples: []
  id: 2.16-eng
  language_code: eng
  notes:
  - content: |
      The concept of 'measurement error' can be used both

      . when there is a single reference quantity value to refer to, which occurs if a *calibration*
      is made by means of a *measurement standard* with a *measured quantity value* having
      a negligible *measurement uncertainty* or if a *conventional quantity value* is
      given, in which case the measurement error is known, and

      . if a *measurand* is supposed to be represented by a unique *true quantity value* or a set of true
      quantity values of negligible range, in which case the measurement error is
      not known.
  - content: Measurement error should not be confused with production error or mistake.
  terms:
  - type: expression
    normative_status: preferred
    designation: measurement error
  - type: expression
    normative_status: admitted
    designation: error of measurement
  - type: expression
    normative_status: admitted
    designation: error
date_accepted: '2007-01-01T00:00:00+00:00'
entry_status: valid
