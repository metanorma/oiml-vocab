  examples:
  - content: The electronvolt (about stem:[1.60218 xx 10^{-19} "unitsml(J)"]) is an off-system measurement
      unit of energy with respect to the *SI*.
  - content: Day, hour, minute are off-system measurement units of time with respect to the SI.
