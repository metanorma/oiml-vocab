    type: accepted
  definition:
  - content: unité de mesure obtenue en divisant une unité de mesure donnée par un
      entier supérieur à un
  examples:
  - content: Le millimètre est un sous-multiple décimal du mètre.
  - content: Pour l'angle plan, la seconde est un sous-multiple non décimal de la minute
  id: 1.18-fra
  language_code: fra
  notes:
  - content: Les préfixes SI pour les sous-multiples décimaux des *unités de base*
      et des *unités dérivées* du SI sont donnés à la note 5 de 1.16.
  terms:
  - type: expression
    normative_status: preferred
    designation: sous-multiple d'une unité
