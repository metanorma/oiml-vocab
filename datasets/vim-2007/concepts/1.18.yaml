data:
  dates:
  - date: '2007-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: measurement unit obtained by dividing a given measurement unit by an
      integer greater than one
  examples:
  - content: The millimetre is a decimal submultiple of the metre.
  - content: For plane angle, the second is a non-decimal submultiple of the minute
  id: 1.18-eng
  language_code: eng
  notes:
  - content: SI prefixes for decimal submultiples of SI *base units* and SI *derived
      units* are given in note 5 of 1.16.
  terms:
  - type: expression
    normative_status: preferred
    designation: submultiple of a unit
date_accepted: '2007-01-01T00:00:00+00:00'
entry_status: valid
