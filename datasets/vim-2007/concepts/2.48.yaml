data:
  dates:
  - date: '2007-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: relation mathématique entre toutes les *grandeurs* qui interviennent dans
      un *mesurage*
  examples: []
  id: 2.48-fra
  language_code: fra
  notes:
  - content: Une forme générale d'un modèle de mesure est l'équation stem:[h(Y, X_1, ..., X_n) = 0],
      où stem:[Y], la *grandeur de sortie dans le modèle de mesure*, est le *mesurande*, dont la
      *valeur* doit être déduite de l'information sur les *grandeurs d'entrée dans le modèle de mesure*
      stem:[X_1, ..., X_n].
  - content: Dans les cas plus complexes où il y a deux grandeurs de sortie ou plus,
      le modèle de mesure comprend plus d'une seule équation.
  terms:
  - type: expression
    normative_status: preferred
    designation: modèle de mesure
    grammar_info:
    - gender: m
  - type: expression
    normative_status: admitted
    designation: modèle
    grammar_info:
    - gender: m
