data:
  dates:
  - date: '2007-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: ensemble d'un ou plusieurs *instruments de mesure* et souvent d'autres
      dispositifs, comprenant si nécessaire réactifs et alimentations, assemblés et
      adaptés pour fournir des informations destinées à obtenir des *valeurs mesurées*
      dans des intervalles spécifiés pour des *grandeurs* de *natures* spécifiées
  examples: []
  id: 3.2-fra
  language_code: fra
  notes:
  - content: Un système de mesure peut consister en un seul instrument de mesure.
  terms:
  - type: expression
    normative_status: preferred
    designation: système de mesure
    grammar_info:
    - gender: m
