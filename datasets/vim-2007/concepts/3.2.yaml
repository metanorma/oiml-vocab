data:
  dates:
  - date: '2007-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: set of one or more *measuring instruments* and often other devices, including
      any reagent and supply, assembled and adapted to give information used to generate
      *measured quantity values* within specified intervals for *quantities* of specified
      *kinds*
  examples: []
  id: 3.2-eng
  language_code: eng
  notes:
  - content: A measuring system may consist of only one measuring instrument.
  terms:
  - type: expression
    normative_status: preferred
    designation: measuring system
