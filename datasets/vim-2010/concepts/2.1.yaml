data:
  dates:
  - date: '2010-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: processus consistant à obtenir expérimentalement une ou plusieurs *valeurs*
      que l'on peut raisonnablement attribuer à une {{1.1,grandeur}}
  examples: []
  id: 2.1-fra
  language_code: fra
  notes:
  - content: Les mesurages ne s'appliquent pas aux *propriétés qualitatives*.
  - content: Un mesurage implique la comparaison de grandeurs ou le comptage d'entités.
  - content: Un mesurage suppose une description de la grandeur compatible avec l'usage
      prévu d'un {{2.9,résultat de mesure}}, une {{2.6,procédure de mesure}} et un *système
      de mesure* étalonné fonctionnant selon la procédure de mesure spécifiée, incluant
      les conditions de mesure.
  terms:
  - type: expression
    normative_status: preferred
    designation: mesurage
    grammar_info:
    - gender: m
  - type: expression
    normative_status: admitted
    designation: mesure
    grammar_info:
    - gender: f
date_accepted: '2010-01-01T00:00:00+00:00'
