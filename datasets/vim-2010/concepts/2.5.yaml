  - date: '2010-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: generic description of a logical organization of operations used in
      a *measurement*
  examples: []
  id: 2.5-eng
  language_code: eng
  notes:
  - content: |
      Measurement methods may be qualified in various ways such as:
      
      * substitution measurement method,
      * differential measurement method, and
      * null measurement method; or
      * direct measurement method, and
      * indirect measurement method.
      
      See IEC 60050-300:2001.
  terms:
  - type: expression
    normative_status: preferred
    designation: measurement method
  - type: expression
    normative_status: admitted
    designation: method of measurement
