data:
  dates:
  - date: '2010-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: réalisation de la définition d'une {{1.1,grandeur}} donnée, avec une {{1.19,valeur}}
      déterminée et une {{2.26,incertitude de mesure}} associée, utilisée comme référence
  examples:
  - content: Étalon de masse de stem:[1 "unitsml(kg)"] avec une {{2.30,incertitude-type}}
      associée de stem:[3 "unitsml(ug)"]
  - content: Résistance étalon de stem:[100 "unitsml(Ohm)"] avec une {{2.30,incertitude-type}}
      associée de stem:[1 "unitsml(uOhm)"]
  - content: Étalon de fréquence à césium avec une {{2.30,incertitude-type}} associée
      de stem:[2 xx 10^{-15}]
  - content: Solution tampon de référence ayant un pH de 7,072 avec une {{2.30,incertitude-type}}
      associée de 0,006
  - content: Série de solutions de référence de cortisol dans du sérum
      humain, dont chaque solution a une valeur certifiée avec une *incertitude de
      mesure*
  - content: '*Matériau de référence* fournissant des valeurs avec les incertitudes
      de mesure associées pour la concentration en masse de dix protéines différentes'
  id: 5.1-fra
  language_code: fra
  notes:
  - content: La « réalisation de la définition d'une grandeur donnée » peut être fournie
      par un {{3.2,système de mesure}}, une {{3.6,mesure matérialisée}} ou un {{5.13,matériau de référence}}
  - content: Un étalon sert souvent de référence dans l'obtention de *valeurs mesurées*
      et d'incertitudes de mesure associées pour d'autres grandeurs de même {{1.2,nature}},
      établissant ainsi une {{2.41,traçabilité métrologique}} par l'intermédiaire de l'{{2.39,étalonnage}}
      d'autres étalons, *instruments de mesure* ou systèmes de mesure
  - content: Le terme « réalisation » est employé ici dans son sens le plus général.
      Il désigne trois procédures de réalisation. La première, la réalisation stricto
      sensu, est la réalisation physique de l'{{1.9,unité de mesure}} à partir de sa définition.
      La deuxième, appelée « reproduction », consiste, non pas à réaliser l'unité
      à partie de sa définition, mais à construire un étalon hautement reproductible
      fondé sur un phénomène physique, par exemple l'emploi de lasers stabilisés en
      fréquence pour construire un étalon du mètre, l'emploi de l'effet Josephson
      pour le volt ou de l'effet Hall quantique pour l'ohm. La troisième procédure
      consiste à adopter une mesure matérialisée comme étalon. C'est le cas de l'étalon
      de stem:[1 "unitsml(kg)"].
  - content: L'{{2.30,incertitude-type}} associée à un étalon est toujours une composante
      de l'{{2.31,incertitude-type composée}} (voir GUM, 2.3.4) dans un {{2.9,résultat de mesure}}
      obtenu en utilisant l'étalon. Cette composante est souvent petite par rapport
      à d'autres composantes de l'incertitude-type composée
  - content: La valeur de la grandeur et l'incertitude de mesure doivent être déterminées
      au moment où l'étalon est utilisé
  - content: Plusieurs grandeurs de même nature ou de natures différentes peuvent
      être réalisées à l'aide d'un seul dispositif, appelé aussi étalon
  - content: Le mot « embodiment » est quelquefois utilisé en anglais à la place de
      « realization »
  - content: 'Dans la science et la technologie, le mot anglais « standard » est utilisé
      avec au moins deux significations différentes : celle de spécification, recommandation
      technique ou autre document normatif, et celle d''étalon (en anglais « measurement
      standard »). Seule la deuxième signification relève du présent Vocabulaire.'
  - content: Le terme « étalon » est parfois utilisé pour désigner d'autres outils
      métrologiques, par exemple un étalon logiciel (voir l'ISO 5436-2)
  terms:
  - type: expression
    normative_status: preferred
    designation: étalon
    grammar_info:
    - gender: m
date_accepted: '2010-01-01T00:00:00+00:00'
