data:
  dates:
  - date: '2010-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: "{{1.1,grandeur}} d'un sous-ensemble choisi par convention dans un *système
      de grandeurs* donné de façon à ce qu'aucune grandeur du sous-ensemble ne puisse
      être exprimée en fonction des autres"
  id: 1.4-fra
  language_code: fra
  notes:
  - content: Le sous-ensemble mentionné dans la définition est appelé l'ensemble des
      grandeurs de base.
    examples:
    - content: L'ensemble des grandeurs de base du {{1.6,Système international de grandeurs}}
        ({{1.6,ISQ}}) est donné en 1.6.
  - content: Les grandeurs de base sont considérées comme mutuellement indépendantes
      puisqu'une grandeur de base ne peut être exprimée par un produit de puissances
      des autres grandeurs de base.
  - content: On peut considérer la grandeur « nombre d'entités » comme une grandeur
      de base dans tout système de grandeurs.
  terms:
  - type: expression
    normative_status: preferred
    designation: grandeur de base
    grammar_info:
    - gender: f
date_accepted: '2010-01-01T00:00:00+00:00'
entry_status: valid
id: 993a5b82-c576-4c49-a758-7250fd1fd99e
