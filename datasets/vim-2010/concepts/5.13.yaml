data:
  dates:
  - date: '2010-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: material, sufficiently homogeneous and stable with reference to specified
      properties, which has been established to be fit for its intended use in {{2.1,measurement}}
      or in examination of *nominal properties*
  examples: []
  id: 5.13-eng
  language_code: eng
  notes:
  - content: Examination of a nominal property provides a nominal property value and
      associated uncertainty. This uncertainty is not a {{2.26,measurement uncertainty}}.
  - content: Reference materials with or without assigned *quantity values* can be
      used for measurement {{2.15,precision}} control whereas only reference materials with
      assigned quantity values can be used for {{2.39,calibration}} or {{2.14,measurement trueness}}
      control.
  - content: "'Reference material' comprises materials embodying *quantities* as well
      as *nominal properties*."
    examples:
    - content: (of reference materials embodying quantities)
    - content: Water of stated purity, the dynamic viscosity of which is used to
        calibrate viscometers.
    - content: Human serum without an assigned quantity value for the
        amount-of-substance concentration of the inherent cholesterol, used only as
        a measurement precision control material.
    - content: Fish tissue containing a stated mass fraction of a dioxin, used as a
        {{5.12,calibrator}}.
    - content: (of reference materials embodying nominal properties)
    - content: Color chart indicating one or more specified colors.
    - content: DNA compound containing a specified nucleotide sequence.
    - content: Urine containing 19-androstenedione.
  - content: A reference material is sometimes incorporated into a specially fabricated
      device.
    examples:
    - content: Substance of known triple-point in a triple-point cell.
    - content: Glass of known optical density in a transmission filter holder.
    - content: Spheres of uniform size mounted on a microscope slide.
  - content: Some reference materials have assigned quantity values that are metrologically
      traceable to a {{1.9,measurement unit}} outside a {{1.13,system of units}}. Such materials
      include vaccines to which International Units (IU) have been assigned by the
      World Health Organization.
  - content: In a given measurement, a given reference material can only be used for
      either calibration or quality assurance.
  - content: The specifications of a reference material should include its material
      traceability, indicating its origin and processing (Accred Qual Assur:2006^[7]^).
  - content: ISO/REMCO has an analogous definition (Accred Qual Assur:2006^[7]^) but
      uses the term "measurement process" to mean 'examination' (ISO 15189:2007, 3.4),
      which covers both measurement of a quantity and examination of a nominal property.
  terms:
  - type: expression
    normative_status: preferred
    designation: reference material
  - type: expression
    normative_status: admitted
    designation: RM
date_accepted: '2010-01-01T00:00:00+00:00'
