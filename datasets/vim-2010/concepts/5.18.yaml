data:
  dates:
  - date: '2010-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: "*quantity value* used as a basis for comparison with values of *quantities*
      of the same *kind*"
  examples: []
  id: 5.18-eng
  language_code: eng
  notes:
  - content: A reference quantity value can be a *true quantity value* of a *measurand*,
      in which case it is unknown, or a *conventional quantity value*, in which case
      it is known.
  - content: |
      A reference quantity value with associated *measurement uncertainty*
      is usually provided with reference to

      . a material, e.g. a *certified reference material*,
      . a device, e.g. a stabilized laser,
      . a *reference measurement procedure*,
      . a comparison of *measurement standards*
  terms:
  - type: expression
    normative_status: preferred
    designation: reference quantity value
  - type: expression
    normative_status: admitted
    designation: reference value
date_accepted: '2010-01-01T00:00:00+00:00'
