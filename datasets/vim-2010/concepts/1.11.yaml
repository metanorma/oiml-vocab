data:
  dates:
  - date: '2010-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: "{{1.9,unité de mesure}} d'une {{1.5,grandeur dérivée}}"
  examples:
  - content: Le mètre par seconde, symbole stem:["unitsml(m/s)"], et le centimètre par seconde,
      symbole stem:["unitsml(cm/s)"], sont des unités dérivées de vitesse dans le {{1.16,SI}}. Le kilomètre
      par heure, symbole stem:["unitsml(km/h)"], est une unité de vitesse en dehors du SI mais dont
      l'usage est accepté avec le SI. Le nœud, égal à un mille marin par heure, est une unité de
      vitesse en dehors du SI.
  id: 1.11-fra
  language_code: fra
  notes: []
  terms:
  - type: expression
    normative_status: preferred
    designation: unité dérivée
