data:
  dates:
  - date: '2010-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: closeness of agreement between a {{2.10,measured quantity value}} and a *true
      quantity value* of a *measurand*
  examples: []
  id: 2.13-eng
  language_code: eng
  notes:
  - content: The concept 'measurement accuracy' is not a {{1.1,quantity}} and is not given
      a {{1.20,numerical quantity value}}. A {{2.1,measurement}} is said to be more accurate when
      it offers a smaller {{2.16,measurement error}}.
  - content: The term "measurement accuracy" should not be used for {{2.14,measurement trueness}}
      and the term {{2.15,measurement precision}} should not be used for 'measurement accuracy'
      which, however, is related to both concepts.
  - content: "'Measurement accuracy' is sometimes understood as closeness of agreement
      between measured quantity values that are being attributed to the measurand."
  terms:
  - type: expression
    normative_status: preferred
    designation: measurement accuracy
  - type: expression
    normative_status: admitted
    designation: accuracy of measurement
  - type: expression
    normative_status: admitted
    designation: accuracy
date_accepted: '2010-01-01T00:00:00+00:00'
