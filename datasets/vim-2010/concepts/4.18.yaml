  definition:
  - content: '{{2.10,valeur mesurée}}, obtenue par une {{2.6,procédure de mesure}} donnée, pour laquelle
      la probabilité de déclarer faussement l''absence d''un constituant dans un matériau
      est stem:[beta], étant donnée la probabilité stem:[alpha] de déclarer faussement sa présence'
  examples: []
  id: 4.18-fra
  language_code: fra
  notes:
  - content: L'IUPAC recommande des valeurs par défaut de stem:[alpha] et stem:[beta] égales à stem:[0,05].
  - content: "[Applicable uniquement au texte anglais]."
  - content: Le terme « sensibilité » est à proscrire au sens de limite de détection.
  terms:
  - type: expression
    normative_status: preferred
    designation: limite de détection
