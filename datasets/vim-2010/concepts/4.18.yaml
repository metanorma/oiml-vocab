data:
  dates:
  - date: '2010-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: '{{2.10,measured quantity value}}, obtained by a given {{2.6,measurement procedure}}, for
      which the probability of falsely claiming the absence of a component in a material
      is stem:[beta], given a probability stem:[alpha] of falsely claiming its presence'
  examples: []
  id: 4.18-eng
  language_code: eng
  notes:
  - content: IUPAC recommends default values for stem:[alpha] and stem:[beta] equal to 0.05.
  - content: The abbreviation LOD is sometimes used.
  - content: The term "sensitivity" is discouraged for this concept.
  terms:
  - type: expression
    normative_status: preferred
    designation: detection limit
  - type: expression
    normative_status: admitted
    designation: limit of detection
