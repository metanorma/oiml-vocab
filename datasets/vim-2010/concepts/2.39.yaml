data:
  dates:
  - date: '2010-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: operation that, under specified conditions, in a first step establishes
      a relation between the *quantity values* with *measurement uncertainties* provided
      by *measurement standards* and corresponding *indications* with associated measurement
      uncertainties and, in a second step, uses this information to establish a relation
      for obtaining a {{2.9,measurement result}} from an indication
  examples: []
  id: 2.39-eng
  language_code: eng
  notes:
  - content: A calibration may be expressed by a statement, calibration function,
      {{4.30,calibration diagram}}, {{4.31,calibration curve}}, or calibration table. In some cases
      it may consist of an additive or multiplicative {{2.53,correction}} of the indication
      with associated measurement uncertainty.
  - content: Calibration should not be confused with {{3.11,adjustment of a measuring system}},
      often mistakenly called "self-calibration", nor with {{2.44,verification}} of calibration.
  - content: Often, the first step alone in the above definition is perceived as being
      calibration.
  terms:
  - type: expression
    normative_status: preferred
    designation: calibration
date_accepted: '2010-01-01T00:00:00+00:00'
entry_status: valid
