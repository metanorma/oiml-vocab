data:
  dates:
  - date: '2010-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: ensemble des *valeurs* de *grandeurs* d'une même {{1.2,nature}}, qu'un *instrument
      de mesure* ou un *système de mesure* donné peut mesurer avec une *incertitude
      instrumentale* spécifiée, dans des conditions déterminées
  examples: []
  id: 4.7-fra
  language_code: fra
  notes:
  - content: Dans certains domaines, le terme anglais est « measuring range » ou «
      measurement range ». En français, le terme « {{4.5,étendue de mesure}} » est parfois
      improprement employé.
  - content: Il convient de ne pas confondre la limite inférieure d'un intervalle
      de mesure avec la {{4.18,limite de détection}}.
  terms:
  - type: expression
    normative_status: preferred
    designation: intervalle de mesure
    grammar_info:
    - gender: m
date_accepted: '2010-01-01T00:00:00+00:00'
