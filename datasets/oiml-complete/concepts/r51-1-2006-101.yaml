  definition:
  - content: Fault greater than the verification scale interval, e.
  examples: []
  id: r51-1-2006-101-eng
  notes:
  - content: A significant fault does not include faults arising from simultaneous
      and mutually independent causes in the instrument or in its checking facility,
      faults that imply it is impossible to perform a measurement, faults that are
      so serious they will inevitably be noticed by all those interested in the measurement,
      transitory faults that are momentary variations in the indications that cannot
      be interpreted, memorized or transmitted as a measurement result.
  sources: []
