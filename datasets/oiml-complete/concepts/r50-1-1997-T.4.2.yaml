  definition:
  - content: Distance entre les deux lignes imaginaires passant à mi-distance entre
      les axes des rouleaux de pesage extrêmes et les axes des rouleaux porteurs les
      plus proches.
  examples: []
  id: r50-1-1997-fra-T.4.2-fra
  notes:
  - content: S'il n'y a qu'un rouleau de pesage, la longueur de pesage est égale à
      la moitié de la distance entre les axes des rouleaux porteurs les plus proches
      de chaque côté du rouleau de pesage.
