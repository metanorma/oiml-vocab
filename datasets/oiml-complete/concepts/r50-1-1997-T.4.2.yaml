data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: The distance between the two imaginary lines at the half distance between
      the axes of the end weighing rollers and the axes of the nearest carrying rollers.
  examples: []
  id: r50-1-1997-eng-T.4.2-eng
  notes:
  - content: When there is only one weighing roller, the weigh length is equal to
      half the distance between the axes of the nearest carrying rollers on either
      side of the weighing roller.
