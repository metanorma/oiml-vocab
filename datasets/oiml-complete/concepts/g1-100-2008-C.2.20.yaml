data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: a measure of dispersion, which is the sum of the squared deviations of
      observations from their average divided by one less than the number of observations
  examples:
  - content: For n observations x_1, x_2, ..., x_n with average x_bar = (1/n) sum
      x_i, the variance is s^2 = (1/(n-1)) sum (x_i - x_bar)^2.
  id: g1-100-2008-e-C.2.20-eng
  notes:
  - content: The sample variance is an unbiased estimator of the population variance.
  - content: The variance is n/(n-1) times the central moment of order 2.
  - content: 'Source citation: ISO 3534- 1'
