      Publ 2519, Evaporation Loss from Internal Floating-Roof Tanks, Third Edition, June 1983

      This publication contains a method for estimating total evaporative losses and/or the equivalent atmospheric hydrocarbon emissions from freely vented internal floating-roof tanks containing multicomponent hydrocarbon mixtures, as well as single component stocks. 28 pages.

      Price each, $7.00

      852-25210

      Bull. 2521, Use of Pressure-Vacuum Vent Valves for Atmospheric Pressure Tanks to Reduce Evaporation Loss. 1966

      This bulletin describes the use of pressure-vacuum vent valves to reduce evaporation loss of petroleum and petroleum products. stored at essentially atmospheric pressure in aboveground fixed-roof tanks and variable vapor-space systems. It also presents factors to be considered when selecting vent valves and serves to increase the awareness of operation and maintenance requirements. 13 pages.

      Price each, $4.00
