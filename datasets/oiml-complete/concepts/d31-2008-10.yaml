data:
  dates:
  - date: '2026-07-15T11:14:13Z'
    type: accepted
  definition:
  - content: Conjunto de datos que contienen la clave pública de un instrumento de
      medida o de una persona más una identificación única del sujeto; p. ej. el número
      de serie del instrumento de medida, o el nombre o el número de identificación
      personal (PIN) de la persona. Una institución confiable con firma electrónica
      es la firmante del conjunto de datos. La asignación de una clave a un sujeto
      puede verificarse utilizando la clave pública de la institución confiable y
      descifrando la firma del certificado.
  examples: []
