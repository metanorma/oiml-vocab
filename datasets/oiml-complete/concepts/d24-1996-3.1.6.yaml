  definition:
  - content: L'ouverture nominale de visée, n, est une ouverture de visée pour une
      distance de visée donnée, L, telle que la température d'une source de rayonnement
      de diamètre D=n x L peut être mesurée correctement. Habituellement, l'ouverture
      nominale de visée est fixée pour une distance de 1 m. Cependant, l'instrument
      peut être réglé pour d'autres distances de visée à condition que ces distances
      soient indiquées dans les documents d'accompagnement.
