  definition:
  - content: Pour les besoins de l'évaluation de type/l'approbation de modèle, une
      famille de cellules de pesée réunit les cellules de pesée de même matériau ou
      combinaison de matériaux, de même conception de la technique de mesure, construites
      selon le même procédé, d'un même ensemble de spécifications, et d'un ou plusieurs
      groupes de cellules de pesée.
