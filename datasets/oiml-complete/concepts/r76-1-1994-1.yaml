    type: accepted
  definition:
  - content: Measuring instrument that serves to determine the mass of a body by using
      the action of gravity on this body. The instrument may also be used to determine
      other quantities, magnitudes, parameters or characteristics related to mass.
      According to its method of operation, a weighing instrument is classified as
      an automatic or nonautomatic instrument.
