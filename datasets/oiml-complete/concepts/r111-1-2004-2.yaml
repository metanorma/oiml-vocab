data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: 'Instrument indicating the apparent mass which is sensitive to the following
      forces:'
  - content: F_g = m × g   (Gravity)
  - content: F_b = V × ρ_a × g = (m/ρ) ρ_a × g   (Buoyancy equal to the weight of
      the displaced air)
  - content: F_z = μ_0 ∭_V (M + χH) (∂H/∂z) dV   (Vertical component of the magnetic
      interaction between the weight and the balance and/or the environment).
  - content: If the magnetic effects are negligible, for example the permanent magnetization
      (M) of the weight and the magnetic susceptibility (χ) are sufficiently small
      and the balance is calibrated with reference weights of well-known value, the
      balance may be used to indicate the conventional mass, m_c, of a body under
      conventionally chosen conditions.
  examples: []
