    type: accepted
  definition:
  - content: Dispositif de dégazage qui, comme le séparateur de gaz, mais dans des
      conditions de fonctionnement moins sévères, sépare d'une manière continue l'air
      ou les gaz contenus dans le liquide et qui arrête automatiquement l'écoulement
      du liquide dès que l'air ou les gaz accumulés sous la forme de poches peu mélangées
      avec le liquide risquent de pénétrer dans le compteur.
