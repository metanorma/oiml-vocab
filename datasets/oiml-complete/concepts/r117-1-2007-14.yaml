    type: accepted
  definition:
  - content: 'Système incorporé dans un ensemble de mesurage et qui permet de : vérifier
      la présence d''un dispositif nécessaire, détecter une non-conformité relative
      à la génération, la transmission et/ou l''indication d''une donnée de mesurage,
      et de la mettre en évidence, et de détecter et de mettre en évidence les défauts
      significatifs.'
