    type: accepted
  definition:
  - content: la procédure d'échantillonnage dans laquelle les préemballages devant
      être inclus dans un échantillon sont choisis de façon aléatoire dans le lot
      d'inspection (c'est-à-dire que chaque préemballage dans le lot d'inspection
      a la même chance d'être sélectionné pour être inclus dans l'échantillon)
  examples: []
  id: r87-2016-17-fra
  notes:
  - content: On l'appelle également « échantillonnage sans remplacement ».
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: échantillonnage aléatoire
  language_code: fra
