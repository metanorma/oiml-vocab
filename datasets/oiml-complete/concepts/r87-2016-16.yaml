  definition:
  - content: tous les éléments du préemballage qui ne sont pas des matériaux d'emballage
  examples: []
  id: r87-2016-16-fra
  notes:
  - content: Le produit inclut des liquides ou des gaz qui ont été mis avec le produit
      dans le préemballage et qui ne sont pas destinés à être laissés après utilisation
      du produit (par ex. l'air dans la mousse au chocolat).
  - content: Le produit inclut des liquides ou des gaz qui n'ont pas été mis avec
      le produit dans le préemballage et qui sont destinés à être laissés après utilisation
      du produit (par ex. le liquide dans le fromage mozzarella, l'air dans le gel
      coiffant).
  - content: Le produit inclut des liquides ou gaz qui n'ont pas été mis avec le produit
      dans le préemballage et qui ne sont pas destinés à être laissés après utilisation
      du produit (par ex. caillé à base de yaourt ou miel).
  sources: []
