    type: accepted
  definition:
  - content: A device which, like the gas separator but under less stringent operating
      conditions, continuously separates any air or gases contained in the liquid,
      and which automatically stops the flow of liquid if there is a risk of air or
      gases entering the meter.
  examples: []
  id: r117-1995-18-eng
  notes: []
  sources: []
