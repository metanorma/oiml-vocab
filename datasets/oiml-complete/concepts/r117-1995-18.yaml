  definition:
  - content: Dispositif qui, comme le séparateur de gaz mais dans des conditions de
      fonctionnement moins sévères, sépare d'une manière permanente l'air ou les gaz
      éventuellement contenus dans le liquide et qui arrête automatiquement l'écoulement
      du liquide dès que l'air ou les gaz accumulés risquent de pénétrer dans le compteur.
  examples: []
