  - content: Hierarchy scheme for a given type of measuring instrument in the particular
      country, containing the specification of the recommended (permissible) types
      of measuring instruments for individual levels of metrological traceability,
      requirements for their metrological characteristics (accuracy class, maximum
      permissible error, etc.) and recommended (permissible) methods and means of
      dissemination of units.
