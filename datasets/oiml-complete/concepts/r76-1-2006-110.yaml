data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: Durability error greater than e.
  - content: 'Errors, occurring after a period of instrument use, are not considered
      to be significant durability errors, even when they exceed e, if they are clearly
      the result of the failure of a device/component, or of a disturbance and for
      which the indication:'
  - content: "- cannot be interpreted, memorized, or transmitted as a measurement
      result;"
  - content: "- implies the impossibility to perform any measurement; or"
  - content: "- is so obviously wrong that it is bound to be noticed by all those
      interested in the result of measurement."
  examples: []
  id: r76-1-2006-110-eng
  notes:
  - content: A durability error can be due to mechanical wear and tear or due to drift
      and ageing of electronic parts. The concept of significant durability error
      applies only to electronic parts.
  - content: For a multi-interval instrument, the value of e is that appropriate to
      the partial weighing range.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: significant durability error
  language_code: eng
  entry_status: valid
date_accepted: '2026-07-16T00:00:00+00:00'
