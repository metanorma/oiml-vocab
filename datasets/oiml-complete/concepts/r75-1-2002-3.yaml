  definition:
  - content: Compteur d'énergie thermique - fréquemment qualifié d'instrument "compact"
      - qui, dans le cadre de la procédure d'approbation de type et de vérification
      primitive, peut être considéré comme un instrument combiné comme défini en 3.2.
      Néanmoins, après vérification, ses sous-ensembles doivent être considérés comme
      inséparables.
