  definition:
  - content: Programs, data, type specific and device specific parameters that belong
      to the measuring instrument or module, and that define or fulfill functions
      which are subject to legal control.
  examples: []
  id: r107-2007-e-T.2.7.7.1-eng
  notes:
  - content: 'Examples of legally relevant software are: final results of the weighing
      including the decimal sign and the unit, identification of the weighing range
      and the load receptor (if several load receptors have been used).'
