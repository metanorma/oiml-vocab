  definition:
  - Conditions auxquelles le volume mesuré de gaz est converti (exemples: température
      de base et pression de base).
  examples: []
  id: r137-2012-30-fra
  notes:
  - content: Les conditions de fonctionnement et de base concernent le volume de gaz
      à mesurer ou seulement à indiquer et ne doivent pas être confondues avec les
      conditions assignées de fonctionnement et les conditions de référence qui font
      référence aux grandeurs d'influence.
