    type: accepted
  definition:
  - content: device within the EVSE that is not required to be active during the transaction
  examples:
  - content: An EVSE might have a display which shows advertisements for a business.
      This would be an ancillary device.
  id: g22-2022-e-2.2.13-eng
  notes:
  - content: Since the testing used in this Guide is all transactional, any device
      which is routinely required to be active during a transaction will have its
      effect tested automatically. Ancillary devices are devices which may or may
      not be active at any time but which are not used as part of the transactional
      process.
