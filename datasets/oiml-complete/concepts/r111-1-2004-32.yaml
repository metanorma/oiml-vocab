    type: accepted
  definition:
  - content: 'Gravitational force by which the body is attracted to the Earth. The
      word weight designates a quantity of the same nature as a force: the weight
      of a body is the product of its mass and the acceleration due to gravity.'
  examples: []
  id: r111-1-2004-32-eng
