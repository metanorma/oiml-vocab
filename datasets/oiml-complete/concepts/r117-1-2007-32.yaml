  definition:
  - content: Empty hose systems are measuring systems in which the transfer point
      is located upstream of the delivery hose in measuring systems designed to deliver
      product (and downstream of the receiving hose in measuring systems designed
      to receive product).
  examples: []
  id: r117-1-2007-32-eng
