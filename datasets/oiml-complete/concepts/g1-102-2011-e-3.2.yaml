    type: accepted
  definition:
  - content: quantity whose numerical value is a complex number
  examples: []
  id: g1-102-2011-e-3.2-eng
  notes:
  - content: A complex quantity Z can be represented by two real quantities in Cartesian
      form $ \boldsymbol {Z} \equiv \left(Z _ {\mathrm {R}}, Z _ {\mathrm {I}}\right)
      ^ {\top} = Z _ {\mathrm {R}} + \mathrm {i} Z _ {\mathrm {I}},$ where $ \top
      $ denotes "transpose", $ \mathrm{i}^{2}=-1 $ and $ Z_{\mathrm{R}} $ and $ Z_{\mathrm{I}}
      $ are, respectively, the real and imaginary parts of Z, or in polar form $ \boldsymbol
      {Z} \equiv \left(Z _ {r}, Z _ {\theta}\right) ^ {\top} = Z _ {r} \left(\cos
      Z _ {\theta} + \mathrm {i} \sin Z _ {\theta}\right) = Z _ {r} \mathrm {e} ^
      {\mathrm {i} Z _ {\theta}},$ where $ Z_{r} $ and $ Z_{\theta} $ are, respectively,
      the magnitude (amplitude) and phase of $ Z $ .
