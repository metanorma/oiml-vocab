data:
  dates:
  - date: '2026-07-15T00:00:00Z'
    type: accepted
  definition:
  - content: Instrument that requires the intervention of an operator during the weighing
      process, for example to deposit on or remove from the receptor the load to be
      measured and also to obtain the result. The instrument permits direct observation
      of the weighing results, either displayed or printed; both possibilities are
      covered by the word "indication".
  examples: []
  id: r76-1-1992-2-eng
  notes:
  - content: Terms such as "indicate", "indicating component" and their derivatives
      do not include printing.
  - content: In this Recommendation a nonautomatic weighing instrument is called an
      "instrument".
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Nonautomatic weighing instrument
  language_code: eng
  entry_status: valid
