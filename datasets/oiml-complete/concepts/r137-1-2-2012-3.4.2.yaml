  definition:
  - content: Grandeur d'influence dont la valeur se situe dans les limites spécifiées
      par cette Recommandation, mais en dehors des conditions assignées de fonctionnement
      spécifiées du compteur de gaz.
  examples: []
  id: r137-1-2-2012-fra-3.4.2-fra
  notes:
  - content: Une grandeur d'influence est une perturbation si les conditions assignées
      de fonctionnement ne sont pas fixées pour cette grandeur d'influence.
