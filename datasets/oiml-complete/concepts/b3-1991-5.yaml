  definition:
  - content: A body or a person, in a Member State, that issues OIML certificates
      of conformity for all or for certain categories of measuring instruments.
  examples: []
  id: b3-1991-5-eng
  notes:
  - content: A CIML member may be an issuing authority.
  - content: A list of all the issuing authorities in the various OIML Member States
      is maintained by BIML and is permanently available to Member States and other
      interested parties on request.
