  definition:
  - content: |-
      A selected list of books and other publications in English is given in Appendix IV of

      Coates P.B. "The design of a standars laboratory for thermometry" NPL report QU 64, May 1982 available from the National Physical Laboratory, Teddington.

      (This list also includes references to other complete bibliographies mostly on scientific thermometry published by NPL and NBS).

      A different list including a selection of German and English publications is included in

      Bliek L. "Principles of electric temperature measurement"

      PTB-report E-13e, July 1981

      available from Physikalisch- Technische Bundesanstalt, Braunschweig

      F.R. of Germany

      See also chapters 3.1. and 7.3. of this bibliography concerning temperature measurements, and the BIPM monograph "Supplementary information for the IPTS-68 and EPT-76" published in 1983 and obtainable from Pavillon de Breteuil, F-92312 Sèvres Cedex, France.
