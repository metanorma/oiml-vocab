  - date: '2026-07-15T00:00:00Z'
    type: accepted
  definition:
  - content: Reconnaissance formelle de la compétence d'un laboratoire d'essais pour
      réaliser des essais ou types d'essais déterminés.
  examples: []
  id: d19-1988-9-fra
  notes:
  - content: Le concept général d'agrément de laboratoire peut recouvrir aussi bien
      la reconnaissance de la capacité technique et de l'impartialité d'un laboratoire
      d'essais que la seule reconnaissance de sa capacité technique. L'agrément est
      normalement accordé après une évaluation positive du laboratoire, suivie d'une
      surveillance appropriée.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Agrément d'un laboratoire
