  definition:
  - ? Interface empêchant l'introduction de toute donnée dans le dispositif de traitement
      de données de l'instrument, introduction qui peut
    : afficher des données non clairement définies et qui pourraient être considérées
      comme étant un résultat de mesure ; falsifier des résultats de mesure traités
      ou stockés ou des indications primaires ; régler l'instrument ou changer tout
      facteur de réglage.
