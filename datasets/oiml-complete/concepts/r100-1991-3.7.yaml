    type: accepted
  definition:
  - content: Etendue des concentrations d'un element interessant en solution, que
      l'on peut mesurer avec une repetabilite respectant des limites specifiees.
  examples: []
  id: r100-1991-f-3.7-fra
  notes:
  - content: Une dilution ou une concentration d'une solution de dosage peut etre
      necessaire pour amener l'element interessant dans l'etendue de mesure. L'absorbance
      du spectrometre est ajustee a zero en utilisant une solution de reference a
      blanc.
