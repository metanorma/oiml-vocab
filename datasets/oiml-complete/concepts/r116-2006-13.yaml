  definition:
  - content: Closeness of agreement between successive measurements of the same measurand
      carried out under the same conditions and within a short period of time.
  examples: []
  id: r116-2006-13-eng
  notes:
  - content: 'The same conditions include the following: the method of measurement,
      the operator, the measuring instrument, the location, and the environmental
      conditions.'
