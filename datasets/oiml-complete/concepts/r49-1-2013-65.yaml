  definition:
  - content: décision à caractère légal, basée sur le rapport d'évaluation, concernant
      le fait que le type d'un instrument de mesure est conforme aux exigences réglementaires
      pertinentes et qu'il est adapté à l'usage dans les domaines réglementés de telle
      sorte qu'il est attendu qu'il fournisse des résultats de mesurage fiables au
      cours d'une période de temps définie
