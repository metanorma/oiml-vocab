  definition:
  - content: Instrument de mesure servant à déterminer la masse d'un corps sous l'action
      de la pesanteur.
  - content: L'instrument peut aussi être utilisé pour déterminer d'autres quantités,
      grandeurs, paramètres ou caractéristiques relatives à la masse.
  - content: Selon son mode de fonctionnement, un instrument de pesage est classé
      comme instrument à fonctionnement automatique ou non automatique.
