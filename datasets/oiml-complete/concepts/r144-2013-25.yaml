  definition:
  - content: Système incorporé dans un instrument de mesure qui permet de détecter
      et de mettre en évidence les défauts significatifs.
  examples: []
  id: r144-2013-25-fra
  notes:
  - content: La « mise en évidence » fait référence à toute action appropriée de l'instrument
      de mesure (signal lumineux, signal acoustique, blocage du processus de mesurage,
      etc.).
