  definition:
  - content: The more accurate petroleum measurement becomes, the more its practitioners
      stand in need of statistical methods to express residual uncertainties. This
      chapter covers the application of statistical methods to petroleum measurement
      and sampling. Chapter 13 is in preparation. The following portion now covers
      the subject of statistical aspects of measuring and sampling and is included
      in the manual.
