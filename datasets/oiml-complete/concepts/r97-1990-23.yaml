  definition:
  - content: |-
      A.3.1. Après application de toutes les corrections nécessaires, l'erreur sur les résultats de mesure due aux étalons de référence ou de travail utilisés pour l'étalonnage ne doit pas dépasser 25 % de l'erreur maximale tolérée sur l'instrument à étalonner. L'étalonnage de l'étalon doit assurer sa traçabilité aux étalons nationaux.

      A.3.2. Afin de satisfaire à la présente Recommandation, les baromètres doivent être étalonnés à la fois pour des pressions croissantes et décroissantes, pratiquement sur toute leur étendue de mesure de la pression. En conséquence, l'étendue totale des pressions d'essai doit être appliquée d'une façon contrôlée, au-delà de ce qui pourrait être obtenu avec des modifications naturelles de la pression atmosphérique. Si un baromètre n'a pas de tube de mise à l'atmosphère tel que décrit au point 5.2.7, il doit être étalonné dans une chambre d'essai dans laquelle la pression peut varier progressivement dans toute l'étendue de mesure du baromètre. Lors des observations, la vitesse de variation de la pression d'essai appliquée ne doit pas dépasser $ 1 0 \mathrm {P a} \cdot \mathrm{m i n}^{-1}. $

      A.3.3. Les étalons de référence ou de travail utilisés pour l'étalonnage de tout thermomètre associé avec le baromètre doivent couvrir l'étendue totale du thermomètre et, après application de toutes corrections nécessaires, ne pas avoir une erreur de mesure supérieure à $ \pm 0,1 $ $ ^{\circ} \mathrm{C}. $
