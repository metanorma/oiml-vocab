  definition:
  - content: Interface qui permet uniquement l'introduction de données dans le dispositif
      de traitement de données du taximètre et qui ne peut pas afficher des données
      qui ne sont pas clairement définies et qui pourraient être considérées comme
      étant un résultat de mesure; falsifier les résultats de mesure affichés, traités
      ou stockés ainsi que les indications primaires; ajuster l'instrument ou changer
      un facteur d'ajustage.
