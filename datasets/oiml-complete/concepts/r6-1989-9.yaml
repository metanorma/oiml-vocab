    type: accepted
  definition:
  - content: The difference between the pressures at the inlet and outlet of the gas
      volume meter while the gas is flowing.
  examples: []
  id: r6-1989-9-eng
  notes:
  - content: In some gas volume meters the pressure recovery is not complete at the
      outlet flange and it may be necessary to measure the pressure absorption at
      a point in the downstream pipe. This point shall be specified in the Recommendation
      particular to that type of gas meter.
  sources: []
