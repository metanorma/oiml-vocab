  definition:
  - content: Différence entre les pressions à l'entrée et à la sortie du compteur
      de volume de gaz pendant l'écoulement d'un gaz.
  examples: []
  id: r6-1989-9-fra
  notes:
  - content: Pour certains compteurs de volume de gaz, le rétablissement de la pression
      n'est pas complet à la bride de sortie et il peut être nécessaire de mesurer
      l'absorption de pression en un certain point de la canalisation aval. Ce point
      doit être spécifié dans la Recommandation particulière propre à ce type de compteur
      de gaz.
  sources: []
