    type: accepted
  definition:
  - content: Part or device, other than an ancillary device, required to ensure correct
      measurement or intended to facilitate the measuring operations, or which could
      in any way affect the measurement.
  examples: []
  id: r117-2007-e-T.a.2-eng
  notes:
  - content: 'Main additional devices are: gas elimination device, gas indicator,
      sight glass, filter, pump, device used for the transfer point, anti-swirl device,
      branches or bypasses, valves, hoses.'
