  - content: |-
      Chapter 13.1, Statistical Concepts and Procedures in Measurement, First Edition, June 1985

      This chapter is designed to help those who make measurement of bulk oil quantities improve the value of their result statement by making proper estimates of the uncertainty or probable error involved in measurements. 17 pages.

