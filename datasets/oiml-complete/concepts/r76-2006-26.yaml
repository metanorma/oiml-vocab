    type: accepted
  definition:
  - content: An extra load equivalent to the absolute value of the maximum permissible
      error for the applied load, but not less than 1 mg, when gently placed on or
      withdrawn from the instrument at equilibrium shall cause a permanent displacement
      of the indicating element corresponding to not less than 0.7 times the extra
      load.
