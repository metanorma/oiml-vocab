  definition:
  - content: Rapport entre le volume d'alcool, à la température de 20 °C, contenu
      dans un mélange d'eau et d'alcool et le volume total de ce mélange à la même
      température.
  examples: []
  id: r22-1975-1-fra
  notes:
  - content: Le titre alcoométrique volumique est exprimé en parties d'alcool pour
      cent parties de mélange, et désigné par le symbole « % vol ».
  sources: []
