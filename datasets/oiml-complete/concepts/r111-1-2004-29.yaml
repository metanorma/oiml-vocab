    type: accepted
  definition:
  - content: Ensemble d'essais et d'examens visuels effectués avant que l'équipement/masse
      soit mis en service afin de déterminer si un poids ou un jeu de poids a été
      fabriqué en réplique d'un type donné et est conforme à ce type et aux réglementations
      et si ses caractéristiques métrologiques se situent à l'intérieur des limites
      fixées pour la vérification primitive des copies de ce type. Si le poids ou
      le jeu de poids passe avec succès tous les essais et examens, le caractère légal
      lui est donné par son acceptance, qui est mise en évidence par un poinçonnage
      et/ou la délivrance d'un certificat de vérification.
  - content: "(Adapté de Vérifications primitive et ultérieure des instruments et
      processus de mesure OIML D 20 Édition 1988.)"
