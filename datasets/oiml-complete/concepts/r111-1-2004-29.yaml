  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: Set of tests and visual examinations carried out before the equipment/mass
      is put into service in order to determine whether a weight or a set of weights
      has been manufactured as a replica of a given type and is conform to this type
      and to the regulations, and whether its metrological characteristics lie within
      the limits fixed for the initial verification of copies of this type. If the
      weight or the set of weights successfully passes all the tests and examinations,
      its legal character is given by its acceptance, which is evidenced by stamping
      and/or the issuing of a verification certificate.
  - content: "(Adapted from Initial and subsequent verification of measuring instruments
      and processes OIML D 20 Edition 1988.)"
