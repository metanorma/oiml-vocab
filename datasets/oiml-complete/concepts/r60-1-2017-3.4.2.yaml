    type: accepted
  definition:
  - content: 'groupe de cellules de pesée qui, pour les besoins de l''évaluation de
      type, sont considérées comme une famille et qui : sont fabriquées dans le même
      matériau ou la même combinaison de matériaux (par exemple acier doux, acier
      inoxydable ou aluminium); présentent la même conception de la technique de mesure
      (par exemple jauges de contrainte liées à du métal); en cas d''utilisation d''une
      jauge de contrainte, utilisent le même principe de fixation de la jauge de contrainte
      sur la cellule de pesée; sont construites selon le même procédé (par exemple
      pour la forme, le scellment des jauges de contrainte, la méthode de montage,
      la méthode de fabrication); ont le même ensemble de spécifications (par exemple
      puissance de sortie, impédance d''entrée, tension d''alimentation, détails de
      câblage); et un ou plusieurs groupes de cellules de pesée dans lequel / lesquels
      toutes les cellules de pesée appartenant à ce(s) même(s) groupe(s) possèdent
      des caractéristiques métrologiques identiques (comme indiquées dans la liste
      du point 5.1.5 - y compris : classe; n_LC; niveau de température, etc.).'
  examples: []
