    type: accepted
  definition:
  - content: |-
      La constante k d'un taximètre est une grandeur caractéristique indiquant l'espèce et le nombre des signaux que l'instrument doit recevoir pour indiquer correctement une distance parcourue de 1 km.

      Cette constante k est exprimée :

      a) en « tours par kilomètre indiqué » (tr/km), si l'information relative à la distance parcourue par le véhicule est introduite dans le taximètre sous la forme d'un nombre de tours de son axe de commande (axe moteur à l'entrée de l'instrument) ;

      b) en « impulsions par kilomètre indiqué » (imp/km), si cette information est introduite sous la forme de signaux électriques.

      Selon la construction de l'instrument, la constante k peut être invariable ou réglable par degrés successifs.
