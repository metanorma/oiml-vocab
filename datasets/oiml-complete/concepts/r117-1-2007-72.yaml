data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: Plus petite quantité de liquide dont le mesurage est métrologiquement
      admissible pour un ensemble de mesurage ou un de ses éléments.
  examples: []
  id: r117-1-2007-72-fra
  notes:
  - content: Dans les ensembles de mesurage destinés à des opérations de livraison,
      cette plus petite quantité est appelée livraison minimale ; dans ceux destinés
      à des opérations de réception, elle est appelée réception minimale.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Quantité mesurée minimale (QMM)
  language_code: fra
  entry_status: valid
date_accepted: '2026-07-16T00:00:00+00:00'
