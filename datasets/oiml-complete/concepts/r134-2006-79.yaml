  definition:
  - content: Différence entre le résultat le plus grand et le résultat le plus faible
      de mesures successives de la même charge réalisées dans les mêmes conditions
      de mesure.
  examples: []
  id: r134-2006-79-fra
  notes:
  - Les conditions de répétabilité incluent: la même procédure de mesure ; le même
      opérateur ; le même instrument de mesure, utilisé dans les mêmes conditions
      ; le même lieu ; une répétition sur une courte durée.
  sources: []
