  definition:
  - content: La constante d'une commande de sortie est la valeur du volume représenté
      par un tour complet de l'axe de cette commande ; cette valeur est déterminée
      par calcul en multipliant la valeur du volume représenté par un tour complet
      de l'élément contrôleur par le rapport de transmission du dispositif indicateur
      à cet axe.
