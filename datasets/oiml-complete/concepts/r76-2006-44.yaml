  definition:
  - content: |-
      The compatibility of modules shall be established and declared by the manufacturer. For indicators and load cells this shall be done according to Annex F.

      For modules with digital output, compatibility includes the correct communication and data transfer via the digital interface(s), see Annex F.5.
