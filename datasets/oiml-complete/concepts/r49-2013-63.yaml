  definition:
  - content: examen et essai systématique de la performance d'un ou plusieurs spécimens
      d'un type ou modèle identifié d'instrument de mesure vis à vis d'exigences documentées,
      dont les résultats sont contenus dans le rapport d'évaluation, afin de déterminer
      si le type peut être approuvé
