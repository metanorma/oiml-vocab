  definition:
  - content: All the operations carried out by an organ of a national legal metrology
      service (or other legally authorised organisation) aimed at determining and
      confirming that the weights fully satisfy the regulatory requirements for verification.
      Verification includes examination and marking. (Adapted from VIML 2.4 and 2.13.)
