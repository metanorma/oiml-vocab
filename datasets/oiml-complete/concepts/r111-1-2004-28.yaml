    type: accepted
  definition:
  - content: Toutes les opérations mises en œuvre par un organe d'un service de métrologie
      légale national (ou autre organisation légalement autorisée) ayant pour objet
      de déterminer et confirmer que les poids satisfont entièrement les exigences
      réglementaires pour la vérification. La vérification inclut l'examen et le marquage.
      (Adapté de VIML 2.4 et 2.13.)
