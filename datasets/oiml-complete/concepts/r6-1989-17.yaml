    type: accepted
  definition:
  - content: Différence entre l'erreur d'indication et l'erreur intrinsèque d'un compteur
      de gaz.
  examples: []
  id: r6-1989-17-fra
  notes:
  - content: Un défaut est principalement le résultat d'un changement non désiré des
      données contenues dans, ou transitant à travers, un compteur de gaz électronique.
  - content: Selon cette définition, dans la présente Recommandation, un "défaut"
      est une grandeur ayant une valeur numérique.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Défaut
