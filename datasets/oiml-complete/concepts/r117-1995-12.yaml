data:
  dates:
  - date: 2026-07-16
    type: accepted
  definition:
  - content: A device which automatically converts the volume measured at metering
      conditions into a volume at base conditions, or into a mass, by taking account
      of the characteristics of the liquid measured using associated measuring instruments,
      or stored in a memory.
  examples: []
  id: r117-1995-12-eng
  notes:
  - content: The quotient of the volume at base conditions, or of the mass, to the
      volume at metering conditions is referred to as "conversion factor".
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: conversion device
  language_code: eng
  entry_status: valid
