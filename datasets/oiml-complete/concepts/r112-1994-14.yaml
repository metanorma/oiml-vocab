    type: accepted
  definition:
  - content: Temps passé depuis l'injection de l'échantillon et l'apparition du pic
      maximal du signal d'émission pour le composant examiné.
  examples: []
  id: r112-1994-14-fra
  notes:
  - Le facteur de capacité k' est apparenté à ce terme et est défini comme suit: k'
      = (t_r - t_m) / t_m, où t_m est le temps nécessaire pour que la phase mobile
      passe du point d'injection à celui de détection.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Temps de rétention pour un mesurage
