data:
  dates:
  - date: '2026-07-15T15:08:11Z'
    type: accepted
  definition:
  - content: Dispositif permettant d'ajuster l'éthylomètre en utilisant comme étalon
      un mélange de gaz ayant une humidité relative d'au moins 90 % et une température
      de 34 °C ± 1 °C. Le mélange d'air et d'éthanol traverse le système analyseur
      de gaz dans sa totalité, en partant de l'embout, dans le sens de passage normal
      de l'air expiré.
  examples: []
  id: r126-1998-9-fra
  notes:
  - content: Un ajustage au moyen d'un gaz sec est possible à condition que la différence
      d'effet par rapport à un gaz humide soit connue ou puisse être automatiquement
      corrigée.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Dispositif d'ajustage par comparaison à un étalon
  language_code: fra
  entry_status: valid
date_accepted: '2026-07-16T00:00:00+00:00'
