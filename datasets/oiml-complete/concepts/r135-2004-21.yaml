data:
  dates:
  - date: '2026-07-15T00:00:00Z'
    type: accepted
  definition:
  - content: Difference between a higher and lower wavelength value at which the value
      of an optical quantity is reduced to half of its maximum value between the two
      wavelengths.
  examples: []
  id: r135-2004-21-eng
  notes:
  - content: The coherent SI unit is the metre (m), but often the nanometre (nm) is
      used.
  - content: The optical quantity can be e.g. radiant luminous flux, absorbance, etc.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Spectral width at half maximum value
  language_code: eng
  entry_status: valid
