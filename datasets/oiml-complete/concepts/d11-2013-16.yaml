  definition:
  - content: influence quantity having a value which ranges within the rated operating
      conditions of a measuring instrument
  examples: []
  id: d11-2013-16-eng
  notes:
  - content: The rated operating conditions shall be in conformity with the applicable
      requirements specified in the applicable Recommendation.
  - content: The variation of an indication as a consequence of an influence factor
      is considered an error and not a fault.
