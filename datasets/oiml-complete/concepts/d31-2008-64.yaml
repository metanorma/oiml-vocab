  definition:
  - content: El usuario se desplaza a través de menús. Las funciones legalmente relevantes
      se agrupan en una rama de dicho menú. Si algún valor de medida se perdiera por
      una acción, el usuario debería ser advertido e invitado a realizar otra acción
      antes de que se ejecute la función. Véase también el apartado 5.2.2.
