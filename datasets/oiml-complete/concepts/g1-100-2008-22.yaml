  definition:
  - content: moyenne qui résulterait d'un nombre infini de mesurages du même mesurande,
      effectués dans les conditions de répétabilité, moins une valeur vraie du mesurande
  examples: []
  id: g1-100-2008-22-fra
  notes:
  - content: L'erreur systématique est égale à l'erreur moins l'erreur aléatoire.
  - content: Comme la valeur vraie, l'erreur systématique et ses causes ne peuvent
      pas être connues complètement.
