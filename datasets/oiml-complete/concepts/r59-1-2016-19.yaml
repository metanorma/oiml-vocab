  definition:
  - content: difference between the error of indication and the mean intrinsic error
      of a measuring instrument
  examples: []
  id: r59-1-2016-19-eng
  notes:
  - content: Principally, a fault is the result of an undesired change of data contained
      in or flowing through an electronic measuring instrument.
  - content: If a certified measurement standard is not used, a fault is the difference
      between a single indication during or after a disturbance, and the mean indication
      at reference conditions prior to test.
