    type: accepted
  definition:
  - content: différence entre l'erreur d'indication pendant ou après l'exposition
      à une perturbation et l'erreur intrinsèque d'un instrument de mesure
  examples: []
  id: r59-2016-19-fra
  notes:
  - content: principalement, un défaut est le résultat d'une modification non désirée
      des données contenues dans ou transitant par un instrument de mesure électronique.
  - content: un défaut est une valeur numérique exprimée soit en une unité de mesure
      soit en une valeur relative.
