  definition:
  - content: Laboratory performing certain or all tests on a type of measuring instrument
  examples: []
  id: b18-2025-40-eng
  notes:
  - content: 'Note 1: A Test Laboratory is designated by an OIML Issuing Authority
      and approved by the Management Committee.'
  - content: 'Note 2: A Test Laboratory may be an internal Test Laboratory of an OIML
      Issuing Authority, a thirdparty Test Laboratory or a Manufacturer''s Test Laboratory.'
  - content: 'Note 3: The OIML Issuing Authority, and not the Test Laboratory, is
      responsible for issuing the OIML type evaluation report.'
