data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: Défaut supérieur à 1 d.
  - content: 'Les défauts suivants ne sont pas considérés comme significatifs :'
  - content: "- défauts provenant de causes simultanées et mutuellement indépendantes
      dans l'instrument ou dans son système de contrôle ;"
  - content: "- défauts rendant impossible l'accomplissement de toute mesure ;"
  - content: "- défauts transitoires constitués de variations momentanées des indications
      qui ne peuvent être interprétées, mémorisées ou transmises comme un résultat
      de mesure ;"
  - content: "- défauts si importants qu'ils ne peuvent manquer d'être remarqués par
      tous ceux qui sont intéressés par la mesure."
