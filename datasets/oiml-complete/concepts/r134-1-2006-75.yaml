data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: Fault greater than 1 d.
  - content: 'The following are not considered to be significant faults:'
  - content: "- faults that result from simultaneous and mutually independent causes
      in the instrument or in its checking facility;"
  - content: "- faults that make it impossible to perform any measurement;"
  - content: "- transitory faults that are momentary variations in the indications
      which cannot be interpreted, memorized or transmitted as a measurement result;"
  - content: "- faults that are so serious that they will inevitably be noticed by
      those interested in the measurement."
  examples: []
