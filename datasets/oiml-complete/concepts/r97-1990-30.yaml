  definition:
  - content: La terminologie métrologique utilisée dans la présente Recommandation
      est conforme au « Vocabulaire international des termes fondamentaux et généraux
      de métrologie » (VIM - édition 1984) et au « Vocabulaire de métrologie légale
      » (VML - édition 1978). Le terme « résultat de mesure » s'applique à la valeur
      de pression obtenue après que l'indication du baromètre ait été corrigée, si
      nécessaire, en fonction de la température et de l'accélération de la pesanteur.
