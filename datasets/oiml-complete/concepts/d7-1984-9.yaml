data:
  dates:
  - date: '2026-07-15T00:00:00Z'
    type: accepted
  definition:
  - ? Étroitesse de l'accord entre les résultats des mesurages du même mesurande,
      dans le cas où les mesurages individuels sont effectués en faisant varier les
      conditions telles que
    : méthode de mesure, observateur, instrument de mesure, lieu, conditions d'utilisation,
      temps.
  examples: []
  id: d7-1984-9-fra
  notes:
  - content: Pour qu'une expression de la reproductibilité soit valable, il est nécessaire
      de spécifier les conditions que l'on fait varier.
  - content: La reproductibilité peut s'exprimer quantitativement par une caractéristique
      de dispersion des résultats.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Reproductibilité des mesurages
  language_code: fra
  entry_status: valid
