  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: meter comprising one large meter, one small meter, and a changeover device
      that, depending on the magnitude of the flow rate passing through the meter,
      automatically directs the flow through either the small or the large meter,
      or both
  examples: []
  id: r49-1-2013-16-eng
  notes:
  - content: The meter reading is obtained from two independent totalizers, or from
      one totalizer which adds up the values from both water meters.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: combination meter
  language_code: eng
  entry_status: valid
