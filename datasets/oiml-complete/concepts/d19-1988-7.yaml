  definition:
  - content: Domaine à l'intérieur duquel une administration particulière ou un service
      donné dans une telle administration est chargé d'établir ou de mettre en application
      les lois ou les règlements.
  examples:
  - Domaine dans lequel: 1) une administration nationale, 2) une administration provinciale,
      3) le service national de métrologie légale d'un pays, 4) un service municipal
      chargé d'appliquer les lois sur la pollution, a une autorité légale.
