  definition:
  - content: |-
      Among the numerous existing technical dictionaries the BIML has found the following quite useful

      - Dictionary of Physics

      English-German-French-Russian

      compiled by Ralf Sube and Günther Eisenreich

      3 volumes (2896 pages and about 75 000 entries in each language)

      4th edition 1983

      VEB Verlag Technik, Oranienburger Strasse 13/14, Postfach 201

      DDR-1020 Berlin, German Democratic Republic

      - Chambers dictionary of science and technology, 2 volumes, (available as paperbacks), W.R. Chambers Ltd (U.K.) 1974

      For readers familiar with the Russian language there exists a specialized "English to Russian dictionary on metrology and precise measurement technology" (Anglo-russkij slovar pa metrologij i technike toshij ismerenij) comprising about 17 000 terms : Authors - V.I. Ignatiev and M.F. Yudin Editors - V.I. Kiparenko and L.K. Isaiev Publisher - Russkij Jesik, Moscow 1981
