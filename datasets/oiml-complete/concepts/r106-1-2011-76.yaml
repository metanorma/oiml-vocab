data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: condition d'équilibre obtenue lorsqu'un instrument affiche une valeur
      constante ou pas plus de deux valeurs adjacentes, l'une d'elles étant la valeur
      de poids finale, pour toute charge appliquée donnée
  examples: []
  id: r106-1-2011-76-fra
  notes:
  - content: Cette définition ne s'applique qu'en mode de pesage statique ; elle ne
      s'applique pas dans le cas d'un pesage en mouvement.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: équilibre stable
  language_code: fra
  entry_status: valid
