    type: accepted
  definition:
  - content: condition of balance in which an instrument displays a constant value
      or no more than two adjacent values, one of which is the final weight value,
      for any given load applied
  examples: []
  id: r106-1-2011-76-eng
  notes:
  - content: This definition is only applicable to static weighing and not to weighing-in-motion.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: stable equilibrium
