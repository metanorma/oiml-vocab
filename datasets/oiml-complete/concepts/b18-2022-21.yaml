data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: Test Laboratory of a manufacturer that is designated by an OIML Issuing
      Authority, and registered in the Declaration, that performs specific tests under
      controlled supervision or as a thirdparty laboratory of an OIML Issuing Authority
  examples: []
  id: b18-2022-21-eng
  notes:
  - content: 'Note 1: A Manufacturer Test Laboratory may conduct tests for the parent
      company and/or for other companies. The requirements for controlled supervision
      apply if tests are performed for the parent company. Otherwise the Manufacturer
      Test Laboratory is considered as a third-party Test Laboratory, in which case
      the requirements for third-party laboratories must be satisfied.'
  - content: 'Note 2: In the event that test data is obtained from a Manufacturer
      Test Laboratory this must be clearly indicated on the OIML type evaluation report
      and acceptance of that report is on a voluntary basis.'
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Manufacturer's Test Laboratory
