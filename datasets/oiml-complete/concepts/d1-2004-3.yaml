  id: d1-2004-3-fra
  notes:
  - content: 'Dans le présent Document, le terme « étalons » couvre les éléments suivants
      lorsqu''ils sont utilisés pour établir la traçabilité d''étalons, d''instruments
      de mesure et de mesurages : la réalisation des unités du SI ; les artefacts
      reproduisant les multiples et sous-multiples des unités du SI et traçables au
      SI ; les instruments mesurant des grandeurs et traçables au SI ; les matériaux
      de référence certifiés.'
