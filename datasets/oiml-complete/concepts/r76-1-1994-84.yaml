data:
  dates:
  - date: '2026-07-15T00:00:00Z'
    type: accepted
  definition:
  - content: A fault greater than e.
  examples: []
  id: r76-1-1994-84-eng
  notes:
  - content: For a multi-interval instrument, the value of e is that appropriate to
      the partial weighing range.
  - content: 'The following are not considered to be significant faults, even when
      they exceed e: faults arising from simultaneous and mutually independent causes
      in the instrument; faults implying the impossibility to perform any measurement;
      faults being so serious that they are bound to be noticed by all those interested
      in the result of measurement; transitory faults being momentary variations in
      the indication which cannot be interpreted, memorized or transmitted as a measuring
      result.'
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Significant fault
  language_code: eng
