  definition:
  - content: A facility that is incorporated in a measuring instrument which enables
      significant faults to be detected and acted upon.
  examples: []
  id: r125-1998-e-T.34-eng
  notes:
  - content: '"Acted upon" refers to any adequate response by the measuring instrument
      (luminous or acoustic signal, prevention of the measurement process, etc.).'
