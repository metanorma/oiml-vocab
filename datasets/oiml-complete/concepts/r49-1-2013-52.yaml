data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: alphanumeric designation of size for components of a pipework system,
      which is used for reference purposes
  examples: []
  id: r49-1-2013-52-eng
  notes:
  - content: The nominal diameter is expressed by the letters DN followed by a dimensionless
      whole number which is indirectly related to the physical size, in millimetres,
      of the bore or outside diameter of the end connections.
  - content: The number following the letters DN does not represent a measurable value
      and should not be used for calculation purposes except where specified in the
      relevant Recommendation.
  - content: In those Recommendations which use the DN designation system, any relationship
      between DN and component dimensions should be given, e.g. DN/OD or DN/ID.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: nominal diameter
  language_code: eng
  entry_status: valid
