  definition:
  - content: |-
      Einflussgröße, deren Wert innerhalb der in dieser Empfehlung angegebenen Grenzen, jedoch außerhalb der angegebenen Bemessungsbetriebsbedingungen des Messgeräts liegt

      Hinweis: Eine Einflussgröße ist ein Störeinfluss, wenn für diese Einflussgröße keine Bemessungsbetriebsbedingungen festgelegt sind.
