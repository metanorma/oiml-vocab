  definition:
  - content: Instrument destiné à mesurer de façon continue, à mémo-riser et afficher
      le volume d'eau passant par le transducteur de mesure dans les conditions de
      mesurage.
  examples: []
  id: r49-1-2003-fra-2.1.1-fra
  notes:
  - content: Un compteur d'eau inclut au moins un transducteur de mesure, un calculateur
      (comprenant des dispositifs d'ajustage ou de correction si présents) et un dispositif
      indicateur. Ces trois dispositifs peuvent être dans différents boîtiers.
