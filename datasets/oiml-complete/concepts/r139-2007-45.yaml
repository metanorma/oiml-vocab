  definition:
  - content: Device employing electronic sub-assemblies and performing a specific
      function. Electronic devices are usually manufactured as separate units and
      are capable of being tested independently.
  examples: []
  id: r139-2007-45-eng
  notes:
  - content: Electronic devices, as defined above, may be complete measuring systems
      or part of measuring systems, in particular such as those mentioned in T.1.1
      through T.1.5.
  sources: []
