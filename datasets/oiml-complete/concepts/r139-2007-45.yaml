    type: accepted
  definition:
  - content: Dispositif qui utilise des sous-ensembles électroniques et qui accomplit
      une fonction spécifique. Les dispositifs électroniques sont usuellement fabriqués
      en tant qu'unités séparées et sont susceptibles d'être essayés séparément.
  examples: []
  id: r139-2007-45-fra
  notes:
  - content: II peut s'agir d'ensembles de mesurage complets ou de parties d'ensembles
      de mesurage et notamment des dispositifs cités aux points T.1.1 à T.1.5.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Dispositif électronique
  language_code: fra
  entry_status: valid
