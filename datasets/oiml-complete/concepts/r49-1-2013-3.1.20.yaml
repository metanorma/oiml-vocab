  definition:
  - content: Es el tipo de medidor que se ajusta a un conducto cerrado mediante una
      conexión intermedia llamada una interfaz de conexión.
  examples: []
  id: r49-1-2013-spa-3.1.20-spa
  notes:
  - content: Los ductos de entrada y salida del medidor y de la interfaz de conexión
      pueden ser concéntricos o axiales, según se específica en ISO 4064-4. [7]
