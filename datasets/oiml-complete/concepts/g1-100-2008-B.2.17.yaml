data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: 'for a series of n measurements of the same measurand, the quantity s(q_k)
      characterizing the dispersion of the results and given by the formula: s(q_k)
      = sqrt[ sum_{j=1}^{n} (q_j - q_bar)^2 / (n - 1) ], q_k being the result of the
      kth measurement and q_bar being the arithmetic mean of the n results considered'
  examples: []
  id: g1-100-2008-e-B.2.17-eng
  notes:
  - content: Considering the series of n values as a sample of a distribution, q_bar
      is an unbiased estimate of the mean mu_q and s^2(q_k) is an unbiased estimate
      of the variance sigma^2 of that distribution.
  - content: The expression s(q_k)/sqrt(n) is an estimate of the standard deviation
      of the distribution of q_bar and is called the experimental standard deviation
      of the mean.
  - content: '"Experimental standard deviation of the mean" is sometimes incorrectly
      called standard error of the mean.'
  sources:
  - origin:
      ref:
        source: OIML G 1-100:2008
        version: '2008'
