  - content: |-
      Chapter 5.3, Turbine Meters, First Edition, 1976

      This publication specifies the characteristics of turbine meters and gives rules for applying appropriate considerations to the nature of the liquids to be measured. It also covers the installation of metering systems that use a turbine meter, and their performance, operation, and maintenance in liquid hydrocarbon service. 19 pages.

      Price each, $4.00
