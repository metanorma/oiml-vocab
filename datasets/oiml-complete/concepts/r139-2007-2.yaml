  definition:
  - content: Partie du compteur qui traduit le débit du gaz à mesurer en signaux destinés
      au calculateur. Il peut soit être autonome, soit utiliser une source d'énergie
      extérieure.
  examples: []
  id: r139-2007-2-fra
  notes:
  - content: Pour les besoins de la présente Recommandation, le transducteur de mesure
      inclut le capteur de débit ou de quantité.
