  definition:
  - content: Part of the meter which transforms the flow of the gas to be measured
      into signals which are passed to the calculator. It may be autonomous or use
      an external power source.
  examples: []
  id: r139-2007-2-eng
  notes:
  - content: For the purposes of this Recommendation, the measurement transducer includes
      the flow or quantity sensor.
