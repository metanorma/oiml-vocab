  definition:
  - content: Dans la présente Recommandation, le terme «dispositif» est utilisé pour
      désigner tout moyen par lequel une fonction spécifique est réalisée, qu'elle
      qu'en soit la réalisation physique qui peut être, par exemple, un mécanisme
      ou une clé activant une commande. Le dispositif peut être une petite partie,
      ou une partie importante d'un instrument.
