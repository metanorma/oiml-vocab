    type: accepted
  definition:
  - content: Sonde incorporant un capteur de température et possédant également d'autres
      fonctions.
  examples: []
  id: r114-1995-3-fra
  notes:
  - content: Un exemple de sonde de température à usage spécial est donné par les
      sondes de stéthoscope pour oesophage pour lesquelles un capteur de température
      est guidé à l'intérieur d'un tube en plastique; cependant, l'objet principal
      de la sonde est de transmettre les bruits des cavités pulmonaires à travers
      l'air ou le gaz à l'intérieur du tube jusqu'au stéthoscope relié à l'extrémité
      du tube.
