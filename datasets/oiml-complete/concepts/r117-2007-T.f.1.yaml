data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Difference between the error (of indication) and the intrinsic error
      greater than the value specified in this Recommendation. Significant faults
      are only relevant to electronic measuring systems.
  examples: []
  id: r117-2007-e-T.f.1-eng
  notes:
  - content: 'The following are not considered to be significant faults: transitory
      malfunctions resulting in momentary variations in the indication, which cannot
      be interpreted, memorized, or transmitted as a measurement result; for interruptible
      measuring systems only, malfunctions implying the impossibility of performing
      further measurements.'
  sources:
  - origin:
