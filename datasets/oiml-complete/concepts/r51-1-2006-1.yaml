data:
  dates:
  - date: '2026-07-15T00:00:00Z'
    type: accepted
  definition:
  - content: Measuring instrument that serves to determine the mass of an amount of
      material by using the action of gravity on this material.
  examples: []
  id: r51-1-2006-1-eng
  notes:
  - content: In this Recommendation "mass" (or "weight value") is preferably used
      in the sense of "conventional mass" or "conventional value of the result of
      weighing in air" according to OIML R111 and OIML D28, whereas "weight" is preferably
      used for an embodiment (= material measure) of mass that is regulated in regard
      to its physical and metrological characteristics.
  - content: The instrument may also be used to determine other quantities, magnitudes,
      parameters or characteristics related to mass.
  - content: According to its method of operation, a weighing instrument is classified
      as automatic or nonautomatic.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Weighing instrument
  language_code: eng
  entry_status: valid
