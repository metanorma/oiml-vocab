  definition:
  - content: somme des erreurs de préemballage individuel en tenant compte de leur
      signe arithmétique, divisée par le nombre de préemballages dans le lot d'inspection
      ou l'échantillon
  examples: []
  id: r87-2016-3-fra
  notes:
  - content: L'erreur moyenne pour tous les préemballages dans un échantillon avec
      n comme taille d'échantillon est désignée par le symbole $ e_{\mathrm{ave}}.
      $
  - content: L'erreur moyenne pour tous les préemballages dans un lot d'inspection
      avec N préemballages est désignée par le symbole $ E_{\mathrm{ave}} $
  sources: []
