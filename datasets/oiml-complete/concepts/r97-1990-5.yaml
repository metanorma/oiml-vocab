    type: accepted
  definition:
  - content: |-
      5. 1.1. Le baromètre, lorsqu'il est protégé selon les instructions du fabricant, doit être capable de supporter un transport ordinaire sans se casser et sans introduction d'erreurs additionnelles telles que l'erreur totale dépasserait les limites données au point 4.1.

      5. 1.2. Si, afin de faciliter étalonnage et transport, la construction du baromètre permet à la pression interne d'être maintenue à une valeur différente de la pression ambiante, alors l'étanchéité des joints doit être telle que, si le baromètre a été scellé à une pression égale à la limite supérieure ou inférieure de l'étendue de mesure, la pression interne ne varie pas, pendant une période d'une minute, d'une valeur égale ou supérieure à l'erreur maximale tolérée.
