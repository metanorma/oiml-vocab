  definition:
  - content: "«Parámetro legalmente relevante» cuyo valor depende únicamente del modelo
      de instrumento. Los parámetros específicos del modelo forman parte del software
      legalmente relevante."
  examples:
  - content: En un sistema de medida de líquidos distintos del agua, el rango de viscosidad
      cinemática de una turbina es un parámetro específico de modelo fijado en la
      aprobación de modelo de la turbina.
