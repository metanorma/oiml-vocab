  definition:
  - content: identifiable part of an instrument that performs a specific function
      or functions, and that can be separately evaluated according to the metrological
      and technical performance requirements in the relevant Recommendation
  - content: the modules of a weighing instrument are subject to specified partial
      error limits
  examples: []
  id: r106-1-2011-23-eng
  notes:
  - content: 'Typical modules of an automatic weighing instrument are: load cell,
      indicator, analogue or digital data processing device, weighing module, terminal,
      primary display.'
