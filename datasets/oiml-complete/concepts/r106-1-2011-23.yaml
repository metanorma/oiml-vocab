  definition:
  - content: partie identifiable d'un instrument ayant une ou plusieurs fonctions
      spécifiques et qui peut être évalué séparément, en application des exigences
      de performances métrologiques et techniques fixées dans la Recommandation applicable
  - content: les modules d'un instrument de pesage sont soumis à des limites d'erreur
      partielle spécifiées
  examples: []
  id: r106-1-2011-23-fra
  notes:
  - content: 'Les modules typiques d''un instrument de pesage à fonctionnement automatique
      sont : la cellule de pesage, l''indicateur, le dispositif analogique ou numérique
      de traitement de données, le module de pesage, le terminal, l''afficheur principal.'
