      segundos, o una cadena de fecha y hora que indica cuándo se produjo un suceso
      o un fallo concreto. Estos datos se presentan en un formato coherente que permite
      comparar con facilidad dos registros distintos y su seguimiento a lo largo de
      tiempo.
