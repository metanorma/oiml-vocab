    type: accepted
  definition:
  - content: |-
      Les baromètres à mercure doivent être marqués clairement et de manière indélébile avec la légende suivante:

      $$
      \text{"Conditions standard: } 0 ^ {\circ} \mathrm {C}, \mathrm {g} = 9, 8 0 6 6 5 \mathrm {m} / \mathrm {s} ^ {2} \mathrm {"}
      $$

      Les baromètres du type à réservoir fixe doivent également porter clairement et de manière indélébile la valeur V/A en millimètres, quelle que soit l'unité dans laquelle l'échelle est graduée. (La grandeur V/A est le quotient du volume total de mercure dans le baromètre par l'aire effective de la section horizontale du réservoir).
