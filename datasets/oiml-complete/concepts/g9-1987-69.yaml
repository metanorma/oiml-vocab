      Chapter 10.6, Determination of Water and Sediment in Fuel Oils by the Centrifuge Method (Laboratory Procedure), First Edition, December 1983 (ANSI/ASTM D 1796) This publication describes the test method for laboratory determination of water and sediment in fuel oils by centrifuge. 6 pages. Price each, $3.00

      Chapter 11, Physical Properties Data Because of the nature of this material, it is not included in the complete set of measurement standards. Each element of Chapter 11 must be ordered separately. Chapter 11 is the physical data that has direct application to volumetric measurement of liquid hydrocarbons. It is presented in tabular form, in equations relating volume to temperature and pressure, computer subroutines, magnetic tape, and microfilm.

      852-27150

      Chapter 11.1, Volume Correction Factors, August 1980, Magnetic Tape (Includes paper edition of Volume X) (ANSI/ASTM D 1250)(IP 200) (API Std 2540)

      Std 2540) Tape is 9 track, 1600 bpi, EBCDIC, unlabeled, fixed block and requires a 32-bit or higher machine.

      Magnetic tape, $450.00

      Chapter 11.1, Volume Correction Factors, August 1980, Microfiche (includes paper edition of Volume X)(ANSI/ASTM D 1250)(IP 200) (API Std 2540)

      Microfiche, $450.00

      Chapter 11.1, Volume I, August 1980 (ANSI/ASTM D 1250)(IP 200) (API Std 2540)

      Table 5A—Generalized Crude Oils, Correction of Observed API Gravity to API Gravity at 60°F

      Table 6A—Generalized Crude Oils, Correction of Volume to 60°F Against API Gravity at 60°F

      Paper, $45.00

      Chapter 11.1, Volume II, August 1980 (ANSI/ASTM D 1250)(IP 200) (API Std 2540)

      Table 5B—Generalized Products, Correction of Observed API Gravity to API Gravity at 60°F

      Table 6B—Generalized Products, Correction of Volume to 60°F Against API Gravity at 60°F

      Paper or plasticized paper in binder, please specify, $45.00

