    type: accepted
  definition:
  - content: Instrument de pesage à fonctionnement automatique pour peser un produit
      en vrac en le fractionnant en charges discrètes, en déterminant séquentiellement
      la masse de chaque charge discrète, en additionnant les résultats de pesage
      et en retournant les charges discrètes au vrac.
  examples: []
  id: r107-1-1997-3-fra
  notes: []
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: instrument de pesage totalisateur discontinu à fonctionnement automatique
      (peseuse totalisatrice à trémie)
  language_code: fra
  entry_status: valid
