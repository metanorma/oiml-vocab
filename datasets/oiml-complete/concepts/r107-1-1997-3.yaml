  definition:
  - content: An automatic weighing instrument that weighs a bulk product by dividing
      it into discrete loads, determining the mass of each discrete load in sequence,
      summing the weighing results and delivering the discrete loads to bulk.
  examples: []
  id: r107-1-1997-3-eng
  notes: []
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: discontinuous totalizing automatic weighing instrument (totalizing
      hopper weigher)
  language_code: eng
  entry_status: valid
