data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: Measuring instrument that serves to determine the mass of a body by using
      the action of gravity on this body.
  - content: The instrument may also be used to determine other quantities, magnitudes,
      parameters or characteristics related to the determined mass.
  - content: According to its method of operation, a weighing instrument is classified
      as an automatic weighing instrument or a non-automatic weighing instrument.
  examples: []
  id: r76-1-2006-1-eng
  notes:
  - content: In this Recommendation "mass" (or "weight value") is preferably used
      in the sense of "conventional mass" or "conventional value of the result of
      weighing in air" according to R111 and D28, whereas "weight" is preferably used
      for an embodiment (i.e. material measure) of mass that is regulated in regard
      to its physical and metrological characteristics.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: weighing instrument
  language_code: eng
  entry_status: valid
date_accepted: '2026-07-16T00:00:00+00:00'
