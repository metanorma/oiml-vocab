  definition:
  - content: Instrument destiné à mesurer de façon continue, à mémoriser et à afficher
      le volume de liquide qui le traverse dans les conditions de mesure.
  examples: []
  id: r117-1995-1-fra
  notes:
  - content: Un compteur est constitué au moins d'un transducteur de volume, d'un
      calculateur (y compris les dispositifs d'ajustage et de correction si présents)
      et d'un dispositif indicateur.
  sources: []
  terms:
