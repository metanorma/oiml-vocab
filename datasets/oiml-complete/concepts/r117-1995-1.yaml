data:
  dates:
  - date: 2026-07-16
    type: accepted
  definition:
  - content: An instrument intended to measure continuously, memorize and display
      the volume of liquid passing through the measurement transducer at metering
      conditions.
  examples: []
  id: r117-1995-1-eng
  notes:
  - content: A meter includes at least a measurement transducer, a calculator (including
      adjustment or correction devices if present) and an indicating device.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: meter for volumes of liquids
  language_code: eng
  entry_status: valid
