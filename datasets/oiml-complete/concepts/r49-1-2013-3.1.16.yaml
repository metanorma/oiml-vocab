data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Es el medidor que consiste de un medidor grande, un medidor pequeño y
      un dispositivo de cambio que, dependiendo de la magnitud del caudal que pasa
      por un medidor, dirige automáticamente el flujo hacia el medidor pequeño o grande,
      o hacia ambos.
  examples: []
  id: r49-1-2013-spa-3.1.16-spa
  notes:
  - content: La lectura del medidor se obtiene de dos totalizadores independientes,
      o de un totalizador que suma los valores de ambos medidores de agua.
  sources:
  - origin:
      ref:
        source: OIML R 49-1:2013
        version: '2013'
    locality:
      type: clause
      reference_from: 3.1.16
