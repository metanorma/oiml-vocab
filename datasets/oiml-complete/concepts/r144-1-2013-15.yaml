  - date: '2026-07-15T00:00:00Z'
    type: accepted
  definition:
  - content: période de temps requise par le système d'analyse depuis la mise sous
      tension de l'instrument jusqu'à ce qu'il atteigne le mode de fonctionnement
      auquel il fonctionne dans les erreurs maximales tolérées
  examples: []
  id: r144-1-2013-15-fra
  notes:
  - content: Pour un analyseur de gaz cela correspond au temps entre le moment où
      il est mis sous tension et le moment où le résultat de mesure d'une fraction
      volumique, un CGM étant installé à l'entrée, est dans les limites autorisées.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: temps de chauffe
