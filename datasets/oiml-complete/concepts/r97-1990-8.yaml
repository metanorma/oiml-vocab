    type: accepted
  definition:
  - content: |-
      6. 1.1. L'échelle doit être graduée tous les 0,1 kPa (1 hPa); un vernier ou un micromètre permettant de faire des lectures de pression à 0,01 kPa (0,1 hPa) ou moins doit être incorporé. Si un vernier est utilisé, le trait zéro ne doit pas être l'extrémité du vernier.

      6. 1.2. Chaque échelle doit être marquée de manière claire et indélébile avec l'unité de mesure de pression appropriée.

      6. 1.3. Le thermomètre incorporé doit avoir une échelle graduée tous les $ 1 \mathrm{~}^{\circ} \mathrm{C} $ ou moins.
