    type: accepted
  definition:
  - content: 'Mean value of the error (of indication) for a number of consecutive
      automatic weighings of a load, or similar loads, passed over the load receptor,
      expressed mathematically as: x-bar = (sum from i=1 to n of x_i) / n, where:
      x = error of a load indication, x-bar = mean of the errors, and n = number of
      weighings.'
