data:
  dates:
  - date: '2026-07-15T00:00:00Z'
    type: accepted
  definition:
  - content: Groupe de compteurs de gaz de différentes tailles et/ou de différents
      débits dans lequel tous les compteurs doivent avoir les mêmes caractéristiques
      essentielles (fabricant, similarité géométrique de la partie de mesure, même
      principe de mesure, à peu près les mêmes ratios Q_max/Q_min et Q_max/Q_t, même
      classe d'exactitude, même dispositif électronique pour chaque taille de compteur
      et utilisant les mêmes routines logicielles métrologiques pour les composants
      critiques, niveau similaire de conception et d'assemblage de composants, et
      les mêmes matériaux pour les composants critiques en ce qui concerne les performances
      du compteur).
