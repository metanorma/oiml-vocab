    type: accepted
  definition:
  - content: identifiable group of measuring instruments belonging to the same manufactured
      type within the same category that have the same design features and metrological
      principles for measurement but which may differ in some metrological and technical
      performance characteristics, as defined in the relevant Recommendation
  examples: []
  id: b3-2011-e-3.3-eng
  notes:
  - content: The concept of a "family" primarily aims to reduce the testing required
      for OIML Type Evaluation. It does not preclude the possibility of listing more
      than one family in one Certificate.
