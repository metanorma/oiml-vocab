data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: 'For the mass, a fault the magnitude of which is greater than the larger
      of these two values:'
  - content: "- one tenth of the magnitude of the maximum permissible error for the
      measuring system and for the measured mass,"
  - content: "- the minimum specified mass deviation."
  - content: For the price to pay, the price corresponding to the significant fault
      for the mass.
  examples: []
  id: r139-2007-35-eng
  notes:
  - content: No fault is allowed for the unit price.
  - content: 'The following are not considered to be significant faults:'
  - content: "- faults arising from simultaneous and mutually independent causes in
      the measuring instrument itself or in its checking facilities,"
  - content: "- transitory faults being momentary variations in the indication, which
      cannot be interpreted, memorized or transmitted as a measurement result,"
  - content: "- faults implying the impossibility of performing any measurement."
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Significant fault
  language_code: eng
  entry_status: valid
