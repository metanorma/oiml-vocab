data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: 'Pour la masse, défaut dont la valeur absolue est supérieure à la plus
      grande des deux valeurs suivantes :'
  - content: "- un dixième de la valeur absolue de l'erreur maximale tolérée pour
      l'ensemble de mesurage sur la masse mesurée,"
  - content: "- l'écart minimal spécifié pour la masse."
  - content: Pour le prix à payer, le prix correspondant au défaut significatif sur
      la masse.
  examples: []
  id: r139-2007-35-fra
  notes:
  - content: Aucun défaut n'est toléré sur le prix unitaire.
  - content: 'Les défauts suivants ne sont pas considérés comme significatifs :'
  - content: "- défauts provenant de causes simultanées et mutuellement indépendantes,
      dans l'instrument lui-même ou dans son système de contrôle,"
  - content: "- défauts transitoires provenant de variations momentanées de l'indication,
      mais qui ne peuvent être interprétées, mises en mémoire ou transmises comme
      des résultats de mesure,"
  - content: "- défauts rendant impossible l'accomplissement de toute mesure."
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Défaut significatif
  language_code: fra
  entry_status: valid
date_accepted: '2026-07-16T00:00:00+00:00'
