  definition:
  - content: |-
      Fault greater than the maximum permissible error specified in Table 2 (see 6.2.2).

      The following faults are considered not to be significant, even when they exceed the value defined above:

      (a) faults arising from simultaneous and mutually independent causes in the ALG itself or in its checking facilities;

      (b) faults implying the impossibility to perform any measurement;

      (c) transitory faults being momentary variations in the indication, which cannot be interpreted, memorized or transmitted as a measurement result;

      (d) faults giving rise to variations in the measurement results so serious that they are bound to be noticed by all those interested in the result of the measurement.
