    type: accepted
  definition:
  - content: valeur de poids obtenue lorsque l'instrument est complètement au repos
      et à l'état d'équilibre, sans influence de l'environnement ni perturbation pouvant
      avoir un effet sur l'indication
  examples: []
  id: r106-1-2011-75-fra
  notes:
  - content: Cette définition ne s'applique qu'en mode de pesage statique ; elle ne
      s'applique pas dans le cas d'un pesage en mouvement.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: valeur de poids finale
