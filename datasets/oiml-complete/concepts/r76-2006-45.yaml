  definition:
  - content: |-
      If a respective OIML Certificate exists, and if the requirements in 3.10.2.1, 3.10.2.2, and 3.10.2.3 are met, the following may be used without repeated testing:

      - SH or CH tested load cells (but not NH marked load cells) that have been tested separately according to OIML R 60,;

      - indicators and analog data processing devices that have been tested separately according to Annex C;

      - digital data processing devices, terminals and digital displays that have been tested separately according to Annex D;

      - weighing modules that have been tested separately according to Annex E;

      - other modules (if relevant OIML Recommendations exist)

      The OIML Certificates must contain all relevant information required in Annex F. OIML Certificates for modules must be clearly distinguishable from OIML Certificates for complete instruments.

      A representative complete instrument shall be submitted for testing of correct functioning if this is considered necessary by the responsible authority, e.g. to conduct tests that have not been performed such as tilting.
