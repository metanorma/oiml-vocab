data:
  dates:
  - date: '2026-07-16T12:31:04Z'
    type: accepted
  definition:
  - content: |-
      All metrologically relevant features and functions have to be tested at least once in an EUT as far as applicable and as many as possible in the same EUT.

      For example, it is not acceptable to test the temperature effect on no-load indication on one EUT and the combined effect (see Table 7) on a different one. Variations in metrologically relevant features and functions such as different:

      - housings;

      - load receptors;

      - temperature and humidity ranges;

      - instrument functions;

      - indications; etc.

      may require additional partial testing of those factors which are influenced by that feature. These additional tests should preferably be carried out on the same EUT, but if this is not possible, tests on one or more additional EUTs may be performed under the responsibility of the testing authority.
