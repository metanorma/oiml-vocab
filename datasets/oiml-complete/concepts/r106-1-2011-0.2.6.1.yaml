  definition:
  - content: force transducer which, after taking into account the effects of the
      acceleration of gravity and air buoyancy at the location of its use, measures
      mass by converting the measured quantity (mass) into another measured quantity
      (output) [OIML R 60:2000 [6]]
  examples: []
