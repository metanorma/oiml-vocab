    type: accepted
  definition:
  - content: Instrument de pesage utilisé pour déterminer la masse de référence statique
      du véhicule pour les véhicules de référence et les charges statiques par essieu
      pour le véhicule de référence rigide à deux essieux.
  examples: []
  id: r134-2006-4-fra
  notes:
  - Les instruments de contrôle utilisés comme instrument de référence pendant les essais peuvent être: séparés
      de l'instrument faisant l'objet des essais ; ou intégrés, lorsqu'un mode de
      pesage statique est disponible au niveau de l'instrument faisant l'objet des
      essais.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Instrument de contrôle
