    type: accepted
  definition:
  - content: Longueur de la section sensible à la déformation d'un extensomètre, parallèlement
      à l'axe de mesure. La longueur de jauge est approximativement la distance délimitée
      par l'intérieur des boucles terminales de l'extensomètre.
  examples: []
  id: r62-1985-10-fra
  notes:
  - content: Étant donné que la valeur vraie de la longueur de jauge est inconnue,
      la longueur de jauge peut être mesurée sur la base d'autres paramètres géométriques
      (par exemple en incluant les boucles terminales) pourvu que la variante soit
      définie.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Longueur de jauge
