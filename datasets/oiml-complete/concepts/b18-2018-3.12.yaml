  definition:
  - content: groupe identifiable d'instruments de mesure appartenant au même type
      fabriqué et présentant les mêmes caractéristiques de conception et principes
      de mesurage, mais qui peuvent différer par quelques caractéristiques de performances
      métrologiques et techniques, telles que définies dans la Recommandation applicable
  examples: []
  id: b18-2018-f-3.12-fra
  notes:
  - content: Le concept de "famille" vise principalement à réduire les essais nécessaires
      pour l'évaluation de type OIML. Il n'exclut pas la possibilité d'inscrire plus
      d'une famille sur un même Certificat OIML.
