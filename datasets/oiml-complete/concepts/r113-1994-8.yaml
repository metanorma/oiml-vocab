data:
  dates:
  - date: '2026-07-15T00:00:00Z'
    type: accepted
  definition:
  - ? Mesure d'une variation du signal de sortie du détecteur alors qu'on ne procède
      à la détection d'aucun composant d'échantillon. Il peut être classifié selon
      deux composantes
    : bruit à court terme (variations aléatoires observables du signal en provenance
      du détecteur ou d'autres éléments dont la fréquence est de l'ordre de un ou
      plusieurs cycles par minute) et dérive (pente moyenne du signal de base mesurée
      sur une durée prolongée, par exemple 1/2 heure).
  examples: []
  id: r113-1994-8-fra
  notes: []
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Bruit
  language_code: fra
