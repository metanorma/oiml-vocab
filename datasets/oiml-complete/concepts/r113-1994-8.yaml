  - date: 2026-07-16
    type: accepted
  definition:
  - content: A measure of the variation in the detector's output signal when a sample
      component is not being detected.
  examples: []
  id: r113-1994-8-eng
  notes:
  - content: Short-term noise includes all observable random variations of the signal
      from the detector or other components having a frequency of about one or more
      cycles per minute.
  - content: Drift is the average slope of the baseline signal measured over an extended
      time period, for example, one-half hour.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: noise
  language_code: eng
  entry_status: valid
