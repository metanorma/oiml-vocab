  definition:
  - content: Fraction of the signal recorded by the detector for radiation of all
      wavelengths outside the 1.01-fold of the one-hundredth value width out of the
      total signal at a particular wavelength setting.
  examples: []
  id: r135-2004-23-eng
  notes:
  - content: The false radiation fraction has the dimension one and is expressed with
      the derived coherent SI unit one (1).
  - content: Radiation entering the spectrophotometer from the outside through leaks
      is not included by this concept.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: False radiation fraction
