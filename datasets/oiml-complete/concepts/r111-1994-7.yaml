    type: accepted
  definition:
  - content: Standard uncertainty of a measurement result when that result is obtained
      from the values of a number of quantities; it is equal to the positive square
      root of the appropriate sum of the variances and covariances of these quantities.
      The variance of a quantity is the square of its standard deviation.
  examples: []
  id: r111-1994-7-eng
  notes: []
  sources: []
