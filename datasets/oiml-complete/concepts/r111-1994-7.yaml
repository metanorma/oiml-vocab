  definition:
  - content: Incertitude-type d'un résultat de mesure quand ce résultat est obtenu
      à partir des valeurs de différentes grandeurs; elle est égale à la racine carrée
      de la somme appropriée des variances et covariances de ces grandeurs. La variance
      d'une grandeur est égale au carré de son écart type.
