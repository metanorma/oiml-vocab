  definition:
  - content: |-
      Dans le cas des baromètres à élément récepteur élastique, pour chaque pression d'essai, la différence entre les moyennes des erreurs obtenues dans des conditions de pression croissante, en deux jours différents, ne doit pas dépasser 33 % de l'erreur maximale tolérée. De même la différence entre les moyennes des erreurs obtenues dans des conditions de pression décroissante, en deux jours différents, ne doit pas dépasser 33 % de l'erreur maximale tolérée.

      v) Chacune des dispositions ci-dessus doit être satisfaite indépendamment de toute autre disposition; la conformité à l'une quelconque de ces exigences ne doit pas être interprétée comme une conformité à une autre exigence.

      8. 2.7. Si les résultats d'une première série d'essais de modèle sont satisfaisants, une seconde série doit être effectuée après une période de 6 mois ou plus, afin de s'assurer de la constance des instruments. La constance doit être considérée comme satisfaisante si les erreurs après six mois ne diffèrent pas des valeurs précédemment déterminées de plus de 50 % des erreurs maximales tolérées.

      8. 2.8. Si les résultats de la seconde série d'essais sont également satisfaisants et si le modèle est considéré comme pouvant recevoir l'approbation, l'autorité d'essai doit alors, conformément aux exigences nationales, définir les procédures pour les vérifications primitives et ultérieures, décider sur un temps maximum entre vérifications, et délivrer un certificat d'approbation de modèle.
