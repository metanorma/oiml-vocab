data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: 'Lorsqu''un compteur complet est essayé en tant qu''unité, la formule
      ci-après s''applique pour le compteur complet: E_compt = (I − V) / V × 100%.'
  - content: 'Lorsque l''essai comprend des essais séparés du transducteur et du calculateur/indicateur,
      les formules suivantes s''appliquent: pour le transducteur K_tran = N/V; pour
      le calculateur/indicateur K_calc = N/I; pour le compteur E_compt = (K_tran /
      K_calc − 1) × 100%.'
  - content: 'Où: I est l''indication du compteur exprimée en volume, V est la lecture
      de la mesure volumétrique (volume ayant traversé le transducteur), N est le
      nombre d''impulsions factorisées transmises par le transducteur, K_tran est
      la constante d''étalonnage du transducteur, K_calc est la constante d''étalonnage
      du calculateur/indicateur, et E_compt est l''erreur du compteur.'
  examples: []
