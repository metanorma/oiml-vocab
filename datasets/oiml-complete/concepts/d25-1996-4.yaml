data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: 'When a complete meter is tested as one unit the following formula applies
      for the complete meter: E_meter = (I − V) / V × 100%.'
  - content: 'When the test is divided into separate transducer and calculator/indicator
      tests, the following formulae apply: for the transducer K_tran = N/V; for the
      calculator/indicator K_calc = N/I; for the meter E_meter = (K_tran / K_calc
      − 1) × 100%.'
  - content: 'Where: I is the meter indication in volume units, V is the volumetric
      measurement reading (volume passed through the transducer), N is the number
      of factored pulses transmitted by the transducer, K_tran is the transducer calibration
      constant, K_calc is the calculator/indicator calibration constant, and E_meter
      is the meter error.'
  examples: []
  id: d25-1996-4-eng
  notes: []
  sources: []
