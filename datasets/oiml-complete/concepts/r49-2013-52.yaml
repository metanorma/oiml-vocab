  definition:
  - content: grandeur qui, lors d'un mesurage direct, n'affecte pas la grandeur réellement
      mesurée, mais affecte la relation entre l'indication et le résultat du mesurage
  examples:
  - content: la température ambiante du compteur est une grandeur d'influence, alors
      que la température de l'eau traversant le compteur affecte le mesurande.
