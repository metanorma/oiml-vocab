  - content: |-
      Les erreurs mentionnées sont des erreurs instrumentales, c'est-à-dire provenant seulement des instruments isolés des véhicules.

      L'étendue de dispersion des indications est la plus grande différence entre les indications d'un taximètre correspondant à une même valeur de la grandeur mesurée.
