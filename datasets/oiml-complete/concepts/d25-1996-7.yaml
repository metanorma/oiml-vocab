    type: accepted
  definition:
  - content: Le nombre de Strouhal est un paramètre sans dimension relatif à l'écoulement
      divisé au-delà du (des) corps perturbateur(s). Il relie la fréquence de détachement
      des tourbillons mesurée à la vitesse du fluide et aux caractéristiques dimensionnelles
      du corps perturbateur. En pratique, le facteur K, qui n'est pas sans dimension,
      remplace le nombre de Strouhal en tant que paramètre significatif.
  - content: 'Le nombre de Strouhal, St, relie la fréquence f des tourbillons engendrés,
      la dimension caractéristique b du corps perturbateur, et la vitesse moyenne
      U du fluide. Il est donné par: St = f × (b/U), ou f = St × (U/b).'
  examples: []
