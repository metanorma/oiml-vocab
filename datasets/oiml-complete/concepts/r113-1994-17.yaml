    type: accepted
  definition:
  - content: Concordance entre les résultats de mesurages consécutifs du même mesurande,
      effectués dans les mêmes conditions et sur une relativement brève période de
      temps.
  examples: []
  id: r113-1994-17-fra
  notes:
  - Le terme «mêmes conditions» inclut: la méthode de mesurage, l'opérateur, l'instrument
      de mesure, le lieu, et les conditions d'environnement.
  sources: []
