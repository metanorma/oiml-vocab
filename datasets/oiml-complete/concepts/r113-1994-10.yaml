  definition:
  - content: Étendue des débits massiques ou des concentrations du composant de l'échantillon
      à analyser dans le gaz porteur pour laquelle la sensibilité du détecteur est
      constante dans les limites spécifiées; elle est exprimée comme le rapport de
      sa limite supérieure à la limite de détection.
