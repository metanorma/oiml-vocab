  definition:
  - content: The range of mass flow rates or concentrations of the sample component
      of interest in the carrier gas over which the sensitivity of a detector remains
      constant within specified limits and is expressed as the ratio of its upper
      limit to the detection limit.
  examples: []
  id: r113-1994-10-eng
  notes: []
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: linear range
