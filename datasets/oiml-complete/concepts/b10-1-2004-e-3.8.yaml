  definition:
  - content: Report which accompanies an OIML Certificate of Conformity under the
      OIML Certificate System. Report, prepared according to the Test Report Format
      specified in the relevant Recommendation, that gives the results of the examinations
      and testing carried out during type evaluation on an identified sample or samples
      of a given type and a conclusion as to whether the sample or samples meet the
      specified requirements.
  examples: []
  id: b10-1-2004-e-3.8-eng
  notes:
  - content: The OIML Test Report shall always be accompanied by the OIML Certificate
      of Conformity which validates it.
