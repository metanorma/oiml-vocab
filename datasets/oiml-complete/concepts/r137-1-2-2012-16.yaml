data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: 'the weighted mean error (WME) within the scope of this Recommendation
      is defined as:'
  - content: WME = (sum_{i=1}^{n} k_i E_i) / (sum_{i=1}^{n} k_i)  with  k_i = Q_i
      / Q_max  for Q_i <= 0.7 Q_max
  - content: k_i = 1.4 - Q_i / Q_max  for 0.7 Q_max < Q_i <= Q_max
  - content: 'where: k_i = weighting factor at the flow rate Q_i; E_i = the error
      at the flow rate Q_i.'
  examples: []
