  definition:
  - content: 'l''erreur moyenne pondérée (EMP), dans le cadre du champ d''application
      de cette Recommandation, est définie ainsi :'
  - content: EMP = (sum_{i=1}^{n} k_i E_i) / (sum_{i=1}^{n} k_i)  avec  k_i = Q_i
      / Q_max  pour Q_i <= 0.7 Q_max
  - content: k_i = 1.4 - Q_i / Q_max  pour 0.7 Q_max < Q_i <= Q_max
  - content: 'où : k_i = le facteur de pondération au débit Q_i ; E_i = l''erreur
      au débit Q_i.'
