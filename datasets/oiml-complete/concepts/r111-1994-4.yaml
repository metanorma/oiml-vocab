  definition:
  - content: Conventional value of the result of weighing in air, in accordance to
      International Recommendation OIML R 33.
  - content: For a weight taken at 20 °C the conventional mass is the mass of a reference
      weight of a density of 8000 kg·m⁻³ which it balances in air of a density of
      1.2 kg·m⁻³.
