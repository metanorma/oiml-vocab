    type: accepted
  definition:
  - content: Valeur conventionnelle du résultat de la pesée dans l'air, conformément
      à la Recommandation Internationale OIML R 33.
  - content: Pour un poids pris à 20 °C, la masse conventionnelle est celle d'un étalon,
      de masse volumique de 8000 kg·m⁻³ à 20 °C, qui l'équilibre dans un air de masse
      volumique de 1,2 kg·m⁻³ à cette même température.
