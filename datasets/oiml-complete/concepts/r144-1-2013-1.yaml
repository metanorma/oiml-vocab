  - date: '2026-07-15T00:00:00Z'
    type: accepted
  definition:
  - content: assemblage d'éléments destiné à réaliser des mesurages d'analyse des
      gaz spécifiés
  examples: []
  id: r144-1-2013-1-fra
  notes:
  - content: Dans cette Recommandation, un système d'analyse signifie un système qui
      mesure en continu la fraction volumique de CO (monoxyde de carbone), NO (monoxyde
      d'azote), NO2 (dioxyde d'azote), ou d'oxydes d'azote (NOx), ou qui mesure seulement
      CO ou seulement NO et NO2, ou NOx, par analyse d'échantillons de gaz extraits
      directement de la cheminée ou de tuyau de gaz dans l'industrie.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: système d'analyse des gaz
  language_code: fra
