  - content: Dispositif permettant d'amener l'indication de l'instrument à zéro lorsqu'une
      charge est placée sur le récepteur de charge, sans empiéter sur l'étendue de
      pesage des charges nettes (dispositif additif de tare), ou en réduisant l'étendue
      de pesage des charges nettes (dispositif soustractif de tare).
