  definition:
  - content: Document issued under the rules of the System by an OIML Issuing Authority
      providing confidence that the identified type of measuring instrument or module
      is in conformity with the requirements of the relevant Recommendation
  examples: []
  id: b3-2011-12-eng
  notes:
  - content: If the additional rules defined in OIML B 10 are also met (meaning that
      a Declaration of Mutual Confidence (DoMC) is published for the relevant category),
      the Certificates issued are called "OIML MAA Certificates of Conformity".
