  definition:
  - content: document délivré selon les règles du Système par une Autorité de délivrance
      OIML et apportant l'assurance que le type d'instrument de mesure ou de module
      identifié est conforme aux exigences de la Recommandation applicable
  examples: []
  id: b3-2011-12-fra
  notes:
  - content: Si les règles complémentaires définies dans l'OIML B 10 sont également
      respectées (c'est-à-dire qu'une Déclaration de Confiance Mutuelle (DoMC) est
      publiée pour la catégorie correspondante), les Certificats délivrés sont appelés
      « Certificats OIML de Conformité MAA ».
