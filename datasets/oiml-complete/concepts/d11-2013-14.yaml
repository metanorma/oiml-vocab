data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: erreur de durabilité excédant la valeur spécifiée dans la Recommandation
      applicable
  examples: []
  id: d11-2013-14-fra
  notes:
  - content: 'Certaines erreurs de durabilité excédant la valeur spécifiée, peuvent
      ne pas être considérées comme significatives. La Recommandation applicable doit
      indiquer quand de telles exceptions s''appliquent. Par exemple, l''apparition
      d''un ou plusieurs des erreurs suivantes peut être acceptable : (a) l''indication
      ne peut pas être interprétée, mise en mémoire ou transmise comme un résultat
      de mesure; (b) l''indication rend impossible l''accomplissement de toute mesure;
      (c) l''indication est de toute évidence si erronée qu''elle sera inévitablement
      identifiée par tous ceux intéressés par le résultat du mesurage; ou (d) une
      erreur de durabilité ne peut pas être détectée et mise en évidence à cause d''une
      panne du système de protection de durabilité concernée.'
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: erreur de durabilité significative
  language_code: fra
  entry_status: valid
date_accepted: '2026-07-16T00:00:00+00:00'
