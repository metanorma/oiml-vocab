  definition:
  - content: différence entre l'erreur d'indication et l'erreur intrinsèque d'un instrument
      de mesure
  examples: []
  id: d11-2026-14-fra
  notes:
  - content: Principalement, un défaut est le résultat d'une modification non désirée
      des données contenues dans ou transitant par un instrument de mesure électronique.
  - content: De la définition, il s'ensuit que dans ce Document, un " défaut" est
      une valeur numérique exprimée soit en une unité de mesure soit en une valeur
      relative, par exemple sous forme d'un pourcentage.
