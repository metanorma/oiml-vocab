  definition:
  - content: Quantity that is not the measurand but that affects the result of the
      measurement. Influence quantity having a value within the limits specified in
      the relevant Recommendation, but outside the specified rated operating conditions
      of a measuring instrument.
  examples: []
  id: d11-2004-e-3.13.2-eng
  notes:
  - content: An influence quantity is a disturbance if the rated operating conditions
      for that influence quantity are not specified.
