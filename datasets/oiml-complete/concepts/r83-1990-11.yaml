data:
  dates:
  - date: '2026-07-15T00:00:00Z'
    type: accepted
  definition:
  - content: rapport entre la quantité maximale d'échantillon (au-dessous du niveau
      de saturation du spectromètre) qui peut être introduite et mesurée dans l'ensemble
      chromatographe-spectromètre, et la quantité minimale détectable. Ce rapport
      dépend du type de colonne de chromatographie utilisé (comme remplie ou tubulaire
      ouverte) et du mode de fonctionnement du spectromètre (contrôle d'un ion spécifique
      ou balayage).
  examples: []
  id: r83-1990-11-fra
  notes: []
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: étendue dynamique d'un ensemble chromatographe en phase gazeuse/spectromètre
      de masse
  language_code: fra
