    type: accepted
  definition:
  - content: Différence entre le résultat le plus grand et le résultat le plus faible
      de mesures successives de la même charge réalisées dans les mêmes conditions
      de mesure.
  examples: []
  id: r134-1-2006-78-fra
  notes:
  - content: 'Les conditions de répétabilité incluent :'
  - content: "- la même procédure de mesure ;"
  - content: "- le même opérateur ;"
  - content: "- le même instrument de mesure, utilisé dans les mêmes conditions ;"
  - content: "- le même lieu ;"
  - content: "- une répétition sur une courte durée."
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: erreur de répétabilité
