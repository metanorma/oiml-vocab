  definition:
  - content: Device intended to perform a particular function, directly involved in
      elaborating, transmitting or displaying measurement results.
  examples: []
  id: r137-2012-e-3.1.8-eng
  notes:
  - content: 'The main ancillary devices are: a) repeating indicating device, b) printing
      device, c) memory device, and d) communication device.'
  - content: An ancillary device is not necessarily subject to metrological control.
  - content: An ancillary device may be integrated in the gas meter.
