  definition:
  - content: Compteur dans lequel des courants circulant dans des enroulements fixes
      réagissent sur des courants induits dans des pièces conductrices mobiles, généralement
      un (des) disque(s), ce qui entraîne leur mouvement proportionnel à l'énergie.
