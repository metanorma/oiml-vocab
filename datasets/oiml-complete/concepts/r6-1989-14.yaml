data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: Indication d'un compteur de gaz moins valeur (conventionnellement) vraie
      de la grandeur mesurée.
  examples: []
  id: r6-1989-14-fra
  notes:
  - content: 'Les erreurs (E) sont exprimées en valeur relative par le rapport (exprimé
      en pour-cent) de la différence entre le volume indiqué (V_i) et la valeur conventionnellement
      vraie (V_c) du volume du fluide d''essai qui a traversé le compteur de gaz,
      à cette dernière valeur : E(%) = 100 × (V_i − V_c) / V_c'
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Erreur (d'indication)
  language_code: fra
  entry_status: valid
