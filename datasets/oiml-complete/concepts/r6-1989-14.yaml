data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: The indication of a gas meter minus the (conventional) true value of
      the measurand.
  examples: []
  id: r6-1989-14-eng
  notes:
  - content: 'Errors (E) are expressed in relative values by the ratio (expressed
      as a percentage) of the difference between the indicated value (V_i) and the
      conventional true value (V_c) of the volume of the test medium which has passed
      through the gas meter, to this latter value: E(%) = 100 × (V_i − V_c) / V_c'
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Error (of indication)
  language_code: eng
  entry_status: valid
