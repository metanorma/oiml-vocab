      <table border="1"><tr><td rowspan="5">Family2Accuracy class IIITemperature range:-10℃/40℃</td><td>2.1</td><td>1.5kg</td><td>0.5g</td><td>0.5g</td><td>3000</td><td>X</td></tr><tr><td>2.2</td><td>3kg</td><td>1g</td><td>1g</td><td>3000</td><td></td></tr><tr><td>2.3</td><td>5kg</td><td>2g</td><td>2g</td><td>2500</td><td></td></tr><tr><td>2.4</td><td>15kg</td><td>5g</td><td>5g</td><td>3000</td><td>X</td></tr><tr><td>2.5</td><td>60kg</td><td>20g</td><td>20g</td><td>3000</td><td></td></tr></table>
  examples: []
  id: r76-2006-53-fra
  notes:
  - content: |-
      This example covers only the various capacities and metrological characteristics of the EUTs according to 3.10.4.2 to 3.10.4.4. The other metrologically relevant features according to 3.10.4.5 must in practice be taken into account, too, and may result in one or more additional EUTs.

      Remarks on the selection:

      - Variants 1.2, 2.1 and 2.4 are selected as EUTs (marked in last column of Table 8).

      - Variant 1.1 needs not be tested, because it has the same e and d as variant 1.2. Only the value of Max is reduced to 200 g (see 3.10.4.3).

      - Variant 1.2 has the best metrological characteristics of family 1 and shall be tested completely according to 3.10.4.2.

      - Variant 1.3 needs not be tested, because Max is not more than 5 times that for variant 1.2 (see 3.10.4.3).

      - Variant 2.1 has the best metrological characteristics of family 2, the smallest e and the greatest n. Therefore variant 2.1 shall be tested (see 3.10.4.4). It is sufficient to perform additionally only the applicable tests for class III. It is not necessary to repeat those tests which are the same for class II and class III and which have already been performed on variant 1.2.

      - Variants 2.2 and 2.3 need not be tested, because their values of Max are in between the tested variants 2.1 and 2.4 (see 3.10.4.3) and their metrological characteristics are less than or the same as for variants 2.1 and 2.4.

      - Variant 2.4 shall be tested, because the ratio between variant 2.5 and 2.1 is greater than 10 (see 3.10.4.3). For variant 2.4, it is sufficient to perform additionally some important tests such as weighing test, temperature, eccentricity, discrimination, repeatability, etc. It is normally not necessary to repeat other tests (e.g. tilting, power supply, humidity, span stability, endurance, disturbance tests) which have already been performed on variants 1.2 and 2.1.

      - Variant 2.5 needs not be tested, because Max is not more than 5 times that for variant 2.4 (see 3.10.4.3).

