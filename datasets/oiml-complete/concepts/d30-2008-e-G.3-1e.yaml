data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Any necessary specialized laboratory or laboratories designated by the
      Issuing Authority to carry out examination and testing of a sample or samples
      of a measuring instrument submitted for evaluation, with the Issuing Authority
      assuming responsibility for the evaluation report.
  examples: []
  id: d30-2008-e-G.3-1e-eng
  notes:
  - content: When used in connection with the MAA, a Testing Laboratory may be part
      of the organization containing the OIML Issuing Authority, or a subcontracting
      Testing Laboratory of the OIML Issuing Authority.
  - content: A Testing Laboratory may be a subcontractor of an inspection body.
