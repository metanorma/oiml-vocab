  definition:
  - content: method whereby sounds (known as Korotkoff sounds) are heard or detected
      (e.g. by a microphone) over an occluded artery as the occluding pressure is
      slowly released, the appearance of sounds coinciding with the systolic blood
      pressure and the disappearance of sounds with the diastolic blood pressure
