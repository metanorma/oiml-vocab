data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Diferencia entre el error en la indicación y el error intrínseco de un
      instrumento de medición.
  examples: []
  id: r46-1-spa-2.2.30-spa
  notes:
  - content: Principalmente, un fallo es el resultado de un cambio no deseado en los
      datos contenidos en o que fluyen por un instrumento de medición.
  - content: De la definición se desprende que un "fallo" es un valor numérico que
      se expresa ya sea en una unidad de medición o como un valor relativo, por ejemplo,
      un porcentaje.
  - content: En esta Recomendación, la definición anterior no aplica al término 'fallo
      en tierra', en el que la palabra 'fallo' tiene su significado usual según el
      diccionario.
