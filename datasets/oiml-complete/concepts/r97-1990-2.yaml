  definition:
  - content: |-
      2. 1. L'unité SI de pression est le pascal (symbole Pa) qui est le nom spécial du newton par mètre carré (symbole $ \mathrm{N / m^{2}} $ ).

      2. 2. Dans le SI le multiple du pascal préféré et le mieux adapté au mesurage de la pression atmosphérique ambiante est le kilopascal (symbole kPa) et son utilisation est recommandée.

      2. 3. Si l'échelle d'un instrument n'est pas graduée en unités SI, le manuel d'utilisation doit alors inclure les facteurs de conversion appropriés.
