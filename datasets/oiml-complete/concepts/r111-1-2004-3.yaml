data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: Set of operations establishing, under specified conditions, the relationship
      between the values of quantities indicated by a measuring instrument or measuring
      system, or the values represented by a material measure or a reference material,
      and the corresponding values realized by standards.
  examples: []
  id: r111-1-2004-3-eng
  notes:
  - content: The result of a calibration permits either the assigning of values of
      the measurand to the indications or the determination of corrections to be applied
      to the indications.
  - content: A calibration may also serve to determine other metrological properties
      such as the effect of influence quantities.
  - content: The result of a calibration may be recorded in a document sometimes called
      a calibration certificate or a calibration report.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: calibration
  language_code: eng
  entry_status: valid
