data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: Program(s), data and type-specific parameters that belong to the measuring
      instrument or device, and that define or fulfill functions which are subject
      to legal control.
  - content: 'Examples of legally relevant software are:'
  - content: "- final results of the measurement including the decimal sign and the
      unit;"
  - content: "- identification of the weighing range and the load receptor (if several
      load receptors have been used)."
  - content: 'The following types of legally relevant software can be distinguished:'
  - content: "- type-specific; and"
  - content: "- device-specific."
  examples: []
  id: r134-1-2006-19-eng
  notes: []
  sources: []
