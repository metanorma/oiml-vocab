    type: accepted
  definition:
  - content: Programme(s), données et paramètres spécifiques qui appartiennent à l'instrument
      de mesure ou au dispositif, et qui définissent ou remplissent des fonctions
      soumises au contrôle légal.
  - content: 'Des exemples de logiciel d''application légale sont :'
  - content: "- des résultats finaux de la mesure incluant le signe décimal et l'unité"
  - content: "- identification de l'étendue de pesage et du récepteur de charge (si
      plusieurs récepteurs de charge ont été utilisés)."
  - content: 'Les genres suivants de logiciel d''application légale peuvent être distingués
      :'
  - content: "- spécifiques au type ; et"
  - content: "- spécifiques au dispositif."
