    type: accepted
  definition:
  - content: |-
      The durability error due to wear and tear shall not be greater than the absolute value of the maximum permissible error.

      Adherence to this requirement is assumed if the instrument has passed the endurance test specified in A.6, which shall be performed only for instruments with Max $ \leq 1 0 0 \mathrm{~ k g}. $
