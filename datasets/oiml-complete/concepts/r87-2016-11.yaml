  definition:
  - content: quantité de produit dans un préemballage, mentionnée sur l'étiquette
  examples: []
  id: r87-2016-11-fra
  notes:
  - content: Le symbole « $ Q_{\mathrm{nom}} $ » est utilisé pour désigner la quantité
      nominale.
  - content: Dans certaines législations nationales, la quantité nominale du produit
      est appelée « quantité nette », « contenu net », « masse nette » ou « volume
      net ».
  - content: La quantité nominale doit être mentionnée conformément à OIML R 79 [1].
