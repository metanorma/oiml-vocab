  definition:
  - content: 'Partie d''un instrument affichant la valeur d''un résultat de pesage
      en unités de masse et pouvant en plus afficher:'
  - content: la différence entre la masse d'un article et une valeur de référence,
  - content: la valeur moyenne et/ou l'écart-type d'une série de pesages consécutifs.
