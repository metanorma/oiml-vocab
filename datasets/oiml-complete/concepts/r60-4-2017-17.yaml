    type: accepted
  definition:
  - content: Partie de l'instrument de pesage comprenant tous les dispositifs mécaniques
      et électroniques (c'est-à-dire le récepteur de charge, le dispositif transmetteur
      de charge, la cellule de pesée, et le dispositif analogique de traitement des
      données ou le dispositif numérique de traitement des données) mais n'ayant pas
      les moyens d'afficher le résultat de pesage. Il peut en option avoir des dispositifs
      permettant le traitement (numérique) de données et de fonctionnement de l'instrument.
