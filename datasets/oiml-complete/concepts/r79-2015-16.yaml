  definition:
  - content: |-
      B.4.1 Los requisitos para la región de la SADC se establecen en el Documento 1 [5] SADC Cooperation in Legal Metrology (SADCMEL). Estos requisitos se presentan de B.4.2 a B.4.5.

      B.4.2 Para productos preempacados que llevan la información de la cantidad neta en unidades de masa, volumen o volumen en medidas cúbicas, las letras y números usados en la indicación de la cantidad neta deben tener la altura mínima establecida en la Tabla B.3, excepto si B.4.3 es aplicable.

      <div align="center">

      Tabla B.3. Altura mínima de números y letras

      </div>

      <table border="1"><tr><td>Contenido neto(C)</td><td>Altura mínima de números y letras, en milímetros</td></tr><tr><td>C≤50g(o mL)</td><td>2</td></tr><tr><td>50g(o mL)＜C≤200g</td><td>3</td></tr><tr><td>(o mL)200g(o mL)＜C</td><td>4</td></tr><tr><td>≤1kg(o L)</td><td>6</td></tr></table>

      B.4.3 Cuando el contenido neto aparece en una etiqueta adhesiva impresa por el instrumento de medición aprobado para uso en comercio, la altura de la indicación no debe ser inferior a 2 mm ni necesita tener un tamaño superior, independientemente de la cantidad de contenido. Si la etiqueta también lleva una descripción del precio, esta descripción no debe exceder el doble de la altura de la indicación de la cantidad neta.

      B.4.4 Para productos preempacados que llevan la indicación de la cantidad neta en unidades diferentes de las que se indican en B.4.2, la altura mínima de las letras y números usados en la indicación de la cantidad neta se debe basar en la mayor dimensión del preempacado, ya sea el diámetro, la altura, la longitud o el ancho, de acuerdo con la Tabla B.4, excepto que se aplique lo establecido en B.4.5.

      <div align="center">

      Tabla B.4. Altura mínima de números y letras

      </div>

      <table border="1"><tr><td>Dimensión(D)máxima de los preempacados, en milímetros</td><td>Altura mínima de números y letras, en milímetros</td></tr><tr><td>D≤200</td><td>3</td></tr><tr><td>200＜D≤300</td><td>5</td></tr><tr><td>300＜D≤500</td><td>10</td></tr><tr><td>500＜D</td><td>20</td></tr></table>

      B.4.5 Cuando el contenido neto aparece en una etiqueta adhesiva impresa por un instrumento de medición aprobado para uso en comercio, la altura de la indicación no debe ser inferior a 2 mm ni necesita tener un tamaño superior, independientemente del tamaño del preempacado. Si la etiqueta también lleva una descripción del precio, esta descripción no debe exceder el doble de la altura de la indicación de la cantidad neta.

      <div align="center">

      # Anexo C

      Métodos sugeridos para indicar la cantidad en los

      preempacados

      (Informativo)

      </div>

      C.1 Cuando no sea apropiado ni suficiente declarar la cantidad total, se puede usar la información siguiente como declaraciones de cantidad alternativas.

      C.1.1 Cuando el número de elementos en un preempacado y la cantidad de cada elemento se pueden controlar adecuadamente, el número de elementos y la cantidad de cada elemento se puede indicar en una declaración de cantidad suplementaria [por ejemplo, masa neta 100 g (bolsas de té $ 1 0 \times 1 0 \mathrm {g} $)].

      C.1.2 Cuando un preempacado consta de dos o más preempacados separados, cada uno de ellos marcado de conformidad con esta Recomendación para venta individual empacados juntos en un preempacado externo que solo se prevé abrir en el momento en que se ofrezcan los productos a la venta, la declaración de la cantidad marcada en el preempacado externo debería informar el número de preempacados individuales contenidos en él, y la cantidad en cada uno estos preempacados.

      Sin embargo,

      a) también puede ir marcada en el preempacado externo la cantidad total de todos los preempacados individuales; y

      b) no debería ser obligatoria la declaración de la cantidad en el recipiente externo cuando sea posible observar y contar fácilmente los preempacados individuales, y ver claramente la indicación de la cantidad contenida en cada preempacado individual, sin abrir dicho recipiente externo.

      C.1.3 Cuando un preempacado contiene dos o más preempacados individuales en los que no está marcada la cantidad para venta individual:

      a) la cantidad total de todos los preempacados individuales se debería declarar en el recipiente externo; o

      b) se debería identificar el producto y la cantidad declarada para cada preempacado individual, en los casos en que el recipiente externo contenga diferentes tipos de productos, por ejemplo, un kit de tintura para el cabello que contiene dos tipos diferentes de pasta o una pasta y un líquido.
