  definition:
  - content: Absorbance divided by the optical pathlength b and the amount of substance
      concentration c.
  examples: []
  id: r135-2004-8-eng
  notes:
  - content: The derived SI unit is the square metre per mole (m^2/mol), but the litre
      per mole per mm (L/(mol·mm) or litre per mole per cm (L/(mol·cm) is often used.
  - content: The specific molar absorption coefficient slightly depends on the amount
      of substance concentration.
