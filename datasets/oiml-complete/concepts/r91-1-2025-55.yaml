  dates:
  - date: '2026-07-15T00:00:00Z'
    type: accepted
  definition:
  - content: quantity that, in a direct measurement, does not affect the quantity
      that is actually measured, but affects the relation between the indication and
      the measurement result
  examples: []
  id: r91-1-2025-55-eng
  notes:
  - content: 'For speed meters the following quantities are examples of influence
      quantities: ambient temperature, measurement angle, acceleration of measured
      vehicle, distance and speed of other vehicles on the same or neighbouring lanes.'
  sources: []
