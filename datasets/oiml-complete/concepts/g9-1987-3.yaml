  notes:
  - content: |-
      An extensive list (75 pages) of mainly English, German and Russian book titles with indication of author and editor is given in a compilation for IMEKO TC-1 edited by P.H. Sydenham (Australia) : "A working list of books published in measurement science and technology in the physical sciences". This list can be obtained from

      Delft University of Technology

      Department of Applied Physics

      P.O. Box 5046

      2600 GA DELFT

      The list comprises books published from 1950 (and earlier in a few cases to 1979. It may be expected however that many of the earlier books are no longer commercially available.

      Niebuhr J. - Physikalische Messtechnik

      Band I : Aufnehmer und Anpasser

