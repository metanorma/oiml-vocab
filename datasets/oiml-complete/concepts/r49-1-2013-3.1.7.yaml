  definition:
  - content: dispositif connecte a ou incorpore au compteur pour la correction automatique
      du volume de l'eau aux conditions de mesure, en tenant compte du debit et /
      ou des caracteristiques de l'eau a mesurer et des courbes d'etalonnage pre-etablies
  examples: []
  id: r49-1-2013-fra-3.1.7-fra
  notes:
  - content: Les caracteristiques de l'eau, par exemple la temperature et la pression,
      peuvent etre mesurees soit en utilisant des instruments de mesure associes,
      soit stockees dans la memoire du compteur.
  - content: Pour la definition du terme "correction", voir OIML V 2-200:2012 (VIM)
      [1], 2.53.
