  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Es un dispositivo conectado o incorporado al medidor para corregir automáticamente
      el volumen de agua bajo las condiciones de medición, tomando en cuenta el caudal
      y/o las características del agua a ser medida y las curvas de calibración preestablecidas.
  examples: []
  id: r49-1-2013-spa-3.1.7-spa
  notes:
  - content: Las características del agua (por ejemplo, la temperatura y presión)
      pueden también ser medidas utilizando instrumentos de medición asociados, o
      almacenadas en la memoria del medidor.
  - content: Para la definición del término "corrección", ver OIML V 2-200:2012 (VIM)
      [1], 2.53.
