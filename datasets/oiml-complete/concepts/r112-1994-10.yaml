  definition:
  - content: Étendue des concentrations ou des débits massiques d'un composant de
      l'échantillon examiné pour laquelle la sensibilité du détecteur est constante
      à 5 % près. Sa valeur correspond au rapport de la limite supérieure de linéarité
      à la limite de détection.
