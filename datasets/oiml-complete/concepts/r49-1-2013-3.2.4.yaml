    type: accepted
  definition:
  - content: valeur de la quantite mesuree moins valeur de la quantite de reference
  examples: []
  id: r49-1-2013-fra-3.2.4-fra
  notes:
  - content: Pour l'application de cette partie de l'OIML R 49, le volume indique
      est considere comme la valeur de la quantite mesuree et le volume reel comme
      la valeur de la quantite de reference. La difference entre le volume indique
      et le volume reel est denommee erreur (d'indication).
  - content: Dans cette recommandation, l'erreur (d'indication) est exprimee en pourcentage
      du volume reel et est egal a (Vi - Vr) / Vr * 100 %
