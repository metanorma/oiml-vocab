  definition:
  - content: Body under supervision - a business involved in activities being the
      subject of public interest, e.g. manufacture, repair, distribution, installation
      and/or use of a measuring instrument and prepackages in trade transactions,
      health protection and protection of private property, work safety and protection
      of the environment, as specified by national metrology legislation.
