    type: accepted
  definition:
  - content: Dispositif qui utilise des composants électroniques et qui accomplit
      une fonction spécifique. Les dispositifs électroniques sont usuellement fabriqués
      en tant qu'unités séparées et sont susceptibles d'être essayés séparément.
  examples: []
  id: r6-1989-13-fra
  notes:
  - content: Les dispositifs électroniques, selon cette définition, peuvent être des
      compteurs de gaz complets ou des parties de compteur de gaz.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Dispositif électronique
  language_code: fra
