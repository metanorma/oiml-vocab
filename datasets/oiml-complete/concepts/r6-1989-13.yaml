    type: accepted
  definition:
  - content: A device employing electronic components and performing a specific function.
      Electronic devices are usually manufactured as separate units and are capable
      of being independently tested.
  examples: []
  id: r6-1989-13-eng
  notes:
  - content: An electronic device, as defined above may be a complete gas meter or
      part of a gas meter.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Electronic device
  language_code: eng
  entry_status: valid
