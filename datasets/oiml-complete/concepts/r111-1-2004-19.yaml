  definition:
  - content: 'Parameter describing the assessed roughness profile of a sample. The
      letter R indicates the type of assessed profile, in this case R for roughness
      profile. The assessed profile of a sample may be of different types of profile:
      a roughness profile or R-parameter, a primary profile or P-parameter, a waviness
      profile or W-parameter [4].'
