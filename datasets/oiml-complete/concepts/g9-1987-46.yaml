  - content: |-
      Chapter 5.5, Fidelity and Security of Flow Measurement Pulsed-Data Transmission Systems, First Edition, June 1982

      This chapter provides a guide to the selection, operation, and maintenance of pulsed-data, cabled transmission systems for fluid metering systems to provide the desired level of fidelity and security of transmitted data. 7 pages.

      Price each, $4.00
