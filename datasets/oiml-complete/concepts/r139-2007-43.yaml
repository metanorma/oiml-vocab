    type: accepted
  definition:
  - content: Réservoir d'essai ou ensemble de réservoirs d'essai reliés entre eux
      par un collecteur, qui constitue un élément d'un système de stockage de gaz
      à plusieurs segments. Les segments fonctionnent à des niveaux de pression différant
      l'un de l'autre, dans un système d'alimentation utilisant un dispositif de contrôle
      séquentiel (voir T.4.9 ci-après).
  examples: []
  id: r139-2007-43-fra
  notes:
  - content: Les essais au moyen de banques génèrent des débits transitoires.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Banque
