    type: accepted
  definition:
  - content: Test reservoir or a set of test reservoirs manifolded together which
      forms part of a multi-segment gas storage system. The segments operate at different
      pressure levels from one another in refueling systems fitted with or using a
      sequential control device (see T.4.9 below).
  examples: []
  id: r139-2007-43-eng
  notes:
  - content: Testing using banks generates transient flowrates.
  sources: []
