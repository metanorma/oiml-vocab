    type: accepted
  definition:
  - content: In principle, the standard weights or standard masses used for the type
      examination or verification of an instrument shall meet the metrological requirements
      of OIML R 111. They shall not have an error greater than 1/3 of the maximum
      permissible error of the instrument for the applied load. If they belong to
      class $ \mathrm{E}_{2} $ or better, their uncertainty (rather than their error)
      is allowed to be not greater than 1/3 of the maximum permissible error of the
      instrument for the applied load, provided that the actual conventional mass
      and the estimated long-term stability is taken into account.
