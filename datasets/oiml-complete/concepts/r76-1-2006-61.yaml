data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: Paramètre d'application légale avec une valeur qui dépend de l'instrument
      individuellement. Les paramètres spécifiques au dispositif comprennent les paramètres
      d'etalonnage (par exemple, le réglage de la pente ou d'autres réglages ou corrections)
      et les paramètres de configuration (par exemple, la portée maximale, la portée
      minimale, les unités de mesure, etc.). Ils sont réglables ou sélectables seulement
      par un mode d'opération spéciale de l'instrument. Les paramètres spécifiques
      du dispositif peuvent être classés comme ceux qui doivent être sécurisés (inaltérables)
      et ceux qui peuvent être accessibles (paramètres sélectables) par une personne
      autorisée.
