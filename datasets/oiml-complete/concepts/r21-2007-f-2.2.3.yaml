  definition:
  - content: Dispositif de comptage ne pouvant être remis à zéro, s'incrémentant chaque
      fois que les paramètres spécifiques (2.2.8.3) d'un dispositif sont changés.
      La valeur de référence du compteur au moment de la vérification primitive ou
      ultérieure est fixée et sécurisée par un moyen matériel ou logiciel approprié.
