    type: accepted
  definition:
  - content: When an instrument is fitted with an auxiliary verification device, or
      when it is verified with a separate auxiliary device, the maximum permissible
      errors of this device shall be 1/3 of the maximum permissible errors for the
      applied load. If weights are used, the effect of their errors shall not exceed
      1/5 of the maximum permissible errors of the instrument to be verified for the
      same load.
