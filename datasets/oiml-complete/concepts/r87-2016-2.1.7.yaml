    type: accepted
  definition:
  - content: Cantidad de producto en un preempacado, declarada en la etiqueta.
  examples: []
  id: r87-2016-spa-2.1.7-spa
  notes:
  - content: El símbolo "Q_nom" se usa para designar la cantidad nominal.
  - content: En algunas legislaciones nacionales, la cantidad nominal de producto
      se denomina "cantidad neta", "contenido neto", "masa neta" o "volumen neto".
  - content: La cantidad nominal se debería declarar de acuerdo con la Recomendación
      OIML R 79.
