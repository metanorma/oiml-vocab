    type: accepted
  definition:
  - content: Stockage utilisé pour garder les données de mesure après achèvement du
      mesurage pour des utilisations ultérieures d'application légale (par exemple
      conclusion d'une transaction commerciale à une date ultérieure, lorsque le client
      n'est pas présent pour la détermination du total, ou pour des applications spéciales
      identifiées et réglementées par l'Etat).
