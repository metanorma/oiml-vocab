    type: accepted
  definition:
  - content: meter comprising one large meter, one small meter, and a changeover device
      that, depending on the magnitude of the flow rate (3.3.1) passing through the
      meter, automatically directs the flow through either the small or the large
      meter, or both
  examples: []
  id: r49-1-2024-eng-3.1.16-eng
  notes:
  - content: The meter reading is obtained from two independent totalizers, or from
      one totalizer which adds up the values from both meters.
