  definition:
  - content: Distance la plus courte à laquelle un observateur peut s'approcher librement
      du dispositif indicateur pour effectuer une lecture dans des conditions normales
      d'emploi.
  examples: []
  id: r76-1-2006-fra-T.5.4.4-fra
  notes:
  - content: On admet que cette approche est libre pour l'observateur s'il existe
      devant le dispositif indicateur un dégagement d'au moins 0,8 m (voir Figure
      2).
