  definition:
  - content: Valeur conventionnelle du résultat d'une pesée dans l'air, conformément
      au document OIML D28. Pour un poids pris à la température de référence de 20
      °C, la masse conventionnelle est la masse d'un poids de référence d'une densité
      de 8000 kg/m³ qu'elle équilibre dans un air de masse volumique de 1,2 kg/m³.
