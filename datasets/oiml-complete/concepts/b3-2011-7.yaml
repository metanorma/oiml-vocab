data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: Systematic examination and testing of the performance of one or more
      specimens of an identified type of measuring instrument against documented requirements,
      the results of which are contained in an evaluation report, in order to determine
      whether the type may be approved
  examples: []
  id: b3-2011-7-eng
  notes:
  - content: 'Note 1: Measuring instruments could here include modules as defined
      in 3.4.'
  - content: 'Note 2: The word "certified" used in this Publication should be understood
      as "conformity to the relevant OIML Recommendation" (e.g. certified type).'
  - content: 'Note 3: Evaluation reports include one (or several) Test Report(s) as
      defined in 3.14. Note that TC1 is envisioning to change the definition of "Type
      evaluation" in the VIML to: "conformity assessment procedure on one or more
      specimens of an identified type of measuring instrument which results in an
      evaluation report and/or an evaluation certificate".'
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Type evaluation
  language_code: eng
