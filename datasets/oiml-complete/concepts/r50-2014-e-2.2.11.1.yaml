  definition:
  - content: part of all software modules of a measuring instrument, electronic device,
      or sub-assembly that is legally relevant
  examples: []
  id: r50-2014-e-2.2.11.1-eng
  notes:
  - content: Examples of legally relevant software are software involved in the determination
      of the final results of the measurement including the decimal sign and the unit,
      identification of the weighing range, software identification, and load receptor
      identification and configuration information.
