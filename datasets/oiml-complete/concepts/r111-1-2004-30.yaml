data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: Set of tests and visual examinations, also performed by an agent of the
      legal metrology service (inspector), to determine whether the weights or sets
      of weights, having been in service for some time since the previous verification,
      continue to be conform or are again conform to the regulations and maintain
      their metrological characteristics within the fixed limits. If the weights or
      sets of weights successfully pass all the tests and examinations, their legal
      character is either maintained or re-established by their acceptance, which
      is evidenced by stamping and/or the issuing of a verification certificate. When
      stamping is used to verify a set of weights, all the elements of the set are
      considered as verified.
  examples: []
