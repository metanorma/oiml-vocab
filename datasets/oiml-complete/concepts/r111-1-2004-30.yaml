    type: accepted
  definition:
  - content: Ensemble d'essais et d'examens visuels, également réalisés par un agent
      du service de métrologie légale (inspecteur), pour déterminer si les poids ou
      jeux de poids, ayant été en service un certain temps depuis la vérification
      précédente, continuent d'être conformes ou sont à nouveau conformes aux réglementations
      et maintiennent leurs caractéristiques métrologiques dans les limites fixées.
      Si les poids ou jeux de poids passent avec succès tous les essais et examens,
      leur caractère légal est soit maintenu soit rétabli par leur acceptation, qui
      est mise en évidence par un poinçonnage et/ou la délivrance d'un certificat
      de vérification. Lorsque le poinçonnage est utilisé pour vérifier un ensemble
      de poids, tous les éléments de l'ensemble sont considérés comme vérifiés.
  examples: []
