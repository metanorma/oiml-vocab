    type: accepted
  definition:
  - content: Organization that has been authorized by the national responsible body
      to provide a declaration of conformity of a manufactured measuring instrument
      to legal requirements.
  examples: []
  id: d27-2001-e-2.17-eng
  notes:
  - content: This term may also apply to distributors, importers, assemblers, installers,
      repackagers, relabelers, etc. that have responsibility for assuring the quality
      and performance of a measuring instrument prior to its being placed in service.
