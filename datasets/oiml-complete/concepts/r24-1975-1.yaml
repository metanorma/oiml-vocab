    type: accepted
  definition:
  - content: Erreur maximale, en plus ou en moins, tolérée à la température de référence
      de 20 °C sur le mètre étalon pour Agents de vérification, en vérification initiale
      ou lors des vérifications ultérieures, quand ce mètre est comparé à l'étalon
      de longueur correspondant de précision supérieure (dans la hiérarchie légale
      des étalons) en présumant que cet étalon de précision supérieure a, pour les
      buts de cette comparaison, une erreur négligeable.
