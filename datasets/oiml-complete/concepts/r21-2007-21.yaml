data:
  dates:
  - date: '2026-07-15T11:14:45Z'
    type: accepted
  definition:
  - content: |-
      Urządzenie słuce do przeglazania taksometru w okleje pozycje robocze (patrz pkt 2.3.3).

      Urządzenie określające pozycję roboczą moze na przykład zawietakonkretne przyciski i przezzniki dla określonych funkcji.

      2. 3 Charakterystyki metrologiczne

      2. 3.1 Dane pomiarowe

      2. 3.1.1 Opłata za przejazd

      Kwota pieniężna obliczona, wskazana i wyietlona przez taksometr jako opłata za przejazdna za przejazd taksówk w oparciu o stał opłate początkowa (z wyłączeniem wszelkich opłat dodatkowych) i/lub drogę i/lub czas przejazdu.
  examples: []
  id: r21-2007-21-pol
  notes: []
  sources: []
