  definition:
  - content: Ensemble de poids généralement présenté en coffret et composé de façon
      à permettre toute pesée de charges comprises entre la masse du poids de la plus
      petite valeur nominale et la somme des masses de tous les poids de l'ensemble
      avec une progression dont la masse du poids de la plus petite valeur nominale
      constitue l'échelon de la série.
