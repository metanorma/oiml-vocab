  definition:
  - content: A series of weights, usually presented in a case so arranged to make
      possible any weighing of all loads between the mass of the weight with the smallest
      nominal value and the sum of the masses of all weights of the series with a
      progression in which the mass of the smallest nominal value weight constitutes
      the smallest step of the series.
