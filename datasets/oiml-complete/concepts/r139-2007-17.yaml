  definition:
  - content: Dispositif spécifique faisant partie de l'installation en libre-service
      et permettant à un ou plusieurs ensembles de mesurage de fonctionner dans cette
      installation.
  examples: []
  id: r139-2007-17-fra
  notes:
  - content: Le dispositif de libre-service inclus tous les éléments et constituants
      obligatoires pour qu'un ensemble de mesurage fonctionne dans une installation
      en libre-service.
  - content: L'installation est constituée du dispositif de libre-service et des ensembles
      de mesurage qui lui sont connectés.
