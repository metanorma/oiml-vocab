data:
  dates:
  - date: '2026-07-15T00:00:00Z'
    type: accepted
  definition:
  - content: 'The minimum amount of a specific compound which, when injected into
      the gas chromatograph can produce a signal-to-noise ratio of at least 10 for
      a characteristic molecular ion of that compound subject to the following conditions:
      in the full scan mode, a scan time over the appropriate mass range shall be
      specified; in the selected ion monitoring (SIM) mode, the principal ion characterizing
      the compound shall be measured. The mode of ionization (electron impact or chemical
      ionization) shall be considered.'
  examples: []
  id: r83-1990-10-eng
  notes:
  - content: Methyl stearate is often used as the test compound.
  - content: The term "sensitivity" is frequently used to have the same meaning as
      this term within the community of mass spectrometer manufacturers and users.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Detection limit of a gas chromatograph/mass spectrometer system
  language_code: eng
  entry_status: valid
