  definition:
  - content: Mode de l'éthylomètre pour lequel seuls certains circuits sont sous tension
      afin d'économiser l'énergie et/ou de prolonger la durée de vie d'un composant,
      tout en permettant d'atteindre le mode « mesure » plus rapidement qu'à partir
      de l'état de hors tension générale.
