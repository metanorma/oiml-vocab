    type: accepted
  definition:
  - content: The mode of the EBA in which only certain circuits are energized in order
      to conserve power and/or prolong component life, and to attain the measuring
      mode more rapidly than would be possible if starting from the un-powered state.
  examples: []
  id: r126-1998-7-eng
  notes: []
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Stand-by mode
  language_code: eng
  entry_status: valid
