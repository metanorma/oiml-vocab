  notes:
  - content: pour un compteur d'eau, le capteur peut être un disque, un piston, une
      roue, les éléments d'une turbine, les électrodes d'un compteur électromagnétique,
      ou un autre élément. Ces éléments détectent le débit ou le volume d'eau passant
      au travers du compteur que l'on appelle capteur de débit ou de volume.
