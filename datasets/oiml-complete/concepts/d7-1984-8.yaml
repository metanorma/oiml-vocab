  definition:
  - ? Étroitesse de l'accord entre les résultats des mesurages successifs du même
      mesurande effectués avec l'application de la totalité des conditions suivantes
    : même méthode de mesure, même observateur, même instrument de mesure, même lieu,
      mêmes conditions d'utilisation, répétition sur une courte période de temps.
  examples: []
  id: d7-1984-8-fra
  notes:
  - content: La répétabilité peut s'exprimer quantitativement par une caractéristique
      de dispersion des résultats.
