  definition:
  - content: part of the meter which receives the output signals from the transducer(s)
      and, possibly, from associated measuring instruments, transforms them and, if
      appropriate, stores the results in memory until they are used
  examples: []
  id: r49-1-2000-eng-2.1.4-eng
  notes:
  - content: In addition, the calculator may be capable of communicating both ways
      with ancillary devices.
