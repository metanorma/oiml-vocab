data:
  dates:
  - date: '2026-07-15T00:00:00Z'
    type: accepted
  definition:
  - ? Un processus de mesure est en état de contrôle statistique si les observations
      résultant du processus, lorsqu'elles sont collectées dans des conditions expérimentales
      quelconques fixées à l'intérieur du domaine des conditions a priori bien définies
      du processus, se comportent comme des tirages aléatoires à partir d'une distribution
      fixée ayant des paramètres de position et d'échelle fixés. Une définition plus
      facile à comprendre mais moins rigoureuse est
    : un processus de mesure est dans un état de contrôle statistique si la dispersion
      des données provenant de mesurages répétés du même sujet au cours d'une période
      de temps ne change pas avec le temps, et s'il n'y a ni dérive non prévisible,
      ni dérive soudaine dans la moyenne des mesurages répétés du même sujet.
