  definition:
  - content: La capacité « délivrée » d'une fiole étalon graduée correspondant à un
      trait de graduation (désignée par capacité « Ex ») est égale au volume d'eau
      qu'elle délivre à la température de référence quand, après avoir été remplie
      jusqu'à ce trait de graduation, on la vide.
