    type: accepted
  definition:
  - content: dispositif intégré au compteur qui permet de détecter et de mettre en
      évidence des défauts significatifs
  examples: []
  id: r49-1-2013-69-fra
  notes:
  - content: Le contrôle d'un dispositif de transmission a pour but de vérifier que
      toute l'information transmise (et uniquement cette information) est reçue intégralement
      par l'équipement récepteur.
