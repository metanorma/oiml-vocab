  definition:
  - content: Dispositif integrant toutes les informations necessaires et recevant
      tous les signaux necessaires provenant des transducteurs de facon a lui permettre
      de calculer la masse contenue dans le reservoir ainsi que d'autres grandeurs.
      Il peut aussi memoriser l'information, fournir des fonctions de controle de
      l'information et communiquer avec les dispositifs auxiliaires.
