data:
  dates:
  - date: '2026-07-15T00:00:00Z'
    type: accepted
  definition:
  - content: Facility incorporated in an electronic automatic level gauge that enables
      incorrect functioning of a specific device of the ALG and/or disturbed communication
      between specific devices of the ALG to be detected and acted upon.
  examples: []
  id: r85-1-2-2008-10-eng
  notes:
  - content: '"Acted upon" refers to any adequate response by the ALG (luminous signal,
      acoustic signal, prevention of the measurement process, etc.).'
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Checking facility
  language_code: eng
  entry_status: valid
