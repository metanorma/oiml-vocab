    type: accepted
  definition:
  - content: Parameter of a magnetic dipole. The intensity of the magnetic field generated
      by a dipole and the force between the dipole and a magnetised sample are proportional
      to this dipole moment. The force between the dipole and a sample having a magnetic
      susceptibility is proportional to the square of the dipole moment.
