data:
  dates:
  - date: '2026-07-15T00:00:00Z'
    type: accepted
  definition:
  - content: Concentration d'un composant de l'échantillon examiné provoquant un signal
      de sortie du détecteur égal à trois fois le niveau du bruit à court terme.
  examples: []
  id: r112-1994-9-fra
  notes:
  - ? On trouve aussi le terme «détection minimale» dans quelques unes des références
      et dans les prospectus des constructeurs. On définit parfois la limite de détection
      comme un signal de sortie égal à d'autres multiples (par exemple
    : deux ou dix) du bruit.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Limite de détection de l'instrument
  language_code: fra
  entry_status: valid
