  - date: 2026-07-16
    type: accepted
  definition:
  - content: The concentration of the sample component of interest that gives a detector
      output signal equal to three times the short-term noise.
  examples: []
  id: r112-1994-9-eng
  notes:
  - content: This term is also referred to as "minimum detectability" in some references
      and manufacturer's literature.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: detection limit for the instrument
  language_code: eng
  entry_status: valid
