data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: organisme de certification d'un État Membre d'OIML et délivrant des Certificats
      OIML et des rapports d'évaluation de type OIML associés conformément au Régime
      A ou Régime B
  examples: []
  id: b18-2018-27-fra
  notes:
  - content: Un État Membre de l'OIML disposant d'une Autorité de Délivrance OIML
      pour une catégorie d'instruments de mesure soumis au Régime A désignera au moins
      un Utilisateur (voir 3.43) pour cette catégorie d'instruments de mesure. Le(s)
      Utilisateur(s) peut / peuvent être une ou des organisation(s) différente(s)
      de l'Autorité de Délivrance OIML.
  - content: L'exigence de désigner au moins un Utilisateur (voir 3.44) ne s'applique
      pas dans le cas d'un État Membre de l'OIML qui ne réglemente pas nationalement
      cette catégorie particulière d'instruments de mesure.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Autorité de Délivrance OIML (AD)
  language_code: fra
  entry_status: valid
