data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: certification body from an OIML Member State issuing OIML Certificates
      and associated OIML type evaluation reports in accordance with Scheme A or Scheme
      B
  examples: []
  id: b18-2018-27-eng
  notes:
  - content: An OIML Member State having an OIML Issuing Authority for a category
      of measuring instrument under Scheme A shall designate at least one Utilizer
      (see 3.44) for that category of measuring instrument. The Utilizer(s) may be
      a different organization(s) than the OIML Issuing Authority.
  - content: The requirement to designate at least one Utilizer (see 3.44) shall not
      apply when the OIML Member State does not regulate that particular category
      of measuring instrument in their country.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: OIML Issuing Authority (IA)
  language_code: eng
  entry_status: valid
