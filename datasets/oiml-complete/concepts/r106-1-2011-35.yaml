data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: paramètre à caractère légal dont la valeur dépend de l'instrument pris
      individuellement
  - content: de tels paramètres comprennent des paramètres d'étalonnage (par ex. réglages
      de pente ou corrections) et des paramètres de configuration (par ex. portée
      maximale, portée minimale, unités de mesure, etc.)
  - content: ils ne peuvent être ajustés ou sélectionnés que dans un mode de fonctionnement
      spécial de l'instrument et peuvent être classés soit comme paramètres qui devraient
      être sécurisés (non modifiables), soit comme paramètres accessibles (paramètres
      configurables) par une personne autorisée
