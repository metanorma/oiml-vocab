    type: accepted
  definition:
  - content: Élément ou dispositif, autre qu'un dispositif complémentaire, nécessaire
      pour assurer un mesurage correct, ou destiné à faciliter les opérations de mesurage,
      ou pouvant influer sur le mesurage de quelque manière que ce soit.
  - content: 'Les principaux dispositifs additionnels sont :'
  - content: "- filtre,"
  - content: "- dispositif constituent le point de transfert,"
  - content: "- dispositif anti-tourbillon,"
  - content: "- bifurcations ou dérivations,"
  - content: "- vannes, flexibles, et, d'une façon générale, les éléments constituent
      le circuit gazeux."
