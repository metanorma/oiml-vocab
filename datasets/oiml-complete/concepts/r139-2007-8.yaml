  definition:
  - content: Part or device, other than an ancillary device, required to ensure correct
      measurement or intended to facilitate the measuring operations, or which could
      in any way affect the measurement.
  - content: 'Main additional devices are:'
  - content: "- filter;"
  - content: "- device used for the transfer point;"
  - content: "- anti-swirl device;"
  - content: "- branches or bypasses;"
  - content: "- valves, hoses, and in general, all the gaseous piping."
