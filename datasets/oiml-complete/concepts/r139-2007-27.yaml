data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: Valeurs extrêmes tolérées par la présente Recommandation pour une erreur.
  examples: []
  id: r139-2007-27-fra
  notes:
  - content: Dans la suite du texte, les erreurs maximales tolérées sont données,
      selon le cas, sous forme d'erreurs relatives ou sous forme d'erreurs absolues.
  - content: 'Pour faciliter l''écriture du texte, certaines spécifications ci-après
      font intervenir la comparaison d''une quantité (par exemple: différence entre
      un résultat obtenu dans des conditions spécifiées et un résultat obtenu dans
      les conditions de référence) à l''erreur maximale tolérée. Dans ce cas, c''est
      évidemment l''erreur absolue maximale tolérée, associée à l''erreur relative
      maximale tolérée, qui est à considérer.'
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Erreurs maximales tolérées
  language_code: fra
  entry_status: valid
date_accepted: '2026-07-16T00:00:00+00:00'
