data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: Extreme values permitted by the present Recommendation for an error.
  examples: []
  id: r139-2007-27-eng
  notes:
  - content: In this text, maximum permissible errors are stated, according to the
      case, as relative errors (general case) or absolute errors.
  - content: 'To simplify writing, some specifications in the present text involve
      the comparison of a quantity (for instance: difference between a result obtained
      at some specified conditions and a result obtained at reference conditions)
      with maximum permissible error. In this case, it is obvious that it is the absolute
      maximum permissible error, associated with the relative maximum permissible
      error, which applies.'
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Maximum permissible errors
  language_code: eng
  entry_status: valid
