data:
  dates:
  - date: '2026-07-15T00:00:00+00:00'
    type: accepted
  definition:
  - content: Déclaration fournie sous l'unique responsabilité d'un fabricant autorisé,
      ayant un système de management de la qualité validé, selon laquelle un instrument
      de mesure satisfait aux exigences légales de métrologie pour la vérification
      primitive conformément à son type approuvé, si nécessaire.
  examples: []
  id: d27-2001-18-fra
  notes:
  - content: Les exigences légales peuvent être publiées en tant que lois ou réglementations
      ou dans des normes documentaires référencées dans celles-ci.
  sources: []
