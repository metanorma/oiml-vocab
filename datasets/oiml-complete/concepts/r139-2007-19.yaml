    type: accepted
  definition:
  - content: Mode de fonctionnement d'une installation en libre-service dans lequel
      l'installation en libre-service délivre l'autorisation de livraison sur action
      du client.
  examples: []
  id: r139-2007-19-fra
  notes:
  - content: Dans le mode de service non surveillé, l'opération de mesurage se termine
      à la fin de l'enregistrement (impression et/ou mémorisation) des informations
      concernant l'opération de mesurage.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Mode de service non surveillé
  language_code: fra
