  definition:
  - content: Operating mode of a self-service arrangement in which the self-service
      arrangement controls the authorization for the delivery, based on an action
      of the customer.
  examples: []
  id: r139-2007-19-eng
  notes:
  - content: In unattended service mode, the end of the measurement operation is the
      end of the registration (printing and/or memorizing) of information concerning
      the measurement operation.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Unattended service mode
