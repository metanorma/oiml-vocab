  definition:
  - content: Condition de l'instrument telle que les valeurs de pesée enregistrées
      ne montrent pas plus de deux valeurs adjacentes pour chaque cycle de pesage
      ; l'une d'entre elles étant la valeur finale de Poids. Cette condition est valide
      uniquement pour chaque cycle de pesage séparé mais pas pour un groupe de cycles.
