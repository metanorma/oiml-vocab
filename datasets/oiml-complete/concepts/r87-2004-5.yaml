  definition:
  - content: Un préemballage inadéquat pour lequel il est constaté que la quantité
      réelle contenue est inférieure à la quantité nominale moins l'insuffisance tolérée
      autorisée en 4.2.3 pour la quantité nominale, est désigné comme erreur T1.
  - content: 'Erreur T1: Contenu réel < (Q_n - T)'
