  definition:
  - content: An inadequate prepackage found to contain an actual quantity less than
      the nominal quantity minus the tolerable deficiency allowed in 4.2.3 for the
      nominal quantity is called a T1 error.
  - content: 'T1 error: Actual contents < (Q_n - T)'
