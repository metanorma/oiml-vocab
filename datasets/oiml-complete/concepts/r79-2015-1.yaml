data:
  dates:
  - date: '2026-07-15T11:15:15Z'
    type: accepted
  definition:
  - content: |-
      3. 1 El preempacado debe llevar la identificación del producto en el panel de exhibición principal, en una de las lenguas oficiales del país en el que se ofrece para la venta.

      Nota: Algunos países pueden exigir más de una lengua oficial.

      3. 2 La identificación del producto debe tener un tamaño, fuente, color, contraste con el fondo y ubicación, de manera que sea notoria y fácil de leer y de entender.

      3. 3 La identificación del producto debe ser en función al menos de las siguientes designaciones, en el siguiente orden de prioridad:

      a) el nombre especificado o exigido en cualquier legislación nacional aplicable; o

      b) si no hay requisitos legales para el nombre, el nombre común o usual con el que se conoce el producto; o

      c) si el nombre no se conoce comúnmente: el nombre genérico o cualquier otro término descriptivo apropiado, como por ejemplo, una declaración de su función.
  examples: []
