data:
  dates:
  - date: '2026-07-15T00:00:00Z'
    type: accepted
  definition:
  - content: Assemblage d'éléments destiné à réaliser des mesurages d'analyse des
      gaz spécifiés.
  examples: []
  id: r144-2013-1-fra
  notes:
  - content: Dans cette Recommandation, un système d'analyse signifie un système qui
      mesure en continu la fraction volumique de CO (monoxyde de carbone), NO (monoxyde
      d'azote), NO₂ (dioxyde d'azote), ou d'oxydes d'azote (NOₓ), ou qui mesure seulement
      CO ou seulement NO et NO₂, ou NOₓ, par analyse d'échantillons de gaz extraits
      de cheminée ou de tuyau de gaz dans l'industrie.
  - Le système inclut: un moyen de prélèvement et de préparation d'un échantillon
      (dans le cas d'un prélèvement par extraction) ; un analyseur de gaz ; un moyen
      d'ajustage du zéro (analyseur de gaz) ; un moyen d'ajustage de l'analyseur de
      gaz utilisant un mélange de gaz d'étalonnage ; un moyen pour l'enregistrement,
      le traitement et l'affichage des résultats de mesure ; un moyen de contrôle
      et d'ajustage des composants du système ; une interface pour connecter les dispositifs
      mesurant les paramètres d'écoulement de gaz des émissions d'échappement ; et
      du gaz et des lignes électriques de communication.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Système d'analyse des gaz
  language_code: fra
