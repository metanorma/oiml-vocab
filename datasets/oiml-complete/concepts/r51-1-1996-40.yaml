  definition:
  - content: Valeur moyenne de l'erreur (d'indication) pour une série de pesées automatiques
      consécutives d'une charge, ou de charges identiques, passant sur le récepteur
      de charges, exprimée par la formule mathématique x̄ = Σx/n, où x représente
      l'erreur d'une indication de charge, x̄ est la moyenne des erreurs, et n est
      le nombre de pesées.
