    type: accepted
  definition:
  - content: The mean value of the error (of indication) for a number of consecutive
      automatic weighings of a load, or similar loads, passed over the load receptor,
      expressed mathematically as x̄ = Σx/n, where x represents the error of a load
      indication, x̄ is the mean of the errors, and n is the number of weighings.
  examples: []
