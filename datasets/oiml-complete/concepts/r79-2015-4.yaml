data:
  dates:
  - date: '2026-07-15T11:15:15Z'
    type: accepted
  definition:
  - content: |-
      a) se debe expresar en términos de la mayor unidad entera de masa, volumen, longitud, área o de combinación de estas unidades en el sistema decimal, de acuerdo con el Anexo A.

      Nota: La longitud incluye todas las mediciones lineales tales como ancho, altura, espesor y diámetro.

      b) No debe tener más de tres cifras significativas, independientemente de dónde vaya colocado el indicador decimal, siempre que la declaración cumpla

      con la Tabla A.2 y a menos que se apliquen los requisitos de 5.4 c), por ejemplo, 5,55 kg y no 5,555 kg,

      c) cuando se indique por medio de una etiqueta impresa por un instrumento de medición, no se aplica la regla de 5.4 b) y la declaración de cantidad puede ser inferior a un número entero, por ejemplo, 0,988 kg,

      d) cuando se trata de elementos que se pueden contar, se debe expresar en números enteros.
  examples: []
  id: r79-2015-4-spa
  notes: []
  sources: []
