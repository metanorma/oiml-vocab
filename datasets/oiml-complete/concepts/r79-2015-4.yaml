  definition:
  - content: Quantity of the identified product in the prepackage exclusive of packing
      material.
  examples: []
  id: r79-2015-4-eng
  notes:
  - content: "'Packing material' includes wrappers and any other material packed with
      such product."
  - content: This term relates to specifications on a prepackage and does not account
      for the actual quantity in an individual prepackage. For prepackages with constant
      nominal quantity, the procedures for determining whether an inspection lot meets
      regulatory requirements are provided in OIML R 87.
