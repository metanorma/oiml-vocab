  definition:
  - content: |-
      Le certificat de vérification d'un instrument doit, selon les exigences nationales, comprendre les indications suivantes:

      i) nom de l'autorité d'essai approuvée qui a effectué les essais,

      ii) nom du propriétaire de l'instrument,

      iii) nom du fabricant,

      iv) désignation, numéro ou code du modèle approuvé auquel l'instrument est conforme,

      v) numéro, date et origine du certificat d'approbation de modèle,

      vi) classe de précision assignée,

      vii) brève description du baromètre,

      viii) numéro de série de l'instrument,

      ix) numéro de série du thermomètre associé, s'il est fourni,

      x) année de fabrication, si elle est connue,

      xi) étendue de pression de la vérification,

      xii) étendue de température de la vérification,

      xiii) brève description des essais de vérification,

      xiv) traçabilité des étalons utilisés pour la vérification,

      xv) toutes limitations spéciales sur l'utilisation de l'instrument,

      xvi) date de l'achèvement de l'examen,

      xvii) date à laquelle le certificat de vérification perd sa validité,

      xviii) copie du rapport d'étalonnage.

      Ces exigences sont résumées en Annexe B.
