data:
  dates:
  - date: '2026-07-15T00:00:00+00:00'
    type: accepted
  definition:
  - content: Concentration d'une substance produisant un signal de sortie moyen égal
      à trois fois le bruit de fond moyen, déterminé sur une base statistique.
  examples: []
  id: d22-1991-6-fra
  notes:
  - content: La limite de détection est parfois définie comme un signal de sortie
      égal à un autre multiple (deux ou dix) du bruit. Le bruit de fond est le signal
      de sortie aléatoire d'un instrument analysant un air filtré blanc ou propre.
  - content: 'Dans le présent Document, la concentration d''un polluant contenu dans
      l''air, en phase gazeuse ou vapeur, s''exprime le plus souvent en titre volumique
      du polluant dans l''air: parties par million (ppm) [v/v (10^-6)]. Les conditions
      de température et de pression doivent être spécifiées pour les conversions en
      masse par unité de volume (généralement mg/m^3).'
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Limite de détection
  language_code: fra
  entry_status: valid
