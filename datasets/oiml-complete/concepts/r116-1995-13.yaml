    type: accepted
  definition:
  - content: Étroitesse de l'accord entre les mesurages successifs du même mesurande,
      effectués dans des conditions identiques et durant une courte période de temps.
  examples: []
  id: r116-1995-13-fra
  notes:
  - content: Le terme «mêmes conditions» inclut la méthode utilisée pour le mesurage,
      l'opérateur, l'instrument de mesure, le lieu et les conditions de l'environnement.
