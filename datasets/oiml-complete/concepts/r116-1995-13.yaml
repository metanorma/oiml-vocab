  - date: 2026-07-16
    type: accepted
  definition:
  - content: The closeness of agreement between successive measurements of the same
      measurand carried out under the same conditions and within a short period of
      time.
  examples: []
  id: r116-1995-13-eng
  notes:
  - content: 'The same conditions include the following: method of measurement, operator,
      measuring instrument, location, and environmental conditions.'
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: repeatability
  language_code: eng
  entry_status: valid
