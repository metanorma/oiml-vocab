  definition:
  - content: |-
      6. 2.1. Ces baromètres doivent être munis d'un dispositif de lecture numérique ou analogique (ou une combinaison des deux) qui permet de faire des lectures directes de pression à 0,01 kPa (0,1 hPa) ou moins pour les instruments des classes de précision 0,02 ou 0,05, et à 0,02 kPa (0,2 hPa) ou moins pour les instruments de la classe de précision 0,1. Si les instruments ont une sortie analogique, la conception de l'échelle et de l'aiguille doit satisfaire aux exigences du point 5 de la Recommandation Internationale OIML R 17 « Manomètres - vacuomètres - manovacuomètres indicateurs ».

      6. 2.2. Dans le cas d'instruments avec indication numérique, la hauteur des chiffres ne doit pas être inférieure à 3 mm. Si les chiffres sont formés par une combinaison de barres et/ou de points, par exemple par diodes luminescentes, des moyens doivent être disponibles pour vérifier que tous les éléments fonctionnent. Dans le cas d'une panne d'alimentation, l'affichage doit cesser d'indiquer, ou afficher un signe d'alarme.

      6. 2.3. L'instrument doit être marqué clairement et de manière sûre avec l'unité de pression appropriée. Pour un instrument avec cadran et aiguille, le marquage doit être fait sur le cadran.
