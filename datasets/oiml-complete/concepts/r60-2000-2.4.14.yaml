    type: accepted
  definition:
  - content: Défaut supérieur à l'échelon de vérification, v, de la cellule de pesée.
  examples: []
  id: r60-2000-f-2.4.14-fra
  notes:
  - content: Les défauts suivants ne sont pas considérés comme défauts significatifs
      même s'ils sont supérieurs à l'échelon de vérification, v, de la cellule de
      pesée - défauts provenant de causes simultanées et mutuellement indépendantes;
      défauts rendant impossible l'accomplissement de tout mesurage; défauts si importants
      qu'ils ne peuvent manquer d'être remarqués par toutes les parties intéressées
      au résultat du mesurage; et défauts transitoires consistant en des variations
      momentanées du signal de sortie de la cellule de pesée ne pouvant être interprétés,
      mémorisés ou transmis en tant que résultat de mesure.
  sources:
