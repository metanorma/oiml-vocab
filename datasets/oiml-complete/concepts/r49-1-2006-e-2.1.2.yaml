  definition:
  - content: part of the meter which transforms the flow or the volume of the water
      to be measured into signals which are passed to the calculator
  examples: []
  id: r49-1-2006-e-2.1.2-eng
  notes:
  - content: It can be based on a mechanical, or an electrical, or an electronic principle.
      It may be autonomous or use an external power source.
  - content: For the purposes of this Recommendation, the measurement transducer includes
      the flow sensor or volume sensor.
