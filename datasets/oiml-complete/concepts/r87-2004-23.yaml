    type: accepted
  definition:
  - content: Empty space in a prepackage when the prepackage is filled to less than
      its capacity. If a consumer cannot fully view the product in a prepackage, it
      shall be considered to be filled. A prepackage with excessive nonfunctional
      slack fill is considered to be a misleading one.
  examples: []
  id: r87-2004-23-eng
  notes: []
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Nonfunctional slack fill
  language_code: eng
  entry_status: valid
