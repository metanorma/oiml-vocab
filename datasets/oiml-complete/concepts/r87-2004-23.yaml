data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: Espace vide dans un préemballage lorsque le préemballage est rempli en
      dessous de sa capacité. Si un consommateur ne peut pas visualiser complètement
      le produit dans un préemballage, celui-ci doit être considéré comme étant rempli.
      Un préemballage avec un remplissage faible excessif non fonctionnel est considéré
      comme étant trompeur.
  examples: []
  id: r87-2004-23-fra
  notes: []
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Remplissage faible non fonctionnel
  language_code: fra
  entry_status: valid
