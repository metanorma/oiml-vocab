data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: Étendue des débits massiques ou des concentrations des composants de
      l'échantillon d'essai dans laquelle une variation du débit massique produit
      une variation du signal du détecteur.
  - content: La limite inférieure est donnée par la limite de détection et la limite
      supérieure correspond au débit massique ou concentration le plus élevé auquel
      une légère augmentation supplémentaire du débit ou de la concentration ne produit
      plus d'augmentation observable du signal du détecteur.
  - content: La valeur de l'étendue dynamique est donnée par le rapport de la limite
      supérieure à la limite inférieure ; elle est supérieure ou égale à la valeur
      de l'étendue linéaire.
  examples: []
  id: r82-1989-11-fra
