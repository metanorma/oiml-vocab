data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: Defaut supérieur à e.
  - content: 'Les défauts suivants ne sont pas considérés comme significatifs, même
      s''ils dépassent e :'
  - content: "- défauts provenant de causes simultanées et mutuellement indépendantes
      dans l'instrument;"
  - content: "- défauts rendant impossible l'accomplissement de toute mesure;"
  - content: "- défauts si importants qu'ils ne peuvent manquer d'être remarqués par
      tous ceux qui sont intéressés au résultat du mesurage; ou"
  - content: "- défauts transitoires constitués de variations momentanées de l'indication
      mais qui ne peuvent être interprétées, mises en mémoire ou transmises comme
      des résultats de mesure."
  examples: []
  id: r76-1-2006-108-fra
  notes:
  - content: Pour les instruments à échelons multiples, la valeur de e est celle qui
      correspond à l'étendue de pesage partielle.
  sources: []
