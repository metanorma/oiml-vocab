data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: Fault greater than e.
  - content: 'The following are not considered to be significant faults, even when
      they exceed e:'
  - content: "- faults arising from simultaneous and mutually independent causes in
      the instrument;"
  - content: "- faults implying the impossibility to perform any measurement;"
  - content: "- faults being so serious that they are bound to be noticed by all those
      interested in the result of measurement; or"
  - content: "- transitory faults, being momentary variations in the indication which
      cannot be interpreted, memorized or transmitted as a measuring result."
  examples: []
  id: r76-1-2006-108-eng
  notes:
  - content: For a multi-interval instrument, the value of e is that appropriate to
      the partial weighing range.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: significant fault
  language_code: eng
