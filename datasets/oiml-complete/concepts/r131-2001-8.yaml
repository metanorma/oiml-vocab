    type: accepted
  definition:
  - content: Combination of either a photon or an electron source and associated instrumentation
      that provides uniform and reproducible absorbed dose, or absorbed dose rates,
      at specified locations within a specific material. The absorbed dose shall be
      traceable to national or international standards.
