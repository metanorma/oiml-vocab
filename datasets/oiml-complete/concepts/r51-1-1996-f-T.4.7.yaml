  definition:
  - content: Defaut supérieur à e.
  examples: []
  id: r51-1-1996-f-T.4.7-fra
  notes:
  - content: 'Les défauts suivants ne sont pas considérés comme significatifs: défauts
      provenant de causes simultanées et mutuellement indépendantes dans l''instrument
      ou dans son système de contrôle, ou défauts rendant impossible l''accomplissement
      de toute mesure, ou défauts si importants qu''ils ne peuvent manquer d''être
      remarqués par tous ceux qui sont intéressés au résultat du mesurage, ou défauts
      transitoires consistant en des variations momentanées des indications qui ne
      peuvent être interprétées, mises en mémoire ou transmises en tant que résultats
      de mesure.'
