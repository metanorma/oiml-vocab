  dates:
  - date: '2026-07-15T11:14:13Z'
    type: accepted
  definition:
  - content: |-
      Si los servicios de red dejan de ser accesibles, los datos de medida no se perderán. El proceso de medición debería detenerse para evitar la pérdida de datos de medida.

      Nota: Debería considerarse distinguir entre las mediciones estáticas y las dinámicas.

      Ejemplo:

      (I)/(II) El dispositivo emisor espera a que el receptor confirme la recepcion correcta del conjunto de datos. El dispositivo emisor conserva el conjunto de datos en una memoria intermedia (buffer) hasta que se recibe la confirmacion. La memoria intermedia puede tener capacidad para más de un conjunto de datos organizados como una cola $ \mathrm{F I F O}^{5)}。 $
