  definition:
  - content: Variation continue ou incrémentale dans le temps d'une indication, due
      à des variations des propriétés métrologiques d'un instrument de mesure.
  examples: []
  id: r144-2013-27-fra
  notes:
  - content: Dans cette Recommandation, « dérive » signifie le changement de l'indication
      qui apparaît pendant une période de temps définie et à une concentration donnée
      de CO, NO et NO₂ dans un échantillon à analyser.
