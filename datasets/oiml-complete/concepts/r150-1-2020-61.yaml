data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: identifiable group of measuring instruments belonging to the same manufactured
      type within the same category that have the same design features and metrological
      principles for measurement (for example the same type of indicator, the same
      type of design of force receptor and force transmitting device) but which may
      differ in some metrological and technical performance characteristics (e.g.
      Max, Min, d, accuracy class, etc.)
  examples: []
  id: r150-1-2020-61-eng
  notes:
  - content: The concept of a family primarily aims to reduce the test effort during
      type examination. It does not preclude the possibility of listing more than
      one family in one certificate.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: family of measuring instruments
