  definition:
  - content: le volume cyclique est égal au volume de liquide correspondant au cycle
      de fonctionnement du dispositif mesureur, c'est-à-dire à l'ensemble des mouvements
      à la fin desquels tous les organes internes mobiles de ce dispositif mesureur
      reprennent, pour la première fois, la même position qu'à l'instant initial.
