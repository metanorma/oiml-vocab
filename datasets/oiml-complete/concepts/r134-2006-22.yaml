  definition:
  - content: Paramètre d'application légale ayant une valeur qui dépend seulement
      du type d'instrument. Il est fixé lors de l'approbation de type de l'instrument.
  examples: []
  id: r134-2006-22-fra
  notes:
  - Des exemples de paramètres spécifiques au type sont: paramètres utilisés pour
      le calcul de la valeur de la masse ; analyse de la stabilité ou calcul du prix
      et de l'arrondi ; identification du logiciel.
