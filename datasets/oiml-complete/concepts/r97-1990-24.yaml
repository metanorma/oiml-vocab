  definition:
  - content: |-
      A.4.1. Avant l'étalonnage, tous les baromètres et leurs thermomètres associés doivent être examinés pour s'assurer qu'ils sont en bon état et que leur construction, leur graduation et leur marquage satisfont aux points 5, 6 et 7 de la présente Recommandation.

      A.4.2. Dans le cas des baromètres à mercure, on doit effectuer un contrôle, si cela est possible et avant l'étalonnage, de l'absence de toute trace significative d'air dans l'espace de vide au-dessus de mercure. Cet essai consiste souvent à écouter s'il y a des « clics » métalliques lorsque le baromètre est incliné doucement.

      A.4.3. Le cas échéant, le baromètre doit subir un essai d'étanchéité conformément aux exigences du point 5.1.2. La vitesse de fuite doit être contrôlée 3 fois, chaque essai d'étanchéité ne durant pas moins que 5 minutes.

      A.4.4. Si nécessaire, et après accord mutuel entre l'autorité d'étalonnage et le propriétaire, l'échelle du baromètre ou la quantité de mercure dans le réservoir doit être ajustée afin de réduire l'erreur de mesurage. Un tel ajustement n'est permis qu'après un contrôle préliminaire et avant l'étalonnage final. Aucun ajustement ne doit être effectué pendant ou après l'étalonnage final.
