  definition:
  - content: |-
      Si dans un pays la législation interne exige que pour certaines applications un baromètre soit soumis aux contrôles métrologiques, ces contrôles doivent comprendre tout ou partie des opérations suivantes:

      essai de modèle,

      vérification primitive,

      vérifications ultérieures ou périodiques.
