    type: accepted
  definition:
  - content: An interruptible measuring system is a measuring system in which the
      liquid flow can be stopped easily and rapidly (this does not include an emergency
      stop). In other cases the measuring system is considered to be non-interruptible.
  examples: []
  id: r117-1-2007-56-eng
  notes: []
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Interruptible and non-interruptible measuring system
  language_code: eng
  entry_status: valid
