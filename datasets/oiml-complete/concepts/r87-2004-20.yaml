data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: 'Correspond aux produits suivants, éventuellement sous forme de mélanges
      et également congelés ou surgelés, à condition que le liquide soit seulement
      un adjuvant aux éléments essentiels de cette préparation et ne constitue pas
      ainsi un facteur décisif pour l''achat: eau, solutions aqueuses salines, saumure,
      solutions aqueuses d''acides alimentaires, vinaigre, solutions aqueuses de sucres,
      solutions aqueuses d''autres substances édulcorantes, jus de fruits ou de légumes
      pour les fruits ou les légumes.'
