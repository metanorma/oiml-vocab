data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: 'Means the following products, possibly in mixtures and also when frozen
      or quick-frozen, provided that the liquid is merely an adjunct to the essential
      elements of that preparation and is thus not a decisive factor for the purchase:
      water, aqueous solutions of salts, brine, aqueous solutions of food acids, vinegar,
      aqueous solutions of sugars, aqueous solutions of other sweetening substances,
      fruit or vegetable juices in the case of fruit or vegetables.'
  examples: []
  id: r87-2004-20-eng
  notes: []
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Liquid medium
  language_code: eng
  entry_status: valid
