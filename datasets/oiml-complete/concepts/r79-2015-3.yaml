data:
  dates:
  - date: '2026-07-15T11:15:15Z'
    type: accepted
  definition:
  - content: |-
      5. 1 Un preempacado debe llevar una declaración de la cantidad nominal del producto, en el panel de exhibición principal.

      Nota: En el Anexo C se sugieren algunos métodos para aplicar declaraciones de cantidad cuando es posible que no sea apropiado ni suficiente declarar la cantidad total del producto.

      5. 2 Si la legislación nacional exige el cumplimiento de los requisitos del CODEX STAN 1-1985 [2], también se debe declarar en el preempacado la masa total del contenido de un preempacado que contiene un producto alimenticio empacado en un medio líquido, siempre y cuando la masa nominal del contenido sólido vaya acompañada de la expresión "peso escurrido".

      Nota 1: Las normas CODEX tratan sobre productos alimenticios y, cuando estos alimentos están empacados en un medio líquido, se considera que el "alimento" es el total de los sólidos y del medio líquido, como se define en la norma CODEX STAN-1:1985 [2]. En este caso, la expresión 'cantidad de producto' es equivalente a:

      a) el "peso escurrido del alimento", para alimentos empacados en un medio líquido, como se especifica en 4.3.3 de la norma CODEX STAN- 1:1985 [2], que trata sobre alimentos en los cuales se debe marcar el peso escurrido, y

      b) el “contenido neto del alimento... exceptuando el glaseado”, como se especifica en las normas CODEX sobre alimentos con glaseado con hielo.

      Nota 2: La OIML R 87 [1] suministra información sobre los procedimientos de ensayo para determinar el "peso escurrido".

      5. 3 Los preempacados no destinados para venta, por ejemplo, las muestras gratis o las bolsitas de condimentos que se suministran con alimentos o bebidas, o los artículos de aseo gratuitos que se suministran en hoteles o alojamientos, no necesitan llevar una declaración de cantidad. Si un producto previsto como muestra gratis lleva una declaración de su cantidad, debe cumplir los requisitos para preempacados.
