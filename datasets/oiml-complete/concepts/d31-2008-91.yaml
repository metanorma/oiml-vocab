data:
  dates:
  - date: '2026-07-15T11:14:13Z'
    type: accepted
  definition:
  - content: El software a actualizar se puede cargar a nivel local, es decir, directamente
      en el dispositivo de medida o remotamente a través de una red. La carga y la
      instalación pueden constituir dos etapas distintas (como se describe en la Figura
      1) o pueden combinarse en una, en función de las necesidades de la solución
      técnica. Una persona debería estar presente en el lugar de instalación del instrumento
      de medida para verificar la eficacia de la actualización. Después de actualizar
      el software legalmente relevante de un instrumento de medida (sustitucion por
      otra versión aprobada o nueva instalación), no está permitido utilizarlo con
      fines legales antes de haberlo verificado, tal y como se describe en el apartado
      7, ni antes de haber renovado los medios de seguridad (si no consta de otro
      modo en la Recomendación OIML pertinente o en el certificado de aprobación).
