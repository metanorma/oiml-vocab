  definition:
  - content: selbsttätige Waage, die dafür vorgesehen ist, durch selbsttätiges Wägen
      Behältnisse mit einer vorgegebenen und nahezu konstanten Masse von losem Massengut
      (einschließlich Flüssigkeiten) zu füllen, und die im Wesentlichen (eine) selbsttätige
      Zuführungseinrichtung(en) mit einem oder mehreren Wägemodul(en) sowie die erforderlichen
      Einstell- und Entleerungseinrichtungen umfasst.
