    type: accepted
  definition:
  - content: |-
      6. 2.1 Un preempacado se debe llenar de manera que un comprador no pueda ser engañado razonablemente con respecto a la cantidad de producto que contiene, teniendo en cuenta cualquier práctica de producción reconocida y aceptada que pueda ser necesaria para el fabricante o empacador.

      6. 2.2 Si un comprador no puede observar completamente el producto dentro del preempacado, se debe considerar que está lleno, pero se debe considerar engañoso si tiene un espacio vacío no funcional excesivo que no es necesario en ningún proceso de producción.

      Nota1: Espacio vacío es la diferencia entre la capacidad del material de embalaje y el volumen del producto que contiene.

      Nota 2: El espacio vacío podría ser necesario por las siguientes razones, que no se debería considerar que conducen a engaño:

      a) para protección del producto;

      b) por los requisitos de las máquinas usadas para albergar el contenido del preempacado;

      c) por el asentamiento inevitable del producto durante su despacho y manipulación y

      d) por la necesidad de que un preempacado lleve a cabo una función específica (por ejemplo, cuando el embalaje tiene una función en la preparación o consumo de un alimento), en donde dicha función es inherente a la naturaleza del producto y se comunica claramente a los consumidores.

      6. 2.3 El nivel de llenado de los dispensadores en aerosol debe estar de acuerdo con la legislación nacional o con normas reconocidas de la industria especificadas en la legislación nacional.
