data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: expression quantitative d'une grandeur particulière, généralement sous
      la forme d'une unité de mesure multipliée par un nombre
  examples:
  - content: 'Longueur d''une tige: 5,34 m ou 534 cm.'
  - content: 'Masse d''un corps: 0,152 kg ou 152 g.'
  - content: 'Quantité de matière d''un échantillon d''eau (H2O): 0,012 mol ou 12
      mmol.'
  id: g1-100-2008-f-B.2.2-fra
  notes:
  - content: La valeur d'une grandeur peut être positive, négative ou nulle.
  - content: La valeur d'une grandeur peut être exprimée de plus d'une façon.
  - content: Les valeurs des grandeurs de dimension un sont généralement exprimées
      sous la forme de nombres.
  - content: Certaines grandeurs, pour lesquelles on ne sait pas définir leur rapport
      à une unité, peuvent être exprimées par référence à une échelle de repérage
      ou à un procédé de mesure spécifié ou aux deux.
