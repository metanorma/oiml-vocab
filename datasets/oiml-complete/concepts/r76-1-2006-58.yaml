  definition:
  - content: Programs, data, type-specific and device-specific parameters that belong
      to the measuring instrument or module, and define or fulfill functions which
      are subject to legal control.
  examples:
  - content: Final results of the measurement, i.e. gross, net and tare / preset tare
      value (including the decimal sign and the unit), identification of the weighing
      range and the load receptor (if several load receptors have been used), software
      identification.
