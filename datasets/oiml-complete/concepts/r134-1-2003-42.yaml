data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: Défaut supérieur à 1 d.
  - content: 'Les défauts suivants ne sont pas considérés comme significatifs :'
  - content: les défauts provenant de causes simultanées et mutuellement indépendantes
      dans l'instrument ou dans son dispositif de contrôle ;
  - content: les défauts rendant impossible l'exécution de tout mesurage ;
  - content: les défauts transitoires consistant en des variations momentanées dans
      les indications et ne pouvant pas être interprétées, mémorisées ou transmises
      comme un résultat de mesurage ; et
  - content: les défauts si importants qu'ils ne peuvent manquer d'être remarqués
      par les personnes intéressées au mesurage.
