  definition:
  - content: 'Interchangeabilité dimensionnelle — Mesures dimensionnelles — Etalons
      industriels de longueur et d''angle — Instruments d''usage général — Calibres
      à limites pour vérification des pièces cylindriques lisses — Plans parallèles.
      Cylindres. Cônes. Filetages. Profils — Contrôle des engrenages — Contrôle des
      angles — Aberrations macrogéométriques — Aberrations microgéométriques — Régulation
      et contrôle dimensionnel — Cubage des bois — Mesurage des céréales — Mesurage
      statique du volume des liquides — Volume et débit des solides en mouvement —
      Capleurs de déplacement et détecteurs d''approche — Contrôle d''épaissur — Mesure
      des quantités instruments de pesage — Mesure du temps — Vitesse — Accélération
      — Force — Couple — Travail et puissance — Extensométrie — Capteurs extensométriques
      — Mesures en navigation: Navigation maritime. Radionavigation. Radars. Accéléromètres
      Inertiels. Gyroscopes et gyromètres. Navigation Inertielle. Navigation par satellites.'
