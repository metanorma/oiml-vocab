  definition:
  - content: partie de l'instrument de pesage comprenant tous les dispositifs mécaniques
      et électroniques (c'est-à-dire récepteur de charge, cellule de pesée et dispositif
      de traitement de données analogiques), mais ne permettant pas d'afficher les
      résultats de pesage
  - content: Il peut, en option, comporter des dispositifs de traitement ultérieur
      de données (numériques).
