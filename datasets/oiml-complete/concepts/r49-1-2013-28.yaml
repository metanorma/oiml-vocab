data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: valeur de la quantité mesurée moins valeur de la quantité de référence
  examples: []
  id: r49-1-2013-28-fra
  notes:
  - content: pour l'application de cette partie de l'OIML R 49, le volume indiqué
      est considéré comme la valeur de la quantité mesurée et le volume réel comme
      la valeur de la quantité de référence. La différence entre le volume indiqué
      et le volume réel est dénommée erreur (d'indication).
  - content: dans cette recommandation, l'erreur (d'indication) est exprimée en pourcentage
      du volume réel.
  sources: []
