data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: device connected to or incorporated in the meter for automatic correction
      of the volume of water at metering conditions, by taking into account the flow
      rate and/or the characteristics of the water to be measured and the pre-established
      calibration curves
  examples: []
  id: r49-1-2013-7-eng
  notes:
  - content: The characteristics of the water, e.g. temperature and pressure, may
      be either measured using associated measuring instruments or stored in a memory
      in the meter.
  - content: For the definition of the term "correction", see OIML V 2-200:2012 (VIM)
      [1], 2.53.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: correction device
  language_code: eng
  entry_status: valid
