data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: 'group of gas meters of different sizes and/or different flow rates,
      in which all the meters shall have the following characteristics:'
  - content: the same manufacturer,
  - content: geometric similarity of the measuring part,
  - content: the same metering principle,
  - content: roughly the same ratios Q_max/Q_min and Q_max/Q_t
  - content: the same accuracy class,
  - content: the same electronic device (see 3.5.2) for each meter size and using
      the same metrological software routines (if applicable) for those components
      that are critical to the performance of the meter,
  - content: a similar standard of design and component assembly, and
  - content: the same materials for those components that are critical to the performance
      of the meter.
  examples: []
