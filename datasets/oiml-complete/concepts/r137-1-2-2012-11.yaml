data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: 'groupe de compteurs de gaz de différentes tailles et/ou de différents
      débits dans lequel tous les compteurs doivent avoir les caractéristiques suivantes
      :'
  - content: le même fabricant,
  - content: la similarité géométrique de la partie de mesure,
  - content: le même principe de mesure,
  - content: à peu près les mêmes ratios Q_max/Q_min et Q_max/Q_t
  - content: la même classe d'exactitude,
  - content: le même dispositif électronique (voir 3.5.2) pour chaque taille de compteur
      et utilisant les mêmes routines logicielles métrologiques (si applicable) pour
      les composants critiques en ce qui concerne les performances du compteur,
  - content: un niveau similaire de conception et d'assemblage de composants, et
  - content: les mêmes matériaux pour les composants critiques en ce qui concerne
      les performances du compteur.
  examples: []
