  definition:
  - content: En général, matériau inerte dans la colonne du chromatographe qui maintient
      la phase stationnaire, qui consiste en des particules poreuses ou non poreuses
      ou en la paroi intérieure de la colonne elle-même ou en une combinaison de ces
      deux systèmes, et sur lequel s'écoule le gaz porteur.
