data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: 'interface (matérielle et/ou logicielle) autorisant uniquement l''introduction
      de données dans le dispositif de traitement de données d''un instrument, module
      ou composant électronique, et interdisant :'
  - content: l'affichage de données qui ne sont pas clairement définies et qui pourraient
      être confondues avec un résultat de pesage ;
  - content: la falsification de résultats de pesage ou d'indications primaires affichés,
      traités ou stockés ; ou
  - content: tout ajustage de l'instrument ou toute modification d'un facteur d'ajustage
