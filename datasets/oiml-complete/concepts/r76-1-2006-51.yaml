  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: 'Device for setting the indication to zero when a load is on the load
      receptor:'
  - content: "- without altering the weighing range for net loads (additive tare device);
      or"
  - content: "- reducing the weighing range for net loads (subtractive tare device)."
  - content: 'It may function as:'
  - content: "- a non-automatic device (load balanced by an operator);"
  - content: "- a semi-automatic device (load balanced automatically following a single
      manual command); or"
  - content: "- an automatic device (load balanced automatically without the intervention
      of an operator)."
  examples: []
  id: r76-1-2006-51-eng
  notes: []
  sources: []
