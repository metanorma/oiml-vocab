    type: accepted
  definition:
  - content: 'Dispositif permettant d''amener l''indication de l''instrument à zéro
      lorsqu''une charge est placée sur le récepteur de charge :'
  - content: "- sans empiéter sur l'étendue de pesage des charges nettes (dispositif
      additif de tare); ou"
  - content: "- en réduisant l'étendue de pesage des charges nettes (dispositif soustractif
      de tare)"
  - content: 'Il peut fonctionner comme:'
  - content: "- un dispositif non automatique (charge équilibrée par un opérateur);
      ou"
  - content: "- un dispositif semi-automatique (charge équilibrée automatiquement
      sur une seule commande manuelle); ou"
  - content: "- un dispositif automatique (charge équilibrée automatiquement sans
      l'intervention d'un opérateur)."
