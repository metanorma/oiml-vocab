    type: accepted
  definition:
  - content: Series or group of weights, usually presented so as to make any weighing
      of all loads between the mass with the smallest nominal value and the sum of
      all weights of the series possible, with a progression in which the weight with
      the smallest nominal value constitutes the smallest step of the series. The
      weights have similar metrological characteristics and the same or different
      nominal values, as defined in section 4.3 of this Recommendation, and belong
      to the same accuracy class.
