  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: A fault greater than 0.5 of the maximum permissible error on initial
      verification.
  examples: []
  id: r6-1989-18-eng
  notes:
  - content: 'The following faults are considered not to be significant, even if they
      exceed the significant fault: (a) faults arising from simultaneous and mutually
      independent causes in the gas meter itself or in its checking facilities; (b)
      transitory faults being momentary variations in the indication, which cannot
      be interpreted, memorised or transmitted as a measurement result.'
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Significant fault
  language_code: eng
  entry_status: valid
