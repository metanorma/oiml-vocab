data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: Défaut supérieur à 0,5 fois l'erreur maximale tolérée en vérification
      primitive.
  examples: []
  id: r6-1989-18-fra
  notes:
  - content: 'Les défauts suivants ne sont pas considérés comme significatifs, même
      s''ils dépassent le défaut significatif : (a) défauts provenant de causes simultanées
      et mutuellement indépendantes dans le compteur de gaz lui-même ou dans son système
      de contrôle; (b) défauts transitoires constitués de variations momentanées de
      l''indication, mais qui ne peuvent être interprétées, mises en mémoire ou transmises
      comme des résultats de mesure.'
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Défaut significatif
  language_code: fra
  entry_status: valid
