  definition:
  - content: A durability error greater than e.
  examples: []
  id: r76-1-1992-86-eng
  notes:
  - content: A durability error can be due to mechanical wear and tear or due to drift
      and ageing of electronic parts. The concept of significant durability error
      applies only to electronic parts.
  - content: For a multi-interval instrument, the value of e is that appropriate to
      the partial weighing range.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Significant durability error
