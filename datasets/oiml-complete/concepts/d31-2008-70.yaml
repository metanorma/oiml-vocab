  definition:
  - content: "(I)/(II) Algunos tipos de instrumentos de medida necesitan un ajuste
      tras un intervalo de tiempo determinado, a fin de garantizar la durabilidad
      de la medición. El software advierte si el intervalo de mantenimiento ha transcurrido
      e incluso detiene la medición si se ha excedido durante cierto intervalo de
      tiempo."
