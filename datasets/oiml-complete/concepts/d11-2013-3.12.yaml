data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: défaut excédant la valeur limite du défaut applicable
  examples: []
  id: d11-2013-f-3.12-fra
  notes:
  - content: 'Pour des types d''instrument de mesure donnés, certains défauts excédant
      la valeur limite du défaut peuvent ne pas être considérés comme des défauts
      significatifs. La Recommandation applicable doit indiquer quand de telles exceptions
      s''appliquent. Par exemple, l''apparition d''un ou plusieurs des défauts suivants
      peut être acceptable: (a) défauts provenant de causes simultanées et mutuellement
      indépendantes dans l''instrument de mesure ou dans ses systèmes de contrôle;
      (b) défauts rendant impossible l''accomplissement de toute mesure; (c) défauts
      transitoires provenant de variations momentanées de l''indication, qui ne peuvent
      être interprétés, mises en mémoire ou transmises comme un résultat de mesure;
      (d) défauts provoquant des variations du résultat de mesurage suffisamment importantes
      pour être identifiées par tous ceux intéressés par le résultat de mesurage;
      la Recommandation applicable peut spécifier la nature de ces variations.'
  sources: []
