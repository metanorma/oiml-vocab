  definition:
  - content: Instruments de mesure servant à déterminer la masse d'un corps en utilisant
      l'action de la pesanteur sur ce corps.
  examples: []
  id: r76-1-1992-f-T.1.1-fra
  notes:
  - content: Ces instruments peuvent, en outre, servir à déterminer d'autres grandeurs
      quantités, paramètres ou caractéristiques liés à la masse.
  - content: Suivant la nature de leur fonctionnement, les instruments de pesage sont
      classés en instruments à fonctionnement non automatique et en instruments à
      fonctionnement automatique.
