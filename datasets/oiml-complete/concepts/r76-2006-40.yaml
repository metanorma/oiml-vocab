  definition:
  - content: |-
      For type evaluation, the tests given in Annexes A and B shall be performed, to verify adherence to the requirements in 3.5, 3.6, 3.8, 3.9, 4.5, 4.6, 5.3, 5.4 and 6.1. The endurance test (A.6) shall be performed after all the other tests in Annexes A and B.

      For software-controlled instruments, the additional requirements in 5.5 and Annex G apply.
