    type: accepted
  definition:
  - content: différence entre le résultat le plus élevé et le résultat le moins élevé
      de mesures successives réalisées pour une même charge dans des conditions de
      mesurage identiques (ou raisonnablement constantes) [VIM 3.6]
  examples: []
  id: r106-1-2011-94-fra
  notes:
  - content: 'Les conditions de répétabilité incluent :'
  - content: la même procédure de mesure ;
  - content: le même opérateur ;
  - content: le même instrument de mesure utilisé dans les mêmes conditions ;
  - content: le même lieu ;
  - content: la répétition des mesurages pendant une courte période de temps.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: erreur de répétabilité
  language_code: fra
  entry_status: valid
