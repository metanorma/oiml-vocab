    type: accepted
  definition:
  - content: difference between the highest and lowest results of successive measurements
      of the same load carried out under the same (or reasonably constant) conditions
      of measurement [VIM 3.6]
  examples: []
  id: r106-1-2011-94-eng
  notes:
  - content: 'Repeatability conditions include:'
  - content: the same measurement procedure;
  - content: the same operator;
  - content: the same measuring instrument, used under the same conditions;
  - content: the same location;
  - content: repetition over a short period of time.
  sources: []
