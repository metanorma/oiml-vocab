  definition:
  - content: 'par rapport à un étalon de mesure certifié : différence entre l''erreur
      moyenne d''indication lorsqu''une ou plusieurs grandeurs d''influence varient
      dans les conditions assignées de fonctionnement, et l''erreur intrinsèque moyenne
      de l''instrument de mesure. Voir 4.4.1 pour les dérives d''erreur lors des tests
      des humidimètres pour grain'
  examples: []
  id: r59-1-2016-fra-2.3.8-fra
  notes:
  - content: En dehors des conditions assignées de fonctionnement, la marge d'erreur
      est la différence entre deux valeurs mesurées - l'indication dans les conditions
      assignées de fonctionnement et l'indication moyenne dans les conditions de références
      antérieures au test.
