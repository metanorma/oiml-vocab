data:
  dates:
  - date: '2026-07-15T11:15:15Z'
    type: accepted
  definition:
  - content: |-
      Nota: Ver la Tabla A.2 para la selección de unidades.

      a) en unidades de volumen, si el producto es líquido;

      b) en unidades de masa, si el producto es un sólido, un gas o un gas licuado;

      c) en unidades de masa, volumen o ambas, si el producto es semisólido o viscoso;

      d) en número de elementos que se pueden contar. En este caso, debe ser identifiable claramente que esta es la declaración de cantidad;

      Nota: Para identificar con claridad la declaración de cantidad, se puede hacer de la siguiente manera: "50 fósforos"; "20 cigarrillos"; "3 porciones".

      e) en cantidades basadas firmemente en el uso general establecido y en la costumbre comercial, si estas cantidades brindan información exacta y adecuada al comprador. Por ejemplo, se puede hacer la declaración de contenido de un líquido por masa, o de un producto sólido, semisólido o viscoso por volumen, o se puede hacer un conteo numérico;

      f) para todas las unidades de medición, exceptuando la masa y los productos vendidos por unidades, la cantidad del producto se debe expresar a la temperatura de referencia estándar de 20 °C. Sin embargo, la cantidad de productos congelados debe ser la cantidad a la temperatura exigida o especificada por el fabricante para mantener su composición o la consistencia en la que se usan habitualmente. Por lo general, la temperatura de referencia no aparece en la etiqueta; o

      g) en unidades de masa o de volumen, o ambas, de acuerdo con la legislación nacional, si es en aerosol, siempre y cuando el propelente de los recipientes de aerosoles expulsado con el producto esté incluido como parte del producto. Si se declaran tanto la masa como el volumen, ambos deben cumplir los requisitos de la Recomendación OIML R 87 [1].
