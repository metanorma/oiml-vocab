    type: accepted
  definition:
  - content: Étendue des concentrations ou des débits massiques d'un composant de
      l'échantillon examiné pour laquelle une variation de la quantité d'échantillon
      produit une variation mesurable du signal de sortie du détecteur. Sa valeur
      correspond au rapport de la limite supérieure de détection à la limite de détection.
  examples: []
  id: r112-1994-11-fra
  notes: []
  sources: []
