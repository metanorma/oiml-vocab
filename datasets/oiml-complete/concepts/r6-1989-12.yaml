  definition:
  - content: Compteur de gaz équipé de dispositifs électroniques.
  examples: []
  id: r6-1989-12-fra
  notes:
  - content: Dans le cadre de la présente Recommandation, les équipements auxiliaires,
      dans la mesure où ils sont soumis au contrôle métrologique, sont considérés
      comme faisant partie du compteur de gaz, sauf s'ils sont approuvés et vérifiés
      séparément.
