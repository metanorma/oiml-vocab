  definition:
  - content: A gas meter equipped with electronic devices.
  examples: []
  id: r6-1989-12-eng
  notes:
  - content: For the purposes of this Recommendation auxiliary equipment, as far as
      it is subject to metrological control, is considered to be part of the gas meter,
      unless the auxiliary equipment is approved and verified separately.
