  definition:
  - content: Les ergomètres à pédalier avec puissance de freinage contrôlée sont des
      ergomètres pour lesquels la puissance délivrée au niveau de l'axe du pédalier
      est indépendante de la fréquence de rotation dans une étendue de mesure spécifiée.
