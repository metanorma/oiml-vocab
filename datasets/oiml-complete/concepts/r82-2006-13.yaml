  definition:
  - content: Output signal per unit mass of the sample component of interest in the
      carrier gas. With a concentration-dependent detector it is expressed in A·mL·g⁻¹
      or V·mL·g⁻¹, and with a mass flow rate dependent detector it is expressed in
      A·s·g⁻¹ or V·s·g⁻¹.
