data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Instrument de mesure servant à déterminer la masse d'un corps en utilisant
      l'action de la pesanteur sur ce corps.
  examples: []
  id: r76-1-2006-fra-T.1.1-fra
  notes:
  - content: Dans cette Recommandation «masse» (ou «valeur du poids») est utilisée
      de préférence dans le sens de «masse conventionnelle» ou «valeur conventionnelle
      du résultat de pesage dans l'air» selon la R 111 et le D 28, tandis que «poids»
      est utilisé de préférence pour la représentation (c'est à dire la mesure matérielle)
      de la masse qui est réglementée au regard de ses caractéristiques physiques
      et métrologiques.
  - content: L'instrument peut aussi être utilisé pour déterminer d'autres grandeurs,
      quantités, paramètres ou caractéristiques liés à la masse.
  - content: Suivant la nature de son fonctionnement, un instrument de pesage est
      classé en instrument de pesage à fonctionnement automatique ou en instrument
      de pesage à fonctionnement non automatique.
