  definition:
  - content: |-
      8. 3.1. Seuls les baromètres d'un modèle approuvé peuvent être soumis à la vérification.

      8. 3.2. Les vérifications primitives et ultérieures d'un baromètre doivent être effectuées par une autorité qualifiée et accréditée et, selon les réglementations nationales, doivent inclure les opérations suivantes:

      i) examen de l'instrument pour s'assurer qu'il est en bonne condition et pour vérifier que sa construction, sa graduation et son marquage sont conformes au modèle approuvé,

      ii) contrôle du fait que la documentation prescrite est au complet,

      iii) essai des performances métrologiques de l'instrument, comme spécifié dans le certificat d'approbation de modèle et selon les recommandations de l'Annexe A,

      iv) détermination des erreurs, comme spécifié dans le certificat d'approbation de modèle, pour s'assurer de la conformité avec la classe de précision supposée,

      v) délivrance d'un certificat de vérification et/ou apposition sur l'instrument des marques de vérification conformément aux exigences nationales.

      8. 3.3. Si un baromètre a été réparé, il doit être revérifié avant nouvelle utilisation.
