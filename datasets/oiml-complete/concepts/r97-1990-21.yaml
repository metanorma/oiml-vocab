    type: accepted
  definition:
  - content: |-
      A.1.1. Afin de bénéficier pleinement de toutes les possibilités de mesure d'un baromètre, celui-ci devrait être étalonné avant utilisation et réétalonné à des intervalles réguliers en service. Cela s'applique à tous les baromètres, même ceux qui ne sont pas destinés à être utilisés dans des applications soumises aux contrôles métrologiques.

      A.1.2. Si un baromètre a été réparé, il doit être réétalonné. Autrement, l'intervalle entre réétalonnages doit être fixé conformément au contenu du point 8.2.8.ii).
