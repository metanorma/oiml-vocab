  definition:
  - content: |-
      1. 1. La présente Recommandation spécifie les exigences métrologiques et techniques applicables aux instruments de mesure de la pression atmosphérique ambiante, à leurs étalonnage, essai de modèle et vérifications primitive et ultérieures. Elle couvre les types suivants:

      a) baromètres à mercure ayant un vide de référence permanent,

      b) baromètres, anéroïdes par exemple, à élément récepteur élastique, vide de référence permanent et indication soit analogique, avec aiguille et cadran, soit numérique.

      1. 2. La Recommandation s'applique aux baromètres tels que ceux qui sont utilisés pour:

      a) le mesurage direct de la pression dans les laboratoires, les usines et les stations météorologiques,

      b) l'étalonnage des instruments de mesure de pression statique des classes de précision inférieures, et

      c) le contrôle et le réglage des altimètres.

      1. 3. La Recommandation n'est pas destinée à s'appliquer aux instruments de la plus haute classe de précision, tels que ceux qui sont utilisés en tant qu'étalons nationaux ou primaires.

      1. 4. La Recommandation s'applique aux baromètres conçus pour une utilisation dans l'étendue des pressions et des températures que l'on rencontre généralement en des lieux situés au niveau de la mer ou à des altitudes modestes (- 200 m à + 2 000 m). Si la Recommandation doit être appliquée aux baromètres devant être utilisés à haute altitude, grande profondeur ou dans des conditions climatiques spéciales, certaines dispositions doivent être modifiées ou d'autres ajoutées.
