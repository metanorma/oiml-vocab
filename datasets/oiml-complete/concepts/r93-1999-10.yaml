data:
  dates:
  - date: '2026-07-15T00:00:00Z'
    type: accepted
  definition:
  - content: Verre amenant un faisceau paraxial de rayons parallèles sur deux lignes
      focales séparées perpendiculaires entre elles et donc, à la différence du verre
      sphérique, ayant deux puissances principales.
  examples: []
  id: r93-1999-10-fra
  notes:
  - content: L'une de ces puissances peut être nulle, pour une distance focale correspondant
      à l'infini.
  - content: Les verres référencés en tant que verres toriques, sphérocylindriques
      et cylindriques sont tous des verres astigmatiques.
  - content: Cette définition pourrait également s'appliquer aux verres asphériques
      unifocaux.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Verre à puissance astigmatique
  language_code: fra
  entry_status: valid
date_accepted: '2026-07-16T00:00:00+00:00'
