  definition:
  - content: Differenz zwischen dem Fehler der Anzeige und der Eigenabweichung eines
      Messgeräts.
  examples: []
  id: r136-1-2004-deu-T.4.5-deu
  notes:
  - content: Im Prinzip ist ein Fehler das Ergebnis einer unerwünschten Änderung von
      Daten, die in einem elektronischen Gerät enthalten sind oder durch dieses hindurchfließen.
      In der vorliegenden Empfehlung ist ein "Fehler" ein Zahlenwert.
