  definition:
  - content: Point représentant l'origine pour le mesurage des niveaux de liquide
      (point zéro). Il est défini comme l'intersection de la verticale de mesurage
      avec la surface supérieure de la plaque de touche, ou avec le fond du réservoir
      si cette plaque est absente.
