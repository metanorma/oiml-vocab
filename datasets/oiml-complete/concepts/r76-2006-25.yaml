  definition:
  - content: An extra load equivalent to 0.4 times the absolute value of the maximum
      permissible error for the applied load, but not less than 1 mg, when gently
      placed on or withdrawn from the instrument at equilibrium shall produce a visible
      displacement of the indicating element.
