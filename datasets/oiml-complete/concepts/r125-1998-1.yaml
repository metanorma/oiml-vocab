  definition:
  - content: Instrument de mesure déterminant et indiquant la masse du liquide contenu
      dans un réservoir de mesurage. L'instrument comprend des dispositifs tels qu'un
      transducteur de mesure pour la mesure d'une quantité liée à la masse du liquide,
      un calculateur et un indicateur.
