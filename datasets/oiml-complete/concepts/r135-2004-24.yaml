data:
  dates:
  - date: '2026-07-15T00:00:00Z'
    type: accepted
  definition:
  - content: Property of a component corresponding to the catalyzed substance rate
      of conversion of a specified chemical reaction in a specified measurement system.
  examples: []
  id: r135-2004-24-eng
  notes:
  - content: The coherent SI unit is the mole per second (mol/s), also called the
      "katal" (kat).
  - content: Throughout this Recommendation the "component" is an enzyme.
  - content: The quantity "catalytic activity" relates to an amount of active enzyme,
      not its concentration.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Catalytic activity
