data:
  dates:
  - date: '2026-07-15T00:00:00Z'
    type: accepted
  definition:
  - content: défaut supérieur à l'erreur maximale tolérée spécifiée dans le Tableau
      2
  examples: []
  id: r85-1-2-2008-33-fra
  notes:
  - content: Les défauts provenant de causes simultanées et mutuellement indépendantes
      dans le JA ou dans ses systèmes de contrôle ne sont pas considérés comme significatifs.
  - content: Les défauts rendant impossible l'accomplissement de toute mesure ne sont
      pas considérés comme significatifs.
  - content: Les défauts transitoires consistant en des variations momentanées des
      indications qui ne peuvent être interprétées, mises en mémoire ou transmises
      en tant que résultats de mesure ne sont pas considérés comme significatifs.
  - content: Les défauts provoquant des variations des résultats de mesure si importantes
      qu'elles ne peuvent qu'être remarquées par toutes les parties intéressées par
      le résultat du mesurage ne sont pas considérés comme significatifs.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: défaut significatif
  language_code: fra
  entry_status: valid
date_accepted: '2026-07-16T00:00:00+00:00'
