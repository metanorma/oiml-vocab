data:
  dates:
  - date: '2026-07-15T00:00:00Z'
    type: accepted
  definition:
  - content: Plus petite quantité d'un composant de l'échantillon qui fournit un signal
      de sortie du détecteur supérieur à trois fois le bruit à court terme.
  examples: []
  id: r113-1994-9-fra
  notes:
  - content: Ce terme est parfois désigné sous le nom de «détection minimale (MDL)»
      dans les références ou dans la documentation des fabricants. La limite de détection
      est parfois définie comme le signal de sortie égal à un autre multiple (par
      exemple, deux ou dix) du niveau de bruit et peut varier selon que le chromatographe
      est utilisé pour une analyse quantitative ou qualitative.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Limite de détection
  language_code: fra
  entry_status: valid
