data:
  dates:
  - date: 2026-07-16
    type: accepted
  definition:
  - content: The smallest quantity of a sample component which yields a detector output
      signal that is three times greater than the short-term noise.
  examples: []
  id: r113-1994-9-eng
  notes:
  - content: This term is also referred to as "minimum detectability" or "minimum
      detectable limit (MDL)" in references and manufacturer's literature.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: detection limit
  language_code: eng
  entry_status: valid
