    type: accepted
  definition:
  - content: La valeur absolue de l'erreur d'hystérésis, définie comme étant l'erreur
      moyenne obtenue dans des conditions de pression décroissante moins l'erreur
      moyenne obtenue dans des conditions de pression croissante, ne doit pas dépasser
      la moitié de l'erreur maximale tolérée et, dans le cas des baromètres à élément
      récepteur élastique, l'erreur d'hystérésis ne doit pas être négative.
