  definition:
  - content: procédure d'évaluation de la conformité d'un ou plusieurs exemplaires
      d'un type (modèle) identifié d'instrument de mesure conduisant à l'établissement
      d'un rapport d'évaluation et/ou d'un certificat d'évaluation
  examples: []
  id: d32-2018-4-fra
  notes:
  - content: En métrologie légale, on utilise « modèle » dans le même sens que « type
      ».
  - content: Aux fins de l'OIML-CS, on entendra par « rapport d'évaluation » le «
      rapport d'évaluation de type OIML ».
