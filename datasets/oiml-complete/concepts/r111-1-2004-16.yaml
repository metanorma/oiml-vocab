    type: accepted
  definition:
  - content: Measure of the ability of a medium to modify a magnetic field. It is
      related to the magnetic permeability by the relation μ / μ_0 = 1 + χ. The quantity
      μ / μ_0 is sometimes called relative permeability, μ_r.
  examples: []
  id: r111-1-2004-16-eng
  notes: []
  sources: []
