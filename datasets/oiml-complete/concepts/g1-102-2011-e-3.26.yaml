  definition:
  - content: coverage region for a vector quantity with minimum (hyper-)volume among
      all coverage regions for that quantity having the same coverage probability
  examples: []
  id: g1-102-2011-e-3.26-eng
  notes:
  - content: For a single scalar quantity, the smallest coverage region is the shortest
      coverage interval for the quantity. For a bivariate quantity, it is the coverage
      region with the smallest area among all coverage regions for that quantity having
      the same coverage probability.
