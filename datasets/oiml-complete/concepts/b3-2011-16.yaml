    type: accepted
  definition:
  - content: Any laboratory designated by the OIML Issuing Authority to carry out
      all or specific tests and examinations of sample(s) of a measuring instrument
      or module submitted for OIML type evaluation
  examples: []
  id: b3-2011-16-eng
  notes:
  - content: 'Note 1: Testing laboratories may be internal laboratories of OIML Issuing
      Authorities, thirdparty laboratories or manufacturers'' testing laboratories
      (MTLs).'
  - content: 'Note 2: The OIML Issuing Authority, and not the Testing Laboratory,
      is responsible for issuing the OIML Basic Type Evaluation Report.'
  - content: 'Note 3: See Annex C.'
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Testing laboratory
