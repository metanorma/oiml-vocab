data:
  dates:
  - date: '2026-07-15T00:00:00+00:00'
    type: accepted
  definition:
  - content: tout laboratoire désigné par l'Autorité de délivrance OIML pour réaliser
      tous les essais et examens ou des essais et examens spécifiques d'un ou de plusieurs
      échantillons d'un instrument de mesure ou d'un module soumis à une évaluation
      de type OIML
  examples: []
  id: b3-2011-16-fra
  notes:
  - content: Les laboratoires d'essai peuvent être des laboratoires internes des Autorités
      de délivrance OIML, des laboratoires d'une tierce partie ou des laboratoires
      d'essai de fabricants (MTL).
  - content: La responsabilité d'émettre le Rapport d'évaluation de type OIML de Base
      incombe à l'Autorité de délivrance OIML, et non au laboratoire d'essai.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: laboratoire d'essai
  language_code: fra
  entry_status: valid
