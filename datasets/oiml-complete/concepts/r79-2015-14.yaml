    type: accepted
  definition:
  - content: |-
      B.2.1 En los Estados Unidos, los requisitos de altura mínima de números y letras en relación con el área del panel de exhibición principal del preempacado se indican en la Tabla B.1. La Conferencia Internacional de Pesos y Medidas adoptó estos requisitos y los publicó en el Handbook 130 Uniform Laws and Regulations, del National Institute of Standards and Technology.

      B.2.2 Área del panel de exhibición principal del preempacado. El área (sin incluir la cara superior e inferior, los rebordes en las caras superior e inferior de las latas, y los hombros y cuellos de las botellas y jarras) se debe determinar como se indica a continuación:

      B.2.2.1 En el caso de un preempacado rectangular, en donde un lado completo se puede considerar apropiadamente como el lado del panel de exposición principal, es el resultado de multiplicar la altura por el ancho de ese lado.

      B.2.2.2 En el caso de un preempacado cilíndrico o semicilíndrico, es el 40 % del resultado de multiplicar la altura del preempacado por su circunferencia.

      B.2.2.3 En el caso de preempacados con cualquier otra forma, es el 40 % de la superficie total del preempacado, o un área considerada como el panel de exhibición principal del preempacado.

