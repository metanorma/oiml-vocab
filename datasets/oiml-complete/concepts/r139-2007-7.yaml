data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: 'Device intended to perform a particular function, directly involved
      in elaborating, transmitting or displaying measurement results. Main ancillary
      devices are:'
  - content: "- zero setting device;"
  - content: "- repeating indicating device;"
  - content: "- printing device;"
  - content: "- memory device;"
  - content: "- price indicating device;"
  - content: "- totalizing indicating device;"
  - content: "- pre-setting device;"
  - content: "- self-service device."
  examples: []
  id: r139-2007-7-eng
  notes:
  - content: An ancillary device may or may not be subject to legal metrology control
      according to its function in the measuring system or to national regulations.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Ancillary device
  language_code: eng
  entry_status: valid
