data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: 'Dispositif destiné à accomplir une fonction particulière directement
      impliquée dans l''élaboration, la transmission ou l''affichage de résultats
      de mesurage. Les principaux dispositifs complémentaires sont :'
  - content: "- dispositif de remise à zéro,"
  - content: "- dispositif indicateur répétiteur,"
  - content: "- dispositif d'impression,"
  - content: "- dispositif de mémorisation,"
  - content: "- dispositif indicateur de prix,"
  - content: "- dispositif totalisateur,"
  - content: "- dispositif prédéterminateur,"
  - content: "- dispositif de libre-service."
  examples: []
  id: r139-2007-7-fra
  notes:
  - content: Un dispositif complémentaire peut être soumis ou non aux contrôles de
      métrologie légale suivant son rôle dans l'ensemble de mesurage ou suivant les
      réglementations nationales.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Dispositif complémentaire
  language_code: fra
  entry_status: valid
date_accepted: '2026-07-16T00:00:00+00:00'
