  definition:
  - content: A part of the meter that receives the output signals from the transducer(s)
      and possibly, from associated measuring instruments, transforms them and, if
      appropriate, stores in memory the results until they are used.
  examples: []
  id: r117-1995-3-eng
  notes:
  - content: The calculator may be capable of communicating both ways with peripheral
      equipment.
