  definition:
  - content: Specific device that is part of a self-service arrangement and which
      allows one or more measuring systems to perform in this self-service arrangement.
  - content: The self-service device includes all the elements and constituents that
      are mandatory so that a measuring system performs in a self-service arrangement.
