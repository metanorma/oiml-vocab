  definition:
  - content: Dispositif spécifique faisant partie de l'installation en libre-service
      et permettant à un ou plusieurs ensembles de mesurage de fonctionner dans cette
      installation.
  - content: Le dispositif de libre-service inclut tous les éléments et constituants
      obligatoires pour qu'un ensemble de mesurage fonctionne dans une installation
      en libre-service.
