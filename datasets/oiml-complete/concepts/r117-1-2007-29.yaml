data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: 'Transaction commerciale au cours de laquelle : le résultat du mesurage
      sert de base pour déterminer le prix à payer, et au moins une des parties impliquée
      dans la transaction se rapportant au mesurage est un consommateur ou toute autre
      partie nécessitant un niveau similaire de protection, et toutes les parties
      impliquées dans la transaction acceptent le résultat du mesurage obtenu sur
      place et à ce moment.'
  examples: []
  id: r117-1-2007-29-fra
  notes:
  - content: Voir note à l'Annexe B.
  sources: []
