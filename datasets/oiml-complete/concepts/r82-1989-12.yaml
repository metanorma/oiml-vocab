  definition:
  - content: The range of mass flow rate or concentration of the test sample in the
      carrier gas over which its sensitivity remains constant to within 5 %.
  - content: It is expressed as the ratio of the upper limit of linearity and the
      detection limit (see Figure 1).
  examples: []
  id: r82-1989-12-eng
  notes: []
  sources: []
