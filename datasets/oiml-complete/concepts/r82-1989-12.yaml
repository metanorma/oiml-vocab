    type: accepted
  definition:
  - content: Étendue des débits massiques ou des concentrations de l'échantillon d'essai
      dans le gaz porteur pour laquelle sa sensibilité reste constante dans une plage
      de 5 %.
  - content: Elle est exprimée par le rapport entre la limite supérieure de linéarité
      et la limite de détection (voir Figure 1).
  examples: []
  id: r82-1989-12-fra
  notes: []
  sources: []
