  definition:
  - content: Un mesurage non-interruptible est un processus de mesure cumulatif continu
      sans fin définie. Si le mesurage cumulatif de la quantité d'une substance peut
      être aisément et rapidement arrêté en opération normale sans falsifier les résultats
      de mesure, alors le mesurage est dénommé interruptible.
