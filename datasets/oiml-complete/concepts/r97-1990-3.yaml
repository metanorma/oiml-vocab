  definition:
  - content: En raison des différences climatiques et d'altitude, les étendues de
      pression considérées comme normales varient de pays à pays, et même de région
      à région. Par exemple l'étendue 90 kPa à 105 kPa peut être normale dans un pays,
      l'étendue 60 kPa à 110 kPa dans un autre. Les étendues de pression appropriées
      doivent alors être déterminées sur une base nationale, régionale ou même locale.
