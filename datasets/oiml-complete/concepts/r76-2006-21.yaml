    type: accepted
  definition:
  - content: The difference between two results obtained for the same load when the
      method of balancing the load is changed (in the case of an instrument fitted
      with a device for extending the self-indication capacity) in two consecutive
      tests, shall not exceed the absolute value of the maximum permissible error
      for the applied load.
