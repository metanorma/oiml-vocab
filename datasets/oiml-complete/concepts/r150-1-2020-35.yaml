  definition:
  - content: part of all software modules of a measuring instrument, electronic device,
      or sub-assembly that is legally relevant
  examples: []
  id: r150-1-2020-35-eng
  notes:
  - content: Examples of legally relevant software are software involved in determining
      the final results of the measurement including the decimal sign and the unit,
      identifying the weighing range, software identification, and force receptor
      identification and configuration information.
