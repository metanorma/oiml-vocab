    type: accepted
  definition:
  - content: device capable of correcting for variations in the load applied to the
      load receptor by an (empty) belt during a belt revolution. The device uses software
      to maintain a stored profile of the (empty) belt load over a full revolution
      and to manage the synchronization process of the profile to the belt
