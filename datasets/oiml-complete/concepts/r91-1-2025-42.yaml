data:
  dates:
  - date: '2026-07-15T00:00:00Z'
    type: accepted
  definition:
  - content: measurement error due to a measurement angle which differs from the configured
      value, the nominal value or the value measured by the instrument
  examples: []
  id: r91-1-2025-42-eng
  notes:
  - content: The name of this term comes from the fact that the component of the velocity
      vector parallel to the line connecting the speed meter and the vehicle is given
      by v_m = v*cos(alpha), where the measurement angle alpha has in general a horizontal
      and a vertical component.
  sources:
  - origin:
      ref: OIML R 91-1:2025
    type: authoritative
  terms:
  - type: expression
    normative_status: preferred
    designation: cosine error
  language_code: eng
