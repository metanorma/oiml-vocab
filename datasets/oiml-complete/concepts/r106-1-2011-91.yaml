data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: défaut supérieur à 1 d
  examples: []
  id: r106-1-2011-91-fra
  notes:
  - content: 'La Recommandation applicable peut spécifier que les défauts suivants
      ne sont pas significatifs, même s''ils dépassent la valeur définie dans 0.4.4.6
      :'
  - content: défauts provenant de causes simultanées et mutuellement indépendantes
      dans l'instrument ou son équipement de contrôle ;
  - content: défauts rendant impossible l'accomplissement de toute mesure ;
  - content: défauts transitoires provenant de variations momentanées de l'indication,
      qui ne peuvent pas être interprétées, mémorisées ou transmises comme résultat
      de mesure ;
  - content: défauts suffisamment importants pour ne pas manquer d'être remarqués
      par ceux qui sont intéressés par le mesurage.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: défaut significatif
  language_code: fra
  entry_status: valid
