data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: fault greater than 1 d
  examples: []
  id: r106-1-2011-91-eng
  notes:
  - content: 'The relevant Recommendation may specify that the following faults are
      not significant, even when they exceed the value defined in 0.4.4.6:'
  - content: faults that result from simultaneous and mutually independent causes
      in the instrument or in its checking facility;
  - content: faults that make it impossible to perform any measurement;
  - content: transitory faults that are momentary variations in the indications which
      cannot be interpreted, memorized or transmitted as a measurement result;
  - content: faults that are so serious that they will inevitably be noticed by those
      interested in the measurement.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: significant fault
  language_code: eng
  entry_status: valid
