    type: accepted
  definition:
  - content: l'écart périodique est la différence maximale existant, pendant l'accomplissement
      d'un cycle de fonctionnement, entre le volume engendré par le déplacement des
      organes mesureurs et le volume correspondant indiqué par l'indicateur, celui-ci
      étant relié sans jeu ou glissement au mesureur et de telle sorte qu'il indique
      à la fin du cycle et pour ce cycle un volume égal au volume cyclique.
  examples: []
  id: r5-1970-3-fra
  notes:
  - content: Cet écart peut être éventuellement réduit par la présence d'un correcteur
      approprié.
