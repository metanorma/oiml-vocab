    type: accepted
  definition:
  - content: A fault greater than d_t
  - content: 'The following are not considered to be significant faults:'
  - content: faults that result from simultaneous and mutually independent cause in
      the instrument or in its checking facility,
  - content: faults that imply the impossibility of performing any measurement,
  - content: transitory faults that are momentary variations in the indications which
      cannot be interpreted, memorized or transmitted as a measurement result,
  - content: faults that are so serious that they will inevitably be noticed by those
      interested in the measurement.
