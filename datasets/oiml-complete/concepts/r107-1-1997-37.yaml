data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: Défaut supérieur à d_t
  - content: 'Les défauts ci-après ne sont pas considérés comme défauts significatifs:'
  - content: défauts provenant de causes simultanées et mutuellement indépendantes
      dans l'instrument ou son équipement de contrôle;
  - content: défauts rendant impossible l'exécution de tout mesurage;
  - content: défauts transitoires consistant en des variations momentanées des indications
      qui ne peuvent être interprétées, mémorisées ou transmises en tant que résultat
      de mesure;
  - content: défauts si importants qu'ils ne peuvent manquer d'être remarqués par
      les personnes intéressées au mesurage.
