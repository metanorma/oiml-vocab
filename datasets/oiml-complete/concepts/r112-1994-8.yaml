data:
  dates:
  - date: '2026-07-15T00:00:00Z'
    type: accepted
  definition:
  - Mesure d'une variation dans le signal du détecteur; il peut être divisé en trois composantes: bruit
      à court terme (variations aléatoires perceptibles du signal du détecteur, dans
      des fréquences de l'ordre de 10⁻² Hz à 10⁻¹ Hz), bruit à long terme (variations
      aléatoires perceptibles dans des fréquences de l'ordre de 0,1 Hz à 1,0 Hz) et
      dérive (gradient moyen du signal de base mesuré sur une période d'au moins une
      demi-heure).
  examples: []
  id: r112-1994-8-fra
  notes:
  - content: Bien que le bruit à long terme puisse se produire à tout moment pendant
      une analyse, il arrive qu'on le confonde avec un éluant tardif. Les pics d'élution
      précédents sont habituellement plus nets et moins facilement confondus avec
      le bruit à long terme.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Bruit
  language_code: fra
  entry_status: valid
