data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: result of a measurement minus a true value of the measurand
  examples: []
  id: g1-100-2008-e-B.2.19-eng
  notes:
  - content: Since a true value cannot be determined, in practice a conventional true
      value is used [see VIM:1993 definitions 1.19 (B.2.3) and 1.20 (B.2.4)].
  - content: When it is necessary to distinguish "error" from "relative error", the
      former is sometimes called absolute error of measurement. This should not be
      confused with absolute value of error, which is the modulus of the error.
  sources:
  - origin:
