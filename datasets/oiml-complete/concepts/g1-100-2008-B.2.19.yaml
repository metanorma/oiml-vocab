data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: résultat d'un mesurage moins une valeur vraie du mesurande
  examples: []
  id: g1-100-2008-f-B.2.19-fra
  notes:
  - content: Étant donné qu'une valeur vraie ne peut pas être déterminée, dans la
      pratique on utilise une valeur conventionnellement vraie [voir VIM:1993, définitions
      1.19 (B.2.3) et 1.20 (B.2.4)].
  - content: Lorsqu'il est nécessaire de faire la distinction entre «l'erreur» et
      «l'erreur relative», la première est parfois appelée «erreur absolue de mesure».
      Il ne faut pas confondre avec la valeur absolue de l'erreur, qui est le module
      de l'erreur.
