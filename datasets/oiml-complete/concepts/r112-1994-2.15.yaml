  definition:
  - content: The closeness of agreement between results of successive measurements
      of the same measurand carried out under the same conditions and within a relatively
      short period of time.
  examples: []
  id: r112-1994-e-2.15-eng
  notes:
  - content: 'The same conditions include the following: the method of measurement,
      the operator, the measuring instrument, the location, and the environmental
      conditions.'
  sources:
  - origin:
      ref:
        source: OIML R 112:1994
        version: '1994'
