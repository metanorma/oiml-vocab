  definition:
  - content: Batterie qui permet de conserver la puissance électrique pour des fonctions
      spécifiques d'un instrument, en l'absence de l'alimentation électrique primaire
      (du secteur) qui inclue aussi bien l'alimentation électrique secteur (primaire)
      que la batterie auxiliaire.
  examples:
  - content: Pour préserver des données stockées.
