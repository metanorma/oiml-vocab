    type: accepted
  definition:
  - content: The part of a measuring instrument that displays an indication.
  examples: []
  id: r61-1-1996-20-eng
  notes:
  - content: For a weighing instrument, the indicating device is the set of components
      which display the value, in units of mass, of the result of a weighing operation.
  - content: For filling instruments, the indicating device may indicate either the
      mass of the load or the difference between this mass and the preset value provided
      the intention is made clear.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Indicating device
  language_code: eng
  entry_status: valid
