data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: The K-factor, in pulses per unit volume, is the ratio of the meter output
      (in number of pulses) to the corresponding total volume of fluid passing through
      the meter during the measuring period.
  - content: The variations in the K-factor may be presented as a function of either
      the pipe Reynolds number or of the flowrate under a specific set of thermodynamic
      conditions (see Figure 3).
  - content: 'The mean K-factor is commonly used and defined by: K_mean = (K_max +
      K_min) / 2 where K_max is the maximum K-factor over a designated linear range,
      and K_min is the minimum K-factor over the same linear range.'
  - content: The K-factor may change in line with pressure and thermal effects on
      the body of the meter (see 4.5).
  - content: The manufacturer of the meter should be consulted on the difference,
      if any, of the K-factor between liquid and gas, and between pipe schedules of
      the adjacent pipe.
  examples: []
  id: d25-2010-2-eng
  notes:
  - content: The K-factor is the function of the Reynolds number. In this Document
      all the characteristics are given in relation to the Reynolds number. However,
      in legal metrology the characteristics are normally given in relation to the
      flowrate, which can be obtained from the Reynolds number.
