data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: Le facteur K, en impulsions par unité de volume, est le rapport du nombre
      d'impulsions émises par le compteur au volume total correspondant de fluide
      ayant traversé le compteur pendant la période de mesure.
  - content: Les variations du facteur K peuvent être représentées en fonction soit
      du nombre de Reynolds de la canalisation, soit du débit pour un ensemble spécifié
      de conditions thermodynamiques (voir Figure 3).
  - content: 'Le facteur K moyen est généralement utilisé et est défini par: K_moyen
      = (K_max + K_min) / 2 où K_max est le facteur K maximum pour une étendue linéaire
      spécifiée, et K_min est le facteur K minimum pour la même étendue linéaire.'
  - content: Le facteur K peut changer selon les effets de la pression et de la température
      sur le corps du compteur (voir 4.5).
  - content: Il convient de consulter le fabricant du compteur en ce qui concerne
      une éventuelle différence du facteur K entre les liquides et les gaz, et pour
      différents agencements des canalisations adjacentes.
  examples: []
  id: d25-2010-2-fra
  notes:
  - content: Le facteur K est fonction du nombre de Reynolds. Dans le présent Document,
      toutes les caractéristiques sont données par rapport au nombre de Reynolds.
      Cependant, en métrologie légale, les caractéristiques sont normalement données
      en fonction du débit, lequel peut être obtenu à partir du nombre de Reynolds.
  sources: []
