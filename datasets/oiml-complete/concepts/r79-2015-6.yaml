data:
  dates:
  - date: '2026-07-15T11:15:15Z'
    type: accepted
  definition:
  - content: |-
      5. 6.1 Las declaraciones de cantidad deben ir en negrilla o impresas de fácil legibilidad, que:

      a) contrasten notoriamente con el fondo y con el resto de información del preempacado, y

      b) estén ubicadas sobre el panel de exhibición principal de manera que sean notorias y fáciles de leer y de entender.

      Nota1: En el Anexo B se presentan ejemplos de posibles requisitos legislativos para determinar las alturas mínimas que se usen en las declaraciones de cantidad para asegurar su legibilidad.

      Nota 2: Cuando la declaración de cantidad aparece en una etiqueta adhesiva impresa por un instrumento de medición legal para uso en comercio, la altura de la indicación debería ser la aprobada en el momento de aprobación del tipo de instrumento.

      Nota 3: En los casos en que aparece más de una declaración de cantidad en el preempacado, cada declaración de cantidad debería cumplir los requisitos pertinentes en el país en cuestión.

      5. 6.2 Cuando la declaración de cantidad está grabada, soplada o moldeada sobre la superficie del preempacado, toda la información exigida para la etiqueta se debe colocar en cualquier otra parte de la superficie o en una etiqueta de manera que sea notoria y fácil de leer y de entender.
