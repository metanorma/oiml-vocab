  definition:
  - content: |-
      B.3.1 En la Unión Europea, la Directiva del Consejo 76/211/EEC [3] establece el tamaño mínimo de los caracteres con relación a las declaraciones de cantidad para productos vendidos en unidades de masa o de volumen, como se ilustra en la Tabla B.2.

      <div align="center">

      Tabla B.2. Altura mínima de los números y letras

      </div>

      <table border="1"><tr><td>Cantidad nominal(C)</td><td>Altura mínima de números y letras, en milímetros</td></tr><tr><td>C≤50g(o mL)</td><td>2</td></tr><tr><td>50g(o mL)＜C≤200g</td><td>3</td></tr><tr><td>200g(o mL)＜C≤1kg</td><td>4</td></tr><tr><td>1kg(o L)＜C</td><td>6</td></tr></table>

      Los tamaños de los caracteres para elementos vendidos por longitud, área o por número de piezas no están armonizados y en este caso es aplicable la legislación nacional.

      B.3.2 La información acerca del nombre del alimento, la cantidad neta del alimento, el nombre comercial y la dirección del operador de la empresa de alimentos, el país de origen, etc., se debería etiquetar con caracteres en un tamaño de fuente en donde la altura de la x, como se define en el Anexo IV del Reglamento de la UE Nro. 1169/2011 [4], sea igual o mayor de 1,2 mm.
