  definition:
  - content: Taux auquel l'énergie est transportée.
  examples: []
  id: r46-2012-35-fra
  notes:
  - content: Dans un système électrique, la puissance active est mesurée comme étant
      la moyenne temporelle de la puissance instantanée, qui est calculée à chaque
      instant comme étant le produit de la tension et du courant. Dans des conditions
      sinusoïdales, la puissance active est le produit entre la valeur efficace du
      courant, la tension et le cosinus de la phase angulaire, calculés pour chaque
      phase. Elle est généralement exprimée en kW.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: puissance active
  language_code: fra
