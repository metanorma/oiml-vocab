data:
  dates:
  - date: '2026-07-15T00:00:00Z'
    type: accepted
  definition:
  - content: grandeur qui, lors d'un mesurage direct, n'a pas d'effet sur la grandeur
      effectivement mesurée, mais a un effet sur la relation entre l'indication et
      le résultat de mesure
  examples: []
  id: r46-1-2-2012-43-fra
  notes:
  - content: Le concept de grandeur d'influence est entendu pour inclure les valeurs
      associées aux normes de mesurage, aux matériaux de référence et aux données
      de référence desquels le résultat d'un mesurage peut dépendre.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: grandeur d'influence
