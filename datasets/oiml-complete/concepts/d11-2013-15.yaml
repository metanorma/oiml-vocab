data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: grandeur qui, dans un mesurage direct, n'affecte pas la grandeur qui
      est réellement mesurée, mais affecte la relation entre l'indication et le résultat
      de mesure
  examples:
  - content: La température d'un instrument de mesure est une grandeur d'influence,
      mais la température de l'objet mesuré (utilisée comme une référence pour déterminer
      le défaut ou l'erreur) ne l'est pas. Il peut être nécessaire de prendre en considération
      cette influence de l'environnement sur cet objet mesuré comme un facteur dans
      la définition du mesurande.
  id: d11-2013-15-fra
  notes:
  - content: Une grandeur d'influence n'est pas reliée au mesurande mais, c'est une
      grandeur qui affecte le résultat de mesurage comme indiqué par l'équipement
      sous test (ESE).
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: grandeur d'influence
  language_code: fra
  entry_status: valid
