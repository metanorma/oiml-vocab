  definition:
  - content: Dispositif employant des sous-ensembles electroniques et accomplissant
      une fonction specifique. Un dispositif electronique est habituellement fabrique
      en tant qu'unite separee et peut etre essaye independamment.
  examples: []
  id: r125-1998-f-T.19-fra
  notes:
  - content: Un dispositif electronique tel que defini ci-dessus, peut etre un instrument
      de mesure complet ou une partie d'instrument de mesure.
