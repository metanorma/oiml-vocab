    type: accepted
  definition:
  - content: Quotient de l'erreur absolue par une valeur conventionnelle caractérisant
      l'instrument de mesurage. Cette valeur conventionnelle peut être, par exemple,
      la limite supérieure de l'étendue de l'échelle ou la limite supérieure de l'étendue
      de mesure, la valeur de l'étendue de l'échelle ou la valeur de l'étendue de
      mesure, la longueur de l'échelle, ou le nombre d'échelons de l'échelle.
