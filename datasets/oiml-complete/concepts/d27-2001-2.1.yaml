  definition:
  - content: Organisme ou agence nationale responsable de l'application des lois ou
      réglementations concernant le contrôle métrologique des instruments de mesure.
  examples: []
  id: d27-2001-f-2.1-fra
  notes:
  - content: Le service national de métrologie légale peut être placé sous la juridiction
      de l'organisme national responsable auquel il est fait référence dans le présent
      Document; par conséquent, lorsque la responsabilité est déléguée, il convient
      de substituer à "organisme national responsable", "service national de métrologie
      légale" dans le texte du présent Document.
