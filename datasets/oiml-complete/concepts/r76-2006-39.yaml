    type: accepted
  definition:
  - content: |-
      Where other influences and restraints, such as:

      - vibrations;

      - precipitations and draughts; and/or

      - mechanical constraints and restrictions

      are a normal feature of the intended operating environment of the instrument, the instrument shall comply with the requirements of clauses 3 and 4 under those influences and restraints, either by being designed to operate correctly in spite of these influences, or by being protected against their action.
  examples: []
  id: r76-2006-39-fra
  notes:
  - content: |-
      Instruments installed outdoors without suitable protection against atmospheric conditions may normally not comply with the requirements of clauses 3 and 4 if the number of verification scale intervals, n, is relatively great. (In general, a value of n=3000 can only be exceeded with very special measures. Furthermore, for road or rail weighbridges the verification scale interval should not be less than 10 kg). These limits should also apply to each weighing range of combinations of instruments or of multiple range instruments or to each partial weighing range of multi-interval instruments.

      3. 10 Type evaluation tests and examinations
  sources: []
