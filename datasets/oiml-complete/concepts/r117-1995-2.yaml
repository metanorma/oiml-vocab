data:
  dates:
  - date: 2026-07-16
    type: accepted
  definition:
  - content: A part of the meter which transforms the flow or the volume of the liquid
      to be measured into signals which are passed to the calculator. It may be autonomous
      or use an external power source.
  examples: []
  id: r117-1995-2-eng
  notes:
  - content: For the purposes of this Recommendation, the measurement transducer includes
      the flow or volume sensor.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: measurement transducer
  language_code: eng
  entry_status: valid
