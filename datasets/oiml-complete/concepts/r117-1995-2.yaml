    type: accepted
  definition:
  - content: Partie du compteur qui traduit le débit volumique ou le volume du liquide
      à mesurer en signaux destinés au calculateur. Il peut soit être autonome, soit
      utiliser une source d'énergie extérieure.
  examples: []
  id: r117-1995-2-fra
  notes:
  - content: Pour les besoins de la présente Recommandation, le transducteur de mesure
      inclut le capteur de débit ou de volume.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Transducteur de mesure
