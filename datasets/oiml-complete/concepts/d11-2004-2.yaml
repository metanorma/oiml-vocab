    type: accepted
  definition:
  - content: device employing electronic sub-assemblies and performing a specific
      function
  examples: []
  id: d11-2004-2-eng
  notes:
  - content: Electronic devices are usually manufactured as separate units and are
      capable of being tested independently.
  - content: An electronic device may be a complete measuring instrument or a part
      of a measuring instrument.
  - content: An electronic device can be a module in the sense that this term is used
      in OIML Publication B 3.
  sources: []
