  definition:
  - content: Les valeurs moyennes des erreurs obtenues dans des conditions de pression
      croissante ne doivent pas varier de plus que l'erreur maximale tolérée, sur
      tout intervalle d'au plus 10 kPa. De même, les valeurs moyennes des erreurs
      obtenues dans des conditions de pression décroissante ne doivent pas varier
      de plus de l'erreur maximale tolérée, sur tout intervalle d'au plus 10 kPa.
