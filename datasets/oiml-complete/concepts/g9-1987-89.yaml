  definition:
  - content: |-
      Chapter 14.3, Orifice Metering of Natural Gas and Other Related Hydrocarbon Fluids, Second Edition, September 1985 (AGA Report #3)(GPA 8185-85)(ANSI/API 2530)

      This standard provides a procedure for measuring natural gas, hydrocarbons, and other related fluids using flange taps and pipe tap orifice plates, meter tubes and fittings. It provides the standards for construction and installation of orifice plates, meter tubes and fittings and instructions for computing the flow of natural gas and hydrocarbon fluids through orifice meters. Also included are tables of the basic factors to adjust for the primary element expansion, Reynolds number, temperature, pressure, relative density, and supercompressibility. 126 pages.

      Price each, $12.00
