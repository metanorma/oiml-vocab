data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Concentration d'une substance produisant un signal de sortie moyen égal
      à trois fois le bruit de fond moyen, déterminé sur une base statistique.
  examples: []
  id: d22-1991-f-3.6-fra
  notes:
  - content: La limite de détction est parfois définie comme un signal de sortie égal
      à un autre multiple (deux ou dix) du bruit. Le bruit de fond est le signal de
      sortie aléatoire d'un instrument analysant un air filtré blanc ou propre.
  - content: 'Dans le présent Document, la concentration d''un polluant contenu dans
      l''air, en phase gazeuse ou vapeur, s''exprime le plus souvent en titre volumique
      du polluant dans l''air: parties par million (ppm). Les conditions de température
      et de pression doivent être spécifiées pour les conversions en masse par unité
      de volume (généralement mg/m^3). Les conditions de référence peuvent être spécifiées
      et peuvent être 0 deg C ou 20 deg C pour la température et une atmosphère ou
      101 325 Pa pour la pression.'
