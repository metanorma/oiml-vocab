data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: A measure of variation in the detector signal; it can be divided into
      three components, namely short-term noise, long-term noise, and drift.
  examples: []
  id: r112-1994-e-2.8-eng
  notes:
  - content: Short-term noise includes all observable random variations of the detector
      signal having a frequency of the order of 10^-2 Hz to 10^-1 Hz (one or more
      cycles per minute) and should be measured peak to peak.
  - content: Long-term noise includes all observable random variations of the detector
      signal with frequencies between 0.1 Hz and 1.0 Hz.
  - content: Drift is the average slope of the baseline signal measured over a minimum
      period of one-half hour.
  sources:
  - origin:
