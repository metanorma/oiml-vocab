    type: accepted
  definition:
  - content: Minimum amount of a specific compound which, when injected into the gas
      chromatograph, produces a signal-to-noise ratio of at least 3 for a characteristic
      base peak of that compound depending on the mode of ionization and over a specified
      mass range.
  examples: []
  id: r83-2006-9-eng
  notes:
  - content: Some compounds do not give a molecular ion, but all amenable compounds
      have a base peak in their spectra; the base peak is the most intense or abundant
      ion in a mass spectrum.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Detection limit
  language_code: eng
  entry_status: valid
