  definition:
  - content: dispositif destiné à réaliser une fonction spécifique, directement impliquée
      dans l'élaboration, la transmission ou l'affichage des valeurs mesurées
  examples: []
  id: r49-2013-7-fra
  notes:
  - les principaux dispositifs auxiliaires sont: dispositif de réglage du zéro, dispositif
      indicateur de prix, dispositif répétiteur de l'indication, dispositif d'impression,
      dispositif de mémorisation, dispositif de contrôle de la tarification, dispositif
      de prédétermination, dispositif de libre-service, capteur de détection de mouvement
      de débit, dispositif de lecture à distance.
