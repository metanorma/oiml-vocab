    type: accepted
  definition:
  - content: Manifestation of variation in the gas chromatograph output signal not
      associated with changes in chromatographic conditions, which can be divided
      into short-term noise (random variations of the signal having a frequency of
      the order of one or more cycles per minute) and drift (average slope of the
      baseline signal measured over a minimum of half an hour).
