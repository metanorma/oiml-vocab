    type: accepted
  definition:
  - content: Velocidad a la que se transporte la energía.
  examples: []
  id: r46-1-spa-2.2.15-spa
  notes:
  - content: 'En un sistema eléctrico, la potencia activa se mide como la media de
      tiempo de la potencia instantánea, que se calcula en cada instante como el producto
      del voltaje y la corriente: p(t) = u(t) . i(t) Donde: u es el voltaje instantáneo,
      i es la corriente instantánea; y p es la energía instantánea. En condiciones
      sinusoidales, la energía activa es el producto de los valores de r.m.s. de la
      corriente y el voltaje, y el coseno del ángulo de fase entre ellos, calculado
      para cada fase. Por lo general se expresa en kW.'
