  definition:
  - content: Partie identifiable d'un instrument qui remplit une ou plusieurs fonctions
      spécifiques, et qui peut être examinée séparément suivant des exigences métrologiques
      et techniques spécifiques de la Recommandation applicable. Les modules d'un
      instrument de pesage font l'objet de limites d'erreurs partielles spécifiées.
  examples: []
  id: r134-2006-15-fra
  notes:
  - Les modules typiques d'un instrument de pesage sont: cellule de pesée, indicateur,
      dispositif de traitement de données, etc.
