  definition:
  - content: Instrument de pesage à fonctionnement automatique ayant un récepteur
      de charge, et des tabliers, qui détermine la masse du véhicule, les charges
      par essieu, et si applicable les charges par groupe d'essieux d'un véhicule
      routier pendant que ce véhicule passe au-dessus du récepteur de charge de l'instrument
      de pesage.
