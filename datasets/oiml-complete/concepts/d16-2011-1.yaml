  definition:
  - content: part of metrology related to activities which result from statutory requirements
      and concern measurement, units of measurement, measuring instruments and methods
      of measurement and which are performed by competent bodies
  examples: []
  id: d16-2011-1-eng
  notes:
  - content: The scope of legal metrology may be different from country to country.
  - content: The competent bodies responsible for legal metrology activities or part
      of these activities are usually called legal metrology services.
