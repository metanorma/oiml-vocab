  definition:
  - content: Étroitesse de l'accord entre les résultats de mesurages successifs du
      même mesurande dans les conditions de mesurage répétées sur une brève période
      de temps par le même observateur, et effectués au même emplacement dans des
      conditions ambiantes similaires, en utilisant les mêmes instrument de mesure
      et procédures d'essai.
