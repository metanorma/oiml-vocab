  definition:
  - content: Type of payment in unattended service mode in which payment for the delivered
      quantity is required after the delivery, but in which the transaction is not
      settled when the customer leaves the site, following an implicit agreement with
      the supplier.
  examples: []
  id: r139-2007-22-eng
  notes: []
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Unattended post-payment (or delayed payment)
