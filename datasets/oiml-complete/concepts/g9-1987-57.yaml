  definition:
  - content: |-
      Chapter 7.3, Static Temperature Determination Using Portable Electronic Thermometers, First Edition, June 1985

      This section provides a guide to the use of portable electronic thermometers to determine temperatures for custody transfer of liquid hydrocarbons under static conditions. It does not cover hydrocarbons under pressures in excess of 3 psig or cryogenic temperature measurement. 7 pages.
