  definition:
  - content: 'Device for setting the indication to zero when a load is on the load
      receptor: without altering the weighing range for net loads (additive tare device),
      or reducing the weighing range for net loads (subtractive tare device).'
  examples: []
  id: r76-1-1992-e-T.2.7.4-eng
  notes:
  - content: 'It may function as: a nonautomatic device (load balanced by an operator),
      a semi-automatic device (load balanced automatically following a single manual
      command), an automatic device (load balanced automatically without the intervention
      of an operator).'
