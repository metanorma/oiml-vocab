data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: 'Dispositif permettant d''amener l''indication de l''instrument à zéro
      lorsqu''une charge est placée sur le récepteur de charge: sans empiéter sur
      l''étendue de pesage des charges nettes (dispositif additif de tare), ou en
      réduisant l''étendue de pesage des charges nettes (dispositif soustractif de
      tare).'
  examples: []
  id: r76-1-1992-f-T.2.7.4-fra
  notes:
  - content: 'Il peut fonctionner comme: dispositif non automatique (charge équilibrée
      par l''opérateur), dispositif semi-automatique (charge équilibrée automatiquement
      sur une seule commande manuelle), dispositif automatique (charge équilibrée
      automatiquement sans intervention d''un opérateur).'
  sources:
  - origin:
      ref:
        source: OIML R 76-1:1992
        version: '1992'
    locality:
      type: clause
      reference_from: T.2.7.4
    type: authoritative
