data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: instrument de mesure servant à déterminer la masse d'un corps en utilisant
      l'action de la pesanteur sur ce corps
  examples: []
  id: r106-1-2011-1-fra
  notes:
  - content: Dans la présente Recommandation, on utilise de préférence le terme «
      masse » (ou « valeur de poids ») pour désigner la « masse conventionnelle »
      ou la « valeur conventionnelle du résultat de pesage dans l'air » conformément
      à la Recommandation OIML R 111 [5] et au Document OIML D 28 [6], et le terme
      « poids » pour désigner la représentation (= mesure matérielisée) de la masse
      réglementée dans ses caractéristiques physiques et métrologiques. Selon sa méthode
      de fonctionnement, un instrument de pesage est classé à fonctionnement automatique
      ou à fonctionnement non automatique.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: instrument de pesage
  language_code: fra
  entry_status: valid
