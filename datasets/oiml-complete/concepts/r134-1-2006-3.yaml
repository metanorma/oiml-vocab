  - content: Automatic weighing instrument, having a load receptor (T.2.3) and aprons
      (T.2.2.1), that determines the vehicle mass (T.3.1.5), axle loads (T.3.1.8),
      and if applicable the axle-group loads (T.3.1.11) of a road vehicle while the
