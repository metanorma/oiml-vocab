data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: Partie opérationnelle du compteur qui reçoit les signaux de sortie du
      calculateur de comptage, et éventuellement des instruments de mesurage associés,
      qui les transforme en données destinées au dispositif indicateur.
  examples: []
  id: r139-2007-5-fra
  notes:
  - content: Le calculateur de comptage et le calculateur opérationnel peuvent être
      constitués de deux éléments séparés ou constituer une seule unité. Sauf nécessité
      particulière de dissocier ces deux sortes de calculateurs, l'association des
      deux fonctions est appelée "le calculateur" dans la présente Recommandation.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Calculateur opérationnel
  language_code: fra
  entry_status: valid
