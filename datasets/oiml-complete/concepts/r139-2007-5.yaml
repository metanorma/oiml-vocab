  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: Optional part of the meter that receives the digital output signals from
      the metering calculator and, possibly, from associated measuring instruments,
      which processes them into data for the indicating device.
  examples: []
  id: r139-2007-5-eng
  notes:
  - content: The metering calculator and the operational calculator may be two separate
      elements or form a single unit. Except in the case of a particular need to dissociate
      the two kinds of calculators, the association of both functions is called the
      calculator in this Recommendation.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Operational calculator
  language_code: eng
  entry_status: valid
