  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: 'Partie de l''instrument de pesage qui comprend tous les dispositifs
      mecaniques et electroniques (c''est-a-dire : le recepteur de charge, le dispositif
      transmetteur de charge, la cellule de pese, et le dispositif analogique de traitement
      de donnees ou le dispositif numerique de traitement de donnees) mais n''ayant
      pas les moyens d''afficher le resultat de pesage. Il peut en option avoir des
      dispositifs pour le traitement (numerique) de donnees et de fonctionnement de
      l''instrument.'
