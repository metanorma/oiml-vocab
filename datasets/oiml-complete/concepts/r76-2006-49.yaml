  definition:
  - content: For any family, at least the variant with the highest number of verification
      scale intervals (n) and the variant with the smallest verification scale interval,
      e, shall be selected as EUTs. Further EUTs may be required according to 3.10.4.6.
      If a variant has both characteristics, one EUT may be sufficient.
