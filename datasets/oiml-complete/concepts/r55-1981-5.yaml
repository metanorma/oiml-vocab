data:
  dates:
  - date: '2026-07-15T00:00:00Z'
    type: accepted
  definition:
  - content: Grandeur caractéristique indiquant l'espèce (tours de l'arbre d'entraînement
      ou impulsions) et le nombre de signaux émis par le dispositif prévu sur le véhicule
      pour être raccordé aux compteurs et au chronotachygraphe, quand le véhicule
      parcourt la distance de 1 kilomètre.
  examples: []
  id: r55-1981-5-fra
  notes:
  - content: Le coefficient w doit être exprimé dans les mêmes unités que la constante
      k.
  - content: Le coefficient w varie en fonction de la charge du véhicule et des dimensions,
      de la pression et du degré d'usure des pneumatiques; il doit être déterminé
      dans les conditions normales d'essai.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Coefficient w du véhicule
