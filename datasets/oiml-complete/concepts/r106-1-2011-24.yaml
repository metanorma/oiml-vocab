  definition:
  - content: transducteur de force qui, après prise en compte des effets de l'accélération
      de la pesanteur et de la poussée de l'air sur le lieu de son utilisation, mesure
      la masse en convertissant la grandeur mesurée (masse) en une autre grandeur
      mesurée (sortie) [OIML R 60:2000 [6]]
  - content: des cellules de pesée équipées de dispositifs électroniques comprenant
      un amplificateur, un convertisseur analogique/numérique (CAN) et un dispositif
      de traitement de données (en option) sont appelées cellules de pesée numériques
