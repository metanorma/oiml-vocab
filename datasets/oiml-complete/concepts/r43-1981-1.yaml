data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: La capacité « contenue » d'une fiole étalon graduée correspondant à un
      trait de graduation (désignée par capacité « In ») est égale au volume d'eau
      qu'elle contient à la température de référence lorsqu'elle est remplie jusqu'à
      ce trait de graduation.
  examples: []
  id: r43-1981-1-fra
  notes:
  - content: L'expression « remplie jusqu'à ce trait de graduation » signifie que
      le ménisque formé par l'eau dans le goulot de la fiole est ajusté de telle manière
      que le plan horizontal passant par le bord supérieur du trait (plan dans lequel
      se fait la visée) est tangent au ménisque en son point le plus bas.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Capacité « contenue »
