  definition:
  - content: |-
      propriété des faces de mesure d'un calibre à bouts de coller, par glissement ou application (sans moyens supplémentaires), aux faces de mesure des autres calibres ou aux faces de référence des plans auxiliaires.

      **

      Note

      La présente Recommandation et la Norme ISO 3650-1978 différent encore principalement sur les deux points suivants :

      - définition de la longueur

      - stabilité dans le temps.

      Les deux Organisations travaillent en commun pour tenter d'eliminer ces dernières divergences.
