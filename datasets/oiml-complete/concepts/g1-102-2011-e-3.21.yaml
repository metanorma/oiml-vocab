data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: symmetric positive semi-definite matrix of dimension $ N\times N $ associated
      with an estimate of a real vector quantity of dimension $ N\times 1 $ , containing
      the correlations associated with pairs of components of the estimate
  examples: []
  id: g1-102-2011-e-3.21-eng
  notes:
  - content: A correlation matrix $ R_{x} $ of dimension $ N\times N $ associated
      with the estimate x of a quantity X has the representation $\boldsymbol {R}
      _ {\boldsymbol {x}} = \left[ \begin{array}{c c c} r \left(x _ {1}, x _ {1}\right)
      & \dots & r \left(x _ {1}, x _ {N}\right) \\ \vdots & \ddots & \vdots \\ r \left(x
      _ {N}, x _ {1}\right) & \dots & r \left(x _ {N}, x _ {N}\right) \end{array}
      \right],$ where $ r ( x_{i}, x_{i} )=1 $ and $ r ( x_{i}, x_{j} ) $ is the correlation
      associated with $ x_{i} $ and $ x_{j} $ . When elements $ X_{i} $ and $ X_{j}
      $ of X are uncorrelated, $ r ( x_{i}, x_{j} )=0 $ .
  - content: Correlations are also known as correlation coefficients.
  - content: "$ R_{x} $ is related to $ U_{x} $ (see 3.20) by $ U _ {x} = D _ {x}
      R _ {x} D _ {x},$ where $ D_{x} $ is a diagonal matrix of dimension $ N\\times
      N $ with diagonal elements $ u(x_{1}),\\dots,u(x_{N}) $ ."
  - content: A correlation matrix $ R_{x} $ is positive definite or singular, if and
      only if the corresponding covariance matrix $ U_{x} $ is positive definite or
      singular, respectively. Certain operations involving $ R_{x} $ require positive
      definiteness.
  - content: When presenting numerical values of the off-diagonal elements of a correlation
      matrix, rounding to three places of decimals is often sufficient. However, if
      the correlation matrix is close to being singular, more decimal digits need
      to be retained in order to avoid numerical difficulties when using the correlation
      matrix as input to an uncertainty evaluation.
