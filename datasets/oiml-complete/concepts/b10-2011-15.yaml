    type: accepted
  definition:
  - content: Systematic, independent, documented process for obtaining records, statements
      of fact or other relevant information and assessing them objectively to determine
      the extent to which specified requirements are fulfilled
  examples: []
  id: b10-2011-15-eng
  notes:
  - content: Audits may be internal or external. Internal audits are supposed to be
      conducted by the relevant personnel provided that it is not responsible for
      the activity which is audited. External audits are conducted by third-party
      bodies.
  sources: []
