    type: accepted
  definition:
  - content: The name "conversion table" is given to any system - table, graph, abacus
      or slide rule - used for the determination of the moisture content from the
      value indicated by the moisture meter, when the latter is not fitted with a
      device for selecting the species and the relationship between the indications
      of the moisture meter and the moisture content differs according to the species
      of grains or seeds on which the measurement is carried out.
