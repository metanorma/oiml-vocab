  definition:
  - content: Le nom « table de conversion » est donné à tout système - table, graphe,
      abaque, règle à calcul utilisé pour la détermination du titre à partir de la
      valeur indiquée par l'humidimètre, lorsque ce dernier ne comporte pas de dispositif
      incorporé de sélection des espèces et que la relation entre les indications
      de l'humidimètre et le titre en eau diffère selon l'espèce de grains ou de graines
      sur laquelle est effectué le mesurage.
