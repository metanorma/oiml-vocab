  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: facility incorporated in a measuring instrument which enables significant
      faults to be detected and acted upon
  examples: []
  id: d11-2013-21-eng
  notes:
  - content: Typically, checking facilities detect and act upon incorrect functioning
      of a specific device of the measuring instrument, and/or disturbed communication
      between specific devices of the measuring instrument.
  - content: '"Act upon" refers to any adequate response by the measuring instrument
      (for example: a luminous signal, an acoustic signal, interruption or blocking
      of the measurement process, etc.).'
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: checking facility
  language_code: eng
  entry_status: valid
