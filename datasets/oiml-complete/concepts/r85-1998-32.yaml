data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: Defaut supérieur à la valeur spécifiée dans la ligne C du Tableau 1 (voir
      3.4.2).
  examples: []
  id: r85-1998-32-fra
  notes:
  - content: 'Les défauts suivants ne sont pas considérés comme significatifs même
      en cas de dépassement de la valeur définie ci-dessus:'
  - content: "(a) défauts provenant de causes simultanées et mutuellement indépendantes
      dans le JA ou dans ses systèmes de contrôle;"
  - content: "(b) défauts rendant impossible l'accomplissement de toute mesure;"
  - content: "(c) défauts transitoires consistant en des variations momentanées des
      indications qui ne peuvent être interprétées, mises en mémoire ou transmises
      en tant que résultats de mesure;"
  - content: "(d) défauts provoquant des variations des résultats de mesure si importantes
      qu'elles ne peuvent manquer d'être remarquées par tous ceux qui sont intéressés
      au résultat du mesurage."
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Défaut significatif
  language_code: fra
  entry_status: valid
date_accepted: '2026-07-16T00:00:00+00:00'
