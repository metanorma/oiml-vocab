data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: A fault greater than the value specified in line C of Table 1 (see 3.4.2).
  examples: []
  id: r85-1998-32-eng
  notes:
  - content: 'The following faults are considered not to be significant, even when
      they exceed the value defined above:'
  - content: "(a) faults arising from simultaneous and mutually independent causes
      in the ALG itself or in its checking facilities;"
  - content: "(b) faults implying the impossibility to perform any measurement;"
  - content: "(c) transitory faults being momentary variations in the indication,
      which cannot be interpreted, memorized or transmitted as a measurement result;"
  - content: "(d) faults giving rise to variations in the measurement results so serious
      that they are bound to be noticed by all those interested in the result of the
      measurement."
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Significant fault
  language_code: eng
  entry_status: valid
date_accepted: '2026-07-16T00:00:00+00:00'
