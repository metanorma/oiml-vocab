  definition:
  - content: fault exceeding the applicable fault limit value
  examples: []
  id: r129-1-2020-32-eng
  notes:
  - content: Faults arising from simultaneous and mutually independent causes in the
      measuring instrument itself; faults implying the impossibility to perform any
      measurement; transitory faults being momentary variations in the indication,
      which cannot be interpreted, memorised or transmitted as a measurement result;
      and faults giving rise to variations in the measurement result so serious that
      they are bound to be noticed by all those interested in the result of the measurement
      are not considered significant.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: significant fault
  language_code: eng
  entry_status: valid
