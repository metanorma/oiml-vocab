  definition:
  - content: angular span of a radiation beam in the horizontal plane
  examples: []
  id: r91-1-2025-27-eng
  notes:
  - content: The angular span of a radiation beam in the vertical plane is referred
      to as vertical beam width.
  - content: The beam width of a Doppler-radar based speed meter is commonly measured
      between half-maximum-power points (or -3 dB points) on each side of the main
      lobe.
  - content: Beam widths can be expressed in angles or metres (at a specified distance).
