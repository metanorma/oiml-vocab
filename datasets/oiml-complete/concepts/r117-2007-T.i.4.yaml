  definition:
  - content: Un ensemble de mesurage interruptible est un ensemble de mesurage pour
      lequel le débit du liquide peut être aisément et rapidement interrompu (sans
      recourir à un dispositif d'arrêt d'urgence). Dans les autres cas, l'ensemble
      de mesurage est considéré non-interruptible.
