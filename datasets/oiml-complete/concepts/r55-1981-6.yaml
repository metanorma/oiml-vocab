    type: accepted
  definition:
  - content: Grandeur caractéristique indiquant l'espèce (tours de l'arbre d'entraînement
      ou impulsions) et la fréquence des signaux à laquelle le compteur de vitesse
      doit indiquer la vitesse de 60 km/h.
  examples: []
  id: r55-1981-6-fra
  notes:
  - content: La constante du compteur de vitesse est exprimée en tours par minute,
      tr/min, ou en impulsions par minute, imp/min.
  - content: La constante du compteur de vitesse est numériquement égale à la constante
      k du compteur de distance lorsque l'entraînement est commun aux deux instruments.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Constante du compteur de vitesse
