  definition:
  - content: Volume de liquide correspondant au cycle de fonctionnement du transducteur
      de mesure, c'est-à-dire à la séquence des mouvements à la fin de laquelle tous
      les organes internes mobiles du transducteur reprennent, pour la première fois,
      la même position qu'à l'instant initial.
