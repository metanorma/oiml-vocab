data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: Valeur extrême de la variation de l'erreur de l'indication d'un compteur,
      permise par la présente Recommandation, quand un seul facteur d'influence est
      pris à partir de sa valeur aux conditions de référence et varie dans les conditions
      assignées de fonctionnement.
  examples: []
  id: r46-2012-40-fra
  notes:
  - content: Pour chaque facteur d'influence il y a un décalage d'erreur maximal toléré
      correspondant.
  - content: Dans cette Recommandation, l'erreur maximale tolérée est une combinaison
      de l'erreur maximale tolérée de base et le décalage d'erreur maximal toléré
      comme décrit en Annexe B.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: décalage d'erreur maximal toléré
  language_code: fra
  entry_status: valid
