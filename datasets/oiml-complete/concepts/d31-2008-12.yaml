data:
  dates:
  - date: '2026-07-15T11:14:13Z'
    type: accepted
  definition:
  - content: |-
      Ubicación en la memoria que todo programa necesita para procesar datos. En función del tipo de lenguaje de programación utilizado, la ubicación se define mediante direcciones de hardware o nombres simbólicos (nombres de variables). El tamaño del domino direccional más pequeño suele ser un byte, pero prácticamente no está limitado: varía de 1 bit (p. ej. el flag de un registro) a estructuras de datos arbitrarias que pueden ser tan grandes como las necesidades del programador.

      Los dominios de datos pueden pertenecer a un único «módulo software» o a varios. En el caso de lenguajes de alto nivel (como JAVA, C/C++, etc.) es fácil impedir el acceso al dominio de datos de un módulo de software desde otros módulos software a través del lenguaje.
  examples: []
  id: d31-2008-12-spa
  notes: []
  sources: []
  terms:
