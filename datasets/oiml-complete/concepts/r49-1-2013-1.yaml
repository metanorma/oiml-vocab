data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: instrument intended to measure continuously, memorize, and display the
      volume of water passing through the measurement transducer at metering conditions
  examples: []
  id: r49-1-2013-1-eng
  notes:
  - content: A water meter includes at least a measurement transducer, a calculator
      (including adjustment or correction devices, if present) and an indicating device.
      These three devices can be in different housings.
  - content: A water meter may be a combination meter (see 3.1.16).
  - content: In this Recommendation, a water meter is also referred to as a "meter".
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: water meter
  language_code: eng
  entry_status: valid
