  definition:
  - content: Matériau à l'intérieur de la colonne, auquel est liée la phase stationnaire
      (y compris le matériau de remplissage) et par lequel s'écoule la phase mobile.
      Idéalement le matériau devrait être inerte. Le support solide peut être caractérisé
      par le diamètre d'une particule, mesuré en µm.
