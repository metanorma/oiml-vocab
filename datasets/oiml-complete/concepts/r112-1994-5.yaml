  definition:
  - content: The material within the column to which the stationary phase is bonded
      (together comprising the packing material) and through which the mobile phase
      flows.
  examples: []
  id: r112-1994-5-eng
  notes:
  - content: Ideally this material is inert. It may be characterized by the particle
      diameter measured in micrometres.
