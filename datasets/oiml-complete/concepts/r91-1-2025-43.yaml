  definition:
  - content: speed meter without compensation for cosine error
  examples: []
  id: r91-1-2025-43-eng
  notes:
  - content: A variation of measurement angle will always lead to negative cosine
      errors (i.e. in favour of the accused driver) for this class of speed meters.
  - content: Typical examples are hand-held LIDAR speed meters and fixed-distance
      speed meters.
  sources:
  - origin:
