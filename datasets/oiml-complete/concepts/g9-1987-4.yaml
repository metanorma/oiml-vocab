  definition:
  - content: |-
      There are few publications on mechanical weighing devices which are still commercially available in this field.

      The book by Colijn - "Weighing and proportioning of bulk solids" is very useful.

      The well-known metrology text-book by Doeblin "Measurement systems" contains a chapter on force and torque measurements.

      More recently the "Dictionary of Weighing Terms" by Bietry and Kochsiek available from Mettler representatives contains useful information (English, French, German and Chinese editions).

      A large number of principles and descriptions of constructions of all types of weighing machines with a great number of references is given in the book by Kemény Tamas - Mérlegtechnikai kézikönyv (1980) (see OIML Bulletin No.84, p.35). Due to the large number of illustrations this book may be useful even for those who cannot read Hungarian.

      A good book in German (see OIML Bulletin No.100, p.41) has been published under the direction of M. Kochsiek : Handbuch des Wagens, Fr. Vieweg & Sohn, Braunschweig, 1985

      Papers of special interest are from time to time published in the German revue Wagen + Dosieren, Verlag Keppler - Kirchheim GmbH, Postfach 2524, 6500 Mainz, Fed. Rep. of Germany.

      Since 1979 conferences under the name of "Weightech" are organised in Europe (U.K.) and also in U.S.A. (1983). The proceedings of Weightech 79, 81 and 83 may be procured from

      The Institute of Measurement and Control 20 Peel Street London W8 7PD U.K.

      PTB seminars were organised in 1979 and 1984, see conference proceedings in PTB-Bericht PTB-Me-26 (April 1980) and PTB-Me-60 (June 1984). See also PTB-report by M. Kochsiek : The determination of Mass (Part I and II), English translation December 1983.

      Some of the papers presented at the OIML seminars may also be useful, see OIML Bulletins No.85, 86, 90, 100, 101, 102, 103 and 104.

      See also Index to OIML Bulletins No 1 to 89 page 18, and the BIML brochure "Mobile equipment for the verification of road weighbridges".

      The IMEKO TC 3 Mass and Force conference proceedings frequently contain suitable source material for teaching and references to other publications. Some of the proceedings are published as VDI-Berichte (papers are in English and German depending on the author) :

      VDI-Bericht No 137 (1st IMEKO TC 3 Conference, Braunschweig, 1968)

      No 176 (2nd IMEKO TC 3 Conference, den Haag, 1971)

      No 202 (3rd IMEKO TC 3 Conference, Ostrava, 1972

      No 212 (4th IMEKO TC 3- Conference, Udine, 1974)

      No 312 (7th IMEKO TC 3 Conference, Braunschweig, 1978)

      The proceedings from 5th Conference (Szeged), 6th Conference (Odessa, 1977) and 8th Conference (Krakow, 1980) may be obtained by contacting IMEKO Secretariat, P.O. Box 457, 1371 Budapest 5, Hungary.

      (The proceedings of the 7th Conference VDI-Bericht No 312 contains in particular several good survey papers).

      The National Scale Men's Association USA has published in 1981 the "Scalemen's Handbook of Metrology" which is both a tutorial and a practical instruction book for weighing machine technicians, covering: mechanical scales, hydraulics, electronic scales, instrumentation, system trouble-shooting and calibration, tank and batch weighing, tests and tolerances.

      The book is in loose leaf form with a three hole system but a binder may also be obtained from the publishers :

      International Society of Weighing and Measurement 2506 Gross Point Road Evanston, Illinois 60201 U.S.A.

      Two recent survey papers also provide for instructive material Erdem U. - Force and Weight Measurement J. Phys. E : Sci Instrum. Vol.15, 1982, p.857-872 Hugh-Jones F.B. - The modern balance and its development J. Phys. E : Sci. Instrum. Vol.15, 1982, p.981-987
