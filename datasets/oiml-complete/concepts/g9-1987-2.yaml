  - content: |-
      This list compiled from information available at BIML and classified by subject is very incomplete. We have tried to include only literature which is still commercially available, however in the meantime some of them may already be out of print.

      The publications obtainable from official institutions and associations are generally to be found in the preceding chapters

      In order to reduce space reference is sometimes made to survey papers or separately published bibliographies (available from BIML or from other institutions).

      Books in Russian language have for ease of reproduction been listed separately at the end of this chapter.
