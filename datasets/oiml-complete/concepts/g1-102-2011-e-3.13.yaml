  definition:
  - content: function giving, for every value $ \boldsymbol{\xi}=(\xi_{1},\dots,\xi_{N})^{\top}
      $ , the probability that each element $ X_{i} $ of the random variable $ \boldsymbol{X}
      $ be less than or equal to $ \xi_{i} $
  examples: []
  id: g1-102-2011-e-3.13-eng
  notes:
  - content: The joint distribution for the random variable $ \boldsymbol{X} $ is
      denoted by $ G_{\boldsymbol{X}}(\boldsymbol{\xi}) $ , where $ G _ {\boldsymbol
      {X}} (\boldsymbol {\xi}) = \Pr \left(X _ {1} \leq \xi_ {1}, \dots , X _ {N}
      \leq \xi_ {N}\right).$
