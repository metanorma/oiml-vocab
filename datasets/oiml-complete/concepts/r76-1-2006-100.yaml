  definition:
  - content: L'inexactitude globale de lecture des instruments à indication analogique
      est egale à l'écart-type de la même indication dont la lecture est effectuée,
      dans les conditions normales d'emploi, par différents observateurs.
  - content: Il est habituel de faire au moins dix lectures du résultat.
