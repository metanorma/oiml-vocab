data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: 'Défaut supérieur à d_t. Les défauts ci-après ne sont pas considérés
      comme défauts significatifs: défauts provenant de causes simultanées et mutuellement
      indépendantes dans l''instrument ou son équipement de contrôle; défauts rendant
      impossible l''exécution de tout mesurage; défauts transitoires consistant en
      des variations momentanées des indications qui ne peuvent être interprétées,
      mémorisées ou transmises en tant que résultat de mesure; défauts si importants
      qu''ils ne peuvent manquer d''être remarqués par les personnes intéressées au
      mesurage.'
