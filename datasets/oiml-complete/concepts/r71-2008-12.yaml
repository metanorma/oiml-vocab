  definition:
  - content: |-
      Behälterarmaturen, Struktur, Rohrleitung und andere Ausrüstungsteile, die das Fassungsvermögen eines Behälters beeinflussen.

      Ein- und Anbauten werden als "positive" bezeichnet, wenn die Kapazität der Armaturen das effektive Fassungsvermögen des Behälters vergrößert, oder als "negative", wenn das Volumen der Armaturen Flüssigkeit verdrängt und das effektive Fassungsvermögen verringert.
