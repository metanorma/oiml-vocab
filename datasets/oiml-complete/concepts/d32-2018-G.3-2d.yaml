  definition:
  - content: conformity assessment procedure on one or more specimens of an identified
      type (pattern) of measuring instruments which results in an evaluation report
      and / or an evaluation certificate
  examples: []
  id: d32-2018-e-G.3-2d-eng
  notes:
  - content: '"Pattern" is used in legal metrology with the same meaning as "type".'
  - content: For the purposes of the OIML-CS, "evaluation report" should be read as
      "OIML type evaluation report".
