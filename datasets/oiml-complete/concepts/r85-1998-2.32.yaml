    type: accepted
  definition:
  - content: 'Defaut supérieur à la valeur spécifiée dans la ligne C du Tableau 1
      (voir 3.4.2). Les défauts suivants ne sont pas considérés comme significatifs
      même en cas de dépassement de la valeur définie ci-dessus: (a) défauts provenant
      de causes simultanées et mutuellement indépendantes dans le JA ou dans ses systèmes
      de contrôle; (b) défauts rendant impossible l''accomplissement de toute mesure;
      (c) défauts transitoires consistant en des variations momentanées des indications
      qui ne peuvent être interprétées, mises en mémoire ou transmises en tant que
      résultats de mesure; (d) défauts provoquant des variations des résultats de
      mesure si importantes qu''elles ne peuvent manquer d''être remarquées par tous
      ceux qui sont intéressés au résultat du mesurage.'
