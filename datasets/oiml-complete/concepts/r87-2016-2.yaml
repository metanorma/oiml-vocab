data:
  dates:
  - date: '2026-07-15T11:15:17Z'
    type: accepted
  definition:
  - content: |-
      Todo aquello en el preempacado, que no corresponde a material de empaque.

      Nota 1: Un producto incluye líquidos o gases colocados en el preempacado junto con el producto y que no están previstos para ser desechados después del uso del producto (por ejemplo, el aire en un mousse de chocolate).

      Nota 2: Un producto incluye líquidos o gases no colocados en el preempacado junto con el producto, y que están previstos para ser desechados después del uso del producto (por ejemplo, el líquido en el queso mozarella, el aire en el gel para el cabello).

      Nota 3: Un producto incluye líquidos o gases no colocados en el preempacado junto con el producto, y que no están previstos para ser desechados después de usar el producto (por ejemplo, los grumos que se forman en el yogur o en la miel).
