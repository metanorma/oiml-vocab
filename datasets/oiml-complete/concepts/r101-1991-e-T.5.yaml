  definition:
  - content: A pressure which varies in any way whatever, periodic or otherwise, at
      speeds between 1 % and 10 % of the upper limit of the measuring range per second,
      for pressure gauges and vacuum gauges, 1 % and 10 % of the sum of the upper
      limits of the measuring ranges per second, for pressure-vacuum gauges.
