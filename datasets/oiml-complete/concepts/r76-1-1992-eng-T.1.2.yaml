data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Instrument that requires the intervention of an operator during the weighing
      process, for example to deposit on or remove from the receptor the load to be
      measured and also to obtain the result.
  examples: []
  id: r76-1-1992-eng-T.1.2-eng
  notes:
  - content: The instrument permits direct observation of the weighing results, either
      displayed or printed; both possibilities are covered by the word "indication".
  - content: Terms such as "indicate", "indicating component" and their derivatives
      do not include printing.
  - content: A nonautomatic weighing instrument may be graduated or non-graduated,
      self-indicating, semi-self-indicating or non-self-indicating.
  - content: In this Recommendation a nonautomatic weighing instrument is called an
      "instrument".
