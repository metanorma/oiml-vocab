  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Etendue des débits massiques ou des concentrations des composants de
      l'échantillon d'essai dans laquelle une variation du débit massique produit
      une variation du signal du détecteur. La limite inférieure est donnée par la
      limite de détction et la limite supérieure correspond au débit massique ou concentration
      le plus élevé auquel une légère augmentation supplémentaire du débit ou de la
      concentration ne produit plus d'augmentation observable du signal du détecteur.
      La valeur de l'étendue dynamique est donnée par le rapport de la limite supérieure
      à la limite inférieure; elle est supérieure ou égale à la valeur de l'étendue
      linéaire.
