    type: accepted
  definition:
  - content: That range of mass flow rate or concentration of the test sample components
      over which an incremental change in the mass flow rate produces an incremental
      change in the detector signal. The lower limit is given by the detection limit,
      and upper limit is the highest mass flow rate or concentration at which a further
      slight increase in flow rate or concentration will give no observable increase
      in detector signal. The value of the dynamic range is the ratio of the upper
      to the lower limit and is larger than or equal to the linear range.
  examples: []
