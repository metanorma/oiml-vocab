data:
  dates:
  - date: '2026-07-15T00:00:00Z'
    type: accepted
  definition:
  - content: valeur extrême de l'erreur de mesure, par rapport à une valeur de référence
      connue, qui est tolérée par les spécifications ou règlements pour un mesurage,
      un instrument de mesure ou un système de mesure donné
  examples: []
  id: r46-1-2-2012-38-fra
  notes:
  - content: Les termes « erreurs maximales tolérées » ou « limites d'erreur » sont
      généralement utilisés lorsqu'il y a deux valeurs extrêmes.
  - content: Il convient de ne pas utiliser le terme « tolérance » pour désigner l'erreur
      maximale tolérée.
  - content: Dans la présente Recommandation, l'erreur maximale tolérée est une combinaison
      de l'erreur maximale tolérée de base et le décalage d'erreur maximal toléré.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: erreur maximale tolérée EMT
  language_code: fra
  entry_status: valid
date_accepted: '2026-07-16T00:00:00+00:00'
