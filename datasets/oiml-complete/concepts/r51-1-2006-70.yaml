data:
  dates:
  - date: '2026-07-15T00:00:00Z'
    type: accepted
  definition:
  - content: Numerical value, representing a weight value, that is introduced into
      the instrument. It is a predetermined tare value that is used for one or several
      weighings.
  examples: []
  id: r51-1-2006-70-eng
  notes:
  - content: '"Introduced" includes procedures such as: keying in, recalling from
      a data storage, or inserting via an interface.'
  - content: '"Predetermined" means that a tare value is determined once and is applied
      to other weighings without determining the individual tare values.'
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Preset tare value, PT
