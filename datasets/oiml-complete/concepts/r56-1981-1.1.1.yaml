  definition:
  - content: Standard solution of which the conductivity is determined by means of
      the absolute method (see Vocabulary of legal metrology, point 5.2.4.).
  examples: []
  id: r56-1981-e-1.1.1-eng
  notes:
  - content: The constant of the cell is determined according to the definition given
      in point 1.3. below, as a function of the geometrical characteristics of the
      cell, expressed in SI units, without the use of another standard solution.
