data:
  dates:
  - date: '2026-07-15T00:00:00Z'
    type: accepted
  definition:
  - content: Propriété du résultat d'un étalonnage ou d'un mesurage qui le relie à
      la définition des unités par l'intermédiaire d'une chaîne ininterrompue de comparaisons
      ayant toutes des incertitudes établies.
  examples: []
  id: d1-2004-1-fra
  notes:
  - content: Pour l'application des contrôles de métrologie légale, la traçabilité
      peut être obtenue par une évaluation des incertitudes ou par le respect d'erreurs
      maximales tolérées prédéfinies.
  sources:
  - type: authoritative
    origin:
      ref: OIML D 1:2004 (F)
      clause: Partie 3, Chapitre I, 1.1
  terms:
  - type: expression
    normative_status: preferred
    designation: traçabilité
  - type: expression
    designation: traçabilité des étalonnages et des mesurages
