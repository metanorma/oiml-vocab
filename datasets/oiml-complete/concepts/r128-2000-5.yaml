  definition:
  - content: La position de base H du guidon est définie par la distance verticale
      CH depuis le centre C de l'axe du pédalier jusqu'au point de fixation du guidon
      et par la distance horizontale SH depuis la position S de la selle jusqu'au
      point de fixation du guidon.
