data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: Volume de gaz correspondant au cycle de fonctionnement du compteur de
      volume de gaz, c'est-à-dire à l'ensemble des mouvements des organes mobiles
      du compteur à la fin desquels tous ces organes, sauf le dispositif indicateur
      et les transmissions intermédiaires, reprennent pour la première fois la position
      qu'ils avaient à l'instant initial.
  - content: Ce volume est déterminé en multipliant la valeur du volume correspondant
      à un tour complet de l'élément contrôleur, ou la valeur du plus petit échelon,
      par le rapport de transmission du dispositif mesureur au dispositif indicateur.
  examples: []
  id: r6-1989-2-fra
  notes: []
  sources: []
