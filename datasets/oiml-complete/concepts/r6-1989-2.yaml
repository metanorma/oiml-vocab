data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: The volume of gas corresponding to the working cycle of the gas volume
      meter, i.e. to all the movements of the moving components which, except for
      the indicating device and the intermediate transmissions, resume for the first
      time the position they occupied at the beginning of the cycle.
  - content: This volume is determined by multiplying the value of the volume corresponding
      to one complete revolution of the test element, or the value of the smallest
      scale interval, by the transmission ratio of the measuring device to the indicating
      device.
  examples: []
  id: r6-1989-2-eng
  notes: []
  sources: []
