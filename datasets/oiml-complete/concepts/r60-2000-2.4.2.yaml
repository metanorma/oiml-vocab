  definition:
  - content: The value of a dimensionless fraction expressed as a decimal (for example,
      0.7) used in determining mpe (see 2.4.9). It represents that apportionment of
      a whole error (as may apply to a weighing instrument) which has been assigned
      to the load cell alone (p_LC).
