    type: accepted
  definition:
  - content: Influence quantity having a value outside the specified rated operating
      conditions of the measuring system.
  - content: If the rated operating conditions are not specified for an influence
      quantity, it is a disturbance.
  examples: []
  id: r117-1-2007-30-eng
  notes:
  - content: For electronic measuring systems only.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Disturbance
  language_code: eng
  entry_status: valid
