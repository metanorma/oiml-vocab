data:
  dates:
  - date: '2026-07-15T00:00:00Z'
    type: accepted
  definition:
  - content: A fault greater than the absolute value of the maximum permissible error
      for the minimum quantity.
  examples: []
  id: r125-1998-31-eng
  notes:
  - content: Faults arising from simultaneous and mutually independent causes in the
      measuring instrument itself or in its checking facilities; faults implying the
      impossibility to perform any measurement; transitory faults being momentary
      variations in the indication, which cannot be interpreted, memorized or transmitted
      as a measurement result; and faults giving rise to variations in the measurement
      result which are so serious that they are bound to be noticed by all those interested
      in the measurement result are not considered significant.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Significant fault
  language_code: eng
  entry_status: valid
