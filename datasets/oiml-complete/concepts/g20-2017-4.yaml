  definition:
  - content: Agency which is in charge of safeguarding the legally prescribed performance
      of the "bodies responsible for subsequent verification" or "legally responsible
      entities", depending on the state of privatization of the legal metrology system.
      The supervising authorities are also often in charge of market surveillance
      activities.
