  - date: '2026-07-15T11:15:15Z'
    type: accepted
  definition:
  - content: Los preempacados deben estar fabricados, construidos o exhibidos de manera
      que impidan razonablemente que un comprador sea engañado con respecto a la cantidad
      o identificación del producto contenido en ellos. Un preempacado no debe tener
      fondo, paredes, tapa o cubierta falsos, y su construcción o llenado, ya sea
      en su totalidad o parcialmente, no debe resultar engañoso para el comprador.
      Los fondos cóncavos se pueden justificar por razones de seguridad.
