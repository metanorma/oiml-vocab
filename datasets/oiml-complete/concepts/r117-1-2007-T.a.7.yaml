  definition:
  - content: Device, connected to the calculator, the correction device or the conversion
      device, and converting during the measurement the characteristic quantities
      (temperature, pressure, density, viscosity, etc.) of the liquid into signals
      destined for the calculator, with a view to making a correction and/or a conversion.
      It includes an associated measuring sensor and an associated measuring transducer.
