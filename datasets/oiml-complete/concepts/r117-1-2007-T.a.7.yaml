  definition:
  - content: Dispositif raccordé au calculateur, au dispositif de correction ou au
      dispositif de conversion, qui convertit au cours du mesurage, les grandeurs
      caractéristiques du liquide (température, pression, masse volumique, viscosité,
      etc.) en signaux destinés au calculateur, en vue d'effectuer une correction
      et/ou une conversion. Il comprend un capteur de mesure associé et un transducteur
      de mesure associé.
