  definition:
  - content: |-
      longueur de la perpendiculaire abaissée du point considéré sur la face de mesure opposée.

      Remarque : Lors du mesurage interférentiel de la longueur d'un calibre, la face de mesure opposée est remplacée par la face d'un plan auxiliaire collé, en même matière et ayant la même qualité de surface que le calibre.
