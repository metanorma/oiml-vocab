    type: accepted
  definition:
  - content: intervalle pour lequel on peut affirmer, avec un niveau de confiance
      donné, qu'il contient au moins une proportion également donnée de la population
  examples: []
  id: g1-100-2008-53-fra
  notes:
  - content: Lorsque les deux limites sont définies par des statistiques, l'intervalle
      est bilatéral. Lorsque l'une des deux limites est infinie ou est constituée
      par une borne de la variable, l'intervalle est unilatéral.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: intervalle statistique de dispersion
