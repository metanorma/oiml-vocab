    type: accepted
  definition:
  - content: The overall inaccuracy of reading of an instrument with analogue indication
      is equal to the standard deviation of the same indication, the reading of which
      is carried out under normal conditions of use by several observers. It is customary
      to make at least ten readings of the result.
