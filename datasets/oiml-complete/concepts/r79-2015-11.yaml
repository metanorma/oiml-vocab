data:
  dates:
  - date: '2026-07-15T11:15:15Z'
    type: accepted
  definition:
  - content: |-
      A menos que el empacador declare que la cantidad gratuita está incluida en la cantidad nominal, cualquier declaración de este tipo se debe hacer de manera que impida razonablemente que el comprador sea engañado con respecto a la cantidad total.

      <div align="center">

      # Anexo A

      Unidades de medición y símbolos

      (Obligatorio)

      </div>

      A.1 Las unidades de medición se deben expresar en palabras o en símbolos. La Tabla A.1 presenta las unidades y sus símbolos apropiados para mediciones.

      <div align="center">

      Tabla A.1. Unidades de medición

      </div>

      <table border="1"><tr><td>Unidad</td><td>Símboloa)</td></tr><tr><td>miligramo</td><td>mg</td></tr><tr><td>gramo</td><td>g</td></tr><tr><td>kilogramo</td><td>kg</td></tr><tr><td>tonelada</td><td>t</td></tr><tr><td>mililitro</td><td>mL o ml</td></tr><tr><td>centilitro</td><td>cL o cl</td></tr><tr><td>litrob)</td><td>L o l</td></tr><tr><td>micrómetro</td><td>μm</td></tr><tr><td>milímetro</td><td>mm</td></tr><tr><td>centímetro</td><td>cm</td></tr><tr><td>metro</td><td>m</td></tr><tr><td>milímetro cuadrado</td><td>mm2</td></tr><tr><td>centímetro cuadrado</td><td>cm2</td></tr><tr><td>decímetro cuadrado</td><td>dm2</td></tr><tr><td>metro cuadrado</td><td>m2</td></tr><tr><td>centímetro cúbico</td><td>cm3</td></tr><tr><td>decímetro cúbico</td><td>dm3</td></tr><tr><td>metro cúbico</td><td>m3</td></tr><tr><td colspan="2">a)No se debería usar ningún punto ni la letra“s”después de cualquiera de los símbolos.
      b)El símbolo alternativo para litro,L fue adoptado por la Conferencia General de Pesos y Medidas (CGPM) para evitar riesgo de confusión entre la letraI y el número1.</td></tr></table>

      A.1.1 Se debe usar un solo espacio para separar el número de la unidad de medición.

      A.1.2 Para hacer la declaración de cantidad se pueden usar expresiones apropiadas tales como "contenido", "cantidad", "masa", "peso", "neto", "masa neta", "peso neto", "contenido neto" o "cantidad neta", de acuerdo con la legislación nacional. Estas expresiones pueden ir escritas antes o después de la declaración de cantidad. Las expresiones "escurrido" o "peso escurrido" se deben usar solamente como se describe en 5.2.

      A.1.3 No se deben usar expresiones ambiguas tales como "aproximadamente" o "estándar" o "en el momento del empaque", como parte de la declaración de cantidad.

      A.1.4 La unidad que se use depende del tipo de medición y de la cantidad nominal del producto. La Tabla A.2 indica la unidad correcta para varias medidas y cantidades (ver 5.4).

      <div align="center">

      Tabla A.2. Selección de unidades

      </div>

      <table border="1"><tr><td>Tipo de medición</td><td>Cantidad de producto (q)</td><td>Unidades</td></tr><tr><td rowspan="2">Volumena) (líquidos)</td><td>q&lt;1000mL</td><td>mL(ml) o cL(cl)</td></tr><tr><td>1000mL≤q</td><td>L(l)</td></tr><tr><td rowspan="3">Volumen-cúbico (sólidos)</td><td>q≤1000cm3(1dm3)</td><td>cm3,mL(ml)</td></tr><tr><td>1dm3&lt;q&lt;1000dm3</td><td>dm3,L(l)</td></tr><tr><td>1000dm3≤q</td><td>m3</td></tr><tr><td rowspan="3">Masab)</td><td>q&lt;1g</td><td>mg</td></tr><tr><td>1g≤q&lt;1000g</td><td>g</td></tr><tr><td>1000g≤q</td><td>kg o t</td></tr><tr><td rowspan="3">Longitudc)</td><td>q&lt;1mm</td><td>μm o mm</td></tr><tr><td>1mm≤q&lt;100cm</td><td>mm o cm</td></tr><tr><td>100cm≤q</td><td>m</td></tr><tr><td rowspan="3">Áreaa)</td><td>q&lt;100cm2(1dm2)</td><td>mm2o cm2</td></tr><tr><td>1dm2≤q&lt;100dm2(1m2)</td><td>dm2</td></tr><tr><td>1m2≤q</td><td>m2</td></tr></table>

      a) Ver 5.5 a), c), e), f) y g)

      b) Ver 5.5 b), c), e) y g)

      c) Ver 5.5 f)
