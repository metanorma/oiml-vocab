data:
  dates:
  - date: '2026-07-15T00:00:00+00:00'
    type: accepted
  definition:
  - content: Etendue des concentrations dans laquelle un changement de la concentration
      d'une substance produit une variation détectable du signal de sortie. La limite
      inférieure est fixée par la limite de détection et la limite supérieure par
      le point de saturation du détecteur. La valeur de l'étendue dynamique s'exprime
      par le rapport de la limite supérieure à la limite inférieure; elle est supérieure
      ou égale à l'étendue linéaire.
  examples: []
  id: d22-1991-7-fra
  notes: []
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Etendue dynamique d'un détecteur
  language_code: fra
  entry_status: valid
