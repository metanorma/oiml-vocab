    type: accepted
  definition:
  - content: 'Interface (hardware and/or software) which only allows the introduction
      of such data into the data processing device of an instrument, module or electronic
      component, which cannot:'
  - content: "- display data which are not clearly defined and which could be taken
      for a weighing result;"
  - content: "- falsify displayed, processed or stored weighing results or primary
      indications; or"
  - content: "- adjust the instrument or change any adjustment factor, except releasing
      an adjustment procedure with incorporated devices or, in the case of class I
      instruments with external adjustment weights as well."
  examples: []
  id: r76-1-2006-35-eng
  notes: []
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: protective interface
  language_code: eng
  entry_status: valid
