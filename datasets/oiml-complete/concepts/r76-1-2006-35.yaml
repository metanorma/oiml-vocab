data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: 'Interface (matériel et/ou logiciel) qui autorise seulement l''introduction
      de données dans le dispositif de traitement de données d''un instrument, module
      ou composant électronique, telles qu''il ne soit pas possible :'
  - content: "- d'afficher des données qui ne sont pas clairement définies et qui
      pourraient être prises pour un résultat de pesage ;"
  - content: "- de falsifier des résultats de pesage ou des indications primaires
      affichées, traitées ou stockées ; ou"
  - content: "- d'ajuster l'instrument ou changer tout facteur d'ajustage, à l'exception
      du déclenchement d'une procédure d'ajustage avec des dispositifs incorporés
      ou, dans le cas d'un instrument de classe I, avec des poids d'ajustage externes."
  examples: []
  id: r76-1-2006-35-fra
  notes: []
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: interface de protection
  language_code: fra
  entry_status: valid
