data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: measuring instrument reproducing or supplying, in a permanent manner
      during its use, quantities of one or more given kinds, each with an assigned
      quantity value
  examples:
  - content: Standard weight, volume measure (supplying one or several quantity values,
      with or without a quantity-value scale), standard electric resistor, line scale
      (ruler), gauge block, standard signal generator, certified reference material.
  id: d5-2022-e-3.14-eng
  notes:
  - content: The indication of a material measure is its assigned quantity value.
  - content: A material measure can be a measurement standard.
  sources: []
