data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: The mass flow rate (for mass flow-rate-dependent detectors) or the concentration
      (for concentration-dependent detectors) that yields a signal equal to three
      times the short-term noise level as determined on a statistical basis.
  examples: []
  id: r82-1989-10-eng
  notes:
  - content: This term is also referred to as "minimum detectability", or "minimum
      detectable limit (MDL)", in some references and manufacturer's literature. It
      is sometimes defined as an output signal equal to some other multiple (two or
      ten) of the noise level and depends somewhat on whether the gas chromatograph
      is used for quantitative or qualitative analysis.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Detection limit
  language_code: eng
  entry_status: valid
date_accepted: '2026-07-16T00:00:00+00:00'
