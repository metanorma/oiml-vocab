data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: Débit massique (pour les détecteurs sensibles au débit massique) ou concentration
      (pour les détecteurs sensibles à la concentration) qui fournit un signal égal
      à trois fois le niveau de bruit à court terme déterminé sur une base statistique.
  examples: []
  id: r82-1989-10-fra
  notes:
  - content: Ce terme est parfois désigné comme "détectabilité minimale" ou "limite
      minimale de détectabilité" dans les références ou dans la documentation des
      constructeurs. Il est parfois défini comme un signal de sortie égal à un autre
      multiple (2 ou 10) du niveau de bruit et peut varier selon que le chromatographe
      est utilisé pour une analyse quantitative ou pour une analyse qualitative.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Limite de détection
  language_code: fra
  entry_status: valid
date_accepted: '2026-07-16T00:00:00+00:00'
