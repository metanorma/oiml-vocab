  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: Identifiable part of an instrument that performs a specific function
      or functions, and that can be separately evaluated according to specific metrological
      and technical performance requirements in the relevant Recommendation. The modules
      of a weighing instrument are subject to specified partial error limits.
  - content: Independent OIML Certificates according to R 76 can be issued for the
      modules mentioned in T.2.2.2- T.2.2.7.
  examples: []
  id: r76-1-2006-22-eng
  notes:
  - content: 'Typical modules of a weighing instrument are: load cell, indicator,
      analog or digital data processing device, weighing module, terminal, primary
      display.'
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: module
  language_code: eng
