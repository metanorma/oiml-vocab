  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: Conventional value of the result of weighing in air, in accordance with
      OIML D28 Conventional value of the result of weighing in air [3]. For a weight
      taken at the reference temperature (t_ref) of 20 °C, the conventional mass is
      the mass of a reference weight of a density (ρ_ref) of 8000 kg m^-3 which it
      balances in air of a density of 1.2 kg m^-3.
  examples: []
  id: r111-1-2004-8-eng
  notes: []
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: conventional mass (also called conventional value of mass)
  language_code: eng
  entry_status: valid
