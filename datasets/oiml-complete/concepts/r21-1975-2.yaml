    type: accepted
  definition:
  - content: |-
      Le coefficient caractéristique d'un véhicule est une grandeur indiquant l'espèce et le nombre des signaux destinés à la commande du taximètre et apparaissant à la pièce correspondante prévue sur le véhicule pour 1 kilomètre de la distance parcourue.

      Ce coefficient w est exprimé :

      a) en « tours par kilomètre parcouru » (tr/km) ou

      b) en « impulsions par kilomètre parcouru » (imp/km), suivant que l'information relative à la distance parcourue par le véhicule apparaît sous la forme d'un nombre de tours de la pièce commandant le taximètre ou sous la forme de signaux électriques.

      Ce coefficient varie en fonction de plusieurs facteurs, notamment l'usure et la pression des pneumatiques, la charge du véhicule, les conditions de son déplacement ; il doit être déterminé dans les conditions normales d'essai du véhicule.
