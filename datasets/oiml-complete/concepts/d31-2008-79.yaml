  - content: 'Si los valores de medida se utilizan en otro lugar aparte del de la
      medición o en una fecha posterior a la misma, probablemente deban abandonar
      el instrumento de medida (dispositivo electrónico, subconjunto) y ser almacenados
      o transmitidos a un entorno desprotegido antes de ser utilizados con fines legales.
