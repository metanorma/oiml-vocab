  definition:
  - content: 7. 1. Tous les baromètres, qu'ils soient à mercure ou à élément récepteur
      élastique, doivent être marqués clairement et de manière indélébile avec un
      numéro de série unique, le nom du fabricant, l'année de fabrication, la désignation
      du modèle sous forme de nombre ou code et, si approprié, les marques de vérification.
      Ces marquages doivent être distincts de ceux de l'échelle pour éviter toute
      confusion.
