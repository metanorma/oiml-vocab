    type: accepted
  definition:
  - content: Certifying body or person in an OIML Member State designated by its CIML
      Member that issues OIML Certificates of Conformity according to the rules of
      the OIML Certificate System for Measuring Instruments.
  examples: []
  id: b3-2003-13-eng
  notes:
  - content: 'Note 1: A CIML Member may be responsible for an Issuing Authority.'
  - content: 'Note 2: A list of all Issuing Authorities in the various Member States
      is maintained by the BIML and is permanently available to Member States and
      other interested parties on the OIML web site and on request.'
  - content: 'Note 3: The Issuing Authority that issues OIML Certificates may or may
      not be the same organization as the national body that issues national type
      approval certificates and whose responsibilities are governed by national regulations.'
