data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: 'Dispositif qui convertit automatiquement, en prenant en compte les caractéristiques
      du liquide (température, pression, masse volumique, densité, etc.), mesurées
      au moyen de dispositifs de mesure associés, ou mémorisées : le volume mesuré
      dans les conditions de mesurage en un volume dans des conditions de base, ou
      le volume mesuré dans les conditions de mesurage en une masse, ou la masse mesurée
      en un volume les conditions de mesurage, ou la masse mesurée en un volume les
      conditions de base, ou le volume mesuré dans les conditions de mesurage ou la
      masse mesurée d''un mélange d''éthanol (alcool éthylique) pur et d''eau en volume
      ou masse d''éthanol pur contenu dans ce mélange.'
  - content: Le quotient de la quantité convertie par la quantité dans les conditions
      de mesure est appelé "facteur de conversion".
  examples: []
  id: r117-1-2007-24-fra
  notes: []
  sources: []
