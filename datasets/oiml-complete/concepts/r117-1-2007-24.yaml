data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: 'Device, which automatically converts: the volume measured at metering
      conditions into a volume at base conditions, or the volume measured at metering
      conditions into a mass, or the measured mass into a volume at metering conditions,
      or the measured mass into a volume at base conditions, or the volume at metering
      conditions or the measured mass of a mixture of pure ethanol (ethyl alcohol)
      and water into a volume or the mass of pure ethanol contained in that mixture,
      by taking account of the characteristics of the liquid (temperature, pressure,
      density, relative density, etc.) measured using associated measuring devices,
      or stored in a memory.'
  - content: The ratio of the converted quantity to the quantity at metering conditions
      is referred to as the "conversion factor."
  examples: []
  id: r117-1-2007-24-eng
  notes: []
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Conversion device
  language_code: eng
  entry_status: valid
