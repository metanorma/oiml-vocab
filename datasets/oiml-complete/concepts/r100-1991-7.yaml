data:
  dates:
  - date: '2026-07-15T00:00:00+00:00'
    type: accepted
  definition:
  - content: concentration d'un élément qui donne un signal égal à trois fois l'écart-type
      du bruit de fond, tel qu'il a été déterminé sur une base statistique. C'est
      la quantité minimale mesurée pour que l'on puisse conclure qu'un élément a effectivement
      été détecté
  examples: []
  id: r100-1991-7-fra
  notes:
  - content: Dans la présente Recommandation, ce terme est relatif à la détermination
      d'un élément dans une solution de référence sans interférents (perturbations).
      On établit le bruit de fond en mesurant le signal de sortie pour plusieurs portions
      d'une solution d'essai à blanc.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: limite de détection
  language_code: fra
  entry_status: valid
