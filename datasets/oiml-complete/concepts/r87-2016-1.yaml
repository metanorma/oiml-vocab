data:
  dates:
  - date: '2026-07-15T11:15:17Z'
    type: accepted
  definition:
  - content: |-
      2. 1.1

      cantidad real

      Cantidad de producto que contiene un preempacado, y que se determina por medición.

      Nota: La cantidad real en un preempacado "i" se designa mediante el símbolo $ Q_{i} $ o $ q_{i}. $

      2. 1.2

      error

      2. 1.2.1

      error promedio

      Suma de los errores individuales de los preempacados teniendo en cuenta su signo aritmético, dividida por el número de preempacados en la muestra o lote de inspección.

      Nota 1: El error promedio para todos los preempacados en una muestra con tamaño de muestra n se designa mediante el símbolo $e_{\mathrm{ave}}$.

      Nota 2: El error promedio para todos los preempacados de un lote de inspección con N preempacados se designa mediante el símbolo $ E_{\mathrm{ave}} $
