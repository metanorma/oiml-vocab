data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: Mode de fonctionnement d'une installation en libre-service dans lequel
      le fournisseur est présent et délivre l'autorisation de livraison.
  examples: []
  id: r139-2007-18-fra
  notes:
  - content: Dans le mode de service surveillé, la conclusion de la transaction intervient
      avant que le client ne quitte le site où la livraison a eu lieu.
  - content: Une transaction est conclue lorsque les parties intéressées à cette transaction
      ont fait connaître leur accord (explicite ou implicite) sur le montant de celle-ci.
      Il peut s'agir du paiement, de la signature d'un bordereau de carte de crédit,
      de la signature d'un bon de livraison, etc.
  - content: 'Les parties intéressées à une transaction peuvent être les parties elles-mêmes
      ou leurs représentants (exemple: pompiste dans une station-service, chauffeur
      d''un camion).'
  - content: Dans le mode de service surveillé, l'opération de mesurage se termine
      au moment où la conclusion de la transaction intervient.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Mode de service surveillé
  language_code: fra
  entry_status: valid
date_accepted: '2026-07-16T00:00:00+00:00'
