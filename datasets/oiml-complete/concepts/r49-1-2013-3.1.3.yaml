data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Parte de un medidor que es afectada directamente por un fenómeno, cuerpo
      o sustancia que lleva una cantidad a ser medida.
  examples: []
  id: r49-1-2013-spa-3.1.3-spa
  notes:
  - content: 'Fuente citation: OIML V 2-200:2012 (VIM) [1] 3.8, modificado - "medidor"
      remplaza "sistema de medición".'
  - content: Para un medidor de agua, el sensor puede ser un disco, pistón, rueda
      o elemento de turbina, los electrodos de un medidor electromagnético u otro
      elemento. El elemento detecta el caudal o volumen de agua que pasa por el medidor
      y es referido como "sensor de caudal" o "sensor de volumen".
