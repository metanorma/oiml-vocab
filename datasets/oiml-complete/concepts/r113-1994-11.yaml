    type: accepted
  definition:
  - content: Étendue des débits massiques ou des concentrations du composant de l'échantillon
      à analyser pour laquelle leur augmentation produit une variation mesurable du
      signal de sortie du détecteur. Cette étendue est exprimée comme le rapport de
      sa limite supérieure à la limite de détection.
