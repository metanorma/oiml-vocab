    type: accepted
  definition:
  - content: Valeur de masse du liquide déterminée par l'instrument de mesure (masse
      mesurée) ainsi que la masse de liquide sous le transducteur et inclut l'eau
      et les sédiments entraînés dans le liquide. Elle n'inclut pas la masse de vapeur
      au-dessus du liquide, la masse du toit flottant si présent, ou la masse de la
      vase du fond.
