  definition:
  - content: Dispositif qui utilise des sous-ensembles electroniques et qui accomplit
      une fonction specifique. Un dispositif electronique est usuellement fabrique
      en tant qu'unite separee et est susceptible d'etre essaye separement.
  examples: []
  id: r50-1-1997-f-T.3.3.1-fra
  notes:
  - content: 'Un dispositif electronique, tel que defini ci-dessus, peut etre un instrument
      de pesage complet (par exemple: une balance de comptoir) ou une partie d''un
      instrument de pesage (par exemple: un imprimeur, un indicateur).'
