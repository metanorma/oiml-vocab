    type: accepted
  definition:
  - content: 'Measures which are filled as required and used for the retail sale of
      drinks sold by volume. They are divided into two categories: transfer measures
      used solely for decanting specific volumes of beverages and drinking measures
      used also for the consumption of specific volumes of beverages.'
