data:
  dates:
  - date: '2026-07-15T00:00:00Z'
    type: accepted
  definition:
  - content: Catalytic activity of a component divided by the volume of the original
      system.
  examples: []
  id: r135-2004-25-eng
  notes:
  - content: The derived coherent SI unit is the mole per second per cubic metre (mol/(s·m^3)),
      also called kat/m^3. In laboratory medicine the mole per second per litre (mol/(s·L))
      is also frequently used.
  - content: Throughout this Recommendation the "component" is an enzyme and the "original
      system" can be, e.g., the plasma of a blood sample.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Catalytic activity concentration; catalytic concentration
