  - content: W niniejszym Zaleceniu, terminu „użytkenie” użytkwa się w odniesieniu
      do wszelkich rodków, za pomocąktórych wykonywana jest okłona funkcja niezalanie
      od fizycznej realizacji, np. za pomocnechanizmu lub przycisku inicjużcego operacji
      urządzenie może stanowi niewielką lub znaczną część przyrządu.
