  definition:
  - content: |-
      A.5.1.1. Les baromètres soumis à l'étalonnage doivent être placés dans les conditions ambiantes du laboratoire d'étalonnage pendant au moins 10 heures avant que l'étalonnage ne commence.

      A.5.1.2. Pendant tout l'étalonnage l'instrument doit être utilisé conformément aux instructions du manuel fourni.

      A.5.1.3. Le nombre de pressions d'essai dépend de la linéarité de l'instrument, comme obtenue par expérience ou lors des essais de modèle; cependant, des corrections instrumentales doivent être déterminées pour au moins 4 pressions d'essai réparties sur toute l'étendue de l'instrument et séparées par des intervalles de pression ne dépassant pas 5 kPa. L'une des pressions d'essai doit être 100 kPa si cette pression se situe dans les limites de mesure de l'instrument. Chaque cycle d'étalonnage inclut une série d'observations faites pour des pressions progressivement croissantes et une série d'observations faites pour des pressions progressivement décroissantes. Entre les points d'essai, la pression doit changer graduellement, à une vitesse ne dépassant pas 0,5 kPa par minute, et doit être maintenue pratiquement constante pendant au moins 5 minutes avant d'effectuer les observations.

      A.5.1.4. Le thermomètre associé, s'il est fourni, doit être étalonné dans toute l'étendue de température spécifiée pour le baromètre à des intervalles de température ne dépassant pas 10 $ ^{\circ} \mathrm{C} $ .
