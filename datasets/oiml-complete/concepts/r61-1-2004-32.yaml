    type: accepted
  definition:
  - content: Device for taring without altering the weighing range for net loads (additive
      tare device), or reducing the weighing range for net loads (subtractive tare
      device).
  examples: []
  id: r61-1-2004-32-eng
  notes:
  - content: The tare device may function as a non-automatic device (load balanced
      by the operator or tare preset by the operator), a semi-automatic device (load
      balanced automatically following a single manual command), or an automatic device
      (load balanced automatically without the intervention of an operator).
  sources: []
