  definition:
  - content: Échelle dont les longueurs d'échelons vont en diminuant et dont le repère
      correspondant à la demi-somme C = 1/2 (A + B) des limites A et B de l'étendue
      de l'échelle est compris entre 65 % et 100 % de la longueur de l'échelle correspondant
      à l'étendue de mesure.
  examples:
  - content: échelle logarithmique, échelle hyperbolique
