    type: accepted
  definition:
  - content: Article de présentation individuelle proposé au consommateur, comprenant
      le produit et les matériaux d'emballage dans lesquels il a été mis avant d'être
      proposé à la vente et pour lesquels la quantité de produit a une valeur prédéterminée,
      les matériaux d'emballage enfermant le produit complètement ou seulement de
      façon partielle, mais dans tous les cas, de telle manière que la quantité réelle
      de produit ne puisse être changée sans que les matériaux d'emballage ne soient
      ouverts ou ne subissent un changement perceptible.
  examples: []
