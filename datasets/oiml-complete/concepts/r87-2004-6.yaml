    type: accepted
  definition:
  - content: Un préemballage inadéquat pour lequel il est constaté que la quantité
      réelle contenue est inférieure à la quantité nominale moins deux fois l'insuffisance
      tolérée autorisée en 4.2.3 pour la quantité nominale, est désigné comme erreur
      T2.
  - content: 'Erreur T2: Contenu réel < (Q_n - T 2)'
  examples: []
  id: r87-2004-6-fra
  notes: []
