    type: accepted
  definition:
  - content: the sum of values divided by the number of values
  examples: []
  id: g1-100-2008-e-C.2.19-eng
  notes:
  - content: The term "mean" is used generally when referring to a population parameter
      and the term "average" when referring to the result of a calculation on the
      data obtained in a sample.
  - content: The average of a simple random sample taken from a population is an unbiased
      estimator of the mean of this population. However, other estimators, such as
      the geometric or harmonic mean, or the median or mode, are sometimes used.
  - content: 'Source citation: ISO 3534- 1'
