  definition:
  - content: somme des valeurs divisée par le nombre de valeurs
  examples: []
  id: g1-100-2008-f-C.2.19-fra
  notes:
  - content: Le terme anglais «mean» est utilisé généralement en référence au paramètre
      d'une population et le terme «average» en référence à un calcul sur des données
      d'un échantillon.
  - content: La moyenne d'un échantillon aléatoire simple pris dans une population
      est un estimateur sans biais de la moyenne de cette population. Cependant, d'autres
      estimateurs, tels que la moyenne géométrique ou harmonique, ou la médiane ou
      le mode sont parfois utilisés.
