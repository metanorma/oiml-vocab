data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Quantité minimale d'un composé donné qui, injecté dans le chromatographe,
      permet d'obtenir un rapport signal/bruit d'au moins 10 pour un ion moléculaire
      caractéristique de ce composé dans les conditions suivantes; en mode de balayage
      complet, un temps de balayage de l'étendue appropriée des masses doit être spécifié
      (par exemple une seconde); en mode de contrôle d'un ion spécifique, il faut
      mesurer l'ion principal du composé. Il faut également tenir compte du mode d'ionisation
      (impact d'électrons ou ionisation chimique).
  examples: []
  id: r83-1990-f-3.10-fra
  notes:
  - content: Le methyl stéarate est souvent utilisé comme composé d'essai.
  - content: Les constructeurs et utilisateurs de spectromètres de masse emploient
      souvent le terme "sensibilité" dans le même sens que "limite de détction".
  sources:
  - origin:
      ref:
        source: OIML R 83:1990
        version: '1990'
