data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: 'Différence entre la capacité réelle des matériaux d''emballage et le
      volume de produit qu''ils contiennent. Un remplissage faible peut être nécessaire
      pour les raisons suivantes:'
  - content: Protection du produit;
  - content: Les contraintes des machines utilisées pour enfermer le contenu du préemballage;
  - content: La formation inévitable d'un dépôt dans le produit pendant l'acheminement
      et la manutention; et
  - content: La nécessité pour le préemballage d'assurer une fonction spécifique (par
      exemple, lorsque l'emballage joue un rôle dans la préparation ou la consommation
      d'une denrée), si cette fonction est inhérente à la nature du produit et est
      clairement signalée aux consommateurs.
  examples: []
