  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: 'Difference between the actual capacity of the packing material and the
      volume of product it contains. Slack fill may be necessary for the following
      reasons:'
  - content: Protection of the product;
  - content: The requirements of machines used for enclosing the contents of the prepackage;
  - content: Unavoidable product settling during shipping and handling; and
  - content: The need for the prepackage to perform a specific function (e.g. where
      packaging plays a role in the preparation or consumption of a food), where such
      a function is inherent to the nature of the product and is clearly communicated
      to consumers.
  examples: []
