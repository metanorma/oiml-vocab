data:
  dates:
  - date: '2026-07-15T11:15:15Z'
    type: accepted
  definition:
  - content: |-
      4. 1 Se deben declarar el nombre y la dirección física completa del fabricante, empacador, distribuidor, importador, exportador o vendedor responsable del preempacado, sobre cualquier superficie en un tamaño, fuente, color, contraste con el fondo y ubicación tales, que sean notorios y fáciles de leer y de entender en una de las lenguas oficiales del país en el cual se vende.

      Nota: Algunos países pueden exigir más de una lengua oficial.

      4. 2 Cuando el producto no es fabricado ni empacado por la persona que asume la responsabilidad por el producto, el nombre puede ir acompañado de una frase que revele la conexión que dicha persona tiene con el producto, por ejemplo: "fabricado para..." "importado por...", o "empacado para... " y la persona responsable de

      suministrar el nombre y la dirección del empacador a un organismo regulador que exige esta información con fines oficiales.

      4. 3 El nombre y la dirección del fabricante o empacador pueden ir codificados, si así lo permite la legislación nacional.
  examples: []
