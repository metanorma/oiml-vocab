data:
  dates:
  - date: '2026-07-15T00:00:00Z'
    type: accepted
  definition:
  - content: Fluid that is put in the prepackage together with the product, either
      separated from, in or surrounding the product, and that is intended to be left
      over after use of the product, except for items naturally in the product.
  examples: []
  id: r79-2015-2-eng
  notes:
  - content: For the purpose of this Recommendation 'fluid' includes either liquid,
      semi-liquid or frozen liquids, or a gas or a mixture of gasses, whether below,
      at or above atmospheric pressure, or a combination of both.
  - content: The term "use" would include consumption.
  - content: A medium is sometimes also referred to as "liquid packing medium".
  - content: A medium can be separated from the product and other solid items that
      were put in the prepackage by measuring procedures in OIML R 87.
  - content: A medium also includes the liquid mediums as specified in 4.3.3 of the
      CODEX STAN 1-1985 Labelling of prepackaged foods which covers foods on which
      the "drained weight" must be marked, and the ice-glaze as specified in CODEX
      standards on ice-glazed foods.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Medium
