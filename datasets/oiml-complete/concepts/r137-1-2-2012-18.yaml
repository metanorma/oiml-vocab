    type: accepted
  definition:
  - content: différence entre l'erreur d'indication et l'erreur intrinsèque d'un instrument
      de mesure
  examples: []
  id: r137-1-2-2012-18-fra
  notes:
  - content: En pratique, c'est la différence entre l'erreur du compteur observée
      pendant ou après un essai, et l'erreur du compteur avant cet essai, réalisé
      aux conditions de référence.
  - content: '"instrument de mesure" doit être interprété comme "compteur de gaz"
      dans le cadre du champ de cette Recommandation.'
  sources: []
