  definition:
  - content: Manufacturer and/or authorised representative who applies for an OIML
      type evaluation of a measuring instrument to an OIML Issuing Authority in order
      to receive an OIML type evaluation report and an OIML certificate for that type
      of measuring instrument
  examples: []
  id: b18-2022-3-eng
  notes:
