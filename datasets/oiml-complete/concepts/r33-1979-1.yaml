  definition:
  - content: La valeur conventionnelle du résultat de la pesée dans l'air d'un corps
      est égale à la masse d'un étalon, de masse volumique conventionnellement choisie
      à une température conventionnellement choisie, qui équilibre ce corps à cette
      température de référence dans un air de masse volumique conventionnellement
      choisie.
