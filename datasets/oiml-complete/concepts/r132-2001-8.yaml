  definition:
  - content: Combinaison d'une source de photons ou d'électrons et des appareils associés,
      fournissant une valeur de dose absorbée ou de taux de dose absorbée, uniforme
      et reproductible, en des points précis d'un matériau spécifique. La dose absorbée
      doit être raccordable aux étalons nationaux ou internationaux.
