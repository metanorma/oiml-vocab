    type: accepted
  definition:
  - content: Processus méthodique, indépendant et documenté permettant d'obtenir des
      preuves d'audit et de les évaluer de manière objective pour déterminer dans
      quelle mesure les critères d'audit sont satisfaits.
  examples: []
  id: d27-2001-15-fra
  notes:
  - content: Les audits internes, appelés parfois "audits première partie" sont réalisés
      par, ou au nom de, l'organisme lui-même pour des raisons internes et peuvent
      constituer la base d'une autodéclaration de conformité. Les audits externes
      comprennent ce que l'on appelle généralement les "audits seconde ou tierce partie".
  sources: []
