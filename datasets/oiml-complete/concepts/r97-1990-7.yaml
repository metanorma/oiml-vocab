  definition:
  - content: |-
      5. 3.1. L'élément élastique du baromètre peut être de toute forme appropriée (par exemple un soufflet, un diaphragme ou un tube Bourdon) et peut être construit de tout matériau compatible avec les exigences de performance contenues dans la présente Recommandation.

      5. 3.2. Pour les applications soumises au contrôle métrologique, l'instrument doit être construit de telle manière que le mécanisme et, en particulier, tout dispositif d'ajustage du zéro ou de la sensibilité, ne soit pas aisément accessible à l'utilisateur.

      5. 3.3. L'échelle ou le dispositif de lecture doit donner de manière non ambiguë les valeurs de la pression dans des unités conformes aux exigences du point 6.2.

      5. 3.4. L'instrument doit incorporer un dispositif de compensation de la température, par exemple un ruban bi-métallique inclus dans le mécanisme, de telle manière que les exigences de performance du point 4.1 soient remplies au moins dans l'étendue de température pour laquelle l'instrument est destiné à être utilisé.

      5. 3.5. L'application des pressions pendant l'étalonnage et l'essai de l'instrument doit, dans toute la mesure du possible, être facilitée par des dispositions de conception appropriées.

      5. 3.6. Les instruments d'un modèle qui a été constaté comme susceptible d'être endommagé suite à l'application de pressions au-delà des valeurs extrêmes de l'étendue de mesure, doivent être munis de bouchons antisurcharge.

      5. 3.7. Les baromètres utilisant des composants électriques ou électroniques qui peuvent affecter leurs caractéristiques de mesurage doivent être conçus et construits de telle manière que les variations de la tension d'alimentation ou les interférences électromagnétiques conduites ou rayonnées n'entraînent pas d'erreur supérieure à 25 % de l'erreur maximale tolérée.

      5. 3.8. Le baromètre doit être muni d'un manuel contenant les instructions détaillées en ce qui concerne son transport, son installation, son étalonnage, son utilisation et sa maintenance.
