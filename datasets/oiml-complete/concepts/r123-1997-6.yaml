data:
  dates:
  - date: '2026-07-15T00:00:00Z'
    type: accepted
  definition:
  - content: A parameter used as a measure of the ability of a detector to distinguish
      between two adjacent energy peaks arising from elements in a sample.
  examples: []
  id: r123-1997-6-eng
  notes:
  - content: For this Recommendation, it is expressed as the full width at half maximum
      height of the manganese K-alpha line (5.9 keV) in units of energy or in percent
      as related to the energy of the peak.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Energy resolution
  language_code: eng
  entry_status: valid
