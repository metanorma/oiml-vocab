data:
  dates:
  - date: '2026-07-15T00:00:00Z'
    type: accepted
  definition:
  - content: Paramètre utilisé pour évaluer la capacité d'un détecteur à distinguer
      deux pics adjacents d'énergie produits à partir d'éléments d'un échantillon.
  examples: []
  id: r123-1997-6-fra
  notes:
  - content: Dans cette Recommandation, elle est exprimée comme la largeur totale
      à la moitié de la hauteur maximale du niveau K-alpha du manganèse (5,9 keV)
      en unités d'énergie ou en pourcentage par rapport à l'énergie du pic.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Résolution de l'énergie
  language_code: fra
  entry_status: valid
