data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: tout ce qui fait partie du préemballage et est destiné à être laissé
      après utilisation du produit, excepté pour les articles faisant naturellement
      partie du produit
  examples: []
  id: r87-2016-12-fra
  notes:
  - content: Le terme « utilisation » inclut la consommation.
  - content: Les matériaux d'emballage sont généralement utilisés pour contenir, protéger,
      manipuler (par ex. bâtonnet de sucette), distribuer, préserver (par ex. glace
      ou glazurage), transporter, fournir des informations et servir d'aide (par ex.
      plateau de service) tout en utilisant le produit qu'ils contiennent.
  - content: Les matériaux d'emballage incluent également le récipient, la glace (ne
      faisant pas naturellement partie du produit telle que le glazurage), les articles
      solides ayant été emballés avec le produit dans le préemballage, tels que papiers,
      bâtonnets de sucettes, cire protégeant le fromage et un milieu emballé avec
      le produit dans le préemballage et destiné à être laissé après utilisation du
      produit.
  - content: Les matériaux d'emballage sont parfois appelés emballage individuel,
      tare, emballage ou matériaux de conditionnement.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: matériaux d'emballage
  language_code: fra
  entry_status: valid
date_accepted: '2026-07-16T00:00:00+00:00'
