data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: Identifiable group of measuring instruments belonging to the same manufactured
      type that have the same design features and metrological principles for measurement
      but which may differ in some metrological and technical performance characteristics,
      as defined in the relevant Recommendation
  examples: []
  id: b18-2025-12-eng
  notes:
  - content: The concept of a "family" primarily aims to reduce the testing required
      for OIML type evaluation. It does not preclude the possibility of listing more
      than one family in one OIML certificate.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Family of measuring instruments
