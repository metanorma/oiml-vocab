  definition:
  - content: technique par laquelle des sons (appelés sons de Korotkoff) sont entendus
      à travers une artère comprimée lorsque la pression de compression diminue lentement,
      l'apparition des sons coïncidant avec la pression sanguine systolique et leur
      disparition avec la pression sanguine diastolique
