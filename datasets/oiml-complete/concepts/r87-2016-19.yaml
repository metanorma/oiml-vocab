data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: The factor calculated using a) the Student's t inverse cumulative distribution
      function $ ( t_{\mathrm{p}, n-1} ) $ with p as the probability equivalent to
      0.005 and (n-1) as the degrees of freedom, and b) a finite population correction
      factor $ ( N-n)/( N-1) $ with n as the sample size and N as the inspection lot
      size
  - content: "$$ SCF = \\frac {- t _ {0.005, n - 1}}{\\sqrt {\\frac {n (N - 1)}{(N
      - n)}}} $$"
  examples: []
  id: r87-2016-19-eng
  notes:
  - content: SCF always has a positive sign because $ t_{\mathrm{p}, n-1} $ has a
      negative sign for $ p=0.005. $
  - content: See Annex F, F.3 for the statistical background to SCF.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: sample correction factor (SCF)
  language_code: eng
  entry_status: valid
date_accepted: '2026-07-16T00:00:00+00:00'
