data:
  dates:
  - date: '2026-07-16T12:31:04Z'
    type: accepted
  definition:
  - content: |-
      Variants other than the EUTs can be accepted without testing, if one of the following bulleted provisions is fulfilled (for comparable metrological characteristics):

      - Their capacities, Max, fall between two tested capacities. The ratio between the tested capacities shall not exceed 10; or

      - All of the following conditions a), b), and c) are fulfilled:

      b) $ e \geq e_{\mathrm{test}} $

      $$
      \mathrm {c)} \operatorname {M a x} \leq 5 \times \operatorname {M a x} _ {\mathrm {t e s t}} \times \left(n _ {\mathrm {t e s t}} / n\right)
      $$
  examples: []
  id: r76-2006-50-fra
  notes:
  - content: "$ \\mathrm{M a x}_{\\mathrm{t e s t}}, n_{\\mathrm{t e s t}}, $ and
      $ e_{\\mathrm{t e s t}} $ are the characteristics of the EUT."
  sources: []
  terms:
