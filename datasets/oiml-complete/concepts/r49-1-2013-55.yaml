  definition:
  - content: grandeur d'influence dont une valeur se situe dans les limites spécifiées
      dans cette partie de l'OIML R 49 mais en dehors des conditions assignées de
      fonctionnement spécifiées du compteur
  examples: []
  id: r49-1-2013-55-fra
  notes:
  - content: Une grandeur d'influence est une perturbation si pour cette grandeur
      d'influence, les conditions assignées de fonctionnement ne sont pas spécifiées.
