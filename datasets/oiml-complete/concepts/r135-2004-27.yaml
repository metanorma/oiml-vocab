    type: accepted
  definition:
  - content: Difference between the indication of a measuring instrument (here a spectrophotometer)
      and a true value of the corresponding input quantity.
  examples: []
  id: r135-2004-27-eng
  notes:
  - content: Since a true value is indeterminable by nature, a conventional true value,
      i.e. an assigned value or best estimate of the value is used in practice.
  - content: For a material measure, the indication is the value assigned to it.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Error (of a measuring instrument)
