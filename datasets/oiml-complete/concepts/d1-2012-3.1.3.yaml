  definition:
  - content: opération qui, dans des conditions spécifiées, établit en une première
      étape une relation entre les valeurs d'une quantité et les incertitudes de mesure
      associées qui sont fournies par des étalons et les indications correspondantes
      avec les incertitudes associées, puis utilise en une seconde étape cette information
      pour établir une relation permettant d'obtenir un résultat de mesure à partir
      d'une indication
