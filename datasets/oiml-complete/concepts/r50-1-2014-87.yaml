    type: accepted
  definition:
  - content: fault exceeding the absolute value of the appropriate maximum permissible
      error for a load equal to the minimum totalized load, Sigma_min, for the designated
      class of the belt weigher
  examples: []
  id: r50-1-2014-87-eng
  notes:
  - content: A significant fault does not include faults arising from simultaneous
      and mutually independent causes in the belt weigher, faults implying the impossibility
      to perform any weighing, transitory faults, momentary variations in the indications
      which cannot be interpreted, memorized or transmitted as a weighing result,
      faults which are so serious that they will inevitably be noticed by all those
      interested in the weighing result.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: significant fault
