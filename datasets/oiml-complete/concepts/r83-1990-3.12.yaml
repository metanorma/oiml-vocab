data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: 'The ratio R = m/delta(m) interpreted by either one of the following
      definitions: m is the mass of a component comprising the first peak of a doublet,
      and delta(m) is the difference in mass of the two peaks. The doublet shall be
      separated by a valley, the value of which shall not exceed 10 % of the value
      of the highest peak; or m is the mass of a component within a peak and delta(m)
      is the width of the peak at one-half its height.'
  examples: []
  id: r83-1990-e-3.12-eng
  notes:
  - content: Unit resolution usually means R = 2|m|, where |m| is the numerical value
      when m is expressed in unified atomic mass units.
