    type: accepted
  definition:
  - content: Dispositif électronique d'un instrument qui effectue la conversion analogique-numérique
      du signal de sortie de la cellule de pesée, ensuite traite les données, et fournit
      le résultat du pesage sous forme numérique à travers une interface numérique
      sans l'afficher. Il peut en option avoir une ou deux touches (ou souris, écran
      tactile, etc.) pour commander l'instrument.
