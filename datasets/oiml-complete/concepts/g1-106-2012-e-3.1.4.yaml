data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: probability distribution of a continuous random variable X having the
      probability density function $g _ {X} (\xi) = \frac {1}{\sigma \sqrt {2 \pi}}
      \exp \left[ - \frac {1}{2} \left(\frac {\xi - \mu}{\sigma}\right) ^ {2} \right],$
      for $ -\infty <\xi <+\infty $
  examples: []
  id: g1-106-2012-e-3.1.4-eng
  notes:
  - content: "$ \\mu $ is the expectation (see 3.1.5) and $ \\sigma $ is the standard
      deviation (see 3.1.7) of X."
  - content: The normal distribution is also known as a Gaussian distribution.
