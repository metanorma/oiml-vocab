    type: accepted
  definition:
  - content: identifiable part of a measuring instrument or of a family of measuring
      instruments that performs a specific function or functions, and that can be
      separately evaluated according to the prescribed metrological and technical
      performance requirements in the relevant Recommendation
  examples: []
  id: r150-1-2020-24-eng
  notes:
  - content: The modules of a weighing instrument may be subject to specified partial
      error limits.
  - content: Modules may be examined separately (subject to agreement with the metrological
      authority (see 6.2.6).
  - content: 'Typical modules of an automatic weighing instrument are: load cell (force
      receptor), indicator, analogue or digital processors, weighing module, remote
      display, software.'
  sources: []
