  definition:
  - content: Dispositif qui reçoit le signal de sortie du ou des transducteurs, le
      vérifie et le traite et, si approprié, mémorise les résultats jusqu'à leur utilisation.
      De plus, le calculateur peut être capable d'assurer les liaisons réciproques
      avec les organes périphériques.
