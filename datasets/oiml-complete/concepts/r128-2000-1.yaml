  definition:
  - content: Les ergomètres à pédalier sont des appareils équipés d'un système à pédales,
      d'un dispositif de freinage et d'un dispositif indicateur. Ils sont utilisés
      pour mesurer l'effort physique défini et reproductible exercé par des sujets
      (patients).
