    type: accepted
  definition:
  - content: |-
      As far as applicable the same tests shall be performed as for complete instruments. The applicable tests for indicators and analog data processing devices are given in Annex C, the applicable tests for digital data processing devices, terminals and digital displays are given in Annex D, and the applicable tests for weighing modules are given in Annex E.

      Purely digital modules need not be tested for static temperatures (B.2.1), humidity (B.2.2), and for span stability (B.4). They need not be tested for disturbances (B.3) if conformity to the relevant IEC Standards is otherwise established to at least the same level as required in this Recommendation.

      For software-controlled modules the additional requirements in 5.5 and Annex G apply.
