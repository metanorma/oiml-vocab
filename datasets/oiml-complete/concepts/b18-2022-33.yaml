  definition:
  - content: Assessment of a body against specified requirements by representatives
      of other bodies in, or candidates for, an agreement group
  examples: []
  id: b18-2022-33-eng
  notes:
  - content: 'Note 1: Within the context of the OIML-CS implementation, this is the
      procedure by which approved experts assess, against specified requirements,
      on site, the competence of OIML Issuing Authorities and Test Laboratories to
      be registered in the Declaration.'
  - content: 'Note 2: In the OIML-CS, peer assessment is equivalent to accreditation
      (see 3.1).'
