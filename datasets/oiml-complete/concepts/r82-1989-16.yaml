data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: 'The output signal per unit mass of the sample component of interest
      in the carrier gas; it is expressed in either one of the two following ways:'
  - content: With a concentration-dependent detector, it is expressed in A·mL/g, or
      V·mL/g, and by the equation S = (P × F)/M, where P is the integrated peak area,
      F is the carrier gas flow rate, and M is the mass of the sample in the carrier
      gas.
  - content: With a mass-flow-rate-dependent detector, it is expressed in A·s/g, or
      V·s/g, and by the equation S = P/M, where the symbols have the same definitions
      as in point 3.14.1.
  examples: []
  id: r82-1989-16-eng
  notes:
  - content: Figure 1 illustrates graphically the concepts of detection limit and
      linear range for a given range of sensitivity.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Sensitivity of the gas chromatograph
  language_code: eng
  entry_status: valid
