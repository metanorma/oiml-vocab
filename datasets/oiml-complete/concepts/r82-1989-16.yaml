data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: 'Signal de sortie pour une masse des composants intéressants de l''échantillon
      dans le gaz porteur égale à l''unité ; elle s''exprime selon l''une des deux
      manières suivantes :'
  - content: Pour un détecteur sensible à la concentration, elle s'exprime en A·mL/g
      ou en V·mL/g par l'équation S = (P × F)/M, où P est la surface du pic, F est
      le débit du gaz porteur, et M est la masse de l'échantillon dans le gaz porteur.
  - content: Pour un détecteur sensible au débit massique, elle s'exprime en A·s/g
      ou V·s/g par l'équation S = P/M, où les symboles ont la même définition qu'au
      point 3.14.1.
  examples: []
  id: r82-1989-16-fra
  notes:
  - content: La Figure 1 illustre graphiquement le concept de limite de détection
      et d'étendue linéaire pour une certaine étendue de la sensibilité.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Sensibilité d'un chromatographe
  language_code: fra
  entry_status: valid
