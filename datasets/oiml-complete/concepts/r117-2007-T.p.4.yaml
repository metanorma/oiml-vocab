  definition:
  - content: Ensemble de mesurage installé en général sur une tuyauterie fixe reliant
      deux réservoirs fixes ou plus.
  examples: []
  id: r117-2007-f-T.p.4-fra
  notes:
  - content: Cette tuyauterie est caractérisée par un débit de liquide à mesurer qui,
