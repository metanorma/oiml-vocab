data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: Instrument de pesage non automatique monté ou incorporé dans un véhicule.
  examples:
  - content: Balance postale montée sur un véhicule (bureau de poste mobile).
  - content: Pèse-déchets, pèse-malades, pèse-palettes, transpalette-peseurs, fauteuil
      roulant peseurs.
  id: r76-1-2006-13-fra
  notes:
  - content: Un instrument monté sur un véhicule est un instrument de pesage complet
      fixé solidement sur un véhicule, et qui est destiné à cet usage particulier.
  - content: Un instrument incorporé dans un véhicule utilisant des éléments du véhicule
      pour l'instrument de pesage.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: instrument mobile
  language_code: fra
  entry_status: valid
