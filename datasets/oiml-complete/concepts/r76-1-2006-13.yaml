data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: Non-automatic weighing instrument mounted on or incorporated into a vehicle.
  examples:
  - content: Postal scale mounted on a vehicle (mobile post office).
  id: r76-1-2006-13-eng
  notes:
  - content: A vehicle-mounted instrument is a complete weighing instrument which
      is firmly mounted on a vehicle, and which is designed for that special purpose.
  - content: 'A vehicle-incorporated instrument uses parts of the vehicle for the
      weighing instrument. Examples: Garbage weighers, patient lifters, pallet lifters,
      fork lifters, wheel chair weighers.'
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: mobile instrument
  language_code: eng
  entry_status: valid
