    type: accepted
  definition:
  - content: La etiqueta de un preempacado no debe contener ninguna información ni
      declaración ambigua que tenga probabilidad de conducir a engaño a un comprador.
      Esto incluye las expresiones ambiguas prohibidas en el Anexo A, literal A.1.3.
