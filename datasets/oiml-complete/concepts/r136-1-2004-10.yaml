    type: accepted
  definition:
  - content: 'Anmerkung: In dieser Empfehlung wird der Begriff "Gerät" für jedes Mittel
      verwendet, mit dem eine bestimmte Funktion ausgeführt wird (unabhängig von der
      physischen Realisierung), z. B. durch einen Mechanismus oder eine Taste, die
      einen Vorgang auslöst; das Gerät kann ein kleiner Teil oder ein großer Teil
      eines Messgeräts sein.'
