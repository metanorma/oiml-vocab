    type: accepted
  definition:
  - content: manquant supérieur au manquant toléré applicable (T) (voir 2.1.17), mais
      pas supérieure à deux fois le manquant toléré applicable (2T) pour la quantité
      nominale donnée
  - content: 'erreur T1: $ (Q_{\mathrm{nom}}-2 T)\leq Q_{\mathrm{i}}<( Q_{\mathrm{nom}}-T)
      $ avec $ Q_{\mathrm{nom}} $ comme quantité nominale'
  examples: []
