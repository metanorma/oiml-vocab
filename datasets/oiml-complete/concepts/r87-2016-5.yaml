    type: accepted
  definition:
  - content: deficiency that is greater than the applicable tolerable deficiency (T)
      (see 2.1.17) but not greater than twice the applicable tolerable deficiency
      (2T) for the given nominal quantity
  - content: 'T1 error: $ (Q_{\mathrm{nom}} - 2T) \leq Q_{\mathrm{i}} < (Q_{\mathrm{nom}}
      - T) $ where $ Q_{\mathrm{nom}} $ is the nominal quantity'
  examples: []
  id: r87-2016-5-eng
  notes:
  - content: See Annex G for an example of the application of errors.
  sources: []
