  definition:
  - content: The purpose of this chapter is to provide references to model regulations
      promulgated by NCWM regarding commercial weighing, tolerances, and other technical
      requirements and to the recognized practices of the petroleum industry when
      products are handled on a weight basis. Chapter 16 is in preparation.
