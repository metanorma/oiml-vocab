data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: rapport délivré par un laboratoire d'essai, qui contient les résultats
      des essais et examens qu'il a effectués sur la base de la Recommandation OIML
      applicable pendant l'évaluation de type OIML menée sur un ou plusieurs échantillon(s)
      identifié(s) d'un type donné d'instrument de mesure ou de module
  examples: []
  id: b18-2017-28-fra
  notes:
  - content: Sauf disposition contraire de la Recommandation OIML, plusieurs rapports
      d'essai peuvent être délivrés dans le cas où plusieurs laboratoires d'essai
      sont impliqués dans la réalisation de tous les essais et examens spécifiés dans
      la Recommandation OIML applicable.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Rapport d'essai OIML
  language_code: fra
  entry_status: valid
