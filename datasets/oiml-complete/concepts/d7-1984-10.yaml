data:
  dates:
  - date: '2026-07-15T00:00:00Z'
    type: accepted
  definition:
  - Terme général utilisé pour décrire différents dispositifs ayant les fonctions suivantes: dispositif
      anti-giratoire, dispositif inséré dans une conduite afin d'éliminer ou de réduire
      les composantes circonférentielles de la vitesse qui produisent une rotation
      de l'écoulement; régulateur de profil, dispositif inséré dans une conduite afin
      de réduire la longueur droite nécessaire à l'obtention d'une répartition régulière
      des vitesses.
  examples: []
  id: d7-1984-10-fra
  notes:
  - content: Il n'y a pas toujours distinction nette entre ces deux types de tranquilliseurs,
      et certains dispositifs peuvent jouer plus ou moins les deux rôles.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Tranquilliseur
  language_code: fra
  entry_status: valid
