  definition:
  - content: dispositif connecté à ou incorporé au compteur pour la correction automatique
      du volume de l'eau aux conditions de mesure, en tenant compte du débit et/ou
      des caractéristiques de l'eau à mesurer et des courbes d'étalonnage pré-établies
  examples: []
  id: r49-2013-6-fra
  notes:
  - content: les caractéristiques de l'eau, par exemple la température et la pression,
      peuvent être mesurées soit en utilisant des instruments de mesure associés,
      soit stockées dans la mémoire du compteur.
  sources: []
