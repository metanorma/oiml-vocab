data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: 'A digital display can be realized as a primary display or as a secondary
      display:'
  - content: 'a) Primary display: Either incorporated in the indicator housing or
      in the terminal housing or realized as a display in a separate housing (i.e.
      terminal without keys), e.g. for use in combination with a weighing module.'
  - content: 'b) Secondary display: Additional peripheral device (optional) which
      repeats the weighing result and any other primary indication, or provides further,
      non-metrological information.'
  examples: []
  id: r76-1-2006-28-eng
  notes:
  - content: The terms "primary display" and "secondary display" should not be confused
      with the terms "primary indication" and "secondary indication" (T.1.3.1 and
      T.1.3.2)
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: digital display
  language_code: eng
  entry_status: valid
