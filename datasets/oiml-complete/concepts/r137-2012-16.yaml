  definition:
  - content: Erreur moyenne pondérée telle que définie par la formule EMP = Σ(kᵢ·Eᵢ)/Σkᵢ,
      avec kᵢ = Qᵢ/Q_max pour Qᵢ ≤ 0,7·Q_max et kᵢ = 1,4 − Qᵢ/Q_max pour 0,7·Q_max
      < Qᵢ ≤ Q_max.
