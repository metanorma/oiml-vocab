data:
  dates:
  - date: '2026-07-15T00:00:00Z'
    type: accepted
  definition:
  - content: Concentration d'un élément qui permet d'obtenir un signal de sortie équivalent
      à trois fois l'écart-type de la moyenne du signal de sortie pour une solution
      blanche. C'est la quantité minimale mesurée avant de pouvoir conclure qu'un
      élément a été détecté.
  examples: []
  id: r116-1995-11-fra
  notes:
  - content: Ce terme, dans la présente Recommandation, se rapporte à la détermination
      d'un élément dans une solution de référence sans éléments interférents. On établit
      le bruit de fond en mesurant le signal de sortie de plusieurs parties aliquotes
      de la solution blanche.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Limite de détection
  language_code: fra
  entry_status: valid
