    type: accepted
  definition:
  - content: partie de l'instrument destinée à recevoir la charge
  examples: []
  id: r106-1-2011-19-fra
  notes:
  - content: Le récepteur de charge peut porter simultanément toutes les roues d'un
      essieu, d'un bogie ou d'un wagon unique.
  - content: Il est possible de disposer en série deux ou plusieurs récepteurs de
      charge pour ne constituer qu'un récepteur de charge unique en vue du pesage
      de wagon entier ou d'un pesage partiel (voir 0.3.1.2).
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: récepteur de charge
