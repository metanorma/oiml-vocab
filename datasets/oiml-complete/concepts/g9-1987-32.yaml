  definition:
  - content: |-
      The Institute currently maintains a comprehensive API Manual of Petroleum Measurement Standards. This manual is an ongoing project, as new chapters and revisions of old chapters will be released periodically. The following list includes all current chapters of the manual and other API measurement standards that have not yet been released as chapters of the new manual.

      Manual of Petroleum Measurement Standards (Complete Set) The complete set, with the exception of Chapters 11 and 16, is available by ordering "one complete set, MPMS." Since the price of the complete set is subject to change as new chapters and sub-chapters are released, an order for one complete set would include the chapters and publications listed below (excluding Chapters 11 and 16), new chapters released after the release date of this catalog, and the binders to house the set.
