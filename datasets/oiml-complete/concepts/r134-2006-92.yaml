  definition:
  - Véhicules ayant une valeur conventionnellement vraie connue de: masse, et charge
      par essieu simple pour un véhicule rigide à deux essieux ; et masse pour les
      autres véhicules utilisés pour les essais en mouvement, déterminée sur un instrument
      de contrôle.
