  definition:
  - content: |-
      Std 2541, Standard Tables for Positive Displacement Meter Prover Tanks, 1966 (ANSI/ASTM D 1750)

      These tables provide multipliers for converting to 60°F the volumes of petroleum and petroleum products measured at temperatures between 0° and 125°F in insulated mild steel prover tanks for positive displacement meters. 4 pages.

      Price each, $2.50
