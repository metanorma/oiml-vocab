data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: Défaut supérieur à e.
  - content: 'Les défauts suivants ne sont pas considérés comme significatifs:'
  - content: défauts provenant de causes simultanées et mutuellement indépendantes
      dans l'instrument ou dans son système de contrôle, ou
  - content: défauts rendant impossible l'accomplissement de toute mesure, ou
  - content: défauts si importants qu'ils ne peuvent manquer d'être remarqués par
      tous ceux qui sont intéressés au résultat du mesurage, ou
  - content: défauts transitoires consistant en des variations momentanées des indications
      qui ne peuvent être interprétées, mises en mémoire ou transmises en tant que
      résultats de mesure.
  examples: []
