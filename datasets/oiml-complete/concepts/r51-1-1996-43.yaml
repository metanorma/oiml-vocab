    type: accepted
  definition:
  - content: A fault greater than e.
  - content: 'A significant fault does not include:'
  - content: faults arising from simultaneous and mutually independent causes in the
      instrument or in its checking facility, or
  - content: faults that imply it is impossible to perform a measurement, or
  - content: faults that are so serious they will inevitably be noticed by all those
      interested in the measurement, or
  - content: transitory faults that are momentary variations in the indications that
      cannot be interpreted, memorized or transmitted as a measurement result.
