  - content: |-
      Chapter 9.2, Pressure Hydrometer Test Method for Density or Relative Density, First Edition, April 1982

      This chapter provides a guide for determining the density or relative density (specific gravity) or API gravity of light hydrocarbons, including liquefied petroleum gases, using a pressure hydrometer. 4 pages.

      Price each, $3.00
