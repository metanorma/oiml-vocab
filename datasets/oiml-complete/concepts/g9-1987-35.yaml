  - content: This chapter covers the standardized procedures necessary for calibrating
      closed storage vessels larger than a drum, and the procedures recommended for
      computing the volumes contained therein. Chapter 2 is in preparation. The following
      API standards now cover the subject of tank calibration and are included in
      the manual.
