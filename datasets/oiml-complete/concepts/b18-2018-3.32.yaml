    type: accepted
  definition:
  - content: assessment of a body against specified requirements by representatives
      of other bodies in, or candidates for, an agreement group
  examples: []
  id: b18-2018-e-3.32-eng
  notes:
  - content: Within the context of the OIML-CS implementation, this is the procedure
      by which approved experts assess, against specified requirements, on site, the
      competence of OIML Issuing Authorities and Test Laboratories to be registered
      in the Declaration.
  - content: In the OIML-CS, peer assessment is equivalent to accreditation (see 3.1).
