  definition:
  - content: |-
      7. 3.1. Les baromètres à élément récepteur élastique doivent être marqués clairement et de manière indélébile pour indiquer la position de fonctionnement (position par rapport à la verticale) et l'étendue de pression.

      7. 3.2. Si une correction de température est nécessaire, cela doit être indiqué à un endroit bien visible.
