data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: The difference between the error of indication and the intrinsic error
      of a weighing instrument.
  examples: []
  id: r107-1-1997-e-T.4.2.4-eng
  notes:
  - content: Principally, a fault is the result of an undesired change of data contained
      in or flowing through an electronic instrument.
  - content: From the definition it follows that in this Recommendation a "fault"
      is a numerical value.
