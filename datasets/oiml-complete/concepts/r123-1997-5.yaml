data:
  dates:
  - date: '2026-07-15T00:00:00Z'
    type: accepted
  definition:
  - content: Étroitesse de l'accord entre les résultats des mesurages successifs du
      même échantillon par le même instrument, dans des conditions d'utilisation définies
      identiques et dans un intervalle de temps relativement court.
  examples: []
  id: r123-1997-5-fra
  notes:
  - Les conditions définies identiques devraient inclure: la méthode de mesurage,
      l'instrument de mesure, l'opérateur, le lieu et les conditions environnementales
      ambiantes.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Fidélité
  language_code: fra
  entry_status: valid
