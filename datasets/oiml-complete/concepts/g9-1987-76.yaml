  - content: |-
      Chapter 11.2.3, Water Calibration of Volumetric Provers, First Edition 1984

      This chapter contains volume correction factors in standard units relate to prover temperature, and the difference in temperature between th prover and a certified test measure. 115 pages.

      Price each $12.0

      852-27315

      Chapter 11.2.3M, Water Calibration of Volumetric Provers, First Edition 1984

      This chapter contains volume correction factors in metric (SI) units related to prover temperature, and the difference in temperature between the prover and a certified test measure. 167 pages.

      Price each, $16.01

      Computer Tape and Documentation of Chapters 11.2.1 and 11.2.1M, Compressibility Factors of Hydrocarbons, and Chapters 11.2.3 and 11.2.3M Water Calibration of Volumetric Provers, First Edition, 1984

      This package includes a magnetic tape of tables found in Chapters 11.2.1, 11.2.1M, 11.2.3 and 11.2.3M, along with a computer documentation manual containing text information from those chapters. The tables, presented in both standard and metric (SI) units, cover compressibility factors for hydrocarbons and water calibration of volumetric provers. The tape is 9-track, 1600 bpi, unlabeled, 4-file type, and is available in either ASCII or EBCDIC format. Format desired must be specified when ordering.
