data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: Le niveau d'étendue du débitmètre est le rapport des valeurs maximale
      et minimale de débit ou le nombre de Reynolds définissant l'étendue dans laquelle
      le compteur est linéaire selon la définition donnée en 2.3.
  - content: Sous certaines conditions, le compteur est ou peut être rendu utilisable
      en dehors de l'étendue linéaire.
  - content: Lorsque le nombre de Reynolds diminue en dessous de la limite de linéarité,
      le détachement et la détection peuvent devenir de plus en plus difficiles et
      le détachement peut même cesser.
