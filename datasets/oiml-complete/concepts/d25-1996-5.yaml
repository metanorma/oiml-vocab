data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: Flowmeter rangeability is the ratio of the maximum to minimum flowrate
      or Reynolds number in the range over which the meter is linear as defined in
      2.3.
  - content: Under certain conditions the meter is, or can be made, usable outside
      the linear range.
  - content: As the Reynolds number decreases below the linear limit, the shedding
      and detection can become increasingly difficult and eventually the shedding
      can cease.
