data:
  dates:
  - date: '2026-07-15T00:00:00Z'
    type: accepted
  definition:
  - content: Concentration d'un élément fournissant un signal de sortie équivalent
      à trois fois l'écart type du fond de rayonnement. Il s'agit de la quantité minimale
      détectable d'un élément.
  examples: []
  id: r123-1997-2-fra
  notes:
  - content: Lorsqu'appliquée dans une méthode de mesurage ou pour une analyse, la
      limite de quantification de l'instrument constitue un paramètre important. Elle
      est définie comme étant une valeur égale à 10 fois l'écart type du fond de rayonnement
      et devrait aussi inclure les variations associées à l'échantillonnage et à l'analyse.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Limite de détection
  language_code: fra
  entry_status: valid
