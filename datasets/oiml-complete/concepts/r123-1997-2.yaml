data:
  dates:
  - date: '2026-07-15T00:00:00Z'
    type: accepted
  definition:
  - content: Concentration of an element which provides an output signal equivalent
      to three times the standard deviation of the background. It is the minimum quantity
      of an element that can be detected.
  examples: []
  id: r123-1997-2-eng
  notes:
  - content: For this Recommendation, it may be derived from the statistical variation
      in the background using the equation D = 3(B/t)^(1/2)/S.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Detection limit
  language_code: eng
  entry_status: valid
