data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Concentration d'un element qui donne un signal egal a trois fois l'ecart-type
      du bruit de fond, tel qu'il a ete determine sur une base statistique. C'est
      la quantite minimale mesuree pour que l'on puisse conclure qu'un element a effectivement
      ete detecte.
  examples: []
  id: r100-1991-f-3.6-fra
  notes:
  - content: Dans la presente Recommandation, ce terme est relatif a la determination
      d'un element dans une solution de reference sans interferents (perturbations).
      On etablit le bruit de fond en mesurant le signal de sortie pour plusieurs portions
      d'une solution d'essai a blanc.
