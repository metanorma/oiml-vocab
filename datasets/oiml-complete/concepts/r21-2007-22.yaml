  definition:
  - content: Dodatkowa kwota pienina za uslug dodatkow, wprowadzona na polecenieczne,
      odpowiednio zidentyfikowana, wskazana i wyietlona oddzielnie od opłaty za przejazd
      w pozycji oboczych „Zajta” oraz „Zatrzymana” (do zapłaty), z mbością tymczasowego
      dodania do opłaty za przejazd świętlenia calkowitej wartści opłaty wraz z opłatdatkow
      na koniec przejazdu.
