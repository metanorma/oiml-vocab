  definition:
  - content: groupe de cellules de pesée qui, pour les besoins de l'évaluation de
      type, sont considérées comme une famille et qui sont fabriquées dans le même
      matériau, présentent la même conception de la technique de mesure, utilisent
      le même principe de fixation de la jauge de contrainte, sont construites selon
      le même procédé, ont le même ensemble de spécifications
