    type: accepted
  definition:
  - content: Document that is signed by an individual OIML Issuing Authority, Utilizer
      or Associate, whereby it accepts to abide by the rules of the OIML-CS
  examples: []
  id: b18-2025-10-eng
  notes:
  - content: 'Note 1: The scope of certification is detailed in the individual Declaration
      for each OIML Issuing Authority, and the scope of acceptance of OIML type evaluation
      reports issued with an OIML certificate under Scheme A or B is detailed in the
      individual Declaration for each Utilizer and Associate.'
  - content: 'Note 2: Each OIML Issuing Authority, Utilizer and Associate signs an
      individual Declaration under the OIML-CS.'
  sources: []
