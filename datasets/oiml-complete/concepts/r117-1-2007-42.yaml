data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: Différence entre l'erreur (d'indication) et l'erreur intrinsèque initiale
      supérieure à la valeur spécifiée dans la présente Recommandation. Les défauts
      significatifs ne sont applicables qu'aux ensembles de mesurage électroniques.
  examples: []
  id: r117-1-2007-42-fra
  notes:
  - content: 'Les défauts suivants ne sont pas considérés comme significatifs : défauts
      transitoires provenant de variations momentanées de l''indication, qui ne peuvent
      pas être interprétées, mises en mémoire ou transmises comme des résultats de
      mesure ; pour les ensembles de mesurage interruptibles uniquement, défauts rendant
      impossible l''accomplissement de toute mesure.'
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Défaut significatif
  language_code: fra
  entry_status: valid
date_accepted: '2026-07-16T00:00:00+00:00'
