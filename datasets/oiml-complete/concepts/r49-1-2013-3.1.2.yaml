data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: partie du compteur comprenant le capteur, qui transforme le debit ou
      le volume d'eau a mesurer en signaux qui sont transmis au calculateur
  examples: []
  id: r49-1-2013-fra-3.1.2-fra
  notes:
  - content: Le transducteur de mesure peut fonctionner de maniere autonome ou en
      utilisant une source d'alimentation externe et peut etre base sur un principe
      mecanique, electrique ou electronique.
  - content: Pour un compteur d'eau, le capteur peut etre un disque, un piston, une
      roue, les elements d'une turbine, les electrodes d'un compteur electromagnetique,
      ou un autre element. Ces elements detectent le debit ou le volume d'eau passant
      au travers du compteur que l'on appelle capteur de debit ou de volume.
  sources:
  - origin:
      ref:
        source: OIML R 49-1:2013
        version: '2013'
