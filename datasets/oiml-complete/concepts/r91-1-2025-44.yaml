data:
  dates:
  - date: '2026-07-15T00:00:00Z'
    type: accepted
  definition:
  - content: speed meter with compensation for cosine error using either a measured
      value of the measurement angle, a configured value of the expected measurement
      angle or a combination of the two
  examples: []
  id: r91-1-2025-44-eng
  notes:
  - content: A variation of measurement angle can lead to negative or positive residual
      cosine errors for this class of speed meters.
  - content: A speed meter that is installed above the road and compensates for cosine
      error is also referred to as across-the-road speed meter, for simplicity.
  - content: Typical examples are most Doppler-radar based speed meters, 2D and 3D
      laser scanners and image-based speed meters.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: across-the-road speed meter
  language_code: eng
  entry_status: valid
