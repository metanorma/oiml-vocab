data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: fluide introduit dans le préemballage avec le produit, soit séparé de,
      dans ou autour du produit et destiné à être laissé après utilisation du produit,
      excepté pour les éléments faisant naturellement partie du produit
  examples: []
  id: r87-2016-9-fra
  notes:
  - content: Dans le cadre de la présente Recommandation, un fluide inclut soit a)
      un liquide, un semi-liquide ou liquide congelé ou b) un gaz ou un mélange de
      gaz, sous pression positive, négative ou atmosphérique ou c) une combinaison
      de a) et b).
  - content: Le terme « utilisation » comprend la consommation.
  - content: Un milieu est parfois appelé « milieu d'emballage liquide ».
  - content: Un milieu peut être séparé du produit et d'autres éléments solides ayant
      été mis dans le préemballage par les procédures de mesure dans l'annexe C et
      l'annexe D.
  - content: Un milieu contient également a) les milieux liquides spécifiés dans la
      clause 4.3.3 du CODEX STAN 1-1985 « Étiquetage des aliments préemballés » qui
      couvre les aliments sur lesquels la masse égouttée doit être marquée, et b)
      le glazurage tel que spécifié dans les normes CODEX relatives aux aliments glacés.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: milieu
  language_code: fra
  entry_status: valid
