data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: fluid that is put in the prepackage together with the product, either
      separated from, in or surrounding the product, and that is intended to be left
      over after use of the product, except for items naturally in the product
  examples: []
  id: r87-2016-9-eng
  notes:
  - content: For the purpose of this Recommendation a fluid includes either a) a liquid,
      semi-liquid or frozen liquids, or b) a gas or a mixture of gasses, whether under
      positive, negative or atmospheric pressure or c) a combination of both a) and
      b).
  - content: The term "use" includes consumption.
  - content: A medium is sometimes also referred to as a "liquid packing medium".
  - content: A medium can be separated from the product and other solid items that
      were put in the prepackage by measuring procedures in Annex C and Annex D.
  - content: A medium also includes a) the liquid mediums as specified in Clause 4.3.3
      of the CODEX STAN 1-1985 "Labelling of prepackaged foods" which covers foods
      on which the drained mass must be marked, and b) the ice-glaze as specified
      in CODEX standards on ice-glazed foods.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: medium
  language_code: eng
  entry_status: valid
