data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: 'Le nombre de Reynolds de la canalisation est un nombre sans dimension,
      rapport d''une force d''inertie à une force de viscosité, utilisé comme paramètre
      de corrélation combinant les effets de la viscosité, de la masse volumique,
      et de la vitesse dans la canalisation. Il est défini par: Re = D × (U/ν) = D
      × U × (ρ/μ).'
  - content: 'Où: D est le diamètre d''entrée du compteur, U est la vitesse moyenne
      du fluide dans le compteur, ν est la viscosité cinématique, ρ est la masse volumique
      du fluide, et μ est la viscosité absolue (dynamique).'
  examples: []
  id: d25-2010-6-fra
  notes: []
  sources: []
