data:
  dates:
  - date: '2026-07-15T00:00:00Z'
    type: accepted
  definition:
  - content: Concordance entre les résultats de mesurages consécutifs de la même grandeur
      de mesure effectués dans les mêmes conditions et dans une période de temps relativement
      courte.
  examples: []
  id: r112-1994-15-fra
  notes:
  - Il convient de comprendre le terme «les mêmes conditions» comme incluant: la méthode
      de mesurage, l'opérateur, l'instrument de mesure, le lieu et les conditions
      d'environnement.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Répétabilité
  language_code: fra
  entry_status: valid
