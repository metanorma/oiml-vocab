data:
  dates:
  - date: '2026-07-15T00:00:00Z'
    type: accepted
  definition:
  - content: partie du compteur comprenant le capteur, qui transforme le débit ou
      le volume d'eau à mesurer en signaux qui sont transmis au calculateur
  examples: []
  id: r49-2013-2-fra
  notes:
  - content: le transducteur de mesure peut fonctionner de manière autonome ou en
      utilisant une source d'alimentation externe et peut être basé sur un principe
      mécanique, électrique ou électronique.
  - content: pour un compteur d'eau, le capteur peut être un disque, un piston, une
      roue, les éléments d'une turbine, les électrodes d'un compteur électromagnétique,
      ou un autre élément.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: transducteur de mesure
