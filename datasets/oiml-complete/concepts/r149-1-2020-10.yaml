data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: method that estimates systolic, diastolic and mean arterial pressures
      during the slow inflation or deflation of an occluding cuff at the brachial
      artery
  examples: []
  id: r149-1-2020-10-eng
  notes:
  - content: During the inflation and deflation of the cuff, small pressure changes
      (oscillations) occur in the cuff as a result of the arterial blood pressure
      pulses. These oscillations are detected and stored together with the corresponding
      cuff pressure values in the measurement system. With these stored values the
      systolic, diastolic and mean arterial blood pressure values can be mathematically
      derived using an appropriate algorithm.
  sources:
