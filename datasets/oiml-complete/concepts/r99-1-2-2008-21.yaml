data:
  dates:
  - date: '2026-07-15T00:00:00Z'
    type: accepted
  definition:
  - content: fault which has a magnitude greater than the magnitude of the maximum
      permissible error on initial verification
  examples: []
  id: r99-1-2-2008-21-eng
  notes:
  - content: 'The following faults are considered to be not significant: (a) Fault
      arising from simultaneous and mutually independent causes in the instrument
      itself or in its checking facilities; (b) Faults implying the impossibility
      to perform any measurement; (c) Transitory faults being momentary variations
      in the indication, which cannot be interpreted, recorded or transmitted as a
      measurement result; and (d) Faults giving rise to variations in the measurement
      results that are so large as to be noticed by all those interested in the measurement
      result.'
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: significant fault
  language_code: eng
  entry_status: valid
