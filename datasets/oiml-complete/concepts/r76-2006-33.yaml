    type: accepted
  definition:
  - content: |-
      The indication at zero or near zero shall not vary by more than one verification scale interval for a difference in ambient temperature of 1 $ ^{\circ} \mathrm{C} $ for instruments of class I and $ 5^{\circ} \mathrm{C} $ for other classes.

      For multi-interval instruments and for multiple range instruments this applies to the smallest verification scale interval of the instrument.
