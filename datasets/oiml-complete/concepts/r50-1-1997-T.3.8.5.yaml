  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: 'Dispositif permettant de contrôler certaines fonctions de la peseuse
      sur bande et destiné en particulier: à simuler l''effet d''une charge linéique
      constante au moyen d''un poids, d''une chaîne ou d''un signal électrique de
      référence, ou à comparer deux intégrations d''une charge linéique dans le même
      intervalle de temps, ou à signaler le dépassement de la portée maximale, ou
      à signaler que le débit est soit au-dessus de sa valeur maximale soit au-dessous
      de sa valeur minimale, ou à attirer l''attention de l''utilisateur sur un défaut
      de fonctionnement de la peseuse sur bande.'
