  definition:
  - content: 'Interface empêchant l''introduction de toute donnée dans le dispositif
      de traitement de données de l''instrument, introduction qui peut :'
  - content: "- afficher des données non clairement définies et qui pourraient être
      considérées comme étant un résultat de mesure ;"
  - content: "- falsifier des résultats de mesure traités ou stockés ou des indications
      primaires ;"
  - content: "- régler l'instrument ou changer tout facteur de réglage."
