    type: accepted
  definition:
  - content: 'Interface that prevents the introduction of any data into the data processing
      device of the instrument which may:'
  - content: "- display data that are not clearly defined and that could be taken
      as being a measurement result;"
  - content: "- falsify displayed, processed or stored measurement results or primary
      indications;"
  - content: "- adjust the instrument or change any adjustment factor."
  examples: []
