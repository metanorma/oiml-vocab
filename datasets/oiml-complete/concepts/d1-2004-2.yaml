  id: d1-2004-2-fra
  notes:
  - content: Dans le présent Document, le terme « instrument de mesure » couvre les
      instruments de mesure au sens du VIM (voir 4.1), aussi bien que les systèmes
      de mesure (VIM, 4.5), les mesures matérialisées (VIM, 4.2) et toute partie d'un
      instrument de mesure ou système de mesure pouvant faire l'objet d'exigences
      spécifiques et d'une évaluation spécifique de la conformité.
