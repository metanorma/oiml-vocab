  definition:
  - content: Étendue des débits, délimitée par le débit minimal et le débit maximal,
      dans laquelle les indications du compteur d'eau chaude, obtenues dans les conditions
      usuelles d'emploi, ne sont pas entachées d'une erreur supérieure aux erreurs
      maximales tolérées.
