data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Test Laboratory of a manufacturer that is designated by an OIML Issuing
      Authority, and registered in the Declaration, that performs specific tests under
      controlled supervision (see clause 7 of PD-04) or as a third-party laboratory
      of an OIML Issuing Authority
  examples: []
  id: b18-2018-e-3.19-eng
  notes:
  - content: An MTL may conduct tests for the parent company and/or for other companies.
      The requirements for controlled supervision apply if tests are performed for
      the parent company. Otherwise the MTL is considered as a third-party Test Laboratory,
      in which case the requirements for third-party laboratories must be satisfied.
  - content: In the event that test data is obtained from an MTL this must be clearly
      indicated on the OIML type evaluation report (see 5.5.4 of PD-05) and acceptance
      of that report is on a voluntary basis (see 4.9 of PD-06).
