    type: accepted
  definition:
  - content: |-
      Le rapport d'étalonnage d'un instrument doit comprendre les indications suivantes:

      i) nom de l'autorité d'essai,

      ii) nom du propriétaire du baromètre,

      iii) nom du fabricant,

      iv) désignation du modèle, nombre ou code,

      v) classe de précision assignée,

      vi) brève description du baromètre,

      vii) numéro de série de l'instrument,

      viii) numéro de série du thermomètre associé, lorsqu'il est fourni,

      ix) année de fabrication, si connue,

      x) étendue de pression de l'examen,

      xi) étendue de température de l'examen,

      xii) brève description des essais,

      xiii) traçabilité et erreur maximale de mesure des étalons de pression et de température utilisés pour l'étalonnage,

      xiv) corrections de mesure à chaque pression d'essai, calculées en prenant la valeur moyenne obtenue pour des pressions croissantes et décroissantes,

      xv) dans le cas des baromètres à éléments récepteurs élastiques, hystérésis à chaque pression d'essai, exprimé comme la différence entre la valeur moyenne des erreurs pour des pressions décroissantes et la valeur moyenne des erreurs pour des pressions croissantes à chaque pression d'essai,

      xvi) corrections à appliquer au thermomètre associé, lorsqu'il est fourni,

      xvii) date à laquelle l'étalonnage a été réalisé,

      xviii) date recommandée pour réétalonnage.

      Ces exigences sont résumées en Annexe B.
