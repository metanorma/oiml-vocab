data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: Dispositif connecté ou incorporé au compteur et permettant de corriger
      automatiquement la quantité mesurée au moment du mesurage en tenant compte du
      débit et/ou des caractéristiques du liquide à mesurer (viscosité, température,
      pression, etc.), ainsi que de courbes d'étalonnage préétablies.
  - content: Les caractéristiques du liquide peuvent être soit mesurées au moyen de
      dispositifs de mesure associés, soit mémorisées dans l'instrument.
