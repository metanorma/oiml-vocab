  definition:
  - content: étendue des concentrations d'un élément intéressant en solution, que
      l'on peut mesurer avec une répétabilité respectant des limites spécifiées
  examples: []
  id: r100-1991-8-fra
  notes:
  - content: Une dilution ou une concentration d'une solution de dosage peut être
      nécessaire pour amener l'élément intéressant dans l'étendue de mesure. L'absorbance
      du spectromètre est ajustée à zéro en utilisant une solution de référence à
      blanc.
