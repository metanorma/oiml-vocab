  definition:
  - content: Extreme values of the error (of indication) of an EVSE, permitted by
      this Guide, when the current is varied (AC and DC EVSE) and voltage (DC EVSE)
      within the intervals given by the rated operating conditions, and when the EVSE
      is otherwise operated at reference conditions.
