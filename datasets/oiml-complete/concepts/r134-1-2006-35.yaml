  definition:
  - content: Process of determining the vehicle mass, the axle load, and if applicable,
      the axle-group load of a moving vehicle (i.e. a vehicle crossing over the load
      receptor of the weighing instrument) by measurement and analysis of the dynamic
      vehicle tyre forces.
  examples: []
  id: r134-1-2006-35-eng
