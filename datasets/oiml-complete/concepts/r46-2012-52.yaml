  definition:
  - content: Système incorporé dans un instrument de mesure et qui permet de détecter
      et de mettre en évidence les défauts significatifs.
  examples: []
  id: r46-2012-52-fra
  notes:
  - content: La mise en évidence peut être matérialisée par toute réponse appropriée
      de l'instrument de mesure (signal lumineux, signal acoustique, blocage du processus
      de mesurage, etc.).
