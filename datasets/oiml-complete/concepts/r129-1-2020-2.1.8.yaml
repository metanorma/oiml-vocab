  definition:
  - content: Gerät, das über nur einen Messbereich pro Achse verfügt, welcher in mehrere
      Teilbereiche unterteilt ist. Jeder dieser Teilbereiche kann unterschiedliche
      Skalenteilungswerte haben. Der Messbereich wird in Abhängigkeit von der zu messenden
      Abmessung automatisch bestimmt.
