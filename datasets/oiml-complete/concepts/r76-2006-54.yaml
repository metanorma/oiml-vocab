  definition:
  - content: 'e: The respective OIML Certificate shall include either the complete
      family according to Table 8 with eight instruments in two families or may alternatively
      include the metrological characteristics of the families according to Table
      9. In the latter case the Max values may be reduced (in comparison with the
      smallest EUT, Table 8) if it is an identical instrument with the same verification
      scale interval, e, and if the conditions of Table 3 are still met. The Certificate
      covers all variants that meet the metrological characteristics in Table 9.'
