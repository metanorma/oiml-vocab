data:
  dates:
  - date: '2026-07-15T00:00:00Z'
    type: accepted
  definition:
  - content: Instrument individuel qui est en tout point conforme à un modèle donné,
      dans certaines limites spécifiées.
  examples: []
  id: d19-1988-3-fra
  notes:
  - content: Le mot « modèle » a communément été utilisé pour désigner aussi bien
      le prototype définitif d'un instrument de mesure que l'ensemble des instruments
      qui lui sont conformes. Les instruments produits par le constructeur à l'image
      du modèle constituent un ensemble séparé. La question de savoir si un instrument
      de cet ensemble est conforme au modèle est normalement le sujet de la vérification
      primitive. L'approbation de modèle n'implique pas seulement la reconnaissance
      du fait que le modèle satisfait aux exigences mais s'applique généralement également
      aux instruments de l'ensemble produit par le constructeur; elle implique en
      général que ceux-ci peuvent être vendus pour utilisation légale et soumis à
      la vérification primitive.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Copie d'un modèle
  language_code: fra
  entry_status: valid
