  definition:
  - content: Élément du thermomètre contrôlant, pendant une durée spécifiée, la température
      mesurée à l'aide d'une sonde de température en contact avec une cavité ou un
      tissu corporels, indiquant ensuite la température maximale et maintenant l'indication
      jusqu'à réinitialisation par l'utilisateur.
