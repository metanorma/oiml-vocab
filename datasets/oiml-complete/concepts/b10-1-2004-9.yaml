data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: In the present publication, "Test Report" means a report comprised of
      the OIML Test Report (see 3.8) and, when applicable, a complementary Test Report
      containing test results for any agreed upon additional requirements.
  examples: []
  id: b10-1-2004-9-eng
  notes:
  - content: 'Note 1: The Test Report gives the results of the examinations and testing
      carried out during type evaluation on an identified sample or samples of a given
      type and a conclusion as to whether the sample(s) meet the specified requirements.'
  - content: 'Note 2: The Test Report constitutes the evaluation report referred to
      in 3.4.'
  - content: 'Note 3: The complementary Test Report may be validated by a letter from
      the OIML Issuing Authority.'
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Test Report
