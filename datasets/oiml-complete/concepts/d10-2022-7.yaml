  definition:
  - content: standard measurement uncertainty that is obtained using the individual
      standard measurement uncertainties associated with the input quantities in a
      measurement model
  examples: []
  id: d10-2022-7-eng
  notes:
  - content: In the case of correlations of input quantities in a measurement model,
      covariances must also be taken into account when calculating the combined standard
      measurement uncertainty.
