  definition:
  - content: |-
      Differenz zwischen der Abweichung der Anzeige und der Eigenabweichung eines Messgeräts [VIML 5.12]

      Hinweis 1: Ein Fehler ist hauptsächlich das Ergebnis einer unerwünschten Änderung von Daten, die in einem elektronischen Messgerät enthalten sind oder durch ein solches Messgerät geleitet werden.

      Hinweis 2: Aus der Definition folgt, dass ein „Fehler“ ein numerischer Wert ist, der entweder in einer Maßeinheit oder als Relativwert, z. B. als Prozentsatz, ausgedrückt wird.
