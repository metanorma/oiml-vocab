  definition:
  - content: |-
      8. 2.1. Tout modèle nouveau ou modifié de baromètre destiné à des applications soumises aux contrôles métrologiques doit tout d'abord être soumis à un essai de modèle par une autorité appropriée.

      8. 2.2. Le modèle doit être essayé pour s'assurer qu'il satisfait aux exigences applicables de la présente Recommandation. Au moins 5 instruments doivent être essayés comme suit:

      i) examen des instruments, pour s'assurer qu'ils sont construits solidement et qu'ils satisfont, dans la mesure où elles s'appliquent, aux exigences du point 5 de la Recommandation,

      ii) examen des graduations et des marques, afin de s'assurer qu'elles satisfont, dans la mesure où elles s'appliquent, aux exigences des points 6 et 7 de la présente Recommandation,

      iii) évaluation des performances métrologiques des instruments, afin de s'assurer que les erreurs ne dépassent pas les valeurs maximales tolérées pour la classe de précision prévue, comme spécifié aux points 4 et 8.2.6 de la présente Recommandation.

      8. 2.3. L'essai doit être effectué dans des conditions qui satisfont au point A.2 de l'Annexe A de la présente Recommandation, et en utilisant un équipement satisfaisant au point A.3.

      8. 2.4. Les essais de performance doivent essentiellement être effectués sur toute l'étendue de mesure de pression de l'instrument et doivent consister en un nombre adéquat d'essais, chacun étant réalisé à un nombre adéquat de pressions d'essais, afin de fournir une estimation statistiquement significative de la valeur des erreurs.

      8. 2.5. L'autorité d'essai doit déterminer l'erreur de justesse, la fidélité, l'hystérésis et la stabilité à chaque pression et température d'essai.

      8. 2.6. Les performances d'un modèle d'instrument ne doivent être considérées comme satisfaisantes que si, après application de toutes les corrections nécessaires pour la température et l'accélération de la pesanteur, les conditions suivantes ont été satisfaites à chaque pression et température d'essai pour chaque instrument essayé.
