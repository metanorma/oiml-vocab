  definition:
  - content: Matériau de référence, accompagné d'un certificat, dont une (ou plusieurs)
      valeur(s) de la (des) propriété(s) est (sont) certifiée(s) par une procédure
      qui établit son raccordement à une réalisation exacte de l'unité dans laquelle
      les valeurs de propriété sont exprimées et pour laquelle chaque valeur certifiée
      est accompagnée d'une incertitude à un niveau de confiance indiqué.
