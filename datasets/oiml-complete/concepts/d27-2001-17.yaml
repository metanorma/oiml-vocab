    type: accepted
  definition:
  - content: Organisme qui a été autorisé par l'organisme national responsable à fournir
      une déclaration de conformité d'un instrument de mesure manufacturé, avec les
      exigences légales.
  examples: []
  id: d27-2001-17-fra
  notes:
  - content: Ce terme peut aussi s'appliquer aux distributeurs, importateurs, assembleurs,
      installateurs, réemballeurs, réétiqueteurs, etc. qui ont la responsabilité d'assurer
      la qualité et la performance d'un instrument de mesure avant qu'il soit mis
      en service.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Fabricant autorisé
