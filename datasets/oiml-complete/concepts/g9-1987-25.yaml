  - content: |-
      Grandeurs diverses : Capteurs à ondes de surface — Mesures aux basses pressions — Phénomènes d'influence — Contrôle de l'étanchéité — Mesures aux grandes vilesses — Mesures en hydrologie — Mesures en océanographie — Acoustique sous-marine. Applications — Aéronaulique : instruments de bord — Astrométrie — Essais sur modèles réduits : hydrodynamique — Essais sur modèles réduits : aérodynamique — Mesures en médecine et chirurgie.

      Automatique : Signaux déterministes. Transformées et abaques — Signaux aléaloires — Algèbre de Boole — Chaines de régulation types — Le calculateur numérique dans la conduite des procédés — Étude temporelle — Étude fréquentielle des systèmes continus — Étude fréquentielle des systèmes échantillonnés — La fonction logique, — Automates programmables — Régulation fluidique analogique — Régulation mécanique.

