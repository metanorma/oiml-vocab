    type: accepted
  definition:
  - content: A device which permits the selection of the quantity to be measured and
      which automatically stops the flow of the liquid at the end of the measurement
      of the selected quantity.
  examples: []
  id: r117-1995-8-eng
  notes:
  - content: The pre-set quantity may be the volume, the mass or the related price
      to pay.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: pre-setting device
  language_code: eng
  entry_status: valid
