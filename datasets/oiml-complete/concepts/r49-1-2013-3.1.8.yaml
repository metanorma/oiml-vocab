    type: accepted
  definition:
  - content: dispositif destine a realiser une fonction specifique, directement impliquee
      dans l'elaboration, la transmission ou l'affichage des valeurs mesurees
  examples: []
  id: r49-1-2013-fra-3.1.8-fra
  notes:
  - content: Pour la definition de "valeurs mesurees", voir OIML V 2-200:2012 (VIM)
      [1], 2.10.
  - content: 'Les principaux dispositifs auxiliaires sont : a) dispositif de reglage
      du zero b) dispositif indicateur de prix c) dispositif repetiteur de l''indication
      d) dispositif d''impression e) dispositif de memorisation f) dispositif de controle
      de la tarification g) dispositif de predetermination h) dispositif de libre-service
      i) capteur de detction de mouvement de debit (pour detecter le mouvement du
      capteur de debit avant qu''il ne soit clairement visible sur le dispositif indicateur)
      j) dispositif de lecture a distance (pouvant etre incorpore de maniere permanente
      ou ajoute temporairement)'
  - content: En fonction des reglementations nationales, les dispositifs auxiliaires
      peuvent etre soumis au controle metrologique legal.
