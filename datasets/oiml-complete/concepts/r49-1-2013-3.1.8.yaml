data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Es un dispositivo previsto para desarrollar una función específica, directamente
      relacionada con la elaboración, transmisión o exhibición de los valores medios.
  examples: []
  id: r49-1-2013-spa-3.1.8-spa
  notes:
  - content: Para la definición del término "valor medio", ver OIML V 2-200:2012 (VIM)
      [1], 2.10.
  - content: 'Los principales dispositivos auxiliares son: a) dispositivo de ajuste
      a cero; b) dispositivo indicador de precio; c) dispositivo indicador de repeticiones;
      e) dispositivo de memoria; d) dispositivo de impresión; f) dispositivo de control
      de tarifa; g) dispositivo de preajuste; h) dispositivo de autoservicio; i) sensor
      detector de movimiento de caudal; j) dispositivo de lectura remota.'
  - content: Dependiendo de la legislación nacional, los dispositivos auxiliares pueden
      estar sujetos a control metrológico legal.
