    type: accepted
  definition:
  - content: Valeur extrême de l'erreur d'indication d'un compteur, permise par la
      présente Recommandation, lorsque le courant et le facteur de puissance varient
      dans les intervalles donnés par les conditions assignées de fonctionnement,
      et lorsque le compteur fonctionne par ailleurs aux conditions de référence.
  examples: []
  id: r46-2012-39-fra
  notes:
  - content: Dans cette Recommandation, l'erreur maximale tolérée est une combinaison
      de l'erreur maximale tolérée de base et le décalage d'erreur maximal toléré
      comme décrite en Annexe B.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: erreur maximale tolérée de base
