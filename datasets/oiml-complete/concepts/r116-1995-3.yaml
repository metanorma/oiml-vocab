  definition:
  - content: Tube qui s'enroule autour du tube de quartz extérieur de la torche et
      au moyen duquel l'énergie r.f. est transmise à l'argon. On l'appelle aussi bobine
      de charge.
  examples: []
  id: r116-1995-3-fra
  notes:
  - content: Cette bobine, généralement refroidie par eau, comporte trois ou quatre
      spires et est constituée d'un tube en cuivre éventuellement plaqué d'argent
      ou d'or.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Bobine d'émission radio-fréquences
