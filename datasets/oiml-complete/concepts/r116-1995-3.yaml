data:
  dates:
  - date: 2026-07-16
    type: accepted
  definition:
  - content: A tube, wound around the outer quartz tube of the torch, through which
      the r.f. energy is transmitted to the argon. It is also referred to as the load
      coil.
  examples: []
  id: r116-1995-3-eng
  notes:
  - content: This coil is generally water-cooled, consists of 3 or 4 turns, and is
      constructed of a copper tube that may be plated with silver or gold.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: radio frequency coil
  language_code: eng
  entry_status: valid
