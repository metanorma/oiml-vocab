  definition:
  - content: Partie du dispositif de mesure qui délivre un signal de sortie, représentatif
      du volume ou de la masse, ayant une relation déterminée avec le signal d'entrée.
  examples: []
  id: r117-2007-f-T.t.1-fra
  notes:
  - content: Le transducteur de mesure peut être soit combiné avec le capteur du compteur
      ou être extérieur au capteur du compteur. Dans le second cas, il peut être approuvé
      avec le capteur ou avec le calculateur.
