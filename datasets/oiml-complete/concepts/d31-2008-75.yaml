  definition:
  - content: |-
      (I) En el ejemplo descrito en el apartado 5.2.1.2.a la interfaz software se desarrollo a través de parámetros y valores de retorno de los procedimientos de la biblioteca. No se devuelven punteros a dominios de datos dentro de la biblioteca. La definición de la interfaz se fija en la biblioteca compilada, legalmente relevante sin que ninguna aplicación pueda modificarla. No es imposible eludir la interfaz software y acceder a los dominios de datos de la biblioteca directamente, pero esto no es una buena práctica de programación, es más bien complicado y podría considerarse piratería informática.

      5. 2.1.2.d Si un software legalmente relevante se ha separado de uno no relevante, el primero debe tener prioridad en la utilización de los recursos. Las funciones de medicion (desarrolladas por la parte legalmente relevante) no se deben ver retrasada ni bloqueada por otros procesos.

      El fabricante tiene la responsabilidad de respetar estas restricciones. Se deben proporcionar medios técnicos para evitar que un programa legalmente no relevante altere las funciones legalmente relevantes. El fabricante debe proporcionar instrucciones relacionadas con estos requisitos a los programadores de la parte legalmente relevante del software y de la parte legalmente no relevante.
