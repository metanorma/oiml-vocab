data:
  dates:
  - date: '2026-07-15T00:00:00Z'
    type: accepted
  definition:
  - content: Ensemble des opérations établissant, dans des conditions spécifiées,
      la relation entre les valeurs indiquées par un appareil de mesure ou un système
      de mesure, ou les valeurs représentées par une mesure matérielisée, et les valeurs
      connues correspondantes d'une grandeur mesurée.
  examples: []
  id: d7-1984-1-fra
  notes:
  - content: Le résultat d'un étalonnage permet d'estimer les erreurs d'indication
      de l'appareil de mesure, du système de mesure ou de la mesure matérielisée,
      ou d'affecter des valeurs à des repères sur des échelles arbitraires.
  - content: Un étalonnage peut aussi déterminer d'autres propriétés métrologiques.
  - content: Le résultat d'un étalonnage peut être consigné dans un document, parfois
      appelé certificat d'étalonnage ou rapport d'étalonnage.
  - content: Le résultat d'un étalonnage est parfois exprimé sous la forme d'un facteur
      d'étalonnage ou d'une série de facteurs d'étalonnage sous la forme d'une courbe
      d'étalonnage.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Étalonnage
