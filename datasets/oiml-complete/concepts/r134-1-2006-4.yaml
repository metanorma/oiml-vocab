    type: accepted
  definition:
  - content: Weighing instrument used to determine the static reference vehicle mass
      of the reference vehicles and the static single-axle loads of a two-axle rigid
      reference vehicle.
  - content: 'The control instruments used as a reference instrument during testing
      may be:'
  - content: "- separate from the instrument being tested; or"
  - content: "- integral, when a static weighing mode is provided by the instrument
      being tested."
