data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Everything of the prepackage that is intended to be left over after use
      of the product, except for items naturally in the product. Use includes consumption
      or subjecting to a treatment.
  examples: []
  id: r87-2004-e-2.9-eng
  notes:
  - content: Packing material is generally used to contain protect, handle, deliver,
      preserve, transport inform about and serve as an aid (e.g. food serving tray)
      while using the product it contains.
  sources:
