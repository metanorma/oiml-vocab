  definition:
  - content: Étalon utilisé pour l'étalonnage des débitmètres, c'est-à-dire la partie
      du dispositif d'essai des débitmètres qui est utilisée pour déterminer le débit
      et le volume débité.
  examples: []
  id: d7-1984-5-fra
  notes:
  - content: Un étalon de débitmétrie ne comprend pas les moyens provoquant l'écoulement
      du liquide.
