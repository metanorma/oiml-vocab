  definition:
  - content: |-
      The selection of EUTs to be tested shall be such that their number is minimized but nevertheless sufficiently representative (see example in acceptable solution of 3.10.4.6).

      Approval of the most sensitive EUTs implies approval of the variants with lower characteristics. Therefore, when a choice exists, the EUTs with the highest metrological characteristics shall be selected for test.
