  definition:
  - content: Les réfractomètres de processus sont des instruments dans lesquels le
      liquide est introduit de manière continue en fonction de l'acheminement du produit
      mais non suivant une caractéristique de l'instrument. Le processus de mesure
      est effectué indépendamment de l'acheminement du liquide.
