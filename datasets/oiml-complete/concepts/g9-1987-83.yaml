  definition:
  - content: |-
      This chapter describes the standard procedures for calculating net standard volumes, including the application of correction factors and the importance of significant figures. The purpose of standardizing the calculation procedure is to achieve the same result regardless of what person or computer does the calculating.

      Chapter 12.2, Calculation of Liquid Petroleum Quantities Measured by Turbine or Displacement Meters, First Edition, September 1981 (ANSI/ API MPMS 12.2-1981)

      This publication defines the terms used in the calculation of metered petroleum quantities and specifies the equations that allow the values of correction factors to be computed. Rules for sequence, rounding, and significant figures are provided, along with tables for computer calculations. 39 pages.

      Price each, $10.00
