data:
  dates:
  - date: '2026-07-17T00:00:00+00:00'
    type: accepted
  definition:
  - content: La capacité d'une fiole jaugée à un seul trait repère est le volume d'eau
      qu'elle contient, à la température de référence de 20 °C, lorsqu'elle est remplie
      jusqu'à son trait repère.
  examples: []
  id: r4-1970-1-fra
  notes:
  - content: L'expression « remplie jusqu'au trait repère » signifie que le ménisque
      formé par l'eau dans le col a été ajusté de telle façon que le plan passant
      par le bord supérieur du trait repère est tangent au point le plus bas de ce
      ménisque lorsque la fiole est placée sur une surface plane horizontale.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Capacité d'une fiole jaugée
  language_code: fra
  entry_status: valid
