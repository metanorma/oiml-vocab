data:
  dates:
  - date: '2026-07-15T00:00:00Z'
    type: accepted
  definition:
  - content: Élément du thermomètre appliqué dans une cavité ou un tissu corporels,
      avec lesquels est établi l'équilibre thermique. Elle comprend un capteur de
      température combiné à d'autres composants dont le boîtier, les scellés, les
      connexions internes, et la prise d'alimentation, le cas échéant.
  examples: []
  id: r115-1995-2-fra
  notes:
  - content: On entend par cavité ou tissu corporels, la bouche (sous la langue),
      le rectum, ou les aisselles.
  - content: La partie de la sonde en contact avec la cavité ou le tissu corporels
      est appelée le point d'application.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Sonde de température
  language_code: fra
  entry_status: valid
