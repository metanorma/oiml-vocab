  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: Parameter, associated with the result of a measurement, that characterizes
      the dispersion of the values that could reasonably be attributed to the measurand.
  examples: []
  id: r111-1994-5-eng
  notes:
  - content: 'The uncertainty of measurement comprises, in general, several components
      which may be grouped into two categories according to the method used to estimate
      their numerical value: A - components evaluated by statistical methods to a
      series of repeated determinations; B - components evaluated by other means.'
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Uncertainty of measurement
  language_code: eng
  entry_status: valid
