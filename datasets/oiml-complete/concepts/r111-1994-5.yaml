data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: Paramètre, associé au résultat d'un mesurage, qui caractérise la dispersion
      des valeurs qui pourraient raisonnablement être attribuées au mesurande.
  examples: []
  id: r111-1994-5-fra
  notes:
  - content: 'L''incertitude de mesure comprend en général plusieurs composantes qui
      peuvent être groupées en deux catégories suivant la méthode utilisée pour déterminer
      leur valeur numérique: A - composantes évaluées par des méthodes statistiques
      par des séries de déterminations répétées; B - composantes évaluées par d''autres
      moyens.'
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Incertitude de mesure
  language_code: fra
  entry_status: valid
