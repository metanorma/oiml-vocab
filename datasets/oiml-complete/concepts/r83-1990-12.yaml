data:
  dates:
  - date: '2026-07-15T00:00:00Z'
    type: accepted
  definition:
  - rapport R = m/Δm interprété selon l'une des deux définitions suivantes: m est
      la masse correspondant au premier pic d'un doublet, et Δm la différence de masse
      correspondant au deux pics, le doublet devant être séparé par un creux dont
      la valeur ne doit pas dépasser 10 % de la valeur du pic le plus haut; ou m est
      la masse d'un constituant correspondant au pic et Δm la largeur du pic à mi-hauteur
  examples: []
  id: r83-1990-12-fra
  notes:
  - content: Résolution unité signifie en général R = 2|m| où |m| est la valeur numérique
      lorsque m est exprimé en unités de masse atomique unifiées.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: résolution d'un spectromètre de masse
  language_code: fra
  entry_status: valid
date_accepted: '2026-07-16T00:00:00+00:00'
