data:
  dates:
  - date: '2026-07-15T00:00:00Z'
    type: accepted
  definition:
  - content: Matière ou substance dont une ou plusieurs valeurs caractéristiques sont
      suffisamment homogènes et bien établies pour être utilisée pour l'étalonnage
      d'un appareil, l'évaluation d'une méthode de mesurage, ou l'affectation de valeurs
      à des matières.
  examples: []
  id: r123-1997-8-fra
  notes:
  - content: Ce terme ne signifie pas nécessairement qu'il s'agit d'un étalon de référence
      certifié.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Matière de référence
  language_code: fra
  entry_status: valid
