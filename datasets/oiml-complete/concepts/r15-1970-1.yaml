  - date: '2026-07-17T00:00:00+00:00'
    type: accepted
  definition:
  - content: La masse à l'hectolitre d'un grain de céréale est la masse volumique
      de remplissage par ce grain d'un récipient de capacité de 20 litres de forme
      et dimensions spécifiées, dans des conditions de remplissage déterminées.
  examples: []
  id: r15-1970-1-fra
  notes:
  - content: Elle est exprimée en kilogrammes par hectolitre. La masse à l'hectolitre
      dépend de la qualité intrinsèque du grain, de son état hygrométrique, et des
      caractéristiques du récipient.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Masse à l'hectolitre des céréales
