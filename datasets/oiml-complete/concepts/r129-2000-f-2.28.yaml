    type: accepted
  definition:
  - content: Defaut supérieur à un échelon (d).
  examples: []
  id: r129-2000-f-2.28-fra
  notes:
  - content: 'Les défauts suivants ne sont pas considérés comme significatifs, même
      s''ils dépassent la valeur définie ci-dessus: (a) défauts provenant de causes
      simultanées et mutuellement indépendantes dans l''instrument de mesure lui-même;
      (b) défauts impliquant l''impossibilité d''effectuer tout mesurage; (c) défauts
      transitoires consistant en des variations momentanées de l''indication, ne pouvant
      pas être interprétées, mémorisées ou transmises comme résultat de mesure; et
      (d) défauts produisant des variations du résultat de mesure si sérieuses qu''ils
      ne peuvent manquer d''être remarqués par toutes les personnes intéressées par
      le résultat de mesure.'
