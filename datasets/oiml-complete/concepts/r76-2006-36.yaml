    type: accepted
  definition:
  - content: |-
      When any load is kept on an instrument, the difference between the indication obtained immediately after placing a load and the indication observed during the following 30 minutes, shall not exceed 0.5 e. However, the difference between the indication obtained at 15 minutes and that at 30 minutes shall not exceed 0.2 e.

      If these conditions are not met, the difference between the indication obtained immediately after placing a load on the instrument and the indication observed during the following four hours shall not exceed the absolute value of the maximum permissible error at the load applied.
