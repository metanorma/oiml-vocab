  definition:
  - content: Matériaux d'emballage qui ont été utilisés comme partie d'un préemballage
      et qui ont été séparés du produit et nettoyés en utilisant les procédures ménagères
      habituelles utilisées par les consommateurs du produit (il convient, par exemple,
      que les matériaux ne soient pas séchés dans un four).
