  definition:
  - content: Packing material that has been used as part of a prepackage and that
      has been separated from the product and cleaned using normal household procedures
      used by consumers of the product (e.g. the material should not be dried in an
      oven).
  examples: []
  id: r87-2004-18-eng
  notes: []
  sources: []
