data:
  dates:
  - date: '2026-07-15T00:00:00Z'
    type: accepted
  definition:
  - content: Masse volumique de « remplissage » par le grain d'un récipient d'une
      capacité de 20 litres de forme et dimensions spécifiées, le remplissage du récipient
      par le grain s'effectuant dans des conditions déterminées. Elle est obtenue
      en divisant la masse du grain exprimée en kilogrammes par le volume du récipient
      exprimé en hectolitres ; elle est ainsi exprimée en kilogrammes par hectolitre.
  examples: []
  id: r15-1974-1-fra
  notes:
  - content: Cette caractéristique dépend non seulement de la qualité intrinsèque
      du grain considéré mais aussi de son état hygrométrique, de la capacité, de
      la forme et des dimensions du récipient servant à mesurer son volume, ainsi
      que de la façon dont s'effectue le remplissage.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Masse à l'hectolitre d'un grain de céréale
  language_code: fra
  entry_status: valid
