data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: 'The pipe Reynolds number is a dimensionless ratio of inertia to viscous
      forces which is used as a correlating parameter combining the effects of viscosity,
      density and pipe line velocity. It is defined as: Re = D × (U/ν) = D × U × (ρ/μ).'
  - content: 'Where: D is the meter bore size, U is the average fluid velocity in
      the meter, ν is the kinematic viscosity, ρ is the fluid density, and μ is the
      absolute (dynamic) viscosity.'
  examples: []
