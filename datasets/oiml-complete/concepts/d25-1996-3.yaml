data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: La linéarité, L, se rapporte à la constance du facteur K sur une étendue
      spécifique, définie soit par le nombre de Reynolds de la canalisation, soit
      par le débit (voir Figure 3).
  - content: Cette étendue linéaire est en général spécifiée par une bande définie
      par les facteurs K maximum et minimum, à l'intérieur de laquelle le facteur
      K est supposé être égal à K_moyen.
  - content: 'Sous forme d''équation, la linéarité est définie par: L = ± (K_max −
      K_min) / (2 × K_moyen) × 100%.'
  - content: Les limites supérieure et inférieure de cette étendue peuvent être spécifiées
      par le fabricant soit par les nombres de Reynolds maximum et minimum, soit par
      une étendue de débits pour un fluide spécifié et autres limitations liées à
      la conception du compteur, telles que les effets du profil de vitesses du fluide,
      de la viscosité, de la masse volumique, de la pression, de la température, et
      de l'installation (voir article 5).
