data:
  dates:
  - date: '2026-07-16T00:00:00Z'
    type: accepted
  definition:
  - content: Linearity, L, refers to the constancy of the K-factor over a specific
      range, either defined by the pipe Reynolds number or by the flowrate (see Figure
      3).
  - content: This linear range is usually specified by a band defined by maximum and
      minimum K-factors, within which the K-factor is assumed to be equal to K_mean.
  - content: 'In equation form, linearity is defined as: L = ± (K_max − K_min) / (2
      × K_mean) × 100%.'
  - content: The upper and lower limits of this range can be specified by the manufacturer
      either as a maximum and minimum Reynolds number range or as a flowrate range
      of a specified fluid and other meter design limitations such as fluid velocity
      profile, viscosity, density, pressure, temperature or installation effects (see
      clause 5).
