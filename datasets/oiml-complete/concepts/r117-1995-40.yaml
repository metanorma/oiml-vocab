data:
  dates:
  - date: '2026-07-15T00:00:00Z'
    type: accepted
  definition:
  - content: Plus petit volume de liquide dont le mesurage soit métrologiquement admissible
      pour cet ensemble.
  examples: []
  id: r117-1995-40-fra
  notes:
  - content: Dans les ensembles de mesurage destinés à des opérations de livraison,
      ce plus petit volume est appelé livraison minimale; dans ceux destinés à des
      opérations de réception, il est appelé réception minimale.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Quantité mesurée minimale d'un ensemble de mesurage
  language_code: fra
  entry_status: valid
