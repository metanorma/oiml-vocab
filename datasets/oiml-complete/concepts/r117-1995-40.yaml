data:
  dates:
  - date: 2026-07-16
    type: accepted
  definition:
  - content: The smallest volume of liquid for which the measurement is metrologically
      acceptable for that system.
  examples: []
  id: r117-1995-40-eng
  notes:
  - content: In measuring systems intended to deliver, this smallest volume is referred
      to as the minimum delivery; in those intended for receiving operations, it is
      referred to as the minimum receipt.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: minimum measured quantity of a measuring system
  language_code: eng
  entry_status: valid
