  definition:
  - content: absorbance divided by the optical pathlength stem:[b] and the amount of substance
      concentration stem:[c]
  examples: []
  id: '01847-eng'
  notes:
  - content: |
      The derived SI unit is the square metre per mole (stem:[1 m^{2}/mol]), but
      the litre per mole per mm (stem:[L/("mol" xx "mm")]) or litre per mole per
      cm (stem:[L/("mol" xx "cm")]) is often used.
  - content: The specific molar absorption coefficient stem:[epsilon] slightly
      depends on the amount of substance concentration stem:[c].
