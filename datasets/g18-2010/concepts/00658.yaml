  definition:
  - content: 'Mean value of the error (of indication) for a number of consecutive
      automatic weighings of a load, or similar loads, passed over the load receptor,
      expressed mathematically as: stem:[n Sigma x_i / n] where:
      stem:[x_i = "error of a load indication",
      stem:[x = "mean of the errors"], and stem:[n = "number of weighings"]'
