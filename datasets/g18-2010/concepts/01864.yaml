  definition:
  - content: catalytic activity of a component divided by the volume of the original system
  examples: []
  id: '01864-eng'
  notes:
  - content: The derived coherent SI unit is the mole per second per cubic metre (stem:["mol" / (s cdot m^3)]), also called stem:["kat"/m^3]. In laboratory medicine the mole per second per litre (stem:["mol" / (s cdot L)]) is also frequently used.
  - content: |-
      Throughout this Recommendation the "component" is an enzyme and the "original system" can be, e.g., the plasma of a blood sample. [ISO/DIS 18153, clause 3.3]
