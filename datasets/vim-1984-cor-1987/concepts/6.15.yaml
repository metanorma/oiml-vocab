data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      Matériau ou substance dont une ou plusieurs propriétés sont suffisamment
      bien définies pour permettre de l'utiliser pour l'étalonnage d'un appareil,
      l'évaluation d'une méthode de mesurage ou l'attribution de valeurs aux matériaux.
  id: 6.15-fra
  language_code: fra
  notes:
  - content: Cette définition provient du Guide ISO 30-1981.
  terms:
  - type: expression
    normative_status: preferred
    designation: matériau de référence
    grammar_info:
    - gender: m
