  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      A material or substance one or more properties of which are sufficiently
      well established to be used for the calibration of an apparatus, the assessment
      of a measurement method, or for assigning values to materials.
  id: 6.15-eng
  language_code: eng
  notes:
  - content: This definition is taken from ISO Guide 30-1981.
  terms:
  - type: expression
    normative_status: preferred
    designation: reference material
