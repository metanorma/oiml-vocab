    type: accepted
  definition:
  - content: A measuring instrument which provides a digitized output and/or display.
  id: 4.11-eng
  language_code: eng
  notes:
  - content: >-
      This term relates to the form of presentation of the output or display, not
      to the principle of operation of the instrument.
  examples:
  - content: digital voltmeter.
  terms:
  - type: expression
    normative_status: preferred
    designation: digital measuring instrument
