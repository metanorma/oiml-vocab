    type: accepted
  definition:
  - content: >-
      Appareil de mesure qui fournit un signal de sortie ou un affichage sous forme
      numérique.
  id: 4.11-fra
  language_code: fra
  notes:
  - content: >-
      Ce terme s'applique à la forme de présentation des signaux de sortie ou de
      l'affichage, non au principe de fonctionnement de l'instrument.
  examples:
  - content: voltmètre numérique.
  terms:
  - type: expression
    normative_status: preferred
    designation: "appareil de mesure (à affichage) numérique"
