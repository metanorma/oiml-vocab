data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      A value of a quantity which represents the measurand and which is functionally
      related to it.
  id: 2.11-eng
  language_code: eng
  notes:
  - content: >-
      The transformed value may be internal to a measuring system or may be provided
      as an output from the system.
  examples:
  - content: a) the value of the electrical output signal of a pressure transducer;
  - content: b) an indication of a measured force as "per cent of full load";
  - content: c) the value represented by a binary train within a digital electronic system or computer.
  terms:
  - type: expression
    normative_status: preferred
    designation: transformed value (of a measurand)
date_accepted: '1984-01-01T00:00:00+00:00'
entry_status: valid
