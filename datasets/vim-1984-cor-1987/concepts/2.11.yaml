data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      Valeur d'une grandeur qui représente la grandeur mesurée et qui lui est
      fonctionnellement liée.
  id: 2.11-fra
  language_code: fra
  notes:
  - content: >-
      La valeur transformée peut être interne à un système de mesure, ou être
      fournie comme sortie de ce système.
  examples:
  - content: a) valeur du signal de sortie électrique d'un transducteur de pression;
  - content: b) indication d'une force mesurée en « pourcentage de pleine échelle »;
  - content: >-
      c) valeur représentée par un train d'impulsions binaires dans un système
      électronique numérique ou dans un ordinateur.
  terms:
  - type: expression
    normative_status: preferred
    designation: "valeur transformée (d'une grandeur mesurée)"
    grammar_info:
    - gender: f
date_accepted: '1984-01-01T00:00:00+00:00'
entry_status: valid
