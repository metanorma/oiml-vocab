data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      Série de valeurs d'une grandeur ou d'une propriété donnée, déterminées
      d'une manière définie et adoptées par convention.
  id: 1.21-fra
  language_code: fra
  examples:
  - content: >-
      a) l'Échelle internationale pratique de température fondée sur les
      températures de fusion et d'ébullition d'une série de corps purs spécifiés
      et sur l'utilisation d'instruments de mesure et de formules d'interpolation
      spécifiés;
  - content: >-
      b) l'échelle de dureté de Mohs, fondée sur les duretés d'une série de
      minéraux spécifiés;
  - content: c) l'échelle de Richter pour les séismes.
  terms:
  - type: expression
    normative_status: preferred
    designation: "échelle de repérage (d'une grandeur ou d'une propriété)"
    grammar_info:
    - gender: f
date_accepted: '1984-01-01T00:00:00+00:00'
entry_status: valid
id: edc14a55-354d-47a7-aeb0-f353bb345973
