data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      Valeur d'une grandeur qui peut être substituée à la valeur vraie dans un
      but déterminé.
  id: 1.19-fra
  language_code: fra
  notes:
  - content: >-
      Une valeur conventionnellement vraie est, en général, considérée comme
      suffisamment proche de la valeur vraie pour que la différence puisse être
      non significative pour le but donné.
  examples:
  - content: >-
      au sein d'une organisation, la valeur attribuée à un étalon de référence
      peut être prise comme étant la valeur conventionnellement vraie de la
      grandeur réalisée par l'étalon.
  terms:
  - type: expression
    normative_status: preferred
    designation: valeur conventionnellement vraie (d'une grandeur)
    grammar_info:
    - gender: f
date_accepted: '1984-01-01T00:00:00+00:00'
entry_status: valid
