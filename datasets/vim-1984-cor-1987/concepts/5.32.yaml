data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: Rapport de l'erreur d'un instrument de mesure à une valeur spécifiée pour l'instrument.
  id: 5.32-fra
  language_code: fra
  notes:
  - content: >-
      La valeur spécifiée est généralement appelée valeur conventionnelle (de référence)
      et peut être, par exemple, l'intervalle de mesure ou la limite supérieure
      du calibre de l'instrument de mesure.
  terms:
  - type: expression
    normative_status: preferred
    designation: "erreur réduite conventionnelle (d'un instrument de mesure)"
    grammar_info:
    - gender: f
date_accepted: '1984-01-01T00:00:00+00:00'
