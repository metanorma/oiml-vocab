data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      The smallest change in a stimulus which produces a perceptible change in
      the response of a measuring instrument.
  id: 5.12-eng
  language_code: eng
  notes:
  - content: >-
      The discrimination threshold may depend on, for example, noise (internal
      or external), friction, damping, inertia, quantization.
  examples:
  - content: >-
      if the smallest change in load which produces a perceptible displacement
      of the pointer of a balance is 90 mg, then the discrimination threshold of
      the balance is 90 mg.
  terms:
  - type: expression
    normative_status: preferred
    designation: discrimination threshold
date_accepted: '1984-01-01T00:00:00+00:00'
entry_status: valid
