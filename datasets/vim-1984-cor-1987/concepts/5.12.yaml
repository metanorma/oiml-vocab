data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      La plus petite variation d'un signal d'entrée qui provoque une variation
      perceptible de la réponse d'un instrument de mesure.
  id: 5.12-fra
  language_code: fra
  notes:
  - content: >-
      Le seuil de mobilité peut dépendre, par exemple, du bruit (interne ou externe),
      du frottement, de l'amortissement, de l'inertie, de la quantification.
  examples:
  - content: >-
      si la plus petite variation de charge qui provoque un déplacement perceptible
      de l'aiguille d'une balance est 90 mg, alors le seuil de mobilité de la balance
      est 90 mg.
  terms:
  - type: expression
    normative_status: preferred
    designation: seuil de mobilité
    grammar_info:
    - gender: m
date_accepted: '1984-01-01T00:00:00+00:00'
entry_status: valid
