    type: accepted
  definition:
  - content: >-
      Échelle dans laquelle la longueur et la valeur de chaque division sont reliées
      par un coefficient de proportionnalité non constant le long de l'échelle.
  id: 4.26-fra
  language_code: fra
  notes:
  - content: >-
      Certaines échelles non-linéaires possèdent des noms spéciaux tels que échelle
      logarithmique, échelle quadratique.
  terms:
  - type: expression
    normative_status: preferred
    designation: échelle non-linéaire
