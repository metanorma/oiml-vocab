  definition:
  - content: >-
      The time interval between the instant when a stimulus is subjected to a specified
      abrupt change and the instant when the response reaches and remains within
      specified limits of its final steady value.
  id: 5.19-eng
  language_code: eng
  terms:
  - type: expression
    normative_status: preferred
    designation: response time
