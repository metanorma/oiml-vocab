data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      A system of units composed of a set of base units and coherent derived units.
  id: 1.09-eng
  language_code: eng
  examples:
  - content: >-
      the following units (expressed by their symbols) form part of the coherent
      system of units in mechanics within the International System of Units, SI:
      m; kg; s; m^2; m^3; Hz = s^-1; m·s^-1; m·s^-2; kg·m^-3; N = kg·m·s^-2;
      Pa = kg·m^-1·s^-2; J = kg·m^2·s^-2; W = kg·m^2·s^-3.
  terms:
  - type: expression
    normative_status: preferred
    designation: coherent system of units (of measurement)
date_accepted: '1984-01-01T00:00:00+00:00'
entry_status: valid
id: f318bfe6-9373-49bb-9508-506e3a223ac5
