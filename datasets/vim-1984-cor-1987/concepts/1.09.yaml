  definition:
  - content: >-
      Système d'unités composé d'un ensemble d'unités de base et d'unités dérivées
      cohérentes.
  id: 1.09-fra
  language_code: fra
  examples:
  - content: >-
      les unités suivantes (exprimées par leurs symboles) font partie du système
      cohérent d'unités de la mécanique dans le Système international d'unités,
      SI : m; kg; s; m^2; m^3; Hz = s^-1; m·s^-1; m·s^-2; kg·m^-3; N = kg·m·s^-2;
      Pa = kg·m^-1·s^-2; J = kg·m^2·s^-2; W = kg·m^2·s^-3.
  terms:
  - type: expression
    normative_status: preferred
    designation: "système cohérent d'unités (de mesure)"
