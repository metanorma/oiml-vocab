data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      Valeur qui, ajoutée algébriquement au résultat brut d'un mesurage, compense
      une erreur systématique présumée.
  id: 3.14-fra
  language_code: fra
  notes:
  - content: La correction est égale à l'erreur systématique présumée changée de signe.
  - content: >-
      Puisque l'erreur systématique ne peut être connue exactement, la correction
      est entachée d'une incertitude.
  terms:
  - type: expression
    normative_status: preferred
    designation: correction
