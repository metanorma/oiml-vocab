  definition:
  - content: >-
      Méthode de mesure dans laquelle la grandeur à mesurer est comparée à une grandeur
      de même nature de valeur connue peu différente de celle de la grandeur à mesurer,
      et dans laquelle la différence entre les deux valeurs est mesurée.
  id: 2.19-fra
  language_code: fra
  examples:
  - content: mesurage du diamètre d'un piston au moyen de cales étalon et d'un comparateur.
  terms:
  - type: expression
    normative_status: preferred
    designation: méthode de mesure différentielle
    grammar_info:
    - gender: f
