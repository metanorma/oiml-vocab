---
data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      Étroitesse de l'accord entre les résultats des mesurages successifs du même
      mesurande effectués avec l'application de la totalité des conditions suivantes
      : même méthode de mesure, même observateur, même instrument de mesure, même
      lieu, mêmes conditions d'utilisation, répétition sur une courte période de
      temps.
  id: 3.06-fra
  language_code: fra
  notes:
  - content: >-
      La répétabilité peut s'exprimer quantitativement par une caractéristique de
      dispersion des résultats.
  terms:
  - type: expression
    normative_status: preferred
    designation: répétabilité des mesurages
    grammar_info:
    - gender: f
