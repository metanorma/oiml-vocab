data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      A component of the error of measurement which, in the course of a number
      of measurements of the same measurand, remains constant or varies in a predictable
      way.
  id: 3.13-eng
  language_code: eng
  notes:
  - content: Systematic errors and their causes may be known or unknown.
  - content: For a measuring instrument, see "bias error".
  terms:
  - type: expression
    normative_status: preferred
    designation: systematic error
