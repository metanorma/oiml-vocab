data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: Ensemble d'unités établi pour un système de grandeurs donné.
  id: 1.08-fra
  language_code: fra
  notes:
  - content: >-
      Un système d'unités comprend un ensemble d'unités de base choisies et d'unités
      dérivées déterminées par leurs équations de définition et les facteurs de proportionnalité.
  examples:
  - content: a) Système international d'unités, SI;
  - content: b) système d'unités CGS.
  terms:
  - type: expression
    normative_status: preferred
    designation: "système d'unités (de mesure)"
    grammar_info:
    - gender: m
