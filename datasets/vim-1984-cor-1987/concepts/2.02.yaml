    type: accepted
  definition:
  - content: The field of knowledge concerned with measurement.
  id: 2.02-eng
  language_code: eng
  notes:
  - content: >-
      Metrology includes all aspects both theoretical and practical with reference
      to measurements, whatever their level of accuracy, and in whatever fields
      of science or technology they occur.
  terms:
  - type: expression
    normative_status: preferred
    designation: metrology
