  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: Domaine des connaissances relatives aux mesurages.
  id: 2.02-fra
  language_code: fra
  notes:
  - content: >-
      La métrologie embrasse tous les aspects aussi bien théoriques que pratiques
      se rapportant aux mesurages quel que soit le niveau d'exactitude de ceux-ci
      et quels que soient les domaines de la science et de la technologie.
  terms:
  - type: expression
    normative_status: preferred
    designation: métrologie
