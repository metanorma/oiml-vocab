data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      Mesure matérialisée, appareil de mesure ou système de mesure destiné à définir,
      réaliser, conserver ou reproduire une unité ou une ou plusieurs valeurs connues
      d'une grandeur pour les transmettre par comparaison à d'autres instruments
      de mesure.
  id: 6.01-fra
  language_code: fra
  examples:
  - content: a) étalon de masse de 1 kg;
  - content: b) cale étalon;
  - content: c) résistance étalon de stem:[100 Omega];
  - content: d) pile étalon saturée de Weston;
  - content: e) ampèremètre étalon;
  - content: f) étalon atomique de fréquence à césium.
  terms:
  - type: expression
    normative_status: preferred
    designation: étalon
    grammar_info:
    - gender: m
