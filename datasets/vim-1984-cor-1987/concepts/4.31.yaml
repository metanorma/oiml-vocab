data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      Indication directe d'un appareil de mesure lorsque cet appareil est en service
      avec une valeur nulle de la grandeur mesurée, l'appareil étant alimenté par
      toute source d'énergie auxiliaire nécessaire pour son fonctionnement.
  id: 4.31-fra
  language_code: fra
  notes:
  - content: >-
      Ce terme est habituellement appelé zéro électrique dans le cas d'un appareil
      de mesure ayant une source d'énergie auxiliaire électrique.
  - content: >-
      Le terme zéro mécanique est souvent utilisé lorsque l'appareil n'est pas
      en service et lorsque son alimentation par toute source d'énergie auxiliaire
      est coupée.
  - content: >-
      Le zéro mécanique peut parfois ne pas coïncider avec le zéro électrique ;
      pour certains types d'appareils, il peut être indéterminé.
  terms:
  - type: expression
    normative_status: preferred
    designation: "zéro d'un appareil de mesure"
    grammar_info:
    - gender: m
date_accepted: '1984-01-01T00:00:00+00:00'
entry_status: valid
id: 17732b16-d6e3-481b-b2cf-9bf27bd50867
