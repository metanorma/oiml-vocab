data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      The direct indication of a measuring instrument when the instrument is in
      use with zero value of the measurand, any auxiliary power supply required
      to operate the instrument being switched on.
  id: 4.31-eng
  language_code: eng
  notes:
  - content: >-
      This term is commonly called electrical zero in the case of a measuring instrument
      having an electrical auxiliary power supply.
  - content: >-
      The term mechanical zero is often used when the instrument is not in use
      and any auxiliary power supply is switched off.
  - content: >-
      The mechanical zero may possibly not coincide with the electrical zero;
      in some types of instrument the mechanical zero may be indeterminate.
  terms:
  - type: expression
    normative_status: preferred
    designation: zero of a measuring instrument
date_accepted: '1984-01-01T00:00:00+00:00'
entry_status: valid
