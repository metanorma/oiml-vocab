data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      Conditions d'utilisation donnant les étendues de la grandeur à mesurer et
      des grandeurs d'influence, et les autres exigences importantes, pour lesquelles
      les caractéristiques métrologiques d'un instrument de mesure sont supposées
      maintenues entre des limites spécifiées.
  id: 5.05-fra
  language_code: fra
  notes:
  - content: >-
      Les conditions assignées de fonctionnement spécifient généralement des valeurs
      assignées pour la grandeur à mesurer et pour les grandeurs d'influence.
  terms:
  - type: expression
    normative_status: preferred
    designation: conditions assignées de fonctionnement
