data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      Unité de mesure dérivée qui s'exprime au moyen des unités de base par une
      formule dont le facteur de proportionnalité est 1.
  id: 1.13-fra
  language_code: fra
  notes:
  - content: >-
      Ce terme est une abréviation de la dénomination plus exacte « unité de mesure
      dérivée dans un système cohérent d'unités » car, pour une unité isolée,
      la notion de cohérence n'a pas de sens.
  examples:
  - content: >-
      le newton est l'unité cohérente de force dans le SI : 1 N = 1 kg·m·s^-2.
  terms:
  - type: expression
    normative_status: preferred
    designation: "unité (de mesure) cohérente"
    grammar_info:
    - gender: f
date_accepted: '1984-01-01T00:00:00+00:00'
entry_status: valid
