data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      Bande, disque, feuille ou autre structure sur lequel est enregistrée la valeur
      d'une grandeur mesurée ou une valeur qui lui est reliée.
  id: 4.14-fra
  language_code: fra
  notes:
  - content: >-
      Un support d'enregistrement portant des lignes imprimées de coordonnées est
      généralement appelé support de diagramme.
  - content: >-
      Un support d'enregistrement électronique ou magnétique peut être appelé mémoire.
  terms:
  - type: expression
    normative_status: preferred
    designation: support d'enregistrement
    grammar_info:
    - gender: m
