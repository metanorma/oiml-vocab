data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      A strip, disc, sheet or other structure on which is recorded the value of
      a measurand or a related value.
  id: 4.14-eng
  language_code: eng
  notes:
  - content: >-
      A recording medium bearing pre-printed coordinate lines is generally called
      a recording chart.
  - content: An electronic or magnetic recording medium may be called a memory.
  terms:
  - type: expression
    normative_status: preferred
    designation: recording medium
