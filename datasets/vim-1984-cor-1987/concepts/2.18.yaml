data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      A method of measurement in which the measurand is replaced by a quantity of
      the same kind, of known value, and chosen so that the effects on the indicating
      device are the same.
  id: 2.18-eng
  language_code: eng
  examples:
  - content: >-
      determination of a mass by means of a balance and known masses using the
      Borda substitution method.
  terms:
  - type: expression
    normative_status: preferred
    designation: substitution method of measurement
