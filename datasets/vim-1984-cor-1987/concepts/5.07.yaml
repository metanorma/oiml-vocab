    type: accepted
  definition:
  - content: >-
      Conditions of use for a measuring instrument prescribed for performance testing,
      or to ensure valid intercomparison of results of measurements.
  id: 5.07-eng
  language_code: eng
  notes:
  - content: >-
      The reference conditions generally specify reference values or reference
      ranges for the influence quantities affecting the measuring instrument.
  terms:
  - type: expression
    normative_status: preferred
    designation: reference conditions
