  definition:
  - content: >-
      A quantity which is not the subject of the measurement but which influences
      the value of the measurand or the indication of the measuring instrument.
  id: 2.10-eng
  language_code: eng
  examples:
  - content: ambient temperature;
  - content: frequency of an alternating measured voltage.
  terms:
  - type: expression
    normative_status: preferred
    designation: influence quantity
