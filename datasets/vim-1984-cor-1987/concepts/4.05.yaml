data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      Ensemble complet d'instruments de mesure et autres dispositifs assemblés
      pour exécuter une tâche de mesurage spécifiée.
  id: 4.05-fra
  language_code: fra
  notes:
  - content: >-
      Le terme installation de mesure est réservé aux appareillages de mesurage
      habituellement de grande dimension, qui sont installés à poste fixe, par
      exemple : instrumentation d'une salle des chaudières, boucle étalon pour
      mesure de débit.
  examples:
  - content: a) appareillage pour mesurer la résistivité des matériaux électrotechniques ;
  - content: b) appareillage pour l'étalonnage des thermomètres médicaux.
  terms:
  - type: expression
    normative_status: preferred
    designation: système de mesure
    grammar_info:
    - gender: m
date_accepted: '1984-01-01T00:00:00+00:00'
entry_status: valid
