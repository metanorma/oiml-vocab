data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      A complete set of measuring instruments and other equipment assembled to
      carry out a specified measurement task.
  id: 4.05-eng
  language_code: eng
  notes:
  - content: >-
      The term measuring installation is reserved for measuring apparatus, usually
      of the larger kind, which is permanently installed, for example: boiler-house
      instrumentation, prover-loop for flow measurement.
  examples:
  - content: a) apparatus for measuring the resistivity of electrotechnical materials;
  - content: b) apparatus for the calibration of clinical thermometers.
  terms:
  - type: expression
    normative_status: preferred
    designation: measuring system
date_accepted: '1984-01-01T00:00:00+00:00'
entry_status: valid
