data:
  dates:
  - date: '1987-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      A measuring instrument in which the output and/or display is a continuous
      function of the value of the measurand.
  id: 4.10-eng
  language_code: eng
  notes:
  - content: >-
      This term relates to the form of presentation of the output or display,
      not to the principle of operation of the instrument.
  examples:
  - content: a) moving coil voltmeter;
  - content: b) mercury-in-glass thermometer;
  - content: c) Bourdon pressure gauge.
  terms:
  - type: expression
    normative_status: preferred
    designation: analogue measuring instrument
date_accepted: '1987-01-01T00:00:00+00:00'
entry_status: valid
