data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: For defined conditions, the relationship between a stimulus and the corresponding response.
  id: 5.09-eng
  language_code: eng
  notes:
  - content: >-
      The relationship may be based on theoretical or experimental considerations;
      it may be expressed in the form of an algebraic equation, a numerical table
      or a graph.
  - content: >-
      When the stimulus varies as a function of time, one form of the response
      characteristic is the transfer function (the Laplace transform of the response
      divided by that of the stimulus).
  terms:
  - type: expression
    normative_status: preferred
    designation: response characteristic
date_accepted: '1984-01-01T00:00:00+00:00'
entry_status: valid
