data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: "Pour des conditions définies, relation entre un signal d'entrée et la réponse correspondante."
  id: 5.09-fra
  language_code: fra
  notes:
  - content: >-
      La relation peut être fondée sur des considérations théoriques ou expérimentales
      ; elle peut s'exprimer sous forme d'équation algébrique, de tableau numérique
      ou de graphe.
  - content: >-
      Lorsque le signal d'entrée varie en fonction du temps, la fonction de transfert
      (quotient de la transformée de Laplace du signal de sortie par la transformée
      de Laplace du signal d'entrée) est une forme de la caractéristique de transfert.
  terms:
  - type: expression
    normative_status: preferred
    designation: caractéristique de transfert
    grammar_info:
    - gender: f
date_accepted: '1984-01-01T00:00:00+00:00'
entry_status: valid
