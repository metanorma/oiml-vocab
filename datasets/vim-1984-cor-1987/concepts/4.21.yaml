data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      Pour une échelle donnée, étendue des valeurs d'échelle entre les repères
      extrêmes de l'échelle.
  id: 4.21-fra
  language_code: fra
  notes:
  - content: >-
      L'étendue d'échelle est exprimée en unité marquée sur l'échelle, quelle que
      soit l'unité de la grandeur à mesurer, et est normalement spécifiée par ses
      limites inférieure et supérieure, par exemple 100 °C à 200 °C.
  terms:
  - type: expression
    normative_status: preferred
    designation: étendue d'échelle
    grammar_info:
    - gender: f
