  definition:
  - content: Base scientifique d'une méthode de mesure.
  id: 2.05-fra
  language_code: fra
  examples:
  - content: a) l'effet thermoélectrique utilisé pour le mesurage de la température;
  - content: b) l'effet Josephson utilisé pour le mesurage de la tension électrique;
  - content: c) l'effet Doppler utilisé pour le mesurage de la vitesse.
