  definition:
  - content: The scientific basis of a method of measurement.
  id: 2.05-eng
  language_code: eng
  examples:
  - content: a) the thermoelectric effect applied to the measurement of temperature;
  - content: b) the Josephson effect applied to the measurement of voltage;
  - content: c) the Doppler effect applied to the measurement of velocity.
