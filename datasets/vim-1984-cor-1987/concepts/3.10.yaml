data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      Résultat d'un mesurage moins valeur (conventionnellement) vraie de la grandeur
      mesurée.
  id: 3.10-fra
  language_code: fra
  notes:
  - content: "Le terme s'applique également : à l'indication, au résultat brut, au résultat corrigé."
  - content: >-
      Les parties connues de l'erreur de mesure peuvent être compensées par l'application
      de corrections appropriées. L'erreur du résultat corrigé ne peut être caractérisée
      que par une incertitude.
  - content: >-
      Ne pas confondre « erreur absolue » qui est une grandeur algébrique et valeur
      absolue d'une erreur qui est le module d'une erreur.
  terms:
  - type: expression
    normative_status: preferred
    designation: erreur (absolue) de mesure
    grammar_info:
    - gender: f
date_accepted: '1984-01-01T00:00:00+00:00'
entry_status: valid
id: 6fd7a2ac-4fbe-4e51-9ff3-ee525debf6a0
