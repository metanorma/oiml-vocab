data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      The result of a measurement minus the (conventional) true value of the measurand.
  id: 3.10-eng
  language_code: eng
  notes:
  - content: >-
      The term relates equally to: the indication, the uncorrected result, the
      corrected result.
  - content: >-
      The known parts of the error of measurement may be compensated by applying
      appropriate corrections. The error of the corrected result can only be characterized
      by an uncertainty.
  - content: >-
      "Absolute error", which has a sign, should not be confused with absolute
      value of an error which is the modulus of an error.
  terms:
  - type: expression
    normative_status: preferred
    designation: (absolute) error of measurement
date_accepted: '1984-01-01T00:00:00+00:00'
entry_status: valid
id: 9b509d90-982b-4546-af00-77eff7c7e801
