  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      The coherent system of units adopted and recommended by the General Conference
      on Weights and Measures (CGPM).
  id: 1.10-eng
  language_code: eng
  notes:
  - content: >-
      The SI is based at present on the following seven base units: the metre,
      unit of length; the kilogram, unit of mass; the second, unit of time; the
      ampere, unit of electric current; the kelvin, unit of thermodynamic temperature;
      the mole, unit of amount of substance; the candela, unit of luminous intensity.
  terms:
  - type: expression
    normative_status: preferred
    designation: International System of Units, SI
date_accepted: '1984-01-01T00:00:00+00:00'
entry_status: valid
