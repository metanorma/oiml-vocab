data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      The range through which a stimulus can be varied without producing a change
      in the response of a measuring instrument.
  id: 5.14-eng
  language_code: eng
  notes:
  - content: >-
      The inherent dead band is sometimes deliberately increased to reduce unwanted
      change in the response for small changes in the stimulus.
  terms:
  - type: expression
    normative_status: preferred
    designation: dead band
