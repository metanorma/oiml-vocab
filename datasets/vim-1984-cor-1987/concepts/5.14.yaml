data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      Étendue à l'intérieur de laquelle un signal d'entrée peut être modifié sans
      provoquer de variation de la réponse d'un instrument de mesure.
  id: 5.14-fra
  language_code: fra
  notes:
  - content: >-
      La zone morte intrinsèque est parfois délibérément augmentée pour réduire
      les variations indésirables de la réponse aux petites variations du signal
      d'entrée.
  terms:
  - type: expression
    normative_status: preferred
    designation: zone morte
    grammar_info:
    - gender: f
