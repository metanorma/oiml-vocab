data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      A set of similar material measures or measuring instruments fulfilling, by
      their combined use, the role of a standard.
  id: 6.02-eng
  language_code: eng
  notes:
  - content: A collective standard is usually intended to provide a single value of a quantity.
  - content: >-
      The value provided by a collective standard is an appropriate mean of the
      values provided by the individual instruments.
  examples:
  - content: a) collective voltage standard consisting of a group of Weston cells;
  - content: >-
      b) collective standard of luminous intensity consisting of a group of similar
      incandescent lamps.
  terms:
  - type: expression
    normative_status: preferred
    designation: collective standard
date_accepted: '1984-01-01T00:00:00+00:00'
