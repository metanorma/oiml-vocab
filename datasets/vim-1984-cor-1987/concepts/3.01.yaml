data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: The value of a measurand obtained by measurement.
  id: 3.01-eng
  language_code: eng
  notes:
  - content: >-
      When the term "result of a measurement" is used, it should be made clear whether
      it refers to: the indication, the uncorrected result, the corrected result,
      and whether averaging over several observations is involved.
  - content: >-
      A complete statement of the result of a measurement includes information about
      the uncertainty of measurement and about the values of appropriate influence
      quantities.
  terms:
  - type: expression
    normative_status: preferred
    designation: result of a measurement
date_accepted: '1984-01-01T00:00:00+00:00'
