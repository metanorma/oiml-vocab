data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: A unit of measurement which does not belong to a given system of units.
  id: 1.14-eng
  language_code: eng
  examples:
  - content: >-
      a) the electronvolt (1,60219 × 10^-19 J) is an off-system unit of energy
      with respect to the SI;
  - content: b) day, hour, minute are off-system units of time with respect to the SI.
  terms:
  - type: expression
    normative_status: preferred
    designation: off-system unit (of measurement)
