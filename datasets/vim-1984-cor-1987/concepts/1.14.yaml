data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      Unité de mesure qui n'appartient pas à un système d'unités donné.
  id: 1.14-fra
  language_code: fra
  examples:
  - content: >-
      a) l'électronvolt (1,60219 × 10^-19 J) est une unité d'énergie hors système
      pour le SI;
  - content: >-
      b) le jour, l'heure, la minute sont des unités de temps hors système pour
      le SI.
  terms:
  - type: expression
    normative_status: preferred
    designation: "unité (de mesure) hors système"
    grammar_info:
    - gender: f
