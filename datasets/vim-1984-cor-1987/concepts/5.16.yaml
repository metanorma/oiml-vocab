  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      Aptitude d'un instrument de mesure à conserver ses caractéristiques métrologiques
      constantes.
  id: 5.16-fra
  language_code: fra
  notes:
  - content: >-
      La constance est habituellement considérée comme rapportée au temps. Lorsqu'elle
      est rapportée à une autre grandeur, il est nécessaire de le spécifier explicitement.
  terms:
  - type: expression
    normative_status: preferred
    designation: constance
