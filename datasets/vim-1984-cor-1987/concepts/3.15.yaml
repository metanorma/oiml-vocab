data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      The numerical factor by which the uncorrected result of a measurement is
      multiplied to compensate for an assumed systematic error.
  id: 3.15-eng
  language_code: eng
  notes:
  - content: >-
      Since the systematic error cannot be known exactly, the correction factor
      is subject to uncertainty.
  terms:
  - type: expression
    normative_status: preferred
    designation: correction factor
