data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      Facteur numérique par lequel on multiplie le résultat brut d'un mesurage pour
      compenser une erreur systématique présumée.
  id: 3.15-fra
  language_code: fra
  notes:
  - content: >-
      Puisque l'erreur systématique ne peut être connue exactement, le facteur de
      correction est entaché d'une incertitude.
  terms:
  - type: expression
    normative_status: preferred
    designation: facteur de correction
    grammar_info:
    - gender: m
