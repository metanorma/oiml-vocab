    type: accepted
  definition:
  - content: >-
      Ensemble d'étalons ayant des valeurs choisies spécialement pour reproduire
      individuellement ou par combinaison convenable une série de valeurs d'une
      grandeur sur une étendue donnée.
  id: 6.03-fra
  language_code: fra
  examples:
  - content: a) boîte de masses marquées;
  - content: b) jeu d'aréomètres couvrant des étendues contiguës de masses volumiques.
  terms:
  - type: expression
    normative_status: preferred
    designation: série d'étalons
