  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      A set of standards of specially chosen values which individually or in suitable
      combination reproduce a series of values of a quantity over a given range.
  id: 6.03-eng
  language_code: eng
  examples:
  - content: a) set of weights;
  - content: b) set of hydrometers covering contiguous ranges of density.
  terms:
  - type: expression
    normative_status: preferred
    designation: group standard
  - type: expression
    normative_status: admitted
    designation: series of standards
