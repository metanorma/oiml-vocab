data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      A reference material one or more of whose property values are certified by
      a technically valid procedure, accompanied by or traceable to a certificate
      or other documentation which is issued by a certifying body.
  id: 6.16-eng
  language_code: eng
  notes:
  - content: This definition is taken from ISO Guide 30-1981.
  terms:
  - type: expression
    normative_status: preferred
    designation: certified reference material
date_accepted: '1984-01-01T00:00:00+00:00'
