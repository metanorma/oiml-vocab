data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      Matériau de référence dont une ou plusieurs valeurs des propriétés sont certifiées
      par une procédure techniquement valide, ayant un certificat ou un autre document
      à cet effet, qui l'accompagne ou qui peut lui être rapporté, qui est délivré
      par un organisme de certification.
  id: 6.16-fra
  language_code: fra
  notes:
  - content: Cette définition provient du Guide ISO 30-1981.
  terms:
  - type: expression
    normative_status: preferred
    designation: matériau de référence certifié
    grammar_info:
    - gender: m
date_accepted: '1984-01-01T00:00:00+00:00'
entry_status: valid
