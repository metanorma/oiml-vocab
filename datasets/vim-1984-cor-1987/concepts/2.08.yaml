    type: accepted
  definition:
  - content: All the information, equipment and operations relevant to a given measurement.
  id: 2.08-eng
  language_code: eng
  notes:
  - content: >-
      This concept embraces all aspects relating to the performance and quality
      of the measurement; it includes for example the principle, method, procedure,
      values of the influence quantities and the measurement standards.
  terms:
  - type: expression
    normative_status: preferred
    designation: measurement process
