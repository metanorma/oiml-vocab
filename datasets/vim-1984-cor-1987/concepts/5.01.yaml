data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      For each scale range, the set of values of the measurand for which a measuring
      instrument gives values within that scale range at a particular setting of
      its controls.
  id: 5.01-eng
  language_code: eng
  notes:
  - content: >-
      The nominal range is expressed in units of the measurand, regardless of the
      units marked on the scale, and is normally stated in terms of its lower and
      upper limits, for example 100 °C to 200 °C. Where the lower limit is zero,
      the nominal range is commonly stated solely in terms of its upper limit,
      for example a nominal range of 0 V to 100 V is expressed as "100 V".
  terms:
  - type: expression
    normative_status: preferred
    designation: nominal range
date_accepted: '1984-01-01T00:00:00+00:00'
entry_status: valid
