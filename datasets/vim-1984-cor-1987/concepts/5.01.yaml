data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      Pour chaque étendue d'échelle, ensemble des valeurs de la grandeur mesurée
      pour lesquelles un instrument de mesure présente des valeurs à l'intérieur
      de cette étendue d'échelle, pour une position particulière de ses commandes.
  id: 5.01-fra
  language_code: fra
  notes:
  - content: >-
      Le calibre est exprimé en unités de la grandeur à mesurer, quelle que soit
      l'unité marquée sur l'échelle, et est normalement spécifié par ses limites
      inférieure et supérieure, par exemple 100 °C à 200 °C. Lorsque la limite
      inférieure est zéro, le calibre est habituellement spécifié par la seule
      limite supérieure, par exemple un calibre de 0 V à 100 V est appelé calibre
      de 100 V.
  terms:
  - type: expression
    normative_status: preferred
    designation: calibre
    grammar_info:
    - gender: m
date_accepted: '1984-01-01T00:00:00+00:00'
entry_status: valid
