data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      The value which characterizes a quantity perfectly defined, in the conditions
      which exist when that quantity is considered.
  id: 1.18-eng
  language_code: eng
  notes:
  - content: >-
      The true value of a quantity is an ideal concept and, in general, cannot
      be known exactly. Indeed, quantum effects may preclude the existence of
      a unique true value.
  terms:
  - type: expression
    normative_status: preferred
    designation: true value (of a quantity)
date_accepted: '1984-01-01T00:00:00+00:00'
entry_status: valid
