data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      The coefficient by which a direct indication must be multiplied to obtain
      the indication of a measuring instrument.
  id: 5.08-eng
  language_code: eng
  notes:
  - content: >-
      A measuring instrument in which the direct indication is equal to the value
      of the measurand has an instrument constant of 1.
  - content: >-
      Multi-range measuring instruments with a single scale have several instrument
      constants which correspond, for example, to different positions of a selector
      mechanism.
  - content: >-
      For some measuring instruments, the transformation from direct indication
      to indication may be more complex than a simple multiplication by an instrument
      constant.
  terms:
  - type: expression
    normative_status: preferred
    designation: instrument constant
date_accepted: '1984-01-01T00:00:00+00:00'
entry_status: valid
