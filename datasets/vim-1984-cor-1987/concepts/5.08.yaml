data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      Coefficient par lequel on doit multiplier une indication directe pour obtenir
      l'indication d'un instrument de mesure.
  id: 5.08-fra
  language_code: fra
  notes:
  - content: >-
      Un instrument de mesure pour lequel l'indication directe est égale à la valeur
      de la grandeur mesurée a une constante égale à 1.
  - content: >-
      Les instruments de mesure à calibres multiples et qui ne comportent qu'une
      seule échelle ont plusieurs constantes correspondant, par exemple, à différentes
      positions d'un mécanisme sélecteur.
  - content: >-
      Pour certains instruments de mesure, la transformation de l'indication directe
      en indication peut être plus complexe qu'une simple multiplication par une
      constante.
  terms:
  - type: expression
    normative_status: preferred
    designation: "(constante d'un instrument)"
    grammar_info:
    - gender: f
date_accepted: '1984-01-01T00:00:00+00:00'
entry_status: valid
