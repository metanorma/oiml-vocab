    type: accepted
  definition:
  - content: >-
      The property of a result of a measurement whereby it can be related to appropriate
      standards, generally international or national standards, through an unbroken
      chain of comparisons.
  id: 6.12-eng
  language_code: eng
  terms:
  - type: expression
    normative_status: preferred
    designation: traceability
