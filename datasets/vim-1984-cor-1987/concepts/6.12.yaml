data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      Propriété d'un résultat de mesure consistant à pouvoir le relier à des étalons
      appropriés, généralement internationaux ou nationaux, par l'intermédiaire
      d'une chaîne ininterrompue de comparaisons.
  id: 6.12-fra
  language_code: fra
  notes:
  - content: >-
      La manière dont s'effectue la liaison aux étalons est appelée « raccordement
      aux étalons ».
  terms:
  - type: expression
    normative_status: preferred
    designation: traçabilité
    grammar_info:
    - gender: f
