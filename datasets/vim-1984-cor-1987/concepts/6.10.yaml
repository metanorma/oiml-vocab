data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      Étalon utilisé comme intermédiaire pour comparer entre eux des étalons, des
      mesures matérialisées ou des appareils de mesure.
  id: 6.10-fra
  language_code: fra
  notes:
  - content: >-
      Lorsque le dispositif de comparaison n'est pas strictement un étalon, le
      terme dispositif de transfert devrait être utilisé.
  examples:
  - content: calibre ajustable utilisé pour l'intercomparaison d'étalons à bouts.
  terms:
  - type: expression
    normative_status: preferred
    designation: étalon de transfert
    grammar_info:
    - gender: m
date_accepted: '1984-01-01T00:00:00+00:00'
entry_status: valid
