data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      A standard used as an intermediary to compare standards, material measures
      or measuring instruments.
  id: 6.10-eng
  language_code: eng
  notes:
  - content: >-
      When the comparison device is not strictly a standard, the term transfer
      device should be used.
  examples:
  - content: adjustable callipers used to intercompare end standards.
  terms:
  - type: expression
    normative_status: preferred
    designation: transfer standard
date_accepted: '1984-01-01T00:00:00+00:00'
entry_status: valid
id: 5d93697b-c045-4e7d-8afe-eca6fe904a1a
