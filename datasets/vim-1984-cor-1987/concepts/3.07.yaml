data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      Étroitesse de l'accord entre les résultats des mesurages du même mesurande,
      dans le cas où les mesurages individuels sont effectués en faisant varier
      les conditions telles que : méthode de mesure, observateur, instrument de
      mesure, lieu, conditions d'utilisation, temps.
  id: 3.07-fra
  language_code: fra
  notes:
  - content: >-
      Pour qu'une expression de la reproductibilité soit valable, il est nécessaire
      de spécifier les conditions que l'on fait varier.
  - content: >-
      La reproductibilité peut s'exprimer quantitativement par une caractéristique
      de dispersion des résultats.
  terms:
  - type: expression
    normative_status: preferred
    designation: reproductibilité des mesurages
    grammar_info:
    - gender: f
date_accepted: '1984-01-01T00:00:00+00:00'
entry_status: valid
