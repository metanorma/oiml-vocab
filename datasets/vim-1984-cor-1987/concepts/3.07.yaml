data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      The closeness of the agreement between the results of measurements of the
      same measurand, where the individual measurements are carried out changing
      conditions such as: method of measurement, observer, measuring instrument,
      location, conditions of use, time.
  id: 3.07-eng
  language_code: eng
  notes:
  - content: A valid statement of reproducibility requires specification of the conditions changed.
  - content: >-
      Reproducibility may be expressed quantitatively in terms of the dispersion
      of the results.
  terms:
  - type: expression
    normative_status: preferred
    designation: reproducibility of measurements
date_accepted: '1984-01-01T00:00:00+00:00'
entry_status: valid
