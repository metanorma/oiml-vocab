  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      Appareil de mesure qui fournit un enregistrement (permanent ou semi-permanent)
      de la valeur d'une grandeur mesurée ou d'une valeur qui lui est reliée.
  id: 4.07-fra
  language_code: fra
  notes:
  - content: >-
      L'enregistrement peut être analogique (ligne continue ou discontinue) ou
      numérique.
  - content: Les valeurs de plusieurs grandeurs peuvent être enregistrées simultanément.
  - content: >-
      Un appareil de mesure enregistreur peut aussi comporter un dispositif indicateur.
  examples:
  - content: a) barographe;
  - content: b) dosimètre thermoluminescent.
  terms:
  - type: expression
    normative_status: preferred
    designation: "appareil (de mesure) enregistreur"
    grammar_info:
    - gender: m
