  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      The distance between any two successive scale marks measured along the same
      line as the scale length.
  id: 4.23-eng
  language_code: eng
  notes:
  - content: >-
      Scale spacing is expressed in units of length, regardless of the units of
      the measurand or the units marked on the scale.
  terms:
  - type: expression
    normative_status: preferred
    designation: scale spacing
