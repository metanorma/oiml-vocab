data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      A device or substance which indicates the presence of a particular quantity
      without necessarily providing its value.
  id: 4.16-eng
  language_code: eng
  notes:
  - content: >-
      In some cases, an indication may be produced only when the value of the quantity
      reaches a given threshold.
  examples:
  - content: a) halogen leak detector;
  - content: b) temperature-sensitive paint.
  terms:
  - type: expression
    normative_status: preferred
    designation: detector
date_accepted: '1984-01-01T00:00:00+00:00'
