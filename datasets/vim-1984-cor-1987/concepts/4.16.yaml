data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      Dispositif ou substance qui indique la présence d'une grandeur particulière
      sans nécessairement donner sa valeur.
  id: 4.16-fra
  language_code: fra
  notes:
  - content: >-
      Dans certains cas, on peut n'avoir une indication que lorsque la valeur de
      la grandeur atteint un seuil donné.
  examples:
  - content: a) détecteur de fuite à halogène;
  - content: b) peinture sensible à la température.
  terms:
  - type: expression
    normative_status: preferred
    designation: détecteur
    grammar_info:
    - gender: m
date_accepted: '1984-01-01T00:00:00+00:00'
