  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      A unit of measurement of a derived quantity in a given system of quantities.
  id: 1.12-eng
  language_code: eng
  notes:
  - content: >-
      In a given system of units, a derived unit can be expressed in terms of base
      units and proportionality factors.
  - content: >-
      Some derived units have special names and symbols; for example, in the SI:
      newton (N), unit of force; joule (J), unit of energy; volt (V), unit of
      electric potential.
  terms:
  - type: expression
    normative_status: preferred
    designation: derived unit (of measurement)
date_accepted: '1984-01-01T00:00:00+00:00'
entry_status: valid
