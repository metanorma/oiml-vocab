    type: accepted
  definition:
  - content: >-
      A component of the error of measurement which, in the course of a number
      of measurements of the same measurand, varies in an unpredictable way.
  id: 3.12-eng
  language_code: eng
  notes:
  - content: It is not possible to correct for random error.
  terms:
  - type: expression
    normative_status: preferred
    designation: random error
