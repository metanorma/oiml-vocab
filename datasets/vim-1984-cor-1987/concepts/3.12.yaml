    type: accepted
  definition:
  - content: >-
      Composante de l'erreur de mesure qui, lors de plusieurs mesurages du même
      mesurande, varie d'une façon imprévisible.
  id: 3.12-fra
  language_code: fra
  notes:
  - content: On ne peut pas tenir compte de l'erreur aléatoire par application d'une correction.
  terms:
  - type: expression
    normative_status: preferred
    designation: erreur aléatoire
