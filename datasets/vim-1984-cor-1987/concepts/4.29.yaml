  definition:
  - content: >-
      That part of an indicating device, fixed or moving, which carries the scale
      or scales.
  id: 4.29-eng
  language_code: eng
  notes:
  - content: >-
      In some indicating devices, the dial takes the form of drums or discs bearing
      numbers and moving relative to a fixed index or window.
