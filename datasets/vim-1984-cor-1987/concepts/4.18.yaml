  definition:
  - content: >-
      The fixed or movable part of an indicating device whose position with reference
      to the scale marks enables an indicated value to be determined.
  id: 4.18-eng
  language_code: eng
  examples:
  - content: a) pointer;
  - content: b) luminous spot;
  - content: c) liquid surface;
  - content: d) recording pen.
  terms:
  - type: expression
    normative_status: preferred
    designation: index
