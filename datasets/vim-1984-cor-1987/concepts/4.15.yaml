  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      The element of a measuring instrument or measuring chain to which a measurand
      is directly applied.
  id: 4.15-eng
  language_code: eng
  examples:
  - content: a) thermocouple of a thermoelectric thermometer;
  - content: b) rotor of a turbine flow meter;
  - content: c) Bourdon tube of a pressure gauge;
  - content: d) float of a level measuring instrument.
  terms:
  - type: expression
    normative_status: preferred
    designation: sensor
