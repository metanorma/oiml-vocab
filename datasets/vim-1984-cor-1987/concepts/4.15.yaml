  definition:
  - content: >-
      Élément d'un appareil de mesure ou d'une chaîne de mesure auquel est directement
      appliquée une grandeur à mesurer.
  id: 4.15-fra
  language_code: fra
  examples:
  - content: a) thermocouple d'un thermomètre thermoélectrique;
  - content: b) rotor d'un débitmètre à turbine;
  - content: c) tube Bourdon d'un manomètre;
  - content: d) flotteur d'un appareil de mesure de niveau.
