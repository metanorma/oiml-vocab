  definition:
  - content: >-
      Étroitesse de l'accord entre le résultat d'un mesurage et la valeur (conventionnellement)
      vraie de la grandeur mesurée.
  id: 3.05-fra
  language_code: fra
  notes:
  - content: L'emploi du terme précision au lieu d'exactitude doit être évité.
