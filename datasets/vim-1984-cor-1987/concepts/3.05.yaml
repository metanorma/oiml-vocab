  definition:
  - content: >-
      The closeness of the agreement between the result of a measurement and the
      (conventional) true value of the measurand.
  id: 3.05-eng
  language_code: eng
  notes:
  - content: The use of the term precision for accuracy should be avoided.
  terms:
  - type: expression
    normative_status: preferred
    designation: accuracy of measurement
