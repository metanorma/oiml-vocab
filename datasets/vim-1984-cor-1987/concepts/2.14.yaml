data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      A method of measurement in which the value of a measurand is obtained by
      measurement of other quantities functionally related to the measurand.
  id: 2.14-eng
  language_code: eng
  examples:
  - content: a) measurement of a pressure by measurement of the height of a column of liquid;
  - content: b) measurement of a temperature using a resistance thermometer.
  terms:
  - type: expression
    normative_status: preferred
    designation: indirect method of measurement
date_accepted: '1984-01-01T00:00:00+00:00'
