data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      Propriété d'un instrument de mesure dont la réponse à un signal d'entrée
      donné dépend de la séquence des signaux d'entrée précédents.
  id: 5.15-fra
  language_code: fra
  notes:
  - content: >-
      Bien que l'hystérésis soit normalement considérée comme étant en relation
      avec la grandeur à mesurer, elle peut aussi l'être avec les grandeurs d'influence.
  terms:
  - type: expression
    normative_status: preferred
    designation: hystérésis
    grammar_info:
    - gender: f
date_accepted: '1984-01-01T00:00:00+00:00'
