data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      Grandeur dont l'expression en fonction des grandeurs de base d'un système
      donné présente tous ses exposants nuls.
  id: 1.05-fra
  language_code: fra
  examples:
  - content: >-
      la dilatation linéique relative, le facteur de frottement, l'indice de réfraction
      sont des grandeurs sans dimension dans le système de grandeurs l, m, t.
  terms:
  - type: expression
    normative_status: preferred
    designation: grandeur sans dimension
    grammar_info:
    - gender: f
