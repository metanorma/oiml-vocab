data:
  dates:
  - date: '1968-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: 'Pour une mesure matérialisée : valeur stem:[bar(nu_c) - nu_n] que l''on
      doit ajouter algébriquement à la dénomination (ou valeur nominale) stem:[nu_n]
      de la mesure matérialisée pour la faire coïncider avec la valeur conventionnellement
      vraie stem:[bar(nu_c)] de cette mesure. Pour un appareil mesureur : valeur stem:[v_c
      - bar(v_i)] que l''on doit ajouter algébriquement à la valeur moyenne stem:[bar(v_i)]
      des indications de l''instrument (supposées obtenues sans erreur de lecture)
      pour la faire coïncider avec la valeur conventionnellement vraie stem:[v_c]
      de la grandeur mesurée.'
  examples:
  - content: Dans l'exemple relatif au point 9.5.1 la correction de justesse est stem:[+0.08
      mu"A"].
  id: 9.5.3-fra
  notes:
  - content: La correction de justesse d'un instrument de mesurage est égale à l'erreur
      de justesse changée de signe.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Correction de justesse
