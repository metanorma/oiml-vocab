  definition:
  - content: Grandeur définie dans un système de grandeurs comme étant une fonction
      des grandeurs de base de ce système.
  examples:
  - content: La force stem:[F], définie dans le système de grandeurs stem:[l, m, t] par l'équation
      stem:[F = m * ((d^2 l)/(d t^2))] L'intensité du champ magnétique
      stem:[H] à une distance stem:[r] d'un conducteur rectiligne parcouru par un courant stem:[I],
      dans le système rationalisé des grandeurs stem:[l, m, t, I], définie par l'équation
      stem:[H = I / (2 pi r)].
