    type: accepted
  definition:
  - content: Partie de l'erreur du mesurage indirect d'une grandeur qui résultat de
      l'erreur commise sur une grandeur composante.
  examples:
  - content: 'Dans les exemples du 8.1.4 les expressions : stem:[(partial F)/(partial
      X_1) Delta X_1, (partial F)/(partial X_2) Delta X_2, ..., (partial F)/(partial
      X_m) Delta X_m] ou stem:[(partial F)/(partial X_1) s_1, (partial F)/(partial
      X_2) s_2, ..., (partial F)/(partial X_m) s_m] représentent les erreurs systématiques
      partielles ou les écarts moyens quadratiques partiels du mesurage direct des
      grandeurs stem:[X_1, X_2, ..., X_m].'
