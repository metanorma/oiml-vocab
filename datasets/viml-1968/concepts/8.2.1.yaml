  - date: '1968-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: Différence stem:[nu_n - nu_e] entre la valeur nominale stem:[nu_n] et
      la valeur conventionnelle vraie stem:[nu_e] reproduite par la mesure matérialisée.
  examples:
  - content: 'Dans l''exemple relatif au point 8.2.5 : stem:[e_i = nu_n - nu_c = 1000
      "ml" - 1005 "ml" = -5 "ml"] la dénomination est donc trop petite par rapport
      à la valeur vraie de la mesure.'
  id: 8.2.1-fra
  notes:
  - content: Voir 5.3 remarque 1.
  - content: Si aucune confusion n'est à craindre, on utilise l'expression simplifiée
      « erreur d'une mesure matérialisée ».
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Erreur d'une mesure matérialisée
