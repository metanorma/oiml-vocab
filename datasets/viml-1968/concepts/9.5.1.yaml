data:
  dates:
  - date: '1968-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: Somme algébrique (résultante) des erreurs systématiques entachant l'indication
      d'un instrument de mesurage dans des conditions déterminées d'emploi.
  examples:
  - content: 'Si un courant électrique est mesuré avec un microampèremètre et si les
      10 valeurs suivantes en microampères ont été trouvées : 6.27 ; 6.38 ; 6.62 ;
      6.18 ; 6.31 ; 6.43 ; 6.36 ; 6.00 ; 6.35 ; 6.50 ; la moyenne arithmétique de
      ces valeurs est : stem:[bar(v)_i = (6.27 + 6.38 + 6.62 + ... + 6.50)/(10) =
      6.34 mu"A" ("valeurs indiquées")] et en mesurant le même courant par une méthode
      beaucoup plus précise, on a obtenu : stem:[v_a = 6.42 mu"A"] (valeur conventionnellement
      vraie) l''erreur de justesse du microampèremètre est égale à : stem:[e_j = v_i
      - v_a = 6.34 - 6.42 = -0.08 mu"A"].'
  id: 9.5.1-fra
  notes:
  - content: 'Pratiquement, on détermine l''erreur de justesse stem:[e_j] d''une
      mesure matérialisée comme étant la différence entre sa valeur nominale stem:[v_n]
      et la moyenne arithmétique stem:[bar(v_0)] des valeurs vraies conventionnelles
      de la mesure matérialisée trouvées comme résultats d''une série de mesurages
      consécutifs, effectués dans les conditions usuelles d''emploi : stem:[e_j =
      v_n - bar(v_0)] De la même façon, on détermine l''erreur de justesse d''un instrument
      mesureur comme étant la différence entre la moyenne arithmétique stem:[bar(v)_i]
      des indications données par l''instrument dans une série de mesurages consécutifs
      d''une même grandeur, effectués dans les conditions usuelles d''emploi, et la
      valeur conventionnellement vraie stem:[v_a] de la grandeur mesurée : stem:[e_j
      = bar(v)_i - v_a]'
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Erreur de justesse
