  - date: '1968-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: Variation relative des indications de l'appareil mesureur ou des valeurs
      vraies de la mesure matérialisée lorsque sa température varie de stem:[1^\circ
      "C"].
  examples:
  - content: Si le coefficient de température d'un manomètre à ressort (dont la température
      de référence est stem:[20^\circ "C"]) est par exemple stem:[8 * 10^{-4} circ"C"^{-1}]
      et si l'instrument est utilisé à la température stem:[30^\circ "C"], son indication
      est affectée d'une erreur (dans ce cas en plus) de 0.8 %.
  id: 8.2.6.2.1-fra
