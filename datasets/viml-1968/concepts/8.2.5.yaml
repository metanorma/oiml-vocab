data:
  dates:
  - date: '1968-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: Différence stem:[nu_c - nu_n] entre la valeur conventionnellement vraie
      stem:[nu_a] reproduite par la mesure matérialisée et la valeur nominale stem:[nu_n]
      de cette mesure.
  examples:
  - content: Une mesure de capacité contient stem:[nu_0 = 1005 "ml"] et sa dénomination
      est « 1 litre », soit stem:[nu_n = 1000 "ml"], l'erreur de calibrage de cette
      mesure est égale à stem:[e = 1005 "ml" - 1000 "ml" = -5 "ml"], la valeur vraie
      de la mesure étant trop grande par rapport à sa dénomination.
  id: 8.2.5-fra
  notes: []
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Erreur de calibrage d'une mesure matérialisée
