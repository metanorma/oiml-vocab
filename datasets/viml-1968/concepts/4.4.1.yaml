data:
  dates:
  - date: '1968-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: Équation dans laquelle les symboles littéraux représentent des valeurs
      numériques correspondant aux unités de mesure utilisées.
  examples:
  - content: 'stem:[v_{m//s} = (pi)/(60) d_m omega_{t//m}] est une équation entre valeurs
      numériques pour la vitesse linéaire stem:[v] d''un point situé sur un cercle
      de diamètre stem:[d] tournant autour de son centre avec la vitesse angulaire
      stem:[omega] valable pour les unités suivantes stem:[v] en mètre par seconde,
      stem:[d] en mètre, stem:[omega] en tour par minute.'
  - content: On peut présenter l'équation ci-dessus aussi sous la forme stem:[{v}
      = (pi)/(60) {d} {omega}] où stem:[{v}] est la valeur numérique de stem:[v] pour
      l'unité m/s, stem:[{d}] est la valeur numérique de stem:[d] pour l'unité m, stem:[{omega}]
      est la valeur numérique de stem:[omega] pour l'unité t/min.
  id: 4.4.1-fra
  notes:
  - content: L'équation entre valeurs numériques, pour les unités d'un système cohérent
      d'unités de mesure, peut être considérée aussi comme une équation entre grandeurs.
  - content: Pour éliminer des malentendus, il serait désirable d'utiliser dans les
      équations entre valeurs numériques des symboles différents de ceux utilisés
      dans les équations entre grandeurs.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Équation entre valeurs numériques
