    type: accepted
  definition:
  - content: A transaction (selling or buying) of quantities of liquids whose settlement
      is associated with indications provided by a measuring system, any of the parties
      having access to the place of measurement and one of them being a consumer.
  examples: []
  id: r81-1998-e-3.35-eng
  notes:
  - content: The consumer can be any person. Generally, the consumer is the buyer
      but he can also be the seller.
