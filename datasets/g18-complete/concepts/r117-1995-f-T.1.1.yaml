  definition:
  - content: Instrument destine a mesurer de facon continue, a memoriser et a afficher
      le volume de liquide qui le traverse dans les conditions de mesure.
  examples: []
  id: r117-1995-f-T.1.1-fra
  notes:
  - content: Un compteur est constitue au moins d un transducteur de volume, d un
      calculateur (y compris les dispositifs d ajustage et de correction si presents)
      et d un dispositif indicateur.
