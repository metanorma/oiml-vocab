  definition:
  - content: Etendue des débits massiques ou des concentrations de l'échantillon d'essai
      dans le gaz porteur pour laquelle sa sensibilité reste constante dans une plage
      de 5 %. Elle est exprimée par le rapport entre la limite de détction et la limite
      supérieure de linéarité (voir Figure 1).
