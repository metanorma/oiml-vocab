  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Instrument indiquant la masse apparente qui est sensible aux forces de
      gravité, poussée de l'air, et composante verticale de l'interaction magnétique
      entre le poids et la balance et/ou l'environnement.
  examples: []
  id: r111-2004-e-2.2-fra
  notes:
  - content: Si les effets magnétiques sont négligeables et que la balance est étalonnée
      avec des poids de référence dont la valeur est bien connue, la balance peut
      être utilisée pour indiquer la masse conventionnelle d'un corps sous des conditions
      choisies de manière conventionnelle.
