data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: défaut plus grand que la valeur spécifiée dans la présente Recommandation
      (voir 4.4.1)
  examples: []
  id: r59-1-2016-fra-2.3.14-fra
  notes:
  - content: 'La présente Recommandation peut indiquer que les défauts suivants ne
      sont pas significatifs même quand ils excèdent la valeur définie au point 4.4.1
      : (a) défauts provenant de causes simultanées et mutuellement indépendantes
      (par exemple champs électromagnétiques et décharges) dans un instrument ou dans
      ses systèmes de contrôle; (b) défauts rendant impossible l''accomplissement
      de tout mesurage ; (c) défauts transitoires provenant de variations momentanées
      de l''indication, qui ne peuvent être interprétées, mises en mémoire ou transmises
      comme un résultat de mesurage; (d) défauts provoquant des variations du résultat
      de mesurage suffisamment importantes pour être identifiées par tous ceux intéressés
      par le résultat du mesurage ; la Recommandation applicable peut spécifier la
      nature de ces variations.'
  sources: []
