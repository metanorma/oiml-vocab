    type: accepted
  definition:
  - content: The length of the strain sensitive section of a strain gauge in the measurement
      axis direction. An approximation of this length is the distance between the
      inside of the strain gauge end loops. Since the "true" gauge length is not known,
      gauge length may be measured by other geometries (such as the outside of the
      end loops) providing that the deviation is defined.
