  definition:
  - content: Un thermometre clinique electrique qui calcule la temperature maximale
      d'une sonde en contact avec une cavite ou un tissu du corps, sans attendre l'equilibre
      thermique, en utilisant des donnees de transfert de chaleur et un algorithme
      mathematique.
