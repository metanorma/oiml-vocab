  definition:
  - content: Parametre d'application legale avec une valeur qui depend seulement du
      modele d'instrument. Les parametres d'application legale sont une partie du
      logiciel d'application legale. Ils sont fixes lors de l'approbation de modele
      de l'instrument.
  examples:
  - content: Parametres utilises pour le calcul de la masse, l'analyse de la stabilite
      ou le calcul du prix ou de l'arrondi, l'identification du logiciel.
