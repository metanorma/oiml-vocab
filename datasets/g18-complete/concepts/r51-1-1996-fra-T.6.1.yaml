  definition:
  - content: Essai effectué sur un instrument complet en utilisant une ou des charges
      d'essai du type prévu pour le pesage, et en faisant usage du convoyeur de charges
      ou du système de transport de la charge pour amener celle-ci sur le récepteur
      de charge et l'en enlever.
