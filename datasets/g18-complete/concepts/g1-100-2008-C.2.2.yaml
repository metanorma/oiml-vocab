    type: accepted
  definition:
  - content: a variable that may take any of the values of a specified set of values
      and with which is associated a probability distribution
  examples: []
  id: g1-100-2008-e-C.2.2-eng
  notes:
  - content: A random variable that may take only isolated values is said to be "discrete".
      A random variable which may take any value within a finite or infinite interval
      is said to be "continuous".
  - content: The probability of an event A is denoted by Pr(A) or P(A).
