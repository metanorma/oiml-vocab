  definition:
  - content: variable pouvant prendre n'importe quelle valeur d'un ensemble déterminé
      de valeurs, et à laquelle est associée une loi de probabilité
  examples: []
  id: g1-100-2008-f-C.2.2-fra
  notes:
  - content: Une variable aléatoire qui ne peut prendre que des valeurs isolées est
      dite «discrète». Une variable aléatoire qui peut prendre toutes valeurs à l'intérieur
      d'un intervalle fini ou infini est dite «continue».
  - content: La probabilité d'un événement A est notée Pr(A) ou P(A).
  - content: 'Source citation: ISO 3534- 1'
