  definition:
  - content: cellule de pesée capable de remplir les fonctions décrites au point «
      cellule de pesée analogique passive » (3.1.3.1) et qui utilise également des
      composantes électroniques actives
  examples: []
  id: r60-1-2017-fra-3.1.3.2-fra
  notes:
  - content: Ce type de cellule de pesée peut utiliser les composantes électroniques
      actives pour obtenir une représentation électronique de la valeur du mesurande,
      une compensation active de la température, et des fonctions similaires influençant
      la valeur du mesurande.
