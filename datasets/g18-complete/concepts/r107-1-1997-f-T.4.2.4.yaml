  definition:
  - content: Différence entre l'erreur d'indication et l'erreur intrinsèque d'un instrument
      de pesage.
  examples: []
  id: r107-1-1997-f-T.4.2.4-fra
  notes:
  - content: Principalement, un défaut est le résultat d'un changement indésirable
      de l'information contenue ou transitant dans un instrument électronique.
  - content: De cette définition il résulte que, dans la présente Recommandation,
      un "défaut" est une valeur numérique.
