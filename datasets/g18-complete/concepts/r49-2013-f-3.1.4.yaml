    type: accepted
  definition:
  - content: partie du compteur qui transforme les signaux de sortie provenant du
      ou des transducteur(s) de mesure et, éventuellement, des instruments de mesure
      associés et, le cas échéant, mémorise les résultats dans la mémoire jusqu'à
      ce qu'ils soient utilisés
  examples: []
  id: r49-2013-f-3.1.4-fra
  notes:
  - content: La pignonnerie est considérée comme le calculateur d'un compteur mécanique.
  - content: Le calculateur peut être capable de communiquer dans les deux sens avec
      les dispositifs auxiliaires.
