data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Non-automatic weighing instrument mounted on or incorporated into a vehicle.
  examples:
  - content: Postal scale mounted on a vehicle (mobile post office).
  - content: Garbage weighers, patient lifters, pallet lifters, fork lifters, wheel
      chair weighers.
  id: r76-2006-e-T.1.2.11-eng
  notes:
  - content: A vehicle-mounted instrument is a complete weighing instrument which
      is firmly mounted on a vehicle, and which is designed for that special purpose.
  - content: A vehicle-incorporated instrument uses parts of the vehicle for the weighing
      instrument.
  sources:
  - origin:
      ref:
        source: OIML R 76:2006
        version: '2006'
    locality:
