  definition:
  - content: Part of the ALG that receives the output signals from the transducer
      and, if applicable, from ancillary devices and/or other devices, processes them
      and, if appropriate, stores the results in memory until they are used. In addition,
      the calculator may be capable of communicating both ways with other devices.
