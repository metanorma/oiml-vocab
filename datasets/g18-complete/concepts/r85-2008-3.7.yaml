  definition:
  - content: Partie du JA qui reçoit les signaux en provenance du (des) transducteur(s)
      et, le cas échéant, des dispositifs auxiliaires et/ou d'autres dispositifs,
      les traite et, si approprié, met en mémoire les résultats jusqu'à leur utilisation.
      De plus, le calculateur peut être capable de communiquer de façon bidirectionnelle
      avec d'autres dispositifs.
