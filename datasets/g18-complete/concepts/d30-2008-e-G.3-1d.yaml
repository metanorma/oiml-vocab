    type: accepted
  definition:
  - content: Any Authority that is responsible for issuing Certificates within a specified
      system of legal metrology control.
  examples: []
  id: d30-2008-e-G.3-1d-eng
  notes:
  - content: In the case of type evaluation, an Issuing Authority may be a national
      Type Approval Body and/or, for the implementation of the OIML Mutual Acceptance
      Arrangement (MAA), an OIML Issuing Authority according to 2.13 of OIML B 3 and
      3.11 of B 10-1.
