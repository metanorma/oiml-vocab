  definition:
  - content: Dispositif qui permet de prédéterminer la quantité à mesurer et qui arrête
      automatiquement le débit du liquide à la fin du mesurage de la quantité prédéterminée.
      La valeur prédéterminée peut être le volume, la masse ou le prix à payer correspondant.
