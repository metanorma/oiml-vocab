data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Instrument necessitant l'intervention d'un operateur au cours du processus
      de pese pour decider que le resultat de la pese est acceptable.
  examples: []
  id: r76-2006-f-T.1.2-fra
  notes:
  - content: Decider que le resultat de la pese est acceptable comprend toute action
      intelligente de l'operateur qui modifie le resultat, tel que prendre une action
      quand l'indication est stable ou ajuster la masse de la charge pese, et prendre
      une decision concernant l'acceptation de chaque resultat de pese en observant
      l'indication ou declencher une impression. Le fonctionnement d'un instrument
      de pesage non automatique permet a l'operateur de prendre une action (c'est
      a dire ajuster la charge, ajuster le prix unitaire, decider que la charge est
      acceptable, etc.) qui modifie le resultat de la pese dans le cas ou le resultat
      de la pese n'est pas acceptable.
  - content: Dans le cas ou il existe un doute pour determiner si un instrument est
      un instrument de pesage non automatique ou un instrument de pesage automatique,
      les definitions pour les instruments de pesage automatique, donnees dans les
      Recommandations OIML R50, R 51, R 61, R 106, R 107 et R 134, prevalent sur les
      criteres de la Note 1 ci-dessus.
  - content: Dans cette Recommandation un instrument de pesage non automatique est
      appele un « instrument ».
