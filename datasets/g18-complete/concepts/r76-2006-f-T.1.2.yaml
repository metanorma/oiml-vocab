data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Instrument that requires the intervention of an operator during the weighing
      process to decide that the weighing result is acceptable.
  examples: []
  id: r76-2006-f-T.1.2-eng
  notes:
  - content: Deciding that the weighing result is acceptable includes any intelligent
      action by the operator that affects the result, such as taking an action when
      an indication is stable or adjusting the mass of the weighed load, and to make
      a decision regarding the acceptance of each weighing result on observing the
      indication or releasing a print out. A non-automatic weighing process allows
      the operator to take an action (i.e. adjust the load, adjust the unit price,
      determine that the load is acceptable, etc.) which influences the weighing result
      in the case where the weighing result is not acceptable.
  - content: In case of doubt as to whether an instrument is a non-automatic weighing
      instrument or an automatic weighing instrument, the definitions for automatic
      weighing instruments given in OIML Recommendations R 50, R 51, R 61, R 106,
      R 107 and R 134 have higher priority than the criteria of Note 1 above.
  - content: In this Recommendation a non-automatic weighing instrument is called
      an "instrument".
