  definition:
  - content: Différence entre les indications du signal de sortie d'une cellule de
      pesée pour une même charge appliquée, les indications étant obtenues l'une en
      partant de la charge minimale et en augmentant la charge, l'autre en partant
      de la charge maximale et en diminuant la charge.
