data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Partie identifiable d'un instrument remplissant une ou plusieurs fonctions
      spécifiques, et pouvant être examinée séparément suivant des exigences métrologiques
      et techniques spécifiques de la Recommandation applicable. Les modules d'un
      instrument de pesage font l'objet de limites d'erreurs partielles spécifiées.
  examples: []
  id: r76-1-2006-fra-T.2.2-fra
  notes:
  - content: 'Les modules typiques d''un instrument de pesage sont : cellule de pesée,
      indicateur, dispositif analogique ou numérique de traitement de données, module
      de pesage, terminal, indicateur primaire.'
  - content: Des certificats OIML indépendants, suivant la R 76, peuvent être édités
      pour les modules indiqués en T.2.2.2-T.2.2.7.
