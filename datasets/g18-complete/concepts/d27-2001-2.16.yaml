    type: accepted
  definition:
  - content: Contrôle s'appliquant à la fabrication, l'importation, l'installation,
      l'utilisation, la maintenance et la réparation des instruments de mesure, effectué
      afin de vérifier s'ils sont utilisés de manière correcte vis-à-vis de l'observation
      des lois et règlements de métrologie.
  examples: []
  id: d27-2001-f-2.16-fra
  notes:
  - content: La surveillance métrologique comprend le contrôle de la correction des
      quantités indiquées sur et contenues dans les préemballages.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: Surveillance métrologique
