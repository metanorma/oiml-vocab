  - content: Relación entre el valor r.m.s del contenido armónico y el valor r.m.s
      del término fundamental.
  examples: []
  id: r46-1-spa-2.2.13-spa
  notes:
  - content: El contenido de armónico se obtiene, por ejemplo, substrayendo el término
      fundamental a una cantidad alterna no sinusoidal.
  - content: Por lo general, el factor de distorsión se expresa como un porcentaje.
      Es equivalente a THD, siglas en inglés para distorsión armónica total.
