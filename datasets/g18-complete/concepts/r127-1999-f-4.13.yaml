  definition:
  - content: Étroitesse de l'accord entre les résultats de mesurages successifs du
      même échantillon effectués dans les mêmes conditions et dans un laps de temps
      relativement court.
  examples: []
  id: r127-1999-f-4.13-fra
  notes:
  - content: On entend par "les mêmes conditions", les mêmes méthode de mesure, instrument
      de mesure, opérateur, lieu et conditions environnementales.
