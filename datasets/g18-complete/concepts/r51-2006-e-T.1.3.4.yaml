  definition:
  - content: Complete instrument that is firmly mounted on a vehicle, and that is
      designed for that special purpose.
  examples: []
  id: r51-2006-e-T.1.3.4-eng
  notes:
  - content: For example, a garbage weigher (waste collecting vehicle) that determines
      the quantity of loose material emptied from a container (supported by the load
      receptor) into the body of the vehicle.
