  definition:
  - content: The target area is that part of a plane perpendicular to the optical
      axis at the target distance, the image of which just covers the pyrometer detector
      (or the field diaphragm, if any). The diameter of the target area determines
      the minimum dimensions of an object whose temperature can be measured by the
      pyrometer within limits of permissible errors.
