  definition:
  - content: Grandeur d'influence dont une valeur se situe dans les limites spécifiées
      par la présente Recommandation mais en dehors des conditions assignées de fonctionnement
      spécifiées du compteur d'eau.
  examples: []
  id: r49-1-2003-fra-2.4.3-fra
  notes:
  - content: Une grandeur d'influence est une perturbation si pour cette grandeur
