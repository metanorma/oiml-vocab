  definition:
  - content: The Strouhal number is a dimensionless parameter that is relevant to
      the separated flow past the bluff body(ies). It relates the measured vortex
      shedding frequency to the fluid velocity and the bluff body characteristic dimension.
      In practice the K-factor, which is not dimensionless, replaces the Strouhal
      number as the significant parameter.
