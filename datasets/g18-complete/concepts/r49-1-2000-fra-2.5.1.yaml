  examples: []
  id: r49-1-2000-fra-2.5.1-fra
  notes:
  - content: Un dispositif électronique tel que défini ci-dessus, peut consister en
      un compteur complet ou en une partie de compteur, en particulier, comme ceux
      mentionnés de 2.1 à 2.1.5 et en 2.1.8. Un dispositif électronique est habituellement
      fabriqué en tant qu'unité séparée et peut être essayé indépendamment.
