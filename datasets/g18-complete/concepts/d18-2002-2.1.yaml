  definition:
  - content: Matériau ou substance dont une (ou plusieurs) valeur(s) de la (des) propriété(s)
      est (sont) suffisamment homogène(s) et bien définie(s) pour permettre de l'utiliser
      pour l'etalonnage d'un appareil, l'évaluation d'une méthode de mesurage ou l'attribution
      de valeurs aux matériaux.
