  definition:
  - content: Combinaison d'une source de rayonnements ionisants et de l'instrumentation
      associée, produisant une dose absorbée ou des taux de dose absorbée, uniformes
      et reproductibles, en des points spécifiés d'un matériau spécifique. La dose
      absorbée doit être raccordable aux étalons nationaux ou internationaux.
