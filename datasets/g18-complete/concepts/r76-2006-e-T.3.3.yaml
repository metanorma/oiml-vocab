  definition:
  - content: Le rapport de réduction d'un dispositif transmetteur de charge est égal
      à $ R = F_{\mathrm{M}} / F_{\mathrm{L}} $ où $F_{\mathrm{M}}$ est la force agissant
      sur le dispositif mesureur de charge, et $F_{\mathrm{L}}$ est la force agissant
      sur le récepteur de charge.
