  definition:
  - content: The reduction ratio of a load transmitting device is $ R = F_{\mathrm{M}}
      / F_{\mathrm{L}} $ where $F_{\mathrm{M}}$ is the force acting on the load measuring
      device, and $F_{\mathrm{L}}$ is the force acting on the load receptor.
