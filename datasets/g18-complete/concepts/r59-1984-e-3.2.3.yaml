  definition:
  - content: The name "correction table" is given to any system - table, graph, abacus
      or slide rule - used for the determination of the moisture content from the
      value indicated by the moisture meter, when this indicated value is altered
      by an influence quantity which is not automatically taken into account by the
      moisture meter (for example, temperature of the sample).
