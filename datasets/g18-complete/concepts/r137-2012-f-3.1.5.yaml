  definition:
  - content: Partie du compteur qui reçoit les signaux de sortie du ou des transducteur(s)
      et, éventuellement, des instruments de mesure associés, les traite et, le cas
      échéant, mémorise les résultats jusqu'à leur utilisation. De plus, le calculateur
      peut être capable de communiquer avec les dispositifs complémentaires dans les
      deux sens.
