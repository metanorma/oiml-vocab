  - content: Elemento escrito, impreso o gráfico adherido, aplicado, unido, soplado,
      formado, moldeado, repujado, colocado, incluido o que pertenece o acompaña un
      preempacado que contiene cualquier producto para propósitos de colocación de
      la marca, identificación o suministro de cualquier información con respecto
      al producto o al contenido del preempacado.
