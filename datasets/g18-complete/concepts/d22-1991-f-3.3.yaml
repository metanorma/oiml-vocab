  definition:
  - content: Matériau de référence dont une ou plusieurs valeurs des propriétés sont
      certifiées par une procédure techniquement valide, ayant un certificat ou autre
      document à cet effet, qui l'accompagne ou qui peut lui être rapporté, qui est
      délivré par un organisme de certification.
