data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: quand T est une fonction des valeurs observées telle que, theta étant
      un paramètre de la population à estimer, la probabilité Pr(T >= theta) [ou la
      probabilité Pr(T <= theta)] soit au moins égale à (1 - alpha) [où (1 - alpha)
      est un nombre fixé, positif et inférieur à 1], l'intervalle s'étendant depuis
      la plus petite valeur de theta jusqu'à T (ou l'intervalle s'étendant de T jusqu'à
      la plus grande valeur possible de theta) est un intervalle de confiance unilatéral
      à (1 - alpha) pour theta
  examples: []
  id: g1-100-2008-f-C.2.28-fra
  notes:
  - content: La limite T de l'intervalle de confiance est une statistique qui, comme
      telle, aura généralement des valeurs différentes d'échantillon en échantillon.
  - content: 'Source citation: ISO 3534- 1'
