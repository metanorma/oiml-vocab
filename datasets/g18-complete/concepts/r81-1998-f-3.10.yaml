data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Dispositif connecte ou incorpore au compteur pour corriger automatiquement
      le volume dans les conditions de mesurage, en tenant compte du debit et/ou des
      caracteristiques du liquide a mesurer (viscosite, temperature, pression, etc.)
      et des courbes d'etalonnage predeterminees.
  examples: []
  id: r81-1998-f-3.10-fra
  notes:
  - content: Les caracteristiques du liquide peuvent etre, soit mesurees en utilisant
      des instruments de mesure associes, soit mises en memoire dans l'instrument.
  sources:
  - origin:
      ref:
        source: OIML R 81:1998
        version: '1998'
    locality:
      type: clause
      reference_from: '3.10'
    type: authoritative
  terms:
  - type: expression
    normative_status: preferred
    designation: dispositif de correction
  language_code: fra
  entry_status: valid
