data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: A device connected to or incorporated in the meter for automatically
      correcting the volume in metering conditions, by taking account of the flowrate
      and/or the characteristics of the liquid to be measured (viscosity, temperature,
      pressure, etc.) and pre-established calibration curves.
  examples: []
  id: r81-1998-f-3.10-eng
  notes:
  - content: The characteristics of the liquid may either be measured using associated
      measuring instruments, or stored in a memory within the instrument.
  sources:
  - origin:
      ref:
        source: OIML R 81:1998
        version: '1998'
    locality:
      type: clause
      reference_from: '3.10'
    type: authoritative
  terms:
  - type: expression
    normative_status: preferred
    designation: correction device
  language_code: eng
  entry_status: valid
