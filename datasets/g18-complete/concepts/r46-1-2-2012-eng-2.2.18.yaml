data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: extreme value of measurement error, with respect to a known reference
      quantity value, permitted by specifications or regulations for a given measurement,
      measuring instrument or measuring system
  examples: []
  id: r46-1-2-2012-eng-2.2.18-eng
  notes:
  - content: Usually, the term "maximum permissible errors" or "limits of errors"
      is used where there are two extreme values.
  - content: The term "tolerance" should not be used to designate "maximum permissible
      error".
  - content: In this Recommendation, the maximum permissible error is a combination
      of the base maximum permissible error and the maximum permissible error shift
      as described in Annex B.
  - content: For the application of this Recommendation, "specifications or regulations"
      means the provisions contained in this Recommendation, and the terms "measuring
      instrument" and "measuring system" mean electricity meter.
