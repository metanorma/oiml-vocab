  definition:
  - content: Paramètre d'application légale avec une valeur qui dépend de l'instrument
      particulier. De tels paramètres comprennent des paramètres d'étalonnage (par
      exemple, réglages de la pente ou corrections) et des paramètres de configuration
      (par exemple, portée maximale, portée minimale, unités de mesure, etc.). Ils
      sont réglables ou sélectionnables seulement dans un mode de fonctionnement spécial
      de l'instrument.
