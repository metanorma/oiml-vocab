data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: fault, the magnitude of which is greater than one-fifth of the magnitude
      of the maximum permitted error for the length measured
  examples: []
  id: r35-2-2011-eng-2.16-eng
  notes:
  - content: The following faults are considered not to be significant, even when
      they exceed the value defined above - a) faults arising from simultaneous and
      mutually independent causes in the electronic device; b) faults implying the
      impossibility to perform any measurement; c) transitory faults being momentary
      variations in the indication, which cannot be interpreted, memorized or transmitted
      as a measurement result; d) faults giving rise to variations in the measurement
      results so serious that they are bound to be noticed by all those interested
      in the result of the measurement.
  sources:
