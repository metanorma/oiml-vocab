  definition:
  - content: Valeur maximale de la différence, en plus ou en moins, autorisée par
      la réglementation, entre l'indication d'un instrument et la valeur vraie correspondante,
      déterminée par référence à des masses ou poids étalons, l'instrument étant préalablement
      à zéro à charge nulle et en position de référence.
