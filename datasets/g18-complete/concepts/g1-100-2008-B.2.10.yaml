data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: grandeur qui n'est pas le mesurande mais qui a un effet sur le résultat
      du mesurage
  examples:
  - content: Température d'un micromètre lors de la mesure d'une longueur.
  - content: Fréquence lors de la mesure de l'amplitude d'une tension électrique alternative.
  - content: Concentration en bilirubine lors de la mesure de la concentration en
      hémoglobine dans un échantillon de plasma sanguin humain.
  id: g1-100-2008-f-B.2.10-fra
  notes:
  - content: La définition de la grandeur d'influence doit se comprendre comme incluant
      les valeurs associées aux étalons, aux matériaux de référence, et aux données
      de référence, valeurs dont peut dépendre le résultat d'un mesurage, aussi bien
      que les phénomènes tels que les fluctuations à court terme de l'instrument de
      mesure et les grandeurs telles que la température ambiante, la pression atmosphérique
      et l'humidité.
  sources:
