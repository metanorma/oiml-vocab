  definition:
  - content: Closeness of the agreement between the results of successive measurements
      of the same measurand carried out under the same conditions of measurement.
  examples: []
  id: r107-1-2007-eng-T.3.9-eng
  notes:
  - content: For an instrument, this is its ability to provide weighing results that
      agree one with the other under the same or constant operating conditions.
