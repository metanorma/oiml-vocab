  definition:
  - content: 'Conditions auxquelles le volume mesuré de gaz est converti (exemples:
      température de base et pression de base).'
  examples: []
  id: r137-1-2-2012-fra-3.2.19-fra
  notes:
  - content: Les conditions de fonctionnement et de base concernent le volume de gaz
      à mesurer ou seulement à indiquer et ne doivent pas être confondues avec "les
      opérations assignées de fonctionnement" et "les conditions de référence" (VIM
      4.9 et 4.11) qui font référence aux grandeurs d'influence.
