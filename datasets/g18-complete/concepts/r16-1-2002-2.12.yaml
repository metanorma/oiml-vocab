    type: accepted
  definition:
  - content: Technique par laquelle des sons (appelés sons de Korotkoff) sont entendus
      à travers une artère comprimée lorsque la pression de compression diminue lentement,
      l'apparition des sons coïncidant, chez les adultes, avec la pression sanguine
      systolique et leur disparition avec la pression sanguine diastolique. Chez les
      enfants de moins de 13 ans, "k4" (c'est-à-dire le son de Korotkoff de 4ème phase)
      peut être approprié.
