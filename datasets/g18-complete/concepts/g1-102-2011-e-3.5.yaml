  definition:
  - content: vector quantity with complex components
  examples:
  - content: 'A complex vector quantity $ Z $ containing N complex quantities $ Z_{1},\dots,Z_{N}
      $ expressed as a matrix of dimension $ N\times1 $: $\boldsymbol {Z} = \left[
      \begin{array}{c} \boldsymbol {Z} _ {1} \\ \vdots \\ \boldsymbol {Z} _ {N} \end{array}
      \right] = \left(\boldsymbol {Z} _ {1}, \dots , \boldsymbol {Z} _ {N}\right)
      ^ {\top}.$'
