  - content: cellule de pesée dont le signal de sortie fournit soit des données mesurables
      soit des informations directes représentant la valeur du mesurande
  examples: []
  id: r60-2017-f-3.1.3.1-fra
  notes:
  - content: Le rapport entre le signal de sortie et le signal d'entrée peut être
      réglable et ce type de cellule de pesée peut utiliser des composantes électroniques
      passives (telles que des jauges de contrainte), et des éléments de compensation
      de température passifs
