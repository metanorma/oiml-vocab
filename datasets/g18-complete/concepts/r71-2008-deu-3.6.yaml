  definition:
  - content: Schnittpunkt der vertikalen Messachse mit der Oberseite der Tauchpeilplatte
      oder mit der Unterseite des Behälters, wenn eine Tauchpeilplatte nicht vorhanden
      ist. Er stellt den Ursprung für die Messung von Flüssigkeitsständen dar (Nullbezugspunkt
      oder Tauchbezugspunkt).
