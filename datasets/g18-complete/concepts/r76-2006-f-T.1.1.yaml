data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Instrument de mesure servant a determiner la masse d'un corps en utilisant
      l'action de la pesanteur sur ce corps.
  examples: []
  id: r76-2006-f-T.1.1-fra
  notes:
  - content: Dans cette Recommandation « masse » (ou « valeur du poids ») est utilisee
      de preference dans le sens de « masse conventionnelle » ou « valeur conventionnelle
      du resultat de pesage dans l'air » selon la R 111 et le D 28, tandis que « poids
      » est utilise de preference pour la representation (c'est a dire la mesure materielle)
      de la masse qui est reglementee au regard de ses caracteristiques physiques
      et metrologiques.
  - content: L'instrument peut aussi etre utilise pour determiner d'autres grandeurs,
      quantites, parametres ou caracteristiques lies a la masse.
  - content: Suivant la nature de son fonctionnement, un instrument de pesage est
      classe en instrument de pesage a fonctionnement automatique ou en instrument
      de pesage a fonctionnement non automatique.
  sources:
