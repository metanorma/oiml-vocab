  definition:
  - content: partie du compteur d'eau recevant les signaux de sortie en provenance
      du (des) transducteur(s) et, si possible, des instruments de mesure associés,
      les transformant et, si approprié, mettant en mémoire les résultats jusqu'à
      leur utilisation
  examples: []
  id: r49-1-2000-fra-2.1.4-fra
  notes:
  - content: De plus, le calculateur peut être doté de systèmes de communication en
      émission et réception avec les dispositifs auxiliaires.
