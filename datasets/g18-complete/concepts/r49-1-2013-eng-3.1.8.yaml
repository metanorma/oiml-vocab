data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: device intended to perform a specific function, directly involved in
      elaborating, transmitting or displaying measured values
  examples: []
  id: r49-1-2013-eng-3.1.8-eng
  notes:
  - content: For the definition of "measured value", see OIML V 2-200:2012 (VIM) [1],
      2.10.
  - content: 'The main ancillary devices are: zero-setting device; price-indicating
      device; repeating indicating device; printing device; memory device; tariff
      control device; pre-setting device; self-service device; flow sensor movement
      detector; remote reading device.'
  - content: Depending on national legislation, ancillary devices may be subject to
      legal metrological control.
