  definition:
  - content: Mesure de la capacite du spectrometre a separer deux raies spectrales
      adjacentes. Ce terme est couramment utilise pour indiquer la plus petite distance
      entre deux raies spectrales adjacentes qu'il est possible de distinguer l'une
      de l'autre.
