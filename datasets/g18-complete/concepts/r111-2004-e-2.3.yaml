data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Ensemble des opérations établissant, dans des conditions spécifiées,
      la relation entre les valeurs des grandeurs indiquées par un appareil de mesure
      ou un système de mesure, ou les valeurs représentées par une mesure matérialisée
      ou par un matériau de référence, et les valeurs correspondantes réalisées par
      des étalons.
  examples: []
  id: r111-2004-e-2.3-fra
  notes:
  - content: Le résultat d'un étalonnage permet soit d'attribuer aux indications les
      valeurs correspondantes du mesurande, soit de déterminer les corrections à appliquer
      aux indications.
  - content: Un étalonnage peut aussi servir à déterminer d'autres propriétés métrologiques
      telles que les effets de grandeurs d'influence.
  - content: Le résultat d'un étalonnage peut être consigné dans un document parfois
      appelé certificat d'étalonnage ou rapport d'étalonnage.
  - content: 'Source citation: VIM:1993, definition 6.11'
