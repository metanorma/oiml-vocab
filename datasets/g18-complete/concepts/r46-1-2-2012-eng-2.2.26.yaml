  definition:
  - content: operating condition that must be fulfilled during measurement in order
      that a measuring instrument or measuring system perform as designed
  examples: []
  id: r46-1-2-2012-eng-2.2.26-eng
  notes:
  - content: Rated operating conditions generally specify intervals of values for
      a quantity being measured and for any influence quantity.
  - content: For the application of this Recommendation, the terms "measuring instrument"
      and "measuring system" mean electricity meter.
