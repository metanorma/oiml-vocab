  definition:
  - content: Cellule de pesée utilisant un ensemble de composants électroniques et
      ayant par elle-même une fonction qui lui est reconnue.
  examples:
  - content: 'Exemples de dispositifs électroniques: jonction p-n, amplificateur,
      encodeur, convertisseur analogique/numérique, unité centrale de traitement (CPU),
      interface d''Entrées/Sorties (I/O), etc. (à l''exception des circuits relais
      des jauges de contrainte).'
