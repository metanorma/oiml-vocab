  definition:
  - content: Dispositif qui permet de vérifier, avant le démarrage ou après l'arrêt,
      que l'ensemble ou la partie de l'ensemble de mesurage est tout à fait rempli
      de liquide (pour les ensembles de mesurage fonctionnant flexible plein) ou tout
      à fait vide de liquide (pour les ensembles de mesurage fonctionnant vide).
