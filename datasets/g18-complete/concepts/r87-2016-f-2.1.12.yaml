  definition:
  - content: tous les éléments du préemballage qui ne sont pas des matériaux d'emballage
  examples: []
  id: r87-2016-f-2.1.12-fra
  notes:
  - content: Le produit inclut des liquides ou des gaz qui ont été mis avec le produit
      dans le préemballage et qui ne sont pas destinés à être laissés après utilisation
      du produit (par ex. l'air dans la mousse au chocolat).
