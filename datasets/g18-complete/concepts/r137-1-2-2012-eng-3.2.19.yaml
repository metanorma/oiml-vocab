  definition:
  - content: 'Conditions to which the measured volume of gas is converted (examples:
      base temperature and base pressure).'
  examples: []
  id: r137-1-2-2012-eng-3.2.19-eng
  notes:
  - content: Operating and base conditions relate to the volume of gas to be measured
      or indicated only and should not be confused with "rated operating conditions"
      and "reference conditions" (VIM 4.9 and 4.11) which refer to influence quantities.
