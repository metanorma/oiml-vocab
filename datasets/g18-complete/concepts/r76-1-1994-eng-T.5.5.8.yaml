data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: A durability error greater than e.
  examples: []
  id: r76-1-1994-eng-T.5.5.8-eng
  notes:
  - content: A durability error can be due to mechanical wear and tear or due to drift
      and ageing of electronic parts. The concept of significant durability error
      applies only to electronic parts.
  - content: For a multi-interval instrument, the value of e is that appropriate to
      the partial weighing range.
  - content: 'The following are not considered to be significant durability errors,
      even when they exceed e: errors occurring after a period of instrument use that
      are clearly the result of a failure of a device/component, or of a disturbance
      and for which the indication cannot be interpreted, memorized, or transmitted
      as a measurement result, or implies the impossibility to perform any measurement,
      or is so obviously wrong that it is bound to be noticed by all those interested
      in the result of measurement.'
  sources:
  - origin:
