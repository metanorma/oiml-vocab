  definition:
  - content: Augmentation du signal de température obtenue en soumettant chacune des
      sondes de température d'une paire à une dissipation continue de puissance de
      5 mW, lorsque celles-ci sont immergées à la profondeur minimale d'immersion
      dans un bain d'eau, la vitesse moyenne de circulation de l'eau étant de 0,1
      m/s.
