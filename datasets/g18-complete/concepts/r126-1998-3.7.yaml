  definition:
  - content: Mode de l'ethylometre pour lequel seuls certains circuits sont sous tension
      afin d'economiser l'energie et/ou de prolonger la duree de vie d'un composant,
      tout en permettant d'atteindre le mode mesure plus rapidement qu'a partir de
      l'etat de hors tension generale.
