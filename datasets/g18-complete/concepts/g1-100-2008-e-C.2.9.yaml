data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: For a discrete random variable X taking the values x_i with the probabilities
      p_i, the expectation, if it exists, is mu = E(X) = sum p_i x_i, the sum being
      extended over all the values x_i which can be taken by X. For a continuous random
      variable X having the probability density function f(x), the expectation, if
      it exists, is mu = E(X) = integral x f(x) dx, the integral being extended over
      the interval(s) of variation of X.
