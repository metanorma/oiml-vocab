data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Rapport entre la variation unitaire de résistance de l'extensomètre,
      due à une déformation, et le mesurande.
  examples: []
  id: r62-1985-f-9-fra
  notes:
  - content: 'Le facteur de jauge est sans dimension et s''exprime comme suit: K =
      (R - R0) / R0 / ((L - L0) / L0) = dR / R0 / e, où K est le facteur de jauge,
      R est la résistance de l''extensomètre pour la déformation d''essai, R0 est
      la résistance de l''extensomètre pour une déformation nulle ou de référence,
      L est la longueur de la structure d''essai sous l''extensomètre pour la déformation
      d''essai, L0 est la longueur de la structure d''essai sous l''extensomètre pour
      une déformation nulle ou de référence, dR est la variation de résistance de
      l''extensomètre quand la déformation varie de zéro (ou de la valeur de référence)
      jusqu''à la valeur d''essai, e est la déformation mécanique (L-L0)/L0.'
  sources:
