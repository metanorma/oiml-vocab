  - content: différence entre les indications du signal de sortie d'une cellule de
      pesée pour une même force appliquée, une indication étant obtenue en augmentant
      la charge à partir de la charge minimale (D_min) et l'autre indication étant
      obtenue en diminuant la charge à partir de la charge maximale (D_max)
