  definition:
  - content: Procédure ou exigence particulière entrant dans l'accomplissement de
      l'un des objectifs d'un service de métrologie légale. Ainsi, l'essai de modèle
      peut être un élément d'un système de contrôle métrologique; la vérification
      périodique peut en être un autre, etc.
