  definition:
  - content: Set of operations required to ensure that an item of measuring and test
      equipment is in compliance with requirements for its intended use.
  examples: []
  id: d27-2001-e-2.7-eng
  notes:
  - content: Metrological confirmation normally includes calibration, any necessary
      adjustment or repair and subsequent recalibration, as well as any required sealing
      and labeling.
  - content: In this Document, this term is referred to as "confirmation".
