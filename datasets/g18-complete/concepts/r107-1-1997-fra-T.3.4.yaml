  - content: Valeur de la plus petite charge en vrac qui puisse être totalisée sans
      dépassement de l'erreur maximale tolérée lorsque l'opération automatique est
      constituée de charges discrètes, chacune à l'intérieur de l'étendue de pesage
      en fonctionnement automatique.
