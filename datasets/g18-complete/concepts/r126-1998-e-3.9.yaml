    type: accepted
  definition:
  - content: A device for adjusting the EBA using, as a standard, a mixture of gases
      having a relative humidity of at least 90 % and a temperature of 34 degC +/-1
      degC. The mixture of air and ethanol passes through the entire gas analysis
      train, starting with the mouthpiece, in the direction normally taken by exhaled
      air.
  examples: []
  id: r126-1998-e-3.9-eng
  notes:
  - content: Adjustment using a dry gas is possible provided that the difference of
      effect between wet and dry gases is known or can be automatically corrected.
