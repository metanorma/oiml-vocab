    type: accepted
  definition:
  - content: Maß der Übereinstimmung zwischen den Ergebnissen aufeinanderfolgender
      Lederflächenmessungen, die unter veränderten Messbedingungen durchgeführt wurden.
  examples: []
  id: r136-1-2004-deu-T.4.10-deu
  notes:
  - content: 'Solche Änderungen können sein: anderes Lederflächenmessgerät (z. B.
      Verwendung eines mechanischen oder elektronischen Anschlagrades, etc.); anderes
      Ledermaterial; anderer Bediener; anderer Ort; und andere Zeit.'
  sources:
