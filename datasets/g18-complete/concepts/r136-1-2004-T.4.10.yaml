  definition:
  - content: Closeness of the agreement between the results of successive leather
      area measurements carried out under changed conditions of measurement.
  examples: []
  id: r136-1-2004-eng-T.4.10-eng
  notes:
  - content: 'The changed conditions may include: leather-measuring instrument (e.g.
      use of a mechanical or electronic pinwheel, etc.); leather material; operator;
      location; and time.'
