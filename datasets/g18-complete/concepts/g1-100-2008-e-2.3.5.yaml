data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: quantity defining an interval about the result of a measurement that
      may be expected to encompass a large fraction of the distribution of values
      that could reasonably be attributed to the measurand
  examples: []
  id: g1-100-2008-e-2.3.5-eng
  notes:
  - content: The fraction may be viewed as the coverage probability or level of confidence
      of the interval.
  - content: To associate a specific level of confidence with the interval defined
      by the expanded uncertainty requires explicit or implicit assumptions regarding
      the probability distribution characterized by the measurement result and its
      combined standard uncertainty. The level of confidence that may be attributed
      to this interval can be known only to the extent to which such assumptions may
      be justified.
  - content: Expanded uncertainty is termed overall uncertainty in paragraph 5 of
      Recommendation INC-1 (1980).
