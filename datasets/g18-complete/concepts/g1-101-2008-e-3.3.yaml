  definition:
  - content: derivative, when it exists, of the distribution function $g _ {X} (\xi)
      = \mathrm {d} G _ {X} (\xi) / \mathrm {d} \xi$
  examples: []
  id: g1-101-2008-e-3.3-eng
  notes:
  - content: $ g_{X}(\xi)\mathrm{d}\xi $ is the "probability element" $g _ {X} (\xi)
      \mathrm{d} \xi = \Pr (\xi < X < \xi + \mathrm{d} \xi).$
