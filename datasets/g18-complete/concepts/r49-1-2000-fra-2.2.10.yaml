    type: accepted
  definition:
  - content: défaut dont la valeur est supérieure à la moitié de l'erreur maximale
      tolérée dans la "zone supérieure"
  examples: []
  id: r49-1-2000-fra-2.2.10-fra
  notes:
  - content: 'Source citation: adapté de D 11, T.9'
  - content: Ne sont pas considérés comme défauts significatifs - les défauts résultant
      de causes simultanées et mutuellement indépendantes dans le compteur d'eau lui-même
      ou dans son système de contrôle; et les défauts transitoires consistant en des
      variations momentanées de l'indication qui ne peut être interprétée, mémorisée
      ou transmise en tant que résultat de mesure.
