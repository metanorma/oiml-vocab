    type: accepted
  definition:
  - content: third party attestation related to a conformity assessment body conveying
      formal demonstration of its competence to carry out specific conformity assessment
      tasks
  examples: []
  id: d1-2012-e-3.1.14-eng
  notes:
  - content: The national accreditation system, in general, is a voluntary system
      which establishes the competence and impartiality of calibration laboratories
      to perform traceable calibrations and measurements, testing laboratories, inspection
      bodies, and certification bodies which perform product certification, quality
      systems certification or certification of personnel. Not all countries have
      a national accreditation system. If it exists, it should be recognized by the
      appropriate authorities.
