  definition:
  - content: Dispositif electronique d'un instrument qui effectue la conversion analogique-numerique
      du signal de sortie de la cellule de pese, ensuite traite les donnees, et fournit
      le resultat du pesage sous forme numerique a travers une interface numerique
      sans l'afficher. Il peut en option avoir une ou deux touches (ou souris, ecran
      tactile, etc.) pour commander l'instrument.
