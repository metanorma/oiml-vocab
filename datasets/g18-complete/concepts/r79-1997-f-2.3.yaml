data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Toute mention écrite, imprimée ou graphique, fixée, appliquée, attachée
      à, obtenue par dépolissage sur, formée sur ou moulée dans, gravée dans, ou apparaissant
      sur un préemballage contenant un produit dans le but de marquer, identifier
      ou donner toute information relative au produit ou au contenu du préemballage;
      cependant, une fiche de contrôle ou autre information non promotionnelle fixée
      ou apparaissant sur un produit ne doit pas être considérée comme étant un étiquetage
      devant porter les informations exigées par la présente Recommandation.
