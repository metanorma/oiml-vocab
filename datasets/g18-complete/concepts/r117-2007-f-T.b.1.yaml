  definition:
  - content: Ensemble de mesurage routier délivrant des mélanges de richesses diverses
      d'un même produit ou des mélanges de plus d'un produit au travers d'un unique
      robinet d'extrémité; exemple pour les essences (distributeur multi-indices)
      et les mélanges d'essence et d'huile de lubrification (mélangeur essence-huile).
