data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: cumulative measuring process with no definite end that cannot be stopped
      and continued again by a user or an operator without falsifying the result of
      the measurement
  examples: []
  id: d31-2019-e-3.1.42-eng
  notes:
  - content: 'Examples include: a) continuous totalising automatic weighing instrument,
      b) heat meter.'
  - content: See also interruptible cumulative measurement (3.1.23).
