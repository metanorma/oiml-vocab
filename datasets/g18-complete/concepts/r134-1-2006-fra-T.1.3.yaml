  definition:
  - content: Instrument de pesage à fonctionnement automatique ayant un récepteur
      de charge (T.2.3), et des tabliers (T.2.2.1), qui détermine la masse du véhicule
      (T.3.1.5), les charges par essieu (T.3.1.8), et si applicable les charges par
      groupe d'essieux (T.3.1.11) d'un véhicule routier pendant que ce véhicule passe
      au-dessus du récepteur de charge de l'instrument de pesage.
