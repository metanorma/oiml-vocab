  definition:
  - content: Todo aquello en el preempacado, que no corresponde a material de empaque.
  examples: []
  id: r87-2016-spa-2.1.12-spa
  notes:
  - content: Un producto incluye líquidos o gases colocados en el preempacado junto
      con el producto y que no están previstos para ser desechados después del uso
      del producto (por ejemplo, el aire en un mousse de chocolate).
