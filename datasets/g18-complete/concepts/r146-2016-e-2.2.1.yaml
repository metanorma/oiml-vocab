data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: performance characteristic of a calibration assessed at reference conditions
  examples: []
  id: r146-2016-e-2.2.1-eng
  notes:
  - content: The assessment requires calculation of $ \overline{y} $ , the bias over
      a set of test samples or the 'calibration bias', and the standard error of prediction
      (SEP) which is the standard deviation of measurement errors from the same sample
      set. Refer to R 146-2, Annex A, A.7.1 for the calculation of $ \overline{y}
      $ and SEP from measured values. The limiting values for $ \overline{y} $ and
      SEP in 4.5, Table 4 shall be observed in order to deem a calibration as sufficiently
      accurate.
