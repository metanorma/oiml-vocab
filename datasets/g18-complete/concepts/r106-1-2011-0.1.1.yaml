data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: measuring instrument used to determine the mass of a body by using the
      action of gravity on the body
  examples: []
  id: r106-1-2011-eng-0.1.1-eng
  notes:
  - content: In this Recommendation "mass" (or "weight value") is preferably used
      in the sense of "conventional mass" or "conventional value of the result of
      weighing in air" according to OIML R111 [5] and OIML D28 [6], whereas "weight"
      is preferably used for an embodiment (= material measure) of mass that is regulated
      in regard to its physical and metrological characteristics. According to its
      method of operation, a weighing instrument is classified as an automatic or
      non-automatic instrument.
