  definition:
  - content: a straight or curved section of the road, where the measured vehicle
      was driving during the measurement
  examples: []
  id: r91-1-2025-eng-3.1.13-eng
  notes:
  - content: Its starting and end points are defined such that the measured speed
      value refers to the average speed on the measurement section.
  - content: In a manual measurement, the measured vehicle drives on the measurement
      section after the measurement is triggered. In an automatic measurement, the
      measured vehicle exits the measurement section at the trigger line.
