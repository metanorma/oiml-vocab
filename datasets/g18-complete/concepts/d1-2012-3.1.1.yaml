  definition:
  - content: any legislative text adopted by, or by virtue of, government and/or parliament
      decision
  examples: []
  id: d1-2012-e-3.1.1-eng
  notes:
  - content: Legal documents may be primary legislation (for example named treaty,
      law or act) or secondary legislation (for example named decree, decision or
      regulation).
  - content: '"Legal document" is sometimes referred to as "Legal instrument".'
