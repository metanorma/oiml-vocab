  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Tout texte de loi adopté par ou en vertu d'un État et/ou d'une décision
      parlementaire
  examples: []
  id: d1-2012-f-3.1.1-fra
  notes:
  - content: Les documents légaux peuvent être une législation primaire (par exemple,
      un traité ou une loi donnés) ou une législation secondaire (par exemple un décret,
      une décision ou une réglementation donnés).
  - content: Un « document légal » est parfois appelé « instrument légal ».
  sources:
