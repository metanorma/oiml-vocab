data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Se denomina continua cuando consiste en un proceso de medición acumulativo
      sin interrupción cuyo final no está definido. Un usuario u operador no puede
      detener y reanudar de nuevo el proceso de medición sin que en consecuencia pueda
      perturbar inadmisiblemente la medida o el suministro de productos o energía.
      Se denomina discontinua si la medición acumulativa de la magnitud de una sustancia
      puede detenerse fácil y rápidamente durante el funcionamiento normal sin falsificar
      el resultado de medición.
