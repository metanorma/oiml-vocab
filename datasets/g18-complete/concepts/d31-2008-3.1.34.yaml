data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Un mesurage non-interruptible est un processus de mesure cumulatif continu
      sans fin définie. Le processus de mesure ne peut être stoppé et poursuivi ultérieurement
      par l'utilisateur ou opérateur sans perturber inacceptablement le mesurage ou
      l'approvisionnement en bien ou énergie. Si le mesurage cumulatif de la quantité
      d'une substance peut être aisément et rapidement arrêté en opération normale
      sans falsifier les résultats de mesure, alors le mesurage est dénommé interruptible.
  examples: []
