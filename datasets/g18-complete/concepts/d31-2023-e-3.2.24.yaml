data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: "(mathematical) function which maps data of arbitrary size into data
      of a fixed size called a digest"
  examples: []
  id: d31-2023-e-3.2.24-eng
  notes:
  - content: A "good" hash function is such that the results of applying the function
      to a (large) set of values in the domain will be evenly distributed (and apparently
      at random) over the range.
  - content: 'A cryptographic hash function has three additional properties: collision
      resistance, preimage resistance, and second preimage resistance, where preimage
      resistance refers to the inability (computational infeasibility) to reconstruct
      a preimage or message from a message digest.'
  - content: 'Source citation: adapted from [ISO/IEC 9594-8:2017, 3]'
