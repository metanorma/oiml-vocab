  definition:
  - content: Différence entre l'erreur d'indication et l'erreur intrinsèque d'un instrument
      de pesage.
  examples: []
  id: r134-1-2003-f-T.4.2.4-fra
  notes:
  - content: Principalement, un défaut est le résultat d'un changement non désiré
      de données contenues dans ou transitant par un instrument électronique.
  - content: De la définition, il s'ensuit que dans la présente Recommandation, un
      "défaut" est une valeur numérique.
