  definition:
  - content: The ratio of the maximum amount of sample (below the saturation level
      of the mass spectrometer) that can be introduced into the gas chromatograph/mass
      spectrometer and measured, to the minimum detectable amount. It depends on the
      gas chromatograph column type (packed or open tubular) used and the mass spectrometer
      mode of operation (selected ion monitoring or scanning).
