data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: interval containing the value of a quantity with a stated probability,
      based on the information available
  examples: []
  id: g1-101-2008-e-3.12-eng
  notes:
  - content: A coverage interval is sometimes known as a credible interval or a Bayesian
      interval.
  - content: Generally there is more than one coverage interval for a stated probability.
  - content: A coverage interval should not be termed 'confidence interval' to avoid
      confusion with the statistical concept [GUM:1995 6.2.2].
  - content: This definition differs from that in the VIM, 3rd Edition (2008), since
      the term 'true value' has not been used in this Supplement, for reasons given
      in the GUM [GUM:1995 E.5].
