data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: The term "calibration" with respect to measuring containers, is used
      to describe all operations carried out for the purpose of determining the capacity
      of these measuring containers, corresponding to one or more filling levels.
      This procedure can be assimilated to initial verification.
  examples: []
  id: d3-1979-e-5.1.3-eng
  notes:
  - content: Containers used for storage, transport or delivery of a liquid, can be
      used for measuring this liquid, where these containers are specially adapted
      to the application for which they are intended, and possess the metrological
      qualities as required by regulation. These containers are then designated "measuring
      containers".
