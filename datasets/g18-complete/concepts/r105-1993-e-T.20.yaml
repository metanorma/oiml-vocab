data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: For masses equal to or greater than the minimum measured quantity, a
      fault greater than one-fifth of the absolute value of the maximum permissible
      error for the measured quantity.
  examples: []
  id: r105-1993-e-T.20-eng
  notes:
  - content: The following are not considered as significant faults - faults arising
      from simultaneous and mutually independent causes in the measuring instrument
      itself or in its checking facilities, transitory faults being momentary variations
      in the indication which cannot be interpreted, memorized or transmitted as a
      measurement result, faults implying the impossibility to perform any measurement.
