    type: accepted
  definition:
  - content: Dispositivo o proceso interno que verifica si el alcoholímetro está ajustado
      adecuadamente. Dicho dispositivo puede incluir elementos internos de verificación
      (por ejemplo, de estabilidad de la señal o estabilidad de la temperatura) o
      elementos externos adicionales que se conectan al instrumento, tales como filtros
      ópticos o eléctricos o un cilindro con un gas de prueba con concentración conocida.
