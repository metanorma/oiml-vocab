  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Le facteur est calculé à partir de la fonction de distribution cumulative
      inverse t de Student (t_p,n-1) avec p comme probabilité équivalant à 0,005 et
      (n-1) comme degrés de liberté et d'un facteur de correction de population finie
      (N-n)/(N-1) avec n comme taille d'échantillon et N comme taille de lot d'inspection
  examples: []
  id: r87-2016-f-2.1.15-fra
  notes:
  - content: FCE a toujours un signe positif car t_p,n-1 a un signe négatif pour p=0,005.
  - content: Voir annexe F, F.3 pour le contexte statistique de FCE.
