  definition:
  - content: incertitude élargie à un niveau de confiance spécifié ( $ p=0,95 $ ou
      $ p=0,99 $ ) déclaré dans la documentation technique, avec laquelle le corps
      noir est considéré être approprié à l'application prévue. Le calcul de l'incertitude
      type $ u_{\mathrm{pBB}}=U_{\mathrm{pBB}}/k(p) $ se base soit sur $ k(p=0,95)=2
      $ soit sur $ k(p=0,99)=3 $
