    type: accepted
  definition:
  - content: Suma de los errores individuales de los preempacados teniendo en cuenta
      su signo aritmético, dividida por el número de preempacados en la muestra o
      lote de inspección.
  examples: []
  id: r87-2016-spa-2.1.2.1-spa
  notes:
  - content: El error promedio para todos los preempacados en una muestra con tamaño
      de muestra n se designa mediante el símbolo e_ave.
  - content: El error promedio para todos los preempacados de un lote de inspección
      con N preempacados se designa mediante el símbolo E_ave
