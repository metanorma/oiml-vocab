  definition:
  - content: Entidad lógica como un programa, una subrutina, una biblioteca o un objeto,
      incluyendo sus «dominios de datos», que puede estar relacionada con otras entidades.
      El software de los instrumentos de medida, los dispositivos electrónicos o los
      subconjuntos constan de uno o más módulos de software.
