  definition:
  - content: Generalement un materiau inerte a l'interieur d'une colonne qui retient
      la phase stationnaire. Ce materiau peut etre constitue de particules poreuses,
      de particules impermeables, de la paroi interieure de la colonne, ou d'une combinaison
      de ces alternatives sur laquelle s'ecoule le gaz vecteur.
