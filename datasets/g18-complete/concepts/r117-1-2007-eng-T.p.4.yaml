  definition:
  - content: Measuring system which in principle is installed on a fixed pipeline
      connecting two or more fixed tanks.
  examples: []
  id: r117-1-2007-eng-T.p.4-eng
  notes:
  - content: Such a pipeline is characterized by a flowrate of the liquid to be measured
      which, in general, either does not change or changes little during a prolonged
      period.
