    type: accepted
  definition:
  - content: designation alphanumerique de la taille des composants d'un systeme de
      tuyauterie, qui est utilise a des fins de reference
  examples: []
  id: r49-2013-e-3.3.14-fra
  notes:
  - content: le diametre nominal est exprime par les lettres DN suivies par un nombre
      entier sans dimension qui est indirectement lie a la taille physique, en millimetre,
      de l'alesage ou du diametre exterieur des raccords aux extremites.
  - content: le nombre suivant les lettres DN ne represente pas une valeur mesurable
      et ne doit pas etre utilise a des fins de calcul, sauf si specifie dans la Recommandation
      pertinente.
  - content: dans ces recommandations utilisant le systeme de designation DN, toute
      relation entre DN et les dimensions du composant doit etre donnee, par exemple,
      DN / OD ou DN / ID.
