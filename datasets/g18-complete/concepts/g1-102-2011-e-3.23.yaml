data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: interval containing the true quantity value with a stated probability,
      based on the information available
  examples: []
  id: g1-102-2011-e-3.23-eng
  notes:
  - content: Adapted from JCGM 101:2008 definition 3.12.
  - content: The probabilistically symmetric coverage interval for a scalar quantity
      is the interval such that the probability that the true quantity value is less
      than the smallest value in the interval is equal to the probability that the
      true quantity value is greater than the largest value in the interval [adapted
      from JCGM 101:2008 3.15].
  - content: The shortest coverage interval for a quantity is the interval of shortest
      length among all coverage intervals for that quantity having the same coverage
      probability [adapted from JCGM 101:2008 3.16].
