    type: accepted
  definition:
  - content: Défaut supérieur à e.
  examples: []
  id: r76-1-1994-fra-T.5.5.6-fra
  notes:
  - content: Pour les instruments à échelons multiples, la valeur de e est celle qui
      correspond à l'étendue de pesage partielle.
  - content: 'Les défauts suivants ne sont pas considérés comme significatifs, même
      s''ils dépassent e: défauts provenant de causes simultanées et mutuellement
      indépendantes dans l''instrument; défauts rendant impossible l''accomplissement
      de toute mesure; défauts si importants qu''ils ne peuvent manquer d''être remarqués
      par tous ceux qui sont intéressés au résultat du mesurage; défauts transitoires
      constitués de variations momentanées de l''indication mais qui ne peuvent être
      interprétées, mises en mémoire ou transmises comme des résultats de mesure.'
