  definition:
  - content: Dispositif permettant d'amener l'indication de l'instrument a zero lorsqu'une
      charge est placee sur le recepteur de charge, sans empieter sur l'etendue de
      pesage des charges nettes (dispositif additif de tare) ou en reduisant l'etendue
      de pesage des charges nettes (dispositif soustractif de tare). Il peut fonctionner
      comme un dispositif non automatique, semi-automatique, ou automatique.
