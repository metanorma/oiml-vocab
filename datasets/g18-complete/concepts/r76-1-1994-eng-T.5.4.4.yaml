    type: accepted
  definition:
  - content: The shortest distance that an observer is able freely to approach the
      indicating device to take a reading under normal conditions of use.
  - content: This approach is considered to be free for the observer if there is a
      clear space of at least 0.8 m in front of the indicating device (see Figure
      1).
