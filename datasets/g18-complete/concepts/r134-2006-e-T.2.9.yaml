    type: accepted
  definition:
  - content: 'Interface that prevents the introduction of any data into the data processing
      device of the instrument which may: display data that are not clearly defined
      and that could be taken as being a measurement result; falsify displayed, processed
      or stored measurement results or primary indications; adjust the instrument
      or change any adjustment factor.'
