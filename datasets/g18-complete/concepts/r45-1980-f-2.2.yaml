data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: La capacité conventionnellement vraie d'un tonneau est le volume occupé
      par le liquide à la température de référence de 20 degrees C quand le récipient
      est rempli complètement jusqu'à la tranche inférieure de la bonde (orifice de
      remplissage).
  examples: []
  id: r45-1980-f-2.2-fra
  notes:
  - content: Si la bonde se prolonge par des parties saillantes à l'intérieur du récipient,
      le bord supérieur des evidements ou des trous, qui doivent être percés dans
      ces parties conformément à l'art. 6.6, est considéré comme bord inférieur de
      la bonde.
