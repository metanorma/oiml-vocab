data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: property of a pair of random variables $ X_{i} $ and $ X_{j} $ , components
      of $ \boldsymbol{X} $ having probability density function $ g_{\boldsymbol{X}}(\boldsymbol{\xi})
      $ given by $\operatorname {C o v} \left(X _ {i}, X _ {j}\right) = \operatorname
      {C o v} \left(X _ {j}, X _ {i}\right) = \int_ {- \infty} ^ {\infty} \dots \int_
      {- \infty} ^ {\infty} \left[ \xi_ {i} - E \left(X _ {i}\right) \right] \left[
      \xi_ {j} - E \left(X _ {j}\right) \right] g _ {\mathbf {X}} (\boldsymbol {\xi})
      \mathrm {d} \xi_ {N} \dots \mathrm {d} \xi_ {1},$ where $ g_{X_{i},X_{j}}(\xi_{i},\xi_{j})
      $ is the joint PDF for the two random variables $ X_{i} $ and $ X_{j} $
  examples: []
  id: g1-102-2011-e-3.18-eng
  notes:
  - content: Generalized from JCGM 101:2008 definition 3.10.
  - content: The covariance matrix of the random variable $ X $ is $ V ( X ) $ , a
      symmetric positive semi-definite matrix of dimension $ N \times N $ containing
      the covariances $ \operatorname{Cov} ( X_{i}, X_{j} ) $ . Certain operations
      involving $ V ( X ) $ require positive definiteness.
