data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Dispositif permettant d'ajuster l'ethylometre en utilisant comme etalon,
      un melange de gaz ayant une humidite relative d'au moins 90 % et une temperature
      de 34 C +- 1 C. Le melange d'air et d'ethanol traverse le systeme analyseur
      de gaz dans sa totalite, en partant de l'embout, dans le sens de passage normal
      de l'air expire.
  examples: []
  id: r126-1998-f-3.9-fra
  notes:
  - content: Un ajustage au moyen d'un gaz sec est possible a condition que la difference
      d'effet par rapport a un gaz humide soit connue ou puisse etre automatiquement
      corrigee.
