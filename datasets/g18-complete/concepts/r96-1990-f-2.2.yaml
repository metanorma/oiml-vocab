  definition:
  - content: La capacité à ras bord (Vr) d'une bouteille est le volume de liquide
      qu'elle est censée contenir lorsqu'elle est remplie jusqu'au plan d'arasement.
      La capacité à ras bord peut être marquée sur la bouteille dans les conditions
      précisées aux points 7.2.1 et 7.2.2.
