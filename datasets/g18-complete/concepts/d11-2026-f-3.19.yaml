    type: accepted
  definition:
  - content: dispositif incorporé dans un instrument de mesure qui permet aux défauts
      significatifs d'être détectés et mis en évidence
  examples: []
  id: d11-2026-f-3.19-fra
  notes:
  - content: Typiquement, des systèmes de contrôle détectent et mettent en évidence
      un fonctionnement incorrect d'un dispositif spécifique de l'instrument de mesure,
      et/ou une communication perturbée entre des dispositifs spécifiques de l'instrument
      de mesure.
  - content: '"La mise en évidence" se réfère à toute réponse appropriée de l''instrument
      de mesure (par exemple: un signal lumineux, un signal acoustique, une interruption
      ou un blocage du processus de mesurage, etc.)'
