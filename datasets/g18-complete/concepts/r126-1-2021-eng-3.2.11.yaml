data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: facility that is incorporated in a measuring instrument and which enables
      significant defects to be detected and acted upon
  examples: []
  id: r126-1-2021-eng-3.2.11-eng
  notes:
  - content: '"Act upon" refers to any adequate response by the measuring instrument
      (luminous signal, acoustic signal, prevention of the measurement process, etc.)
      These significant defects could be for example - events that otherwise will
      result in significant faults, and/or - incorrect functioning of a specific device
      of the measuring instrument, and/or - disturbed communication between specific
      devices of the measuring instrument.'
