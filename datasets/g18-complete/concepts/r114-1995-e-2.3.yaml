  definition:
  - content: A probe that incorporates a temperature sensor and has also other functions.
  examples: []
  id: r114-1995-e-2.3-eng
  notes:
  - content: An example of a special-purpose temperature probe is an esophageal-stethoscope
      probe in which a temperature sensor is loosely contained within a plastic tube;
      however the primary purpose of the probe is to transmit chest cavity sounds
      through the air or gas within the tube to a stethoscope attached to its open
      end.
