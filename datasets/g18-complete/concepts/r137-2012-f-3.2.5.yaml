  definition:
  - content: 'L''erreur moyenne pondérée (EMP), dans le cadre du champ d''application
      de cette Recommandation, est définie ainsi: EMP = sum(k_i × E_i) / sum(k_i),
      avec k_i = Q_i/Q_max pour Q_i <= 0,7 Q_max, et k_i = 1,4 - Q_i/Q_max pour 0,7
      Q_max < Q_i <= Q_max.'
