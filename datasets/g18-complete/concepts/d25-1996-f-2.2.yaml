data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Le facteur K, en impulsions par unité de volume, est le rapport du nombre
      d'impulsions émises par le compteur au volume total correspondant de fluide
      ayant traversé le compteur pendant la période de mesure.
  examples: []
  id: d25-1996-f-2.2-fra
  notes:
  - content: Le facteur K est fonction du nombre de Reynolds. Dans le présent Document,
      toutes les caractéristiques sont données par rapport au nombre de Reynolds.
      Cependant, en métrologie légale, les caractéristiques sont normalement données
      en fonction du débit, lequel peut être obtenu à partir du nombre de Reynolds.
