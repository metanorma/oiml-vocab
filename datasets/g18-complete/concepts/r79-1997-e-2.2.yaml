  definition:
  - content: The quantity of the identified product in the package exclusive of wrappers
      and any other material packed with such product.
  examples: []
  id: r79-1997-e-2.2-eng
  notes:
  - content: This term relates to specifications on a package and does not account
      for the actual contents in an individual package. The procedures for determining
      whether a production lot meets regulatory requirements are provided in OIML
      R 87 Net contents in packages.
