  definition:
  - content: laboratoire réalisant certains ou tous les essais sur un type d'instrument
      de mesure. Un Laboratoire d'Essai est désigné par une Autorité de Délivrance
      OIML et accepté par le CM
  examples: []
  id: b18-2017-f-3.37-fra
  notes:
  - content: Un Laboratoire d'Essai peut être un Laboratoire d'Essai interne d'une
      Autorité de Délivrance OIML, un Laboratoire d'Essai d'une tierce partie ou un
      Laboratoire d'Essai d'un Fabricant (LEF).
  - content: C'est l'Autorité de Délivrance OIML, et non le Laboratoire d'Essai, qui
      est responsable de la délivrance du rapport d'évaluation de type OIML.
