  definition:
  - content: Cantidad de influencia que tiene un valor dentro de los límites específicados
      en esta Recomendación, pero por fuera de las condiciones nominales de operación
      específicadas en un instrumento de medición
  examples: []
  id: r46-1-spa-2.2.25-spa
  notes:
  - content: Una cantidad de influencia es una perturbación si no se especifican las
      condiciones nominales de operación para dicha cantidad de influencia.
