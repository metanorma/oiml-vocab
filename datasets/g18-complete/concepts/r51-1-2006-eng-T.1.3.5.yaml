  definition:
  - content: instrument where components of the vehicle which are also components
      of the weighing instrument, i.e. parts of the vehicle (levers, joints and/or
      force transmission) are used for the instrument
  examples: []
  id: r51-1-2006-eng-T.1.3.5-eng
  notes:
  - content: For example, a front-end loader (front-end loading vehicle) that determines
      the quantity of loose material held in the bucket (load receptor).
