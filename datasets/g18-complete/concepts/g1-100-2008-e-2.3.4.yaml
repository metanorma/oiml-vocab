  definition:
  - content: standard uncertainty of the result of a measurement when that result
      is obtained from the values of a number of other quantities, equal to the positive
      square root of a sum of terms, the terms being the variances or covariances
      of these other quantities weighted according to how the measurement result varies
      with changes in these quantities
