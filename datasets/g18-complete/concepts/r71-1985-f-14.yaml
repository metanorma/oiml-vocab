  definition:
  - content: Plus petit volume dont le mesurage est autorisé pour la livraison ou
      la réception des quantités de liquide contenu, en tout point de la zone de barémage.
  - content: La hauteur minimale mesurable d'un réservoir est la variation de niveau
      qui correspond au volume minimal mesurable.
