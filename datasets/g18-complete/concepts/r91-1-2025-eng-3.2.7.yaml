  definition:
  - content: stationary speed meter which can be moved to different locations between
      measurements
  examples: []
  id: r91-1-2025-eng-3.2.7-eng
  notes:
  - content: Stationary speed meters installed in a parked vehicle or on a parked
      trailer are also considered as mobile speed meters.
  - content: Portable speed meters which are used hand-held or which are (temporarily)
      installed on a tripod or similar temporary stand to guide the hand of the operator
      for a limited series of measurements are also considered as mobile speed meters.
