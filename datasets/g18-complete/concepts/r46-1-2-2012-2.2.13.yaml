  definition:
  - content: ratio of the r.m.s. value of the harmonic content to the r.m.s. value
      of the fundamental term
  examples: []
  id: r46-1-2-2012-eng-2.2.13-eng
  notes:
  - content: The harmonic content is obtained e.g. by subtracting from a non-sinusoidal
      alternating quantity its fundamental term.
  - content: The distortion factor is usually expressed as a percentage. It is equivalent
      to THD, total harmonic distortion.
