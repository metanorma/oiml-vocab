  definition:
  - content: incertitude-type du résultat d'un mesurage, lorsque ce résultat est obtenu
      à partir des valeurs d'autres grandeurs, égale à la racine carrée d'une somme
      de termes, ces termes étant les variances ou covariances de ces autres grandeurs,
      pondérées selon la variation du résultat de mesure en fonction de celle de ces
      grandeurs
