  definition:
  - content: Report issued by a Testing Laboratory that includes the results of additional
      tests and examinations, additional to those in the OIML Recommendation, accepted
      in the scope of a Declaration of Mutual Confidence (DoMC).
  examples: []
  id: d30-2008-e-G.3-1h-eng
  notes:
  - content: Additional Test Reports are issued under the Mutual Acceptance Arrangement
      (MAA).
  - content: In the event that several Testing Laboratories are involved in the additional
      tests and examinations, each Testing Laboratory issues an Additional Test Report
      corresponding to those tests and examinations it performs.
