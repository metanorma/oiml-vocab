  definition:
  - content: value of the integral of one cycle of the blood pressure curve divided
      by the time of one heart beat period
  examples: []
  id: r149-1-2020-eng-2.7-eng
  notes:
  - content: Because of hydrostatic effects, this value should be measured with the
      cuff at the heart level. The calculation of the mean arterial blood pressure
      using only the systolic and diastolic blood pressure values is not recommended.
