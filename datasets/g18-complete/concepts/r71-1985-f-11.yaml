  definition:
  - content: Accessoires d'un réservoir dont le volume influe sur la capacité du réservoir.
  - content: Ils sont appelés « corps positifs » si la capacité des accessoires s'ajoute
      à la capacité effective du réservoir, et « corps négatifs » si le volume des
      accessoires diminue la capacité effective, en raison du déplacement de liquide.
