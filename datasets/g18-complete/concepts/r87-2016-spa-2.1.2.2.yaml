  definition:
  - content: Diferencia entre la cantidad real de producto en un preempacado y su
      cantidad nominal.
  examples: []
  id: r87-2016-spa-2.1.2.2-spa
  notes:
  - content: El error individual del preempacado para un preempacado "i" se designa
      mediante el símbolo E_i o e_i y se puede calcular mediante E_i=Q_i-Q_nom o mediante
      e_i=q_i-Q_nom en donde Q_nom es la cantidad nominal.
