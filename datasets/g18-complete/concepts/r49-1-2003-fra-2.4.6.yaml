  definition:
  - content: Les conditions extrêmes dont celles relatives au débit, à la température,
      à la pression, à l'humidité et aux interférices électromagnétiques, qu'un compteur
      d'eau doit supporter sans dommages, et sans dégradation de son erreur (d'indication)
      lorsqu'il est par la suite utilisé en respectant ses conditions assignées de
      fonctionnement [Adapté de VIM 5.6]
