  definition:
  - content: Composante de la force variable dans le temps appliquée perpendiculairement
      à la surface de la route par le(s) pneu(s) sur une roue d'un véhicule en mouvement.
      En plus de l'action de la pesanteur, cette force peut aussi inclure les effets
      dynamiques d'influences sur le véhicule en mouvement.
