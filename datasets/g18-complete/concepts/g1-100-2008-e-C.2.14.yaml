    type: accepted
  definition:
  - content: the probability distribution of a continuous random variable X, the probability
      density function of which is f(x) = (1 / (sigma sqrt(2 pi))) exp[-(1/2)((x -
      mu)/sigma)^2] for -infinity < x < +infinity.
  examples: []
  id: g1-100-2008-e-C.2.14-eng
  notes:
  - content: mu is the expectation and sigma is the standard deviation of the normal
      distribution.
