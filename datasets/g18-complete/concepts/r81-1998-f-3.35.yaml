    type: accepted
  definition:
  - content: Transaction (vente ou achat) de quantites de liquides dont le reglement
      est associe aux indications fournies par un systeme de mesure, chacune des parties
      ayant acces au lieu de mesurage et l'une d'elles etant un consommateur.
  examples: []
  id: r81-1998-f-3.35-fra
  notes:
  - content: Le consommateur peut etre toute personne. Generalement, le consommateur
      est l'acheteur mais il peut aussi etre le vendeur.
