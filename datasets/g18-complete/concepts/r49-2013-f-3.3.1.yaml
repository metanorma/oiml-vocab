  definition:
  - content: Q = dV/dt where V is actual volume and t is time taken for this volume
      to pass through the meter
  examples: []
  id: r49-2013-f-3.3.1-eng
  notes:
  - content: ISO 4006:1991 [4] 4.1.2 prefers the use of the symbol qV for this quantity,
      but Q is used in this Recommendation as it is well established in the industry.
