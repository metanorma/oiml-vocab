  - content: Der in Längeneinheiten ausgedrückte Wert (bei analoger Anzeige) der Differenz
      zwischen den Werten, die zwei aufeinanderfolgenden Skalenmarken entsprechen;
      oder (bei digitaler Anzeige) der Differenz zwischen zwei aufeinanderfolgenden
      Werten.
