  definition:
  - content: loi de probabilité d'une variable aléatoire continue X, dont la densité
      de probabilité est f(x) = (1 / (sigma sqrt(2 pi))) exp[-(1/2)((x - mu)/sigma)^2]
      pour -infinity < x < +infinity.
  examples: []
  id: g1-100-2008-f-C.2.14-fra
  notes:
  - content: mu est l'espérance mathématique et sigma l'écart-type de la loi normale.
