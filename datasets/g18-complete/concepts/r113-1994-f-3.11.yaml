  definition:
  - content: Etendue des debits massiques ou des concentrations du composant de l'echantillon
      examine pour laquelle une variation incrementielle produit une variation mesurable
      du signal de sortie du detecteur. Sa limite superieure est le debit massique
      ou la concentration le plus eleve auquel une augmentation supplementaire du
      debit ou de la concentration ne produit pas d'augmentation observable du signal
      de sortie du detecteur. Elle est exprimee comme le rapport de sa limite superieure
      a la limite de detection.
