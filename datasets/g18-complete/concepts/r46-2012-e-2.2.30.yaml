  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: différence entre l'erreur d'indication et l'erreur intrinsèque d'un instrument
      de mesure
  examples: []
  id: r46-2012-e-2.2.30-fra
  notes:
  - content: Un défaut est principalement le résultat d'une modification non désirée
      de données contenues ou traversant un instrument de mesure.
  - content: D'après la définition, il s'ensuit qu'un "défaut" est une valeur numérique
      qui est exprimée soit en une unité de mesure soit en tant que valeur relative,
      par exemple sous forme de pourcentage.
  - content: Dans cette recommandation, la définition ci-dessus ne s'applique pas
      à la notion de «défaut à la terre», dans laquelle le mot «défaut» a son sens
      lexical usuel.
  - content: 'Source citation: OIML D 11:2004, 3.9'
