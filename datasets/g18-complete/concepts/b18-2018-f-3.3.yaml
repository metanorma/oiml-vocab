    type: accepted
  definition:
  - content: fabricant et/ou représentant autorisé qui soumet une demande d'évaluation
      de type OIML d'un instrument de mesure à une Autorité de délivrance OIML, en
      vue d'obtenir un rapport d'évaluation de type OIML et un Certificat OIML pour
      ce type d'instrument de mesure
  examples: []
  id: b18-2018-f-3.3-fra
  notes:
  - content: Le demandeur devient propriétaire du Certificat au moment où celui-ci
      lui est délivré.
