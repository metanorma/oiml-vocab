data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: condition de fonctionnement prescribe pour évaluer les performances d'un
      instrument de mesure ou d'un système de mesure ou pour comparer des résultats
      de mesure
  examples: []
  id: r46-2012-e-2.2.27-fra
  notes:
  - content: Les conditions de fonctionnement de référence spécifient des intervalles
      de valeurs du mesurande et des grandeurs d'influence.
  - content: Dans la CEI 60050-300, n° 311-06-02, le terme «condition de référence»
      désigne une condition de fonctionnement dans laquelle l'incertitude de mesure
      instrumentale spécifiée est la plus petite possible.
  - content: Pour l'application de la présente Recommandation, les termes «instrument
      de mesure» et «système de mesure» signifient compteur électrique.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: condition de référence
