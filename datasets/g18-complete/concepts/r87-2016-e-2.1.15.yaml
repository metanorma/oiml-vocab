data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: The factor calculated using a) the Student's t inverse cumulative distribution
      function $(t_{\mathrm{p}, n-1})$ with p as the probability equivalent to 0.005
      and (n-1) as the degrees of freedom, and b) a finite population correction factor
      $(N-n)/(N-1)$ with n as the sample size and N as the inspection lot size
  examples: []
  id: r87-2016-e-2.1.15-eng
  notes:
  - content: SCF always has a positive sign because $t_{\mathrm{p}, n-1}$ has a negative
      sign for $p=0.005$.
  - content: See Annex F, F.3 for the statistical background to SCF.
