    type: accepted
  definition:
  - content: Partie identifiable d'un instrument remplissant une ou plusieurs fonctions
      specifiques, et pouvant etre examinee separement suivant des exigences metrologiques
      et techniques specifiques de la Recommandation applicable. Les modules d'un
      instrument de pesage font l'objet de limites d'erreurs partielles specifiees.
  examples: []
  id: r76-2006-f-T.2.2-fra
  notes:
  - content: 'Les modules typiques d''un instrument de pesage sont : cellule de pese,
      indicateur, dispositif analogique ou numerique de traitement de donnees, module
      de pesage, terminal, indicateur primaire.'
