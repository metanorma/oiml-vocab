  definition:
  - content: Einrichtung, die aus elektronischen Unterbaugruppen besteht und eine
      spezifische Funktion erfüllt.
  examples: []
  id: r136-1-2004-deu-T.2.2-deu
  notes:
  - content: Eine elektronische Einrichtung wird in der Regel als separate Einheit
      hergestellt und kann unabhängig geprüft werden (z. B. ein Gerät mit Photozellen
      zur Ledererkennung oder eine Kamera zur Bildabtastung und Flächenmessung mit
      digitaler Anzeige).
