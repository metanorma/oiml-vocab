  - content: grandeur d'influence dont la valeur se situe dans les conditions assignées
      de fonctionnement d'un instrument de mesure,
  examples: []
  id: d11-2013-f-3.15.1-fra
  notes:
  - content: Les conditions assignées de fonctionnement doivent être en conformité
      avec les exigences applicables spécifiées dans la Recommandation applicable.
  - content: La variation d'une indication due à un facteur d'influence est une erreur
      et non un défaut.
