data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: A transaction is settled when the parties interested in the transaction
      have made their agreement known (explicitly or implicitly) regarding the amount
      of the transaction. This may be a payment, signing a credit card voucher, signing
      a delivery order, etc.
  examples: []
  id: r117-2007-e-T.s.5-eng
  notes:
  - content: The parties interested in a transaction may be the parties themselves
      or their representatives (for example, the employee in a filling station or
      the driver of a truck).
  sources:
  - origin:
      ref:
        source: OIML R 117:2007
        version: '2007'
