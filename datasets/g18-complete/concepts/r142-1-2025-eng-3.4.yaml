  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: instrument in which the test sample is supplied to the device manually,
      the indications are visible through an eye-piece and cannot be seen by all interested
      parties simultaneously. The result is obtained by seeking the graduation line
      that coincides with the line which separates the clear zone from the dark zone.
  examples: []
  id: r142-1-2025-eng-3.4-eng
  notes:
  - content: Type III refractometers shall meet the following main provisions they
      shall use the phenomenon of light refraction, which is the only method that
      guarantees sufficient readability on this type of instrument; they shall be
      equipped with a built-in thermometer, so as to allow temperature corrections.
