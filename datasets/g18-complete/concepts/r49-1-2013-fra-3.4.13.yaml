  - content: decision a caractere legal, basee sur le rapport d'evaluation, concernant
      le fait que le type d'un instrument de mesure est conforme aux exigences reglementaires
      pertinentes et qu'il est adapte a l'usage dans les domaines reglementes de telle
      sorte qu'il est attendu qu'il fournisse des resultats de mesurage fiables au
      cours d'une periode de temps definie
