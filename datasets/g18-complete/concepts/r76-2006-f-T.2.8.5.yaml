  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Stockage utilise pour garder les donnees de mesure apres achevement du
      mesurage pour des utilisations ulterieures d'application legale (par exemple
      conclusion d'une transaction commerciale a une date ulterieure, lorsque le client
      n'est pas present pour la determination du total, ou pour des applications speciales
      identifiees et reglementees par l'Etat).
