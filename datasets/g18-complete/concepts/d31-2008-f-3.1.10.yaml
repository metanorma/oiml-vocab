  definition:
  - content: Jeu de données contenant la clef publique appartenant à un instrument
      de mesure ou personne complétée par un identificateur unique du sujet tel que
      le numéro de série de l'instrument de mesure ou le nom ou Numéro d'Identification
      Personnel (PIN) de la personne. Le jeu de données est signé par une institution
      irrécusable à l'aide d'une signature numérique.
