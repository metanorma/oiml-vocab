  definition:
  - content: Any single factor that can affect the measurement result, for example,
      the instrument, the operator, and the procedure.
  examples: []
  id: d16-1986-e-1.1.3-eng
  notes:
  - content: this concept embraces all aspects relating to the performance and quality
      of the measurement; it includes for example the principle, method, procedure,
      values of the influence quantities and the measurement standards (VIM 2.08).
