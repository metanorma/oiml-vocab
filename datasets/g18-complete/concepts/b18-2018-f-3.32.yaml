    type: accepted
  definition:
  - content: évaluation d'un organisme selon les exigences spécifiées, émise par des
      représentants d'autres organismes faisant partie d'un groupe participant à un
      accord ou candidats souhaitant appartenir à ce groupe
  examples: []
  id: b18-2018-f-3.32-fra
  notes:
  - content: Dans le cadre de la mise en place de l'OIML-CS, c'est la procédure par
      laquelle des experts établissent, sur site, la compétence des Autorités de Délivrance
      OIML et des Laboratoires d'Essais devant être enregistrés dans la Déclaration
      selon les exigences spécifiées.
  - content: Dans l'OIML-CS, l'évaluation par des pairs équivaut à l'accréditation
      (voir 3.1).
