  - content: Quotient de par dm, où de est l'énergie moyenne différentielle transmise
      par rayonnement ionisant à une quantité de matière de masse égale à dm. L'unité
      de dose absorbée est le gray (Gy), où 1 Gy = 1 J/kg.
