  definition:
  - content: activity of legal metrological control to check the observance of metrology
      laws and regulations.
  examples: []
  id: d1-2012-e-3.1.11-eng
  notes:
  - content: Metrological supervision also includes checking the correctness of quantities
      indicated on and contained in pre-packages and the correct use of units of measurement.
  - content: For achieving these purposes, means and methods such as market surveillance
      and quality management may be utilized.
