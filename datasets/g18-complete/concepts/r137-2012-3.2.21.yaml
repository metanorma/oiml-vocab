data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Smallest difference between displayed indications that can be meaningfully
      distinguished.
  examples: []
  id: r137-2012-e-3.2.21-eng
  notes:
  - content: For a digital device, this is the change in the indication when the least
      significant digit changes by one step. For an analogue device, this is half
      the difference between subsequent scale marks.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: resolution (of a displaying device)
