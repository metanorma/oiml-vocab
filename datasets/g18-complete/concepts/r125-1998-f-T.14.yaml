  definition:
  - content: La valeur brute de la masse est la valeur de masse du liquide determinee
      par l'instrument de mesure (masse mesuree) ainsi que la masse de liquide sous
      le transducteur et inclut l'eau et les sediments entraines dans le liquide.
      Elle n'inclut pas la masse de vapeur au-dessus du liquide, la masse du toit
      flottant si present, ou la masse de la vase du fond.
