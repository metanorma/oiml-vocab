  definition:
  - content: Paramètres à caractère légal dépendants de chaque taximètre individuellement.
      De tels paramètres incluent les paramètres d'ajustement et de configuration.
      Ils sont ajustables et sélectionnables seulement en mode service du taximètre
      et peuvent être classés comme étant ceux qui devraient être sécurisés et ceux
      qui peuvent être accessible (paramètres réglables).
