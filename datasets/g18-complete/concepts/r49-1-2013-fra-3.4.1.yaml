  definition:
  - content: grandeur qui, lors d'un mesurage direct, n'affecte pas la grandeur reellement
      mesuree, mais affecte la relation entre l'indication et le resultat du mesurage
  examples:
  - content: La temperature ambiante du compteur est une grandeur d'influence, alors
      que la temperature de l'eau traversant le compteur affecte le mesurande.
