data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: 'A manifestation of variation in the gas chromatograph output signal;
      it can be divided into two components: 3.13.1. Short-term noise includes all
      observable random variations of the signal from the detector or other components
      having a frequency of the order of one or more cycles per minute. 3.13.2. Drift
      is the average slope of the baseline signal measured over a minimum of one-half
      hour.'
