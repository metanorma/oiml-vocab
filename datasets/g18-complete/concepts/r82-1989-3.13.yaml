  definition:
  - content: 'Manifestation d''une variation du signal de sortie du chromatographe.
      Il peut être divisé en deux composants: 3.13.1. Le bruit à court terme comprend
      toutes les variations aléatoires observables du signal en provenance du détecteur
      ou d''autres composants, et dont la fréquence est de l''ordre d''un ou de quelques
      cycles par minute. 3.13.2. La dérive est la pente moyenne du signal de base
      mesurée sur une demi-heure au minimum.'
