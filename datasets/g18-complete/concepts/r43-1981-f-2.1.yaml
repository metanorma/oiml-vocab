    type: accepted
  definition:
  - content: 2.1.1. La capacité « contenue » d'une fiole étalon graduée correspondant
      à un trait de graduation (désignée par capacité « In ») est égale au volume
      d'eau qu'elle contient à la température de référence lorsqu'elle est remplie
      jusqu'à ce trait de graduation. 2.1.2. La capacité « délivrée » d'une fiole
      étalon graduée correspondant à un trait de graduation (désignée par capacité
      « Ex ») est égale au volume d'eau qu'elle délivre à la température de référence
      quand, après avoir été remplie jusqu'à ce trait de graduation, on la vide (voir
      méthode précisée au point A.3.2. de l'annexe A).
  examples: []
  id: r43-1981-f-2.1-fra
  notes:
  - content: l'expression « remplie jusqu'à ce trait de graduation » signifie que
      le ménisque formé par l'eau dans le goulot de la fiole est ajusté de telle manière
      que le plan horizontal passant par le bord supérieur du trait (plan dans lequel
      se fait la visée) est tangent au ménisque en son point le plus bas.
