  definition:
  - content: Weighing instrument used to determine the conventional true value of
      the mass of the test loads during material tests.
  examples: []
  id: r107-2007-e-T.1.5-eng
  notes:
  - content: 'Control instruments used for testing may be: separate from the instrument
      being tested; or integral, when a non-automatic (static) weighing mode is provided
      by the instrument being tested, which allows the weighing cycle to be interrupted
      (see 6.3).'
