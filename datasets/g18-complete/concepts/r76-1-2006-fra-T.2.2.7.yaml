data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: 'Partie de l''instrument de pesage qui comprend tous les dispositifs
      mécaniques et électroniques (c''est-à-dire : le récepteur de charge, le dispositif
      transmetteur de charge, la cellule de pesée, et le dispositif analogique de
      traitement de données ou le dispositif numérique de traitement de données) mais
      n''ayant pas les moyens d''afficher le résultat de pesage. Il peut en option
      avoir des dispositifs pour le traitement (numérique) de données et de fonctionnement
      de l''instrument.'
