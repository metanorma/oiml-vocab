  definition:
  - content: Part of the measuring device that provides an output signal, representing
      volume or mass, having a determined relationship to the input signal.
  examples: []
  id: r117-2007-e-T.t.1-eng
  notes:
  - content: The transducer can either be incorporated with the meter sensor or be
      external to the meter sensor. In the latter case, it can be approved either
      with the sensor or with the calculator.
