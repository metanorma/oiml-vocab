  definition:
  - content: Document spécifiant quelles procédures et ressources associées doivent
      être appliquées par qui et quand, pour un projet, un produit, un processus ou
      un contrat particulier.
  examples: []
  id: d27-2001-f-2.13-fra
  notes:
  - content: Ces procédures comprennent généralement celles faisant référence aux
      processus de management de la qualité et aux processus de réalisation de produits.
  - content: Un plan qualité fait souvent référence à des parties du manuel qualité
      ou à des documents de procédure.
  - content: Un plan qualité est généralement l'un des résultats de la planification
      de la qualité.
