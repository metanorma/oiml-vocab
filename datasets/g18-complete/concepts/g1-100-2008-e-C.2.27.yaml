data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: when T_1 and T_2 are two functions of the observed values such that,
      theta being a population parameter to be estimated, the probability Pr(T_1 <=
      theta <= T_2) is at least equal to (1 - alpha) [where (1 - alpha) is a fixed
      number, positive and less than 1], the interval between T_1 and T_2 is a two-sided
      (1 - alpha) confidence interval for theta
  examples: []
  id: g1-100-2008-e-C.2.27-eng
  notes:
  - content: The limits T_1 and T_2 of the confidence interval are statistics and
      as such will generally assume different values from sample to sample.
  - content: In a long series of samples, the relative frequency of cases where the
      true value of the population parameter theta is covered by the confidence interval
      is greater than or equal to (1 - alpha).
  - content: 'Source citation: ISO 3534-1:1993, definition 2.57'
