data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: 'for a random variable $ X_{i} $ , a component of X having probability
      density function $ g_{X}(\xi) $ , the probability density function for $ X_{i}
      $ alone: $ g _ {X _ {i}} \left(\xi_ {i}\right) = \int_ {- \infty} ^ {\infty}
      \dots \int_ {- \infty} ^ {\infty} g _ {\boldsymbol {X}} \left(\boldsymbol {\xi}\right)
      \mathrm {d} \xi_ {N} \dots \mathrm {d} \xi_ {i + 1} \mathrm {d} \xi_ {i - 1}
      \dots \mathrm {d} \xi_ {1}$'
  examples: []
  id: g1-102-2011-e-3.15-eng
  notes:
  - content: When the components $ X_{i} $ of $ \boldsymbol{X} $ are independent,
      $ g_{\boldsymbol{X}}(\boldsymbol{\xi})=g_{X_{1}}(\xi_{1})g_{X_{2}}(\xi_{2})\cdots
      g_{X_{N}}(\xi_{N}). $
  sources:
