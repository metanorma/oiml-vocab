  definition:
  - content: Un thermometre clinique electrique, tel qu'il est traite dans la presente
      Recommandation, est un thermometre a contact comprenant une sonde de temperature
      et une unite indicatrice, et qui est concu pour mesurer la temperature du corps
      humain ou animal.
