    type: accepted
  definition:
  - content: Cryptage des données par l'émetteur et décryptage par le récepteur avec
      pour objectif la dissimulation des informations aux personnes non autorisées.
      Signer électroniquement des données dans le but de permettre au récepteur ou
      utilisateur des données de vérifier l'origine de ces données, i.e. de prouver
      leur authenticité.
  examples: []
  id: d31-2008-f-3.1.11-fra
  notes:
  - content: Pour signer électroniquement, un système de clef publique est en général
      utilisé.
