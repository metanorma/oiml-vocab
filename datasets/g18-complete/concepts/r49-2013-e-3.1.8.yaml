  definition:
  - content: dispositif destine a realiser une fonction specifique, directement impliquee
      dans l'elaboration, la transmission ou l'affichage des valeurs mesurees
  examples: []
  id: r49-2013-e-3.1.8-fra
  notes:
  - content: pour la definition de << valeurs mesurees >>, voir OIML V 2-200:2012
      (VIM) [1], 2.10.
  - content: 'les principaux dispositifs auxiliaires sont : a) dispositif de reglage
      du zero ; b) dispositif indicateur de prix ; c) dispositif repetiteur de l''indication
      ; d) dispositif d''impression ; e) dispositif de memorisation ; f) dispositif
      de controle de la tarification ; g) dispositif de predetermination ; h) dispositif
      de libre-service ; i) capteur de detection de mouvement de debit ; j) dispositif
      de lecture a distance.'
  - content: en fonction des reglementations nationales, les dispositifs auxiliaires
      peuvent etre sujets au controle metrologique legal.
