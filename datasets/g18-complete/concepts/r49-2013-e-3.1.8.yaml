data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: device intended to perform a specific function, directly involved in
      elaborating, transmitting or displaying measured values
  examples: []
  id: r49-2013-e-3.1.8-eng
  notes:
  - content: For the definition of "measured value", see OIML V 2-200:2012 (VIM) [1],
      2.10.
  - content: 'The main ancillary devices are: a) zero-setting device; b) price-indicating
      device; c) repeating indicating device; d) printing device; e) memory device;
      f) tariff control device; g) pre-setting device; h) self-service device; i)
      flow sensor movement detector (for detecting movement of the flow sensor before
      this is clearly visible on the indicating device); j) remote reading device
      (which may be incorporated permanently or added temporarily).'
  - content: Depending on national legislation, ancillary devices may be subject to
      legal metrological control.
  sources:
  - origin:
      ref:
        source: OIML R 49:2013
        version: '2013'
    locality:
      type: clause
      reference_from: 3.1.8
    type: authoritative
  terms:
  - type: expression
    normative_status: preferred
    designation: ancillary device
