data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: 2.1.1. The capacity contained in a standard graduated flask, corresponding
      to a scale mark (designated capacity In) is equal to the volume of water which
      the flask contains at the reference temperature, when filled to this scale mark.
      2.1.2. The capacity "delivered" by a standard graduated flask, corresponding
      to a scale mark (designated capacity "Ex"), is equal to the volume of water
      delivered by the flask at the reference temperature, when filled to this scale
      mark and then emptied (see method described in appendix A, point A.3.2.).
  examples: []
  id: r43-1981-e-2.1-eng
  notes:
  - content: The expression "filled to this scale mark", means that the meniscus formed
      by the water in the neck of the flask, is so adjusted that the horizontal plane
      passing through the upper edge of the scale mark, is tangential to the lowest
      point of the meniscus, when viewed in this plane.
