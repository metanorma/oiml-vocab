data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: for a continuous random variable $ X $ characterized by a PDF $ g_{x}(\xi)
      $ , $E (X) = \int_ {- \infty} ^ {\infty} \xi g _ {X} (\xi) \mathrm {d} \xi$
  examples: []
  id: g1-106-2012-e-3.1.5-eng
  notes:
  - content: The expectation is also known as the mean.
  - content: Not all random variables have an expectation.
  - content: The expectation of the random variable $ Z=F(X) $ , for a given function
      F(X), is $E (Z) = E \left(F (X)\right) = \int_ {- \infty} ^ {\infty} F (\xi)
      g _ {X} (\xi) \mathrm {d} \xi$
