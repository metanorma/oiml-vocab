data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: instrument destine a mesurer de maniere continue, memoriser et afficher
      le volume d'eau passant a travers le transducteur de mesure aux conditions de
      mesurage
  examples: []
  id: r49-1-2013-fra-3.1.1-fra
  notes:
  - content: Un compteur d'eau comprend au moins un transducteur de mesure, un calculateur
      (incluant des dispositifs d'ajustage ou de correction le cas echeant) et un
      dispositif indicateur. Ces trois dispositifs peuvent etre dans des boitiers
      differents.
  - content: Un compteur d'eau peut etre un compteur combine (voir 3.1.16)
  - content: Dans cette Recommandation, il est egalement fait reference au compteur
      d'eau en tant que "compteur".
