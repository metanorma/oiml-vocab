  definition:
  - content: Etroitesse de l'accord entre les mesurages successifs du meme mesurande,
      effectues dans des conditions identiques et durant une courte periode de temps.
  examples: []
  id: r116-1995-f-3.13-fra
  notes:
  - content: Le terme "memes conditions" inclut la methode utilisee pour le mesurage,
      l'operateur, l'instrument de mesure, le lieu et les conditions de l'environnement.
