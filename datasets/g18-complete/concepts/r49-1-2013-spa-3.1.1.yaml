data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Instrumento diseñado para medir continuamente, memorizar y mostrar el
      volumen de agua que pasa a través de un transductor de medición en condiciones
      medibles.
  examples: []
  id: r49-1-2013-spa-3.1.1-spa
  notes:
  - content: Un medidor de agua incluye al menos un transductor de medición, un calculador
      (incluyendo dispositivos de ajuste o corrección, si los hay) y un dispositivo
      indicador. Estos tres dispositivos pueden estar en ubicaciones diferentes.
  - content: Un medidor de agua puede ser un medidor de combinación (ver 3.1.16).
  - content: En esta recomendación, un medidor de agua también es llamado "medidor"
