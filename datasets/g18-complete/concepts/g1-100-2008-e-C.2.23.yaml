  - content: a function of the sample random variables
  examples: []
  id: g1-100-2008-e-C.2.23-eng
  notes:
  - content: A statistic, as a function of random variables, is also a random variable
      and as such it assumes different values from sample to sample. The value of
      the statistic obtained by using the observed values in this function may be
      used in a statistical test or as an estimate of a population parameter, such
      as a mean or a standard deviation.
