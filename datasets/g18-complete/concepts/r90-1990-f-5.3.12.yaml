  definition:
  - content: Le taux de réjection en mode commun est le rapport entre l'amplitude
      crête à crête d'un signal en phase appliqué à l'entrée de l'appareil et l'amplitude
      crête à crête d'un signal à contre-phase usuel qui produit une amplitude crête
      à crête du signal enregistré identique.
