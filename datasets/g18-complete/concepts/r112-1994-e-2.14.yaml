  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: The elapsed time between injection of a sample and the appearance of
      the maximum output peak of the component of interest.
  examples: []
  id: r112-1994-e-2.14-eng
  notes:
  - content: A related term is capacity factor k', which is defined as k' = (t_r -
      t_m) / t_m, where t_m is the time for the mobile phase to proceed from the point
      of injection to the point of detection.
