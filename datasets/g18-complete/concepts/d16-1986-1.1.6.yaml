data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: A measurement process is in a state of statistical control if the resulting
      observations from the process, when collected under any fixed experimental conditions
      within the scope of the a priori well-defined conditions of the process, behave
      like random drawings from some fixed distribution with fixed location and fixed
      scale parameters. A less rigorous but more easily understood definition is that
      a measurement process is in a state of statistical control if the amount of
      scatter in the data from repeated measurements of the same item over a period
      of time does not change with time, and if there are no unpredictable drifts
      or sudden shifts in the mean of repeated measurements on the same item.
