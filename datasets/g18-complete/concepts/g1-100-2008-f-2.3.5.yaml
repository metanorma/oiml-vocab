data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: grandeur définissant un intervalle, autour du résultat d'un mesurage,
      dont on puisse s'attendre à ce qu'il comprenne une fraction élevée de la distribution
      des valeurs qui pourraient être attribuées raisonnablement au mesurande
  examples: []
  id: g1-100-2008-f-2.3.5-fra
  notes:
  - content: La fraction peut être considérée comme la probabilité ou le niveau de
      confiance de l'intervalle.
  - content: L'association d'un niveau de confiance spécifique à l'intervalle défini
      par l'incertitude élargie nécessite des hypothèses explicites ou implicites
      sur la loi de probabilité caractérisée par le résultat de mesure et son incertitude-type
      composée. Le niveau de confiance qui peut être attribué à cet intervalle ne
      peut être connu qu'avec la même validité que celle qui se rattache à ces hypothèses.
  - content: L'incertitude élargie est appelée incertitude globale au paragraphe 5
      de la Recommandation INC-1 (1980).
