  definition:
  - content: Depth of immersion in a thermostatic bath with a temperature of (80 +/-
      5) deg C at an ambient temperature of (25 +/- 5) deg C, beyond which deeper
      immersion changes the output value by an amount corresponding to less than 0.1
      K.
