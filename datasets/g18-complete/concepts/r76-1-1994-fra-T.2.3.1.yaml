    type: accepted
  definition:
  - content: Dispositif qui utilise des sous-ensembles électroniques et qui accomplit
      une fonction spécifique. Un dispositif électronique est usuellement fabriqué
      en tant qu'unité séparée et peut être essayé indépendamment.
  examples: []
  id: r76-1-1994-fra-T.2.3.1-fra
  notes:
  - content: Un dispositif électronique, selon cette définition, peut être un instrument
      complet (par exemple, un instrument pour la vente directe au public), ou une
      partie d'instrument (par exemple, un imprimeur ou un indicateur).
