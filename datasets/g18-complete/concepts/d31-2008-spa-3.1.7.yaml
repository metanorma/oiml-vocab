  definition:
  - content: Secuencia de señales eléctricas (ópticas, electromagnéticas, etc.) en
      interfaces de entrada o códigos en protocolos de la transmisión de datos. Se
      pueden generar a partir del software del instrumento de medida / dispositivo
      electrónico / subconjunto (comandos de software), o bien por el usuario a través
      de la interfaz de usuario del instrumento de medida (comandos de usuario).
