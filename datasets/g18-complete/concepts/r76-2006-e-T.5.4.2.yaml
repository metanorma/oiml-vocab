  definition:
  - content: On an instrument with analog indication, this is equal to the standard
      deviation of the same indication, the reading of which is carried out under
      normal conditions of use by several observers.
  examples: []
  id: r76-2006-e-T.5.4.2-eng
  notes:
  - content: It is customary to make at least ten readings of the result.
