  definition:
  - content: Es la parte del medidor que transforma el caudal o el volumen de agua
      a ser medido en señales que son pasadas al calculador y que incluye el sensor.
  examples: []
  id: r49-1-2013-spa-3.1.2-spa
  notes:
  - content: El transductor de medición puede funcionar de manera autónoma o utilizar
      una fuente de energía externa y estar basado en un principio mecánico, eléctrico
      o electrónico.
