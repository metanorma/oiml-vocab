  definition:
  - content: laboratory performing certain or all tests on a type of measuring instrument.
      A Test Laboratory is designated by an OIML Issuing Authority and accepted by
      the MC
  examples: []
  id: b18-2017-e-3.37-eng
  notes:
  - content: A Test Laboratory may be an internal Test Laboratory of an OIML Issuing
      Authority, a third-party Test Laboratory or a Manufacturer's Test Laboratory
      (MTL).
  - content: The OIML Issuing Authority, and not the Test Laboratory, is responsible
      for issuing the OIML type evaluation report.
