data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: single item for presentation as such to a consumer, consisting of a product
      and its packing material, made up before being offered for sale and in which
      the quantity of product has a predetermined value, whether the packing material
      encloses the product completely or only partially, but in any case in such a
      way that the actual quantity of product cannot be altered without the packing
      material either being opened or undergoing a perceptible modification
  examples: []
  id: r79-2015-e-2.7-eng
  notes:
  - content: For the purpose of this Recommendation prepackages include prepackages
      marked with a constant nominal quantity or random nominal quantities. The term
      "predetermined value" refers to the value determined prior to the prepackage
      being offered for sale.
