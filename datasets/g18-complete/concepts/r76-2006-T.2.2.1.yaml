    type: accepted
  definition:
  - content: Transducteur de force qui, apres prise en compte des effets de l'acceleration
      de la pesanteur et de la poussee de l'air sur le lieu d'utilisation, mesure
      la masse en convertissant la grandeur mesuree (masse) en une autre grandeur
      mesuree (signal de sortie).
  examples: []
  id: r76-2006-f-T.2.2.1-fra
  notes:
  - content: Les cellules de pese comprenant des elements electroniques incluant un
      amplificateur, un convertisseur analogique-numerique (CAN), et un dispositif
      de traitement de donnees (en option) sont appelees des cellules de pese numeriques
      (voir Figure 1).
