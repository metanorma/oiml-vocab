  - content: Mesure de la capacité d'un milieu à modifier un champ magnétique. Elle
      est liée à la perméabilité magnétique par la relation μ/μ_0 = 1 + χ. La quantité
      μ/μ_0 est parfois appelée perméabilité relative μ_r.
