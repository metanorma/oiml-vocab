  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: 'Groupe de compteurs de gaz de différentes tailles et/ou de différents
      débits dans lequel tous les compteurs doivent avoir les caractéristiques suivantes:
      le même fabricant; la similarité géométrique de la partie de mesure; le même
      principe de mesure; à peu près les mêmes ratios Q_max/Q_min et Q_max/Q_t; la
      même classe d''exactitude; le même dispositif électronique pour chaque taille
      de compteur et utilisant les mêmes routines logicielles métrologiques pour les
      composants critiques; un niveau similaire de conception et d''assemblage de
      composants; et les mêmes matériaux pour les composants critiques.'
