data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Méthode dans laquelle un brassard étant placé sur le membre, la pression
      dans le brassard est augmentée jusqu'à l'interruption de l'écoulement sanguin
      dans l'artère puis lentement diminuée.
  examples: []
  id: r16-2-2002-fra-2.13-fra
  notes:
  - content: Lors du gonflage et du dégonflage du brassard de petites variations de
      pression (oscillations) se produisent dans le brassard en raison des pulsations
      de la pression artérielle. Ces oscillations, qui tout d'abord augmentent puis
      diminuent, sont détectées et enregistrées par le système de mesure en même temps
      que les pressions correspondantes du brassard. À partir de ces valeurs enregistrées,
      les valeurs des pressions sanguines systolique, diastolique et artérielle moyenne
      peuvent être mathématiquement calculées en utilisant un algorithme approprié.
      Il est possible d'effectuer le mesurage pendant la phase de gonflage.
  sources:
  - origin:
      ref:
        source: OIML R 16-2:2002
        version: '2002'
