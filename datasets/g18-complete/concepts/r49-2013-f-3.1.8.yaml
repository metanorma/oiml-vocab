data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: dispositif destiné à réaliser une fonction spécifique, directement impliquée
      dans l'élaboration, la transmission ou l'affichage des valeurs mesurées
  examples: []
  id: r49-2013-f-3.1.8-fra
  notes:
  - content: Pour la définition de « valeurs mesurées », voir OIML V 2-200:2012 (VIM)
      [1], 2.10.
  - content: 'Les principaux dispositifs auxiliaires sont : a) dispositif de réglage
      du zéro ; b) dispositif indicateur de prix ; c) dispositif répétiteur de l''indication
      ; d) dispositif d''impression ; e) dispositif de mémorisation ; f) dispositif
      de contrôle de la tarification ; g) dispositif de prédétermination ; h) dispositif
      de libre-service ; i) capteur de détection de mouvement de débit (pour détecter
      le mouvement du capteur de débit avant qu''il ne soit clairement visible sur
      le dispositif indicateur) ; j) dispositif de lecture à distance (pouvant être
      incorporé de manière permanente ou ajouté temporairement).'
  - content: En fonction des réglementations nationales, les dispositifs auxiliaires
      peuvent être sujets au contrôle métrologique légal.
  sources:
