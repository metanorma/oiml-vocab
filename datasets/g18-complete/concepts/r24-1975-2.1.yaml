  definition:
  - content: Maximum error, positive or negative, allowed on Verification Officers'
      metre standard on initial or subsequent verification when compared at the reference
      temperature of 20 °C with the corresponding standard of length of higher accuracy
      (in the statutory hierarchy of standards), assuming that this standard of higher
      accuracy has a negligible error for the purpose of this comparison.
