  definition:
  - content: Automatic weighing instrument that weighs a bulk product by dividing
      it into discrete loads, determining the mass of each discrete load in sequence,
      summing the weighing results and delivering the discrete loads to bulk.
  examples: []
  id: r107-2007-e-T.1.4-eng
  notes:
  - content: In this Recommendation a discontinuous totalizing automatic weighing
      instrument is called an "instrument".
