  definition:
  - content: assemblage d'éléments qui permet de réaliser des déterminations (mesures)
      qualitatives et/ou quantitatives de la teneur des substances, sur la base de
      propriétés chimiques ou physiques (ISO 7504:2001) [16]
  examples: []
  id: r144-1-2013-fra-2.4-fra
  notes:
  - content: Un analyseur de gaz mesure tous les composants couverts par cette Recommandation
      (CO, NO, NO2, ou NOx), ou mesure seulement CO, ou seulement NO et NO2, ou NOx.
