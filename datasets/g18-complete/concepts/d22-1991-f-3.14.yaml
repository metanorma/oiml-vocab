  definition:
  - content: Etroitesse de l'accord entre les résultats de mesurages successifs de
      la même quantité d'un polluant effectués par le même instrument et sous les
      mêmes conditions d'utilisation dans un délai assez court. (En lanque anglaise,
      "repeatability" est synonyme de "precision" dans le cas d'un instrument).
