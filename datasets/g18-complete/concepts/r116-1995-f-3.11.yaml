    type: accepted
  definition:
  - content: Concentration d'un element qui permet d'obtenir un signal de sortie equivalent
      a trois fois l'ecart-type de la moyenne du signal de sortie pour une solution
      blanche. C'est la quantite minimale mesuree avant de pouvoir conclure qu'un
      element a ete detecte.
  examples: []
  id: r116-1995-f-3.11-fra
  notes:
  - content: Ce terme, dans la presente Recommandation, se rapporte a la determination
      d'un element dans une solution de reference sans elements interferents. On etablit
      le bruit de fond en mesurant le signal de sortie de plusieurs parties aliquotes
      de la solution blanche.
