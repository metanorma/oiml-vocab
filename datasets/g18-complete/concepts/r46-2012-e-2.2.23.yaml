data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: grandeur qui, lors d'un mesurage direct, n'a pas d'effet sur la grandeur
      effectivement mesurée, mais a un effet sur la relation entre l'indication et
      le résultat de mesure
  examples: []
  id: r46-2012-e-2.2.23-fra
  notes:
  - content: Le concept de grandeur d'influence est entendu pour inclure les valeurs
      associées aux normes de mesurage, aux matériaux de référence et aux données
      de référence desquels le résultat d'un mesurage peut dépendre, ainsi que des
      phénomènes telles que les fluctuations à court terme d'un instrument de mesure
      et les grandeurs comme la température ambiante, la pression barométrique et
      l'humidité.
  - content: 'Dans le GUM, le concept «grandeur d''influence» est défini comme dans
      la deuxième édition du VIM. Source citation: OIML V 2-200:2012, 2.52, Note 2'
