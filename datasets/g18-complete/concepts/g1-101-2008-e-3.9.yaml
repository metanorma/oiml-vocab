    type: accepted
  definition:
  - content: expectation of the rth power of a random variable, namely $E \left(X
      ^ {r}\right) = \int_ {- \infty} ^ {\infty} \xi^ {r} g _ {X} (\xi) \mathrm {d}
      \xi$
  examples: []
  id: g1-101-2008-e-3.9-eng
  notes:
  - content: The central moment of order r is the expectation of the random variable
      $ Z=[X-E(X)]^{r}.$
  - content: The expectation $ E ( X ) $ is the first moment. The variance $ V ( X
      ) $ is the central moment of order 2.
