  definition:
  - content: fonction de variables aléatoires d'échantillons
  examples: []
  id: g1-100-2008-f-C.2.23-fra
  notes:
  - content: Une statistique, en tant que fonction de variables aléatoires, est également
      une variable aléatoire et, comme telle, elle admet différentes valeurs selon
      les échantillons. La valeur de la statistique obtenue en utilisant les résultats
      d'essais dans cette fonction peut être utilisée dans un test statistique ou
      comme estimation d'un paramètre d'une population tel que la moyenne ou l'écart-type.
