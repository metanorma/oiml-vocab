  definition:
  - content: conditions de fonctionnement devant etre atteintes pendant le mesurage
      afin que le compteur fonctionne tel qu'il a ete concu
  examples: []
  id: r49-2013-e-3.4.4-fra
  notes:
  - content: les conditions assignees de fonctionnement specifient les intervalles
      pour les debits et pour les grandeurs d'influence dans lesquelles les erreurs
      (d'indication) doivent etre au sein des erreurs maximales tolerees.
  - content: 'Source citation: OIML V 2-200:2012 (VIM) [1], 4.9, modifie — << devant
      etre atteintes >> remplace << qui doivent etre remplies >> ; << compteur >>
      remplace << instrument de mesure or systeme de mesure >>.'
