  definition:
  - content: operating condition requiring fulfilment during measurement in order
      that a meter perform as designed
  examples: []
  id: r49-2013-e-3.4.4-eng
  notes:
  - content: The rated operating conditions specify intervals for the flow rate and
      for the influence quantities for which the errors (of indication) are required
      to be within the maximum permissible errors.
  - content: 'Source citation: OIML V 2-200:2012 (VIM) [1], 4.9, modified — "requiring
      fulfillment" replaces "that must be fulfilled"; "meter" replaces "measuring
      instrument or measuring system".'
