    type: accepted
  definition:
  - content: Private body authorized (licensed) to perform certain activities in legal
      metrology beyond the scope of metrological supervision (especially activities
      of metrological control - certification of a measuring instrument, initial and
      subsequent verification of a measuring instrument, metrological control of a
      prepackage).
  examples: []
  id: d9-2004-e-2.21-eng
  notes:
  - content: Prior to authorization, their technical competence is normally demonstrated
      by an approval of their quality system through accreditation or any equivalent
      type of assessment.
