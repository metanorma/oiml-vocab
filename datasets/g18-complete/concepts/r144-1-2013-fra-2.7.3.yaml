  definition:
  - content: moyens permettant à l'utilisateur d'ajuster le système d'analyse des
      gaz sans avoir la possibilité d'aller au signal de mesure d'entrée, selon que
      l'ajustement électrique est requis ou non
  examples: []
  id: r144-1-2013-fra-2.7.3-fra
  notes:
  - content: Pour les systèmes d'analyse des gaz qui requièrent que le mélange de
      gaz pour étalonnage soit entré manuellement, les moyens d'ajustage sont définis
      comme étant semi-automatiques.
