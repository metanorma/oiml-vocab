  definition:
  - content: Partie du compteur qui reçoit les signaux de sortie du ou des dispositifs
      de mesure et, éventuellement, des dispositifs de mesure associés, les traite,
      et, le cas échéant, mémorise les résultats jusqu'à leur utilisation. De plus,
      le calculateur peut être en mesure de communiquer dans les deux sens avec les
      dispositifs complémentaires.
