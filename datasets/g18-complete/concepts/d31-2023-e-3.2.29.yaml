  definition:
  - content: subject to legal control
  examples: []
  id: d31-2023-e-3.2.29-eng
  notes:
  - content: If a measuring instrument is under legal control, then the measurement
      data, software and parameters that are critical for the metrological characteristics,
      including the metrological functions, securing and protection features, and/or
      for the completion of the transaction, are also under legal control.
  - content: The relevant Recommendations define what is legally relevant and formulate
      requirements to those items (e.g., data, functions, securing and protection
      features and information for the completion of the transaction).
