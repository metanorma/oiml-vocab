data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Pour une variable aléatoire discrète X prenant des valeurs x_i avec des
      probabilités p_i, l'espérance mathématique, si elle existe, est mu = E(X) =
      sum p_i x_i, la somme étant étendue à toutes les valeurs de x_i susceptibles
      d'être prises par X. Pour une variable aléatoire continue X ayant pour fonction
      de densité de probabilité f(x), l'espérance mathématique, si elle existe, est
      mu = E(X) = integral x f(x) dx, l'intégrale étant étendue au domaine de variation
      de X.
