  definition:
  - content: taux auquel l'énergie est transporté
  examples: []
  id: r46-2012-e-2.2.15-fra
  notes:
  - content: Dans un système électrique, la puissance active est mesurée comme étant
      la moyenne temporelle de la puissance instantanée, qui est calculée à chaque
      instant comme étant le produit de la tension et du courant p(t) = u(t) * i(t).
      Dans des conditions sinusoïdales, la puissance active est le produit entre la
      valeur efficace du courant, la tension et le cosinus de la phase angulaire,
      calculés pour chaque phase. Elle est généralement exprimée en kW.
