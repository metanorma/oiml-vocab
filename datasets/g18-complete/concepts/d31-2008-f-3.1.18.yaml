  definition:
  - content: Fichier continu de données contenant un enregistrement des défaillances/fautes
      qui ont une influence sur les caractéristiques métrologiques. Ceci s'applique
      particulièrement aux défaillances volatiles qui ne peuvent être identifiées
      ensuite lorsque les valeurs de mesure sont utilisées.
