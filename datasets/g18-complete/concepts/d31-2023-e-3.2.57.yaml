    type: accepted
  definition:
  - content: process to establish and maintain the integrity of the legally relevant
      software of a measuring instrument
  examples: []
  id: d31-2023-e-3.2.57-eng
  notes:
  - content: Configuration management as a discipline covers all aspects of legally
      relevant parts of the measuring instrument, whether software or hardware. However,
      this document only covers the software related requirements. Configuration management
      regarding hardware parts are to be given in the relevant Recommendation.
