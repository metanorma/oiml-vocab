  - content: 'Exprime en A . mL . g^-1 ou V . mL . g^-1, et par l''equation: S = (P
      x F) / M ou S = sensibilite, P = l''aire integree du pic (A . s ou V . s), F
      = le debit de gaz vecteur (mL . s^-1), M = masse de l''echantillon dans le gaz
