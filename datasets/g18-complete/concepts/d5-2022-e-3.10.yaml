  - content: provision of objective evidence that a given item fulfils specified requirements
  examples:
  - content: Confirmation that a given reference material as claimed is homogeneous
      for the quantity value and measurement procedure concerned, down to a measurement
      portion having a mass of 10 mg.
  - content: Confirmation that performance properties or legal requirements of a measuring
      system are achieved.
