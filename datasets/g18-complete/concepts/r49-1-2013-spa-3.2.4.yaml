data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Es el valor de la cantidad medida menos el valor de la cantidad de referencia.
  examples: []
  id: r49-1-2013-spa-3.2.4-spa
  notes:
  - content: 'Fuente citation: OIML V 2-200:2012 (VIM) [1], 2.16.'
  - content: Para la aplicación de esta parte de OIML R 49, se considera que el volumen
      indicado es el valor de la cantidad medida y que el volumen real es el valor
      de la cantidad de referencia. La diferencia entre el volumen indicado y el volumen
      real es referida como error (de la indicación).
  - content: En esta recomendación el error (de la indicación) se expresa como un
      porcentaje del volumen real y es igual a (Vi - Va) / Va x 100 %
