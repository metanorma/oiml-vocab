    type: accepted
  definition:
  - content: Fonction (mathématique) qui lie les valeurs d'un grand domaine (potentiellement
      très grand) à une plus petite étendue. Une "bonne" fonction de hachage est telle
      que les résultats de l'application de la fonction à une (grande) série de valeurs
      dans le domaine seront uniquement distribués (et apparemment aléatoirement)
      sur l'étendue.
