    type: accepted
  definition:
  - content: dispositif destiné à réaliser une fonction particulière, directement
      impliquée dans l'élaboration, la transmission ou l'affichage des résultats de
      mesure
  examples: []
  id: r49-1-2000-fra-2.1.8-fra
  notes:
  - content: Les principaux dispositifs auxiliaires sont (a) dispositif de mise à
      zéro; (b) dispositif indicateur de prix; (c) dispositif indicateur à répétition;
      (d) dispositif imprimeur; (e) dispositif de mémorisation; (f) dispositif de
      commande de tarification; (g) dispositif de prédétermination; et (h) dispositif
      de libre-service.
  - content: Un dispositif auxiliaire peut être ou ne pas être soumis au contrôle
      métrologique légal selon les réglementations nationales.
