data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: mathematical relation among all quantities known to be involved in a
      measurement
  examples: []
  id: g1-102-2011-e-3.7-eng
  notes:
  - content: Adapted from JCGM 200:2008 definition 2.48.
  - content: A general form of a measurement model is the equation $ h ( Y, X_{1},
      \dots, X_{N} )=0 $ , where Y, the output quantity in the measurement model,
      is the measurand, the quantity value of which is to be inferred from information
      about input quantities $ X_{1},\dots,X_{N} $ in the measurement model.
  - content: In cases where there are two or more output quantities in a measurement
      model, the measurement model consists of more than one equation.
