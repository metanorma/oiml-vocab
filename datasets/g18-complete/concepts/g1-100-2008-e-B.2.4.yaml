data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: value attributed to a particular quantity and accepted, sometimes by
      convention, as having an uncertainty appropriate for a given purpose
  examples:
  - content: At a given location, the value assigned to the quantity realized by a
      reference standard may be taken as a conventional true value.
  - content: 'The CODATA (1986) recommended value for the Avogadro constant: 6,022
      136 7 x 10^23 mol^-1.'
  id: g1-100-2008-e-B.2.4-eng
  notes:
  - content: '"Conventional true value" is sometimes called assigned value, best estimate
      of the value, conventional value or reference value. "Reference value", in this
      sense, should not be confused with "reference value" in the sense used in the
      Note to VIM:1993, definition 5.7.'
  - content: Frequently, a number of results of measurements of a quantity is used
      to establish a conventional true value.
