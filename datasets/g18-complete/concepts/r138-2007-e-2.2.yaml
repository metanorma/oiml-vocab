  definition:
  - content: 'Mesures remplies selon les besoins et utilisées pour la vente au détail
      de boissons vendu au volume. Elles sont divisées en deux catégories: les mesures
      de transfert utilisées uniquement pour le transvasement de volumes déterminés
      de boissons et les mesures à boire utilisées également pour la consommation
      de volumes déterminés de boissons.'
