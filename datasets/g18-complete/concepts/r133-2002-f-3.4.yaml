  definition:
  - content: Élargissement à la partie supérieure du capillaire, protégeant le réservoir
      contre une éventuelle déformation ou rupture suite à une pression excessive
      du liquide ou du gaz quand le thermomètre est exposé à une température dépassant
      son étendue de travail.
