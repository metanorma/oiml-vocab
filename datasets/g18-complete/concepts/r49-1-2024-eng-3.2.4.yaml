data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: measured quantity value minus a reference quantity value
  examples: []
  id: r49-1-2024-eng-3.2.4-eng
  notes:
  - content: For the application of this part of ISO 4064|OIML R 49, the indicated
      volume is considered as the measured quantity value and the actual volume as
      the reference quantity value. The difference between indicated volume and actual
      volume is referred to as error (of indication).
  - content: In this Recommendation, the error (of indication) is expressed as a percentage
      of the actual volume and is equal to $\frac{\left(V_{\mathrm{i}}-V_{\mathrm{a}}\right)}{V_{\mathrm{a}}}\times100\%$.
