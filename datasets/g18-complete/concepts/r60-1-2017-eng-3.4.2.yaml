  definition:
  - content: group of load cells which for the purposes of type evaluation are considered
      as one family and that are of the same material or combination of materials,
      the same design of the measurement technique, the same principle used to attach
      the strain gauge to the load cell, the same method of construction, the same
      set of specifications, and one or more load cell groups where all load cells
      within the group possess identical metrological characteristics
