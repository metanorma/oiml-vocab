  definition:
  - content: interface (materielle et/ou logicielle) autorisant uniquement l introduction
      de donnees dans le dispositif de traitement de donnees d un instrument, module
      ou composant electronique, et interdisant l affichage de donnees qui ne sont
      pas clairement definies et qui pourraient etre confondues avec un resultat de
      pesage; la falsification de resultats de pesage ou d indications primaires affiches,
      traites ou stockes; ou tout ajustage de l instrument ou toute modification d
      un facteur d ajustage
