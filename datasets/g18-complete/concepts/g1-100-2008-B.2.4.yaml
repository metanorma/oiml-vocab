data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: valeur attribuée à une grandeur particulière et reconnue, parfois par
      convention, comme la représentant avec une incertitude appropriée pour un usage
      donné
  examples:
  - content: En un lieu donné, la valeur attribuée à la grandeur réalisée par un étalon
      de référence peut être prise comme étant une valeur conventionnellement vraie.
  - content: 'Valeur recommandée par CODATA (1986) pour la constante d''Avogadro,
      NA: 6,022 136 7 x 10^23 mol^-1.'
  id: g1-100-2008-f-B.2.4-fra
  notes:
  - content: La valeur conventionnellement vraie est quelquefois appelée valeur assignée,
      meilleure estimation de la valeur, valeur convenue ou valeur de référence; le
      terme «valeur de référence», dans ce sens, ne doit pas être confondu avec le
      même terme utilisé dans le sens de la note dans le VIM:1993, définition 5.7.
  - content: On utilise souvent un grand nombre de résultats de mesures d'une grandeur
      pour établir une valeur conventionnellement vraie.
  sources:
