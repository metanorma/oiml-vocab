  definition:
  - content: L'aire de visée est la partie d'un plan perpendiculaire à l'axe optique,
      dont l'image à la distance de visée couvre le capteur du pyromètre (ou, le cas
      échéant, le diaphragme de champ). Le diamètre de l'aire de visée détermine les
      dimensions minimales de l'objet dont la température peut être mesurée par le
      pyromètre dans les limites d'erreurs tolérées.
