    type: accepted
  definition:
  - content: Signal de sortie pour une masse des composants intéressants de l'échantillon
      dans le gaz porteur égale à l'unité ; elle s'exprime selon l'une des deux manières
      suivantes. Pour un détecteur sensible à la concentration, elle s'exprime en
      A * mL/g ou en V * mL/g par l'équation S = (P*F)/M où P est la surface du pic,
      F est le débit du gaz porteur, M est la masse de l'échantillon dans le gaz porteur.
      Pour un détecteur sensible au débit massique, elle s'exprime en A * s/g ou V
      * s/g par l'équation S = P/M.
  examples: []
  id: r82-1989-f-3.14-fra
  notes:
  - content: La Figure 1 illustre graphiquement le concept de limite de détction et
      d'étendue linéaire pour une certaine étendue de la sensibilité.
