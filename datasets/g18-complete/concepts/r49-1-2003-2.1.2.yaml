  definition:
  - content: Partie du compteur transformant le débit ou le volume d'eau à mesurer
      en signaux qui sont transmis au calculateur. Il peut être conçu à partir d'un
      principe mécanique ou électrique ou électronique. Il peut être autonome ou utiliser
      une source d'alimentation électrique externe.
  examples: []
  id: r49-1-2003-f-2.1.2-fra
  notes:
  - content: Pour les besoins de la présente Recommandation, le transducteur de mesure
      inclut le capteur de débit ou le capteur de volume.
