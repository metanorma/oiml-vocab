  definition:
  - content: Partie du dispositif de mesure associé, directement affectée par le mesurande,
      qui convertit les grandeurs caractéristiques du liquide (température, pression,
      masse volumique, viscosité, etc.) en un signal de mesurage (résistance, courant
      électrique, fréquence, etc.) destiné au transducteur de mesure associé.
