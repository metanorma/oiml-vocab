  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Parametre d'application legale avec une valeur qui depend de l'instrument
      individuellement. Les parametres specifiques au dispositif comprennent les parametres
      d'etalonnage (par exemple, le reglage de la pente ou d'autres reglages ou corrections)
      et les parametres de configuration (par exemple, la portee maximale, la portee
      minimale, les unites de mesure, etc.). Ils sont reglables ou selectables seulement
      par un mode d'operation speciale de l'instrument. Les parametres specifiques
      du dispositif peuvent etre classes comme ceux qui doivent etre securises (inalterables)
      et ceux qui peuvent etre accessibles (parametres selectables) par une personne
      autorisee.
