    type: accepted
  definition:
  - content: Organisme ou personne chargé de la certification dans un État Membre
      de l'OIML, désigné par son Membre du CIML, qui délivre des Certificats OIML
      de Conformité selon les règles du Système de Certificats OIML pour les Instruments
      de Mesure.
  examples: []
  id: b3-2003-f-2.13-fra
  notes:
  - content: Un Membre du CIML peut être responsable d'une Autorité de Délivrance.
  - content: Une liste de toutes les Autorités de Délivrance dans les divers États
      Membres est tenue à jour par le BIML et disponible en permanence pour les États
      Membres et les autres parties intéressées sur le site Internet de l'OIML et
      sur demande.
  - content: L'Autorité de Délivrance qui émet des Certificats OIML peut être l'organisme
      national qui délivre les certificats nationaux d'approbation de type ou une
      autre organisation, leurs responsabilités étant régies par des réglementations
      nationales.
