  definition:
  - content: internal device or process that checks whether the breath alcohol analyzer
      is suitably adjusted. Such a device may include internal checking elements (for
      example signal stability or temperature stability) or additional external elements
      to be connected to the instrument such as optical or electrical filters or a
      cylinder with a test gas of known concentration
