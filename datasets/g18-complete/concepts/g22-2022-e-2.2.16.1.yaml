  definition:
  - content: transaction for which a recharging service is available to an end user
      without the need for that end user to register, conclude a written agreement,
      or enter into a longer-lasting commercial relationship with the operator of
      that recharging point or with a charging network service provider, beyond the
      mere purchase of the service
