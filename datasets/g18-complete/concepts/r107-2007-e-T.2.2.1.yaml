  definition:
  - content: Device employing electronic sub-assemblies and performing a specific
      function.
  examples: []
  id: r107-2007-e-T.2.2.1-eng
  notes:
  - content: 'An electronic device may be a complete measuring instrument (for example:
      counter scale, electricity meter) or a part of a measuring instrument (for example:
      printer, indicator).'
  - content: An electronic device can be a module in the sense that this term is used
      in OIML Publication B 3 "OIML Certificate System for Measuring Instruments"
      [3].
