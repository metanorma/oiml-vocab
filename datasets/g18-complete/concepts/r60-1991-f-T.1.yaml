  definition:
  - content: Transducteur de force qui, après qu'il ait été tenu compte des effets
      de l'accélération de la pesanteur et de la poussée de l'air au lieu d'utilisation,
      mesure la masse en convertissant la grandeur mesurée (masse) en une autre grandeur
      mesurée (signal de sortie).
