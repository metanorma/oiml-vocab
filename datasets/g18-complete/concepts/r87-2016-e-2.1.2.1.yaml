  definition:
  - content: sum of individual prepackage errors considering their arithmetic signs
      divided by the number of prepackages in the inspection lot or sample
  examples: []
  id: r87-2016-e-2.1.2.1-eng
  notes:
  - content: The average error for all prepackages in a sample with sample size n
      is designated by the symbol $e_{\mathrm{ave}}$.
  - content: The average error for all prepackages in an inspection lot with N prepackages
      is designated by the symbol $E_{\mathrm{ave}}$.
