  definition:
  - content: property of a random variable $ X_{i} $ , a component of $ \boldsymbol{X}
      $ having probability density function $ g_{\boldsymbol{X}}(\boldsymbol{\xi})
      $ , given by $ V \left(X _ {i}\right) = \int_ {- \infty} ^ {\infty} \dots \int_
      {- \infty} ^ {\infty} \left[ \xi_ {i} - E \left(X _ {i}\right) \right] ^ {2}
      g _ {\boldsymbol {X}} \left(\boldsymbol {\xi}\right) \mathrm {d} \xi_ {N} \dots
      \mathrm {d} \xi_ {1} = \int_ {- \infty} ^ {\infty} \left[ \xi_ {i} - E \left(X
      _ {i}\right) \right] ^ {2} g _ {X _ {i}} \left(\xi_ {i}\right) \mathrm {d} \xi_
      {i}$
