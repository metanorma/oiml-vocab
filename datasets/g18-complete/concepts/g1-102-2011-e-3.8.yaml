data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: measurement model in which there is any number of output quantities
  examples: []
  id: g1-102-2011-e-3.8-eng
  notes:
  - content: The general form of the multivariate measurement model is the equations
      $ h _ {1} \left(Y _ {1}, \dots , Y _ {m}, X _ {1}, \dots , X _ {N}\right) =
      0, \quad \dots , \quad h _ {m} \left(Y _ {1}, \dots , Y _ {m}, X _ {1}, \dots
      , X _ {N}\right) = 0,$ where $ Y_{1},\dots,Y_{m} $ , the output quantities,
      m in number, in the multivariate measurement model, constitute the measurand,
      the quantity values of which are to be inferred from information about input
      quantities $ X_{1},\dots,X_{N} $ in the multivariate measurement model.
  - content: A vector representation of the general form of multivariate measurement
      model is $ h (Y, X) = 0,$ where $ \boldsymbol{Y} = (Y_{1},\dots,Y_{m})^{\top}
      $ and $ \boldsymbol{h} = (h_{1},\dots,h_{m})^{\top} $ are matrices of dimension
      $ m\times1. $
  - content: If, in note 1, m, the number of output quantities, is unity, the model
      is known as a univariate measurement model.
