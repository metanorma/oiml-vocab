data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Instrument that requires the intervention of an operator during the weighing
      process to decide that the weighing result is acceptable.
  examples: []
  id: r76-1-2006-eng-T.1.2-eng
  notes:
  - content: Deciding that the weighing result is acceptable includes any intelligent
      action by the operator that affects the result, such as taking an action when
      an indication is stable or adjusting the mass of the weighed load, and to make
      a decision regarding the acceptance of each weighing result on observing the
      indication or releasing a print out.
  - content: In this Recommendation a non-automatic weighing instrument is called
      an "instrument".
