data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: form of metrological supervision aimed at establishing that a measuring
      instrument in use in the field complies with the statutory requirements
  examples: []
  id: d16-2011-e-2.25-eng
  notes:
  - content: '"Field surveillance" should not only cover the instrument itself but
      also the user, to evaluate the proper use of the instrument.'
  - content: On the relation between market surveillance and field surveillance -
      both types of surveillance can in principle overlap but where a conformity assessment
      of a measuring instrument indicates that the findings can be directly related
      to the responsibilities of manufacturers or their representatives, the matter
      should be dealt with by market surveillance.
