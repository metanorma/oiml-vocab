  definition:
  - content: Les réfractomètres sont des instruments de mesure de l'indice de réfraction.
      S'ils sont munis d'échelles appropriées, ils sont utilisés pour déterminer la
      teneur en sucre des liquides, auquel cas la relation entre titre massique et
      indice de réfraction doit avoir été définie (voir 3).
