  definition:
  - content: Conception ou principe de module logiciel ou d'unité matériel, ou conception
      ou principe d'une caractéristique qui est considéré comme conforme à une exigence
      donnée. Une solution acceptable fournit un exemple illustrant comment une exigence
      donnée peut être respectée, sans préjudice pour les autres solutions respectant
      également l'exigence.
