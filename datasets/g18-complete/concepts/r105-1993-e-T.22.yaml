    type: accepted
  definition:
  - content: For masses equal to or greater than the minimum measured quantity, a
      durability error greater than one-fifth of the absolute value of the maximum
      permissible error for the measured quantity.
  examples: []
  id: r105-1993-e-T.22-eng
  notes:
  - content: Durability errors are not considered as significant when the indication
      cannot be interpreted, memorized or transmitted as a measurement result, or
      the indication is such that it is impossible to perform any measurement.
