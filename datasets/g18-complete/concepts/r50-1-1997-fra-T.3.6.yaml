  definition:
  - content: 'Dispositif utilisant l''information fournie par la cellule de pesage
      et le transducer de déplacement afin d''effectuer: soit la somme des charges
      partielles, soit l''intégration du produit de la charge linéique par la vitesse
      de la bande.'
