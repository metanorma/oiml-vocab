    type: accepted
  definition:
  - content: extreme value of the change in error of indication of a meter, permitted
      by this Recommendation, when a single influence factor is taken from its value
      at reference conditions and varied within the rated operating conditions
  examples: []
  id: r46-2012-e-2.2.20-eng
  notes:
  - content: For each influence factor there is one corresponding maximum permissible
      error shift.
  - content: In this Recommendation, the maximum permissible error is a combination
      of the base maximum permissible error and the maximum permissible error shift
      as described in Annex B.
