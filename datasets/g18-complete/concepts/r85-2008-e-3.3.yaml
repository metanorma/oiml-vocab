  definition:
  - content: Device intended to perform a particular function, directly involved in
      elaborating, transmitting or displaying measurement results.
  examples:
  - content: repeating indicating device
  - content: printing device
  - content: conversion device
  - content: memory device
  id: r85-2008-e-3.3-eng
