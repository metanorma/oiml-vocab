  definition:
  - content: Dispositif destiné à réaliser une fonction particulière, directement
      impliquée dans l'élaboration, la transmission ou l'affichage des résultats de
      mesure.
  examples:
  - content: dispositif indicateur répétiteur
  - content: dispositif imprimeur
  - content: dispositif de mémorisation
  - content: dispositif de conversion
  id: r85-2008-e-3.3-fra
  notes:
  - content: Pour les besoins de cette Recommandation, un dispositif auxiliaire, sous
      réserve d'être soumis au contrôle métrologique, est considéré comme faisant
      partie du JA.
