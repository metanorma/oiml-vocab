data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: désignation alphanumérique de la taille des composants d'un système de
      tuyauterie, qui est utilisé à des fins de référence
  examples: []
  id: r49-2013-f-3.3.14-fra
  notes:
  - content: Le diamètre nominal est exprimé par les lettres DN suivies par un nombre
      entier sans dimension qui est indirectement lié à la taille physique, en millimètre,
      de l'alésage ou du diamètre extérieur des raccords aux extrémités.
  - content: Le nombre suivant les lettres DN ne représente pas une valeur mesurable
      et ne doit pas être utilisé à des fins de calcul, sauf si spécifié dans la Recommandation
      pertinente.
  - content: Dans ces recommandations utilisant le système de désignation DN, toute
      relation entre DN et les dimensions du composant doit être donnée, par exemple,
      DN / OD ou DN / ID.
  sources:
