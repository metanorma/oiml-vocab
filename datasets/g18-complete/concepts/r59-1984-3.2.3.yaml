  definition:
  - content: Le nom « table de correction » est donné à tout système - table, graphe
      ou abaque, règle à calcul - utilisé pour la détermination du titre à partir
      de la valeur indiquée par l'humidimètre, lorsque cette valeur indiquée du titre
      est modifiée par une grandeur d'influence qui n'est pas prise en compte automatiquement
      par l'humidimètre (température de l'échantillon, par exemple).
