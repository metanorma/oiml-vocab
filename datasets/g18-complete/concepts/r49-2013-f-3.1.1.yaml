data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: instrument destiné à mesurer de manière continue, mémoriser et afficher
      le volume d'eau passant à travers le transducteur de mesure aux conditions de
      mesurage
  examples: []
  id: r49-2013-f-3.1.1-fra
  notes:
  - content: Un compteur d'eau comprend au moins un transducteur de mesure, un calculateur
      (incluant des dispositifs d'ajustage ou de correction le cas échéant) et un
      dispositif indicateur. Ces trois dispositifs peuvent être dans des boîtiers
      différents.
  - content: Un compteur d'eau peut être un compteur combiné (voir 3.1.16).
  - content: Dans cette Recommandation, il est également fait référence au compteur
      d'eau en tant que « compteur ».
