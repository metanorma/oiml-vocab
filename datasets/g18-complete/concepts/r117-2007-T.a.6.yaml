  definition:
  - content: Dispositif destiné à accomplir une fonction particulière directement
      impliquée dans l'élaboration, la transmission ou l'affichage de résultats de
      mesurage.
  examples: []
  id: r117-2007-f-T.a.6-fra
  notes:
  - content: 'Les principaux dispositifs complémentaires sont les suivants: dispositif
      de remise à zéro, dispositif indicateur répétiteur, dispositif d''impression,
      dispositif de mémoirisation, dispositif indicateur de prix, dispositif totalisateur,
      dispositif de correction, dispositif de conversion, dispositif prédéterminateur,
      dispositif de libre-service.'
