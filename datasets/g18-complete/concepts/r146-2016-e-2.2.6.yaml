  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: difference between the error of indication (during or after exposure
      to a disturbance) and the mean intrinsic error of a measuring instrument with
      reference to a certified measurement standard
  examples: []
  id: r146-2016-e-2.2.6-eng
  notes:
  - content: Principally, a fault is the result of an undesired change of data contained
      in or flowing through an electronic measuring instrument. From the definition
      it follows that a 'fault' is a numerical value which is expressed either in
      a unit of measurement or as a relative value. If a certified measurement standard
      is not used, a fault is the difference between a single indication during or
      after a disturbance and the mean indication at reference conditions prior to
      test.
