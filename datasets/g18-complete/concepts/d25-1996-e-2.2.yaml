data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: The K-factor, in pulses per unit volume, is the ratio of the meter output
      (in number of pulses) to the corresponding total volume of fluid passing through
      the meter during the measuring period.
  examples: []
  id: d25-1996-e-2.2-eng
  notes:
  - content: The K-factor is the function of the Reynolds number. In this Document
      all the characteristics are given in relation to the Reynolds number. However,
      in legal metrology the characteristics are normally given in relation to the
      flowrate, which can be obtained from the Reynolds number.
