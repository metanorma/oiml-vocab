    type: accepted
  definition:
  - content: ratio of the RMS value of the harmonic content (obtained e.g. by subtracting
      its fundamental term from a non-sinusoidal alternating quantity) to the RMS
      value of the fundamental term. The distortion factor is usually expressed as
      a percentage. It is equal to the total harmonic distortion using the fundamental
      as the reference (denominator)
