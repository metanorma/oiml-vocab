    type: accepted
  definition:
  - content: cumulative measuring process with no definite end that cannot be stopped
      and continued again by a user/operator without falsifying the result of the
      measurement
  examples: []
  id: d31-2023-e-3.2.48-eng
  notes:
  - content: 'Examples include: a) continuous totalising automatic weighing instrument,
      b) heat meter.'
  - content: See also interruptible cumulative measurement (3.2.27).
