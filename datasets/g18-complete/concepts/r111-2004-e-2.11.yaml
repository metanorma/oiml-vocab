  definition:
  - content: Paramètre décrivant le profil de rugosité évalué d'un échantillon. La
      lettre R indique le type de profil évalué, dans ce cas R pour profil de rugosité.
  examples: []
  id: r111-2004-e-2.11-fra
  notes:
  - content: 'Le profil évalué d''un échantillon peut être de différents types: un
      profil de rugosité ou paramètre-R, un profil primaire ou paramètre-P, un profil
      d''ondulation ou paramètre-W. [4]'
