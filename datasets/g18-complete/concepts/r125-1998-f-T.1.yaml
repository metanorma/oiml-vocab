  definition:
  - content: Instrument de mesure determinant et indiquant la masse du liquide contenu
      dans un reservoir de mesurage. L'instrument comprend des dispositifs tels qu'un
      transducteur de mesure (ou des transducteurs) pour la mesure d'une quantite
      liee a la masse du liquide, un calculateur et un indicateur.
