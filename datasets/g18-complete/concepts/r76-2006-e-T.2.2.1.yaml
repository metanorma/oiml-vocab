data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Transducteur de force qui, après prise en compte des effets de l'accélération
      de la pesanteur et de la poussée de l'air sur le lieu d'utilisation, mesure
      la masse en convertissant la grandeur mesurée (masse) en une autre grandeur
      mesurée (signal de sortie).
  examples: []
  id: r76-2006-e-T.2.2.1-fra
  notes:
  - content: Les cellules de pesée comprenant des éléments électroniques incluant
      un amplificateur, un convertisseur analogique-numérique (CAN), et un dispositif
      de traitement de données (en option) sont appelées des cellules de pesée numériques
      (voir Figure 1).
