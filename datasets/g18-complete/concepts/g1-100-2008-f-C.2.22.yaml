  definition:
  - content: 'dans la distribution d''un caractère unique, moyenne arithmétique de
      la qième puissance de la différence entre les valeurs observées et leur moyenne
      x_bar: (1/n) sum_i (x_i - x_bar)^q, où n est le nombre d''observations'
