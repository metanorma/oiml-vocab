  definition:
  - content: Paramètre d'un dipôle magnétique. L'intensité du champ magnétique générée
      par un dipôle et la force entre le dipôle et un échantillon magnétisé, sont
      proportionnelles à ce moment dipolaire. La force entre le dipôle et un échantillon
      ayant une susceptibilité magnétique est proportionnelle au carré du moment dipolaire.
