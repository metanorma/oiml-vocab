    type: accepted
  definition:
  - content: part of the meter that allows an adjustment of the meter such that the
      error curve of the meter is generally shifted parallel to itself to fit in the
      envelope of the maximum permissible errors
  examples: []
  id: r49-1-2013-eng-3.1.6-eng
  notes:
