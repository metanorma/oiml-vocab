  definition:
  - content: incertidumbre típica obtenida a partir de las incertidumbres típicas
      individuales asociadas a las magnitudes de entrada de un modelo de medición
  examples: []
  id: d10-2022-spa-3.7-spa
  notes:
  - content: Cuando existan correlaciones entre las magnitudes de entrada en un modelo
      de medición, en el cálculo de la incertidumbre típica combinada es necesario
      también considerar las covarianzas; véase también la Guía ISO/IEC 98-3:2008,
      2.3.4.
