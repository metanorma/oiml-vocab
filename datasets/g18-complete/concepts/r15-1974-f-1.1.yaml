data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: la masse volumique de « remplissage » par ce grain d'un certain récipient
      ; cette caractéristique dépend non seulement de la qualité intrinsèque du grain
      considéré mais aussi de son état hygrométrique, de la capacité, de la forme
      et des dimensions du récipient servant à mesurer son volume, ainsi que de la
      façon dont s'effectue le remplissage.
  examples: []
  id: r15-1974-f-1.1-fra
  notes:
  - content: Déterminée par convention à partir de la masse de grain qui, étant dans
      un état hygrométrique défini, remplit un récipient d'une capacité de 20 litres
      de forme et dimensions spécifiées, le remplissage du récipient par le grain
      s'effectuant dans des conditions déterminées, la masse à l'hectolitre est alors
      obtenue en divisant la masse du grain exprimée en kilogrammes par le volume
      du récipient exprimé en hectolitres; elle est ainsi exprimée en kilogrammes
      par hectolitre.
  sources:
