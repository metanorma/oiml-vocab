  definition:
  - content: 'Paramètre d''un instrument de mesure, dispositif électronique, ou sous-ensemble
      sujet au contrôle légal. Les types de paramètre réglementairement pertinent
      suivants peuvent être distingués: les paramètres spécifiques au type et les
      paramètres spécifiques au dispositif.'
