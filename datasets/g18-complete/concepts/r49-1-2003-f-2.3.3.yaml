  definition:
  - content: Débit le plus élevé pour lequel un compteur d'eau doit fonctionner, durant
      une brève période de temps, dans les limites de son erreur maximale tolérée,
      tout en maintenant sa performance métrologique lorsqu'on le fait fonctionner
      par la suite dans ses conditions assignées de fonctionnement.
