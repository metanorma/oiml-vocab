  - content: Estimation caractérisant l'étendue des valeurs dans laquelle se situe
      la valeur vraie d'une erreur, comprenant les composantes dues à l'étalon et
      à sa mise en œuvre, et des composantes liées à l'instrument vérifié ou étalonné
      lui-même.
