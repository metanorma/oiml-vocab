data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: conditions de fonctionnement devant être atteintes pendant le mesurage
      afin que le compteur fonctionne tel qu'il a été conçu
  examples: []
  id: r49-2013-f-3.4.4-fra
  notes:
  - content: 'Source citation: OIML V 2-200:2012 (VIM) [1], 4.9, modifié — « devant
      être atteintes » remplace « qui doivent être remplies » ; « compteur » remplace
      « instrument de mesure or système de mesure ».'
  - content: Les conditions assignées de fonctionnement spécifient les intervalles
      pour les débits et pour les grandeurs d'influence dans lesquelles les erreurs
      (d'indication) doivent être au sein des erreurs maximales tolérées.
