  - content: Groupe identifiable d'instruments de mesure appartenant au même type
      fabriqué, dans la même catégorie, ayant les mêmes caractéristiques de modèle
      et principes métrologiques de mesure mais qui peut différer pour certaines caractéristiques
      métrologiques et techniques de performance, telles que définies dans la Recommandation
      applicable.
