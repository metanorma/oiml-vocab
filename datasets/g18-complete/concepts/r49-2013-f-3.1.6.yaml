  definition:
  - content: partie du compteur qui permet un ajustage du compteur de telle sorte
      que la courbe d'erreur du compteur est entièrement décalée parallèlement à elle-même
      afin de tenir dans l'enveloppe des erreurs maximales tolérées
  examples: []
  id: r49-2013-f-3.1.6-fra
  notes:
  - content: Pour la définition du terme « ajustage d'un système de mesure », voir
      OIML V 2-200:2012 (VIM) [1], 3.11.
