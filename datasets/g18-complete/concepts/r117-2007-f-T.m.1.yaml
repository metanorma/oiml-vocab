  definition:
  - content: Partie du compteur qui traduit le débit, le volume ou la masse du liquide
      à mesurer en signaux, représentatifs du volume ou de la masse, destinés au calculateur.
      Il est constitué d'un capteur et d'un transducteur de mesure.
