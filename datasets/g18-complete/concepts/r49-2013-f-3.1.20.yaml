  definition:
  - content: type of meter that is fitted into a closed conduit by means of an intermediate
      fitting called a connection interface
  examples: []
  id: r49-2013-f-3.1.20-eng
  notes:
  - content: The inlet and outlet passages of the meter and the connection interface
      are either concentric or axial as specified in ISO 4064-4. [7]
