data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: conjunto de operaciones realizadas sobre un sistema de medición para
      que proporcione indicaciones prescritas, correspondientes a valores dados de
      la magnitud a medir
  examples: []
  id: d10-2022-spa-3.2-spa
  notes:
  - content: 'Diversos tipos de ajuste de un sistema de medición son: ajuste de cero,
      ajuste del offset y ajuste de la amplitud de escala (denominado también ajuste
      de la ganancia).'
  - content: No debe confundirse el ajuste de un sistema de medición con su propia
      calibración, que es un requisito para el ajuste.
  - content: Después de su ajuste, generalmente un sistema de medición debe ser calibrado
      nuevamente.
