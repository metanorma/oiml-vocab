  definition:
  - content: Instrument in which the test sample is supplied manually or automatically
      to the device in the continuous mode, depending on the technological process.
  examples: []
  id: r142-2008-e-2.2-eng
  notes:
  - content: A working automated refractometer may be equipped with a built-in microprocessor
      displaying the measurement data. It may also be connected to one or several
      secondary indicating devices, printing units and other auxiliary devices, including
      a universal computer.
