  definition:
  - content: Instrument de pesage utilisé pour déterminer la masse de référence statique
      du véhicule pour les véhicules de référence et les charges statiques par essieu
      pour le véhicule de référence rigide à deux essieux.
  examples: []
  id: r134-1-2006-fra-T.1.4-fra
  notes:
  - content: 'Les instruments de contrôle utilisés comme instrument de référence pendant
      les essais peuvent être: séparés de l''instrument faisant l''objet des essais;
      ou intégrés, lorsqu''un mode de pesage statique est disponible au niveau de
      l''instrument faisant l''objet des essais.'
