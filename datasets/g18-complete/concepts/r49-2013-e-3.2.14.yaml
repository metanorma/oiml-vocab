  definition:
  - content: smallest difference between displayed indications that can be meaningfully
      distinguished
  examples: []
  id: r49-2013-e-3.2.14-eng
  notes:
  - content: For a digital indicating device, this is the change in the indication
      when the least significant digit changes by one step.
