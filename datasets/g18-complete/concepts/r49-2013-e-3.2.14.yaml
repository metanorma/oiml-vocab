    type: accepted
  definition:
  - content: plus petite difference entre les indications d'un dispositif indicateur
      pouvant etre significativement distinguee
  examples: []
  id: r49-2013-e-3.2.14-fra
  notes:
  - content: Pour un dispositif indicateur numerique, il s'agit de la variation de
      l'indication lorsque le plus petit chiffre significatif change d'un pas supplementaire.
  - content: 'Source citation: OIML V 2-200:2012 (VIM) [1], 4.15.'
