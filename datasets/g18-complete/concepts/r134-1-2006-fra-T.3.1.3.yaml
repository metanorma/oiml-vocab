  definition:
  - content: Processus de détermination de la masse du véhicule, de la charge par
      essieu et, si applicable, de la charge par groupe d'essieux d'un véhicule en
      mouvement (c'est-à-dire d'un véhicule traversant le récepteur de charge de l'instrument
      de pesage) par la mesure et l'analyse des forces dynamiques des pneus du véhicule.
