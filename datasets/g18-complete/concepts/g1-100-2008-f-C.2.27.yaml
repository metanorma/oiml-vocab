data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: quand T_1 et T_2 sont deux fonctions des valeurs observées telles que,
      theta étant un paramètre de population à estimer, la probabilité Pr(T_1 <= theta
      <= T_2) soit au moins égale à (1 - alpha) [où (1 - alpha) est un nombre fixé,
      positif et inférieur à 1], l'intervalle entre T_1 et T_2 est un intervalle de
      confiance bilatéral à (1 - alpha) pour theta
  examples: []
  id: g1-100-2008-f-C.2.27-fra
  notes:
  - content: Les limites T_1 et T_2 de l'intervalle de confiance sont des statistiques
      qui, comme telles, auront en général des valeurs différentes d'échantillon en
      échantillon.
  - content: Dans une longue série d'échantillons, la fréquence des cas où la valeur
      vraie du paramètre de la population theta est contenue par l'intervalle de confiance,
      est égale ou supérieure à (1 - alpha).
  - content: 'Source citation: ISO 3534-1:1993, definition 2.57'
