  definition:
  - content: Factor calculado usando la función de distribución acumulativa t Student
      inversa (t_p,n-1) y un factor de corrección de población finita (N-n)/(N-1).
  examples: []
  id: r87-2016-spa-2.1.15-spa
  notes:
  - content: SCF tiene siempre un signo positivo porque t_p,n-1 tiene un signo negativo
      para p = 0,005.
  - content: Ver el Anexo F, literal F.3, que presenta información estadística básica
      con relación al SCF.
