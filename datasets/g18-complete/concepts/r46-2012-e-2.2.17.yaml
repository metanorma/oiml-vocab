  definition:
  - content: indication moins la valeur de la grandeur de référence, divisée par la
      valeur de la grandeur de référence
  examples: []
  id: r46-2012-e-2.2.17-fra
  notes:
  - content: L'erreur relative est généralement exprimée en pourcentage de la valeur
      de la grandeur de référence.
  - content: Étant donné que cette Recommandation ne traite que de l'erreur relative,
      la formule abrégée «erreur» est utilisée pour l'erreur relative.
