  definition:
  - content: difference between the highest and lowest results of successive measurements
      of the same load carried out under the same (or reasonably constant) conditions
      of measurement [VIM 3.6]
  examples: []
  id: r106-1-2011-eng-0.4.4.9-eng
  notes:
  - content: 'Repeatability conditions include: the same measurement procedure; the
      same operator; the same measuring instrument, used under the same conditions;
      the same location; repetition over a short period of time.'
