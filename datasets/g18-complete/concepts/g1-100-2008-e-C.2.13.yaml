  definition:
  - content: 'in a univariate distribution, the expectation of the qth power of the
      centred random variable (X - mu): E[(X - mu)^q]'
  examples: []
  id: g1-100-2008-e-C.2.13-eng
  notes:
  - content: The central moment of order 2 is the variance of the random variable
      X.
