data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Ensemble d'opérations effectuées par le Service national de métrologie
      légale (ou bien par un autre Organisme légalement autorisé) ayant pour but de
      constater et d'affirmer que l'instrument de mesurage satisfait entièrement aux
      exigences des règlements sur la vérification. La vérification comprend l'examen
      et le poinçonnage.
  examples: []
  id: d3-1979-f-5.1.1-fra
  notes:
  - content: 'La vérification se traduit donc par une sélection des instruments: ceux
      qui ont subi l''examen avec succès reçoivent l''empreinte d''un poinçon d''acceptation,
      les autres peuvent recevoir l''empreinte d''un poinçon de refus.'
  sources:
