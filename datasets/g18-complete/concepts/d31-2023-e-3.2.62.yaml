data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: protection of measuring instrument or component software or data domain
      by a hardware or software implemented seal with the intention of making an intervention
      impossible or evident
  examples:
  - content: A hardware seal on a measuring instrument's housing needs to be removed,
      damaged or broken to obtain access to change software.
  - content: A software seal in a measuring instrument records events, i.e. either
      a non-resettable counter is incremented each time an event occurs, see 3.2.21,
      or a data file, containing timestamped information, records the event, see 3.2.1.
  - content: The interface of a measuring instrument is physically sealed, so that
      accessing that interface can only be achieved by breaking, removing or damaging
      the seal.
