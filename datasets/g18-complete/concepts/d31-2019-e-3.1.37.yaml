data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: set of quantity values being attributed to a measurand together with
      any other available relevant information
  examples: []
  id: d31-2019-e-3.1.37-eng
  notes:
  - content: The relevant information may consist of e.g. measurement uncertainty,
      date and time of measurement, number of measurement, identification of sensor
      and in the case where price calculation is part of the legally relevant software,
      unit price and price to pay.
  - content: The measurement result (including the measured quantity value according
      to V 2:200:2012) is used for the legally relevant purpose, e.g. conclusion of
      a transaction.
  - content: 'Source citation: adapted from [V 2-200:2012, 2.9]'
