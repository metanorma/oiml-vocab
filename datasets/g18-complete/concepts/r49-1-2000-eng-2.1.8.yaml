  definition:
  - content: device intended to perform a particular function directly involved in
      elaborating, transmitting or displaying measurement results
  examples: []
  id: r49-1-2000-eng-2.1.8-eng
  notes:
  - content: The main ancillary devices are (a) zero setting device; (b) price indicating
      device; (c) repeating indicating device; (d) printing device; (e) memory device;
      (f) tariff control device; (g) pre-setting device; and (h) self service device.
  - content: An ancillary device may or may not be subject to legal metrological control
      according to national regulations.
