    type: accepted
  definition:
  - content: Dispositif qui utilise des sous-ensembles électroniques et qui accomplit
      une fonction spécifique. Un dispositif électronique est usuellement fabriqué
      en tant qu'unité séparée et est susceptible d'être essayé séparément.
  examples: []
  id: r50-1-1997-fra-T.3.3.1-fra
  notes:
  - content: 'Un dispositif électronique, tel que défini ci-dessus, peut être un instrument
      de pesage complet (par exemple: une balance de comptoir) ou une partie d''un
      instrument de pesage (par exemple: un imprimeur, un indicateur).'
