  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Closeness of agreement between the results of successive measurements
      of the same sample using the same instrument, under the same defined conditions
      of use, and within a relatively short period of time.
  examples: []
  id: r123-1997-e-3.5-eng
  notes:
  - content: 'The same defined conditions would include the following: method of measurement,
      the measuring instrument, the operator, the location and the ambient environmental
      conditions.'
