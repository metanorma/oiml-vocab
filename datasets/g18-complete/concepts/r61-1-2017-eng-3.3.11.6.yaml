  definition:
  - content: 'digital device equipped with operator interface(s) such as a keypad,
      mouse, touch-screen, etc. used to monitor the operations of the instrument.
      Also equipped with a display to provide feedback to the operator, such as: weighing
      results, pre-set value, fills per minute, etc. transmitted via the digital interface
      of a weighing module or an analogue data processing device'
