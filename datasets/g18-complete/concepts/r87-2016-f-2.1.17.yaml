  definition:
  - content: insuffisance de la quantité de produit permise dans un préemballage
  examples: []
  id: r87-2016-f-2.1.17-fra
  notes:
  - content: Le symbole « T » désigne l'insuffisance tolérée.
  - content: Parfois, l'insuffisance tolérée est appelée aussi erreur négative tolérée,
      limites d'erreur ou tolérances.
  - content: Par convention, T est un nombre positif mais, lorsqu'il est utilisé,
      il représente une valeur négative de quantité, ou une erreur négative.
