  definition:
  - content: Valeur, exprimée en unités de masse, de la différence entre deux valeurs
      indiquées consécutives, pour un dispositif de totalisation général ou partiel,
      l'instrument étant en mode spécial aux fins d'essais. S'il n'y a pas de mode
      spécial disponible, l'échelon de contrôle est égal à l'échelon de totalisation.
