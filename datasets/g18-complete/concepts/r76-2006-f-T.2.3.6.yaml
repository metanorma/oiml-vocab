data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Interface (materiel et/ou logiciel) qui autorise seulement l'introduction
      de donnees dans le dispositif de traitement de donnees d'un instrument, module
      ou composant electronique, telles qu'il ne soit pas possible d'afficher des
      donnees qui ne sont pas clairement definies et qui pourraient etre prises pour
      un resultat de pesage, de falsifier des resultats de pesage ou des indications
      primaires affichees, traitees ou stockees, ou d'ajuster l'instrument ou changer
      tout facteur d'ajustage, a l'exception du declenchement d'une procedure d'ajustage
      avec des dispositifs incorpores ou, dans le cas d'un instrument de classe I,
      avec des poids d'ajustage externes.
