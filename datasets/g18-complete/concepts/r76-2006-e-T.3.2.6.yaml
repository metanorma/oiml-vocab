  definition:
  - content: Instrument ayant une seule étendue de pesage qui est divisée en étendues
      de pesage partielles ayant chacune un échelon différent, l'étendue de pesage
      partielle étant déterminée automatiquement selon la charge appliquée, pour des
      charges aussi bien croissantes que décroissantes.
