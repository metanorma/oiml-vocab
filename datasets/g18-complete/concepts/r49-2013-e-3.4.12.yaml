  definition:
  - content: systematic examination and testing of the performance of one or more
      specimens of an identified type or pattern of measuring instrument against documented
      requirements, the results of which are contained in the evaluation report, in
      order to determine whether the type may be approved
  examples: []
  id: r49-2013-e-3.4.12-eng
  notes:
  - content: '"Pattern" is used in legal metrology with the same meaning as "type".'
  - content: 'Source citation: OIML V 1:2013 [2], 2.04, modified — The term synonyms
      "type evaluation" and "pattern evaluation" replace "type (pattern) evaluation";
      "type or pattern" replaces "type (pattern)".'
  sources:
