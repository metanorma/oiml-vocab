  definition:
  - content: examen et essai systematique de la performance d'un ou plusieurs specimens
      d'un type ou modele identifie d'instrument de mesure vis a vis d'exigences documentees,
      dont les resultats sont contenus dans le rapport d'evaluation, afin de determiner
      si le type peut etre approuve
  examples: []
  id: r49-2013-e-3.4.12-fra
  notes:
  - content: "« modele » est utilise avec la meme signification que « type » en metrologie
      legale."
  - content: 'Source citation: OIML V 1:2013 [2], 2.04, modifie — les termes synonyms
      « evaluation de type » et « evaluation de modele » remplacent « evaluation de
      type (modele) » ; « modele ou type » remplace « type (modele) ».'
