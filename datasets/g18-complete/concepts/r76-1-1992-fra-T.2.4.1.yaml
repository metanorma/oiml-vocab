  definition:
  - content: Organe indiquant l'équilibre et/ou le résultat.
  examples: []
  id: r76-1-1992-fra-T.2.4.1-fra
  notes:
  - content: Sur les instruments à une seule position d'équilibre, il indique uniquement
      l'équilibre (également appelé "zéro").
  - content: Sur les instruments à plusieurs positions d'équilibre, il indique à la
      fois l'équilibre et le résultat. Sur un instrument électronique, il s'agit de
      l'affichage.
