data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Un afficheur numérique peut être compris comme un afficheur primaire
      ou comme un afficheur secondaire.
  examples: []
  id: r76-1-2006-fra-T.2.2.6-fra
  notes:
  - content: 'Afficheur primaire : Soit incorporé dans le boîtier de l''indicateur,
      ou dans le boîtier du terminal, ou conçu comme un afficheur dans un boîtier
      séparé (c''est à dire un terminal sans touche), par exemple pour une utilisation
      combinée avec un module de pesage. Afficheur secondaire : Dispositif périphérique
      additionnel (en option) qui répète le résultat de pesage et toute autre indication
      primaire, ou fournit aussi, des informations non métrologiques.'
  - content: Les termes «afficheur primaire» et «afficheur secondaire» ne doivent
      pas être confondus avec les termes «indication primaire» et «indication secondaire»
      (T.1.3.1 et T.1.3.2).
