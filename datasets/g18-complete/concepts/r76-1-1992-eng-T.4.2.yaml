  definition:
  - content: Ability of an instrument to react to small variations of load.
  examples: []
  id: r76-1-1992-eng-T.4.2-eng
  notes:
  - content: The discrimination threshold, for a given load, is the value of the smallest
      additional load that, when gently deposited on or removed from the load receptor,
      causes a perceptible change in the indication.
