  definition:
  - content: measurement precision under reproducibility conditions of measurement
  examples: []
  id: r142-1-2025-eng-3.13-eng
  notes:
  - content: Relevant statistical terms are given in ISO 5725-1:1994 and ISO 5725-2:1994.
  - content: In this Recommendation, the reproducibility of measurements between units
      of the same type of instrument under reference conditions is assessed by the
      standard deviation of differences (SDD). The reproducibility of measurements
      from one instrument when select influence factors are varied is assessed by
      the magnitude of the error shift or fault.
  sources: []
