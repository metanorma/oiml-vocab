  definition:
  - content: Reciprocal of the paraxial value of the back vertex focal length measured
      in metres.
  examples: []
  id: r93-1999-e-3.7.1-eng
  notes:
  - content: The unit for expressing vertex power is the reciprocal metre m^-1. The
      name for this unit is the "dioptre", for which the symbol is D.
  - content: Conventionally the back vertex power, in dioptres, is specified as the
      "power" of a spectacle lens, although the front vertex power is required for
      certain purposes (for example in the measurement of some multifocal lenses).
