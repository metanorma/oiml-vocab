    type: accepted
  definition:
  - content: Función (matemática) que proyecto los valores de un dominio amplio (probablemente
      muy amplio) en un rango menor. Una función hash correcta es aquella en la que
      los resultados de aplicar la función en un conjunto (amplio) de valores del
      dominio se distribuyen uniformemente (y aparentemente de forma aleatoria) sobre
      el rango.
