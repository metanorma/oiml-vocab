  definition:
  - content: Élément de matériau PMMA spécialement choisi ou spécialement élaboré
      montrant des variations caractérisables d'absorbance optique spécifique induites
      par les rayonnements ionisants, selon la dose absorbée, enfermé individuellement
      par le fabricant dans un étui fermé hermétiquement. La variation d'absorbance
      spécifique peut être liée à la dose absorbée dans le matériau environnant.
