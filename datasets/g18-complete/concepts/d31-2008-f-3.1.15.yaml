  definition:
  - content: Instrument de mesure destiné à mesurer une quantité électrique ou non-electrique
      en utilisant des moyens électriques et/ou équipés de dispositifs électroniques.
  examples: []
  id: d31-2008-f-3.1.15-fra
  notes:
  - content: Pour les besoins de ce Document, les équipements complémentaires, dans
      la mesure où ils sont soumis au contrôle de la métrologie légale, sont considérés
      comme faisant partie de l'instrument de mesure.
