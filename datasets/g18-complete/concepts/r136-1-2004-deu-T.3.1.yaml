  - content: 'In Flächeneinheiten ausgedrückter Wert der Differenz bei analoger Anzeige:
      zwischen Werten, die zwei aufeinanderfolgenden Skalenmarken entsprechen, oder
      bei digitaler Anzeige: zwischen zwei aufeinanderfolgenden angezeigten Werten.'
