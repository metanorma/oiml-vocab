  definition:
  - content: device intended to perform a particular function, directly involved in
      elaborating, transmitting or displaying measurement results
  examples: []
  id: r49-1-2006-eng-2.1.8-eng
  notes:
  - content: The main ancillary devices are zero setting device, price indicating
      device, repeating indicating device, printing device, memory device, tariff
      control device, pre-setting device, and self service device.
  - content: An ancillary device may or may not be subject to legal metrological control
      according to national regulations.
