  definition:
  - content: The verification of a new measuring instrument, which has not been verified
      previously.
  examples: []
  id: d3-1979-e-5.1.2-eng
  notes:
  - content: By definition, initial verification only applies to new instruments,
      although national regulations may also require repaired or readjusted instruments
      to be submitted for verification on the lines of initial verification.
