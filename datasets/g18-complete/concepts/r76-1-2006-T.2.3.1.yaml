    type: accepted
  definition:
  - content: Dispositif utilisant des sous-ensembles électroniques et accomplissant
      une fonction spécifique.
  examples: []
  id: r76-1-2006-fra-T.2.3.1-fra
  notes:
  - content: Les dispositifs électroniques sont généralement fabriqués comme des éléments
      séparés et sont susceptibles d'être essayés indépendamment.
  - content: Un dispositif électronique, comme défini ci-dessus, peut être un instrument
      complet (par exemple, un instrument pour la vente directe au public), un module
      (par exemple, un indicateur, un dispositif de traitement de données analogiques,
      un module de pesage) ou un dispositif périphérique (par exemple, une imprimante,
      un afficheur secondaire).
