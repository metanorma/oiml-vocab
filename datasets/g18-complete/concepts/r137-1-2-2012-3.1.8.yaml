    type: accepted
  definition:
  - content: Dispositif destiné à accomplir une fonction particulière, directement
      impliquée dans l'élaboration, la transmission ou l'affichage de résultats de
      mesurage.
  examples: []
  id: r137-1-2-2012-fra-3.1.8-fra
  notes:
  - content: 'Les principaux dispositifs complémentaires sont: a) le dispositif de
      répétition, b) le dispositif d''impression, c) le dispositif de mémorisation,
      et d) le dispositif de communication.'
  - content: Un dispositif complémentaire n'est pas nécessairement soumis au contrôle
      métrologique.
  - content: Un dispositif complémentaire peut être intégré dans un compteur de gaz.
