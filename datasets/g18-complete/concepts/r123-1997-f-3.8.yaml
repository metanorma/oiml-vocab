  definition:
  - content: Matiere ou substance dont une ou plusieurs valeurs caracteristiques sont
      suffisamment homogenes et bien etablies pour etre utilisee pour l'etalonnage
      d'un appareil, l'evaluation d'une methode de mesurage, ou l'affectation de valeurs
      a des matieres.
  examples: []
  id: r123-1997-f-3.8-fra
  notes:
  - content: Ce terme ne signifie pas necessairement qu'il s'agit d'un etalon de reference
      certifie.
