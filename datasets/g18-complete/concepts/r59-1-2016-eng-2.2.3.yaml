data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: with reference to a certified measurement standard, difference between
      the error of indication during or after exposure to a disturbance and the mean
      intrinsic error of a measuring instrument
  examples: []
  id: r59-1-2016-eng-2.2.3-eng
  notes:
  - content: Principally, a fault is the result of an undesired change of data contained
      in or flowing through an electronic measuring instrument.
  - content: From the definition it follows that a fault is a numerical value which
      is expressed either in a unit of measurement or as a relative value.
  - content: If a certified measurement standard is not used, a fault is the difference
      between a single indication during or after a disturbance, and the mean indication
      at reference conditions prior to test.
  - content: 'Source citation: OIML D 11, 3.10'
