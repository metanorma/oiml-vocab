  definition:
  - content: La température normale de fonctionnement est la température du boîtier
      du pyromètre à laquelle l'erreur intrinsèque du pyromètre est déterminée. A
      toute autre température, l'erreur totale du pyromètre est égale à la somme de
      l'erreur intrinsèque et de l'erreur complémentaire due à la variation de température
      ambiante.
