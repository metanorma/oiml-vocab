  definition:
  - content: The reference operating temperature is the temperature of the pyrometer
      housing at which the intrinsic error of the pyrometer is determined. At all
      other temperatures the total error of the pyrometer is the sum of the intrinsic
      error and the complementary error due to the influence of change in ambient
      temperature.
