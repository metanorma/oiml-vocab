  definition:
  - content: Rapport de la variation unitaire du facteur de jauge à la variation de
      température.
  examples: []
  id: r62-1985-f-15-fra
  notes:
  - content: Exprimé comme (K_T1 - K_T0) / K_T0 * 1 / (T1 - T0), où T1 est la température
      d'essai, T0 est la température de référence, K_T1 est le facteur de jauge à
      la température d'essai, K_T0 est le facteur de jauge à la température de référence.
