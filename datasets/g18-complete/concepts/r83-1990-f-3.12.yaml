    type: accepted
  definition:
  - content: 'Rapport R = m/delta(m) interprété selon l''une des deux définitions
      suivantes: m est la masse correspondant au premier pic d''un doublet, et delta(m)
      la différence de masse correspondant au deux pics. Le doublet doit être séparé
      par un creux, dont la valeur ne doit pas dépasser 10 % de la valeur du pic le
      plus haut; ou m est la masse d''un constituent correspondant au pic et delta(m)
      la largeur du pic à mi-hauteur.'
  examples: []
  id: r83-1990-f-3.12-fra
  notes:
  - content: Résolution unité signifie en général R = 2|m| ou |m| est la valeur numérique
      lorsque m est exprimé en unités de masse atomique unifiées.
