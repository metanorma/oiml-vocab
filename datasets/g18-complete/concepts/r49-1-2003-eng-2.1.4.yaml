  definition:
  - content: A part of the meter which receives the output signals from the transducer(s)
      and, possibly, from associated measuring instruments, transforms them and, if
      appropriate, stores the results in memory until they are used. In addition,
      the calculator may be capable of communicating both ways with ancillary devices.
