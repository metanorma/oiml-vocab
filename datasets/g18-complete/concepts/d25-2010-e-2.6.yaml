  definition:
  - content: The pipe Reynolds number is a dimensionless ratio of inertia to viscous
      forces which is used as a correlating parameter combining the effects of viscosity,
      density and pipe line velocity. It is defined as Re = D x (U / nu) = D x U x
      (rho / mu), where D is the meter bore size, U is the average fluid velocity
      in the meter, nu is the kinematic viscosity, rho is the fluid density, and mu
      is the absolute (dynamic) viscosity.
