  definition:
  - content: identifiable part of an instrument or device that performs a specific
      function or functions, and that can be separately evaluated according to the
      metrological and technical performance requirements in this Recommendation
  examples: []
  id: r50-2014-e-2.2.10-eng
  notes:
  - content: The modules of a weighing instrument may be subject to specified partial
      error limits.
  - content: Modules may be examined separately (subject to agreement with the metrological
      authority (see 6.1.6).
  - content: 'Typical modules of an automatic weighing instrument are: load cell,
      indicator, analogue or digital processors, weighing module, remote display,
      software.'
  - content: 'Source citation: OIML B3, 3.4 [3]'
