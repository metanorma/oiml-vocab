  definition:
  - content: part of an instrument that enables information to be passed between measuring
      instruments, components of measuring instruments or other external systems
  examples: []
  id: d31-2023-e-3.2.7-eng
  notes:
  - content: Communication interfaces can utilize wired, optical, radio, etc. communication
      and they are usually designed to use a specific protocol.
  - content: This definition does not include communication between software modules.
