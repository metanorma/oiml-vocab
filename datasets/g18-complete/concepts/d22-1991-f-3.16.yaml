  definition:
  - content: Moyen de déterminer si les résultats de mesures obtenus en utilisant,
      pendant un temps relativement long, un instrument, une méthode ou un processus,
      sont à l'intérieur de limites spécifiées établies en tenant compte de l'incertitude
      et de l'erreur de la mesure.
