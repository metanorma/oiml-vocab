  definition:
  - content: 'Valeur d''une fraction sans dimension exprimée comme une décimale (par
      exemple: 0,7) utilisée pour la détermination de l''EMT (voir 2.4.9). Elle représente
      la répartition d''une erreur globale (comme cela peut s''appliquer à un instrument
      de pesage) assignée à la cellule de pesée seule (p_LC).'
