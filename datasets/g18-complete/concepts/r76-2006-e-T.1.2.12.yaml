data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Non-automatic weighing instrument having a load receptor, in one or several
      parts, which determines the total mass of road vehicles, and which is designed
      to be moved to other locations.
  examples:
  - content: Portable weighbridge, group of associated non-automatic axle (or wheel)
      load weighers.
  id: r76-2006-e-T.1.2.12-eng
  notes:
  - content: This Recommendation covers only weighbridges and groups of associated
      non-automatic axle (or wheel) load weighers that determine simultaneously the
      total mass of a road vehicle with all axles (or wheels) being simultaneously
      supported by appropriate parts of a load receptor.
  sources:
  - origin:
      ref:
        source: OIML R 76:2006
        version: '2006'
    locality:
      type: clause
      reference_from: T.1.2.12
    type: authoritative
  terms:
  - type: expression
    normative_status: preferred
    designation: portable instrument for weighing road vehicles
  language_code: eng
  entry_status: valid
date_accepted: '2026-07-13T00:00:00+00:00'
