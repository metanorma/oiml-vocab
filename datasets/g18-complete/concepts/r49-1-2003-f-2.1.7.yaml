  definition:
  - content: Dispositif connecté à ou intégré au compteur pour la correction automatique
      du volume dans les conditions de mesurage, en prenant en compte le débit et/ou
      les caractéristiques de l'eau à mesurer (par exemple, température et pression)
      et les courbes d'étalonnage pré-établies. Les caractéristiques de l'eau à mesurer
      peuvent être soit mesurées en utilisant des instruments de mesure associés,
      soit être mises en mémoire dans l'instrument.
