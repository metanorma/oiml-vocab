  definition:
  - content: The intrinsic error characterizes the accuracy of the instrument. This
      error is equal to the difference between the mean value of a sufficient number
      of indications given by the pyrometer, under reference conditions (see 3.2)
      when measuring the temperature of a black body at constant temperature, and
      a conventional true value of the temperature of that body.
