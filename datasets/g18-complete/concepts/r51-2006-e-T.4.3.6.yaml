    type: accepted
  definition:
  - content: 'Standard deviation of the error (of indication) for a number of consecutive
      automatic weighings of a load, or similar loads, passed over the load receptor,
      expressed mathematically as: s = sqrt( (sum from i=1 to n of (x_i - x-bar)^2)
      / (n - 1) ).'
