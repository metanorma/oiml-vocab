    type: accepted
  definition:
  - content: dispositif connecté à ou intégré au compteur pour la correction automatique
      du volume dans les conditions de mesurage, en prenant en compte le débit et/ou
      les caractéristiques de l'eau à mesurer (par exemple, température et pression)
      et les courbes d'étalonnage pré-établies
  examples: []
  id: r49-1-2000-fra-2.1.7-fra
  notes:
  - content: Les caractéristiques de l'eau à mesurer peuvent être soit mesurées en
      utilisant des instruments de mesure associés, soit être mises en mémoire dans
      l'instrument.
