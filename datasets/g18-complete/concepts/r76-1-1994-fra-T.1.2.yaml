data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Instruments de pesage necessitant l'intervention d'un operateur au cours
      de la pesee, par exemple pour le depot ou le retrait des charges a peser sur
      le dispositif recepteur de charge ainsi que pour l'obtention du resultat.
  - content: Ces instruments permettent l'observation directe du resultat des pesees,
      soit par affichage, soit par impression; les deux possibilites sont couvertes
      par le mot "indication".
  - content: Les instruments de pesage a fonctionnement non automatique peuvent etre
      grades ou non grades, a equilibre automatique, semi-automatique ou non automatique.
  examples: []
  id: r76-1-1994-fra-T.1.2-fra
  notes:
  - content: Des termes comme "indiquer", "element indicateur", et leurs derives,
      n'incluent pas l'impression.
  - content: Dans la presente Recommandation, les instruments de pesage a fonctionnement
      non automatique sont appeles "instruments".
