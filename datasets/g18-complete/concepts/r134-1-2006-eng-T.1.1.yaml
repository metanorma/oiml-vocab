data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Measuring instrument used to determine the mass of a body by using the
      action of gravity on the body.
  examples: []
  id: r134-1-2006-eng-T.1.1-eng
  notes:
  - content: In this Recommendation "mass" (or "weight value") is preferably used
      in the sense of "conventional mass" or "conventional value of the result of
      weighing in air" according to OIML R 111 and OIML D 28, whereas "weight" is
      preferably used for an embodiment (= material measure) of mass that is regulated
      in regard to its physical and metrological characteristics.
  - content: The instrument may also be used to determine other mass-related quantities,
      magnitudes, parameters or characteristics (e.g. axle load and axle-group load
      of a vehicle).
  - content: According to its method of operation, a weighing instrument is classified
      as an automatic or nonautomatic instrument.
  sources:
