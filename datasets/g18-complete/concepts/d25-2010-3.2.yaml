  definition:
  - content: 'Pour déterminer la quantité mesurée minimale, il convient de prendre
      en considération les conditions suivantes: limite inférieure de la fréquence
      des tourbillons engendrés, limite inférieure du nombre de Reynolds, échelon
      minimal du dispositif indicateur à connecter, exactitude pouvant être atteinte.'
