data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: failure of the device when subjected to a disturbance in which the device
      appears to function correctly, but where the legally relevant data is incorrect
      or the shift in the accuracy measurements exceeds that specified in the tests.
      Ceasing to function is not a critical fault. If a disturbance interrupts a transaction,
      then either (a) the transaction must be cancelled or (b) when the disturbance
      is removed, the transaction must be completed correctly
