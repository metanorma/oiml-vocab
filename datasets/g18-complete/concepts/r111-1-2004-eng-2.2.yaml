data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Instrument indiquant la masse apparente qui est sensible aux forces de
      gravité, de poussée de l'air et d'interaction magnétique entre le poids et la
      balance et/ou l'environnement.
  examples: []
  id: r111-1-2004-eng-2.2-fra
  notes:
  - content: Si les effets magnétiques sont négligeables, par exemple la magnétisation
      permanente (M) du poids et la susceptibilité magnétique (χ) sont suffisamment
      petites et que la balance est étalonnée avec des poids de référence dont la
      valeur est bien connue, la balance peut être utilisée pour indiquer la masse
      conventionnelle, m_c d'un corps sous des conditions choisies de manière conventionnelle.
  sources:
  - origin:
      ref:
        source: OIML R 111-1:2004
        version: '2004'
