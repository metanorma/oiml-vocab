  definition:
  - content: continuous or incremental change over time in the indication, due to
      changes in the metrological properties of a measuring instrument
  examples: []
  id: r144-2013-f-2.23-eng
  notes:
  - content: In this Recommendation, "drift" means a change in the indication which
      occurs during a stated period of time at a given concentration of CO, NO and
      $ \mathrm{N O_{2}} $ in a sample to be analyzed.
