  notes:
  - content: The load receptor may support all the wheels of an axle, a bogie, or
      a single wagon simultaneously.
  - content: Two or more load receptors may be placed in series and used as a single
      load receptor for full-draught weighing or partial weighing (see 0.3.1.2).
