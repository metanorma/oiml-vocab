  definition:
  - content: Part of an electronic device, employing electronic components and having
      a recognizable function of its own.
  examples:
  - content: amplifiers, comparators, power converters
  id: d11-2004-e-3.3-eng
  notes:
  - content: OIML B 3 contains the following definition of a "module" - Identifiable
      part of a measuring instrument or of a family of measuring instruments that
      performs a specific function or functions and that can be separately evaluated
      according to prescribed metrological and technical performance requirements
      in the relevant Recommendation.
