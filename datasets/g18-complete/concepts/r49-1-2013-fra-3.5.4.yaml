  definition:
  - content: dispositif integre au compteur qui permet de detecter et de mettre en
      evidence des defauts significatifs
  examples: []
  id: r49-1-2013-fra-3.5.4-fra
  notes:
  - content: 'Source citation: OIML D 11:2013 [3], 3.19, modifie - "compteur" remplace
      "instrument de mesure".'
  - content: Le controle d'un dispositif de transmission a pour but de verifier que
      toute l'information transmise (et uniquement cette information) est recue integralement
      par l'equipement recepteur.
