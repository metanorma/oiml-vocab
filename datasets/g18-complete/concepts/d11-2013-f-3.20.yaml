  definition:
  - content: système incorporé dans un instrument de mesure qui permet de détecter
      et de mettre en évidence des erreurs significatives de durabilité
  examples: []
  id: d11-2013-f-3.20-fra
  notes:
  - content: '"Mettre en évidence" se réfère à toute réponse adéquate de l''instrument
      de mesure (signal lumineux, signal acoustique, prévention du processus de mesurage,
      etc.).'
