    type: accepted
  definition:
  - content: Condition existant dans un matériau soumis à des rayonnements ionisants
      par laquelle les énergies, le nombre, et la direction des électrons secondaires
      induits par les rayonnements sont uniformes dans tout le volume concerné. Ainsi,
      pour tel volume, la somme des énergies des électrons secondaires entrants est
      égale à la somme des énergies des électrons secondaires quittant ce volume.
