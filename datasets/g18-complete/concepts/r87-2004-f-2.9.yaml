data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Tout ce qui fait partie du préemballage et est destiné à être laissé
      après utilisation du produit, excepté pour les articles faisant naturellement
      partie du produit. L'utilisation inclut la consommation ou la soumission à un
      traitement.
  examples: []
  id: r87-2004-f-2.9-fra
  notes:
  - content: Les matériaux d'emballage sont généralement utilisés pour contenir, protéger,
      manipuler, distribuer, préserver, transporter, fournir des informations et servir
      d'aide (par exemple, un bec verseur) tout en utilisant le produit qu'ils contiennent.
  sources:
  - origin:
      ref:
        source: OIML R 87:2004
        version: '2004'
    type: authoritative
    locality:
      type: clause
      reference_from: '2.9'
  terms:
  - type: expression
    normative_status: preferred
    designation: Matériaux d'emballage (appelé aussi emballage individuel, tare, emballage
      ou matériaux de conditionnement)
  language_code: fra
  entry_status: valid
