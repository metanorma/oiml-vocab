  definition:
  - content: Compteur volumétrique à plusieurs chambres mesureuses mobiles raccordées
      pour constituer un tambour rotatif. Le mesurage se fait par remplissage et vidange
      successifs des chambres, l'indication du dispositif indicateur avantant à chaque
      fois d'une quantité égale au volume d'une chambre mesureuse.
