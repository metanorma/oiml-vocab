    type: accepted
  definition:
  - content: mean that would result from an infinite number of measurements of the
      same measurand carried out under repeatability conditions minus a true value
      of the measurand
  examples: []
  id: g1-100-2008-e-B.2.22-eng
  notes:
  - content: Systematic error is equal to error minus random error.
  - content: Like true value, systematic error and its causes cannot be completely
      known.
  - content: For a measuring instrument, see "bias" (VIM:1993, definition 5.25).
  - content: 'Source citation: VIM:1993, definition 3.14'
