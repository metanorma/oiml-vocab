  definition:
  - content: An influence quantity having a value within the limits specified in this
      Recommendation, but outside the specified rated operating conditions of the
      measuring instrument.
  examples: []
  id: r125-1998-e-T.29.2-eng
  notes:
  - content: An influence quantity is a disturbance if for that influence quantity
      the rated operating conditions are not specified.
