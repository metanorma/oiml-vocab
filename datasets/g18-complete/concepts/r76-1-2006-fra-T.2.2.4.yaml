  definition:
  - content: Dispositif électronique d'un instrument qui traite ensuite les données,
      et fournit le résultat de pesage sous forme numérique à travers une interface
      numérique sans l'afficher. Il peut en option avoir une ou deux touches (ou souris,
      écran tactile, etc.) pour commander l'instrument.
