data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Defaut supérieur à la valeur absolue de l'erreur maximale tolérée appropriée
      pour les essais de facteur d'influence avec une charge égale à la charge minimale
      totalisée $(\Sigma_{\mathrm{min}})$ pour la classe désignée de la peseuse sur
      bande.
  examples: []
  id: r50-1-1997-fra-T.5.5-fra
  notes:
  - content: 'Ne sont pas considérés comme défauts significatifs: les défauts provenant
      de causes simultanées et mutuellement indépendantes dans la peseuse sur bande
      ou son équipement de contrôle; les défauts rendant impossible l''exécution de
      tout mesurage; les défauts transitoires consistant en des variations momentanées
      des indications et qui ne peuvent être interprétées, mémorisées ou transmises
      en tant que résultat de mesure; les défauts si importants qu''ils ne peuvent
      manquer d''être remarqués par les personnes intéressées au mesurage.'
