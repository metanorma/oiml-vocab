data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: A fault greater than the absolute value of the appropriate maximum permissible
      error for influence factor tests for a load equal to the minimum totalized load
      for the designated class of the belt weigher.
  examples: []
  id: r50-1-1997-eng-T.5.5-eng
  notes:
  - content: A significant fault does not include faults that result from simultaneous
      and mutually independent causes in the belt weigher or in its checking facility,
      faults that imply the impossibility of performing any measurement, transitory
      faults that are momentary variations in the indications which cannot be interpreted,
      memorized or transmitted as a measurement result, or faults that are so serious
      they will inevitably be noticed by those interested in the measurement.
  sources:
  - origin:
      ref:
        source: OIML R 50-1:1997
        version: '1997'
