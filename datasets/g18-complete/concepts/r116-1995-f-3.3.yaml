  definition:
  - content: Tube qui s'enroule autour du tube de quartz exterieur de la torche et
      au moyen duquel l'energie r.f. est transmise a l'argon. On l'appelle aussi bobine
      de charge.
  examples: []
  id: r116-1995-f-3.3-fra
  notes:
  - content: Cette bobine, generalement refroidie par eau, comporte trois ou quatre
      spires et est constituee d'un tube en cuivre eventuellement plaque d'argent
      ou d'or.
