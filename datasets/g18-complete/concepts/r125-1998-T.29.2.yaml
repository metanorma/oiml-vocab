  definition:
  - content: Grandeur d'influence de valeur comprise dans les limites specifiees dans
      la presente Recommandation, mais en dehors des conditions assignees de fonctionnement
      specifiees pour l'instrument de mesure.
  examples: []
  id: r125-1998-f-T.29.2-fra
  notes:
  - content: Une grandeur d'influence est une perturbation si pour cette grandeur
      d'influence, les conditions assignees de fonctionnement ne sont pas specifiees.
