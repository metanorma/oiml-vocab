  definition:
  - content: partie du compteur qui transforme les signaux de sortie provenant du
      ou des transducteur(s) de mesure et, eventuellement, des instruments de mesure
      associes et, le cas echeant, memorise les resultats dans la memoire jusqu'a
      ce qu'ils soient utilises
  examples: []
  id: r49-1-2013-fra-3.1.4-fra
  notes:
  - content: La pignonnerie est consideree comme le calculateur d'un compteur mecanique
  - content: Le calculateur peut etre capable de communiquer dans les deux sens avec
      les dispositifs auxiliaires.
