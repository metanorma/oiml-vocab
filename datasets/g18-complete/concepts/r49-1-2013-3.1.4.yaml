    type: accepted
  definition:
  - content: part of the meter that transforms the output signals from the measurement
      transducer(s) and possibly, from associated measuring instruments and, if appropriate,
      stores the results in memory until they are used
  examples: []
  id: r49-1-2013-eng-3.1.4-eng
  notes:
  - content: The gearing is considered to be the calculator in a mechanical meter.
  - content: The calculator may be capable of communicating both ways with ancillary
      devices.
