  definition:
  - content: Facility, incorporated in a measuring instrument (or system), which enables
      significant faults to be detected and acted upon, including incorrect functioning
      of a specific device of the measuring instrument or system, and/or disturbed
      communication between specific devices of the measuring instrument or system
  examples: []
  id: r139-2014-e-3.2.14-eng
  notes:
  - content: Acted upon refers to any adequate response by the measuring instrument
      (for example a luminous signal, an acoustic signal, interruption or blocking
      of the measurement process, etc.).
