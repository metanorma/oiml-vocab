  - content: grandeur d'influence dont la valeur se situe dans les limites spécifiées
      dans la présente Recommandation, mais qui est en-dehors des conditions spéciales
      assignées de l'instrument de mesure
  examples: []
  id: r126-2012-f-2.13-fra
