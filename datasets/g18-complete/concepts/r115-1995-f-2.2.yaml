data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Composant d'un thermometre dont une partie est appliquee a une cavite
      ou a un tissu du corps avec lesquels elle etablit un equilibre thermique. Elle
      comprend un capteur de temperature avec les pieces associees y compris les enveloppes,
      joints, fils interieurs et fiche de connexion, le cas echeant.
  examples: []
  id: r115-1995-f-2.2-fra
  notes:
  - content: Une cavite ou un tissu du corps peut etre la bouche (zone sublinguale),
      le rectum ou l'aisselle.
  - content: La partie de la sonde en contact avec une cavite ou un tissu du corps
      est appelee partie appliquee.
