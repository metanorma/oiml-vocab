data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: A part of the meter which transforms the flow or the volume of the water
      to be measured into signals which are passed to the calculator. It can be based
      on a mechanical or an electrical or an electronic principle. It may be autonomous
      or use an external power source.
  examples: []
  id: r49-1-2003-e-2.1.2-eng
  notes:
  - content: For the purposes of this Recommendation, the measurement transducer includes
      the flow sensor or volume sensor.
