  definition:
  - content: Dispositif utilisant des sous-ensembles electroniques et accomplissant
      une fonction specifique. Les dispositifs electroniques sont generalement fabriques
      comme des elements separe et sont susceptibles d'etre essayes independamment.
  examples: []
  id: r76-2006-f-T.2.3.1-fra
  notes:
  - content: Un dispositif electronique, comme defini ci-dessus, peut etre un instrument
      complet (par exemple, un instrument pour la vente directe au public), un module
      (par exemple, un indicateur, un dispositif de traitement de donnees analogiques,
      un module de pesage) ou un dispositif peripherique (par exemple, une imprimante,
      un afficheur secondaire).
