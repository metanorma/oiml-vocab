  definition:
  - content: etendue des concentrations d'un element concerne en solution que l'on
      peut mesurer a l'interieur des limites specifiees
  examples: []
  id: r100-1-2013-fra-3.7-fra
  notes:
  - content: Une dilution ou une concentration d'une solution de dosage peut etre
      necessaire pour amener l'element concerne dans l'etendue de mesure. L'absorbance
      du spectrometre a zero est ajustee en utilisant une solution de reference a
      blanc.
