data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: valeur extrême de l'erreur de mesure, par rapport à une valeur de référence
      connue, qui est tolérée par les spécifications ou règlements pour un mesurage,
      un instrument de mesure ou un système de mesure donné
  examples: []
  id: r46-2012-e-2.2.18-fra
  notes:
  - content: Les termes «erreurs maximales tolérées» ou «limites d'erreur» sont généralement
      utilisés lorsqu'il y a deux valeurs extrêmes.
  - content: Il convient de ne pas utiliser le terme «tolérance» pour désigner l'erreur
      maximale tolérée.
  - content: 'Source citation: OIML V 2-200:2012, 4.26'
  - content: Dans la présente Recommandation, l'erreur maximale tolérée est une combinaison
      de l'erreur maximale tolérée de base et le décalage d'erreur maximal toléré
      tel que décrit en Annexe B.
  - content: Pour l'application de cette Recommandation, les «spécifications ou réglementations»
      signifient les dispositions contenues dans la présente Recommandation, et les
      termes «instrument de mesure» et «système de mesurage» signifient compteur d'électricité.
  sources:
