    type: accepted
  definition:
  - content: A device employing electronic sub-assemblies and performing a specific
      function. An electronic device is usually manufactured as a separate unit and
      can be independently tested.
  examples: []
  id: r76-1-1992-eng-T.2.3.1-eng
  notes:
  - content: An electronic device, as defined above, may be a complete instrument
      (e.g. instrument for direct sales to the public) or part of an instrument (e.g.
      printer, indicator).
