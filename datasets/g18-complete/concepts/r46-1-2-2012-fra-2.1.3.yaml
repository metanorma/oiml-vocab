  definition:
  - content: compteur électrique destiné à permettre la fourniture d'énergie électrique
      selon une quantité prédéterminée
  examples: []
  id: r46-1-2-2012-fra-2.1.3-fra
  notes:
  - content: Un tel compteur mesure l'énergie en continu, stocke et affiche l'énergie
      mesurée.
  - content: Les autorités nationales peuvent spécifier des exigences relatives aux
      compteurs à prépaient.
