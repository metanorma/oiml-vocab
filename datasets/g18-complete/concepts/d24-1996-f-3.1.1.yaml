    type: accepted
  definition:
  - content: L'erreur intrinsèque caractérise l'exactitude de l'instrument. Cette
      erreur est égale à la différence entre la valeur moyenne d'un nombre suffisant
      d'indications données par le pyromètre, dans les conditions de référence (voir
      3.2) lors de la mesure de la température d'un corps noir à température constante,
      et une valeur conventionnellement vraie de la température de ce corps noir.
