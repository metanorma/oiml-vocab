    type: accepted
  definition:
  - content: Component indicating the equilibrium and/or the result.
  - content: On an instrument with one position of equilibrium it indicates only the
      equilibrium (so-called zero).
  - content: On an instrument with several positions of equilibrium it indicates both
      the equilibrium and the result. On an electronic instrument, this is the display.
