data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: A device employing electronic sub-assemblies and performing a specific
      function. An electronic device is usually manufactured as a separate unit and
      is capable of being independently tested.
  examples: []
  id: r76-1-1988-e-T.2.2.1-eng
  notes:
  - content: An electronic device, as defined above, may be a complete instrument
      (for example, instrument for direct selling to the public) or part of an instrument
      (for example, printer or indicator).
