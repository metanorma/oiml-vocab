  definition:
  - content: Pour les besoins de l'évaluation de type/l'approbation de modele, une
      famille de cellules de pesée réunit les cellules de pesée de même matériau ou
      combinaison de matériaux (par exemple, acier doux, acier inoxydable ou aluminium);
      de même conception de la technique de mesure (par exemple, jauges de contrainte
      liées à du métal); construites selon le même procédé (par exemple, pour la forme,
      la fixation des jauges de contrainte, la méthode de montage, la méthode de fabrication);
      d'un même ensemble de spécifications (par exemple, puissance de sortie, impédance
      d'entrée, tension d'alimentation, détails de câblage); et d'un ou plusieurs
      groupes de cellules de pesée.
  examples: []
