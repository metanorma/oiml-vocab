  definition:
  - content: Charge par essieu qui ne fait pas partie d'un groupe d'essieu. Pour les
      besoins de cette Recommandation, si aucun critère de définition de divers groupes
      d'essieux n'a été spécifié, toutes les charges par essieu enregistrées doivent
      être considérées comme des charges par essieu simple.
