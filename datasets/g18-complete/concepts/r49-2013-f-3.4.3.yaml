  definition:
  - content: influence quantity having a value within the limits specified in this
      part of OIML R 49, but outside the specified rated operating conditions of the
      meter
  examples: []
  id: r49-2013-f-3.4.3-eng
  notes:
  - content: An influence quantity is a disturbance if the rated operating conditions
      for that influence quantity are not specified.
  - content: 'Source citation: OIML D 11:2013 [3], 3.15.2, modified — "this part of
      OIML R 49" replaces "the relevant Recommendation"; "meter" replaces "measuring
      instrument".'
