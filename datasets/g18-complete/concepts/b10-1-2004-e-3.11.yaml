  definition:
  - content: Certifying body in an OIML Member State, designated by its CIML Member,
      that issues OIML Certificates of Conformity for a particular category of instruments.
  examples: []
  id: b10-1-2004-e-3.11-eng
  notes:
  - content: The OIML Issuing Authority may or may not be the same organization as
      the National Issuing Authority whose responsibilities are governed by national
      regulations. When the term "Issuing Authority" is used in this document without
      being further qualified, both "OIML Issuing Authority" and "National Issuing
      Authority" are assumed.
