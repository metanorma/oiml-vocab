  definition:
  - content: Dispositif intégré au compteur, qui permet seulement un décalage de la
      courbe d'erreur, généralement parallèlement à elle-même, afin d'amener les erreurs
      à l'intérieur des erreurs maximales tolérées. Ce dispositif peut être soit mécanique,
      soit électronique.
