  definition:
  - content: quantity of product in a prepackage declared on the label
  examples: []
  id: r79-2015-e-2.5-eng
  notes:
  - content: In some national legislation the nominal quantity of the product is referred
      to as "net quantity", "net contents", "net mass" or "net volume".
  - content: This term relates to specifications on a prepackage and does not account
      for the actual quantity in an individual prepackage. For prepackages with constant
      nominal quantity, the procedures for determining whether an inspection lot meets
      regulatory requirements are provided in OIML R 87 [1].
