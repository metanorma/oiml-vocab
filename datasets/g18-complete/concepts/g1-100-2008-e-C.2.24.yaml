  definition:
  - content: the operation of assigning, from the observations in a sample, numerical
      values to the parameters of a distribution chosen as the statistical model of
      the population from which this sample is taken
  examples: []
  id: g1-100-2008-e-C.2.24-eng
  notes:
  - content: A result of this operation may be expressed as a single value (point
      estimate) or as an interval estimate.
