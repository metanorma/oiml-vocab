  definition:
  - content: A value equal to the logarithm of the ratio of the incident light to
      the transmitted light and is dependent on the path length and the concentration
      of the absorbing substance.
  examples: []
  id: r100-1991-e-3.1-eng
  notes:
  - content: The principle of measurement of absorbance by the instrument is the Beer-Lambert
      law.
