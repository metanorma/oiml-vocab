  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: examen et essai systématique de la performance d'un ou plusieurs spécimens
      d'un type ou modèle identifié d'instrument de mesure vis à vis d'exigences documentées,
      dont les résultats sont contenus dans le rapport d'évaluation, afin de déterminer
      si le type peut être approuvé
  examples: []
  id: r49-2013-f-3.4.12-fra
  notes:
  - content: "« modèle » est utilisé avec la même signification que « type » en métrologie
      légale."
  - content: 'Source citation: OIML V 1:2013 [2], 2.04, modifié — les termes synonyms
      « évaluation de type » et « évaluation de modèle » remplacent « évaluation de
      type (modèle) » ; « modèle ou type » remplace « type (modèle) ».'
