  definition:
  - content: Partie du compteur qui traduit le debit du gaz a mesurer en signaux destines
      au calculateur. Il peut soit etre autonome, soit utiliser une source d energie
      exterieure.
  examples: []
  id: r139-2007-f-T.1.2-fra
  notes:
  - content: Pour les besoins de la presente Recommandation, le transducteur de mesure
      inclut le capteur de debit ou de quantite.
