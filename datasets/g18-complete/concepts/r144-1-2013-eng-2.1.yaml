  definition:
  - content: assembly to carry out specified gas analytical measurements (ISO 7504:2001)
  examples: []
  id: r144-1-2013-eng-2.1-eng
  notes:
  - content: In this Recommendation, a gas analytical system means a system that continuously
      measures the volume fraction of CO (carbon monoxide), NO (nitrogen monoxide),
      NO2 (nitrogen dioxide), or sum of nitrogen oxides NOx), or measures only CO
      or only NO and NO2, or NOx by analyzing the gas samples taken directly from
      the smokestack or gas pipe in industry.
