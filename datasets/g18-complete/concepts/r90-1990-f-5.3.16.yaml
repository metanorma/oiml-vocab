  definition:
  - content: Le coefficient de couplage parasite entre canaux est le rapport entre
      l'amplitude crête à crête de la tension induite dans les canaux examinés de
      l'électrocardiographe et l'amplitude crête à crête de la tension appliquée à
      tous les autres canaux.
