data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: The output signal per unit mass of the sample component of interest in
      the carrier gas; it is expressed in either one of the two following ways. With
      a concentration-dependent detector, it is expressed in A * mL/g, or V * mL/g,
      and by the equation S = (P*F)/M where P is the integrated peak area, F is the
      carrier gas flow rate, M is the mass of the sample in the carrier gas. With
      a mass-flow-rate-dependent detector, it is expressed in A * s/g, or V * s/g,
      and by the equation S = P/M.
  examples: []
  id: r82-1989-e-3.14-eng
  notes:
  - content: Figure 1 illustrates graphically the concepts of detection limit and
      linear range for a given range of sensitivity.
