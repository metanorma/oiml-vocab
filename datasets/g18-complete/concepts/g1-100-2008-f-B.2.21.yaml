    type: accepted
  definition:
  - content: résultat d'un mesurage moins la moyenne d'un nombre infini de mesurages
      du même mesurande, effectués dans les conditions de répétabilité
  examples: []
  id: g1-100-2008-f-B.2.21-fra
  notes:
  - content: L'erreur aléatoire est égale à l'erreur moins l'erreur systématique.
  - content: Comme on ne peut faire qu'un nombre fini de mesurages, il est seulement
      possible de déterminer une estimation de l'erreur aléatoire.
  - content: 'Source citation: VIM:1993, definition 3.13'
