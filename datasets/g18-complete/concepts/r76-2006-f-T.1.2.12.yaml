  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Instrument de pesage non automatique ayant un recepteur de charge, en
      une ou plusieurs parties, qui determine la masse totale de vehicules routiers,
      et qui est concu pour etre deplace dans des lieux differents.
  examples:
  - content: Pont-bascule portable, ensemble de pese-essieux ou pese-roues non automatique.
  id: r76-2006-f-T.1.2.12-fra
  notes:
  - content: Cette Recommandation couvre seulement les ponts-bascules et les ensembles
      associes de pese-essieux ou pese-roues non automatique qui determinent simultanement
      la masse totale d'un vehicule routier avec tous les essieux (ou roues) supportes
      simultanement par les elements appropriates du recepteur de charge
  sources:
  - origin:
      ref:
        source: OIML R 76:2006
