  definition:
  - content: Aptitude d'un instrument à réagir à de petites variations de charge.
      Le seuil de mobilité, à une charge donnée, est la valeur de la plus petite surcharge
      qui, déposée ou retirée sans choc sur le récepteur de charge, provoque une variation
      perceptible de l'indication.
