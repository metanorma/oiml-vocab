data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: A fault greater than e.
  examples: []
  id: r76-1-1988-eng-T.5.5.6-eng
  notes:
  - content: For a multi-interval instrument, the value of e is that appropriate to
      the partial weighing range.
  - content: 'The following are not considered to be significant faults, even when
      they exceed e: faults arising from simultaneous and mutually independent causes
      in the instrument itself or in its checking facility; faults implying the impossibility
      to perform any measurement; faults being so serious that they are bound to be
      noticed by all those interested in the result of measurement; transitory faults
      being momentary variations in the indication which cannot be interpreted, memorized
      or transmitted as a measuring result.'
