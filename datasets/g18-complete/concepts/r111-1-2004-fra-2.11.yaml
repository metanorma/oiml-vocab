    type: accepted
  definition:
  - content: 'Paramètre décrivant le profil de rugosité évalué d''un échantillon.
      La lettre R indique le type de profil évalué, dans ce cas R pour profil de rugosité.
      Le profil évalué d''un échantillon peut être de différents types de profil:
      un profil de rugosité ou paramètre-R, un profil primaire ou paramètre-P, un
      profil d''ondulation ou paramètre-W.'
