  definition:
  - content: Teil des Maßes, der das Messergebnis entweder ständig oder auf Abfrage
      anzeigt. Eine Anzeigeeinrichtung, die elektronisch arbeitet, muss aus einem
      Sensor, einem Aufnehmer, einem Rechenwerk und einer Anzeige bestehen.
