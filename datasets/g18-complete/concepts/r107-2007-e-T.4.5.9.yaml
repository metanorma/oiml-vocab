  definition:
  - content: Historical record (or continuous data file) of the instrument data, adjustments
      and weighing operations. Checks can be made to ensure that adjustments and weighings
      have been carried out in accordance with the appropriate parts of this Recommendation.
      Every log entry has a unique time and date stamp.
