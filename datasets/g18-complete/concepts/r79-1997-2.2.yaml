  definition:
  - content: La quantité de produit identifié dans le préemballage à l'exclusion de
      l'enveloppe et de tout autre objet emballé avec ce produit.
  examples: []
  id: r79-1997-f-2.2-fra
  notes:
  - content: Ce terme s'applique aux spécifications sur un préemballage et ne justifie
      pas le contenu réel d'un emballage individuel. Les procédures pour déterminer
      si un lot d'une production satisfait ou non aux exigences réglementaires sont
      fournies dans OIML R 87 Contenu net des préemballages.
