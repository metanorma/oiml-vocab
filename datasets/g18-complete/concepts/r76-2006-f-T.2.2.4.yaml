  definition:
  - content: Dispositif electronique d'un instrument qui traite ensuite les donnees,
      et fournit le resultat de pesage sous forme numerique a travers une interface
      numerique sans l'afficher. Il peut en option avoir une ou deux touches (ou souris,
      ecran tactile, etc.) pour commander l'instrument.
