data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: when T is a function of the observed values such that, theta being a
      population parameter to be estimated, the probability Pr(T >= theta) [or the
      probability Pr(T <= theta)] is at least equal to (1 - alpha) [where (1 - alpha)
      is a fixed number, positive and less than 1], the interval from the smallest
      possible value of theta up to T (or the interval from T up to the largest possible
      value of theta) is a one-sided (1 - alpha) confidence interval for theta
  examples: []
  id: g1-100-2008-e-C.2.28-eng
  notes:
  - content: The limit T of the confidence interval is a statistic and as such will
      generally assume different values from sample to sample.
