    type: accepted
  definition:
  - content: A vortex meter operates by sensing vortices shed from alternative sides
      of a bluff body located in the flowing fluid. The frequency of vortex shedding
      is dependant on the Reynolds number of the fluid.
  examples: []
  id: d25-1996-e-2.1-eng
  notes:
  - content: A vortex meter consists of four basic components.
