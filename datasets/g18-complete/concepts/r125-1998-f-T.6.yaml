  definition:
  - content: Le point de reference inferieur represente l'origine pour le mesurage
      des niveaux de liquide (point zero). Il est defini comme l'intersection de la
      verticale de mesurage avec la surface superieure de la plaque de touche, ou
      avec le fond du reservoir si cette plaque est absente.
