  - content: Pour une copie donnée d'un modèle, identification, par référence à toutes
      les variables et contraintes possibles, de tous les mesurages pour lesquels
      il peut théoriquement être utilisé et de tous les ensembles de conditions dans
      lesquelles ces mesurages peuvent être légalement effectués.
