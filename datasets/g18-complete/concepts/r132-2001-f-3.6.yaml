  definition:
  - content: Quotient de dE par dm, où dE est l'énergie moyenne cumulative transmise
      par les rayonnements ionisants à une quantité de matière de masse dm. L'unité
      pour la dose absorbée est le gray (Gy), où 1 Gy = 1 J/kg.
