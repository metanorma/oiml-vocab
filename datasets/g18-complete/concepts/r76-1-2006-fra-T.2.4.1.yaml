  - content: Organe indiquant l'équilibre et/ou le résultat.
  examples: []
  id: r76-1-2006-fra-T.2.4.1-fra
  notes:
  - content: Sur un instrument à une seule position d'équilibre, il indique uniquement
      l'équilibre.
  - content: Sur un instrument à plusieurs positions d'équilibre, il indique à la
      fois l'équilibre et le résultat.
