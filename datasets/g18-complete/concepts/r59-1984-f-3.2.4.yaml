  definition:
  - content: Zéro et valeur de contrôle.
  examples: []
  id: r59-1984-f-3.2.4-fra
  notes:
  - content: Dans la pratique la valeur 0 % masse ne peut jamais être atteinte par
      la grandeur que représente le titre d'un échantillon de grains ou de graines.
      Cependant, les humidimètres peuvent donner l'indication « zéro ».
  - content: Un dispositif permettant la détermination d'une valeur de contrôle est
      un dispositif destiné à vérifier le bon état de fonctionnement de la partie
      mesureuse. La valeur de contrôle se matérialise par une ou plusieurs indications
      du dispositif indicateur qui sont le résultat d'une simulation de mesurage.
