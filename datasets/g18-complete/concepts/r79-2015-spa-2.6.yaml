data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Todo aquello en el preempacado que está previsto para ser desechado después
      del uso del producto, excepto los elementos que se encuentran de forma natural
      en el producto.
  examples: []
  id: r79-2015-spa-2.6-spa
  notes:
  - content: El término "uso" incluye el consumo.
  - content: El material de empaque se usa generalmente para contener, proteger, sostener
      (por ejemplo, un palo de paleta), entregar, preservar (por ejemplo, hielo o
      glaseado), transportar, suministrar información sobre el producto y ser de ayuda
      (por ejemplo, una bandeja para servir alimentos) mientras se usa el producto
      que contiene.
  - content: El material de empaque incluye también el recipiente, el hielo (que no
      se encuentra de forma natural en el producto, por ejemplo, el glaseado), los
      elementos sólidos colocados en el preempacado con el producto, tales como envolturas,
      palos para paletas, cera para envolver el queso, y un medio colocado en el preempacado
      junto con el producto y que está previsto para desechar después de usar el producto.
  - content: Algunas veces el material de empaque se denomina empaque individual,
      tara, embalaje, o material de embalaje.
