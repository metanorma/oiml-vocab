  definition:
  - content: période de temps requise par le système d'analyse depuis la mise sous
      tension de l'instrument jusqu'à ce qu'il atteigne le mode de fonctionnement
      lequel il fonctionne dans les erreurs maximal tolérées
  examples: []
  id: r144-2013-e-2.11-fra
  notes:
  - content: Pour un analyseur de gaz cela correspond au temps le moment où il est
      mis sous tension et le moment où le résultat de mesure d'une fractionique, un
      CGM est installé à l'entrée, est dans les limites autorisées.
