  definition:
  - content: Part of the associated measuring device, directly affected by the measurand,
      which converts the characteristic quantity (temperature, pressure, density,
      viscosity, etc.) of the liquid into a measurement signal (resistance, electrical
      current, frequency, etc.) destined for the associated measuring transducer.
