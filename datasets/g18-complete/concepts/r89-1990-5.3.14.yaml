  definition:
  - content: Le niveau de bruit intrinsèque rapporté à l'entrée est l'amplitude crête
      à crête maximale du signal enregistré quand l'entrée de l'électroencéphalographe
      est reliée au simulateur d'impédance électrode-peau Z1; elle est évaluée sur
      un intervalle de temps donné et rapportée à l'entrée.
