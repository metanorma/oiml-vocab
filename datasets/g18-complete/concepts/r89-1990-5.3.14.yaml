    type: accepted
  definition:
  - content: The intrinsic noise level referred to the input is the maximum peak-to-peak
      amplitude of the signal recorded when the electroencephalograph's input is connected
      to the skin-electrode impedance Z1; it is evaluated for a given time interval
      and referred to the electroencephalograph's input.
