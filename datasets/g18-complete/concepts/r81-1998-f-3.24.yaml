data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: A fault the magnitude of which is greater than 20 % of the maximum permissible
      error (mpe) for the measured quantity.
  examples: []
  id: r81-1998-f-3.24-eng
  notes:
  - content: 'The following are not considered to be significant faults: faults arising
      from simultaneous and mutually independent causes in the measuring instrument
      itself or in its checking facility; transitory faults being momentary variations
      in the indication, that cannot be interpreted, memorized, or transmitted as
      a measurement result; faults implying the impossibility of performing any measurement.'
  sources:
  - origin:
      ref:
        source: OIML R 81:1998
        version: '1998'
    locality:
      type: clause
      reference_from: '3.24'
    type: authoritative
  terms:
  - type: expression
    normative_status: preferred
    designation: significant fault
  language_code: eng
  entry_status: valid
