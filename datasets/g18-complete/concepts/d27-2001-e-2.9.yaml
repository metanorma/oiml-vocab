data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Need or expectation that is stated, generally implied or obligatory.
  examples: []
  id: d27-2001-e-2.9-eng
  notes:
  - content: '"Generally implied" means that it is custom or common practice for the
      organization, its customers and other interested parties that the need or expectation
      under consideration is implied.'
  - content: A qualifier can be used to denote a specific type of requirement, e.g.
      product requirement, quality management requirement, customer requirement.
  - content: A specified requirement is one which is stated, for example, in a document.
  - content: Requirements can be generated by different interested parties.
  - content: 'Source citation: ISO 9000:2000, 3.1.2'
