  definition:
  - content: Débit moyen pendant un essai, calculé à partir des indications d'un dispositif
      de référence étalonné. Quotient du volume réel passant dans le compteur d'eau
      divisé par le temps nécessaire au passage de ce volume dans le compteur d'eau.
