  definition:
  - content: Instrument de mesure qui mesure la longueur (L), la largeur (W) et la
      hauteur (H) d'un parallélepipède rectangle (une boîte rectangulaire), et dans
      certains cas, détermine le volume de cette boîte. Si l'objet n'a pas la forme
      d'une boîte rectangulaire, la plus petite boîte rectangulaire entourant complètement
      l'objet est définie.
