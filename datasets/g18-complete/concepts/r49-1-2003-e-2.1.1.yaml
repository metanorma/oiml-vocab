    type: accepted
  definition:
  - content: An instrument intended to measure continuously, memorize and display
      the volume of water passing through the measurement transducer at metering conditions.
  examples: []
  id: r49-1-2003-e-2.1.1-eng
  notes:
  - content: A water meter includes at least a measurement transducer, a calculator
      (including adjustment or correction devices if present) and an indicating device.
      These three devices may be in different housings.
