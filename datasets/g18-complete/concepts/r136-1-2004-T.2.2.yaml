  definition:
  - content: Device employing electronic sub-assemblies and performing a specific
      function.
  examples: []
  id: r136-1-2004-eng-T.2.2-eng
  notes:
  - content: An electronic device is usually manufactured as a separate unit and is
      capable of being independently tested (e.g. an instrument comprising of photocells
      for detecting leather or a camera for image scanning and providing area measurement
      with digital indication).
