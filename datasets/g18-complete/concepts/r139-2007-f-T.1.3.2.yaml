  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Partie operationnelle du compteur qui recoit les signaux de sortie du
      calculateur de comptage, et eventuellement des instruments de mesurage associes,
      qui les transforme en donnees destinees au dispositif indicateur.
  examples: []
  id: r139-2007-f-T.1.3.2-fra
  notes:
  - content: Le calculateur de comptage et le calculateur operationnel peuvent etre
      constitues de deux elements separes ou constituer une seule unite. Sauf necessite
      particuliere de dissocier ces deux sortes de calculateurs, l association des
      deux fonctions est appelee le calculateur dans la presente Recommandation.
