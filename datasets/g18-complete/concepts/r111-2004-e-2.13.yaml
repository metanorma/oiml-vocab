    type: accepted
  definition:
  - content: Séries ou groupe de poids, habituellement présentés de manière à rendre
      possible n'importe quelle pesée de toutes les charges entre la masse avec la
      plus petite valeur nominale et la somme de tous les poids de la série, avec
      une progression dans laquelle le poids de plus petite valeur nominale constitue
      le pas le plus petit de la série. Les poids ont des caractéristiques métrologiques
      similaires et les mêmes valeurs nominales ou des valeurs nominales différentes
      et appartiennent à la même classe d'exactitude.
