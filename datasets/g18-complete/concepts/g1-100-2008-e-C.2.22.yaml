  definition:
  - content: 'in a distribution of a single characteristic, the arithmetic mean of
      the qth power of the difference between the observed values and their average
      x_bar: (1/n) sum_i (x_i - x_bar)^q, where n is the number of observations'
  examples: []
  id: g1-100-2008-e-C.2.22-eng
  notes:
  - content: The central moment of order 1 is equal to zero.
