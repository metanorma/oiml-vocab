  definition:
  - content: interval of permissible values of a property
  examples: []
  id: g1-106-2012-e-3.3.5-eng
  notes:
  - content: Unless otherwise stated in a specification, the tolerance limits belong
      to the tolerance interval.
  - content: The term 'tolerance interval' as used in conformity assessment has a
      different meaning from the same term as it is used in statistics.
  - content: A tolerance interval is called a 'specification zone' in ASME B89.7.3.1:2001
      [2].
