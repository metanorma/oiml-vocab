data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: 'group of load cells which for the purposes of type evaluation are considered
      as one family and that are of: a) the same material or combination of materials
      (for example mild steel, stainless steel or aluminium); b) the same design of
      the measurement technique (for example strain gauges bonded to metal); c) when
      used, the same principle used to attach the strain gauge to the load cell; d)
      the same method of construction (for example shape, sealing of strain gauges,
      mounting method, manufacturing method); e) the same set of specifications (for
      example output rating, input impedance, supply voltage, cable details); and
      f) one or more load cell groups where all load cells within the group possess
      identical metrological characteristics (as listed in 5.1.5-including: class;
      n_LC ; temperature rating, etc.).'
  examples: []
  id: r60-1-2021-eng-3.4.2-eng
  notes:
