  definition:
  - content: Peuvent être une séquence de signaux électriques (optiques, électromagnétiques,
      etc.) sur les interfaces d'entrée ou des codes dans les protocoles de transmission
      de données. Elles peuvent être générées par le logiciel de l'instrument de mesure/dispositif
      électronique/sous-ensemble électronique (commandes logicielles) ou bien être
      générées par l'utilisateur par le biais de l'interface utilisateur de l'instrument
      de mesure (commandes utilisateurs).
