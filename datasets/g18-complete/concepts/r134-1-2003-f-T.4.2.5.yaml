  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: |-
      Defaut supérieur à 1 d.

      Les défauts suivants ne sont pas considérés comme significatifs:
      - les défauts provenant de causes simultanées et mutuellement indépendantes dans l'instrument ou dans son dispositif de contrôle;
      - les défauts rendant impossible l'exécution de tout mesurage;
      - les défauts transitoires consistant en des variations momentanées dans les indications et ne pouvant pas être interprétées, mémorisées ou transmises comme un résultat de mesurage; et
      - les défauts si importants qu'ils ne peuvent manquer d'être remarqués par les personnes intéressées au mesurage.
