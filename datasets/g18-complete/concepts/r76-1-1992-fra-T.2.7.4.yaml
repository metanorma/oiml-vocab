    type: accepted
  definition:
  - content: Dispositif maintenant automatiquement l'indication zéro dans certaines
      limites. Dispositif permettant d'amener l'indication de l'instrument à zéro
      lorsqu'une charge est placée sur le récepteur de charge sans empiéter sur l'étendue
      de pesage des charges nettes (dispositif additif de tare), ou en réduisant l'étendue
      de pesage des charges nettes (dispositif soustractif de tare).
  examples: []
  id: r76-1-1992-fra-T.2.7.4-fra
  notes:
  - content: Il peut fonctionner comme dispositif non automatique (charge équilibrée
      par l'opérateur), dispositif semi-automatique (charge équilibrée automatiquement
      sur une seule commande manuelle), dispositif automatique (charge équilibrée
      automatiquement sans intervention d'un opérateur).
