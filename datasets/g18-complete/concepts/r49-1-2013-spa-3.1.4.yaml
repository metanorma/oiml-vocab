  definition:
  - content: Es la parte del medidor que transforma las señales de salida del transductor
      de medición y, posiblemente, de los instrumento de medición asociados y, si
      es apropiado, almacena los resultados en la memoria hasta que sean utilizados.
  examples: []
  id: r49-1-2013-spa-3.1.4-spa
  notes:
  - content: En un medidor mecánico, el engranaje es considerado como el calculador.
  - content: El calculador debe tener la capacidad de comunicarse con los dispositivos
      auxiliares en ambas vías.
