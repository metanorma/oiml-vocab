  definition:
  - content: property of a random variable, which, for a continuous random variable
      $ X $ characterized by a PDF $ g_{X}(\xi) $ , is given by $V (X) = \int_ {-
      \infty} ^ {\infty} [ \xi - E (X) ] ^ {2} g _ {X} (\xi) \mathrm {d} \xi$
  examples: []
  id: g1-101-2008-e-3.7-eng
  notes:
  - content: Not all random variables have a variance.
