data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: système incorporé dans un instrument de mesure et qui permet de détecter
      et de mettre en évidence les défauts significatifs
  examples: []
  id: r46-2012-e-2.2.32-fra
  notes:
  - content: La mise en évidence peut être matérialisée par toute réponse appropriée
      de l'instrument de mesure (signal lumineux, signal acoustique, blocage du processus
      de mesurage, etc.).
  - content: Pour l'application de la présente Recommandation, le terme «instrument
      de mesure» signifie compteur électrique et l'action résultant de la détection
      d'un défaut significatif devrait avoir pour but soit d'arrêter le mesurage et
      enregistrer l'heure et la durée de l'arrêt, soit d'enregistrer l'heure et la
      durée du défaut et la quantité d'énergie mesurée pendant le défaut.
  - content: Les défauts détectés et mis en évidence au moyen de systèmes de contrôle
      ne doivent pas être considérés comme des défauts significatifs.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: système de contrôle
  language_code: fra
  entry_status: valid
  domains:
  - concept_id: v-1
