data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: an interval for which it can be stated with a given level of confidence
      that it contains at least a specified proportion of the population
  examples: []
  id: g1-100-2008-e-C.2.30-eng
  notes:
  - content: When both limits are defined by statistics, the interval is two-sided.
      When one of the two limits is not finite or consists of the boundary of the
      variable, the interval is one-sided.
  - content: Also called "statistical tolerance interval". This term should not be
      used because it may cause confusion with "tolerance interval" which is defined
      in ISO 3534-2:1993.
  - content: 'Source citation: ISO 3534- 1'
  sources:
  - type: lineage
    status: identical
