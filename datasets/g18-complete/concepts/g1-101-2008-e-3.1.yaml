    type: accepted
  definition:
  - content: "<random variable> function giving the probability that a random variable
      takes any given value or belongs to a given set of values"
  examples: []
  id: g1-101-2008-e-3.1-eng
  notes:
  - content: The probability on the whole set of values of the random variable equals
      1.
  - content: A probability distribution is termed univariate when it relates to a
      single (scalar) random variable, and multivariate when it relates to a vector
      of random variables. A multivariate probability distribution is also described
      as a joint distribution.
  - content: A probability distribution can take the form of a distribution function
      or a probability density function.
