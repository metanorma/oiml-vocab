  definition:
  - content: vector quantity with real components
  examples:
  - content: 'A real vector quantity $ \boldsymbol{X} $ containing N real quantities
      $ X_{1},\dots,X_{N} $ expressed as a matrix of dimension $ N\times 1 $: $\boldsymbol
      {X} = \left[ \begin{array}{c} X _ {1} \\ \vdots \\ X _ {N} \end{array} \right]
      = \left(X _ {1}, \dots , X _ {N}\right) ^ {\top}.$'
