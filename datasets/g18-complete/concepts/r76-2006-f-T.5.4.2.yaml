data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: L'inexactitude globale de lecture des instruments à indication analogique
      est égale à l'écart-type de la même indication dont la lecture est effectuée,
      dans les conditions normales d'emploi, par différents observateurs. Il est habituel
      de faire au moins dix lectures du résultat.
