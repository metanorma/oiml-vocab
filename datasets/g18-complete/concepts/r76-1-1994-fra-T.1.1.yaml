  definition:
  - content: Instruments de mesure servant a determiner la masse d'un corps en utilisant
      l'action de la pesanteur sur ce corps.
  - content: Ces instruments peuvent, en outre, servir a determiner d'autres grandeurs
      quantites, parametres ou caracteristiques lies a la masse.
  - content: Suivant la nature de leur fonctionnement, les instruments de pesage sont
      classes en instruments a fonctionnement non automatique et en instruments a
      fonctionnement automatique.
