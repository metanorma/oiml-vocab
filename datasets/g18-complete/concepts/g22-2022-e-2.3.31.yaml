  definition:
  - content: facility that is incorporated in the EVSE and which enables faults that
      would otherwise be critical faults to be detected and acted upon in such a way
      that incorrect registration is prohibited
  examples: []
  id: g22-2022-e-2.3.31-eng
  notes:
  - content: Faults that are detected and acted upon by means of a checking facility
      shall not be considered as critical faults.
