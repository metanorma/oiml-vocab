  definition:
  - content: Grandeur d'influence dont la valeur se situe en dehors des conditions
      assignées de fonctionnement spécifiées pour l'ensemble de mesurage.
  examples: []
  id: r117-2007-f-T.d.3-fra
  notes:
  - content: Une grandeur d'influence est une perturbation si les conditions assignées
      de fonctionnement ne sont pas fixées pour cette grandeur d'influence.
