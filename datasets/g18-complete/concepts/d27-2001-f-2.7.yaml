    type: accepted
  definition:
  - content: Ensemble d'opérations nécessaires pour assurer qu'un point de l'équipement
      de mesure et d'essai est conforme aux exigences pour son utilisation prévue.
  examples: []
  id: d27-2001-f-2.7-fra
  notes:
  - content: La confirmation métrologique inclut normalement l'étalonnage, les ajustages
      ou réparations nécessaires et le réétalonnage ultérieur, ainsi que les scellés
      et étiquetages nécessaires.
  - content: Dans le présent Document, ce terme est désigné par le terme "confirmation".
