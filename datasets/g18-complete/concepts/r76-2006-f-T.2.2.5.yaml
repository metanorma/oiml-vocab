  definition:
  - content: Dispositif numerique qui a une ou plusieurs touches (ou souris, ecran
      tactile, etc.) pour commander l'instrument, et un afficheur pour fournir les
      resultats de pesage a travers l'interface numerique d'un module de pesage ou
      d'un dispositif analogique de traitement de donnees.
