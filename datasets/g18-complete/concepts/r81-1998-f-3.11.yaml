data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: A device that automatically converts the volume measured at metering
      conditions into a volume at base conditions or into a mass, by taking account
      of the characteristics of the measured liquid (temperature, pressure, density,
      relative density, etc.) using associated measuring instruments, or associated
      values stored in a memory.
  examples: []
  id: r81-1998-f-3.11-eng
  notes:
  - content: The quotient of the volume at base conditions, or of the mass, to the
      volume at metering conditions is referred to as the "conversion factor".
  sources:
  - origin:
      ref:
        source: OIML R 81:1998
        version: '1998'
    locality:
      type: clause
      reference_from: '3.11'
    type: authoritative
  terms:
  - type: expression
    normative_status: preferred
    designation: conversion device
  language_code: eng
  entry_status: valid
