  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Dispositif convertissant automatiquement le volume mesure, dans les conditions
      de mesure, en un volume dans les conditions de base ou en une masse, en tenant
      compte des caracteristiques du liquide mesure (temperature, pression, masse
      volumique, densite relative, etc.) en utilisant les instruments de mesure associes,
      ou les valeurs associees mises en memoire.
  examples: []
  id: r81-1998-f-3.11-fra
  notes:
  - content: Le quotient du volume dans les conditions de base, ou de la masse, par
      le volume dans les conditions de mesure est designe comme le "facteur de conversion".
  sources:
  - origin:
      ref:
        source: OIML R 81:1998
        version: '1998'
    locality:
      type: clause
      reference_from: '3.11'
    type: authoritative
