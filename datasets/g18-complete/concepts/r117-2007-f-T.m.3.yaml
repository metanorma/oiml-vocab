  definition:
  - content: Instrument destiné à mesurer de façon continue et à afficher la quantité
      de liquide qui traverse le dispositif de mesure dans les conditions de mesure.
      Un compteur comprend au moins un dispositif de mesure, un calculateur (y compris
      les dispositifs d'ajustage ou de correction si présents) et un dispositif indicateur.
