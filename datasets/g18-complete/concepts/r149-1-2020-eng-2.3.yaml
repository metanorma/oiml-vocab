  definition:
  - content: component of the non-invasive automated sphygmomanometer, comprising
      a bladder and a sleeve which is wrapped around the limb of the patient
  examples: []
  id: r149-1-2020-eng-2.3-eng
  notes:
  - content: A cuff might comprise a bladder and an inelastic part that encloses the
      bladder, or have an integral bladder (i.e. the cuff including the bladder are
      fixed together or are one piece).
