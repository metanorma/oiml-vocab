  definition:
  - content: 'Facility incorporated in a measuring system which: checks for the presence
      of a necessary device; enables an incorrectness in the generation, transmission,
      processing and/or indication of a measurement data to be detected and acted
      upon; and enables significant faults to be detected and acted upon.'
