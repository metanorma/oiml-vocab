data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: influence quantity having a value within the limits specified in the
      applicable Recommendation but outside the specified rated operating conditions
      of the measuring instrument
  examples: []
  id: d11-2013-e-3.15.2-eng
  notes:
  - content: These limits to be specified in the applicable Recommendation shall be
      based on the probability of occurrence of the disturbing phenomenon within the
      environment of the measuring instrument.
  - content: A disturbance typically is of stochastic nature.
  - content: In case the listed rated operating conditions of a measuring instrument
      do not include a range for the specific influence quantity, the influence quantity
      is qualified as being a disturbance.
  - content: 'Source citation: VIML 5.19'
