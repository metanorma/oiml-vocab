  - content: Diseño o principio de un módulo software o unidad hardware, o de una
      característica que se considera que cumple un requisito determinado. Una solución
      aceptable constituye un ejemplo de cómo puede cumplirse un requisito en concreto,
      sin perjuicio de otras soluciones que también satisfagan ese requisito.
