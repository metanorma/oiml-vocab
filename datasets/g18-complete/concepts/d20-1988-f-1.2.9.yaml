  definition:
  - content: Objet d'essai (ou échantillon-type) aveugle qui de plus est soumis à
      la condition que le personnel de l'organisme dont les capacités sont examinées
      n'est pas informé du fait que l'objet d'essai (ou échantillon-type) est en fait
      un objet d'essai aveugle (échantillon-type aveugle).
