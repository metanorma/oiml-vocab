    type: accepted
  definition:
  - content: Concentration of an element which provides an output signal equivalent
      to three times the standard deviation of the background. It is the minimum quantity
      of an element that can be detected.
  examples: []
  id: r123-1997-e-3.2-eng
  notes:
  - content: When applied in a measurement method or for an analysis, the limit of
      quantitation of the instrument is an important parameter. It is defined as being
      a value equal to 10 times the standard deviation of the background and also
      would include the variations associated with sampling and analysis.
