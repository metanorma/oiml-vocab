data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: conjunto de valores de una magnitud atribuidos a un mensurando, acompañados
      de cualquier otra información relevante disponible
  examples: []
  id: d10-2022-spa-3.14-spa
  notes:
  - content: Un resultado de medición contiene generalmente información relevante
      sobre el conjunto de valores de una magnitud. Algunos de ellos representan el
      mensurando mejor que otros. Esto puede representarse como una función de densidad
      de probabilidad (FDP).
  - content: El resultado de una medición se expresa generalmente como un valor medio
      único y una incertidumbre de medición. Si la incertidumbre de medición se considera
      despreciable para un determinado fin, el resultado de medición puede expresarse
      como un único valor medido de la magnitud. En muchos campos ésta es la forma
      habitual de expresar el resultado de medición.
  - content: En la bibliografía tradicional y en la edición precedente del VIM, el
      término resultado de medición estaba definido como un valor atribuido al mensurando
      y podía entenderse como indicación, resultado no corregido o resultado corregido,
      según el contexto.
