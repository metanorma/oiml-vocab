  definition:
  - content: measurement variation (relative to the moisture values obtained at reference
      conditions) resulting from the range of grain sample temperatures permitted
      in commercial measurements
  examples: []
  id: r59-2016-f-2.3.13-eng
  notes:
  - content: STS is controlled in approved moisture calibrations. During assessment,
      a limit is placed on the value of the average error shift caused by allowable
      temperature variations.
