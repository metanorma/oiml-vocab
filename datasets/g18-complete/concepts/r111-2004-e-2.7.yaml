    type: accepted
  definition:
  - content: Valeur conventionnelle du résultat d'une pesée dans l'air, conformément
      au document OIML D28. Pour un poids pris à la température de référence (t_ref)
      de 20 deg C, la masse conventionnelle est la masse d'un poids de référence d'une
      densité (rho_ref) de 8000 kg/m^3 qu'elle équilibre dans un air de masse volumique
      de 1,2 kg/m^3.
