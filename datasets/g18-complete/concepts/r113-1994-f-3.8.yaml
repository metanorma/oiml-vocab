  definition:
  - content: 'Mesure de la variation du signal de sortie du detecteur lorsqu''un composant
      de l''echantillon n''est pas detecte. Ceci peut etre classe en deux types: bruit
      a court terme (comprend toutes les variations aleatoires perceptibles du signal
      du detecteur ou d''autres composants ayant une frequence d''environ un cycle
      ou plus par minute); derive (pente moyenne du signal de base mesure sur une
      periode de temps prolongee, par exemple une demi-heure).'
