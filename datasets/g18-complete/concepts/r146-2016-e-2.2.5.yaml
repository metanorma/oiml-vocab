    type: accepted
  definition:
  - content: difference between the mean error of indication while one or more influence
      quantities are varied within the rated operating conditions and the mean intrinsic
      error of a measuring instrument with reference to a certified measurement standard
  examples: []
  id: r146-2016-e-2.2.5-eng
  notes:
  - content: If a certified measurement standard is not used, the error shift is the
      difference between two measured values - the indication under rated operating
      conditions and the mean indication at reference conditions prior to test.
