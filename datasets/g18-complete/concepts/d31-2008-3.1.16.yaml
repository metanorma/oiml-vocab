  definition:
  - content: Dispositif qui utilise des sous-ensembles électroniques et qui accomplit
      une fonction spécifique. Les dispositifs électroniques sont habituellement fabriqués
      en tant qu'unités séparées et sont susceptibles d'être testés séparément.
  examples: []
  id: d31-2008-f-3.1.16-fra
  notes:
  - content: Un dispositif électronique peut être un instrument de mesure complet
      ou une partie d'instrument de mesure.
