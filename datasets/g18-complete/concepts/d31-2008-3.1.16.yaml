  definition:
  - content: Dispositivo que utiliza subconjuntos y desempeña una función específica.
      Un dispositivo electrónico suele fabricarse como una unidad separada y se puede
      someter a ensayo de forma independiente.
  examples: []
  id: d31-2008-spa-3.1.16-spa
  notes:
  - content: Puede constituir un instrumento de medida completo o ser una parte del
      mismo.
