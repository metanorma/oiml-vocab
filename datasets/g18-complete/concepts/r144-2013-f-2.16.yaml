  definition:
  - content: difference between the error of indication and the intrinsic error of
      the measuring instrument
  examples: []
  id: r144-2013-f-2.16-eng
  notes:
  - content: Random errors presenting momentary variations in the indication but which
      cannot be interpreted recorded or transmitted as measuring results are considered
      to be insignificant faults.
  - content: 'Source citation: VIML 2012 (V1), 5.11 [25]'
