  definition:
  - content: différence entre l'erreur d'indication et l'erreintrinsèque d'un instrument
      de mesure
  examples: []
  id: r144-2013-f-2.16-fra
  notes:
  - content: Les erreurs aléatoires présentant des variations dans l'indication, mais
      qui ne peuvent pas être interprétées, enregistrées ou transmisees résultats
      de mesure sont considérés comme des défauts non significatifs.
