  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: 'Fehler größer als 1 d. Die folgenden Fehler werden als unbedeutend angesehen:
      Fehler, die durch gleichzeitig und voneinander unabhängig auftretende Ursachen
      im Gerät oder seinem Kontrollmessgerät entstehen; Fehler, die jegliche Messung
      unmöglich machen; auf kurzzeitige Abweichungen der Anzeigwerte zurückzuführende
      vorübergehende Fehler, die nicht als Messergebnis gedeutet, gespeichert oder
      übermittelt werden können; Fehler, die so schwerwiegend sind, dass sie von den
      an der Messung interessierten Personen unweigerlich bemerkt werden.'
