  definition:
  - content: permitted deficiency in the quantity of product in a prepackage
  examples: []
  id: r87-2016-e-2.1.17-eng
  notes:
  - content: The symbol "T" is used to designate tolerable deficiency.
  - content: Tolerable deficiency is sometimes referred to as the tolerable negative
      error, limits of error or tolerances.
  - content: By convention T is a positive number but, in use it represents a negative
      value of quantity, or negative error.
