data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Instruments de pesage nécessitant l'intervention d'un opérateur au cours
      de la pesée, par exemple pour le dépôt ou le retrait des charges à peser sur
      le dispositif récepteur de charge ainsi que pour l'obtention du résultat.
  examples: []
  id: r76-1-1992-f-T.1.2-fra
  notes:
  - content: Des termes comme "indiquer", "élément indicateur", et leurs dérivés,
      n'incluent pas l'impression.
  - content: Ces instruments permettent l'observation directe du résultat des pesées,
      soit par affichage, soit par impression; les deux possibilités sont couvertes
      par le mot "indication".
  - content: Les instruments de pesage à fonctionnement non automatique peuvent être
      gradués ou non gradués, à équilibre automatique, semi-automatique ou non automatique.
  - content: Dans la présente Recommandation, les instruments de pesage à fonctionnement
      non automatique sont appelés "instruments".
