  definition:
  - content: An instrument designed to measure continuously, memorize and display
      the quantity that passes through the measurement transducer.
  examples: []
  id: r81-1998-e-3.5-eng
  notes:
  - content: A meter includes at least a measurement transducer, a calculator (including
      adjustment or correction devices if present), a conversion device (if necessary),
