data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Fluido que se coloca en el preempacado junto con el producto, ya sea
      separado de él o rodeándolo, y que está previsto para ser desechado después
      del uso del producto, excepto en el caso de elementos que se encuentran de forma
      natural en el producto.
  examples: []
  id: r87-2016-spa-2.1.5-spa
  notes:
  - content: Para el propósito de esta Recomendación, un fluido incluye un líquido,
      semilíquido o líquidos congelados, o un gas o una mezcla de gases a presión
      atmosférica, positiva o negativa, o una combinación de éstos.
  - content: El término "uso" incluye el consumo.
  - content: Un medio se denomina algunas veces "medio de empaque líquido".
