data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: The ratio between the unit change of strain gauge resistance due to strain
      and the measurand.
  examples: []
  id: r62-1985-e-9-eng
  notes:
  - content: The gauge factor is dimensionless and is expressed as K = (R - R0) /
      R0 / ((L - L0) / L0) = dR / R0 / e, where K is the gauge factor, R is the strain
      gauge resistance at test strain, R0 is the strain gauge resistance at zero or
      reference strain, L is the test structure length under the strain gauge at test
      strain, L0 is the test structure length under the strain gauge at zero or reference
      strain, dR is the change in strain gauge resistance when strain is changed from
      zero (or reference strain) to test strain, e is the mechanical strain (L-L0)/L0.
  sources:
