data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Instrument de pesage non automatique ayant un récepteur de charge, en
      une ou plusieurs parties, qui détermine la masse totale de véhicules routiers,
      et qui est conçu pour être déplacé dans des lieux différents.
  examples:
  - content: Pont-bascule portable, ensemble de pèse-essieux ou pèse-roues non automatique.
  id: r76-1-2006-fra-T.1.2.12-fra
  notes:
  - content: Cette Recommandation couvre seulement les ponts-bascules et les ensembles
      associés de pèse-essieux ou pèse-roues non automatique qui déterminent simultanément
      la masse totale d'un véhicule routier avec tous les essieux (ou roues) supportés
      simultanément par les éléments appropriés du récepteur de charge.
  sources:
  - origin:
      ref:
        source: OIML R 76-1:2006
        version: '2006'
