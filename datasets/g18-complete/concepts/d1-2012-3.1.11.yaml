  definition:
  - content: activité du contrôle de métrologie légale consistant à vérifier que les
      lois et règlements de métrologie sont respectés
  examples: []
  id: d1-2012-f-3.1.11-fra
  notes:
  - content: La surveillance métrologique comprend le contrôle de l'exactitude des
      quantités indiquées sur et contenues dans les préemballages.
  - content: Dans ce cadre, des moyens tels que la surveillance du marché et le management
      de la qualité peuvent être utilisés.
