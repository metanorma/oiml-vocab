  definition:
  - content: the measurement cycle of an EBA consists of all steps necessary to obtain
      a valid result, from starting the measurement, sampling, analysing, internal
      control procedures, calculation, and displaying the result
  examples: []
  id: r126-1-2021-eng-3.2.12-eng
  notes:
  - content: Since national authorities may define specific measurement cycles for
      their country, "standard" refers to the respective country.
