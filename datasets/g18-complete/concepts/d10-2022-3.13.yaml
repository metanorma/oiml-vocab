  definition:
  - content: valor extremo del error de medición, con respecto a un valor de referencia
      conocido, permitido por especificaciones o reglamentaciones, para una medición,
      instrumento de medición, o sistema de medición dado
  examples: []
  id: d10-2022-spa-3.13-spa
  notes:
  - content: En general, los términos "errores máximos permitidos" o "límites de error"
      se utilizan cuando existen dos valores extremos.
  - content: No es conveniente utilizar el término «tolerancia» para designar el "error
      máximo permitido".
