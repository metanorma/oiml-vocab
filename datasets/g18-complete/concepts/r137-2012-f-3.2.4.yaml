  definition:
  - content: Différence entre la valeur mesurée d'une grandeur et une valeur de référence.
  examples: []
  id: r137-2012-f-3.2.4-fra
  notes:
  - content: La présente définition du VIM d'erreur (de mesure) est souvent interprétée
      comme étant la définition d'une erreur absolue. Cependant, cette définition
      pourrait également être appliquée à une erreur relative lors de l'expression
      d'un paramètre en pourcentage ou en dB. Puisque dans tous les cas, dans ce document,
      les erreurs sont exprimées en valeurs relatives, il a été décidé qu'une définition
      séparée d'erreur n'était pas nécessaire.
