  definition:
  - content: Dispositif intégré au compteur d'eau avec les dispositifs électroniques
      et qui permet de détecter et de mettre en évidence des défauts significatifs.
  examples: []
  id: r49-1-2003-f-2.5.4-fra
  notes:
  - content: Le contrôle d'un dispositif de transmission a pour but de vérifier que
