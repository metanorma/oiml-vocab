  definition:
  - content: fault exceeding the applicable fault limit value
  examples: []
  id: r150-1-2020-eng-2.4.5.5-eng
  notes:
  - content: A significant fault does not include faults arising from simultaneous
      and mutually independent causes, faults implying the impossibility of performing
      any weighing, transitory faults, momentary variations in the indications which
      cannot be interpreted, memorised or transmitted as a weighing result, and faults
      which are so serious they will inevitably be noticed by all those interested
      in the weighing result.
