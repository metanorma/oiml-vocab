  definition:
  - content: Smallest quantity of liquid for which the measurement is metrologically
      acceptable for that system or element.
  examples: []
  id: r117-1-2007-eng-T.q.1.3-eng
  notes:
  - content: In measuring systems intended for delivery operations, this smallest
      quantity is referred to as the minimum delivery; in those intended for receiving
      operations, it is referred to as the minimum receipt.
