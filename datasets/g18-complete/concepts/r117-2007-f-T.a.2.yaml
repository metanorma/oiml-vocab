    type: accepted
  definition:
  - content: Élément ou dispositif, autre qu'un dispositif complémentaire, nécessaire
      pour assurer un mesurage correct, ou destiné à faciliter les opérations de mesurage,
      ou pouvant influer sur le mesurage de quelque manière que ce soit.
  examples: []
  id: r117-2007-f-T.a.2-fra
  notes:
  - content: 'Les principaux dispositifs additionnels sont les suivants: dispositif
      d''élimination des gaz, indicateur de gaz, viseur, filtre, pompe, dispositif
      constituent le point de transfert, dispositif anti-tourbillon, bifurcations
      ou dérivations, vannes, flexibles.'
