  definition:
  - content: institute in a country that has a responsibility, sometimes set out legally,
      for the conservation of one or more national measurement standards
  examples: []
  id: d5-2022-e-3.32-eng
  notes:
  - content: The recommended role of a National Metrology Institute (NMI) is described
      in detail in OIML D 1:2012 3.2.3.
  - content: The recommended role of a Designated Institute (DI) is described in CIPM
      2005-07 and CIPM 2005-06 (V4).
