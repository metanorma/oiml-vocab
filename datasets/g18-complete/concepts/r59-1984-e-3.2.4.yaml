  definition:
  - content: Zero value and test value.
  examples: []
  id: r59-1984-e-3.2.4-eng
  notes:
  - content: The value 0% mass can, in practice, never be reached by the quantity
      which represents the moisture content of a sample of grains or seeds. However,
      moisture meters may give a "zero" indication. This zero is mechanical or electrical
      according to the principle of measurement of the instrument. For moisture meters
      with direct indication of the moisture content - that is to say not requiring
      the use of conversion tables - zero may represent the result of a measurement
      when the measuring cell is empty or the indication of the instrument when the
      measuring operations have not yet been initiated.
  - content: A device enabling the determination of a test value is a device aiming
      at verifying the smooth running of the measuring part. The test value is obtained
      by one or more indications of the indicating device which are the result of
      a measurement simulation.
