  definition:
  - content: probability distribution of a continuous random variable X having the
      probability density function $g _ {X} (\xi) = \frac {\Gamma ((\nu + 1) / 2)}{\sqrt
      {\pi \nu} \Gamma (\nu / 2)} \left(1 + \frac {\xi^ {2}}{\nu}\right) ^ {- (\nu
      + 1) / 2},$ for $ - \infty < \xi < + \infty $ , with parameter $ \nu $ , a positive
      integer, the degrees of freedom of the distribution, where $ \Gamma (z) = \int_
      {0} ^ {\infty} t ^ {z - 1} \mathrm {e} ^ {- t} \mathrm{d} t, \quad z > 0,$ is
      the gamma function
