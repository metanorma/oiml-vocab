  definition:
  - content: kleinstes Sollgewicht einer Füllung, unterhalb dessen die in dieser Empfehlung
      festgelegten Fehlergrenzen der Wägeergebnisse überschritten werden können
  examples: []
  id: r61-1-2017-deu-3.4.9-deu
  notes:
  - content: Bei einer SWA, die eine Füllung in mehreren Wägezyklen erzeugt, ist die
      kleinste Abgabemenge, Minfill, größer als die Mindestlast, Min.
