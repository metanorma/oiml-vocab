    type: accepted
  definition:
  - content: Un compteur à vortex fonctionne en captant les tourbillons détachés de
      part et d'autre d'un corps perturbateur placé dans un fluide en écoulement.
      La fréquence de détachement des tourbillons dépend du nombre de Reynolds du
      fluide.
  examples: []
  id: d25-2010-f-2.1-fra
  notes:
  - content: Un compteur à vortex consiste en quatre composants de base.
