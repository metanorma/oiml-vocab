  definition:
  - content: Medidor de electricidad diseñado para permitir la entrega de energía
      eléctrica hasta una cantidad predeterminada.
  examples: []
  id: r46-1-spa-2.1.3-spa
  notes:
  - content: Dichos medidores miden energía continuamente y almacenan y muestran la
      energía medida.
  - content: Las autoridades nacionales pueden especificar los requisitos en relación
      con los medidores de prepago.
