  definition:
  - content: Film spécialement préparé qui subit une variation d'absorbance optique
      lorsqu'il est exposé à des rayonnements ionisants. Cette variation d'absorbance
      peut être liée à la dose absorbée dans la matière environnante (habituellement
      de l'eau).
