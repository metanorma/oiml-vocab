  definition:
  - content: Le temps de réponse est le temps nécessaire à un pyromètre à radiation
      totale, suite à une variation soudaine delta T de la température de la source,
      pour produire un changement eta x delta T de l'indication du pyromètre, où eta
      est la valeur indiquée dans la spécification du pyromètre.
