    type: accepted
  definition:
  - content: period of time that the gas analytical system requires from applying
      power to the instrument to attaining the operating mode at which the instrument
      will operate within the maximum permissible errors
  examples: []
  id: r144-1-2013-eng-2.11-eng
  notes:
  - content: For a gas analyzer this is the time between the instant at which power
      is applied to it and the instant at which the measurement result of the volume
      fraction, a CGM being supplied to the input, is within the permissible limits.
