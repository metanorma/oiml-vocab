data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: instrumento de medición que reproduce o proporciona de manera permanente
      durante su utilización, magnitudes de uno o más tipos dados, cada una de ellas
      con un valor asignado
  examples:
  - content: Pesa patrón, medida de volumen (que ofrece uno o más valores, con o sin
      escala de valores), resistencia eléctrica patrón, regla graduada, bloque patrón,
      generador de señales
  id: d10-2022-spa-3.12-spa
  notes:
  - content: La indicación de una medida materializada es su valor asignado.
  - content: Una medida materializada puede ser un patrón.
  - content: 'Source citation: VIM3, 3.6'
