data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: all of the prepackage that is not packing material
  examples: []
  id: r87-2016-e-2.1.12-eng
  notes:
  - content: Product includes liquids or gasses that were put in the prepackage together
      with the product and that are not intended to be left over after use of the
      product (e.g. air in chocolate mousse).
  - content: Product includes liquids or gasses that were not put in the prepackage
      with the product and that are intended to be left over after use of the product
      (e.g. liquid in mozzarella cheese, air in hair gel).
  - content: Product includes liquids or gasses that were not put in the prepackage
      with the product and that are not intended to be left over after use of the
      product (e.g. curdling of yoghurt or honey).
  sources:
  - origin:
      ref:
