  definition:
  - content: Paramètre réglementairement pertinent ayant une valeur qui dépend uniquement
      du type de l'instrument. Les paramètres spécifiques au type font partie du logiciel
      réglementairement pertinent.
  examples:
  - content: Considérant un ensemble de mesurage de liquides autres que l'eau, la
      plage de viscosité cinématique d'une turbine est un paramètre spécifique au
      type qui est fixé par l'approbation de type de la turbine.
