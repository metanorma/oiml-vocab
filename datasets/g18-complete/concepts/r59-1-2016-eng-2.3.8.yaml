    type: accepted
  definition:
  - content: with reference to a certified measurement standard, difference between
      the mean error of indication while one or more influence quantities are varied
      within the rated operating conditions and the mean intrinsic error of a measuring
      instrument
  examples: []
  id: r59-1-2016-eng-2.3.8-eng
  notes:
  - content: See 4.4.1 for the error shifts associated with grain moisture meter testing.
  - content: If a certified measurement standard is not used, the error shift is the
      difference between two measured values, the indication under rated operating
      conditions and the mean indication at reference conditions prior to test.
