data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: The concentration of the sample component of interest that gives a detector
      output signal equal to three times the short-term noise.
  examples: []
  id: r112-1994-e-2.9-eng
  notes:
  - content: This term is also referred to as minimum detectability in some references
      and manufacturer's literature. It is sometimes defined as an output signal equal
      to some other multiple (for example, two or ten) of the noise.
