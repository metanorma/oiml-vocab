data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: valor de una magnitud que sirve como base de comparación con valores
      de magnitudes del mismo tipo
  examples: []
  id: d10-2022-spa-3.21-spa
  notes:
  - content: El valor de referencia puede ser un valor verdadero de un mensurando,
      en cuyo caso es desconocido, o un valor convencional, en cuyo caso es conocido.
  - content: Un valor de referencia con su incertidumbre de medición asociada habitualmente
      se refiere a un material, por ejemplo, un material de referencia certificado;
      un dispositivo, por ejemplo, un láser estabilizado; un procedimiento de medición
      de referencia; o una comparación de patrones de medición.
