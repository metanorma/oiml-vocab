  definition:
  - content: Etendue des debits massiques ou des concentrations du composant de l'echantillon
      examine dans le gaz vecteur pour laquelle la sensibilite d'un detecteur reste
      constante dans des limites specifiees et est exprimee comme le rapport de sa
      limite superieure a la limite de detection.
