    type: accepted
  definition:
  - content: semi-width of the shortest interval containing all numbers that can correctly
      be expressed to a specified number of significant decimal digits
  examples:
  - content: All numbers greater than 1.75 and less than 1.85 can be expressed to
      two significant decimal digits as 1.8. The numerical tolerance is $ ( 1.85-1.75
      ) / 2=0.05.$
  id: g1-101-2008-e-3.20-eng
  notes:
  - content: For the calculation of numerical tolerance associated with a numerical
      value, see 7.9.2.
