  definition:
  - content: device employing electronic sub-assemblies and performing a specific
      function
  examples: []
  id: r49-1-2000-eng-2.5.1-eng
  notes:
  - content: Electronic devices, as defined above, may be complete meters or parts
      of meters, in particular such as those mentioned in 2.1.1 through 2.1.5 and
      2.1.8. Electronic devices are usually manufactured as separate units and are
      capable of being tested independently.
