data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: weigher designed such that it causes a vertical flow of bulk product
      to effect a centripetal force proportionally to the mass of the product passing
      along the circular arched surface of the force receptor (2.2.1)
  examples: []
  id: r150-1-2020-eng-2.1.4-eng
  notes:
  - content: Not all chute weighers meet the definition stated in this Recommendation.
  - content: Arched chute weighers are designed such that a vertical flow of bulk
      product uses the action of gravity to effect a centripetal force proportional
      to the mass of the product.
  - content: The force receptor of an arched chute weigher is equipped with a circular
      arched surface.
  - content: Arched chute weighers that measure horizontal flows, using only centripetal
      force, are not covered by the definition of a weighing instrument in 2.1.1 and
      therefore are not covered by this Recommendation.
  sources:
