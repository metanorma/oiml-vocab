  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Fehler, der den anwendbaren Fehlergrenzwert übersteigt
  examples: []
  id: r129-1-2020-deu-2.3.7-deu
  notes:
  - content: 'Die folgenden Fehler werden als nicht signifikant betrachtet, auch dann
      nicht, wenn sie den oben definierten Wert überschreiten: (a) Fehler, die durch
      gleichzeitig und voneinander unabhängig auftretende Ursachen im Messgerät entstehen;
      (b) Fehler, die jede Messung unmöglich machen; (c) auf momentane Abweichungen
      zurückzuführende vorübergehende Fehler, die nicht als Messergebnis gedeutet,
      gespeichert oder übermittelt werden können; (d) Fehler, durch die beim Messergebnis
      Schwankungen auftreten, die so gravierend sind, dass sie von allen am Messergebnis
      Interessierten wahrgenommen werden.'
