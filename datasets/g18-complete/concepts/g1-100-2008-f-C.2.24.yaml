  definition:
  - content: opération ayant pour but, à partir des résultats d'essais dans un échantillon,
      d'attribuer des valeurs numériques aux paramètres d'une loi prise comme modèle
      statistique de la population dont est issu l'échantillon
  examples: []
  id: g1-100-2008-f-C.2.24-fra
  notes:
  - content: Le résultat de cette opération peut être exprimé sous la forme d'une
      valeur unique, point estimateur, ou sous la forme d'un intervalle estimateur.
