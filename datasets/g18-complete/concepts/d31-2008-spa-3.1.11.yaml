  definition:
  - content: Procesos en los que el remitente cifra datos y el receptor los descifra
      con el objetivo de ocultar información a personas no autorizadas. Firma electrónica
      de los datos con el objeto de permitir al receptor o usuario verificar su origen.
  examples: []
  id: d31-2008-spa-3.1.11-spa
  notes:
  - content: Por lo general, se utiliza para firmar electrónicamente un sistema de
      clave pública.
