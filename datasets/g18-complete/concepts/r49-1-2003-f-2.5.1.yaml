  definition:
  - content: Dispositif employant des sous-ensembles électroniques et accomplissant
      une fonction spécifique. Un dispositif électronique est habituellement fabriqué
      en tant qu'unité séparée et peut être essayé indépendamment.
  examples: []
  id: r49-1-2003-f-2.5.1-fra
  notes:
  - content: Un dispositif électronique tel que défini ci-dessus, peut consister en
      un compteur complet ou en une partie de compteur, en particulier, comme ceux
      mentionnés de 2.1 à 2.1.5 et en 2.1.8.
