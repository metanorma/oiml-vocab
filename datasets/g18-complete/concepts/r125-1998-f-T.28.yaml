data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Defaut superieur a la valeur absolue de l'erreur maximale toleree pour
      la quantite minimale.
  examples: []
  id: r125-1998-f-T.28-fra
  notes:
  - content: 'Les defauts suivants ne sont pas consideres comme significatifs, meme
      s''ils depassent la valeur definie ci-dessus: (a) defauts provenant de causes
      simultanees et mutuellement independantes, dans l''instrument de mesure lui-meme
      ou dans son dispositif de controle; (b) defauts rendant impossible l''accomplissement
      de toute mesure; (c) defauts transitoires consistant en des variations momentanees
      de l''indication ne pouvant etre interpretees, mises en memoire ou transmises
      comme des resultats de mesure; et (d) defauts provoquant des variations des
      resultats de mesure si importantes que leur manifestation apparait evidente
      aux personnes interessees au resultat de mesure.'
