  definition:
  - content: Composant d'un thermometre qui controle pendant un temps specifie la
      temperature mesuree par une sonde en contact avec une cavite ou un tissu du
      corps, apres quoi il indique la temperature maximale et maintient l'indication
      jusqu'au rearmement par l'utilisateur.
