  definition:
  - content: Concentration d'un composant de l'echantillon examine provoquant un signal
      de sortie du detecteur egal a trois fois le niveau du bruit a court terme.
  examples: []
  id: r112-1994-f-2.9-fra
  notes:
  - content: 'On trouve aussi le terme "detection minimale" dans quelques unes des
      references et dans les prospectus des constructeurs. On definit parfois la limite
      de detection comme un signal de sortie egal a d''autres multiples (par exemple:
      deux ou dix) du bruit.'
