  definition:
  - content: fuel dispenser providing mixtures of various grades of a single product
      or blends of more than one product through a single nozzle; examples include
      gasoline (a multigrade-dispenser) and mixtures of gasoline and lubricating oil
      (a gasoline-oil-dispenser)
  examples: []
