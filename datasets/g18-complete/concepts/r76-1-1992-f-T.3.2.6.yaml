  definition:
  - content: Instruments ayant une seule étendue de pesage qui est divisée en étendues
      de pesage partielles ayant chacune un échelon différent, l'étendue de pesage
      étant déterminée automatiquement selon la charge appliquée, pour des charges
      aussi bien croissantes que décroissantes.
