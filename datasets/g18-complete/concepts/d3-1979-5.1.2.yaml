  definition:
  - content: Vérification d'un instrument de mesurage neuf qui n'a pas été vérifié
      auparavant.
  examples: []
  id: d3-1979-f-5.1.2-fra
  notes:
  - content: De par cette définition, la vérification primitive ne s'applique qu'aux
      instruments neufs, mais les réglementations nationales peuvent prescrire que
      les instruments réparés ou rajustés doivent aussi subir une vérification conforme
      à la vérification primitive.
