  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: condition de fonctionnement qui doit être satisfaite pendant un mesurage
      pour qu'un instrument de mesure ou un système de mesure fonctionne conformément
      à sa conception
  examples: []
  id: r46-2012-e-2.2.26-fra
  notes:
  - content: Les conditions assignées de fonctionnement spécifient généralement des
      intervalles de valeurs pour la grandeur mesurée et pour les grandeurs d'influence.
  - content: Pour l'application de la présente Recommandation, les termes «instrument
      de mesure» et «système de mesure» signifient compteur électrique.
