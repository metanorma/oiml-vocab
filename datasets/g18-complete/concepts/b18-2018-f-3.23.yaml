  - content: personne ou organisme de certification dans un État Membre ou Membre
      Correspondant de l'OIML qui est responsable de l'approbation de type nationale
      et qui délivre des Certificats d'Approbation de Type nationaux/régionaux pour
      les catégories spécifiques d'instruments de mesure ou de modules, sur la base
      d'examens et d'essais réalisés sous son propre contrôle
