  definition:
  - content: Dispositif utilisé dans le but d'éliminer l'air, le gaz ou la vapeur
      contenus dans le liquide. Il existe plusieurs types de dispositifs de dégazage
      qui comprennent notamment les séparateurs de gaz, les purgeurs de gaz et les
      purgeurs de gaz spéciaux.
