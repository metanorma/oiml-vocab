  definition:
  - content: part of an instrument that enables information to be passed between measuring
      instruments, components of measuring instruments or other external systems
  examples: []
  id: d31-2019-e-3.1.6-eng
  notes:
  - content: Communication interfaces can be wired, optical, radio, etc. and they
      are usually designed to use a specific protocol.
  - content: This definition does not include communication between software parts.
