  definition:
  - content: Débit qui se produit entre le débit permanent $ Q_{3} $ , et le débit
      minimal $ Q_{1} $ , divisant l'etendue de débit en deux zones, la zone supérieure
      de débit et la zone inférieure de débit, chacune étant caractérisée par sa propre
      erreur maximale tolérée.
