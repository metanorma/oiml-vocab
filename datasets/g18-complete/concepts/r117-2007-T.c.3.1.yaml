  definition:
  - content: 'Valeurs spécifiées caractérisant les conditions dans lesquelles la quantité
      de liquide mesurée est convertie (exemple: température et pression de base).'
  examples: []
  id: r117-2007-f-T.c.3.1-fra
  notes:
  - content: Il ne faut pas confondre les conditions de mesure et les conditions de
      base (qui se rapportent seulement à la quantité du liquide à mesurer ou à indiquer)
      avec les "conditions assignées de fonctionnement" et les "conditions de référence"
      qui se rapportent aux grandeurs d'influence.
