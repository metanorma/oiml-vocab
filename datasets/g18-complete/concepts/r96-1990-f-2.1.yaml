  definition:
  - content: La capacité nominale (Vn) d'une bouteille est le volume de liquide qu'elle
      est censée contenir lorsqu'elle est remplie dans les conditions pour lesquelles
      elle est prévue. La capacité nominale doit toujours être marquée sur la bouteille
      (voir point 7.1.1). Des capacités nominales déterminées peuvent être fixées
      pour des catégories de liquides par une réglementation nationale.
