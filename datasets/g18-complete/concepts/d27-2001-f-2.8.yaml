  definition:
  - content: Aptitude d'un ensemble de caractéristiques intrinsèques à satisfaire
      des exigences.
  examples: []
  id: d27-2001-f-2.8-fra
  notes:
  - content: Le terme "qualité" peut être utilisé avec des qualificatifs tels que
      médiocre, bon ou excellent.
  - content: '"Intrinsèque", par opposition à "attribué", signifie présent dans quelque
      chose, notamment en tant que caractéristique permanente.'
