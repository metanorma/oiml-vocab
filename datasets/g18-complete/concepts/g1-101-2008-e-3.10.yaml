data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: property of a pair of random variables, which, for two continuous random
      variables $ X_{1} $ and $ X_{2} $ characterized by a joint (multivariate) PDF
      $ g_{X}(\boldsymbol{\xi}) $ , where $ \boldsymbol{X}=(X_{1},X_{2})^{\top} $
      and $ \boldsymbol{\xi}=(\xi_{1},\xi_{2})^{\top} $ , is given by $\operatorname
      {C o v} \left(X _ {1}, X _ {2}\right) = \int_ {- \infty} ^ {\infty} \int_ {-
      \infty} ^ {\infty} \left[ \xi_ {1} - E \left(X _ {1}\right) \right] \left[ \xi_
      {2} - E \left(X _ {2}\right) \right] g _ {\boldsymbol {X}} \left(\boldsymbol
      {\xi}\right) \mathrm{d} \xi_ {1} \mathrm{d} \xi_ {2}$
  examples: []
  id: g1-101-2008-e-3.10-eng
  notes:
  - content: Not all pairs of random variables have a covariance.
  sources:
