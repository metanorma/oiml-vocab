data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Un afficheur numerique peut etre compris comme un afficheur primaire
      ou comme un afficheur secondaire. Un afficheur primaire est soit incorpore dans
      le boitier de l'indicateur, ou dans le boitier du terminal, ou concu comme un
      afficheur dans un boitier separe (c'est a dire un terminal sans touche), par
      exemple pour une utilisation combinee avec un module de pesage. Un afficheur
      secondaire est un dispositif peripherique additionnel (en option) qui repete
      le resultat de pesage et toute autre indication primaire, ou fournit aussi,
      des informations non metrologiques.
  examples: []
  id: r76-2006-f-T.2.2.6-fra
  notes:
  - content: Les termes « afficheur primaire » et « afficheur secondaire » ne doivent
      pas etre confondus avec les termes « indication primaire » et « indication secondaire
      » (T.1.3.1 et T.1.3.2).
