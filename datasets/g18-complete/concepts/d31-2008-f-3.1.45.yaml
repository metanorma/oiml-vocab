  definition:
  - content: Sécurisation du logiciel de l'instrument de mesure ou du domaine de données
      par la mise en oeuvre de scellement mécanique ou logiciel. Le scellement doit
      être retiré, endommagé, ou brisé pour obtenir l'accès permettant de changer
      le logiciel.
