  definition:
  - content: manufacturer and/or authorized representative who submits an application
      for an OIML type evaluation of a measuring instrument to an OIML Issuing Authority
      in order to receive an OIML type evaluation report and an OIML Certificate for
      that type of measuring instrument
  examples: []
  id: b18-2017-e-3.3-eng
  notes:
  - content: Upon issuance of the OIML Certificate, the applicant becomes the owner
      of the OIML Certificate.
