data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: quantity that is not the measurand but that affects the result of the
      measurement
  examples:
  - content: Temperature of a micrometer used to measure length.
  - content: Frequency in the measurement of the amplitude of an alternating electric
      potential difference.
  - content: Bilirubin concentration in the measurement of haemoglobin concentration
      in a sample of human blood plasma.
  id: g1-100-2008-e-B.2.10-eng
  notes:
  - content: The definition of influence quantity is understood to include values
      associated with measurement standards, reference materials, and reference data
      upon which the result of a measurement may depend, as well as phenomena such
      as short-term measuring instrument fluctuations and quantities such as ambient
      temperature, barometric pressure and humidity.
  - content: 'Source citation: VIM:1993, definition 2.7'
