  - content: Compteur d'énergie thermique - souvent appelé instrument « compact »
      qui, aux fins de l'approbation de modèle et de la vérification, peut être traité
      comme un instrument combiné tel que défini en 3.2. Cependant, après vérification,
      ses sous-ensembles doivent être considérés comme inséparables.
