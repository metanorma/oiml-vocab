    type: accepted
  definition:
  - content: 'Group of gas meters of different sizes and/or different flow rates,
      in which all the meters shall have the following characteristics: the same manufacturer;
      geometric similarity of the measuring part; the same metering principle; roughly
      the same ratios Q_max/Q_min and Q_max/Q_t; the same accuracy class; the same
      electronic device (see 3.5.2) for each meter size and using the same metrological
      software routines (if applicable) for those components that are critical to
      the performance of the meter; a similar standard of design and component assembly;
      and the same materials for those components that are critical to the performance
      of the meter.'
