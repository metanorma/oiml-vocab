  definition:
  - content: 'Parámetro de un instrumento de medida, dispositivo electrónico o subconjunto
      sujetos al control legal. Se pueden distinguir los siguientes tipos de parámetros
      legalmente relevantes: «parámetros específicos del modelo» y «parámetros específicos
      del dispositivo».'
