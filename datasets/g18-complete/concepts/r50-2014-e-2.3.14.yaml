data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: identifiable group of measuring instruments belonging to the same manufactured
      type within the same category that have the same design features and metrological
      principles for measurement (for example the same type of indicator, the same
      type of design of load cell and load transmitting device) but which may differ
      in some metrological and technical performance characteristics (e.g. Max, Min,
      d accuracy class, etc.)
  examples: []
  id: r50-2014-e-2.3.14-eng
  notes:
  - content: 'Source citation: OIML B3, 3.3 [3]'
  - content: The concept of family primarily aims at reducing the test effort at type
      examination. It does not preclude the possibility of listing more than one family
      in one certificate.
