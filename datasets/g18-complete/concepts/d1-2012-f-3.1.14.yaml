data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: attestation délivrée par une tierce partie, ayant rapport à un organisme
      d'évaluation de la conformité, constituant une reconnaissance formelle de la
      compétence de ce dernier à réaliser des activités spécifiques d'évaluation de
      la conformité
  examples: []
  id: d1-2012-f-3.1.14-fra
  notes:
  - content: En général, le système national d'accréditation est un système volontaire
      qui établit les compétences et l'impartialité des laboratoires d'étalonnage
      pour réaliser des étalonnages et mesurages traçables, laboratoires d'essais,
      organismes d'inspection, et organismes de certification, certificateur de produit,
      certificateur de systèmes qualité ou certificateur de personnel.
  - content: 'Source citation: ISO 17000:2004, 5.6'
