  definition:
  - content: L'erreur relative de mesure de tension est la différence entre la tension
      mesurée par l'électrocardiographe et la tension appliquée à son entrée (dont
      la valeur de référence est prise comme valeur conventionnellement vraie), divisée
      par la tension d'entrée.
