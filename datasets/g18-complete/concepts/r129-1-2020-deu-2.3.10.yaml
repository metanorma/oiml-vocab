  definition:
  - content: Einflussgröße, deren Wert innerhalb der in dieser Empfehlung angegebenen
      Grenzen, jedoch außerhalb der angegebenen Bemessungsbetriebsbedingungen des
      Messgeräts liegt
  examples: []
  id: r129-1-2020-deu-2.3.10-deu
  notes:
  - content: Eine Einflussgröße ist ein Störeinfluss, wenn für diese Einflussgröße
      keine Bemessungsbetriebsbedingungen festgelegt sind.
