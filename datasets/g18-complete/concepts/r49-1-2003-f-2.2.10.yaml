data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Défaut dont la valeur est supérieure à la moitié de l'erreur maximale
      tolérée dans la zone supérieure de débit [adapté de D 11, T.9].
  examples: []
  id: r49-1-2003-f-2.2.10-fra
  notes:
  - content: 'Ne sont pas considérés comme défauts significatifs: les défauts résultant
      de causes simultanées et mutuellement indépendantes dans le compteur d''eau
      lui-même ou dans son système de contrôle; et les défauts transitoires consistant
      en des variations momentanées de l''indication qui ne peut être interprétée,
      mérorisée ou transmise en tant que résultat de mesure.'
  - content: 'Source citation: OIML D 11, T.9'
