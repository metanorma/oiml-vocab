  definition:
  - content: rapport de la puissance active sur la puissance apparente
  examples: []
  id: r46-2012-e-2.2.14-fra
  notes:
  - content: Dans des conditions sinusoïdales et soit en phase, soit en triphasé symétrique,
      le facteur de puissance = cos $ \varPhi $ = le cosinus de la différence de phase
      $ \varPhi $ entre la tension U et le courant I.
