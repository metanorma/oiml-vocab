  - content: ratio of the active power to the apparent power
  examples: []
  id: r46-2012-e-2.2.14-eng
  notes:
  - content: At sinusoidal and either one-phase or symmetrical three-phase conditions,
      the power factor = cos $\varPhi$ = the cosine of the phase difference $\varPhi$
      between voltage U and current I.
