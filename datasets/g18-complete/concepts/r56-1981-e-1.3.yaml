data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Quantity characterising a container of a given form and dimensions, for
      a given position of the level of liquid with respect to the electrodes (geometrical
      characteristic of the cell).
  examples: []
  id: r56-1981-e-1.3-eng
  notes:
  - content: The constant of the cell is calculated by the following formula K = l/A
      where K is the constant of the cell, m^-1; l is distance between measurement
      electrodes, m; A is cross section of the electrolyte column situated between
      the electrodes, m^2.
  - content: On account of the complexity of the accurate determination of the geometrical
      characteristics of the cell, the cell-constant is usually determined by means
      of an indirect method, using electrolytes of which the conductivities are known
      (standard solutions).
  - content: Using this method, the cell-constant is calculated by means of the formula
      K = x R where x is conductivity of the standard solution, S/m and R is measured
      resistance, Omega.
  sources:
