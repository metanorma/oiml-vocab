  definition:
  - content: Entité logique telle que programme, sous-programme, et objet incluant
      son domaine de données, qui peut être en relation avec d'autres entités. Le
      logiciel d'un instrument de mesure, dispositif électronique ou sous-ensemble
      est constitué d'un ou plusieurs modules logiciels.
