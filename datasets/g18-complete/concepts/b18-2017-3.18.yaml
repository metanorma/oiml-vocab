data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Laboratoire d'Essai d'un fabricant, désigné par une Autorité de Délivrance
      OIML et enregistré dans la Déclaration, réalisant des essais spécifiques sous
      surveillance contrôlée (voir clause 7 de PD-04) ou en tant que laboratoire d'une
      tierce partie d'une Autorité de Délivrance OIML
  examples: []
  id: b18-2017-f-3.18-fra
  notes:
  - content: Un LEF peut réaliser des essais pour sa société mère et/ou d'autres sociétés.
      Les exigences portant sur la surveillance contrôlée s'appliquent si les essais
      sont réalisés pour la société mère. Sinon, le LEF est considéré comme un Laboratoire
      d'Essai d'une tierce partie; dans ce cas, les exigences applicables aux laboratoires
      d'une tierce partie doivent être satisfaites.
  - content: Si les résultats d'essais proviennent d'un LEF, cela doit être clairement
      indiqué dans le rapport d'évaluation de type OIML (voir 5.5.4 de PD-05) et l'acceptation
      de ce rapport est volontaire (voir 4.9 de PD-06).
