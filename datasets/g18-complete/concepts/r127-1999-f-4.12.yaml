  - content: Propriété du résultat d'un mesurage ou valeur d'un étalon par laquelle
      il peut être relié à des références préétablies, habituellement des étalons
      nationaux ou internationaux, à travers une chaîne ininterrompue de comparaisons,
      ayant toutes des incertitudes définies.
