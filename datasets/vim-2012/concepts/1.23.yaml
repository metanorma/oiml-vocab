data:
  dates:
  - date: '2012-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: mathematical relation between {{1.10,base units}}, {{1.12,coherent derived units}}
      or other {{1.9,measurement units}}
  examples:
  - content: For the {{1.1,quantities}} in Example 1 of item 1.22, stem:[[Q_1\] = [Q_2\] [Q_3\]]
      where stem:[[Q_1\]], stem:[[Q_2\]], and stem:[[Q_3\]] denote the measurement units of
      stem:[Q_1], stem:[Q_2], and stem:[Q_3], respectively,
      provided that these measurement units are in a {{1.14,coherent system of units}}.
  - content: stem:[J := kg m^2/s^2], where stem:[J], stem:[kg], stem:[m], and stem:[s] are the symbols for the joule, kilogram,
      metre, and second, respectively. (The symbol := denotes "is by definition equal
      to" as given in the ISO 80000 and IEC 80000 series.)
  - content: stem:[1 "unitsml(km/h)" = (1/3.6) "unitsml(m/s)"].
  id: 1.23-eng
  language_code: eng
  notes: []
  terms:
  - type: expression
    normative_status: preferred
    designation: unit equation
date_accepted: '2012-01-01T00:00:00+00:00'
entry_status: valid
