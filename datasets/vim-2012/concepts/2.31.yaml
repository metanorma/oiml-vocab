data:
  dates:
  - date: '2012-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: "{{2.30,standard measurement uncertainty}} that is obtained using the
      individual {{2.30,standard measurement uncertainties}} associated with the {{2.50,input quantities in a measurement model}}"
  examples: []
  id: 2.31-eng
  language_code: eng
  notes:
  - content: In case of correlations of input quantities in a measurement model, covariances
      must also be taken into account when calculating the combined standard measurement
      uncertainty; see also ISO/IEC Guide 98-3:2008, 2.3.4.
  terms:
  - type: expression
    normative_status: preferred
    designation: combined standard measurement uncertainty
  - type: expression
    normative_status: admitted
    designation: combined standard uncertainty
  annotations:
  - content: 'Here "standard measurement uncertainty" can be replaced by "standard
      uncertainty" in both occurrences without ambiguity: "standard uncertainty that
      is obtained using the individual standard uncertainties associated with the
      input quantities in a measurement model".'
date_accepted: '2012-01-01T00:00:00+00:00'
entry_status: valid
