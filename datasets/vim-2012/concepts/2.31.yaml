data:
  dates:
  - date: '2012-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: "{{2.30,incertitude-type}} obtenue en utilisant les {{2.30,incertitudes-types}}
      individuelles associées aux {{2.50,grandeurs d'entrée dans un modèle de mesure}}"
  examples: []
  id: 2.31-fra
  language_code: fra
  notes:
  - content: Lorsqu'il existe des corrélations entre les grandeurs d'entrée dans un
      modèle de mesure, il faut aussi prendre en compte des covariances dans le calcul
      de l'incertitude-type composée; voir aussi le Guide ISO/CEI 98-3:2008, 2.3.4.
  terms:
  - type: expression
    normative_status: preferred
    designation: incertitude-type composée
date_accepted: '2012-01-01T00:00:00+00:00'
entry_status: valid
