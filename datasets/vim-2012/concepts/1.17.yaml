data:
  dates:
  - date: '2012-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: "{{1.9,unité de mesure}} obtenue en multipliant une unité de mesure donnée
      par un entier supérieur à un"
  examples:
  - content: "Le kilomètre est un multiple décimal du mètre."
  - content: "L'heure est un multiple non décimal de la seconde."
  id: 1.17-fra
  language_code: fra
  notes:
  - content: Les préfixes SI pour les multiples décimaux des {{1.10,unités de base}}
      et des {{1.11,unités dérivées}} du {{1.16,SI}} sont donnés à la Note 5 de 1.16.
  - content: |-
      Les préfixes SI représentent strictement des puissances de 10 et il convient
      de ne pas les utiliser pour des puissances de 2. Par exemple, il convient de
      ne pas utiliser 1 kilobit pour représenter stem:[1024] bits (stem:[2^{10}] bits),
      qui est 1 kibibit.

      Les préfixes pour les multiples binaires sont:

      [cols="3",options=]
      |===
      .2+| Factor +
      Facteur
      2+| Prefix +
      Préfixe
      | Name +
      Nom
      | Symbol +
      Symbole

      | stem:[(2^{10})^8]
      | yobi +
      yobi
      | stem:[Yi]

      | stem:[(2^{10})^7]
      | zebi +
      zebi
      | stem:[Zi]

      | stem:[(2^{10})^6]
      | exbi +
      exbi
      | stem:[Ei]

      | stem:[(2^{10})^5]
      | pebi +
      pebi
      | stem:[Pi]

      | stem:[(2^{10})^4]
      | tebi +
      tebi
      | stem:[Ti]

      | stem:[(2^{10})^3]
      | gibi +
      gibi
      | stem:[Gi]

      | stem:[(2^{10})^2]
      | mebi +
      mebi
      | stem:[Mi]

      | stem:[(2^{10})^1]
      | kibi +
      kibi
      | stem:[Ki]
      |===

      Source: CEI 80000-13.
  terms:
  - type: expression
    normative_status: preferred
    designation: multiple d'une unité
date_accepted: '2012-01-01T00:00:00+00:00'
