data:
  dates:
  - date: '2012-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: "{{1.9,measurement unit}} obtained by multiplying a given measurement
      unit by an integer greater than one"
  examples:
  - content: "The kilometre is a decimal multiple of the metre."
  - content: "The hour is a non-decimal multiple of the second."
  id: 1.17-eng
  language_code: eng
  notes:
  - content: SI prefixes for decimal multiples of SI {{1.10,base units}} and SI {{1.11,derived units}} are given in Note 5 of 1.16.
  - content: |-
      SI prefixes refer strictly to powers of 10, and should not be used for powers of 2.
      For example, 1 kilobit should not be used to represent stem:[1024] bits (stem:[2^{10}] bits),
      which is 1 kibibit.

      Prefixes for binary multiples are:

      [cols="3",options=]
      |===
      .2+| Factor +
      Facteur
      2+| Prefix +
      Préfixe
      | Name +
      Nom
      | Symbol +
      Symbole

      | stem:[(2^{10})^8]
      | yobi +
      yobi
      | stem:[Yi]

      | stem:[(2^{10})^7]
      | zebi +
      zebi
      | stem:[Zi]

      | stem:[(2^{10})^6]
      | exbi +
      exbi
      | stem:[Ei]

      | stem:[(2^{10})^5]
      | pebi +
      pebi
      | stem:[Pi]

      | stem:[(2^{10})^4]
      | tebi +
      tebi
      | stem:[Ti]

      | stem:[(2^{10})^3]
      | gibi +
      gibi
      | stem:[Gi]

      | stem:[(2^{10})^2]
      | mebi +
      mebi
      | stem:[Mi]

      | stem:[(2^{10})^1]
      | kibi +
      kibi
      | stem:[Ki]
      |===
      
      Source: IEC 80000-13.
  terms:
  - type: expression
    normative_status: preferred
    designation: multiple of a unit
date_accepted: '2012-01-01T00:00:00+00:00'
entry_status: valid
