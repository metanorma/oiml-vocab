data:
  dates:
  - date: '2012-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: number and reference together expressing magnitude of a {{1.1,quantity}}
  examples:
  - content: |-
      Length of a given rod:
      stem:[5.34 "unitsml(m)"] or stem:[534 "unitsml(cm)"]
  - content: |-
      Mass of a given body:
      stem:[0.152 "unitsml(kg)"] or stem:[152 "unitsml(g)"]
  - content: |-
      Curvature of a given arc:
      stem:[112 "unitsml(m^{-1})"]
  - content: |-
      Celsius temperature of a given sample:
      stem:[-5 "unitsml(degC)"]
  - content: |-
      Electric impedance of a given circuit element at a given frequency, where j is the imaginary unit:
      stem:[(7 + 3j) "unitsml(Ohm)"]
  - content: |-
      Refractive index of a given sample of glass: 1.32
  - content: |-
      Rockwell C hardness of a given sample: stem:[43.5] HRC
  - content: |-
      Mass fraction of cadmium in a given sample of copper: stem:[3 "unitsml(ug/kg)"] or stem:[3 xx 10^{-9}]
  - content: |-
      Molality of Pb^2+^ in a given sample of water: stem:[1.76 "unitsml(umol/kg)"]
  - content: |-
      Arbitrary amount-of-substance concentration of lutropin in a given sample of human blood plasma (WHO International Standard 80/552 used as a calibrator):

      5.0 IU/l, where "IU" stands for "WHO International Unit"
  - content: Force acting on a given particle, e.g. in Cartesian components stem:[(F_x; F_y; F_z) = (-31.5; 43.2; 17.0) "unitsml(N)"].
  id: 1.19-eng
  language_code: eng
  notes:
  - content: |-
      According to the type of reference, a quantity value is either
      - a product of a number and a {{1.9,measurement unit}} (see Examples 1, 2, 3, 4, 5, 8 and 9); the measurement unit one is generally not indicated for {{1.8,quantities of dimension one}} (see Examples 6 and 8), or
      - a number and a reference to a {{2.6,measurement procedure}} (see Example 7), or
      - a number and a {{5.13,reference material}} (see Example 10).
  - content: The number can be complex (see Example 5).
  - content: A quantity value can be presented in more than one way (see Examples
      1, 2 and 8).
  - content: In the case of vector or tensor quantities, each component has a quantity
      value.
    examples:
      - content: |
            Force acting on a given particle, e.g. in Cartesian components
            stem:[(F_x; F_y; F_z) = (-31.5; 43.2; 17.0) "unitsml(N)"].
  terms:
  - type: expression
    normative_status: preferred
    designation: quantity value
  - type: expression
    normative_status: admitted
    designation: value of a quantity
  - type: expression
    normative_status: admitted
    designation: value
  annotations:
  - content: The term "quantity value" was chosen as the first (preferred) term in
      order to take advantage of the adjectival use of a noun in the English language.
      However, it is recognized that the more commonly used expression is the second
      term, "value of a quantity", or even the third term, "value" (when there is
      no possible ambiguity or confusion; for example, it is not necessary to write
      "quantity value of a measurand").
date_accepted: '2012-01-01T00:00:00+00:00'
