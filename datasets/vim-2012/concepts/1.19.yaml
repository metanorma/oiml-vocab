data:
  dates:
  - date: '2012-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: ensemble d'un nombre et d'une référence constituant l'expression quantitative
      d'une {{1.1,grandeur}}
  examples:
  - content: |-
      Longueur d'une tige donnée:
      stem:[5,34 "unitsml(m)"] ou stem:[534 "unitsml(cm)"]
  - content: |-
      Masse d'un corps donné:
      stem:[0,152 "unitsml(kg)"] ou stem:[152 "unitsml(g)"]
  - content: |-
      Courbure d'un arc donné:
      stem:[112 "unitsml(1/m)"]
  - content: |-
      Température Celsius d'un spécimen donné:
      stem:[-5 "unitsml(degC)"]
  - content: |-
      Impédance électrique d'un élément de circuit donné à une fréquence donnée, où j est l'unité imaginaire:
      stem:[(7 + 3j) "unitsml(Ohm)"]
  - content: |-
      Indice de réfraction d'un spécimen donné de verre:
      1,32
  - content: |-
      Dureté C de Rockwell d'un spécimen donné:
      stem:[43.5] HRC
  - content: |-
      Fraction massique de cadmium dans un spécimen donné de cuivre:
      stem:[3 "unitsml(ug/kg)"] ou stem:[3 xx 10^{-9}]
  - content: |-
      Molalité de Pb^2+^ dans un spécimen donné d'eau:
      stem:[1.76 "unitsml(umol/kg)"]
  - content: |-
      Concentration arbitraire en quantité de matière de lutropine dans un spécimen donné de plasma sanguin humain en utilisant l'étalon international 80/552 de l'OMS:

      stem:[5.0] IU/l, où «UI» signifie «unité internationale de l'OMS»
  - content: Force agissant sur une particule donnée, par exemple en coordonnées cartésiennes
      stem:[(F_x; F_y; F_z) = (-31,5; 43,2; 17,0) "unitsml(N)"].
  id: 1.19-fra
  language_code: fra
  notes:
  - content: |-
      Selon le type de référence, la valeur d'une grandeur est
      - soit le produit d'un nombre et d'une {{1.9,unité de mesure}} (voir les Exemples 1, 2, 3, 4, 5, 8 et 9); l'unité un est généralement omise pour les {{1.8,grandeurs sans dimension}} (voir Exemples 6 et 8);
      - soit un nombre et la référence à une {{2.6,procédure de mesure}} (voir Exemple 7);
      - soit un nombre et un {{5.13,matériau de référence}} (voir Exemple 10).
  - content: Le nombre peut être complexe (voir Exemple 5).
  - content: La valeur d'une grandeur peut être représentée de plus d'une façon (voir Exemples 1, 2 et 8).
  - content: Dans le cas de grandeurs vectorielles ou tensorielles, chaque composante
      a une valeur
    examples:
      - content: |
            Force agissant sur une particule donnée, par exemple en coordonnées cartésiennes
            stem:[(F_x; F_y; F_z) = (-31,5; 43,2; 17,0) "unitsml(N)"].
  terms:
  - type: expression
    normative_status: preferred
    designation: valeur d'une grandeur
  - type: expression
    normative_status: admitted
    designation: valeur
    grammar_info:
    - gender: f
date_accepted: '2012-01-01T00:00:00+00:00'
