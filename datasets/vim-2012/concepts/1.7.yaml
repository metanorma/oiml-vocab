data:
  dates:
  - date: '2012-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: expression de la dépendance d'une {{1.1,grandeur}} par rapport aux {{1.4,grandeurs de base}}
        d'un {{1.3,système de grandeurs}} sous la forme d'un produit de
        puissances de facteurs correspondant aux grandeurs de base, en omettant tout
        facteur numérique
  examples:
  - content: Dans l'{{1.6,ISQ}}, la dimension de la force est notée stem:[dim F= LMT^-2].
  - content: Dans le même système de grandeurs, stem:[dim rho_B = ML^-3] est la dimension de
      la concentration en masse du constituant stem:[B], et stem:[ML^-3] est aussi la dimension de
      la masse volumique stem:[rho].
  - content: |
      La période stem:[T] d'un pendule de longueur stem:[l] en un endroit où l'accélération
      locale de la pesanteur vaut stem:[g] est
      
      [stem%unnumbered]
      ++++
      T = 2pi sqrt(l/g) quad "ou" quad T = C(g) sqrt(l)
      ++++

      Par conséquent, stem:[dim C(g) = L^{-1//2} "unitsml(T)"].
  id: 1.7-fra
  language_code: fra
  notes:
  - content: Une puissance d'un facteur est le facteur muni d'un exposant. Chaque
      facteur exprime la dimension d'une grandeur de base.
  - content: Par convention, la représentation symbolique de la dimension d'une grandeur
      de base est une lettre majuscule unique en caractère romain (droit) sans empattement.
      Par convention, la représentation symbolique de la dimension d'une {{1.5,grandeur dérivée}}
      est le produit de puissances des dimensions des *grandeurs de base*
      conformément à la définition de la grandeur dérivée. La dimension de la grandeur
      stem:[Q] est notée stem:[dim Q].
  - content: Pour établir la dimension d'une grandeur, on ne tient pas compte du caractère
      scalaire, vectoriel ou tensoriel.
  - content: |
      Dans un système de grandeurs donné,
      - les grandeurs de même {{1.2,nature}} ont la même dimension,
      - des grandeurs de dimensions différentes sont toujours de nature différente,
      - des grandeurs ayant la même dimension ne sont pas nécessairement de même nature.
  - content: |
        Dans l'ISQ, les symboles correspondant aux dimensions des *grandeurs de base* sont:

        [cols="2", options="header,unnumbered"]
        |===
        | Base quantity +
        Grandeur de base
        | Symbol for dimension +
        Symbole de la dimension

        | length +
        longueur
        | stem:[L]

        | mass +
        masse
        | stem:[M]

        | time +
        temps
        | stem:[T]

        | electric current +
        courant électrique
        | stem:[I]

        | thermodynamic temperature +
        température thermodynamique
        | stem:[Theta]

        | amount of substance +
        quantité de matière
        | stem:[N]

        | luminous intensity +
        intensité lumineuse
        | stem:[J]
        |===

        La dimension d'une grandeur stem:[Q] est donc notée
        stem:[dim Q = L^{alpha} M^{beta} T^{gamma} I^{delta} Theta^{epsilon} N^{zeta} J^{eta}]
        où les exposants, appelés exposants dimensionnels, sont positifs, négatifs ou nuls.
  terms:
  - type: expression
    normative_status: preferred
    designation: dimension
  - type: expression
    normative_status: admitted
    designation: dimension d'une grandeur
    grammar_info:
    - gender: f
