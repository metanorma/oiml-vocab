data:
  dates:
  - date: '2012-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: "{{2.26,measurement uncertainty}} where the specified {{2.10,measured quantity value}} is zero"
  examples: []
  id: 4.29-eng
  language_code: eng
  notes:
  - content: Null measurement uncertainty is associated with a null or near zero {{4.1,indication}}
      and covers an interval where one does not know whether the {{2.3,measurand}}
      is too small to be detected or the indication of the {{3.1,measuring instrument}}
      is due only to noise.
  - content: The concept of 'null measurement uncertainty' also applies when a difference
      is obtained between {{2.1,measurement}} of a sample and a blank.
  terms:
  - type: expression
    normative_status: preferred
    designation: null measurement uncertainty
  annotations:
  - content: 'Here "measured quantity value" can be replaced by "measured value" without
      ambiguity: "measurement uncertainty where the specified measured value is zero".'
date_accepted: '2012-01-01T00:00:00+00:00'
entry_status: valid
