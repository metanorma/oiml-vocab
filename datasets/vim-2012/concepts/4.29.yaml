data:
  dates:
  - date: '2012-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: "{{2.26,incertitude de mesure}} lorsque la {{2.10,valeur mesurée}} spécifiée
      est nulle"
  examples: []
  id: 4.29-fra
  language_code: fra
  notes:
  - content: L'incertitude de mesure à zéro est associée à une {{4.1,indication}}
      nulle ou presque nulle et correspond à l'intervalle dans lequel on ne sait pas
      si le {{2.3,mesurande}} est trop petit pour être détecté ou si l'indication
      de l'{{3.1,instrument de mesure}} est due seulement au bruit.
  - content: Le concept d'incertitude de mesure à zéro s'applique aussi lorsqu'une
      différence est obtenue entre le {{2.1,mesurage}} d'un spécimen et un blanc.
  terms:
  - type: expression
    normative_status: preferred
    designation: incertitude de mesure à zéro
date_accepted: '2012-01-01T00:00:00+00:00'
entry_status: valid
