data:
  dates:
  - date: '2012-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: ratio of two {{1.9,measurement units}} for {{1.1,quantities}} of the
      same {{1.2,kind}}
  examples:
  - content: stem:["unitsml(km/m)" = 1000] and thus stem:[1 "unitsml(km)" = 1000 "unitsml(m)"].
  id: 1.24-eng
  language_code: eng
  notes:
  - content: The *measurement units* may belong to different {{1.13,systems of units}}.
    examples:
      - content: stem:["unitsml(h/s)" = 3600] and thus stem:[1 "unitsml(h)" = 3600 "unitsml(s)"].
      - content: stem:["unitsml(km/h)"//"unitsml(m/s)" = (1//3.6)] and thus stem:[1 "unitsml(km/h)" = (1//3.6) "unitsml(m/s)"].
  terms:
  - type: expression
    normative_status: preferred
    designation: conversion factor between units
date_accepted: '2012-01-01T00:00:00+00:00'
entry_status: valid
id: 5ee62870-6569-45d5-bc17-d14e4677a1dc
