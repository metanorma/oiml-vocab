data:
  dates:
  - date: '2012-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: relation d'égalité entre des {{1.1,grandeurs}} d'un {{1.3,système de grandeurs}}
      donné, indépendante des {{1.9,unités de mesure}}
  examples:
  - content: stem:[Q_1 = zeta Q_2 Q_3], où stem:[Q_1], stem:[Q_2] et stem:[Q_3]
      représentent différentes grandeurs et où stem:[zeta] est un facteur numérique.
  - content: stem:[T = (1//2) mv^2], où stem:[T] est l'énergie cinétique et
      stem:[v] la vitesse d'une particule spécifiée de masse stem:[m].
  - content: stem:[n = It//F], où stem:[n] est la quantité de matière d'un composé
      univalent, stem:[I] est le courant électrique et stem:[t] la durée de l'électrolyse,
      et où stem:[F] est la constante de Faraday.
  id: 1.22-fra
  language_code: fra
  notes: []
  terms:
  - type: expression
    normative_status: preferred
    designation: équation aux grandeurs
date_accepted: '2012-01-01T00:00:00+00:00'
entry_status: valid
