data:
  dates:
  - date: '2012-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: set of {{1.19,quantity values}}, bounded by rounded or approximate extreme
      {{4.1,indications}}, obtainable with a particular setting of the controls of
      a {{3.1,measuring instrument}} or {{3.2,measuring system}} and used to designate
      that setting
  examples: []
  id: 4.4-eng
  language_code: eng
  notes:
  - content: A nominal indication interval is usually stated as its smallest and greatest
      *quantity values*, for example "stem:[100 "unitsml(V)"] to stem:[200 "unitsml(V)"]".
  - content: In some fields, the term is "nominal range".
  terms:
  - type: expression
    normative_status: preferred
    designation: nominal indication interval
  - type: expression
    normative_status: admitted
    designation: nominal interval
date_accepted: '2012-01-01T00:00:00+00:00'
