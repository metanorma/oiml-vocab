data:
  dates:
  - date: '2012-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: ensemble des {{1.19,valeurs}} comprises entre deux {{4.1,indications}}
      extrêmes arrondies ou approximatives, que l'on obtient pour une position particulière
      des commandes d'un {{3.1,instrument de mesure}} ou d'un {{3.2,système de mesure}}
      et qui sert à désigner cette position
  examples: []
  id: 4.4-fra
  language_code: fra
  notes:
  - content: Un intervalle nominal des indications est généralement exprimé en donnant
      la plus petite et la plus grande valeur, par exemple «stem:[100 "unitsml(V)"] à
      stem:[200 "unitsml(V)"]».
  - content: Dans certains domaines, le terme anglais est «nominal range».
  terms:
  - type: expression
    normative_status: preferred
    designation: intervalle nominal des indications
  - type: expression
    normative_status: admitted
    designation: intervalle nominal
    grammar_info:
    - gender: m
  - type: expression
    normative_status: admitted
    designation: calibre
    grammar_info:
    - gender: m
