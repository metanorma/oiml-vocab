data:
  dates:
  - date: '2012-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: absolute value of the difference between the extreme {{1.19,quantity values}}
      of a {{4.4,nominal indication interval}}
  examples:
  - content: For a nominal indication interval of −10 V to +10 V, the range of the
      nominal indication interval is 20 V.
  id: 4.5-eng
  language_code: eng
  notes:
  - content: Range of a nominal indication interval is sometimes termed "span of a
      nominal interval".
  terms:
  - type: expression
    normative_status: preferred
    designation: range of a nominal indication interval
  annotations:
  - content: 'Here "quantity values" can be replaced by "values" without ambiguity:
      "absolute value of the difference between the extreme values of a nominal indication
      interval".'
date_accepted: '2012-01-01T00:00:00+00:00'
