data:
  dates:
  - date: '2012-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: valeur absolue de la différence entre les {{1.19,valeurs}} extrêmes d'un
      {{4.4,intervalle nominal des indications}}
  examples:
  - content: Pour un intervalle nominal des indications de –10 V à +10 V, l'étendue
      de mesure est 20 V.
  id: 4.5-fra
  language_code: fra
  notes:
  - content: En anglais, l'étendue de mesure est quelquefois dénommée «span of a nominal
      interval». En français, le terme «intervalle de mesure» est parfois improprement
      employé.
  terms:
  - type: expression
    normative_status: preferred
    designation: étendue de mesure
  - type: expression
    normative_status: admitted
    designation: étendue nominale
    grammar_info:
    - gender: f
