  definition:
  - content: Partie du compteur recevant le signal de sortie du (des) transducteur(s),
      le transformant et, si approprie, mettant en memoire les resultats jusqu'a leur
      utilisation. En plus, le calculateur peut etre capable de communiquer en emission/reception
      avec l'equipement peripherique.
