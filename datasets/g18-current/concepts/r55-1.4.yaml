  definition:
  - content: Grandeur caractéristique indiquant l'espèce (tours de l'arbre d'entraînement
      ou impulsions) et le nombre de signaux que doit recevoir le compteur de distance
      ou le chronotachygraphe pour que la distance indiquée et/ou enregistrée s'accroisse
      de 1 kilomètre.
  examples: []
  id: r55-1.4-fra
  notes:
  - content: La constante k peut être exprimée en tours par kilomètre, tr/km, ou en
      impulsions par kilomètre, imp/km.
