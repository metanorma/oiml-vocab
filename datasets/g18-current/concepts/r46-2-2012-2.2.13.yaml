  definition:
  - content: rapport de la valeur efficace du contenu harmonique sur la valeur efficace
      du terme fondamental
  examples: []
  id: r46-2-2012-2.2.13-fra
  notes:
  - content: Le contenu harmonique est obtenu par exemple en soustrayant d'une grandeur
      alternative non sinusoïdale son terme fondamental.
  - content: Le facteur de distorsion est généralement exprimé en pourcentage. Il
      est équivalent à la DHT, distorsion harmonique totale.
