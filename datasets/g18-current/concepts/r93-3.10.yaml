    type: accepted
  definition:
  - content: Lens bringing a paraxial pencil of parallel rays to two separate line
      foci mutually at right angles and hence unlike a spherical lens, having two
      principal powers.
  examples: []
  id: r93-3.10-eng
  notes:
  - content: One of these powers may be zero, with the corresponding focal line at
      infinity. Lenses referred to as toric lenses, sphero-cylindrical lenses and
      cylinder lenses are all astigmatic.
  sources:
  - origin:
      ref:
        source: OIML R 93:1999
        version: '1999'
    type: authoritative
    locality:
      type: clause
      reference_from: '3.10'
