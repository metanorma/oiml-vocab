data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Verre amenant un faisceau paraxial de rayons parallèles sur deux lignes
      focales séparées perpendiculaires entre elles et donc, à la différence du verre
      sphérique, ayant deux puissances principales.
  examples: []
  id: r93-3.10-fra
  notes:
  - content: L'une de ces puissances peut être nulle, pour une distance focale correspondant
      à l'infini. Les verres référencés en tant que verres toriques, sphérocylindriques
      et cylindriques sont tous des verres astigmatiques.
  sources:
  - origin:
      ref:
        source: OIML R 93:1999
        version: '1999'
    type: authoritative
    locality:
