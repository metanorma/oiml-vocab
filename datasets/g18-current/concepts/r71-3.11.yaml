    type: accepted
  definition:
  - content: Instrument intended to measure automatically and display the level of
      the liquid contained in a tank with respect to a fixed reference.
  - content: An automatic level gauge includes at least a liquid level sensor, a transducer,
      and an indicating device.
  examples: []
  id: r71-3.11-eng
  notes:
  - content: See OIML Recommendation R 85-1/2 for general requirements.
  sources:
