    type: accepted
  definition:
  - content: Gerät zur automatischen Messung und Anzeige des Flüssigkeitsfüllstands
      in einem Behälter, mit Bezug auf einen festen Referenzpunkt.
  - content: Ein automatisches Füllstandsmessgerät umfasst mindestens einen Füllstandssensor,
      einen Aufnehmer und eine Anzeigevorrichtung.
  examples: []
  id: r71-3.11-deu
  notes:
