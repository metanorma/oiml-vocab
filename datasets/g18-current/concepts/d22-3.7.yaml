data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Etendue des concentrations dans laquelle un changement de la concentration
      d'une substance produit une variation détectable du signal de sortie. La limite
      inférieure est fixée par la limite de détction et la limite supérieure par le
      point de saturation du détector. La valeur de l'étendue dynamique s'exprime
      par le rapport de la limite supérieure à la limite inférieure; elle est supérieure
      ou égale à l'étendue linéaire.
  examples: []
  id: d22-3.7-fra
  notes: []
