  definition:
  - content: Dispositif utilisant des sous-ensembles électroniques et réalisant une
      fonction spécifique. Un dispositif électronique est habituellement fabriqué
      en tant qu'unité séparée et doit pouvoir être essayé indépendamment.
  examples: []
  id: r129-2.21-fra
  notes:
  - content: Un dispositif électronique tel que défini ci-dessus, peut être un instrument
      de mesure complet ou une partie d'instrument de mesure.
