  definition:
  - content: Weight value that is achieved when an automatic operation is ended and
      the instrument is completely at rest and balanced, with no disturbances affecting
      the indication.
  examples: []
  id: r107-T.3.4-eng
  notes:
  - content: This definition is only applicable to static weighing and not to dynamic
      weighing.
