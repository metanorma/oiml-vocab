    type: accepted
  definition:
  - content: Deficiencia permitida en la cantidad de producto en un preempacado.
  examples: []
  id: r87-2.1.17-spa
  notes:
  - content: El símbolo "T" se usa para designar la deficiencia tolerable.
  - content: Algunas veces, la deficiencia tolerable se denomina error negativo tolerable,
      límites de error o tolerancias.
  - content: Por convención, T es un número positivo, pero al utilizarlo representa
      un valor negativo de cantidad, o error negativo.
