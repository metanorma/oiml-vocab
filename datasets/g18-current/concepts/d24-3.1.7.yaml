  definition:
  - content: The response time is the time taken by the total radiation pyrometer,
      following an abrupt change $ \Delta T $ of the source temperature to give a
      change $ \eta \Delta T $ in the indication of the pyrometer, where $ \eta $
      is the value given in the pyrometer specification.
