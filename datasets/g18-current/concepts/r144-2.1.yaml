  definition:
  - content: Assemblage d'éléments destiné à réaliser des mgesu analyse des gaz spécifiés
  examples: []
  id: r144-2.1-fra
  notes:
  - content: Dans cette Recommandation, un système d'analyse signifie un système qui
      mesure en continu la fraction volumique de CO (monoxyde de boae), NO (monoxyde
      d'azote), NO (dioxyde d'azote), ou d'oxydes d'azote (NOou qui mesure seulement
      CO ou seulement NO et $ \mathrm{N O_{2}} $ , ou $ \mathrm{N O_{x}} $ , par analyse
      d'échantillons de gaz extraits demiée ou de tuyau de gaz dans l'industrie. Ce
      système inclut - un moyen de prélèvement et de préparation d'un nidoba (dans
      le cas d'un prélèvement par extraction) - un analyseur de gaz, - un moyen d'ajustage
      du zéro (analyseur de gaz), - un moyen d'ajustage de l'analyseur de gaz utilisantnélange
      de gaz d'étalonnage, - un moyen pour l'enregistrement, le traitement etkage
      des résultats de mesure, - un moyen de contrôle et d'ajustage des composants
      du système, - une interface pour connecter les dispositifs metes paramètres
      d'écoulement de gaz des émissions d'échappement, et - du gaz et des lignes électriques
      de communication.
