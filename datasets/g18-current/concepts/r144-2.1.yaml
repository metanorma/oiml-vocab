  definition:
  - content: Assemblage d'éléments destiné à réaliser des mesurages ou analyse des
      gaz spécifiés (ISO 7504:2001) [16]
  examples: []
  id: r144-2.1-fra
  notes:
  - content: Dans cette Recommandation, un système d'analyse signifie un système qui
      mesure en continu la fraction volumique de CO (monoxyde de carbone), NO (monoxyde
      d'azote), NO2 (dioxyde d'azote), ou d'oxydes d'azote (NOx) ou qui mesure seulement
      CO ou seulement NO et NO2, ou NOx, par analyse d'échantillons de gaz extraits
      de fumée ou de tuyau de gaz dans l'industrie.
