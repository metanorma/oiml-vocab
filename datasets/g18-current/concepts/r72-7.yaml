  definition:
  - content: Valeur du débit correspondant à la limite inférieure de l'étendue de
      la charge (débit) ; c'est le débit le plus faible auquel le compteur d'eau chaude
      doit pouvoir fournir des indications qui ne sont pas entachées d'une erreur
      supérieure à l'erreur maximale tolérée.
