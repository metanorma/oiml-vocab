data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: A digital display can be realized as a primary display or as a secondary
      display.
  examples: []
  id: r76-T.2.2.6-eng
  notes:
  - content: 'Primary display: Either incorporated in the indicator housing or in
      the terminal housing or realized as a display in a separate housing (i.e. terminal
      without keys), e.g. for use in combination with a weighing module. Secondary
      display: Additional peripheral device (optional) which repeats the weighing
      result and any other primary indication, or provides further, non-metrological
      information.'
  - content: The terms "primary display" and "secondary display" should not be confused
      with the terms "primary indication" and "secondary indication" (T.1.3.1 and
      T.1.3.2).
  sources:
  - origin:
      ref:
        source: OIML R 76:2006
        version: '2006'
