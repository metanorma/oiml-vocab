    type: accepted
  definition:
  - content: Composant d'un thermometre dont une partie est appliquee a une cavite
      du corps ou un tissu avec lesquels elle etablit un equilibre thermique. Elle
      comprend un capteur de temperature avec les pieces associees y compris les enveloppes,
      joints, fils interieurs et fiche de connexion, le cas echeant.
  examples: []
  id: r114-2.2-fra
  notes:
  - content: Une cavite du corps peut etre le rectum, l'oesophage ou une cavite chirurgicale.
  - content: La partie de la sonde en contact avec une cavite du corps est appelee
      partie appliquee.
