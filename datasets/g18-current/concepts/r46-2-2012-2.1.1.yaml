  definition:
  - content: instrument destiné à mesurer l'énergie électrique en continu par intégration
      de la puissance en fonction du temps et à stocker le résultat
  examples: []
  id: r46-2-2012-2.1.1-fra
  notes:
  - content: Il est admis que "en continu" peut également couvrir les compteurs avec
      un taux d'échantillonnage suffisamment élevé pour satisfaire aux exigences de
      la présente Recommandation.
