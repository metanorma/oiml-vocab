data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Plus petite différence entre indications affichées qui peut être perçue
      de manière significative.
  examples: []
  id: r137-3.2.21-fra
  notes:
  - content: Pour un dispositif numérique, elle constitue le changement de l'indication
      lorsque le moindre chiffre significatif change d'un échelon. Pour un dispositif
      analogique, elle constitue la moitié de la différence entre deux repères chiffrés
      consécutifs.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: résolution (d'un dispositif afficheur)
