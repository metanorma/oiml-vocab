  definition:
  - content: Indication of the weight value of a load on an instrument, with no tare
      or preset tare device in operation.
  examples: []
  id: r51-T.3.2.1-eng
  notes:
  - content: Applies only for instruments that weigh pre-assembled discrete loads
      (see T.1.3) and when the indication has been set to zero before the load has
      been applied to the instrument.
