  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Grandeur caractéristique d'un récipient de forme et de dimensions données,
      pour une position donnée du niveau du liquide par rapport aux électrodes (caractéristique
      géométrique de la cellule).
  examples: []
  id: r56-1.3-fra
  notes:
  - content: La constante de la cellule est calculée suivant la formule K = l/A ou
      K est constante de la cellule, m^-1 ; l est distance entre les électrodes de
      mesure, m ; A est section transversale de la colonne d'électrolyte située entre
      les électrodes, m^2.
  - content: En raison de la complexité d'une détermination précise des caractéristiques
      géométriques de la cellule, sa constante est généralement déterminée suivant
      une méthode indirecte, en utilisant les electrolytes dont est connue la conductivité
      (solutions-étalons).
  - content: En employant cette méthode, la constante de la cellule est calculée suivant
      la formule K = x R ou x est conductivité de la solution-étalon, S/m et R est
      résistance mesurée, Omega.
