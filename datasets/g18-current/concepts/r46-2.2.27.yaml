data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Es la condición de operación establecida para evaluar el desempeño de
      un instrumento o sistema de medición o para comparar resultados de medición
  examples: []
  id: r46-2.2.27-spa
  notes:
  - content: Las condiciones operativas de referencia especifican intervalos de valores
      del mensurando y de las cantidades de influencia.
  - content: En el artículo 311-06-02 de IEC 60050-300, el término "condición de referencia"
      se refiere a una condición operativa bajo la cual la incertidumbre instrumental
      de medición especificada es lo más pequeña posible.
  - content: 'Para la aplicación de esta Recomendación, los términos "instrumento
      de medición" y "sistema de medición" significan: medidor de electricidad.'
  sources:
  - type: authoritative
    origin:
