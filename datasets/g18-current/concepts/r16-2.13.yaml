data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Method, wherein a cuff is placed on the limb and the pressure in the
      cuff is increased until the blood flow in the artery is interrupted and then
      the pressure in the cuff is slowly reduced.
  examples: []
  id: r16-2.13-eng
  notes:
  - content: During the inflation and deflation of the cuff small pressure changes
      (oscillations) occur in the cuff as a result of the arterial blood pressure
      pulses. These oscillations, which first increase and then decrease, are detected
      and stored together with the corresponding cuff pressure values in the measurement
      system. With these stored values the systolic, diastolic and mean arterial blood
      pressure values can be mathematically derived using an appropriate algorithm.
      It is possible to carry out the measurement during the inflation phase.
  sources:
  - origin:
      ref:
        source: OIML R 16-2:2002
        version: '2002'
    locality:
      type: clause
      reference_from: '2.13'
    type: authoritative
  terms:
  - type: expression
    normative_status: preferred
    designation: Oscillometric method
  language_code: eng
