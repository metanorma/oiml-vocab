data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: La capacité correspondant à un trait repère est égale au volume d'eau
      à la température de référence, délivré par la pipette à cette température lorsqu'on
      la vide de la manière spécifiée en annexe (point A.3.) après l'avoir remplie
      jusqu'à ce trait repère.
  examples: []
  id: r40-2.1-fra
  notes:
  - content: le ménisque formé par l'eau dans la pipette doit être ajusté de telle
      manière que le plan horizontal passant par le bord supérieur du trait repère
      soit tangent au ménisque en son point le plus bas, la visée se faisant dans
      ce plan.
  sources:
  - origin:
      ref:
        source: OIML R 40:1981
        version: '1981'
