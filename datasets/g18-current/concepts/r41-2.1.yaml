    type: accepted
  definition:
  - content: La capacité correspondant à un trait repère est egale au volume d'eau,
      à la température de référence, délivré par la burette à cette température, quand
      on la vide depuis le trait zéro jusqu'à ce trait repère, l'écoulement se faisant
      librement jusqu'à l'ajustage du ménisque à ce trait, aucun délai n'étant accordé
      pour le drainage du liquide adhérant aux parois avant l'ajustage final.
  examples: []
  id: r41-2.1-fra
  notes:
  - content: le ménisque formé par l'eau dans la burette doit être ajusté de telle
      manière que le plan horizontal passant par le bord supérieur du trait repère
      soit tangent au ménisque en sont point le plus bas, la visée se faisant dans
      ce plan.
  sources:
