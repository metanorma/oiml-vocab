  - content: association of metering calculator and operational calculator
  examples: []
  id: r139-3.2.4-eng
  notes:
  - content: The metering calculator and the operational calculator may be two separate
      elements or they may form a single unit. Only where there is a particular need
      to dissociate the two kinds of calculators is the association of both functions
      called the calculator in this Recommendation.
