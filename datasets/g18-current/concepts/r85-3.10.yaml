    type: accepted
  definition:
  - content: Facility incorporated in an electronic automatic level gauge that enables
      significant faults, incorrect functioning of a specific device of the ALG, and/or
      disturbed communication between specific devices of the ALG to be detected and
      acted upon.
  examples: []
  id: r85-3.10-eng
  notes:
  - content: '"Acted upon" refers to any adequate response by the ALG (luminous signal,
      acoustic signal, prevention of the measurement process, etc.).'
