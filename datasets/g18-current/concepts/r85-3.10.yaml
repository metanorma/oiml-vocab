    type: accepted
  definition:
  - content: Système intégré à un JA électronique permettant de détecter et de mettre
      en évidence les défauts significatifs, ou le fonctionnement incorrect d'un dispositif
      spécifique du JA, ou la communication perturbée entre deux dispositifs spécifiques
      du JA.
  examples: []
  id: r85-3.10-fra
  notes:
  - content: '"Mettre en évidence" fait référence à toute réponse appropriée du JA
      (signal lumineux, signal sonore, protection du processus de mesurage, etc.).'
  sources:
  - origin:
      ref:
        source: OIML R 85:2008
        version: '2008'
