  definition:
  - content: equipment (including, but not limited to, measuring instruments, software,
      measurement standards, reference materials, reference data, reagents, consumables
      or auxiliary apparatus) that is required for the correct performance of laboratory
      activities and that can influence the results
  examples: []
  id: d10-3.17-eng
  notes:
  - content: In the context of this Document, a measuring instrument is a component
      of the measuring equipment which plays an important role for measurement.
  - content: In the context of this Document, measuring equipment may be considered
      as being equivalent to measuring system.
