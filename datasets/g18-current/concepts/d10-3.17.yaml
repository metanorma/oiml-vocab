data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: equipo (incluye, entre otros, instrumentos de medición, software, patrones
      de medición, materiales de referencia, datos de referencia, reactivos, consumibles
      o aparatos auxiliares) que es requerido para el correcto funcionamiento de las
      actividades del laboratorio y que pueden influenciar los resultados
  examples: []
  id: d10-3.17-spa
  notes:
  - content: En el contexto de este Documento, un instrumento de medición es una componente
      del equipo de medición que juega un importante papel en la medición. Algunos
      instrumentos de medición pueden der utilizados independientes para completar
      un proceso de medición o realizar una magnitud física.
  - content: En el contexto de este Documento, un equipo de medición puede ser considerado
      como un equivalente a sistema de medición.
