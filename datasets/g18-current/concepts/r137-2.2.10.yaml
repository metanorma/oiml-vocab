  definition:
  - content: Difference between the error of indication and the intrinsic error of
      a measuring system or of its constituent elements.
  examples: []
  id: r137-2.2.10-eng
  notes:
  - content: In practice this is the difference between the error of the meter observed
      during or after a test, and the error of the meter prior to this test, performed
      under reference conditions.
