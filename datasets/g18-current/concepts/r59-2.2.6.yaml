    type: accepted
  definition:
  - content: network of arbitrary participants (electronic devices with arbitrary
      functions) where the number, identity and location of a participant can be dynamic
      and unknown to the other participants
  examples: []
  id: r59-2.2.6-eng
  notes:
  - content: This is in contrast to a closed network which is a network of a fixed
      number of participants with a known identity functionality and location.
  - content: 'Source citation: OIML D 31, 3.1.35'
