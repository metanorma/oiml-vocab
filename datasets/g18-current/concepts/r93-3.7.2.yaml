data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Inverse de la valeur paraxiale de la distance frontale avant mesurée
      en mètres.
  examples: []
  id: r93-3.7.2-fra
  notes:
  - content: L'unité pour exprimer la puissance frontale est le mètre réciproque (m^-1).
      Le nom de cette unité est la "dioptrie" dont le symbole est D.
  - content: Par convention, la puissance frontale arrière, en dioptries, est spécifiée
      comme la "puissance" d'un verre de lunettes, bien que la puissance frontale
      avant soit requise dans certains cas (par exemple pour la mesure de certains
      verres multifocaux).
  sources:
