  definition:
  - content: Materiau a l'interieur de la colonne, auquel est liee la phase stationnaire
      (y compris le materiau de remplissage) et par lequel s'ecoule la phase mobile.
      Idealement le materiau devrait etre inerte. Le support solide peut etre caracterise
      par le diametre dp d'une particule, mesure en um.
