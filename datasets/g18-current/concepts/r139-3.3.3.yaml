data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: operating mode of a self-service arrangement in which the supplier is
      present and controls the authorization for the delivery
  examples: []
  id: r139-3.3.3-eng
  notes:
  - content: In attended service mode, the settlement of the transaction takes place
      before the customer leaves the site of the delivery.
  - content: A transaction is settled when the parties interested in the transaction
      have made their agreement known (explicitly or implicitly) as regards the amount
      of the transaction. This may be a payment, signing a credit card voucher, signing
      a delivery order, etc.
  - content: The parties interested in a transaction may be the parties themselves
      or their representatives (for example the employee in a filling station or the
      driver of a truck).
  - content: In attended service mode the measurement operation ends at the moment
      settlement of the transaction takes place.
