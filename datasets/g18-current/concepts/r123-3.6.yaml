    type: accepted
  definition:
  - content: Parametre utilise pour evaluer la capacite d'un detecteur a distinguer
      deux pics adjacents d'energie produits a partir d'elements d'un echantillon.
  examples: []
  id: r123-3.6-fra
  notes:
  - content: Dans cette Recommandation, elle est exprimee comme la largeur totale
      a la moitie de la hauteur maximale du niveau K-alpha du manganese (5,9 keV)
      en unites d'energie ou en pourcentage par rapport a l'energie du pic.
