data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: parámetro no negativo que caracteriza la dispersion de los valores atribuidos
      a un mensurando, a partir de la información que se utiliza
  examples: []
  id: d10-3.16-spa
  notes:
  - content: La incertidumbre de medición incluye componentes procedentes de efectos
      sistemáticos, tales como componentes asociadas a correcciones y a valores asignados
      a patrones, así como la incertidumbre debida a la definición. Algunas veces
      no se corrigen los efectos sistemáticos estimados y en su lugar se tratan como
      componentes de incertidumbre.
  - content: El parámetro puede ser, por ejemplo, una desviación típica, en cuyo caso
      se denomina incertidumbre típica de medición (o un múltiplo de ella), o una
      semiamplitud con una probabilidad de cobertura determinada.
  - content: En general, la incertidumbre de medición incluye numerosas componentes.
      Algunas pueden calcularse mediante una evaluación tipo A de la incertidumbre
      de medición, a partir de la distribución estadística de los valores que proceden
      de las series de mediciones y pueden caracterizarse por desviaciones típicas.
      Las otras componentes, que pueden calcularse mediante una evaluación tipo B
      de la incertidumbre de medición, pueden caracterizarse también por desviaciones
      típicas, evaluadas a partir de funciones de densidad de probabilidad basadas
      en la experiencia u otra información.
  - content: En general, para una información dada, se sobrentiende que la incertidumbre
      de medición está asociada a un valor determinado atribuido al mensurando. Por
      tanto, una modificación de este valor supone una modificación de la incertidumbre
      asociada.
