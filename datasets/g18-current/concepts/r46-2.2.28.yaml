  - content: Clase de instrumentos o sistemas de medición que cumplen con los requisitos
      metrológicos mencionados y que están diseñados para mantener los errores de
      medición o incertidumbres instrumentales de medición dentro de los límites específicados
      bajo condiciones operativas específicas.
