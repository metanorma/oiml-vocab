  definition:
  - content: body officially appointed at national or some other level of government
      to be responsible for ensuring that requirements for subsequent verification
      are adhered to. It may carry out the verification function itself or, according
      to legislative requirements, appoint other verification bodies to carry out
      the verification function on its behalf
