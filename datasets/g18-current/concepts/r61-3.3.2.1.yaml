  - content: identifizierbare Waage oder Teil einer Waage oder einer Familie von Waagen,
      die/der eine oder mehrere bestimmte Funktion(en) ausführt
  examples: []
  id: r61-3.3.2.1-deu
  notes:
  - content: Eine Einrichtung kann ein eigenständiges und vollständiges Messgerät
      darstellen (z. B. eine Tischwaage, Elektrizitätszähler) oder kann ein Teil eines
      Messgeräts sein (z. B. Drucker, Auswertegerät).
