    type: accepted
  definition:
  - content: transaction for which the use of the EVSE is limited to a single user
      who has concluded in advance a written agreement, or entered into a longer-lasting
      commercial relationship with the operator of that recharging point or with a
      charging network service provider. In this type of transaction, charges may
      be made based on the total energy consumed over an extended billing period
