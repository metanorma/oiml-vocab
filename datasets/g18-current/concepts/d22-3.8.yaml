  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Emplacement contenant des déchets chimiques dangereux pouvant affecter
      une zone avoisinante plus importante. Cette définition s'applique aussi bien
      à un site où l'on déverse des déchets dangereux sans contrôle qu'à une décharge
      autorisée ou à un lieu où des produits chimiques toxiques ou dangereux ont été
      repandus ou ont pris feu.
