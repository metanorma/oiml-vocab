    type: accepted
  definition:
  - content: fluide introduit dans le préemballage avec le produit, soit séparé de,
      dans ou autour du produit et destiné à être laissé après utilisation du produit,
      excepté pour les éléments faisant naturellement partie du produit
  examples: []
  id: r87-2.1.5-fra
  notes:
  - content: Dans le cadre de la présente Recommandation, un fluide inclut soit un
      liquide, un semi-liquide ou liquide congelé ou un gaz ou un mélange de gaz,
      sous pression positive, négative ou atmosphérique ou une combinaison de ceux-ci.
  - content: Le terme « utilisation » comprend la consommation.
  - content: Un milieu est parfois appelé « milieu d'emballage liquide ».
