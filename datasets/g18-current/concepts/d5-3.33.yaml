data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: laboratory of an authorised institute responsible for a legal control
      of measuring instruments, e.g. type approval, verification, etc.
  examples: []
  id: d5-3.33-eng
  notes:
  - content: The recommended role of such an institute is described in detail in OIML
      D 1:2012 3.2.2.3.
  - content: Legal metrology laboratories are generally laboratories of the state
      legal metrology services or private metrology laboratories charged (authorised)
      by the national (legal) metrology authority to carry out legal control of measuring
      instruments within a defined scope.
