  - content: Un fallo que excede el valor del fallo limite aplicable.
  examples: []
  id: r46-2.2.31-spa
  notes:
  - content: 'Los siguientes también son considerados como fallos significativos:
      un cambio mayo que el valor crítico de cambio (ver 3.3.6.2) ha ocurrido en los
      registros de medición debido a perturbaciones; la funcionalidad del medidor
      se ha visto afectada.'
