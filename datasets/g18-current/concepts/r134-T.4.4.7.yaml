data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: 'Défaut supérieur à 1 d. Les défauts suivants ne sont pas considérés
      comme significatifs: défauts provenant de causes simultanées et mutuellement
      indépendantes dans l''instrument ou dans son système de contrôle; défauts rendant
      impossible l''accomplissement de toute mesure; défauts transitoires constitués
      de variations momentanées des indications qui ne peuvent être interprétées,
      mémorisées ou transmises comme un résultat de mesure; défauts si importants
      qu''ils ne peuvent manquer d''être remarqués par tous ceux qui sont intéressés
      par la mesure.'
