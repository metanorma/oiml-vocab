  definition:
  - content: incident that has an undesirable impact on the compliance of the measuring
      instrument or a fault
  examples: []
  id: d31-3.2.55-eng
  notes:
  - content: 'Examples of significant defect include: a) deletion of the audit trail;
      b) inadmissible parameter changes; c) unauthorised updates; d) accidental software
      changes due to physical effects; e) a significant fault due to the effect of
      an influence quantity.'
