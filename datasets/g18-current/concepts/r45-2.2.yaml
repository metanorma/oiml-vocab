data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: The conventional true capacity of a cask, is the volume occupied by the
      liquid at a reference temperature of 20 degrees C, when the container is completely
      filled to the lower edge of the bung hole (filling orifice).
  examples: []
  id: r45-2.2-eng
  notes:
  - content: If the bung hole is extended by parts projecting into the container,
      the upper edge of the vents or holes which must be made in these parts, to comply
      with point 6.6, must be taken as the lower edge of the bung hole.
  sources:
  - origin:
      ref:
        source: OIML R 45:1980
        version: '1980'
    type: authoritative
    locality:
