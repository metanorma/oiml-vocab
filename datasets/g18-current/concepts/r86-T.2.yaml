  definition:
  - content: A volume meter comprising several movable measuring chambers connected
      to form a rotating drum. The measurement is made by successively filling and
      emptying the chambers, the indication of the indicating device advancing each
      time by an amount equal to the volume of one measuring chamber.
  examples: []
