  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: device such as defined in 2.1.1, but for which the basic metrology is
      provided by a separately type approved meter which has been tested for compliance
      with a recognised metering standard with equal or more stringent requirements
  examples: []
  id: g22-2.1.2-eng
  notes:
  - content: For EVSE with embedded metrology, the metrology is an integral part of
      the EVSE. In this case, separate type approval of the embedded metering functionality
      is not required, since it will be tested as part of the EVSE type approval process.
