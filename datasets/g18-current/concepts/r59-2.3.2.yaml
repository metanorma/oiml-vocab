data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: algebraic mean of error shift values calculated from samples of the same
      grain type with different moisture levels. The resulting 'average' value is
      indicative of the average variation over the encompassed measurement range,
      as opposed to the variation in measured values at one point of the range
  examples: []
  id: r59-2.3.2-eng
  notes:
  - content: In this Recommendation, reference to a resulting 'mean' value is reserved
      for the mean of replicated measurements, i.e. the mean of measured values on
      the same test sample (usually taken under repeatability conditions).
  sources:
  - origin:
      ref:
        source: OIML R 59:2016
        version: '2016'
    locality:
