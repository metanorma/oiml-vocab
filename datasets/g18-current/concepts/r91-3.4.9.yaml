data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: measurement error due to a measurement angle which differs from the configured
      value, the nominal value or the value measured by the instrument
  examples: []
  id: r91-3.4.9-eng
  notes:
  - content: The name of this term comes from the fact that the component of the velocity
      vector parallel to the line connecting the speed meter and the vehicle is given
      by $ \mathrm{v_{m}}=\mathrm{v}\cdot\cos(\alpha) $, where the measurement angle
      $ \alpha $ has in general a horizontal and a vertical component.
  sources:
  - origin:
      ref:
        source: OIML R 91-1:2025
