  definition:
  - content: point at which one electric vehicle is connected to the fixed installation
  examples: []
  id: g22-2.2.1-eng
  notes:
  - content: If the output cable is a fixed part of the charging system, this point
      is defined as the connector at the end of the cable. Otherwise, the connection
      point is defined as the point of the charging system at which the cable is plugged
      in.
