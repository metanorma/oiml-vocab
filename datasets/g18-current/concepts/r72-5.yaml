  definition:
  - content: The flowrate value which is defined as half the value of the maximum
      flowrate.
  - content: At the nominal flowrate the hot water meter should be able to function
      in normal use, that is under continuous and intermittent conditions, without
      exceeding the maximum permissible errors.
