  definition:
  - content: Valeur du débit définie comme la moitié du débit maximal.
  - content: Au débit nominal, le compteur d'eau chaude doit pouvoir fonctionner en
      usage normal, c'est-à-dire de manière continue et intermittente, sans que les
      erreurs maximales tolérées soient dépassées.
