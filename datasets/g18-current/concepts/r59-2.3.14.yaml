    type: accepted
  definition:
  - content: fault greater than the value specified in this Recommendation
  examples: []
  id: r59-2.3.14-eng
  notes:
  - content: See 4.4.1.
  - content: The relevant Recommendation may specify that the following faults are
      not significant, even when they exceed the value defined in 4.4.1 - (a) faults
      arising from simultaneous and mutually independent causes originating in a measuring
      instrument or in its checking facilities; (b) faults implying the impossibility
      to perform any measurement; (c) transitory faults being momentary variations
      in the indication, which cannot be interpreted, memorized or transmitted as
      a measurement result; (d) faults giving rise to variations in the measurement
      result that are serious enough to be noticed by all those interested in the
      measurement result.
  sources: []
