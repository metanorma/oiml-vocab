  definition:
  - content: influence quantity (3.4.1) having a value within the limits specified
      in this part of ISO 4064|OIML R 49, but outside the specified rated operating
      condition(s) (3.4.4) of the meter
  examples: []
  id: r49-3.4.3-eng
  notes:
  - content: An influence quantity is a disturbance if the rated operating conditions
      for that influence quantity are not specified.
  - content: 'Source citation: OIML D 11:2013, 3.15.2, modified - "this part of ISO
      4064|OIML R 49" replaces "the applicable International Recommendation"; "meter"
      replaces "measuring instrument"; original notes removed; "Note 1" added.'
