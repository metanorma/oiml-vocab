  definition:
  - content: Valeur du débit, située entre le débit minimal et le débit maximal, à
      laquelle l'étendue de la charge se divise en deux zones, dites « zone supérieure
      » et « zone inférieure », chacune caractérisée par la valeur de l'erreur maximale
      tolérée dans cette zone.
