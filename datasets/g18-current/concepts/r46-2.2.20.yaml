data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Valor extremo del cambio en el error de indicación de un medidor, permitido
      por esta Recomendación, cuando se toma un único factor de influencia de su valor
      a condiciones de referencia y cambia dentro de las condiciones nominales de
      operación.
  examples: []
  id: r46-2.2.20-spa
  notes:
  - content: Hay un cambio en el error máximo permitido correspondiente para cada
      factor de influencia.
  - content: En esta Recomendación, el error máximo permitido es una combinación del
      error máximo permitido base y el cambio en el error máximo permitido, según
      se describe en el Anexo B.
  sources:
  - origin:
      ref:
        source: OIML R 46-1:2012
        version: '2012'
    locality:
      type: clause
      reference_from: 2.2.20
    type: authoritative
