  definition:
  - content: Legally relevant parameter with a value that depends on the type of instrument
      only. Type-specific parameters are part of the legally relevant software. They
      are fixed at type approval of the instrument.
  examples: []
  id: r51-T.2.7.8.2-eng
  notes:
  - content: 'Examples of type-specific parameters are: parameters used for mass calculation,
      stability analysis or price calculation and rounding, software identification.'
