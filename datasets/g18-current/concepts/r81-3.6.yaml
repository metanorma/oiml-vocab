    type: accepted
  definition:
  - content: Partie du compteur transformant le debit du liquide a mesurer en un signal
      (des signaux) envoye(s) au calculateur. Il peut soit etre autonome, soit utiliser
      une source d'alimentation electrique exterieure.
  examples: []
  id: r81-3.6-fra
  notes:
  - content: Pour les besoins de la presente Recommendation, le transducteur de mesure
      inclut le capteur de debit ou de volume.
