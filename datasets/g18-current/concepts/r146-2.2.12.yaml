  definition:
  - content: network of arbitrary participants (electronic devices with arbitrary
      functions)
  examples: []
  id: r146-2.2.12-eng
  notes:
  - content: The number, identity and location of a participant can be dynamic and
      unknown to the other participants. This is in contrast to a closed network [OIML
      D 31:2008, 3.1.6] which is a network of a fixed number of participants with
      a known identity functionality and location.
