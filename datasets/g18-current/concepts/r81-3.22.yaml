    type: accepted
  definition:
  - content: Estimation caracterisant l'etendue de valeurs dans laquelle se tient
      la valeur vraie d'une erreur, y compris les composantes dues a l'etalon et a
      son utilisation, et les composantes dues a l'instrument verifie ou etalonne.
  examples: []
  id: r81-3.22-fra
  notes:
  - content: Les composantes dues a un compteur verifie ou etalonne sont notamment
      liees a la resolution de son dispositif indicateur et a la variation periodique.
  sources:
  - origin:
      ref:
