  definition:
  - content: Somme de toutes les charges par essieu dans un groupe d'essieux défini;
      une fraction de la masse du véhicule imposée pour le groupe d'essieux au moment
      de la pesée.
  examples: []
  id: r134-T.3.1.11-fra
  notes:
  - content: Les critères de définition de divers groupes d'essieux peuvent être établis
      par des réglementations nationales.
