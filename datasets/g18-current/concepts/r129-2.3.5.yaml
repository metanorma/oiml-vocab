data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Differenz zwischen der Abweichung der Anzeige und der Eigenabweichung
      eines Messgeräts
  examples: []
  id: r129-2.3.5-deu
  notes:
  - content: Ein Fehler ist hauptsächlich das Ergebnis einer unerwünschten Änderung
      von Daten, die in einem elektronischen Messgerät enthalten sind oder durch ein
      solches Messgerät geleitet werden.
  - content: Aus der Definition folgt, dass ein "Fehler" ein numerischer Wert ist,
      der entweder in einer Maßeinheit oder als Relativwert, z. B. als Prozentsatz,
      ausgedrückt wird.
  sources: []
