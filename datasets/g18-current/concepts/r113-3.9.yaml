data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Plus petite quantite d'un composant de l'echantillon qui produit un signal
      de sortie du detecteur trois fois superieur au bruit a court terme.
  examples: []
  id: r113-3.9-fra
  notes:
  - content: Ce terme est aussi appele "detectabilite minimale" ou "limite minimale
      detectable (MDL)" dans les references et la litterature des constructeurs. La
      limite de detection est parfois definie comme un signal de sortie egal a un
      autre multiple (par exemple deux ou dix) du niveau de bruit et peut dependre
      si le chromatographe en phase gazeuse est utilise pour l'analyse quantitative
      ou qualitative [1].
  sources:
