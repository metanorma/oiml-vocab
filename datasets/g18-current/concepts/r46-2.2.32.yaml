data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Es el dispositivo que se incorpora a un instrumento de medición y que
      permite detectar fallos significativos y actuar sobre los mismos.
  examples: []
  id: r46-2.2.32-spa
  notes:
  - content: '"Actuar sobre los mismos" se refiere a cualquier respuesta adecuada
      por el instrumento de medición (señal lumínica, señal acústica, prevención del
      proceso de medición, etc.).'
  - content: 'Para su aplicación en esta Recomendación, el término "instrumento de
      medición" significa: medidor de electricidad y la acción que sigue a la detección
      de un fallo significativo debería bien sea detener la medición y registrar la
      hora y duración de la detención, o registrar la hora y la duración del fallo
      y la cantidad de energía medida durante el fallo.'
  - content: Los fallos que se detecten y generen acciones por un dispositivo de verificación
      no serán considerados fallos significativos.
  sources:
  - type: authoritative
    origin:
      ref:
        source: OIML V 1:2013
