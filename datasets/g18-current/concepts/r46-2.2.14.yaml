  - content: Relación entre la energía activa y la energía aparente.
  examples: []
  id: r46-2.2.14-spa
  notes:
  - content: Bajo condiciones sinusoidales y de una fase o simétricas de tres fases,
      el factor de energía = cos Phi = el coseno de la diferencia de fases Phi entre
      el voltaje U y la corriente I.
