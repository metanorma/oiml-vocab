  definition:
  - content: ratio of the active power to the apparent power
  examples: []
  id: r46-2.2.14-eng
  notes:
  - content: At sinusoidal and either one-phase or symmetrical three-phase conditions,
      the power factor = cos Phi = the cosine of the phase difference Phi between
      voltage U and current I.
