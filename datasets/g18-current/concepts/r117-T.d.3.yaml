    type: accepted
  definition:
  - content: influence quantity having a value outside the specified rated operating
      conditions of the measuring system (for electronic measuring systems only)
  examples: []
  id: r117-T.d.3-eng
  notes:
  - content: If the rated operating conditions are not specified for an influence
      quantity, it is a disturbance.
  - content: A systematic influence by design or by installation (e.g. systematic
      air inlet) cannot be considered as a disturbance.
