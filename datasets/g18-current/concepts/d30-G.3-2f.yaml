  definition:
  - content: report issued by a test laboratory that includes the results of the tests
      and examinations it carried out on the basis of the relevant OIML Recommendation
      during OIML type evaluation on identified sample(s) of a given type of measuring
      instrument or module
  examples: []
  id: d30-G.3-2f-eng
  notes:
  - content: Unless the OIML Recommendation states otherwise, several test reports
      may be issued if several test laboratories are involved in covering all of the
      tests and examinations specified in the relevant OIML Recommendation.
