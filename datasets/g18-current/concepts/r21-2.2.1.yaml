  definition:
  - content: Dans cette recommandation, le terme «dispositif» est utilisé pour tout
      moyen par lequel une fonction spécifique est effectuée indépendamment de la
      réalisation physique, par exemple par un mécanisme ou une clé de lancement d'une
      opération. Le dispositif peut être une petite partie ou une partie importante
      d'un instrument.
