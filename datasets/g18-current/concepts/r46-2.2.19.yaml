  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: extreme value of the error of indication of a meter, permitted by this
      Recommendation, when the current and power factor are varied within the intervals
      given by the rated operating conditions, and when the meter is otherwise operated
      at reference conditions
  examples: []
  id: r46-2.2.19-eng
  notes:
  - content: In this Recommendation, the maximum permissible error is a combination
      of the base maximum permissible error and the maximum permissible error shift
      as described in Annex B.
  sources:
  - origin:
      ref:
        source: OIML R 46:2012
        version: '2012'
    locality:
      type: clause
      reference_from: 2.2.19
    type: authoritative
  terms:
  - type: expression
    normative_status: preferred
    designation: base maximum permissible error
  language_code: eng
