data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: rate at which energy is transported
  examples: []
  id: r46-2.2.15-eng
  notes:
  - content: 'In an electrical system active power is measured as the time mean of
      the instantaneous power, which is calculated at each instant as the product
      of voltage and current: p(t) = u(t) . i(t), where u is the instantaneous voltage,
      i is the instantaneous current, p is the instantaneous power. At sinusoidal
      conditions active power is the product of the r.m.s. values of current and voltage
      and the cosine of the phase angle between them, calculated for each phase. It
      is usually expressed in kW.'
  sources:
  - origin:
      ref:
        source: OIML R 46:2012
        version: '2012'
    locality:
      type: clause
      reference_from: 2.2.15
    type: authoritative
  terms:
