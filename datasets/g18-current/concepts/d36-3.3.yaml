  definition:
  - content: contact sensor or a non-contact (optical or mechanical) sensor that is
      used to detect the position of the displacer
  examples: []
  id: d36-3.3-eng
  notes:
  - content: A mechanical detector using a cantilever is often employed in certain
      pipe provers. The lever is pushed by the displacer and actuates an electrical
      switch installed outside the pipe wall. A linear encoder is used for a piston
      prover to transmit a pulse signal that is proportional to the displacement of
      the displacer.
