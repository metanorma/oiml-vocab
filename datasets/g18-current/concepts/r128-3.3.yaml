  definition:
  - content: Les ergomètres à pédalier avec couple de freinage contrôle sont des ergomètres
      dont le couple de freinage est indépendant de la fréquence de rotation. La puissance
      délivrée au niveau de l'axe du pédalier est proportionnelle à la fréquence de
      rotation.
