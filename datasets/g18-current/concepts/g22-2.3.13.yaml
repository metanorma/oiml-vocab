  definition:
  - content: rate at which energy is transported. Instantaneous power is the product
      of voltage and current at each instance of time $ p (t) = u (t) \cdot i (t)
      $ where u(t) is the instantaneous voltage, i(t) is the instantaneous current,
      p(t) is the instantaneous power, t is time
