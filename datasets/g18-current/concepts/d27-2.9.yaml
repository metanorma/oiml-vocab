data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Besoin ou attente formulés, habituellement implicites, ou imposés.
  examples: []
  id: d27-2.9-fra
  notes:
  - content: '"Habituellement implicite" signifie qu''il est d''usage ou de pratique
      courante pour l''organisme, ses clients et les autres parties intéressées de
      considérer le besoin ou l''attente en question comme implicite.'
  - content: Un qualificatif peut être utilisé pour désigner un type spécifique d'exigence,
      par exemple exigence relative au produit, exigence relative au management de
      la qualité, exigence du client.
  - content: Une exigence spécifiée est une exigence qui est formulée, par exemple
      dans un document.
  - content: Les exigences peuvent provenir de différentes parties intéressées.
  - content: 'Source citation: ISO 900 0'
