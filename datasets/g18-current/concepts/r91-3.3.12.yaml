  id: r91-3.3.12-eng
  notes:
  - content: Hash algorithms are designed to be collision-resistant, meaning that
      there is a very low probability that the same string would be created for different
      data.
  - content: Hash algorithms are used for software identification, authentication
      of measurements, protection of settings etc.
  - content: Typical hash algorithms are SHA-2 (256-bit hash) or stronger.
