  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Concordance entre les resultats de mesurages consecutifs de la meme grandeur
      de mesure effectues dans les memes conditions et dans une periode de temps relativement
      courte.
  examples: []
  id: r112-2.15-fra
  notes:
  - content: 'Il convient de comprendre le terme "les memes conditions" comme incluant:
      la methode de mesurage, l''operateur, l''instrument de mesure, le lieu et les
      conditions d''environnement.'
