  definition:
  - content: Couche de matière électriquement non conductrice et servant de support
      à la grille. Les deux principales fonctions du support sont de permettre le
      collage de l'extensomètre sur la structure et de servir d'isolant électrique
      lorsque la structure est conductrice.
