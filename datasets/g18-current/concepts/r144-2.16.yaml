  definition:
  - content: différence entre l'erreur d'indication et l'erreur intrinsèque d'un instrument
      de mesure (VIML 2012 (V 1), 5.11 [25])
  examples: []
  id: r144-2.16-fra
  notes:
  - content: Les erreurs aléatoires présentant des variations dans l'indication, mais
      qui ne peuvent pas être interprétées, enregistrées ou transmises comme résultats
      de mesure sont considérés comme des défauts non significatifs.
