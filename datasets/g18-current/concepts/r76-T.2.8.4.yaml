  definition:
  - content: Legally relevant parameter with a value that depends on the individual
      instrument. Device-specific parameters comprise calibration parameters (e.g.
      span adjustment or other adjustments or corrections) and configuration parameters
      (e.g. maximum capacity, minimum capacity, units of measurement, etc.). They
      are adjustable or selectable only in a special operational mode of the instrument.
      Device-specific parameters may be classified as those that should be secured
      (unalterable) and those that may be accessed (settable parameters) by an authorized
      person.
