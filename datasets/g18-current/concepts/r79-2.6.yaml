data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: everything of the prepackage that is intended to be left over after use
      of the product, except for items naturally in the product
  examples: []
  id: r79-2.6-eng
  notes:
  - content: The term "use" would include consumption.
  - content: Packing material is generally used to contain, protect, handle (e.g.
      lollipop stick), deliver, preserve (e.g. ice or glazing), transport, inform
      about and serve as an aid (e.g. food serving tray) while the product it contains
      is being used.
  - content: Packing material also includes the container, ice (not naturally in the
      product, e.g. glazing), solid items that were put in the prepackage together
      with the product such as wrappers, lollipop sticks, wax around cheese, and a
      medium that was put in the prepackage together with the product and that is
      intended to be left over after use of the product.
  - content: Packing material is sometimes referred to as individual package, tare,
      packaging, packaging material.
  sources:
