data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Fluido que se coloca en el preempacado junto con el producto, ya sea
      separado de él o rodeándolo, y que está previsto para ser desechado después
      del uso del producto, excepto en el caso de elementos que se encuentran de forma
      natural en el producto.
  examples: []
  id: r79-2.2-spa
  notes:
  - content: 'Para el propósito de esta Recomendación, ''fluido'' incluye: a) cualquier
      líquido, semilíquido o líquido congelado, o b) un gas o una mezcla de gases
      a presión atmosférica o por encima o debajo de ella, o c) una combinación de
      a) y b).'
  - content: El término "uso" incluye el consumo.
  - content: Un medio se denomina algunas veces "medio de empaque líquido".
  - content: Un medio puede estar separado del producto y de otros elementos sólidos
      que fueron colocados en el preempacado usando los procedimientos de medición
      de la OIML R 87 [1].
  - content: 'Un medio también incluye: a) Los medios líquidos, como se especifica
      en el numeral 4.3.3 de la norma CODEX STAN 1-1985 Labelling of prepackaged foods
      [2], que trata sobre alimentos en los que se debe marcar el "peso escurrido"
      y b) el glaseado con hielo, como se especifica en las normas CODEX sobre alimentos
      con glaseado con hielo.'
  sources:
