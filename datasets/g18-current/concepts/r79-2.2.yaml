data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: fluid that is put in the prepackage together with the product, either
      separated from, in or surrounding the product, and that is intended to be left
      over after use of the product, except for items naturally in the product
  examples: []
  id: r79-2.2-eng
  notes:
  - content: For the purpose of this Recommendation 'fluid' includes a) either liquid,
      semi-liquid or frozen liquids, or b) a gas or a mixture of gasses, whether below,
      at or above atmospheric pressure, or c) a combination of both a) and b).
  - content: The term "use" would include consumption.
  - content: A medium is sometimes also referred to as "liquid packing medium".
  - content: A medium can be separated from the product and other solid items that
      were put in the prepackage by measuring procedures in OIML R 87 [1].
  - content: 'A medium also includes: a) the liquid mediums as specified in 4.3.3
      of the CODEX STAN 1-1985 Labelling of prepackaged foods [2] which covers foods
      on which the "drained weight" must be marked, and b) the ice-glaze as specified
      in CODEX standards on ice-glazed foods.'
  sources:
  - origin:
      ref:
        source: OIML R 79:2015
        version: '2015'
    type: authoritative
    locality:
      type: clause
      reference_from: '2.2'
