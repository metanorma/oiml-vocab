  definition:
  - content: Valeur du débit correspondant à la limite supérieure de l'étendue de
      la charge (débit) ; c'est le débit le plus élevé auquel le compteur d'eau chaude
      doit pouvoir fournir pendant une durée limitée ou prédéterminée des indications
      qui ne sont pas entachées d'une erreur supérieure à l'erreur maximale tolérée.
