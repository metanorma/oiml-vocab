  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Condición operativa que debe cumplirse durante una medición con el fin
      de que un instrumento o sistema de medición se desempeñe según su diseño.
  examples: []
  id: r46-2.2.26-spa
  notes:
  - content: Por lo general, las condiciones nominales de operación específican intervalos
      de valores para una cantidad que es medida y para cualquier cantidad de influencia.
  - content: 'Para la aplicación de esta Recomendación, los términos "instrumento
      de medición" y "sistema de medición" significan: medidor de electricidad.'
  sources:
  - type: authoritative
    origin:
