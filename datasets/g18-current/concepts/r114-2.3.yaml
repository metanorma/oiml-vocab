  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Sonde qui incorpore un capteur de temperature et assure egalement d'autres
      fonctions.
  examples: []
  id: r114-2.3-fra
  notes:
  - content: Un exemple de sonde de temperature a usage special est une sonde oesophago-stethoscopique
      dans laquelle un capteur de temperature est librement contenu dans un tube en
      plastique; cependant le but premier de la sonde est de transmettre les bruits
      de la cavite thoracique a travers l'air ou le gaz contenu dans le tube jusqu'a
      un stethoscope attache a son extremite ouverte.
