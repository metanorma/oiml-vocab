  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Groupe identifiable d'instruments de pesage ou de modules appartenant
      au même modèle fabriqué qui a les mêmes éléments de conception et les principes
      métrologiques de mesure (par exemple le même modèle d'indicateur, le même modèle
      de conception de cellule de pesée et de dispositif de transmetteur de charge)
      mais qui peut différer dans quelques caractéristiques de performances métrologiques
      et techniques (par exemple, Max, Min, e, d, classe de précision, etc.).
  examples: []
  id: r76-T.3.5-fra
  notes:
  - content: Le concept de «famille» vise d'abord à réduire les essais exigés pour
      l'approbation de modele. Ceci n'empêche pas la possibilité de lister plus qu'une
      famille dans un Certificat.
