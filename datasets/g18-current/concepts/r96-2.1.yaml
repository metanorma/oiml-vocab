  definition:
  - content: The volume of liquid that a bottle is meant to contain when filled under
      the conditions for which it is intended. The nominal capacity shall always be
      marked on the bottle (see point 7.1.1). National regulations may specify the
      nominal capacities of bottles intended for particular categories of liquids.
