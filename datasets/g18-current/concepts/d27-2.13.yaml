  definition:
  - content: Document specifying which procedures and associated resources shall be
      applied by whom and when to a specific project, product, process or contract.
  examples: []
  id: d27-2.13-eng
  notes:
  - content: These procedures generally include those referring to quality management
      processes and to product realization processes.
  - content: A quality plan often makes reference to parts of the quality manual or
      to procedure documents.
  - content: A quality plan is generally one of the results of quality planning.
