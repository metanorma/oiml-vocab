data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: All the operations carried out by an organ of the National Service of
      Legal Metrology (or other legally authorized organisation) having the object
      of ascertaining and confirming that the measuring instrument entirely satisfies
      the requirements of regulations covering verification. Verification includes
      both examination and stamping.
  examples: []
  id: d3-5.1.1-eng
  notes:
  - content: 'Verification results in selection of the instruments concerned: those
      which have successfully passed examination receive an acceptance stamp, others
      can receive a rejection stamp.'
  sources:
