  definition:
  - content: The ratio, expressed as a percentage, of the unit change of resistance
      of a strain gauge mounted perpendicular to a uniaxial strain field (transverse
      gauge) to the unit resistance change of a similar gauge mounted parallel to
      the same strain field (longitudinal gauge).
