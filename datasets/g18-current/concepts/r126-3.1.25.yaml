  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: quotient of the change in an indication of a measuring system and the
      corresponding change in a value of a quantity being measured
  examples: []
  id: r126-3.1.25-eng
  notes:
  - content: Sensitivity of a measuring system can depend on the value of the quantity
      being measured.
  - content: The change considered in a value of a quantity being measured must be
      large compared with the resolution.
  - content: In the scope of this Recommendation, sensitivity relates to the added
      substance which is not identical with the measurand.
  - content: 'Source citation: OIML V 2-200, 4.12'
