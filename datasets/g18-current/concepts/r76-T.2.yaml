    type: accepted
  definition:
  - content: In this Recommendation the term "device" is used for any means by which
      a specific function is performed, irrespective of the physical realization,
      e.g. by a mechanism or a key initiating an operation. The device may be a small
      part or a major portion of an instrument.
  examples: []
  id: r76-T.2-eng
  notes: []
