  definition:
  - content: L'erreur relative du dispositif d'étalonnage incorporé ou celle du marqueur
      de temps est la différence entre les valeurs mesurée et nominale de la tension
      de sortie du dispositif d'étalonnage ou de l'intervalle de temps du marqueur
      de temps, divisée par la valeur nominale.
