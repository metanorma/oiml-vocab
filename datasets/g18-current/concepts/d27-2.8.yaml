  definition:
  - content: Degree to which a set of inherent characteristics fulfils requirements.
  examples: []
  id: d27-2.8-eng
  notes:
  - content: The term "quality" can be used with adjectives such as poor, good or
      excellent.
  - content: '"Inherent" as opposed to "assigned" means existing in something, especially
      as a permanent characteristic.'
