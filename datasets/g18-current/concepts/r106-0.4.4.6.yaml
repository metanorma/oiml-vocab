  definition:
  - content: fault greater than 1 d
  examples: []
  id: r106-0.4.4.6-eng
  notes:
  - content: 'The relevant Recommendation may specify that the following faults are
      not significant, even when they exceed the value defined in 0.4.4.6: faults
      that result from simultaneous and mutually independent causes in the instrument
      or in its checking facility; faults that make it impossible to perform any measurement;
      transitory faults that are momentary variations in the indications which cannot
      be interpreted, memorized or transmitted as a measurement result; faults that
      are so serious that they will inevitably be noticed by those interested in the
      measurement.'
