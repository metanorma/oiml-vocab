  - content: The smallest quantity of liquid for which the measurement is metrologically
      acceptable.
  examples: []
  id: r81-3.13-eng
  notes:
  - content: In a measuring system intended to deliver, this quantity is called the
      minimum delivery, and in those used for receiving operations it is called the
      minimum receipt.
