data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: 'The weighted mean error (WME) within the scope of this Recommendation
      is defined as: WME = sum(k_i × E_i) / sum(k_i), with k_i = Q_i/Q_max for Q_i
      <= 0.7 Q_max, and k_i = 1.4 - Q_i/Q_max for 0.7 Q_max < Q_i <= Q_max, where
      k_i is the weighting factor at the flow rate Q_i and E_i is the error at the
      flow rate Q_i.'
  examples: []
  id: r137-3.2.5-eng
  notes: []
