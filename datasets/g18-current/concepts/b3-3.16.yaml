    type: accepted
  definition:
  - content: any laboratory designated by the OIML Issuing Authority to carry out
      all or specific tests and examinations of sample(s) of a measuring instrument
      or module submitted for OIML type evaluation
  examples: []
  id: b3-3.16-eng
  notes:
  - content: Testing laboratories may be internal laboratories of OIML Issuing Authorities,
      thirdparty laboratories or manufacturers' testing laboratories (MTLs).
  - content: The OIML Issuing Authority, and not the Testing Laboratory, is responsible
      for issuing the OIML Basic Type Evaluation Report.
  - content: See Annex C.
