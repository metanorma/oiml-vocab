  - content: The ratio of the unit variation of gauge factor to the temperature variation.
  examples: []
  id: r62-15-eng
  notes:
  - content: Expressed as (K_T1 - K_T0) / K_T0 * 1 / (T1 - T0), where T1 is the test
      temperature, T0 is the reference temperature, K_T1 is the gauge factor at test
      temperature, K_T0 is the gauge factor at reference temperature.
