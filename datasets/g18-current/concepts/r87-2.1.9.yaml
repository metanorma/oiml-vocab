data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: article de présentation individuelle proposé au consommateur, composé
      du produit et des matériaux d'emballage, fabriqué avant d'être proposé à la
      vente et pour lequel la quantité de produit a une valeur prédéterminée, que
      les matériaux d'emballage enferment le produit complètement ou seulement partiellement,
      mais dans tous les cas de telle manière que la quantité effective de produit
      ne puisse être changée sans que les matériaux d'emballage ne soient ouverts
      ou ne subissent un changement perceptible
  examples: []
  id: r87-2.1.9-fra
  notes:
  - content: Dans le cadre de la présente Recommandation, « préemballage » inclut
      les préemballages qui indiquent une quantité nominale constante et exclut donc
      les préemballages qui indiquent des quantités nominales variables. Le terme
      « valeur prédéterminée » fait référence à la valeur déterminée avant que le
      préemballage ne soit proposé à la vente.
  - content: La quantité effective de certains produits peut varier après le conditionnement,
      en raison de la dessiccation ou de réactions chimiques.
  sources:
  - origin:
      ref:
        source: OIML R 87:2016
        version: '2016'
