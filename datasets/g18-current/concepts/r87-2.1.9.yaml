data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Elemento individual previsto para presentación como tal al consumidor,
      que consta de un producto y de su material de empaque, ensamblado antes de ofrecerlo
      para venta, y en el cual la cantidad de producto tiene un valor predeterminado,
      ya sea que el material de empaque envuelva el producto completa o parcialmente,
      pero en ningún caso de manera que sea posible alterar la cantidad real del producto
      sin abrir el material de empaque o sin que sufra modificaciones perceptibles.
  examples: []
  id: r87-2.1.9-spa
  notes:
  - content: Para el propósito de esta Recomendación, "preempacado" incluye los preempacados
      marcados con una cantidad nominal constante y por tanto excluye los preempacados
      marcados con cantidades nominales aleatorias. El término "valor predeterminado"
      hace referencia al valor determinado antes de que el preempacado sea ofrecido
      para la venta.
  - content: La cantidad real de algunos productos puede cambiar después de ser empacados,
      debido a desecación o a reacciones químicas.
  sources:
  - origin:
      ref:
        source: OIML R 87:2016
        version: '2016'
