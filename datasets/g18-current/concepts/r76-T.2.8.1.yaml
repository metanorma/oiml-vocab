  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Programmes, donnees, parametres specifiques au modele et au dispositif
      qui appartiennent a l'instrument de mesure ou au module, et definissant ou remplissant
      des fonctions qui sont soumises au controle legal.
  examples:
  - content: Les resultats finaux de la mesure, c'est a dire les valeurs, brut, net
      et tare/tare predeterminee (y compris le signe decimal et l'unite), l'identification
      de l'etendue de pesage et le recepteur de charge (si plusieurs recepteurs de
      charge ont ete utilises), l'identification du logiciel.
  id: r76-T.2.8.1-fra
  notes: []
