data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Programmes, données, paramètres spécifiques au modèle et au dispositif
      qui appartiennent à l'instrument de mesure ou au module, et définissant ou remplissant
      des fonctions qui sont soumises au contrôle légal.
  examples:
  - content: Les résultats finaux de la mesure, c'est à dire les valeurs, brut, net
      et tare/tare prédéterminée (y compris le signe décimal et l'unité), l'identification
      de l'étendue de pesage et le récepteur de charge (si plusieurs récepteurs de
      charge ont été utilisés), l'identification du logiciel.
  id: r76-T.2.8.1-fra
  notes: []
