  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Cantidad de producto en un preempacado y declarada en la etiqueta.
  examples: []
  id: r79-2.5-spa
  notes:
  - content: En algunas legislaciones nacionales, la cantidad nominal del producto
      se denomina "cantidad neta", "contenido neto", "masa neta" o "volumen neto".
  - content: Este término se relaciona con las especificaciones que van colocadas
      sobre el preempacado y no representa la cantidad real en un preempacado individual.
      En el caso de preempacados con cantidad nominal constante, los procedimientos
      para determinar si una inspección cumple los requisitos reglamentarios se encuentran
      en la OIML R 87 [1].
  sources:
