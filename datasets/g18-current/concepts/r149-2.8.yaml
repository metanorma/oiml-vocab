  definition:
  - content: medical measuring instrument used for the intermittent non-invasive estimation
      of the blood pressure by utilising an inflatable cuff, a pressure transducer,
      a valve for deflation, and/or displays used in conjunction with automated methods
      for estimating blood pressure. Hereafter referred to as "sphygmomanometer" in
      this Recommendation
