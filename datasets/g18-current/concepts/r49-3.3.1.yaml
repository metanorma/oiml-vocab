  definition:
  - content: Q = dV/dt where V is actual volume (3.2.1) and t is the time taken for
      this volume to pass through the meter
  examples: []
  id: r49-3.3.1-eng
  notes:
  - content: ISO 4006:1991, 4.1.2 prefers the use of the symbol $q_{V}$ for this quantity,
      but Q is used in this Recommendation as it is well established in the industry.
