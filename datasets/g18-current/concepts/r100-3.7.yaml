  definition:
  - content: range of concentrations of an element of interest in solution that can
      be measured within specified limits
  examples: []
  id: r100-3.7-eng
  notes:
  - content: Dilution, or concentration, of a sample solution may be necessary to
      bring the element of interest within the working range. The zero absorbance
      of the spectrometer is adjusted using a blank reference solution.
