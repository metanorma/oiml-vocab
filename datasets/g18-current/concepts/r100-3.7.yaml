  definition:
  - content: étendue des concentrations d'un élément concerné en solution que l'on
      peut mesurer à l'intérieur des limites spécifiées
  examples: []
  id: r100-3.7-fra
  notes:
  - content: Une dilution ou une concentration d'une solution de dosage peut être
      nécessaire pour amener l'élément concerné dans l'étendue de mesure. L'absorbance
      du spectromètre à zéro est ajustée en utilisant une solution de référence à
      blanc.
