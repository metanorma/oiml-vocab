  definition:
  - content: automatic weighing instrument intended to fill containers with a predetermined
      and virtually constant mass of product from bulk (including liquid material)
      by automatic weighing, and which comprises essentially automatic feeding device(s)
      associated with weighing module(s) and the appropriate control and discharge
      devices. Types of AGFI include those described in 3.2.2.1-3.2.2.2
  examples: []
