data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: for a measuring instrument, maximum difference, permitted by specifications
      or regulations, between the instrument indication and the quantity being measured
  examples: []
  id: g1-3.3.18-eng
  notes:
  - content: When more than one maximum difference is specified, the term "maximum
      permissible errors" is used; for example, a specified maximum negative difference
      and a specified maximum positive difference.
  - content: The error of indication can be written as $ E=R-R_{0} $ , where R is
      the indication and $ R_{0} $ denotes the indication of an ideal measuring instrument
      measuring the same measurand Y. In the testing and verification of a measuring
      instrument, the error of indication is typically evaluated by measuring a calibrated
      reference standard.
  sources:
  - origin:
      ref:
