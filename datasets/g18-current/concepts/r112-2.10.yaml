  definition:
  - content: Etendue des concentrations ou des debits massiques d'un composant de
      l'echantillon examine pour laquelle la sensibilite du detecteur est constante
      a 5 % pres. Sa valeur correspond au rapport de la limite superieure de linearite
      a la limite de detection.
