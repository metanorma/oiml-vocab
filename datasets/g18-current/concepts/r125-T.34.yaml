  definition:
  - content: Dispositif integre a un instrument de mesure pour permettre de detecter
      et de mettre en evidence des defauts significatifs.
  examples: []
  id: r125-T.34-fra
  notes:
  - content: La mise en evidence consiste en une reponse adequate assuree par l'instrument
      de mesure (signal visuel ou auditif, blocage du processus de mesure, etc.).
