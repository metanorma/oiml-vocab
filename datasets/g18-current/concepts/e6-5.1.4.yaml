    type: accepted
  definition:
  - content: Contrary to traditional stand-alone measurement equipment for utility
      metering, the configuration of a smart meter as a result of its definition includes
      certain interconnecting means and transmission related software. The smart meter
      configuration can be considered as a network system and may contain a number
      of wired or wireless interconnected measuring instruments, which are used to
      measure different measurands; are possibly installed quite close to each other;
      and contain functions/modules that convert the measured values into binary numeric
      electromagnetic quantities which become available as so-called digital signals.
