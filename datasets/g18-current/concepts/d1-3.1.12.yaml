data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Forme de surveillance métrologique destinée aux instruments de mesure
      et aux préemballages à mettre en place sur le marché et/ou à mettre en service
      pour la première fois afin de garantir que tous les éléments du système d'évaluation
      de la conformité fonctionnent correctement, ce qui a pour résultat la conformité
      générale des produits par rapport aux dispositions des règlements applicables
      au sein d'un pays ou d'une zone de libre-échange.
  examples: []
  id: d1-3.1.12-fra
  notes:
  - content: 'Note du traducteur: le texte de 3.1.12 est une traduction directe et
      non une citation d''un Document français existant car le D 16 n''existe pas
      encore en langue française.'
  - content: 'Dans la définition ci-dessus, les termes « à mettre en place sur le
      marché et/ou à mettre en service » devraient s''appliquer à la description de
      différentes situations: « à mettre en place sur le marché » devrait être utilisé
      si toutes les procédures d''évaluation de la conformité afferentes vont être
      complètes avant la mise en service des instruments de mesure ou des préemballages;
      « à mettre en place sur le marché et mettre en service » - une ou plusieurs
      procédures d''évaluation de la conformité peuvent être ou avoir été réalisées
      lors de la mise en service des instruments de mesure; « mettre en service »
      - pour décrire la situation où un fabriquant fabrique un instrument de mesure
      à utiliser (il n''est pas nécessaire de mettre sur le marché).'
  - content: La surveillance du marché est exercée par les autorités de contrôle afin
      de détecter si des produits en place sur le marché national (c'est-à-dire vendu
      ou à vendre) ne sont pas conforme aux réglementations applicables.
  - content: Ceci est à distinguer d'une « surveillance de terrain » qui consiste
      en une surveillance par les autorités de contrôle pour vérifier que les instruments
      utilisés sur les marchés (sur le terrain) soient bien conformes aux exigences
      y afferentes (exigences relatives aux caractéristiques, à l'intégrité, précision,
      utilisation adéquate).
  sources:
