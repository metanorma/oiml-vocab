    type: accepted
  definition:
  - content: 'device for setting the indication to zero when a load is on the load
      receptor: a) without altering the weighing range for net loads (additive tare
      device); or b) reducing the weighing range for net loads (subtractive tare device)'
  examples: []
  id: r61-3.3.5.1-eng
  notes:
  - content: The tare device functions as a) a non-automatic device (load balanced
      by operator), b) a semi-automatic device (load balanced automatically following
      a single manual command), c) an automatic device (load balanced automatically
      without the intervention of an operator).
