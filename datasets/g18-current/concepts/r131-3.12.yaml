  definition:
  - content: Étroitesse de l'accord entre les résultats des mesures successives du
      même échantillon effectuées dans les mêmes conditions et dans un laps de temps
      relativement court.
  examples: []
  id: r131-3.12-fra
  notes:
  - content: Par "mêmes conditions", il convient d'entendre même méthode de mesure,
      même instrument de mesure, même opérateur, même lieu, et mêmes conditions environnementales
      ambientes.
