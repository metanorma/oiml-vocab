  definition:
  - content: test performed on a measuring instrument at a site or facility outside
      of the permanent control of a Test Laboratory
  examples: []
  id: b18-3.14-eng
  notes:
  - content: Field site tests are generally the only practical way to test very large
      scale or large capacity measuring instruments, where it is not possible to perform
      the testing in a controlled laboratory environment.
