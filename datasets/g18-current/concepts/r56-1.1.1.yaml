  definition:
  - content: Solution-étalon dont la conductivité est déterminée par la méthode absolue
      (voir Vocabulaire de métrologie légale point 5.2.4.).
  examples: []
  id: r56-1.1.1-fra
  notes:
  - content: La constante de la cellule est déterminée suivant la définition donnée
      au point 1.3. ci-dessous, en fonction des paramètres géométriques de la cellule
      exprimés en unités SI, sans que soit utilisée une autre solution-étalon.
