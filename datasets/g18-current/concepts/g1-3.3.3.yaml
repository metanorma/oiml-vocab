data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: need or expectation that is stated
  examples:
  - content: A sample of industrial waste water (the item) is required to have a mass
      concentration of dissolved mercury (the property) of no greater than 10 ng/L.
  - content: A grocery scale (the item) is required to have an indication R (the property)
      in the interval [999.5 g $ \leq $ R $ \leq $ 1000.5 g] when measuring a standard
      1 kg weight.
  id: g1-3.3.3-eng
  notes:
  - content: Specified requirements may be stated in normative documents such as regulations,
      standards and technical specifications.
  - content: The term 'expectation' in the context of a specified requirement is not
      related to the expectation of a random variable; see definition 3.1.5.
  - content: In this document, a typical specified requirement takes the form of a
      stated interval of permissible values of a measurable property of an item.
  - content: 'Source citation: ISO/IEC 17000:2004 3.1'
