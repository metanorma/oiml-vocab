data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Erreur de durabilité supérieure à $e$.
  examples: []
  id: r76-T.5.5.8-fra
  notes:
  - content: Une erreur de durabilité peut être due à l'usure ou aux avaries mécaniques,
      ou à la dérive et au vieillissement des parties électroniques. Le concept d'erreur
      de durabilité significative ne s'applique qu'aux parties électroniques.
  - content: Pour les instruments à échelons multiples, la valeur de e est celle qui
      correspond à l'étendue de pesage partielle.
  - content: Les erreurs suivantes, qui se produisent après une certaine période d'utilisation,
      ne sont pas considérées comme des erreurs de durabilité significatives, même
      si elles dépassent $e$, si elles sont à l'évidence le résultat d'une panne d'un
      dispositif ou composant, ou d'une perturbation et pour lesquelles l'indication
      ne peut être interprétée, mémorisée, ou transmise comme résultat de mesure,
      ou est telle qu'il est impossible d'accomplir une mesure, ou est si évidemment
      erronée que cela ne peut manquer d'être remarqué par tous ceux qui sont intéressés
      au résultat du mesurage.
