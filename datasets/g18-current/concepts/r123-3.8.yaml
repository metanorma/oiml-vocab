  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Material or substance one or more of whose property values are sufficiently
      homogeneous and well established to be used for the calibration of an apparatus,
      the assessment of a measurement method, or assigning values to materials.
  examples: []
  id: r123-3.8-eng
  notes:
  - content: This term does not necessarily mean a certified reference standard.
