  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: for a series of n measurements of the same measurand, the quantity s(q_k)
      characterising the dispersion of the results and given by the formula s(q_k)
      = sqrt( sum_{j=1}^{n} (q_j - q_bar)^2 / (n - 1) ), with q_k being the result
      of the k-th measurement and q_bar being the arithmetic mean of the n results
      considered
