    type: accepted
  definition:
  - content: Temps passe depuis l'injection de l'echantillon et l'apparition du pic
      maximal du signal d'emission pour le composant examine.
  examples: []
  id: r112-2.14-fra
  notes:
  - content: 'Le facteur de capacite k'' est apparente a ce terme et est defini comme
      suit: k'' = (tr - tm) / tm, ou tm = temps necessaire pour que la phase mobile
      passe du point d''injection a celui de detection.'
