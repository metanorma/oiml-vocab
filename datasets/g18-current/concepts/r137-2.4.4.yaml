  definition:
  - content: Extreme conditions, including flowrate, temperature, pressure, humidity
      and electromagnetic interference that a gas meter is required to withstand without
      damage. When it is subsequently operated within its rated operating conditions,
      it must do so within the limits of its maximum permissible error.
