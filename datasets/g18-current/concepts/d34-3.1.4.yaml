    type: accepted
  definition:
  - content: conformity assessment procedure focused on the assessment of measuring
      instruments to give assurance that manufactured (or production) instruments
      meet the approved type
  examples: []
  id: d34-3.1.4-eng
  notes:
  - content: The concept of CTT as considered in this Document refers to a systematic
      pre-market conformity assessment procedure applicable to measuring instruments.
      It should not be confused with 'market surveillance' activities, which are sometimes
      performed as part of a systematic program but often are performed ad-hoc by
      public authorities based on risk assessment and market intelligence, e.g. user
      complaints.
