  definition:
  - content: frequency of the voltage (and current) specified by the manufacturer
      for the outpower of the EVSE
  examples: []
  id: g22-2.3.8-eng
  notes:
  - content: For AC EVSE, the frequency of the power supplied to the EVSE and the
      power the EVSE supplies to the vehicle are the same.
  - content: For DC EVSE, $ f_{\mathrm{nom}} $ is 0 Hz.
