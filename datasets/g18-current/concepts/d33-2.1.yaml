data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: liquid in which the shear rate is proportional to the shear stress during
      a viscous flow
  examples: []
  id: d33-2.1-eng
  notes:
  - content: The ratio of the shear stress to the shear rate is the dynamic viscosity
      of the liquid, according to Newton's Law of Viscosity. The kinematic viscosity
      is the ratio of the dynamic viscosity to the density of the liquid.
  sources:
  - origin:
      ref:
