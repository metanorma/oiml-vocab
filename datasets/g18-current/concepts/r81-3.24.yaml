data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Defaut dont la magnitude est superieure a 20 % de l'erreur maximale toleree
      (emt) pour la quantite mesuree.
  examples: []
  id: r81-3.24-fra
  notes:
  - content: 'Les defauts suivants ne sont pas consideres comme significatifs: defauts
      provenant de causes simultanees et mutuellement independantes dans l''instrument
      de mesure lui-meme ou dans son systeme de controle; defauts transitoires consistant
      en des variations momentanees de l''indication, ne pouvant etre interpretees,
      memorisees, ou transmises en tant que resultat de mesure; defauts impliquant
      l''impossibilite d''effectuer tout mesurage.'
