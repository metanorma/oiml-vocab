data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Es el valor extremo del error de medición, con respecto a un valor de
      magnitud de referencia conocido, permitido por las especificaciones o regulaciones
      para una medición dada, instrumento de medición o sistema de medición particular.
  examples: []
  id: r46-2.2.18-spa
  notes:
  - content: Por lo general, el término "error máximo permitido" o "límite de errores"
      se utiliza cuando hay dos valores extremos.
  - content: El término "tolerancia" no debe utilizarse para referirse a "error máximo
      permitido".
  - content: 'Source citation: OIML V 2-200:2012, 4.26'
  - content: En esta Recomendación, el error máximo permitido es una combinación del
      error máximo permitido base y el cambio en el error máximo permitido, según
      se describe en el Anexo B.
  - content: 'Para la aplicación de esta Recomendación, "especificaciones o regulaciones"
      significa: las disposiciones contenidas en esta Recomendación, y los términos
      "instrumento de medición" y "sistema de medición" significan: medidor de electricidad.'
  sources:
  - origin:
      ref:
        source: OIML R 46-1:2012
        version: '2012'
    locality:
      type: clause
      reference_from: 2.2.18
    type: authoritative
  terms:
  - type: expression
    normative_status: preferred
    designation: Error máximo permitido (mpe)
  language_code: spa
  entry_status: valid
date_accepted: '2026-07-13T00:00:00+00:00'
