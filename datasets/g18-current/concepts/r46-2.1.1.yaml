  definition:
  - content: Instrumento diseñado para medir energía eléctrica continuamente, mediante
      la integración de la energía con el respectivo tiempo y con el almacenamiento
      del resultado.
  examples: []
  id: r46-2.1.1-spa
  notes:
  - content: Se reconoce que "continuamente" también puede cubrir medidores con una
      tasa de muestreo lo suficientemente alta como para cumplir con los requisitos
      de esta Recomendación.
