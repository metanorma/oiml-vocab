    type: accepted
  definition:
  - content: The closeness of the agreement between the results of successive measurements
      of the same quantity of a pollutant carried out by the same instrument and under
      the same conditions of use within a relatively short period of time. Repeatability
      is synonymous with the term "precision" for an instrument.
  examples: []
