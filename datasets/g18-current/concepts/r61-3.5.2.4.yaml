  definition:
  - content: Größter Wert einer Messabweichung in Bezug auf einen bekannten Referenzwert
      der durch Spezifikationen oder Vorschriften für eine Messung, ein Messgerät
      oder ein Messsystem zugelassen ist
  examples: []
  id: r61-3.5.2.4-deu
