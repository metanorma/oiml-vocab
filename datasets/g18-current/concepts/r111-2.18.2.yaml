  definition:
  - content: Ensemble d'essais et d'examens visuels, également réalisés par un agent
      du service de métrologie légale (inspecteur), pour déterminer si les poids ou
      jeux de poids, ayant été en service un certain temps depuis la vérification
      précédente, continuent d'être conformes ou sont à nouveau conformes aux réglementations
      et maintiennent leurs caractéristiques métrologiques dans les limites fixées.
