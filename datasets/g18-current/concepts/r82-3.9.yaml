data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Manifestation of variation in the gas chromatograph output signal not
      associated with changes in chromatographic conditions (e.g. temperature gradient),
      which can be divided into short-term noise and drift.
  examples: []
  id: r82-3.9-eng
  notes:
  - content: Short-term noise includes all observable random variations of the signal
      from the detector or other components having a frequency of the order of one
      or more cycles per minute.
  - content: Drift is the average slope of the baseline signal measured over a minimum
      of half an hour.
