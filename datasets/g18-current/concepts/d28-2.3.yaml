    type: accepted
  definition:
  - content: material measure of mass, regulated in regard to its physical and metrological
      characteristics - shape, dimensions, material, surface quality, nominal value,
      density, magnetic properties and maximum permissible error
  examples: []
  id: d28-2.3-eng
  notes:
  - content: The term "weight" is also used as the physical quantity of the gravitational
      force of a body. From the context it is usually clear in which sense the term
      is used. If the sense is not clear, one may use the words "weight force" or
      "weight piece", depending on its meaning.
