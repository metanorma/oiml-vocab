  definition:
  - content: output device, the purpose of which is to visualize actual information
      in volatile digital format
  examples: []
  id: r50-2.2.10.8-eng
  notes:
  - content: A digital display may be a primary display or a secondary display.
  - content: The terms "primary display" and "secondary display" should not be confused
      with the terms "primary indication" and "secondary indication" (see 2.4.1.1
      and 2.4.1.2).
