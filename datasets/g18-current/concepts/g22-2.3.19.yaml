  definition:
  - content: extreme values of the change in error (of indication) of an EVSE, permitted
      by this Guide, when a single influence factor is taken from its value at reference
      conditions and varied within the rated operating conditions. For each influence
      factor there is one corresponding maximum permissible error shift
