  definition:
  - content: Dispositif qui contient toutes les informations nécessaires et reçoit
      tous les signaux nécessaires du dispositif de mesure lui permettant de calculer
      le volume ou d'autres grandeurs associées. Il peut aussi conserver les informations,
      fournir des systèmes de contrôle des informations et communiquer avec des dispositifs
      auxiliaires.
