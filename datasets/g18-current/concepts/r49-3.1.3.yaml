    type: accepted
  definition:
  - content: element of a meter that is directly affected by a phenomenon, body or
      substance carrying a quantity to be measured
  examples: []
  id: r49-3.1.3-eng
  notes:
  - content: For a water meter, the sensor may be a disc, piston, wheel or turbine
      element, the electrodes on an electromagnetic meter, or another element. The
      element senses the flow rate or volume of water passing through the meter and
      is referred to as a "flow sensor" or "volume sensor".
