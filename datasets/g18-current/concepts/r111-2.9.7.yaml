  - content: Paramètre spécifiant l'état magnétique de corps tels que des poids, en
      l'absence de champ magnétique externe (dans la plupart des cas, la magnétisation
      est un vecteur dont la direction et la norme ne sont pas, nécessairement constantes
      au sein du matériau).
