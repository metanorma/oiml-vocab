    type: accepted
  definition:
  - content: sampling procedure where prepackages to be included in a sample are chosen
      randomly from the inspection lot (i.e. each prepackage in the inspection lot
      has an equal probability of being selected to be included in the sample)
  examples: []
  id: r87-2.1.13-eng
  notes:
  - content: This is also referred to as "sampling without replacement".
  sources:
  - origin:
      ref:
        source: OIML R 87:2016
        version: '2016'
    locality:
      type: clause
      reference_from: 2.1.13
    type: authoritative
  terms:
  - type: expression
    normative_status: preferred
    designation: random sampling
  language_code: eng
  entry_status: valid
