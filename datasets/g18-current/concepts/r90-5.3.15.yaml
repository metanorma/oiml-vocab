  definition:
  - content: Le niveau de bruit intrinsèque rapporté à l'entrée est l'amplitude crête
      à crête maximale du signal, évaluée pour un intervalle de temps donné et réduit
      à l'entrée, l'impédance Z1 étant reliée à l'entrée de l'électrocardiographe.
