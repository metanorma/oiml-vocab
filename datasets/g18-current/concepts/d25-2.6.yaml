data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Le nombre de Reynolds de la canalisation est un nombre sans dimension,
      rapport d'une force d'inertie à une force de viscosité, utilisé comme paramètre
      de corrélation combinant les effets de la viscosité, de la masse volumique,
      et de la vitesse dans la canalisation. Il est défini par Re = D x (U / nu) =
      D x U x (rho / mu), où D est le diamètre d'entrée du compteur, U est la vitesse
      moyenne du fluide dans le compteur, nu est la viscosité cinématique, rho est
      la masse volumique du fluide, et mu est la viscosité absolue (dynamique).
  examples: []
