data:
  dates:
  - date: 2026-07-13 00:00:00.000000000 +00:00
    type: accepted
  definition:
  - content: quantity that, in a direct measurement, does not affect the quantity
      that is actually measured, but affects the relation between the indication and
      the measurement result
  examples: []
  id: d11-3.15-eng
  notes:
  - content: An influence quantity is not related to the measurand but is a quantity
      that affects the result of the measurement as indicated by the equipment under
      test (EUT).
  - content: 'Example: The temperature of a measuring instrument is an influence quantity,
      but the temperature of the measured object (used as a reference for determining
      the fault or the error) is not. This influence of the environment on this measured
      object may need to be taken into consideration as a contributor in the definition
      of the measurand.'
  - content: 'Source citation: VIM 2.52, VIML 0.07'
  sources:
