data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Es la cantidad que, en una medición directa, no afecta la cantidad real
      que se está midiendo, pero afecta la relación entre la indicación y el resultado
      de la medición.
  examples: []
  id: r46-2.2.23-spa
  notes:
  - content: El concepto de cantidad de influencia se entiende como si incluyen valores
      asociados con los estándares de medición, materiales de referencia y datos de
      referencia de los que depende el resultado de una medición, así como fenómenos
      tales como fluctuaciones a corto plazo del instrumento de medición y cantidades
      como la temperatura ambiente, la presión barométrica y la humedad.
  - content: 'En el GUM [5], el concepto ''cantidad de influencia'' se define como
      en la segunda edición del VIM, cubriendo no solo las cantidades que afectan
      el sistema de medición, según la anterior definición, pero también aquellas
      cantidades que afectan las cantidades realmente medidas. También, en el GUM,
      este concepto no está restringido a mediciones directas. Source citation: OIML
      V 2-200:2012, 2.52, Note 2'
  sources:
