data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: quantity that, in a direct measurement, does not affect the quantity
      that is actually measured, but affects the relation between the indication and
      the measurement result
  examples: []
  id: r46-2.2.23-eng
  notes:
  - content: The concept of influence quantity is understood to include values associated
      with measurement standards, reference materials and reference data upon which
      the result of a measurement may depend, as well as phenomena such as short-term
      measuring instrument fluctuations and quantities such as ambient temperature,
      barometric pressure and humidity.
  - content: In the GUM [5], the concept 'influence quantity' is defined as in the
      second edition of the VIM, covering not only the quantities affecting the measuring
      system, as in the definition above, but also those quantities that affect the
      quantities actually measured. Also, in the GUM this concept is not restricted
      to direct measurements.
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: influence quantity
  language_code: eng
  entry_status: valid
