  notes:
  - content: A measurement result may be expressed in a number of ways, by giving,
      for example, (a) a measured quantity value with an associated measurement uncertainty;
      (b) a coverage interval for the measurand with an associated coverage probability;
      (c) a PDF; or (d) a numerical approximation to a PDF.
