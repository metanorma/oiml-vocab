  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Dispositif permettant d'amener l'indication de l'instrument à zéro lorsqu'une
      charge est placée sur le récepteur de charge sans empiéter sur l'étendue de
      pesage des charges nettes (dispositif additif de tare) ou en réduisant l'étendue
      de pesage des charges nettes (dispositif soustractif de tare). Il peut fonctionner
      comme un dispositif non automatique (charge équilibrée par un opérateur), un
      dispositif semi-automatique (charge équilibrée automatiquement sur une seule
      commande manuelle) ou un dispositif automatique (charge équilibrée automatiquement
      sans l'intervention d'un opérateur).
