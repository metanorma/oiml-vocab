data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: operación que bajo condiciones especificadas establece, en una primera
      etapa, una relación entre los valores y sus incertidumbres de medición asociadas
      obtenidas a partir de los patrones de medición, y las correspondientes indicaciones
      con sus incertidumbres asociadas y, en una segunda etapa, utiliza esta información
      para establecer una relación que permita obtener un resultado de medición a
      partir de una indicación
  examples: []
  id: d10-3.3-spa
  notes:
  - content: Una calibración puede expresarse mediante una declaración, una función
      de calibración, un diagrama de calibración, una curva de calibración o una tabla
      de calibración. En algunos casos, puede consistir en una corrección aditiva
      o multiplicativa de la indicación con su incertidumbre correspondiente.
  - content: Conviene no confundir la calibración con el ajuste de un sistema de medición,
      a menudo llamado incorrectamente "autocalibración", ni con una verificación
      de la calibración.
  - content: Frecuentemente se interpreta que únicamente la primera etapa de esta
      definición corresponde a la calibración.
  - content: 'Source citation: VIM3, 2.39'
  sources:
