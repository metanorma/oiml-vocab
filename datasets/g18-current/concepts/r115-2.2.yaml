  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: The component of a thermometer of which part is applied to a body cavity
      or tissue with which it establishes thermal equilibrium. It comprises a temperature
      sensor with associated parts including coverings, seals, inner leads, and connecting
      plug, where appropriate.
  examples: []
  id: r115-2.2-eng
  notes:
  - content: A body cavity or tissue may be the mouth (sublingual), rectum, or armpit.
  - content: The part of the probe in contact with a body cavity or tissue is called
      the applied part.
  sources:
  - origin:
      ref:
        source: OIML R 115:1995
        version: '1995'
    locality:
      type: clause
      reference_from: '2.2'
    type: authoritative
  terms:
  - type: expression
    normative_status: preferred
    designation: temperature probe
  language_code: eng
  entry_status: valid
