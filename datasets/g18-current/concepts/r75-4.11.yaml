  - content: Specified set of values of the flow rate, the return temperature and
      the temperature difference, fixed to ensure valid intercomparison of the results
      of measurements.
  examples: []
  id: r75-4.11-eng
  notes:
  - content: A conventional true value is, in general, regarded as sufficiently close
