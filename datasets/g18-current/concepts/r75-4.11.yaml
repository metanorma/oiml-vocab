  definition:
  - content: Ensemble de valeurs spécifiées du débit, de la température de sortie
      et de la différence de température, déterminé pour assurer une comparaison valable
      des résultats de mesure.
  examples: []
  id: r75-4.11-fra
  notes:
  - content: Une valeur conventionnellement vraie est en général considérée comme
      suffisamment proche de la valeur vraie pour que la différence, eu égard à l'objectif
      considéré, soit négligeable.
