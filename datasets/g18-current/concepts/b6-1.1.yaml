  definition:
  - content: a model for establishing national or regional regulations regarding the
      metrological and technical characteristics required for the measuring instruments
      concerned, covering a given category of measuring instruments; it also addresses
      the methods and equipment used for checking the conformity of instruments with
      the established requirements and the format of the test reports
  examples: []
  id: b6-1.1-eng
  notes:
  - content: Recommendations may address matters other than measuring instruments,
      e.g. reference tables.
