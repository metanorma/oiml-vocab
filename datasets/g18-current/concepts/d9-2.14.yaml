data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Area in which two or more countries have harmonized legislation or established
      some other legal means, on a national basis, to facilitate free cross-border
      movement of products and services that are affected by legal metrological control.
  examples: []
  id: d9-2.14-eng
  notes:
  - content: Such harmonized legislation may rely on conformity assessment procedures
      where, apart from public authorities, first party bodies (manufacturers) and
      other private bodies, carry out certain functions as third parties.
