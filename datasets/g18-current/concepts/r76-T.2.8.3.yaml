  definition:
  - content: Paramètre d'application légale avec une valeur qui dépend seulement du
      modèle d'instrument. Les paramètres d'application légale sont une partie du
      logiciel d'application légale. Ils sont fixés lors de l'approbation de modèle
      de l'instrument.
  examples:
  - content: Paramètres utilisés pour le calcul de la masse, l'analyse de la stabilité
      ou le calcul du prix ou de l'arrondi, l'identification du logiciel.
