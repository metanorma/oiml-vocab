  definition:
  - content: Partie de la zone de pesage qui n'est pas le récepteur de charge mais
      qui est située à chaque extrémité du récepteur de charge et qui fournit une
      trajectoire droite, approximativement-plane, régulière dans le sens de passage
      du véhicule pesé.
