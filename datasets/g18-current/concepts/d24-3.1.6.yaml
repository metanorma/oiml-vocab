    type: accepted
  definition:
  - content: The nominal target aperture n is a target aperture for a specified target
      distance L such that the temperature of a radiation source with the diameter
      $ D=\mathrm{n}\times L $ can be measured accurately. The nominal target aperture
      is usually fixed for a distance of 1 m. However, the instrument may be set for
      other target distances provided that these distances are indicated in the accompanying
      documents.
  examples: []
  id: d24-3.1.6-eng
  notes: []
