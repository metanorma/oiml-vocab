  definition:
  - content: instantaneous active power integrated over time $ E _ {\mathrm {a}} =
      \int_ {0} ^ {T} p (t) \cdot \mathrm {d} t $ where $ E_{a} $ is the active energy
      T is the total duration of the power delivery in a transaction t is time Other
      symbols are as defined in 2.3.13
  examples: []
  id: g22-2.3.15-eng
  notes:
  - content: Active energy is usually expressed in kWh or MWh. Refer to 3.1 for requirements
      on units of measurement.
