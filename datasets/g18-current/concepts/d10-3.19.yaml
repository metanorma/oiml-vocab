  definition:
  - content: conjunto de uno o más instrumentos de medición y, frecuentemente, otros
      dispositivos, incluyendo reactivos e insumos varios, ensamblados y adaptados
      para proporcionar valores medios dentro de intervalos específicos, para magnitudes
      de tipos específicos
  examples: []
  id: d10-3.19-spa
  notes:
  - content: Un sistema de medición puede estar formado por un único instrumento de
      medición.
