data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Interface (matériel et/ou logiciel) qui autorise seulement l'introduction
      de données dans le dispositif de traitement de données d'un instrument, module
      ou composant électronique, telles qu'il ne soit pas possible d'afficher des
      données qui ne sont pas clairement définies et qui pourraient être prises pour
      un résultat de pesage, de falsifier des résultats de pesage ou des indications
      primaires affichées, traitées ou stockées, ou d'ajuster l'instrument ou changer
      tout facteur d'ajustage, à l'exception du déclenchement d'une procédure d'ajustage
      avec des dispositifs incorporés ou, dans le cas d'un instrument de classe I,
      avec des poids d'ajustage externes.
  examples: []
