  definition:
  - content: A device employing electronic subassemblies and performing a specific
      function. Electronic devices are usually manufactured as a separate unit and
      are capable of being independently tested.
  examples: []
  id: r105-T.13-eng
  notes:
  - content: An electronic device, as defined above, may be a complete measuring system
      or part of measuring system.
