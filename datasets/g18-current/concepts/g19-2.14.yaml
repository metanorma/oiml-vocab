data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: extreme value of measurement error, with respect to a known reference
      quantity value, permitted by specifications or regulations for a given measurement,
      measuring instrument, or measuring system
  examples: []
  id: g19-2.14-eng
  notes:
  - content: Usually, the term "maximum permissible errors" or "limits of error" is
      used where there are two extreme values.
  - content: The term "tolerance" should not be used to designate 'maximum permissible
      error'.
  - content: There are two positions on the consideration of 'maximum permissible
      error', whether it should be defined as a 'value', as in the above definition,
      or as a 'quantity' that has a value. In this Guide the definition given above
      will be used. (not in VIM3)
