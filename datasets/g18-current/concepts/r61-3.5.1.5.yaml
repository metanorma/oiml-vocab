  definition:
  - content: output device that allows actual information to be visualized in volatile
      digital format
  examples: []
  id: r61-3.5.1.5-eng
  notes:
  - content: A digital display may concern a primary display or a secondary display.
  - content: The terms "primary display" and "secondary display" should not be confused
