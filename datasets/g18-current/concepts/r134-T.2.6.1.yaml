data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Programme(s), données et paramètres spécifiques qui appartiennent à l'instrument
      de mesure ou au dispositif, et qui définissent ou remplissent des fonctions
      soumises au contrôle légal.
  examples: []
  id: r134-T.2.6.1-fra
  notes:
  - content: 'Des exemples de logiciel d''application légale sont: des résultats finaux
      de la mesure incluant le signe décimal et l''unité; identification de l''étendue
      de pesage et du récepteur de charge (si plusieurs récepteurs de charge ont été
      utilisés). Les genres suivants de logiciel d''application légale peuvent être
      distingués: spécifiques au type; et spécifiques au dispositif.'
  sources:
  - origin:
