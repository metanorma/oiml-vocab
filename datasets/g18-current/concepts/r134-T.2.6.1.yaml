    type: accepted
  definition:
  - content: Program(s), data and type-specific parameters that belong to the measuring
      instrument or device, and that define or fulfill functions which are subject
      to legal control.
  examples: []
  id: r134-T.2.6.1-eng
  notes:
  - content: 'Examples of legally relevant software are: final results of the measurement
      including the decimal sign and the unit; identification of the weighing range
      and the load receptor (if several load receptors have been used). The following
      types of legally relevant software can be distinguished: type-specific; and
      device-specific.'
  sources:
  - origin:
      ref:
        source: OIML R 134:2006
        version: '2006'
    locality:
      type: clause
      reference_from: T.2.6.1
    type: authoritative
  terms:
  - type: expression
    normative_status: preferred
    designation: legally relevant software
  language_code: eng
