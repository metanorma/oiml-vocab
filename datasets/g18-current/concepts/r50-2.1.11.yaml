  definition:
  - content: device used in simulation tests on the continuously totalizing weigher
      without its conveyor and intended to simulate displacement of the belt by activating
      the displacement transducer in a similar manner to how it would operate with
      the conveyor (e.g. by use of a pulse generator or a motor to simulate rotation
      of a wheel which incorporates the displacement transducer)
