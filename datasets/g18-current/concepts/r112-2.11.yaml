  definition:
  - content: Etendue des concentrations ou des debits massiques d'un composant de
      l'echantillon examine pour laquelle une variation de la quantite d'echantillon
      produit une variation mesurable du signal de sortie du detecteur. Sa valeur
      correspond au rapport de la limite superieure de detection a la limite de detection.
