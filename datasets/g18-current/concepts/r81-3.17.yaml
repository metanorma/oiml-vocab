data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Les conditions specifiees de temperature et de pression auxquelles le
      volume mesure est converti.
  examples: []
  id: r81-3.17-fra
  notes:
  - content: Bien que l'expression "conditions de reference" soit souvent utilisee
      a la place de "conditions de base", il convient de ne pas confondre les conditions
      de mesure et de base (qui concernent uniquement le volume de liquide a mesurer
      ou indique) avec les "conditions assignees de fonctionnement" et les "conditions
      de reference" qui s'appliquent aux grandeurs d'influence.
  sources:
  - origin:
      ref:
        source: OIML R 81:1998
        version: '1998'
