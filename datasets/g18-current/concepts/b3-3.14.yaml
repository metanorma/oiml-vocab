  definition:
  - content: report issued by a Testing Laboratory, that includes results of tests
      and examinations it carried out on the basis of the relevant OIML Recommendation
      during OIML Type Evaluation on identified sample(s) of a given type of measuring
      instrument or module
  examples: []
  id: b3-3.14-eng
  notes:
  - content: See Annex C.
  - content: Unless the OIML Recommendation states otherwise, several test reports
      may be issued in case several Testing Laboratories are involved in covering
      all of the tests and examinations specified in the relevant OIML Recommendation
      (see 5.4.1)
