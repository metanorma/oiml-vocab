data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: certification body or inspection body from an OIML Member State approved
      by the Management Committee to issue OIML certificates and associated OIML type
      evaluation reports in accordance with Scheme A or Scheme B
  examples: []
  id: b18-3.28-eng
  notes:
  - content: An OIML Member State having an OIML Issuing Authority for a category
      of measuring instrument under Scheme A shall designate at least one Utilizer
      (see 3.45) for that category of measuring instrument. The Utilizer(s) may be
      a different organisation(s) than the OIML Issuing Authority.
  - content: The requirement to designate at least one Utilizer (see 3.45) shall not
      apply when the OIML Member State does not regulate that particular category
      of measuring instrument in their country.
