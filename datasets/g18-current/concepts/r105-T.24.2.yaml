  definition:
  - content: An influence quantity having a value within the limits specified hereafter
      in this Recommendation, but outside the specified rated operating conditions
      of the measuring system.
  examples: []
  id: r105-T.24.2-eng
  notes:
  - content: An influence quantity is a disturbance if, for that influence quantity,
      the rated operating conditions are not specified.
