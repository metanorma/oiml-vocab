  - content: solution used to set the zero absorbance on the spectrometer and that
      normally consists of a pure solvent such as de-ionized water
  examples: []
  id: r100-3.3-eng
  notes:
  - content: '3.3.1 blank reference solution: solution used to set the zero absorbance
      on the spectrometer and that normally consists of a pure solvent such as de-ionized
      water'
  - content: '3.3.2 blank test solution: solution that contains all the chemicals
      except for the element to be determined in the same concentration as required
      for the preparation of a reference standard solution of that element'
