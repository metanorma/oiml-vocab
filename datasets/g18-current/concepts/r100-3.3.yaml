  definition:
  - content: solution employée pour la mise au zéro d'absorbance du spectromètre et
      qui consiste normalement en un milieu de dilution pur, tel que de l'eau dé-minéralisée
  examples: []
  id: r100-3.3-fra
  notes:
  - content: '3.3.1 solution de référence à blanc: solution employée pour la mise
      au zéro d''absorbance du spectromètre et qui consiste normalement en un milieu
      de dilution pur, tel que de l''eau dé-minéralisée'
  - content: '3.3.2 solution d''essai à blanc: solution qui contient tous les constituants
      chimiques, à l''exception de l''élément à doser, dans une concentration identique
      à celle requise pour la préparation d''une solution étalon de référence de cet
      élément'
