  definition:
  - content: Tracés graphiques de résultats d'essais obtenus à partir de prélèvements
      ou de processus identiques ou similaires dans le temps ou d'une séquence de
      mesurages de ce genre, conjointement avec les limites dans lesquelles les valeurs
      des mesurages sont supposées se trouver quand l'instrument est sous contrôle
      statistique.
