    type: accepted
  definition:
  - content: device employing electronic sub-assemblies and performing a specific
      function. Electronic devices are usually manufactured as separate units and
      are capable of being tested independently
  examples: []
  id: r50-2.2.3.1-eng
  notes:
  - content: An electronic device may be a complete measuring instrument (for example
      counter scale, electricity meter) or a part of a measuring instrument (for example
      printer, indicator).
  - content: An electronic device may be a module in the sense that this term is used
      in OIML B 3 OIML Basic Certificate System for Measuring Instruments [3].
