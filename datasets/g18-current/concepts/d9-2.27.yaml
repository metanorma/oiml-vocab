    type: accepted
  definition:
  - content: Form of metrological supervision aimed at establishing that a measuring
      instrument in use in the field complies with the statutory requirements.
  examples: []
  id: d9-2.27-eng
  notes:
  - content: Where a conformity assessment of a measuring instrument indicates that
      the findings can be directly related to the responsibilities of manufacturers
      or their representatives, the matter should be dealt with by market surveillance.
  sources:
  - origin:
      ref:
