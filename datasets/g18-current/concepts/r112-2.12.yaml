  definition:
  - content: 'Signal de sortie par unite de concentration du composant de l''echantillon
      dans la phase mobile; il peut etre exprime comme suit: S = (A x F) / M ou: S
      = sensibilite, A = surface integree du composant de l''echantillon, F = debit,
      M = masse du composant de l''echantillon injectee.'
  examples: []
  id: r112-2.12-fra
  notes:
  - content: Un detecteur electrochimique du type coulombien n'obeit pas a cette equation.
