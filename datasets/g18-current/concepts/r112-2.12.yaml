    type: accepted
  definition:
  - content: The output signal per unit concentration of the sample component in the
      mobile phase; it may be expressed as S = (A x F) / M, where S is sensitivity,
      A is the integrated area of the sample component, F is the flow rate, and M
      is the mass of the sample component injected.
  examples: []
  id: r112-2.12-eng
  notes:
  - content: An electrochemical detector of the coulombic type does not follow this
      equation.
