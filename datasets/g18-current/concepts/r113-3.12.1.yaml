  - content: Expressed in A . mL . g^-1 or V . mL . g^-1, and by the equation S =
      (P x F) / M where S = sensitivity, P = the integrated peak area (A . s or V
      . s), F = the carrier gas flow rate (mL . s^-1), M = mass of the sample in the
      carrier gas (g).
