  definition:
  - content: Instrument concu pour mesurer en continu, memoriser et afficher la quantite
      passant a travers le transducteur de mesure.
  examples: []
  id: r81-3.5-fra
  notes:
  - content: Un compteur inclut au moins un transducteur de mesure, un calculateur
      (y compris les dispositifs d'ajustage ou de correction, si presents), un dispositif
      de conversion (si necessaire) et un dispositif indicateur.
