  definition:
  - content: fabricant et/ou représentant autorisé qui soumet une demande d'évaluation
      de type OIML de Base d'un instrument de mesure à une Autorité de délivrance
      OIML en vue d'obtenir un Rapport d'évaluation de type OIML de Base et un Certificat
      OIML de Conformité dit « de Base » pour ce type d'instrument
  examples: []
  id: b3-2.18-fra
  notes:
  - content: Le demandeur devient propriétaire du Certificat au moment où celui-ci
      lui est délivré.
