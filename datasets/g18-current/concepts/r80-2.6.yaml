  - content: Volume indicated (marked) on the tank or its compartment.
  examples: []
  id: r80-2.6-eng
  notes:
  - content: The nominal capacity value usually corresponds to the volume of liquid
      which a tank or compartment contains at reference temperature when filled up
      to the maximum permissible level or volume mark.‟The nominal capacity value
      can be limited by safety regulations.
