data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Cantidad de producto identificado en el preempacado, exceptuando el material
      de empaque.
  examples: []
  id: r79-2.4-spa
  notes:
  - content: "'Material de empaque' incluye las envolturas y cualquier otro material
      empacado con dicho producto. Ver 2.6, Nota 3."
  - content: Este término se relaciona con las especificaciones que van colocadas
      sobre el preempacado y no representa la cantidad real de un preempacado individual.
      En el caso de preempacados con cantidad nominal constante, los procedimientos
      para determinar si un lote de inspección cumple los requisitos reglamentarios
      se encuentran en la Recomendación OIML R 87 [1].
  sources:
  - origin:
      ref:
        source: OIML R 79:2015
        version: '2015'
    type: authoritative
    locality:
      type: clause
      reference_from: '2.4'
