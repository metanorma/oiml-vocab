data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: software means which is added to software or data with the purpose to
      verify the origin of software or data, i.e., to prove their authenticity, or
      to check that the software or data are unchanged, i.e., to prove their integrity
  examples: []
  id: d31-3.2.14-eng
  notes:
  - content: For digital signing, a public key system is used in general, i.e. a pair
      of keys where only one needs to be kept private/secret; the other may be public.
  - content: The private key is used when software or data are secured. The public
      key is used when software or data are verified before use.
  - content: The verifying instance may require a cryptographic certificate of the
      securing instance (see 3.2.9) to be sure of the authenticity of the public key.
  - content: 'A digital signature provides nonrepudiation: the signee cannot deny
      signing the software or data.'
