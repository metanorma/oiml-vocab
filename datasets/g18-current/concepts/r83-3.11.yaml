  definition:
  - content: Closeness of agreement between results of successive measurements of
      the same measurand carried out under the same conditions and within a relative
      short period of time.
  examples: []
  id: r83-3.11-eng
  notes:
  - content: Such conditions include the following - method of measurement, operator,
      measuring instrument, location, and environmental conditions.
