  - content: Organe indiquant l'equilibre et/ou le resultat. Sur un instrument a une
      seule position d'equilibre, il indique uniquement l'equilibre. Sur un instrument
      a plusieurs positions d'equilibre, il indique a la fois l'equilibre et le resultat.
