data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: fault exceeding the applicable fault limit value
  examples: []
  id: r129-2.3.7-eng
  notes:
  - content: 'The following faults are not considered to be significant, even when
      they exceed the value defined above: (a) faults arising from simultaneous and
      mutually independent causes in the measuring instrument itself; (b) faults implying
      the impossibility to perform any measurement; (c) transitory faults being momentary
      variations in the indication, which cannot be interpreted, memorised or transmitted
      as a measurement result; and (d) faults giving rise to variations in the measurement
      result so serious that they are bound to be noticed by all those interested
      in the result of the measurement.'
  sources: []
  terms:
  - type: expression
    normative_status: preferred
    designation: significant fault
  language_code: eng
  entry_status: valid
