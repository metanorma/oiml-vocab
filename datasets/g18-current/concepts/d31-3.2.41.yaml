data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: set of quantity values being attributed to a measurand together with
      any other available relevant data
  examples: []
  id: d31-3.2.41-eng
  notes:
  - content: The measurement result relevant data may consist of e.g. measurement
      uncertainty, date and time of measurement, number of measurement, identification
      of sensor and in the case where price calculation is part of the legally relevant
      software, unit price and price to pay.
  - content: The measurement result (including the measured quantity value according
      to V 2:200:2012) is used for the legally relevant purpose, e.g. conclusion of
      a transaction.
  - content: See Annex C for clarification regarding measurement-related terms.
