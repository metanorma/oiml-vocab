  definition:
  - content: Condition existant dans un matériau irradié par flux ionisant selon laquelle
      les énergies, le nombre et la direction des électrons secondaires induits par
      la radiation sont uniformes dans le volume d'application. Ainsi, pour un certain
      volume, la somme des énergies des électrons secondaires entrant est égale à
      la somme des énergies des électrons secondaires quittant ce volume.
