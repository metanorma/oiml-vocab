data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: caractéristique de performance d'un étalonnage évalué dans des conditions
      de référence
  examples: []
  id: r59-2.3.1-fra
  notes:
  - content: 'Note additionnelle: L''évaluation nécessite le calcul de y-barre, moyenne
      des différences entre les indications de l''humidimètre et la méthode de référence,
      et de l''écart-type des différences (SDD) entre l''humidimètre et la méthode
      de référence pour chacun des intervalles de 2 % d''humidité qui représente l''écart-type
      de l''erreur de mesure au sein du même groupe d''échantillons. Voir le paragraphe
      A.1.2 de la R 59-2, pour le calcul de y-barre et du SDD à partir des valeurs
      mesurées. Les valeurs limites pour y-barre et pour le SDD indiquées à la colonne
      2 du tableau 4.4.1, doivent être respectées pour qu''un étalonnage soit considéré
      comme suffisamment exact.'
