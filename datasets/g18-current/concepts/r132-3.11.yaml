  definition:
  - content: Propriété du résultat de mesure ou de la valeur d'un étalon, d'après
      laquelle il ou elle peut être lié(e) à des références établies, habituellement
      des étalons nationaux ou internationaux, à travers une chaîne ininterrompue
      de comparaisons ayant toutes des incertitudes définies.
