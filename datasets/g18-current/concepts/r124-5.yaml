  definition:
  - content: Grandeur d'influence dont la valeur se situe dans les limites spécifiées
      dans la Recommandation Internationale appropriée, mais en dehors des conditions
      assignées de fonctionnement spécifiées pour l'instrument de mesure
  examples: []
  id: r124-5-fra
  notes:
  - content: Une grandeur d'influence est une perturbation si aucune condition assignée
      de fonctionnement n'est spécifiée pour cette grandeur d'influence
