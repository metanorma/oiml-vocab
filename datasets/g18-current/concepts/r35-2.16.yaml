data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Defaut dont l'amplitude est supérieure au cinquième de l'amplitude de
      l'erreur maximale tolérée pour la longueur mesurée.
  examples: []
  id: r35-2.16-fra
  notes:
  - content: 'Les défauts suivants ne sont pas considérés comme significatifs, même
      en cas de dépassement de la valeur définie ci-dessus : a) défauts provenant
      de causes simultanées et mutuellement indépendantes dans le dispositif électronique
      ; b) défauts rendant impossible la réalisation de toute mesure ; c) défauts
      transitoires consistant en des variations momentanées des indications qui ne
      peuvent être interprétées, mises en mémoire ou transmises en tant que résultats
      de mesure ; d) défauts provoquant des variations des résultats de mesure si
      importantes qu''elles ne peuvent qu''être remarquées par toutes les parties
      intéressées par le résultat du mesurage.'
  sources:
  - origin:
