data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: Fehler, dessen Größenordnung höher ist als ein Fünftel der Größenordnung
      der Fehlergrenze für die gemessene Länge.
  examples: []
  id: r35-2.16-deu
  notes:
  - content: 'Die folgenden Fehler werden als nicht significant betrachtet, auch wenn
      sie den oben festgelegten Wert überschreiten: a) Fehler, die durch gleichzeitig
      und voneinander unabhängig auftretende Ursachen im elektronischen Gerät entstehen;
      b) Fehler, die jede Messung unmöglich machen; c) auf momentane Abweichungen
      zurückzuführende vorübergehende Fehler, die nicht als Messergebnis gedeutet,
      gespeichert oder übermittelt werden können; d) Fehler, bei denen beim Messergebnis
      Schwankungen auftreten, die so gravierend sind, dass sie von allen am Messergebnis
      Interessierten wahrgenommen werden.'
  sources:
  - origin:
      ref:
        source: OIML R 35-2:2011
        version: '2011'
