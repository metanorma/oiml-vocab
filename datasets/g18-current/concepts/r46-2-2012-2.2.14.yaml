  definition:
  - content: rapport de la puissance active sur la puissance apparente
  examples: []
  id: r46-2-2012-2.2.14-fra
  notes:
  - content: Dans des conditions sinusoïdales et soit en phase, soit en triphasé symétrique,
      le facteur de puissance = cos Phi = le cosinus de la différence de phase Phi
      entre la tension U et le courant I.
