  - content: différence entre la quantité effective de produit dans un préemballage
      et la quantité nominale de ce préemballage
  examples: []
  id: r87-2.1.2.2-fra
  notes:
  - content: 'L''erreur de préemballage individuel pour un préemballage « i » est
      désignée par le symbole E_i ou e_i et peut être calculée comme suit : E_i=Q_i-Q_nom
      ou e_i=q_i-Q_nom avec Q_nom comme quantité nominale.'
