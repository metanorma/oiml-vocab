data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: difference between the actual quantity of product in a prepackage and
      the nominal quantity of that prepackage
  examples: []
  id: r87-2.1.2.2-eng
  notes:
  - content: The individual prepackage error for a prepackage "i" is designated by
      the symbol $E_{\mathrm{i}}$ or $e_{\mathrm{i}}$ and can be calculated by $E_{\mathrm{i}}=Q_{\mathrm{i}}-Q_{\mathrm{nom}}$
      or by $e_{\mathrm{i}}=q_{\mathrm{i}}-Q_{\mathrm{nom}}$ where $Q_{\mathrm{nom}}$
      is the nominal quantity.
  sources:
  - origin:
      ref:
        source: OIML R 87:2016
        version: '2016'
    locality:
      type: clause
      reference_from: 2.1.2.2
    type: authoritative
  terms:
  - type: expression
    normative_status: preferred
    designation: individual prepackage error
  language_code: eng
  entry_status: valid
