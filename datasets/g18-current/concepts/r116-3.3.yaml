  definition:
  - content: Tube, wound around the outer quartz tube of the torch, through which
      the r.f. energy is transmitted to the argon.
  examples: []
  id: r116-3.3-eng
  notes:
  - content: This coil is generally water-cooled, consists of 3 or 4 turns, and is
      constructed of a copper tube that may be plated with silver or gold and is also
      known as the load coil.
