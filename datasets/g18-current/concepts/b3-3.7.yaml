data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: examen et essai systématiques des performances d'un ou de plusieurs exemplaires
      d'un type identifié d'instrument de mesure par rapport à des exigences documentées
      et dont le résultat est contenu dans un rapport d'évaluation afin de déterminer
      si le type peut être approuvé
  examples: []
  id: b3-3.7-fra
  notes:
  - content: Les instruments de mesure peuvent, dans le cas présent, inclure des modules
      tels que définis dans 3.4.
  - content: Dans la présente Publication, le mot « certifié » s'entend au sens de
      « conformité avec la Recommandation OIML applicable » (par ex. type certifié).
  - content: Les rapports d'évaluation contiennent un (ou plusieurs) Rapport d'essai
      tel que défini en 3.14. Il est à noter que le TC 1 envisage de remplacer la
      définition de « Évaluation de type » figurant dans le VIML dans les termes suivants
      « procédure d'évaluation de la conformité d'un ou plusieurs exemplaires d'un
      type identifié d'instrument de mesure conduisant à l'établissement d'un rapport
      d'évaluation et/ou d'un certificat d'évaluation ».
  sources: []
