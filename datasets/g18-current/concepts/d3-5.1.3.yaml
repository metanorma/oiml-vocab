data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: On entend par jaugeage des récipients-mesures l'ensemble des opérations
      effectuées en vue de déterminer la capacité de ces récipients-mesures jusqu'à
      un ou plusieurs niveaux de remplissage. Cette procédure est assimilable à la
      vérification primitive.
  examples: []
  id: d3-5.1.3-fra
  notes:
  - content: Les récipients utilisés pour le stockage, le transport ou la livraison
      d'un liquide peuvent servir au mesurage de ce liquide lorsqu'ils sont spécialement
      adaptés à l'usage auquel ils sont destinés et possèdent les qualités métrologiques
      exigées par la réglementation. Ces récipients sont alors dénommés "récipients-mesures".
  sources:
