  definition:
  - content: Valeur numérique, représentant un poids, qui est introduite dans l'instrument
      et qui est destinée à être appliquée à d'autres pesées sans déterminer des tares
      individuelles.
  examples: []
  id: r76-T.5.3.1-fra
  notes:
  - content: 'Le mot «introduite» couvre toute procédure comme, par exemple : la tabulation,
      le rappel depuis un stockage de données, ou l''introduction via une interface.'
