  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: The relative voltage-measurement error is the difference between the
      voltage recorded by an electroencephalograph and the voltage applied to its
      input (whose reference value is taken as a conventional true value), divided
      by the input voltage.
  examples: []
  id: r89-5.3.1-eng
  notes: []
