  definition:
  - content: L'erreur relative de mesure de la tension est la différence entre la
      tension mesurée par l'électroencéphalographe et la tension appliquée à son entrée
      (dont la valeur de référence est prise comme valeur conventionnellement vraie),
      divisée par la tension d'entrée.
