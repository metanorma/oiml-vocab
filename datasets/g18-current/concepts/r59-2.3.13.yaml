  definition:
  - content: écart de mesure (par rapport aux valeurs d'humidités relevées dans les
      conditions de référence) résultant de l'étendue de température de l'échantillon
      de grain autorisée pour les mesures commerciales
  examples: []
  id: r59-2.3.13-fra
  notes:
  - content: La STS se contrôle par des étalonnages de la teneur en eau approuvés.
      Pendant la mesure, la valeur de la dérive de l'erreur moyenne résultant des
      variations admises de température est plafonnée.
  sources:
  - origin:
      ref:
        source: OIML R 59-1:2016
        version: '2016'
    locality:
      type: clause
      reference_from: 2.3.13
    type: authoritative
  terms:
  - type: expression
    normative_status: preferred
    designation: sensibilité de l'échantillon à la température (STS)
  language_code: fra
  entry_status: valid
