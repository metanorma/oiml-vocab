    type: accepted
  definition:
  - content: highest flow rate (3.3.1) at which the meter is to operate for a short
      period of time, within the maximum permissible error(s) (3.2.5), while maintaining
      its metrological performance when it is subsequently operating within the rated
      operating condition(s) (3.4.4)
  examples: []
  id: r49-3.3.3-eng
  notes:
  - content: The definition of short period of time can vary between economies and/or
      applications, but for example 2 hours in a 24 hours period.
