    type: accepted
  definition:
  - content: grandeur d'influence dont la valeur se situe dans les limites spécifiées
      dans la Recommandation applicable, mais en dehors des conditions assignées de
      fonctionnement spécifiées de l'instrument de mesure.
  examples: []
  id: d11-3.15.2-fra
  notes:
  - content: Ces limites spécifiées dans la Recommandation applicable, doivent être
      basées sur la probabilité d'occurrence du phénomène perturbant dans l'environnement
      de l'instrument de mesure.
  - content: Une perturbation est typiquement de nature stochastique.
  - content: Dans le cas où les conditions assignées de fonctionnement listées d'un
      instrument de mesure n'incluent pas une plage pour la grandeur d'influence spécifique,
      la grandeur spécifique est qualifiée comme étant une perturbation.
