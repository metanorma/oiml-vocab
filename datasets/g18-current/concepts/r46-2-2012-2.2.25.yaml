  definition:
  - content: grandeur d'influence dont la valeur se situe dans les limites spécifiées
      dans la présente Recommandation, mais en dehors des conditions assignées de
      fonctionnement d'un instrument de mesure
  examples: []
  id: r46-2-2012-2.2.25-fra
