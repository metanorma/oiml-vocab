    type: accepted
  definition:
  - content: Etroitesse de l'accord entre les resultats des mesurages successifs du
      meme echantillon par le meme instrument, dans des conditions d'utilisation definies
      identiques et dans un intervalle de temps relativement court.
  examples: []
  id: r123-3.5-fra
  notes:
  - content: 'Les conditions definies identiques devraient inclure: la methode de
      mesurage, l''instrument de mesure, l''operateur, le lieu et les conditions environnementales
      ambiantes.'
