data:
  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: device intended to perform a particular function, directly involved in
      elaborating, transmitting or displaying measurement results
  examples: []
  id: r129-2.1.5-eng
  notes:
  - content: An ancillary device may or may not be subject to legal metrological control
      according to its function in the measuring system or to national regulations.
  - content: 'Main ancillary devices are: - zero-setting device; - repeating indicating
      device; - printing device; - memory device; - price indicating device; - totalising
      indicating device; - pre-setting device; - self-service device.'
