    type: accepted
  definition:
  - content: Einrichtung zur Durchführung einer bestimmten Funktion, die direkt an
      der Ermittlung, Übertragung oder Anzeige der Messergebnisse beteiligt ist
  examples: []
  id: r129-2.1.5-deu
  notes:
  - content: Eine Hilfseinrichtung kann in Abhängigkeit von ihrer Funktion im Messsystem
      gesetzlichen messtechnischen Kontrollen oder nationalen Vorschriften unterliegen.
  - content: 'Wesentliche Hilfseinrichtungen sind: Nullstelleinrichtung; Wiederholanzeigeeinrichtung;
      Druckeinrichtung; Speichereinrichtung; Preisanzeigeeinrichtung; Summenanzeigeeinrichtung;
      Voreinstelleinrichtung; Selbstbedienungseinrichtung.'
