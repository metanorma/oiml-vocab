    type: accepted
  definition:
  - content: 'Pour les bouteilles récipients-mesures et les tonneaux: volume contenu
      d''eau à la température de référence ayant une incertitude appropriée pour l''application
      considérée. Pour les mesures de capacité de service: volume délivré d''eau à
      la température de référence ayant une incertitude appropriée pour l''application
      considérée. Ce volume est mesuré après un mouillage préalable de l''intérieur
      du récipient ainsi qu''un égouttage de 30 secondes.'
  examples: []
  id: r138-2.6-fra
