  definition:
  - content: Le taux de réjection en mode commun est le rapport de l'amplitude crête
      à crête d'un signal en phase appliqué à l'entrée de l'EST à l'amplitude crête
      à crête d'un signal à contre-phase qui produit la même amplitude crête à crête
      du signal enregistré.
