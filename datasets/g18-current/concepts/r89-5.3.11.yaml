  dates:
  - date: '2026-07-13T00:00:00+00:00'
    type: accepted
  definition:
  - content: The common-mode rejection ratio is the ratio of the peak-to-peak amplitude
      of an in-phase signal applied at the input of the EUT to the peak-to-peak amplitude
      of an out-of-phase signal that results in the same peak-to-peak amplitude of
      the recorded signal.
