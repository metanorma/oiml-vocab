description:
  eng: "First edition of the International Vocabulary of Basic and General Terms in Metrology (VIM), jointly prepared by BIPM, IEC, ISO and OIML. Superseded by the 1993 second edition (which split several concepts and renumbered). 138 concepts across 6 chapters covering quantities and units, measurements, measurement results, measuring instruments, characteristics of measuring instruments, and measurement standards. Identical text published by ISO as ISO Guide 99:1984. A corrigendum was issued in 1987 (see OIML V 2:1984/Cor.1:1987)."
  fra: "Première édition du Vocabulaire international des termes fondamentaux et généraux de métrologie (VIM), élaborée conjointement par le BIPM, la CEI, l'ISO et l'OIML. Remplacée par la deuxième édition de 1993 (qui a scindé plusieurs concepts et renuméroté). 138 concepts en 6 chapitres couvrant les grandeurs et unités, les mesurages, les résultats de mesure, les instruments de mesure, les caractéristiques des instruments de mesure et les étalons. Texte identique publié par l'ISO sous la référence ISO Guide 99:1984. Un corrigendum a été publié en 1987 (voir OIML V 2:1984/Cor.1:1987)."

