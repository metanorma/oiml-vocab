data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      Méthode de mesure dans laquelle la valeur d'une grandeur à mesurer est obtenue
      directement, plutôt que par mesurage d'autres grandeurs liées fonctionnellement
      à la grandeur à mesurer.
  id: 2.13-fra
  language_code: fra
  notes:
  - content: >-
      La méthode de mesure reste directe même s'il est nécessaire d'exécuter des
      mesurages supplémentaires pour déterminer les valeurs des grandeurs d'influence
      en vue d'effectuer les corrections correspondantes.
  examples:
  - content: a) mesurage d'une longueur à l'aide d'une règle graduée;
  - content: b) mesurage d'une masse à l'aide d'une balance à bras égaux.
  terms:
  - type: expression
    normative_status: preferred
    designation: méthode de mesure directe
    grammar_info:
    - gender: f
date_accepted: '1984-01-01T00:00:00+00:00'
entry_status: valid
