data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      A method of measurement in which the value of a measurand is obtained directly,
      rather than by measurement of other quantities functionally related to the
      measurand.
  id: 2.13-eng
  language_code: eng
  notes:
  - content: >-
      The method of measurement remains direct even if it is necessary to make
      supplementary measurements to determine the values of influence quantities
      in order to make corresponding corrections.
  examples:
  - content: a) measurement of a length using a graduated rule;
  - content: b) measurement of a mass using an equal-arm balance.
  terms:
  - type: expression
    normative_status: preferred
    designation: direct method of measurement
date_accepted: '1984-01-01T00:00:00+00:00'
entry_status: valid
