  definition:
  - content: >-
      A series of elements of a measuring instrument or system which constitutes
      the path of the measurement signal from the input to the output.
  id: 4.04-eng
  language_code: eng
  examples:
  - content: >-
      an electro-acoustic measuring chain comprising a microphone, attenuator,
      filter, amplifier and voltmeter.
  terms:
  - type: expression
    normative_status: preferred
    designation: measuring chain
