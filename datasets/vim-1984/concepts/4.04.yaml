  definition:
  - content: >-
      Suite d'éléments d'un appareil de mesure ou d'un système de mesure qui constitue
      le chemin du signal de mesure depuis l'entrée jusqu'à la sortie.
  id: 4.04-fra
  language_code: fra
  examples:
  - content: >-
      une chaîne de mesure électroacoustique comprenant un microphone, un atténuateur,
      un filtre, un amplificateur et un voltmètre.
