data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: For a given scale, the range of scale values between the extreme scale marks.
  id: 4.21-eng
  language_code: eng
  notes:
  - content: >-
      The scale range is expressed in the units marked on the scale, regardless
      of the units of the measurand, and is normally stated in terms of its lower
      and upper limits, for example 100 °C to 200 °C.
  terms:
  - type: expression
    normative_status: preferred
    designation: scale range
