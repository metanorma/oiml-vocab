  definition:
  - content: >-
      A larger unit of measurement which is formed from a given unit according to
      scaling conventions.
  id: 1.15-eng
  language_code: eng
  examples:
  - content: a) one of the decimal multiples of the metre is the kilometre;
  - content: b) one of the non-decimal multiples of the second is the hour.
  terms:
  - type: expression
    normative_status: preferred
    designation: multiple of a unit (of measurement)
