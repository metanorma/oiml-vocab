  definition:
  - content: >-
      Unité de mesure plus grande formée à partir d'une unité donnée selon des conventions
      d'échelonnement.
  id: 1.15-fra
  language_code: fra
  examples:
  - content: a) l'un des multiples décimaux du mètre est le kilomètre;
  - content: b) l'un des multiples non décimaux de la seconde est l'heure.
  terms:
  - type: expression
    normative_status: preferred
    designation: "multiple d'une unité (de mesure)"
