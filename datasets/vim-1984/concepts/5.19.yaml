  definition:
  - content: >-
      Intervalle de temps compris entre le moment où un signal d'entrée subit
      un changement brusque spécifié et le moment où le signal de sortie atteint,
      dans des limites spécifiées, sa valeur finale en régime établi et s'y maintient.
