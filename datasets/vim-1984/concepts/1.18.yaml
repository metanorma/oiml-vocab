data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      Valeur qui caractérise une grandeur parfaitement définie, dans les conditions
      qui existent lorsque cette grandeur est considérée.
  id: 1.18-fra
  language_code: fra
  notes:
  - content: >-
      La valeur vraie d'une grandeur est une notion idéale et, en général, ne peut
      être connue exactement. L'existence même d'une unique valeur vraie peut être
      exclue par effet quantique.
  terms:
  - type: expression
    normative_status: preferred
    designation: valeur vraie (d'une grandeur)
    grammar_info:
    - gender: f
date_accepted: '1984-01-01T00:00:00+00:00'
entry_status: valid
