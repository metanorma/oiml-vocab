data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      A material measure, measuring instrument or system intended to define, realize,
      conserve or reproduce a unit or one or more known values of a quantity in
      order to transmit them to other measuring instruments by comparison.
  id: 6.01-eng
  language_code: eng
  examples:
  - content: a) 1 kg mass standard;
  - content: b) standard gauge block;
  - content: c) 100 Ω standard resistor;
  - content: d) saturated Weston standard cell;
  - content: e) standard ammeter;
  - content: f) caesium atomic frequency standard.
  terms:
  - type: expression
    normative_status: preferred
    designation: measurement standard
  - type: expression
    normative_status: admitted
    designation: etalon
