  definition:
  - content: >-
      Conditions of use giving the ranges of the measurand and of the influence
      quantities, and other important requirements, for which the metrological
      characteristics of a measuring instrument are intended to lie within specified
      limits.
  id: 5.05-eng
  language_code: eng
  notes:
  - content: >-
      The rated operating conditions generally specify rated values of the measurand
      and of the influence quantities.
  terms:
  - type: expression
    normative_status: preferred
    designation: rated operating conditions
