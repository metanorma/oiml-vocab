data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      The set of operations which establish, under specified conditions, the relationship
      between values indicated by a measuring instrument or measuring system, or
      values represented by a material measure, and the corresponding known values
      of a measurand.
  id: 6.13-eng
  language_code: eng
  notes:
  - content: >-
      The result of a calibration permits the estimation of errors of indication
      of the measuring instrument, measuring system or material measure, or the
      assignment of values to marks on arbitrary scales.
  - content: A calibration may also determine other metrological properties.
  - content: >-
      The result of a calibration may be recorded in a document, sometimes called
      a calibration certificate or a calibration report.
  - content: >-
      The result of a calibration is sometimes expressed as a calibration factor,
      or as a series of calibration factors in the form of a calibration curve.
  terms:
  - type: expression
    normative_status: preferred
    designation: calibration
date_accepted: '1984-01-01T00:00:00+00:00'
entry_status: valid
