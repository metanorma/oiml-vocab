data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      Ensemble des opérations établissant, dans des conditions spécifiées, la relation
      entre les valeurs indiquées par un appareil de mesure ou un système de mesure,
      ou les valeurs représentées par une mesure matérialisée, et les valeurs connues
      correspondantes d'une grandeur mesurée.
  id: 6.13-fra
  language_code: fra
  notes:
  - content: >-
      Le résultat d'un étalonnage permet d'estimer les erreurs d'indication de
      l'appareil de mesure, du système de mesure ou de la mesure matérialisée,
      ou d'affecter des valeurs à des repères sur des échelles arbitraires.
  - content: Un étalonnage peut aussi déterminer d'autres propriétés métrologiques.
  - content: >-
      Le résultat d'un étalonnage peut être consigné dans un document, parfois
      appelé certificat d'étalonnage ou rapport d'étalonnage.
  - content: >-
      Le résultat d'un étalonnage est parfois exprimé sous la forme d'un facteur
      d'étalonnage ou d'une série de facteurs d'étalonnage sous la forme d'une
      courbe d'étalonnage.
  terms:
  - type: expression
    normative_status: preferred
    designation: étalonnage
    grammar_info:
    - gender: m
date_accepted: '1984-01-01T00:00:00+00:00'
