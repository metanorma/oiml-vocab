data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: |-
      For a series of n measurements of the same measurand, the parameter s
      characterizing the dispersion of the results and given by the formula:

      s = sqrt((sum_(i=1)^n (x_i - bar x)^2)/(n - 1))

      x_i being the result of the ith measurement and bar x being the arithmetic
      mean of the n results considered.
  id: 3.08-eng
  language_code: eng
  notes:
  - content: |-
      The experimental standard deviation should not be confused with the
      population standard deviation sigma of a population of size N and of mean
      m, given by the formula:

      sigma = sqrt((sum_(i=1)^N (x_i - m)^2)/N)
  - content: >-
      Considering the series of n measurements as a sample of a population, s is
      an estimate of the population standard deviation.
  - content: >-
      The expression s/sqrt(n) provides an estimate of the standard deviation of
      the arithmetic mean bar x with respect to the mean m of the overall population.
      The expression s/sqrt(n) is called the experimental standard deviation of
      the mean.
  terms:
  - type: expression
    normative_status: preferred
    designation: experimental standard deviation
date_accepted: '1984-01-01T00:00:00+00:00'
