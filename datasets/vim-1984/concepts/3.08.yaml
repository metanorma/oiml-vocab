data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: |-
      Pour une série de n mesurages du même mesurande, paramètre s caractérisant
      la dispersion des résultats, donné par la formule:

      s = sqrt((sum_(i=1)^n (x_i - bar x)^2)/(n - 1))

      x_i étant le résultat du ième mesurage et bar x la moyenne arithmétique des
      n résultats considérés.
  id: 3.08-fra
  language_code: fra
  notes:
  - content: |-
      L'écart-type expérimental ne doit pas être confondu avec l'écart-type sigma
      d'une population d'effectif N et de moyenne m, donné par la formule:

      sigma = sqrt((sum_(i=1)^N (x_i - m)^2)/N)
  - content: >-
      En considérant la série de n mesurages comme échantillon d'une population,
      s est une estimation de l'écart-type de la population.
  - content: >-
      L'expression s/sqrt(n) fournit une estimation de l'écart-type de la moyenne
      arithmétique bar x par rapport à la moyenne m de la population globale. L'expression
      s/sqrt(n) est appelée écart-type expérimental de la moyenne.
  terms:
  - type: expression
    normative_status: preferred
    designation: écart-type expérimental
    grammar_info:
    - gender: m
