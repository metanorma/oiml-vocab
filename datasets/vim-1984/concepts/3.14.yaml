  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      The value which, added algebraically to the uncorrected result of a measurement,
      compensates for an assumed systematic error.
  id: 3.14-eng
  language_code: eng
  notes:
  - content: The correction is equal to the assumed systematic error, but of opposite sign.
  - content: >-
      Since the systematic error cannot be known exactly, the correction is subject
      to uncertainty.
  terms:
  - type: expression
    normative_status: preferred
    designation: correction
