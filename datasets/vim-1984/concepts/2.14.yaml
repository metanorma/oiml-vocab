    type: accepted
  definition:
  - content: >-
      Méthode de mesure dans laquelle la valeur d'une grandeur à mesurer est obtenue
      à partir de mesurages d'autres grandeurs liées fonctionnellement à la grandeur
      à mesurer.
  id: 2.14-fra
  language_code: fra
  examples:
  - content: a) mesurage d'une pression par mesurage de la hauteur d'une colonne de liquide;
  - content: b) mesurage d'une température avec un thermomètre à résistance.
  terms:
  - type: expression
    normative_status: preferred
    designation: méthode de mesure indirecte
    grammar_info:
    - gender: f
