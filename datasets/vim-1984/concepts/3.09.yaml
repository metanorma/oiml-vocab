data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      Estimation caractérisant l'étendue des valeurs dans laquelle se situe la
      valeur vraie d'une grandeur mesurée.
  id: 3.09-fra
  language_code: fra
  notes:
  - content: >-
      L'incertitude de mesure comprend, en général, plusieurs composantes. Certaines
      peuvent être estimées en se fondant sur la distribution statistique des résultats
      de séries de mesurages et peuvent être caractérisées par un écart-type expérimental.
      L'estimation des autres composantes ne peut être fondée que sur l'expérience
      ou sur d'autres informations.
  terms:
  - type: expression
    normative_status: preferred
    designation: incertitude de mesure
    grammar_info:
    - gender: f
