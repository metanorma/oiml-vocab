    type: accepted
  definition:
  - content: >-
      An estimate characterizing the range of values within which the true value
      of a measurand lies.
  id: 3.09-eng
  language_code: eng
  notes:
  - content: >-
      Uncertainty of measurement comprises, in general, many components. Some of
      these components may be estimated on the basis of the statistical distribution
      of the results of series of measurements and can be characterized by experimental
      standard deviations. Estimates of other components can only be based on experience
      or other information.
  terms:
  - type: expression
    normative_status: preferred
    designation: uncertainty of measurement
