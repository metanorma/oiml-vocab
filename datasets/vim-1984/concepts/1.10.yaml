data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      Système cohérent d'unités adopté et recommandé par la Conférence générale
      des poids et mesures (CGPM).
  id: 1.10-fra
  language_code: fra
  notes:
  - content: >-
      Le SI est fondé actuellement sur les sept unités de base suivantes : le mètre,
      unité de longueur ; le kilogramme, unité de masse ; la seconde, unité de temps
      ; l'ampère, unité d'intensité de courant électrique ; le kelvin, unité de
      température thermodynamique ; la mole, unité de quantité de matière ; la candela,
      unité d'intensité lumineuse.
  terms:
  - type: expression
    normative_status: preferred
    designation: "Système international d'unités, SI"
    grammar_info:
    - gender: m
