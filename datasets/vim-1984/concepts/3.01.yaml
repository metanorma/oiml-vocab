data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: Valeur d'une grandeur mesurée, obtenue par mesurage.
  id: 3.01-fra
  language_code: fra
  notes:
  - content: >-
      Lorsqu'on utilise le terme « résultat d'un mesurage », on indiquera clairement
      si l'on se réfère : à l'indication, au résultat brut, au résultat corrigé,
      et si cela comporte une moyenne effectuée à partir de plusieurs observations.
  - content: >-
      Une expression complète du résultat d'un mesurage comprend des informations
      sur l'incertitude de mesure et sur les valeurs des grandeurs d'influence
      appropriées.
  terms:
  - type: expression
    normative_status: preferred
    designation: résultat d'un mesurage
    grammar_info:
    - gender: m
