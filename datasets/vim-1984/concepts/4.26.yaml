  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      A scale in which each scale spacing is related to the corresponding scale
      interval by a coefficient of proportionality which is not constant throughout
      the scale.
  id: 4.26-eng
  language_code: eng
  notes:
  - content: >-
      Some non-linear scales are given special names such as logarithmic scale,
      square-law scale.
  terms:
  - type: expression
    normative_status: preferred
    designation: non-linear scale
