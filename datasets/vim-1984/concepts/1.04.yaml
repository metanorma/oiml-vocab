  definition:
  - content: >-
      Expression qui représente une grandeur d'un système de grandeurs comme le
      produit de puissances des grandeurs de base de ce système.
  id: 1.04-fra
  language_code: fra
  examples:
  - content: >-
      LMT^{-2} est la dimension de la force dans le système des grandeurs longueur,
      masse, temps (l, m, t).
