  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      An expression which represents a quantity of a system of quantities as the
      product of powers of the base quantities of the system.
  id: 1.04-eng
  language_code: eng
  examples:
  - content: >-
      LMT^{-2} is the dimension of force in the system of quantities length, mass
      and time (l, m, t).
  terms:
  - type: expression
    normative_status: preferred
    designation: dimension of a quantity
