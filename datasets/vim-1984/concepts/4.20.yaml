data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      For a given scale, the length of the line between the first and the last
      scale marks and passing through the centres of all the shortest scale marks.
  id: 4.20-eng
  language_code: eng
  notes:
  - content: The line may be real or imaginary, curved or straight.
  - content: >-
      Scale length is expressed in units of length regardless of the units of the
      measurand or the units marked on the scale.
  terms:
  - type: expression
    normative_status: preferred
    designation: scale length
date_accepted: '1984-01-01T00:00:00+00:00'
