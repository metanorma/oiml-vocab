data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      Pour une échelle donnée, longueur de la ligne comprise entre le premier et
      le dernier repère et passant par les milieux de tous les traits les plus
      petits.
  id: 4.20-fra
  language_code: fra
  notes:
  - content: La ligne peut être réelle ou imaginaire, courbe ou droite.
  - content: >-
      La longueur d'échelle est exprimée en unité de longueur quelle que soit l'unité
      de la grandeur à mesurer ou l'unité marquée sur l'échelle.
  terms:
  - type: expression
    normative_status: preferred
    designation: longueur d'échelle
    grammar_info:
    - gender: f
date_accepted: '1984-01-01T00:00:00+00:00'
