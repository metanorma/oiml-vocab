  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      A measuring instrument which provides a record (permanent or semi-permanent)
      of the value of a measurand or a related value.
  id: 4.07-eng
  language_code: eng
  notes:
  - content: The record may be analogue (continuous or discontinuous line) or digital.
  - content: Values of more than one quantity may be recorded simultaneously.
  - content: A recording measuring instrument may also incorporate an indicating device.
  examples:
  - content: a) barograph;
  - content: b) thermoluminescent dosimeter.
  terms:
  - type: expression
    normative_status: preferred
    designation: recording (measuring) instrument
date_accepted: '1984-01-01T00:00:00+00:00'
