  definition:
  - content: >-
      Composante de l'erreur de mesure qui, lors de plusieurs mesurages du même
      mesurande, reste constante ou varie d'une façon prévisible.
  id: 3.13-fra
  language_code: fra
  notes:
  - content: Les erreurs systématiques et leurs causes peuvent être connues ou inconnues.
  - content: Pour un instrument de mesure, voir « erreur de justesse ».
