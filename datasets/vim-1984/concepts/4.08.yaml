    type: accepted
  definition:
  - content: >-
      Appareil de mesure qui détermine la valeur d'une grandeur à mesurer en faisant
      la somme de valeurs partielles de cette grandeur obtenues simultanément ou
      consécutivement d'une ou de plusieurs sources.
  id: 4.08-fra
  language_code: fra
  examples:
  - content: appareil de mesure totalisateur de puissance électrique.
  terms:
  - type: expression
    normative_status: preferred
    designation: "appareil (de mesure) totalisateur"
