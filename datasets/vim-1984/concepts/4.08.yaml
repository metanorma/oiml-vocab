    type: accepted
  definition:
  - content: >-
      A measuring instrument which determines the value of a measurand by summation
      of partial values of the measurand obtained simultaneously or consecutively
      from one or more sources.
  id: 4.08-eng
  language_code: eng
  examples:
  - content: electrical power summation-meter.
  terms:
  - type: expression
    normative_status: preferred
    designation: totalizing (measuring) instrument
