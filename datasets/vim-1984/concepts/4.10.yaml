data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      Appareil de mesure pour lequel le signal de sortie ou l'affichage est une
      fonction continue de la valeur de la grandeur mesurée.
  id: 4.10-fra
  language_code: fra
  notes:
  - content: >-
      Ce terme s'applique à la forme de présentation des signaux de sortie ou de
      l'affichage, non au principe de fonctionnement de l'instrument.
  examples:
  - content: a) voltmètre à cadre mobile;
  - content: b) thermomètre à mercure en verre;
  - content: c) manomètre à tube de Bourdon.
  terms:
  - type: expression
    normative_status: preferred
    designation: appareil de mesure analogique
    grammar_info:
    - gender: m
date_accepted: '1984-01-01T00:00:00+00:00'
entry_status: valid
