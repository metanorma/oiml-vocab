data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      Attribut d'un phénomène, d'un corps ou d'une substance, qui est susceptible
      d'être distingué qualitativement et déterminé quantitativement.
  id: 1.01-fra
  language_code: fra
  notes:
  - content: >-
      Le terme « grandeur » peut se rapporter à une grandeur dans un sens général
      [voir exemples a)] ou à une grandeur déterminée [voir exemples b)].
    examples:
    - content: >-
        grandeurs dans un sens général : longueur, temps, masse, température, résistance
        électrique
    - content: >-
        grandeurs déterminées : longueur d'une tige particulière, résistance électrique
        d'un fil particulier
  - content: >-
      Les grandeurs qui sont mutuellement comparables peuvent être classées en catégories
      de grandeurs, par exemple : travail, chaleur, énergie ; épaisseur, circonférence,
      longueur d'onde.
  - content: Des symboles de grandeurs sont donnés dans la norme ISO 31.
  terms:
  - type: expression
    normative_status: preferred
    designation: "grandeur (mesurable)"
    grammar_info:
    - gender: f
date_accepted: '1984-01-01T00:00:00+00:00'
