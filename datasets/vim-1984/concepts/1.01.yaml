data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      An attribute of a phenomenon, body or substance, which may be distinguished
      qualitatively and determined quantitatively.
  id: 1.01-eng
  language_code: eng
  notes:
  - content: >-
      The term "quantity" may refer to a quantity in a general sense [see examples
      a)] or to a specific quantity [see examples b)].
    examples:
    - content: >-
        quantities in a general sense: length, time, mass, temperature, electrical
        resistance
    - content: >-
        specific quantities: length of a particular rod, electrical resistance of
        a particular wire
  - content: >-
      Quantities which are mutually comparable may be grouped together into categories
      of quantities, for example: work, heat, energy; thickness, circumference, wavelength.
  - content: Symbols for quantities are given in ISO 31.
  terms:
  - type: expression
    normative_status: preferred
    designation: "(measurable) quantity"
date_accepted: '1984-01-01T00:00:00+00:00'
entry_status: valid
id: f4be0cf0-f362-4821-9169-23fca36b4391
