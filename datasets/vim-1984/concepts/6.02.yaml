data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      Ensemble de mesures matérialisées ou d'appareils de mesure semblables associés
      pour remplir en commun le rôle d'étalon.
  id: 6.02-fra
  language_code: fra
  notes:
  - content: "Un étalon collectif est habituellement destiné à fournir une valeur unique d'une grandeur."
  - content: >-
      La valeur fournie par un étalon collectif est une moyenne appropriée des
      valeurs fournies par les divers instruments.
  examples:
  - content: a) étalon collectif de tension électrique composé d'un groupe de piles Weston;
  - content: >-
      b) étalon collectif d'intensité lumineuse composé d'un groupe de lamps à
      incandescence similaires.
  terms:
  - type: expression
    normative_status: preferred
    designation: étalon collectif
    grammar_info:
    - gender: m
date_accepted: '1984-01-01T00:00:00+00:00'
entry_status: valid
