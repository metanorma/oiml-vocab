    type: accepted
  definition:
  - content: >-
      Distance entre deux repères successifs quelconques mesurée le long de la
      même ligne que pour la longueur d'échelle.
  id: 4.23-fra
  language_code: fra
  notes:
  - content: >-
      La longueur d'une division est exprimée en unité de longueur, quelle que
      soit l'unité de la grandeur à mesurer ou l'unité marquée sur l'échelle.
  terms:
  - type: expression
    normative_status: preferred
    designation: longueur d'une division
