  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: A set of units established for a given system of quantities.
  id: 1.08-eng
  language_code: eng
  notes:
  - content: >-
      A system of units comprises a set of chosen base units, together with derived
      units determined by their defining equations and proportionality factors.
  examples:
  - content: a) International System of Units, SI;
  - content: b) CGS system of units.
  terms:
  - type: expression
    normative_status: preferred
    designation: system of units (of measurement)
