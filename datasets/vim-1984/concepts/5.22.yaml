  definition:
  - content: >-
      A class of measuring instruments which meet certain metrological requirements
      that are intended to keep errors within specified limits.
  id: 5.22-eng
  language_code: eng
  notes:
  - content: >-
      An accuracy class is usually denoted by a number or symbol adopted by convention
      and called the class index.
