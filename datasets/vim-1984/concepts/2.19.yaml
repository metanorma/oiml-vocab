  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      A method of measurement in which the measurand is compared with a quantity
      of the same kind, of known value only slightly different from the value of
      the measurand, and in which the difference between the two values is measured.
  id: 2.19-eng
  language_code: eng
  examples:
  - content: measurement of the diameter of a piston by means of gauge blocks and a comparator.
  terms:
  - type: expression
    normative_status: preferred
    designation: differential method of measurement
