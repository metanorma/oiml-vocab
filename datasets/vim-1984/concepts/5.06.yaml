    type: accepted
  definition:
  - content: >-
      The extreme conditions which a measuring instrument can withstand without
      damage and without degradation of its metrological characteristics when
      it is subsequently operated under its rated operating conditions.
  id: 5.06-eng
  language_code: eng
  notes:
  - content: The limiting conditions for storage, transport and operation may be different.
  - content: >-
      The limiting conditions generally specify limiting values of the measurand
      and of the influence quantities.
  terms:
  - type: expression
    normative_status: preferred
    designation: limiting conditions
