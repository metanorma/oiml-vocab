data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      Conditions extrêmes qu'un instrument de mesure peut supporter sans dommage
      et sans dégradation de ses caractéristiques métrologiques lorsqu'il est
      ensuite utilisé dans ses conditions assignées de fonctionnement.
  id: 5.06-fra
  language_code: fra
  notes:
  - content: >-
      Les conditions limites peuvent être différentes pour le stockage, le transport
      et le fonctionnement.
  - content: >-
      Les conditions limites spécifient généralement des valeurs limites pour
      la grandeur à mesurer et pour les grandeurs d'influence.
  terms:
  - type: expression
    normative_status: preferred
    designation: conditions limites
    grammar_info:
    - gender: f
