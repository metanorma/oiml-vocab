data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      A value of a quantity which, for a given purpose, may be substituted for the
      true value.
  id: 1.19-eng
  language_code: eng
  notes:
  - content: >-
      A conventional true value is, in general, regarded as sufficiently close to
      the true value for the difference to be insignificant for the given purpose.
  examples:
  - content: >-
      within an organization, the value assigned to a reference standard may be
      taken as the conventional true value of the quantity realized by the standard.
  terms:
  - type: expression
    normative_status: preferred
    designation: conventional true value (of a quantity)
date_accepted: '1984-01-01T00:00:00+00:00'
entry_status: valid
id: a587769b-a30e-4938-b61f-2680797a20ea
