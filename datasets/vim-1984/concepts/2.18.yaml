data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      Méthode de mesure dans laquelle la grandeur à mesurer est remplacée par une
      grandeur de même nature, de valeur connue, choisie de telle manière que les
      effets sur le dispositif indicateur soient les mêmes.
  id: 2.18-fra
  language_code: fra
  examples:
  - content: >-
      détermination d'une masse au moyen d'une balance et de masses marquées connues,
      par la méthode de substitution de Borda.
  terms:
  - type: expression
    normative_status: preferred
    designation: méthode de mesure par substitution
    grammar_info:
    - gender: f
date_accepted: '1984-01-01T00:00:00+00:00'
entry_status: valid
