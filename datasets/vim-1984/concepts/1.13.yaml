data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      A derived unit of measurement which is expressed in terms of base units by
      a formula in which the proportionality factor is 1.
  id: 1.13-eng
  language_code: eng
  notes:
  - content: >-
      This term is an abbreviation of the more exact denomination "derived unit
      of measurement in a coherent system of units", for, with an isolated unit,
      the concept of coherence is meaningless.
  examples:
  - content: >-
      the newton is the coherent unit of force in the SI: 1 N = 1 kg·m·s^-2.
  terms:
  - type: expression
    normative_status: preferred
    designation: coherent unit (of measurement)
date_accepted: '1984-01-01T00:00:00+00:00'
entry_status: valid
