data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: The value of a measurand provided by a measuring instrument.
  id: 3.02-eng
  language_code: eng
  notes:
  - content: >-
      The indication is expressed in units of the measurand, regardless of the
      units marked on the scale. What appears on the scale (sometimes called direct
      indication, direct reading or scale value) has to be multiplied by the instrument
      constant to provide the indication.
  - content: For a material measure, the indication is its nominal or marked value.
  - content: >-
      The meaning of the term "indication" is sometimes extended to cover what is
      recorded by a recording instrument, or the measurement signal within a measuring
      system.
  terms:
  - type: expression
    normative_status: preferred
    designation: indication (of a measuring instrument)
date_accepted: '1984-01-01T00:00:00+00:00'
