data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: Valeur d'une grandeur mesurée fournie par un instrument de mesure.
  id: 3.02-fra
  language_code: fra
  notes:
  - content: >-
      L'indication est exprimée en unité de la grandeur mesurée, quelle que soit
      l'unité marquée sur l'échelle. Ce qui apparaît sur l'échelle (parfois appelé
      indication directe ou valeur d'échelle) doit être multiplié par la constante
      de l'instrument pour obtenir l'indication.
  - content: "Pour une mesure matérialisée, l'indication est sa valeur nominale ou sa valeur marquée."
  - content: >-
      La signification du terme « indication » s'étend parfois à ce qui est enregistré
      par un enregistreur ou au signal de mesure dans un système de mesure.
  terms:
  - type: expression
    normative_status: preferred
    designation: indication (d'un instrument de mesure)
    grammar_info:
    - gender: f
date_accepted: '1984-01-01T00:00:00+00:00'
entry_status: valid
id: 21378c7b-62c4-4d7c-a4dc-58d882bd709d
