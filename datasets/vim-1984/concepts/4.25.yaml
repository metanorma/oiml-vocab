    type: accepted
  definition:
  - content: >-
      A scale in which each scale spacing is related to the corresponding scale
      interval by a coefficient of proportionality which is constant throughout
      the scale.
  id: 4.25-eng
  language_code: eng
  notes:
  - content: A linear scale having constant scale intervals is called a regular scale.
  terms:
  - type: expression
    normative_status: preferred
    designation: linear scale
