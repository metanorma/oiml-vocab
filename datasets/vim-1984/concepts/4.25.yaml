data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      Échelle dans laquelle la longueur et la valeur de chaque division sont reliées
      par un coefficient de proportionnalité constant le long de l'échelle.
  id: 4.25-fra
  language_code: fra
  notes:
  - content: >-
      Une échelle linéaire dont les valeurs de division sont constantes est appelée
      échelle régulière.
  terms:
  - type: expression
    normative_status: preferred
    designation: échelle linéaire
    grammar_info:
    - gender: f
