data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      A quantity in the expression of which the exponents of the base quantities,
      in a given system, are zero.
  id: 1.05-eng
  language_code: eng
  examples:
  - content: >-
      linear strain, coefficient of friction, refractive index are dimensionless
      quantities in the system of quantities l, m, t.
  terms:
  - type: expression
    normative_status: preferred
    designation: dimensionless quantity
date_accepted: '1984-01-01T00:00:00+00:00'
