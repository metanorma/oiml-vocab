data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      A line or other mark on an indicating device corresponding to one or more
      defined values of a measurand.
  id: 4.17-eng
  language_code: eng
  notes:
  - content: >-
      For digital and semi-digital indications, the numbers themselves are equivalent
      to scale marks.
  - content: >-
      The term gauge mark is often used in cases where only one or a few marks
      are involved.
  terms:
  - type: expression
    normative_status: preferred
    designation: scale mark
date_accepted: '1984-01-01T00:00:00+00:00'
