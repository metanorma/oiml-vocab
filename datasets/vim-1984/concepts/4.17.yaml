data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      Trait ou autre signe porté par un dispositif indicateur et correspondant
      à une ou plusieurs valeurs déterminées d'une grandeur à mesurer.
  id: 4.17-fra
  language_code: fra
  notes:
  - content: >-
      Pour les affichages numériques et semi-numériques, les nombres eux-mêmes
      sont équivalents à des repères.
  - content: (applicable uniquement au texte anglais)
  terms:
  - type: expression
    normative_status: preferred
    designation: repère
    grammar_info:
    - gender: m
