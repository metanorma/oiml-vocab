  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      Unité de mesure d'une grandeur dérivée dans un système donné de grandeurs.
  id: 1.12-fra
  language_code: fra
  notes:
  - content: >-
      Dans un système donné d'unités, une unité dérivée peut être exprimée en fonction
      d'unités de base et de facteurs de proportionnalité.
  - content: >-
      Pour certaines unités dérivées, il existe des noms et des symboles spéciaux
      ; par exemple dans le SI : newton (N), unité de force ; joule (J), unité d'énergie
      ; volt (V), unité de potentiel électrique.
  terms:
  - type: expression
    normative_status: preferred
    designation: "unité (de mesure) dérivée"
    grammar_info:
    - gender: f
