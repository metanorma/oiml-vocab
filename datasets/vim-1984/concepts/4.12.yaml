data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      Pour un appareil de mesure, ensemble des composants qui affiche la valeur
      d'une grandeur mesurée ou une valeur qui lui est reliée.
  id: 4.12-fra
  language_code: fra
  notes:
  - content: >-
      Le terme peut inclure le dispositif d'affichage ou de réglage d'une mesure
      matérialisée, par exemple, d'un générateur de signaux.
  - content: >-
      Un dispositif indicateur analogique fournit un affichage analogique ; un
      dispositif indicateur numérique fournit un affichage numérique.
  - content: >-
      Une forme de présentation des indications, soit au moyen d'un affichage numérique
      dans lequel le chiffre le moins significatif se déplace continuellement,
      permettant ainsi l'interpolation, soit au moyen d'un affichage numérique
      complété par une échelle et un index, est appelée affichage semi-numérique.
  - content: (applicable uniquement au texte anglais)
  terms:
  - type: expression
    normative_status: preferred
    designation: dispositif indicateur
    grammar_info:
    - gender: m
date_accepted: '1984-01-01T00:00:00+00:00'
entry_status: valid
