data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      For a measuring instrument, the set of components which displays the value
      of a measurand or a related value.
  id: 4.12-eng
  language_code: eng
  notes:
  - content: >-
      The term may include the indicating means or setting device of a material
      measure, for example, of a signal generator.
  - content: >-
      An analogue indicating device provides an analogue indication; a digital
      indicating device provides a digital indication.
  - content: >-
      A form of presentation of the indications either by means of a digital indication
      in which the least significant digit moves continuously thus permitting interpolation,
      or by means of a digital indication supplemented by a scale and index, is
      called a semidigital indication.
  - content: >-
      The English term readout device is used as a general descriptor of the means
      whereby the response of a measuring instrument is made available.
  terms:
  - type: expression
    normative_status: preferred
    designation: indicating device
date_accepted: '1984-01-01T00:00:00+00:00'
entry_status: valid
id: 33e23e3d-cecd-4b7a-8ee1-d0fa242a3aea
