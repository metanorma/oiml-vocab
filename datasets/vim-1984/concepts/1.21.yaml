data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      For a given quantity or property, a series of values determined in a defined
      manner and adopted by convention.
  id: 1.21-eng
  language_code: eng
  examples:
  - content: >-
      a) the International Practical Temperature Scale based on the freezing and
      boiling points of a series of specified pure substances and on the use of
      specified measuring instruments and interpolation formulae;
  - content: b) the Mohs hardness scale based on the hardnesses of a series of specified minerals;
  - content: c) the Richter earthquake scale.
  terms:
  - type: expression
    normative_status: preferred
    designation: reference-value scale (of a quantity or property)
date_accepted: '1984-01-01T00:00:00+00:00'
entry_status: valid
