data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      Méthode de mesure dans laquelle la valeur de la grandeur à mesurer est déterminée
      par équilibrage en ajustant une ou plusieurs grandeurs, de valeurs connues,
      reliées à la grandeur à mesurer par une relation connue à l'équilibre.
  id: 2.20-fra
  language_code: fra
  notes:
  - content: La grandeur à mesurer et les grandeurs ajustées peuvent être de nature différente.
  examples:
  - content: mesurage d'une impédance électrique avec un pont et un indicateur de zéro.
  terms:
  - type: expression
    normative_status: preferred
    designation: méthode de (mesure par) zéro
    grammar_info:
    - gender: f
date_accepted: '1984-01-01T00:00:00+00:00'
