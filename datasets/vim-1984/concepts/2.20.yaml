  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      A method of measurement in which the value of the measurand is determined
      by balancing, adjusting one or more quantities, of known values, to which
      the measurand has a known relationship at balance.
  id: 2.20-eng
  language_code: eng
  notes:
  - content: The measurand and the adjusted quantities may be of different kinds.
  examples:
  - content: measurement of an electrical impedance by means of a bridge circuit and a null detector.
  terms:
  - type: expression
    normative_status: preferred
    designation: null method of measurement
date_accepted: '1984-01-01T00:00:00+00:00'
entry_status: valid
