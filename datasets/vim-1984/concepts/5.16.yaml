    type: accepted
  definition:
  - content: The ability of a measuring instrument to maintain constant its metrological characteristics.
  id: 5.16-eng
  language_code: eng
  notes:
  - content: >-
      It is usual to consider stability with respect to time. Where stability with
      respect to another quantity is considered, this should be stated explicitly.
  terms:
  - type: expression
    normative_status: preferred
    designation: stability
