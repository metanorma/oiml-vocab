data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      The closeness of the agreement between the results of successive measurements
      of the same measurand carried out subject to all of the following conditions:
      the same method of measurement, the same observer, the same measuring instrument,
      the same location, the same conditions of use, repetition over a short period
      of time.
  id: 3.06-eng
  language_code: eng
  notes:
  - content: Repeatability may be expressed quantitatively in terms of the dispersion of the results.
  terms:
  - type: expression
    normative_status: preferred
    designation: repeatability of measurements
date_accepted: '1984-01-01T00:00:00+00:00'
entry_status: valid
