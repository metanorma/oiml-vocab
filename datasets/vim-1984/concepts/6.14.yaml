    type: accepted
  definition:
  - content: >-
      Toutes les opérations nécessaires à la préservation des caractéristiques
      métrologiques d'un étalon dans des limites convenables.
  id: 6.14-fra
  language_code: fra
  notes:
  - content: >-
      Les opérations comprennent habituellement un étalonnage régulier, un stockage
      dans de bonnes conditions et une utilisation soigneuse.
