  definition:
  - content: >-
      All the operations necessary to preserve the metrological characteristics
      of a measurement standard within appropriate limits.
  id: 6.14-eng
  language_code: eng
  notes:
  - content: >-
      The operations commonly include regular calibration storage under good conditions
      and care in use.
  terms:
  - type: expression
    normative_status: preferred
    designation: conservation of a measurement standard
