  definition:
  - content: >-
      The set of values of a measurand for which the error of a measuring instrument
      is intended to lie within specified limits.
  id: 5.04-eng
  language_code: eng
  notes:
  - content: >-
      The upper and lower limits of the specified measuring range are sometimes
      called the maximum capacity and minimum capacity respectively.
  terms:
  - type: expression
    normative_status: preferred
    designation: specified measuring range
  - type: expression
    normative_status: admitted
    designation: specified working range
