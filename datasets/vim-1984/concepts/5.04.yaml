data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      Ensemble des valeurs d'une grandeur à mesurer pour lesquelles l'erreur d'un
      instrument de mesure est supposée maintenue entre des limites spécifiées.
  id: 5.04-fra
  language_code: fra
  notes:
  - content: >-
      Les limites supérieure et inférieure de l'étendue de mesure spécifiée sont
      parfois appelées respectivement portée maximale et portée minimale.
  terms:
  - type: expression
    normative_status: preferred
    designation: étendue de mesure spécifiée
