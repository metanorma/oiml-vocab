data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      Aptitude d'un instrument de mesure à donner, dans des conditions d'utilisation
      définies, des réponses très voisines lors de l'application répétée d'un même
      signal d'entrée.
  id: 5.31-fra
  language_code: fra
  notes:
  - content: >-
      Les conditions d'utilisation définies sont habituellement les suivantes :
      répétition sur une courte période de temps, utilisation au même lieu dans
      des conditions ambiantes constantes, réduction au minimum des variations
      dues à l'observateur.
  terms:
  - type: expression
    normative_status: preferred
    designation: "fidélité (d'un instrument de mesure)"
    grammar_info:
    - gender: f
date_accepted: '1984-01-01T00:00:00+00:00'
