data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      The ability of a measuring instrument to give, under defined conditions of
      use, closely similar responses for repeated applications of the same stimulus.
  id: 5.31-eng
  language_code: eng
  notes:
  - content: >-
      The defined conditions of use are usually as follows: repetition over a short
      period of time, use at the same location under constant ambient conditions,
      reduction to a minimum of the variations due to the observer.
  terms:
  - type: expression
    normative_status: preferred
    designation: repeatability (of a measuring instrument)
  - type: expression
    normative_status: admitted
    designation: fidelity
date_accepted: '1984-01-01T00:00:00+00:00'
entry_status: valid
