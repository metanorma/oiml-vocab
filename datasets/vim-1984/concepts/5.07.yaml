    type: accepted
  definition:
  - content: >-
      Conditions d'utilisation d'un instrument de mesure prescrites pour des essais
      de fonctionnement ou pour assurer valablement la comparaison de résultats
      de mesure entre eux.
  id: 5.07-fra
  language_code: fra
  notes:
  - content: >-
      Les conditions de référence spécifient généralement des valeurs de référence
      ou des étendues de référence pour les grandeurs d'influence affectant un
      instrument de mesure.
  terms:
  - type: expression
    normative_status: preferred
    designation: conditions de référence
