    type: accepted
  definition:
  - content: Totalité des informations, équipements et opérations relatifs à un mesurage donné.
  id: 2.08-fra
  language_code: fra
  notes:
  - content: >-
      Ce concept recouvre tous les aspects relatifs à l'exécution et à la qualité
      du mesurage ; il comprend par exemple le principe, la méthode, le mode opératoire,
      les valeurs des grandeurs d'influence et les étalons.
  terms:
  - type: expression
    normative_status: preferred
    designation: processus de mesure
    grammar_info:
    - gender: m
