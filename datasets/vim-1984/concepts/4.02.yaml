data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      Dispositif destiné à reproduire ou à fournir, d'une façon permanente pendant
      son emploi, une ou plusieurs valeurs connues d'une grandeur donnée.
  id: 4.02-fra
  language_code: fra
  notes:
  - content: Cette grandeur peut être appelée grandeur fournie.
  examples:
  - content: >-
      masse marquée ; mesure de capacité (à une ou plusieurs valeurs, avec ou sans
      échelle) ; résistance électrique ; cale étalon ; générateur de signaux étalons.
  terms:
  - type: expression
    normative_status: preferred
    designation: mesure matérialisée
    grammar_info:
    - gender: f
date_accepted: '1984-01-01T00:00:00+00:00'
