data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      A device intended to reproduce or supply, in a permanent manner during its
      use, one or more known values of a given quantity.
  id: 4.02-eng
  language_code: eng
  notes:
  - content: The quantity concerned may be called the supplied quantity.
  examples:
  - content: >-
      a weight; a measure of volume (of one or several values, with or without
      a scale); an electrical resistor; a gauge block; a standard signal generator.
  terms:
  - type: expression
    normative_status: preferred
    designation: material measure
date_accepted: '1984-01-01T00:00:00+00:00'
entry_status: valid
