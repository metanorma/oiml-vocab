  definition:
  - content: The result of a measurement before correction for assumed systematic errors.
  id: 3.03-eng
  language_code: eng
  notes:
  - content: >-
      If only a single indication is involved, the uncorrected result is identical
      to the indication.
  - content: >-
      In English, uncorrected result was formerly referred to as indicated value.
  terms:
  - type: expression
    normative_status: preferred
    designation: uncorrected result
