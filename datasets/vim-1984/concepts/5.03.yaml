data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      A value used to designate a characteristic of a device or to give a guide
      to its intended use.
  id: 5.03-eng
  language_code: eng
  notes:
  - content: >-
      The nominal value may be a rounded value of the characteristic concerned
      and is often an approximate value of the quantity realized by a standard.
  examples:
  - content: a) the value marked on a standard resistor;
  - content: >-
      b) the value of 1 mol/l designating an acid solution of H+ ion amount-of-substance
      concentration of 0,998 mol/l.
  terms:
  - type: expression
    normative_status: preferred
    designation: nominal value
date_accepted: '1984-01-01T00:00:00+00:00'
entry_status: valid
