data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      Valeur utilisée pour désigner une caractéristique d'un dispositif ou pour
      guider dans son utilisation prévue.
  id: 5.03-fra
  language_code: fra
  notes:
  - content: >-
      La valeur nominale peut être une valeur arrondie de la caractéristique concernée
      et est souvent une valeur approximative de la grandeur réalisée par un étalon.
  examples:
  - content: a) la valeur marquée sur une résistance étalon;
  - content: >-
      b) la valeur de 1 mol/l désignant une solution acide de concentration en
      quantité de matière en ions H+ de 0,998 mol/l.
  terms:
  - type: expression
    normative_status: preferred
    designation: valeur nominale
    grammar_info:
    - gender: f
date_accepted: '1984-01-01T00:00:00+00:00'
entry_status: valid
