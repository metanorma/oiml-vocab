data:
  dates:
  - date: '1984-01-01T00:00:00+00:00'
    type: accepted
  definition:
  - content: >-
      The property of a measuring instrument whereby its response to a given stimulus
      depends on the sequence of preceding stimuli.
  id: 5.15-eng
  language_code: eng
  notes:
  - content: >-
      Although hysteresis is normally considered in relation to the measurand,
      it may also be considered in relation to influence quantities.
  terms:
  - type: expression
    normative_status: preferred
    designation: hysteresis
