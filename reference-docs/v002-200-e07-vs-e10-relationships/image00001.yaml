    runs: [1, 2]
  - members: ['1.20', '1.25']
    runs: [1]
  - members: ['1.9', '1.23']
    runs: [1]
  - members: ['1.4', '1.5']
    runs: [2]
  - members: ['1.1', '1.27']
  - members: ['1.26', '1.28']
  - members: [ext_quantity_expressed_by_a_measurement_unit, '1.7']
  # (b) Hierarchical — straight line: broader → narrower.
  #     Trailing `...` in narrower = unlisted others on diagram.

  hierarchical:
  - broader: ext_property
    narrower: ['1.30', '1.1']
    runs: [1, 2]
  - broader: '1.1'
    narrower: ['1.26', ext_quantity_expressed_by_a_measurement_unit]
