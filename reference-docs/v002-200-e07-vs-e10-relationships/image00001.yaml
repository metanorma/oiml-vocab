    runs: [2]
  - broader: ext_quantity_expressed_by_a_measurement_unit
    narrower: ['1.8', ...]
  - broader: ext_quantity_expressed_by_a_measurement_unit
    narrower: ['1.9', ...]
  - broader: ext_quantity_expressed_by_a_measurement_unit
    narrower: ['1.4', '1.5']

