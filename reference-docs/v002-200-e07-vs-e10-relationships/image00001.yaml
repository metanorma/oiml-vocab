# Nodes (id → designation). 'ext_' prefix = external (in parens on diagram).
nodes:
  ext_kind_of_property: kind of property
  ext_property: property
  ext_quantity_expressed_by_a_measurement_unit: quantity expressed by a measurement unit
  ext_reference: reference
  '1.1': quantity
  '1.19': quantity value
  '1.2': kind of quantity
  '1.20': numerical quantity value
  '1.21': quantity calculus
  '1.22': Quantity equation
  '1.23': unit equation
  '1.25': numerical value equation
  '1.26': ordinal quantity
  '1.27': quantity-value scale
  '1.28': ordinal quantity-value scale
  '1.29': conventional reference scale
  '1.3': system of quantities
  '1.30': nominal property
  '1.4': base quantity
  '1.5': derived quantity
  '1.6': International System of Quantities
  '1.7': quantity dimension
  '1.8': quantity of dimension one
  '1.9': measurement unit (see Fig. A.2
  '2.10': measured quantity value
  '2.11': true quantity value
  '2.12': conventional quantity value
  '2.6': measurement procedure
  '5.1': measurement standard

relationships:
  # (a) Associative — arrowed line, bidirectional.
  #     Compact form: [a, b].
  associative:
  - members: ['1.1', '1.19']
    runs: [1, 2]
  - members: ['1.1', '1.2']
    runs: [1, 2]
  - members: [ext_quantity_expressed_by_a_measurement_unit, '1.21']
    runs: [1, 2]
  - members: ['1.25', '1.22']
    runs: [1, 2]
  - members: ['1.26', '2.6']
    runs: [1, 2]
  - members: ['1.3', '1.7']
    runs: [1, 2]
