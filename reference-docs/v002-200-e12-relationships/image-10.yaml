# Nodes (id → designation). 'ext_' prefix = external (in parens on diagram).
nodes:
  ext_element_of_a_measuring_system: element of a measuring system
  ext_measuring_device: measuring device
  ext_output_element_of_a_measuring_system: output element of a measuring system
  ext_signal: signal
  '2.1': measurement
  '2.10': measured quantity value (see Fig. A.8)
  '3.1': measuring instrument
  '3.10': measuring chain
  '3.11': adjustment of a measuring system
  '3.12': zero adjustment of a measuring system
  '3.2': measuring system
  '3.3': indicating measuring instrument
  '3.4': displaying measuring instrument
  '3.5': scale of a displaying measuring instrument
  '3.6': material measure
  '3.7': measuring transducer
  '3.8': sensor
  '3.9': detector
  '4.1': indication (see also Fig. A.8 and Fig. A.10
  '5.9': transfer device

relationships:
  # (a) Associative — arrowed line, bidirectional.
  #     Compact form: [a, b].
  associative:
  - members: ['2.10', '3.2']
    runs: [1, 2]
    status: confirmed
  - members: ['4.1', '3.1']
    runs: [1, 2]
    status: confirmed
  - members: ['3.8', '3.10']
    runs: [1, 2]
    status: confirmed
  - members: ['3.10', ext_signal]
    runs: [1, 2]
    status: confirmed
  - members: ['3.11', '3.2']
    runs: [1, 2]
    status: confirmed
  - members: ['3.11', '4.1']
    runs: [1, 2]
    status: confirmed
  - members: ['3.2', '4.1']
    runs: [1, 2]
    status: confirmed
  - members: ['2.1', '3.1']
    runs: [2]
    status: confirmed
  - members: ['3.2', ext_output_element_of_a_measuring_system]
    runs: [2]
  - members: ['3.10', ext_output_element_of_a_measuring_system]

  # (b) Hierarchical — straight line: broader → narrower.
  #     Trailing `...` in narrower = unlisted others on diagram.
  hierarchical:
  - broader: '3.11'
    narrower: ['3.12', ...]
    runs: [1, 2]
  - broader: '3.1'
    narrower: ['3.3', '3.6', ...]
    runs: [2]
  - broader: '3.3'
    narrower: ['3.4', ...]
    runs: [1]
  - broader: ext_element_of_a_measuring_system
    narrower: ['3.8', ...]
    runs: [2]
  - broader: ext_measuring_device
    narrower: ['3.1', '5.9', '3.9', '3.7']
    runs: [2]

  # (c) Partitive — bracket rake: comprehensive → parts.
  partitive:
  - comprehensive: '3.4'
    parts: ['3.5']
    runs: [1, 2]

  # (d) Partitive-plural — bracket rake with [double] and/or [dashed] markers.
  #     INDEPENDENT HYPEREDGE — see schema.
  partitive_plural:
  - comprehensive: '3.2'
    parts: [ext_measuring_device, '3.1']
    markers: [double, dashed]
    runs: [1]
  - comprehensive: '3.2'
    parts: [ext_element_of_a_measuring_system]
    markers: [dashed]
    runs: [1]
  - comprehensive: '3.10'
    parts: [ext_element_of_a_measuring_system]
    markers: [double]
    runs: [2]
